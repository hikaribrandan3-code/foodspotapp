<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Budoni: El Tostador</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>



    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@500;700&display=swap');



        :root {

            --cream-bg: #F7E8D0;

            --warm-brown: #8D5E32;

            --dark-brown: #4A2E15;

            --bread-gold: #EDBA5E;

            --burnt-red: #C03A2B;

            --button-face: #F3D79B;

        }



        body {

            margin: 0;

            height: 100vh;

            height: 100dvh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: space-between;

            background-color: var(--cream-bg);

            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");

            color: var(--dark-brown);

            font-family: 'DM Sans', sans-serif;

            overflow: hidden;

            touch-action: none;

            padding: 0 10%;

            padding-bottom: env(safe-area-inset-bottom);

            box-sizing: border-box;

            position: fixed;

            top: 0;

            left: 0;

            right: 0;

            bottom: 0;

        }



        .exit-btn {

            position: absolute;

            top: 16px;

            left: 16px;

            width: 40px;

            height: 40px;

            border-radius: 50%;

            background: rgba(74, 46, 21, 0.1);

            border: none;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            color: var(--dark-brown);

            z-index: 100;

            -webkit-tap-highlight-color: transparent;

        }



        .exit-btn:active {

            background: rgba(74, 46, 21, 0.2);

        }



        header {

            text-align: center;

            margin-top: 30px;

            z-index: 2;

        }



        h1 {

            font-family: 'DM Serif Display', serif;

            font-size: 3.5rem;

            margin: 0;

            color: var(--dark-brown);

            line-height: 1;

        }



        p.subtitle {

            font-size: 1.1rem;

            margin-top: 5px;

            color: var(--warm-brown);

            font-weight: 500;

        }



        /* Stats Bar */

        .stats-bar {

            display: flex;

            gap: 15px;

            margin-top: 15px;

            justify-content: center;

            font-weight: 700;

            font-size: 0.9rem;

            opacity: 0.9;

        }



        .stat-pill {

            background: rgba(141, 94, 50, 0.1);

            padding: 5px 15px;

            border-radius: 20px;

            color: var(--dark-brown);

        }



        #game-container {

            position: relative;

            width: 280px;

            height: 280px;

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 2;

            flex-shrink: 0;

            margin-top: 20px;

        }



        canvas {

            border-radius: 50%;

            box-shadow: 0 10px 30px rgba(74, 46, 21, 0.2);

            filter: sepia(0.2);

            transition: transform 0.1s;

        }



        /* Shake Animation Class */

        .shake {

            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;

        }



        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-4px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(6px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-8px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(8px, 0, 0);
            }

        }



        .controls-area {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            margin-bottom: 40px;

            z-index: 10;

        }



        .action-button {

            background: var(--button-face);

            color: var(--dark-brown);

            border: 2px solid var(--warm-brown);

            padding: 12px 14px;

            font-size: 1.1rem;

            border-radius: 50px;

            font-family: 'DM Serif Display', serif;

            cursor: pointer;

            box-shadow: 0 5px 0px var(--warm-brown);

            transition: all 0.1s ease;

            width: 65%;

            max-width: 200px;

            text-align: center;

            user-select: none;

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;
            /* Instant click response */

        }



        .action-button:active {

            transform: translateY(4px);

            box-shadow: 0 4px 0px var(--warm-brown);

        }



        /* Share UI - Hidden by default */

        .share-ui {

            display: none;

            flex-direction: column;

            align-items: center;

            gap: 10px;

            margin-top: 20px;

            width: 100%;

        }



        .btn-share {

            background: transparent;

            color: var(--dark-brown);

            border: 2px solid var(--dark-brown);

            padding: 12px 24px;

            border-radius: 30px;

            font-weight: bold;

            font-family: 'DM Sans', sans-serif;

            font-size: 1rem;

            cursor: pointer;

            display: flex;

            align-items: center;

            gap: 8px;

            transition: background 0.2s;

            -webkit-tap-highlight-color: transparent;

        }



        .btn-share:hover {

            background: rgba(74, 46, 21, 0.05);

        }



        .btn-share:active {

            background: rgba(74, 46, 21, 0.1);

        }



        /* Toast Notification */

        #toast {

            visibility: hidden;

            min-width: 200px;

            background-color: #333;

            color: #fff;

            text-align: center;

            border-radius: 50px;

            padding: 12px;

            position: fixed;

            z-index: 100;

            bottom: 30px;

            font-size: 0.9rem;

            opacity: 0;

            transition: opacity 0.3s;

        }



        #toast.show {

            visibility: visible;

            opacity: 1;

        }
    </style>

</head>

<body>



    <button class="exit-btn" onclick="window.top.location.href='/'">✕</button>



    <header>

        <h1>Budoni</h1>

        <p class="subtitle">Tu panadería de confianza</p>



        <div class="stats-bar">

            <div class="stat-pill">RACHA: <span id="streakDisplay">0</span></div>

            <div class="stat-pill">RÉCORD: <span id="highScoreDisplay">0</span></div>

        </div>

    </header>



    <div id="game-container">

        <canvas id="timerCanvas" width="280" height="280"></canvas>

    </div>



    <div class="controls-area">

        <div id="mainButton" class="action-button">¡A Tostear!</div>



        <div id="shareUI" class="share-ui">

            <button class="btn-share" id="shareBtn" onclick="handleShare()">

                <span>📤</span> Compartir mi puntaje

            </button>

        </div>

    </div>



    <div id="toast">Texto copiado</div>



    <script>

        const canvas = document.getElementById('timerCanvas');

        const ctx = canvas.getContext('2d');

        const button = document.getElementById('mainButton');

        const headerTitle = document.querySelector('h1');

        const streakDisplay = document.getElementById('streakDisplay');

        const highScoreDisplay = document.getElementById('highScoreDisplay');

        const shareUI = document.getElementById('shareUI');

        const shareBtn = document.getElementById('shareBtn');

        const gameContainer = document.getElementById('game-container');

        const toast = document.getElementById('toast');



        // --- GAME STATE & CONFIG ---

        let state = {

            status: 'IDLE', // IDLE, RUNNING, WON, LOST

            startTime: 0,

            currentRotation: 0,

            streak: 0,

            highScore: localStorage.getItem('budoni_high') || 0,

            duration: 3500, // Starts at 3.5s, gets faster

            targetStart: 0.8, // Randomized per round

            animationId: null,

            tickId: null // ID for the ticking sound interval

        };



        // Initialize UI

        highScoreDisplay.textContent = state.highScore;



        const CONSTANTS = {

            CENTER_X: 140,

            CENTER_Y: 140,

            RADIUS: 135,

            TARGET_WIDTH: 1 / 60 // Width of exactly one notch

        };



        // --- AUDIO SYSTEM ---

        const AudioContext = window.AudioContext || window.webkitAudioContext;

        const audioCtx = new AudioContext();



        function playSound(type) {

            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();

            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);

            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;



            if (type === 'WIN') {

                // Ding!

                osc.type = 'sine';

                osc.frequency.setValueAtTime(800, now);

                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);

                gainNode.gain.setValueAtTime(0.4, now);

                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                osc.start(now);

                osc.stop(now + 0.4);

            } else if (type === 'LOSE') {

                // Buzz / Error

                osc.type = 'sawtooth';

                osc.frequency.setValueAtTime(150, now);

                osc.frequency.linearRampToValueAtTime(100, now + 0.3);

                gainNode.gain.setValueAtTime(0.4, now);

                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);

                osc.start(now);

                osc.stop(now + 0.3);

            } else if (type === 'TICK') {

                // Mechanical Tick

                osc.type = 'square'; // Clickier

                osc.frequency.setValueAtTime(1200, now);

                gainNode.gain.setValueAtTime(0.05, now); // Quiet

                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

                osc.start(now);

                osc.stop(now + 0.03);

            }

        }



        // --- VISUALS ---

        const colors = {

            bg: '#FCEFE0',

            dial: '#E6D0B3',

            notch: '#BCAAA4',

            majorNotch: '#8D5E32',

            indicator: '#8D5E32',

            targetRed: '#C03A2B',

            breadRaw: '#FBE6C9',

            breadBaked: '#EDBA5E',

            breadBurnt: '#5D4037'

        };



        function drawOvenBackground() {

            ctx.beginPath();

            ctx.arc(CONSTANTS.CENTER_X, CONSTANTS.CENTER_Y, CONSTANTS.RADIUS, 0, Math.PI * 2);

            ctx.fillStyle = colors.bg;

            ctx.fill();



            // 60 NOTCHES

            ctx.save();

            ctx.translate(CONSTANTS.CENTER_X, CONSTANTS.CENTER_Y);

            ctx.lineWidth = 2;



            for (let i = 0; i < 60; i++) {

                ctx.beginPath();

                ctx.moveTo(CONSTANTS.RADIUS - 2, 0);

                const isMajor = (i % 5 === 0);

                const tickLength = isMajor ? 18 : 8;

                ctx.strokeStyle = isMajor ? colors.majorNotch : colors.notch;

                ctx.lineWidth = isMajor ? 3 : 2;

                ctx.lineTo(CONSTANTS.RADIUS - tickLength, 0);

                ctx.stroke();

                ctx.rotate(Math.PI / 30);

            }

            ctx.restore();



            ctx.beginPath();

            ctx.arc(CONSTANTS.CENTER_X, CONSTANTS.CENTER_Y, CONSTANTS.RADIUS, 0, Math.PI * 2);

            ctx.lineWidth = 8;

            ctx.strokeStyle = colors.dial;

            ctx.stroke();



            // Inner decorative circle

            ctx.beginPath();

            ctx.arc(CONSTANTS.CENTER_X, CONSTANTS.CENTER_Y, CONSTANTS.RADIUS * 0.55, 0, Math.PI * 2);

            ctx.fillStyle = '#D9C0A3';

            ctx.fill();

            ctx.lineWidth = 4;

            ctx.strokeStyle = '#8D5E32';

            ctx.stroke();

        }



        function drawBread(status) {

            let breadColor = colors.breadRaw;

            if (status === 'WON') breadColor = colors.breadBaked;

            if (status === 'LOST') breadColor = colors.breadBurnt;



            ctx.save();

            ctx.translate(CONSTANTS.CENTER_X, CONSTANTS.CENTER_Y + 15);

            ctx.beginPath();

            ctx.moveTo(-35, 0);

            ctx.quadraticCurveTo(-35, -25, 0, -25);

            ctx.quadraticCurveTo(35, -25, 35, 0);

            ctx.quadraticCurveTo(35, 15, 0, 15);

            ctx.quadraticCurveTo(-35, 15, -35, 0);

            ctx.fillStyle = breadColor;

            ctx.fill();



            ctx.strokeStyle = 'rgba(74, 46, 21, 0.15)';

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.moveTo(-15, -12); ctx.lineTo(-8, 3);

            ctx.moveTo(5, -12); ctx.lineTo(12, 3);

            ctx.stroke();

            ctx.restore();

        }



        function drawTimerUI(rotationPct) {

            const startAngle = -Math.PI / 2;



            // Dynamic Target

            const targetStartAngle = startAngle + (state.targetStart * Math.PI * 2);

            const targetEndAngle = targetStartAngle + (CONSTANTS.TARGET_WIDTH * Math.PI * 2);



            ctx.beginPath();

            ctx.arc(CONSTANTS.CENTER_X, CONSTANTS.CENTER_Y, CONSTANTS.RADIUS - 10, targetStartAngle, targetEndAngle);

            ctx.lineWidth = 14;

            ctx.strokeStyle = colors.targetRed;

            ctx.lineCap = 'butt';

            ctx.stroke();



            // Needle

            const currentAngle = startAngle + (rotationPct * Math.PI * 2);

            const handLength = CONSTANTS.RADIUS - 15;

            const tipX = CONSTANTS.CENTER_X + Math.cos(currentAngle) * handLength;

            const tipY = CONSTANTS.CENTER_Y + Math.sin(currentAngle) * handLength;



            ctx.beginPath();

            ctx.moveTo(CONSTANTS.CENTER_X, CONSTANTS.CENTER_Y);

            ctx.lineTo(tipX, tipY);

            ctx.lineWidth = 7;

            ctx.strokeStyle = colors.indicator;

            ctx.lineCap = 'round';

            ctx.stroke();



            ctx.beginPath();

            ctx.arc(CONSTANTS.CENTER_X, CONSTANTS.CENTER_Y, 10, 0, Math.PI * 2);

            ctx.fillStyle = colors.indicator;

            ctx.fill();

        }



        // --- GAME LOGIC ---



        function randomizeRound() {

            // Random target between 15% and 90% of the circle

            state.targetStart = Math.random() * 0.75 + 0.15;

        }



        function gameLoop(timestamp) {

            if (state.status !== 'RUNNING') return;



            if (!state.startTime) state.startTime = timestamp;

            const elapsed = timestamp - state.startTime;

            state.currentRotation = elapsed / state.duration;



            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawOvenBackground();

            drawBread('RUNNING');

            drawTimerUI(Math.min(state.currentRotation, 1));



            if (state.currentRotation >= 1) {

                endGame(false); // Time out = Lose

            } else {

                state.animationId = requestAnimationFrame(gameLoop);

            }

        }



        function startGame() {

            if (audioCtx.state === 'suspended') audioCtx.resume();



            // If starting fresh (from Idle or Lost), reset speed/streak

            if (state.status === 'IDLE' || state.status === 'LOST') {

                state.streak = 0;

                state.duration = 3500;

                streakDisplay.textContent = "0";

            }



            randomizeRound();



            state.status = 'RUNNING';

            state.startTime = null;

            state.currentRotation = 0;



            // Visual Reset

            gameContainer.classList.remove('shake');

            button.style.display = 'block';

            button.textContent = "¡PARAR!";

            headerTitle.textContent = "Tostando...";

            shareUI.style.display = 'none';

            button.style.animation = "pulse 0.6s infinite alternate";



            // START GAME LOOP

            state.animationId = requestAnimationFrame(gameLoop);



            // START TICKING SOUND

            // Calculate tick rate based on speed. Faster game = Faster ticks.

            const tickRate = Math.max(80, state.duration / 15);

            state.tickId = setInterval(() => {

                playSound('TICK');

            }, tickRate);

        }



        function endGame(isManualStop) {

            cancelAnimationFrame(state.animationId);

            // STOP TICKING

            clearInterval(state.tickId);



            button.style.animation = "none";



            let win = false;

            if (isManualStop) {

                if (state.currentRotation >= state.targetStart &&

                    state.currentRotation <= (state.targetStart + CONSTANTS.TARGET_WIDTH)) {

                    win = true;

                }

            }



            if (win) {

                handleWin();

            } else {

                handleLoss();

            }



            // Draw final static frame

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawOvenBackground();

            drawBread(state.status);

            drawTimerUI(Math.min(state.currentRotation, 1));

        }



        function handleWin() {

            state.status = 'WON';

            playSound('WIN');



            state.streak++;

            streakDisplay.textContent = state.streak;



            if (state.streak > state.highScore) {

                state.highScore = state.streak;

                localStorage.setItem('budoni_high', state.highScore);

                highScoreDisplay.textContent = state.highScore;

            }



            state.duration = Math.max(1000, state.duration - 250);



            button.textContent = "¡Perfecto! Siguiente";

            headerTitle.textContent = "¡Qué rico!";



            // SHOW SHARE UI EVEN ON WIN

            shareUI.style.display = 'flex';

        }



        function handleLoss() {

            state.status = 'LOST';

            playSound('LOSE');



            gameContainer.classList.add('shake');

            headerTitle.textContent = "¡Ay Budoni!";



            if (state.currentRotation < state.targetStart) {

                button.textContent = "¡Crudo! Reintentar";

            } else {

                button.textContent = "¡Quemado! Reintentar";

            }



            // Show Share UI on Loss

            shareUI.style.display = 'flex';

        }



        // --- SHARE FUNCTIONALITY ---



        async function handleShare() {

            const text = `🔥 Hice ${state.streak} puntos en el mini juego de FoodSpot. ¿Podés superarme?`;

            const originalText = shareBtn.innerHTML;



            shareBtn.innerHTML = "📸 Generando...";



            try {

                // 1. Generate Screenshot

                const canvas = await html2canvas(document.body, {

                    backgroundColor: '#F7E8D0', // Force background color

                    scale: 1 // Don't make it too huge

                });



                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

                const file = new File([blob], 'budoni-score.png', { type: 'image/png' });



                // 2. Try Native Share with Image

                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {

                    await navigator.share({

                        text: text,

                        files: [file]

                    });

                }

                // 3. Fallback: Text Share

                else if (navigator.share) {

                    await navigator.share({

                        text: text,

                        url: window.location.href

                    });

                }

                // 4. Fallback: Clipboard

                else {

                    throw new Error("Share API not supported");

                }



            } catch (err) {

                // Copy to clipboard fallback

                navigator.clipboard.writeText(text);

                showToast("Texto copiado al portapapeles");

            } finally {

                shareBtn.innerHTML = originalText;

            }

        }



        function showToast(message) {

            toast.textContent = message;

            toast.className = "show";

            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);

        }



        // --- INPUT HANDLING ---



        function triggerAction(e) {

            if (e && e.cancelable) e.preventDefault();



            if (state.status === 'RUNNING') {

                endGame(true);

            } else if (state.status === 'IDLE' || state.status === 'WON' || state.status === 'LOST') {

                startGame();

            }

        }



        // "iPhone-feel" Touch Listener (Instant response)

        button.addEventListener('touchstart', triggerAction, { passive: false });

        button.addEventListener('mousedown', triggerAction);



        // Spacebar Support

        document.addEventListener('keydown', (e) => {

            if (e.code === 'Space') {

                e.preventDefault();

                triggerAction();

            }

        });



        // Initial Draw

        drawOvenBackground();

        drawBread('IDLE');

        drawTimerUI(0);



    </script>

    <style>
        @keyframes pulse {

            from {
                transform: scale(1);
                box-shadow: 0 8px 0px var(--warm-brown);
            }

            to {
                transform: scale(1.03);
                box-shadow: 0 12px 0px var(--warm-brown);
            }

        }
    </style>

</body>

</html>
