<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8B7355" />
  <meta name="description" content="Grub Club - Menú digital, pedidos y recompensas para tu café favorito" />

  <!-- ☢️ NUCLEAR CACHE BUSTER: Prevent Google App from caching stale bundles -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- 🔬 ERROR SNIFFER: Identify exact crash source -->
  <script>
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      console.log('🔴 --- CRASH DETECTED ---');
      console.log('Message:', msg);
      console.log('Location:', url, 'Line:', lineNo, 'Col:', columnNo);
      console.log('Error Object:', error);
      console.log('Stack:', error?.stack);
      // Don't suppress - let React Error Boundary catch it too
      return false;
    };
  </script>

  <!-- 🔇 STYLE MUTE BUTTON: Block invalid setProperty calls on /admin -->
  <script>
    (function () {
      const originalSetProperty = CSSStyleDeclaration.prototype.setProperty;
      CSSStyleDeclaration.prototype.setProperty = function (property, value, priority) {
        // Block invalid values on admin paths
        if (window.location.pathname.startsWith('/admin')) {
          if (value === undefined || value === null || value === 'undefined' || value === 'null' || value === '') {
            console.log('🔇 [MUTE] Blocked invalid style:', property, '=', value);
            return; // Physically cut off the style injector
          }
        }
        originalSetProperty.call(this, property, value, priority);
      };
    })();
  </script>

  <!-- 🛡️ GLOBAL OBJECT FIREWALL V3: Extended Proxy coverage for ALL possible globals -->
  <script>
    (function () {
      // Recursive proxy handler - any nested access returns a safe proxy
      function createSafeProxy() {
        return new Proxy({}, {
          get: function (target, prop) {
            // Return empty string for string-coercion
            if (prop === Symbol.toPrimitive || prop === 'toString' || prop === 'valueOf') {
              return function () { return ''; };
            }
            if (prop === Symbol.iterator) {
              return function* () { };
            }
            // Return another safe proxy for any property access
            return createSafeProxy();
          }
        });
      }

      // FULL COVERAGE: Apply to ALL possible global objects
      // Original suspects
      window.tenant = window.tenant || createSafeProxy();
      window.config = window.config || createSafeProxy();
      window.branding = window.branding || createSafeProxy();

      // Extended suspects (Task 2)
      window.theme = window.theme || createSafeProxy();
      window.lucide = window.lucide || createSafeProxy();
      window.user = window.user || createSafeProxy();
      window.auth = window.auth || createSafeProxy();
      window.supabaseConfig = window.supabaseConfig || createSafeProxy();
      window.appConfig = window.appConfig || createSafeProxy();
      window.store = window.store || createSafeProxy();
      window.state = window.state || createSafeProxy();

      // Style/Theme suspects (g[x] crash)
      window.styles = window.styles || createSafeProxy();
      window.customProperties = window.customProperties || createSafeProxy();
      window.cssVars = window.cssVars || createSafeProxy();
      window.themeColors = window.themeColors || createSafeProxy();

      window.__ADMIN_SANITIZED__ = false;
    })();
  </script>


  <!-- PWA & Icons -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/pwa-icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/pwa-icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/pwa-icons/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Grub Club</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
