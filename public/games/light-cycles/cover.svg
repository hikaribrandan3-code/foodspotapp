<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02070f"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="320" height="320" fill="none" stroke="#16f2e7" stroke-width="4"/>
  <!-- perspective floor grid -->
  <g stroke="#0e6e7a" stroke-width="1.5">
    <line x1="160" y1="130" x2="20" y2="320"/><line x1="160" y1="130" x2="90" y2="320"/>
    <line x1="160" y1="130" x2="160" y2="320"/><line x1="160" y1="130" x2="230" y2="320"/>
    <line x1="160" y1="130" x2="300" y2="320"/>
    <line x1="40" y1="180" x2="280" y2="180"/><line x1="10" y1="230" x2="310" y2="230"/><line x1="-20" y1="290" x2="340" y2="290"/>
  </g>
  <line x1="0" y1="130" x2="320" y2="130" stroke="#16f2e7" stroke-width="1" opacity=".6"/>
  <!-- enemy trails -->
  <path d="M 60 320 L 95 190 L 130 190" stroke="#e23fff" stroke-width="5" fill="none" opacity=".9"/>
  <path d="M 265 320 L 235 200" stroke="#ff8a1e" stroke-width="5" fill="none" opacity=".9"/>
  <!-- player cycle rear view -->
  <g>
    <ellipse cx="160" cy="268" rx="46" ry="10" fill="#16f2e7" opacity=".15"/>
    <circle cx="160" cy="240" r="26" fill="none" stroke="#16f2e7" stroke-width="6"/>
    <circle cx="160" cy="240" r="13" fill="#0a0a0e" stroke="#16f2e7" stroke-width="3"/>
    <path d="M 138 230 Q 136 190 160 184 Q 184 190 182 230" fill="#0c0c12" stroke="#16f2e7" stroke-width="3"/>
    <line x1="160" y1="186" x2="160" y2="228" stroke="#16f2e7" stroke-width="4"/>
  </g>
  <text x="160" y="48" font-family="Courier New, monospace" font-weight="bold" font-size="24" fill="#16f2e7" text-anchor="middle" letter-spacing="2">DAISUKE</text>
  <text x="160" y="80" font-family="Courier New, monospace" font-weight="bold" font-size="26" fill="#e23fff" text-anchor="middle" letter-spacing="2">RACER</text>
</svg>
