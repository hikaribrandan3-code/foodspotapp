<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Taco Tower</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; }
        #gameCanvas { background: linear-gradient(180deg, #87CEEB 0%, #F4E4C1 100%); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 10px; left: 10px; color: #333; font-weight: bold; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; text-align: center; color: white; display: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div id="ui">HEIGHT: <span id="height">0</span> | BEST: <span id="best">0</span></div>
    <div id="gameOver">
        <h2 style="color: #F97316;">TACO TUMBLE!</h2>
        <p>Tower Height: <span id="finalHeight">0</span></p>
        <button onclick="resetGame()" style="background: #F97316; border: none; padding: 10px 20px; color: white; border-radius: 5px; cursor: pointer;">BUILD AGAIN</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'playing';
let tower = [];
let swingingTaco = null;
let score = 0;
let best = parseInt(localStorage.getItem('tacoTower_best') || '0');

const TACOS = ['🌮', '🌯', '🫔'];

class Taco {
    constructor() {
        this.x = 50;
        this.y = 50;
        this.width = 50;
        this.height = 40;
        this.swingAngle = 0;
        this.swingSpeed = 0.03 + (tower.length * 0.005);
        this.emoji = TACOS[Math.floor(Math.random() * TACOS.length)];
        this.dropped = false;
    }

    update() {
        if (!this.dropped) {
            this.swingAngle += this.swingSpeed;
            this.x = 240 + Math.sin(this.swingAngle) * 150;
        } else {
            this.y += 5;
            
            // Check landing
            if (tower.length === 0) {
                if (this.y + this.height >= 280) {
                    this.y = 280 - this.height;
                    this.land();
                }
            } else {
                const top = tower[tower.length - 1];
                if (this.y + this.height >= top.y) {
                    this.y = top.y - this.height;
                    this.land();
                }
            }
        }
    }

    land() {
        this.dropped = false;
        tower.push({ x: this.x, y: this.y, width: this.width, height: this.height, emoji: this.emoji });
        score = tower.length;
        document.getElementById('height').textContent = score;
        window.parent.postMessage({ type: 'SCORE', score: score * 100 }, '*');
        
        if (tower.length > best) {
            best = tower.length;
            localStorage.setItem('tacoTower_best', best);
            document.getElementById('best').textContent = best;
        }
        
        swingingTaco = new Taco();
    }

    draw() {
        ctx.font = '40px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(this.emoji, this.x + this.width/2, this.y + this.height - 5);
    }
}

function drawTower() {
    tower.forEach(taco => {
        ctx.font = '40px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(taco.emoji, taco.x + taco.width/2, taco.y + taco.height - 5);
    });
    
    // Ground
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, 280, 480, 40);
}

function gameLoop() {
    if (gameState === 'paused') return;
    
    ctx.clearRect(0, 0, 480, 320);
    
    drawTower();
    
    if (swingingTaco) {
        swingingTaco.update();
        swingingTaco.draw();
        
        // Check if tower too tall
        if (tower.length > 0 && tower[tower.length - 1].y < 50) {
            gameOver();
        }
    }
    
    requestAnimationFrame(gameLoop);
}

function drop() {
    if (swingingTaco && !swingingTaco.dropped) {
        swingingTaco.dropped = true;
    }
}

function gameOver() {
    gameState = 'gameover';
    document.getElementById('finalHeight').textContent = score;
    document.getElementById('gameOver').style.display = 'block';
    window.parent.postMessage({ type: 'GAME_OVER', score: score * 100 }, '*');
}

function resetGame() {
    tower = [];
    score = 0;
    swingingTaco = new Taco();
    gameState = 'playing';
    document.getElementById('gameOver').style.display = 'none';
    document.getElementById('height').textContent = score;
}

// Controls
canvas.addEventListener('click', drop);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drop(); });
document.addEventListener('keydown', (e) => { if (e.code === 'Space') drop(); });

// PostMessage API
window.addEventListener('message', (e) => {
    switch(e.data.type) {
        case 'PAUSE': gameState = 'paused'; break;
        case 'RESUME': gameState = 'playing'; gameLoop(); break;
        case 'SAVE_STATE': localStorage.setItem('tacoTower_state', JSON.stringify({tower, score})); break;
        case 'LOAD_STATE':
            const saved = localStorage.getItem('tacoTower_state');
            if (saved) { const data = JSON.parse(saved); tower = data.tower; score = data.score; }
            break;
    }
});

document.getElementById('best').textContent = best;
swingingTaco = new Taco();
gameLoop();
</script>
</body>
</html>
