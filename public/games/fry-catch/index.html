<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fry Catch - Arcade Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(255, 200, 0, 0.3);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
    </div>

    <script>
        // ============================================
        // FRY CATCH - Arcade Game
        // ============================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Constants
        const GAME_WIDTH = 480;
        const GAME_HEIGHT = 320;
        const GROUND_Y = 280;

        // Game State
        let gameState = 'title'; // title, playing, paused, gameover
        let score = 0;
        let friesCaught = 0;
        let missedGolden = 0;
        let speedLevel = 1;
        let gameTime = 0;
        let frameCount = 0;

        // Input State (PostMessage API)
        const inputState = {
            LEFT: false,
            RIGHT: false,
            UP: false,
            DOWN: false,
            A: false,
            B: false,
            START: false
        };

        let audioMuted = false;

        // Audio Context
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // ============================================
        // AUDIO SYSTEM
        // ============================================
        const sounds = {
            catch: null,
            badFry: null,
            speedUp: null,
            gameOver: null,
            jump: null,
            upgrade: null,
            bgm: null
        };

        function createSound(type, freq, duration, volume = 0.3) {
            return () => {
                if (audioMuted) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + duration);
            };
        }

        function createToneSequence(notes, duration) {
            return () => {
                if (audioMuted) return;
                notes.forEach((note, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(note, audioCtx.currentTime + i * duration);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * duration);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * duration + duration * 0.8);
                    
                    osc.start(audioCtx.currentTime + i * duration);
                    osc.stop(audioCtx.currentTime + i * duration + duration);
                });
            };
        }

        // Initialize sounds
        sounds.catch = createSound('sine', 880, 0.15, 0.4);
        sounds.badFry = createSound('sawtooth', 150, 0.3, 0.4);
        sounds.speedUp = createToneSequence([523, 659, 784, 1047], 0.1);
        sounds.gameOver = createToneSequence([440, 349, 293, 220], 0.3);
        sounds.jump = createSound('sine', 400, 0.2, 0.3);
        sounds.upgrade = createToneSequence([659, 784, 988], 0.1);

        // Background Music (simple loop)
        let bgmInterval = null;
        let bgmNoteIndex = 0;
        const bgmNotes = [262, 330, 392, 523, 392, 330, 262, 196];

        function startBGM() {
            if (bgmInterval) return;
            bgmInterval = setInterval(() => {
                if (audioMuted || gameState === 'paused') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(bgmNotes[bgmNoteIndex], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.25);
                
                bgmNoteIndex = (bgmNoteIndex + 1) % bgmNotes.length;
            }, 250);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        // ============================================
        // GAME ENTITIES
        // ============================================

        // Basket
        const basket = {
            x: GAME_WIDTH / 2 - 30,
            y: GROUND_Y - 25,
            width: 60,
            height: 30,
            baseWidth: 60,
            vx: 0,
            speed: 5,
            jumping: false,
            jumpVelocity: 0,
            jumpPower: -8,
            gravity: 0.4,
            upgraded: false,
            upgradeTimer: 0,
            upgradeDuration: 300, // 5 seconds at 60fps

            update() {
                // Movement
                if (inputState.LEFT) {
                    this.vx = -this.speed;
                } else if (inputState.RIGHT) {
                    this.vx = this.speed;
                } else {
                    this.vx *= 0.8; // Friction
                }

                this.x += this.vx;

                // Clamp to screen
                this.x = Math.max(0, Math.min(GAME_WIDTH - this.width, this.x));

                // Jump
                if (inputState.A && !this.jumping) {
                    this.jumping = true;
                    this.jumpVelocity = this.jumpPower;
                    sounds.jump();
                }

                if (this.jumping) {
                    this.y += this.jumpVelocity;
                    this.jumpVelocity += this.gravity;

                    // Land
                    if (this.y >= GROUND_Y - 25) {
                        this.y = GROUND_Y - 25;
                        this.jumping = false;
                        this.jumpVelocity = 0;
                    }
                }

                // Upgrade handling
                if (inputState.B && !this.upgraded && this.upgradeTimer <= 0) {
                    this.activateUpgrade();
                }

                if (this.upgraded) {
                    this.upgradeTimer--;
                    if (this.upgradeTimer <= 0) {
                        this.deactivateUpgrade();
                    }
                }
            },

            activateUpgrade() {
                this.upgraded = true;
                this.width = 90;
                this.upgradeTimer = this.upgradeDuration;
                sounds.upgrade();
            },

            deactivateUpgrade() {
                this.upgraded = false;
                this.width = this.baseWidth;
                this.x = Math.max(0, Math.min(GAME_WIDTH - this.width, this.x));
            },

            draw() {
                // Basket body
                ctx.fillStyle = this.upgraded ? '#d4a574' : '#c4956a';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Basket weave pattern
                ctx.strokeStyle = '#8b6914';
                ctx.lineWidth = 2;
                for (let i = 0; i < this.width; i += 10) {
                    ctx.beginPath();
                    ctx.moveTo(this.x + i, this.y);
                    ctx.lineTo(this.x + i + 5, this.y + this.height);
                    ctx.stroke();
                }
                for (let i = 0; i < this.height; i += 8) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + i);
                    ctx.lineTo(this.x + this.width, this.y + i + 4);
                    ctx.stroke();
                }

                // Basket rim
                ctx.fillStyle = '#a67c52';
                ctx.fillRect(this.x - 3, this.y, this.width + 6, 6);

                // Upgrade glow
                if (this.upgraded) {
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(this.x - 5, this.y - 5, this.width + 10, this.height + 10);
                    
                    // Sparkles
                    const sparkleOffset = (frameCount * 0.1) % (Math.PI * 2);
                    for (let i = 0; i < 3; i++) {
                        const sx = this.x + (i + 0.5) * (this.width / 3);
                        const sy = this.y - 10 + Math.sin(sparkleOffset + i) * 3;
                        ctx.fillStyle = '#ffd700';
                        ctx.fillRect(sx - 2, sy - 2, 4, 4);
                    }
                }
            }
        };

        // Fries array
        let fries = [];

        class Fry {
            constructor() {
                this.x = Math.random() * (GAME_WIDTH - 20) + 10;
                this.y = -30;
                this.width = 8;
                this.height = 25;
                this.vy = (2 + Math.random() * 2) * (1 + speedLevel * 0.15);
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                this.type = Math.random() < 0.75 ? 'golden' : 'burnt';
                this.caught = false;
            }

            update() {
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (this.type === 'golden') {
                    // Golden fry
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    
                    // Crispy edges
                    ctx.fillStyle = '#ffaa00';
                    ctx.fillRect(-this.width/2, -this.height/2 + 2, this.width, 3);
                    ctx.fillRect(-this.width/2, this.height/2 - 5, this.width, 3);
                    
                    // Salt specks
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-2, -5, 1, 1);
                    ctx.fillRect(1, 2, 1, 1);
                    ctx.fillRect(0, -2, 1, 1);
                } else {
                    // Burnt fry
                    ctx.fillStyle = '#3d2817';
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    
                    // Burnt spots
                    ctx.fillStyle = '#1a0f08';
                    ctx.fillRect(-this.width/2 + 1, -this.height/2 + 5, this.width - 2, 4);
                    ctx.fillRect(-this.width/2 + 1, this.height/2 - 8, this.width - 2, 4);
                    
                    // Warning glow
                    if (frameCount % 30 < 15) {
                        ctx.strokeStyle = '#ff0000';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(-this.width/2 - 2, -this.height/2 - 2, this.width + 4, this.height + 4);
                    }
                }

                ctx.restore();
            }

            checkCollision() {
                // Simple AABB collision with basket
                const basketLeft = basket.x;
                const basketRight = basket.x + basket.width;
                const basketTop = basket.y;
                const basketBottom = basket.y + basket.height;

                const fryLeft = this.x - this.width/2;
                const fryRight = this.x + this.width/2;
                const fryTop = this.y - this.height/2;
                const fryBottom = this.y + this.height/2;

                return fryRight > basketLeft && 
                       fryLeft < basketRight && 
                       fryBottom > basketTop && 
                       fryTop < basketBottom;
            }
        }

        // Particles
        let particles = [];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4 - 2;
                this.life = 30;
                this.color = color;
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // Gravity
                this.life--;
            }

            draw() {
                ctx.globalAlpha = this.life / 30;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        // ============================================
        // GAME FUNCTIONS
        // ============================================

        function spawnFry() {
            const spawnRate = Math.max(30, 90 - speedLevel * 10);
            if (frameCount % spawnRate === 0) {
                fries.push(new Fry());
            }
        }

        function createParticles(x, y, color, count = 5) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function speedUp() {
            speedLevel++;
            sounds.speedUp();
            // Visual feedback
            createParticles(GAME_WIDTH/2, GAME_HEIGHT/2, '#ffd700', 20);
        }

        function gameOver() {
            gameState = 'gameover';
            stopBGM();
            sounds.gameOver();
            reportScore(score);
            saveGameState();
        }

        function resetGame() {
            score = 0;
            friesCaught = 0;
            missedGolden = 0;
            speedLevel = 1;
            gameTime = 0;
            frameCount = 0;
            fries = [];
            particles = [];
            basket.x = GAME_WIDTH / 2 - 30;
            basket.y = GROUND_Y - 25;
            basket.vx = 0;
            basket.jumping = false;
            basket.upgraded = false;
            basket.upgradeTimer = 0;
            basket.width = basket.baseWidth;
        }

        // ============================================
        // REQUIRED API FUNCTIONS
        // ============================================

        function reportScore(score) {
            parent.postMessage({type: 'score', value: score}, '*');
        }

        function saveGameState() {
            localStorage.setItem('munchboy_save_frycatch', JSON.stringify({
                score: score,
                friesCaught: friesCaught,
                speedLevel: speedLevel,
                timestamp: Date.now()
            }));
        }

        function loadGameState() {
            const saved = localStorage.getItem('munchboy_save_frycatch');
            if (saved) {
                return JSON.parse(saved);
            }
            return null;
        }

        // ============================================
        // POSTMESSAGE API
        // ============================================

        window.addEventListener('message', (e) => {
            const {type, button, state} = e.data;
            if (type === 'button') {
                inputState[button] = state;
                
                // Handle START for pause menu
                if (button === 'START' && state === true) {
                    if (gameState === 'playing') {
                        gameState = 'paused';
                        stopBGM();
                    } else if (gameState === 'paused') {
                        gameState = 'playing';
                        startBGM();
                    }
                }
            }
            if (type === 'mute') audioMuted = true;
        });

        // Keyboard fallback for testing
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft': inputState.LEFT = true; break;
                case 'ArrowRight': inputState.RIGHT = true; break;
                case 'ArrowUp': inputState.UP = true; break;
                case 'z': case 'Z': inputState.A = true; break;
                case 'x': case 'X': inputState.B = true; break;
                case 'Enter': 
                    inputState.START = true;
                    if (gameState === 'playing') {
                        gameState = 'paused';
                        stopBGM();
                    } else if (gameState === 'paused') {
                        gameState = 'playing';
                        startBGM();
                    }
                    break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowLeft': inputState.LEFT = false; break;
                case 'ArrowRight': inputState.RIGHT = false; break;
                case 'ArrowUp': inputState.UP = false; break;
                case 'z': case 'Z': inputState.A = false; break;
                case 'x': case 'X': inputState.B = false; break;
                case 'Enter': inputState.START = false; break;
            }
        });

        // ============================================
        // DRAWING FUNCTIONS
        // ============================================

        function drawKitchenBackground() {
            // Wall tiles
            ctx.fillStyle = '#f5e6c8';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Tile pattern
            ctx.strokeStyle = '#e0d0a8';
            ctx.lineWidth = 1;
            for (let y = 0; y < GAME_HEIGHT; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_WIDTH, y);
                ctx.stroke();
            }
            for (let x = 0; x < GAME_WIDTH; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, GAME_HEIGHT);
                ctx.stroke();
            }

            // Countertop
            ctx.fillStyle = '#8b7355';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);
            
            // Counter edge
            ctx.fillStyle = '#6b5344';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 8);

            // Frying oil vat (decorative)
            ctx.fillStyle = '#4a3728';
            ctx.fillRect(20, GROUND_Y - 40, 60, 40);
            ctx.fillStyle = '#d4a017';
            ctx.fillRect(25, GROUND_Y - 35, 50, 30);
            // Oil shimmer
            if (frameCount % 60 < 30) {
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(30, GROUND_Y - 30, 15, 5);
                ctx.fillRect(55, GROUND_Y - 25, 10, 3);
            }

            // Another vat
            ctx.fillStyle = '#4a3728';
            ctx.fillRect(GAME_WIDTH - 80, GROUND_Y - 40, 60, 40);
            ctx.fillStyle = '#3d2817';
            ctx.fillRect(GAME_WIDTH - 75, GROUND_Y - 35, 50, 30);
        }

        function drawUI() {
            // Score
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 16px Courier New';
            ctx.fillText(`SCORE: ${score}`, 10, 25);

            // Fries caught / Speed level
            ctx.fillStyle = '#000000';
            ctx.font = '12px Courier New';
            ctx.fillText(`FRIES: ${friesCaught}`, 10, 45);
            ctx.fillText(`SPEED: ${speedLevel}`, 10, 60);

            // Missed counter (hearts)
            ctx.fillStyle = '#ff0000';
            ctx.font = '16px monospace';
            const hearts = '♥'.repeat(Math.max(0, 3 - missedGolden));
            ctx.fillText(hearts, 10, 80);

            // Upgrade indicator
            if (basket.upgraded) {
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 12px Courier New';
                ctx.fillText('UPGRADE!', GAME_WIDTH - 80, 25);
                // Timer bar
                ctx.fillStyle = '#333';
                ctx.fillRect(GAME_WIDTH - 80, 30, 70, 8);
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(GAME_WIDTH - 80, 30, 70 * (basket.upgradeTimer / basket.upgradeDuration), 8);
            }

            // Speed up notification
            if (friesCaught > 0 && friesCaught % 20 === 0 && frameCount % 120 < 60) {
                ctx.fillStyle = '#ffd700';
                ctx.strokeStyle = '#ff8c00';
                ctx.lineWidth = 2;
                ctx.font = 'bold 20px Courier New';
                const text = 'SPEED UP!';
                const width = ctx.measureText(text).width;
                ctx.strokeText(text, GAME_WIDTH/2 - width/2, GAME_HEIGHT/2);
                ctx.fillText(text, GAME_WIDTH/2 - width/2, GAME_HEIGHT/2);
            }
        }

        function drawTitleScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Title
            ctx.fillStyle = '#ffd700';
            ctx.strokeStyle = '#ff8c00';
            ctx.lineWidth = 3;
            ctx.font = 'bold 36px Courier New';
            const title = 'FRY CATCH';
            const titleWidth = ctx.measureText(title).width;
            ctx.strokeText(title, GAME_WIDTH/2 - titleWidth/2, 100);
            ctx.fillText(title, GAME_WIDTH/2 - titleWidth/2, 100);

            // Subtitle
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px Courier New';
            const subtitle = 'Catch golden fries, avoid burnt ones!';
            const subWidth = ctx.measureText(subtitle).width;
            ctx.fillText(subtitle, GAME_WIDTH/2 - subWidth/2, 140);

            // Controls
            ctx.font = '12px Courier New';
            ctx.fillText('LEFT/RIGHT: Move Basket', GAME_WIDTH/2 - 80, 180);
            ctx.fillText('A: Jump', GAME_WIDTH/2 - 30, 200);
            ctx.fillText('B: Basket Upgrade', GAME_WIDTH/2 - 50, 220);
            ctx.fillText('START: Pause', GAME_WIDTH/2 - 40, 240);

            // Blinking start
            if (frameCount % 60 < 30) {
                ctx.fillStyle = '#00ff00';
                ctx.font = 'bold 16px Courier New';
                const start = 'Press A to Start';
                const startWidth = ctx.measureText(start).width;
                ctx.fillText(start, GAME_WIDTH/2 - startWidth/2, 280);
            }
        }

        function drawPauseMenu() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px Courier New';
            const title = 'PAUSED';
            const titleWidth = ctx.measureText(title).width;
            ctx.fillText(title, GAME_WIDTH/2 - titleWidth/2, 80);

            // Menu options
            ctx.font = '16px Courier New';
            const options = [
                'A: Resume',
                `B: ${audioMuted ? 'Unmute' : 'Mute'} Audio`,
                'START: Back to Selector'
            ];

            options.forEach((opt, i) => {
                ctx.fillText(opt, GAME_WIDTH/2 - 70, 130 + i * 30);
            });

            // Current score
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 18px Courier New';
            ctx.fillText(`Score: ${score}`, GAME_WIDTH/2 - 50, 250);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 32px Courier New';
            const title = 'GAME OVER';
            const titleWidth = ctx.measureText(title).width;
            ctx.fillText(title, GAME_WIDTH/2 - titleWidth/2, 100);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Courier New';
            ctx.fillText(`Final Score: ${score}`, GAME_WIDTH/2 - 70, 150);
            ctx.font = '16px Courier New';
            ctx.fillText(`Fries Caught: ${friesCaught}`, GAME_WIDTH/2 - 60, 180);
            ctx.fillText(`Speed Level: ${speedLevel}`, GAME_WIDTH/2 - 55, 205);

            if (frameCount % 60 < 30) {
                ctx.fillStyle = '#00ff00';
                ctx.font = 'bold 16px Courier New';
                const restart = 'Press A to Restart';
                const restartWidth = ctx.measureText(restart).width;
                ctx.fillText(restart, GAME_WIDTH/2 - restartWidth/2, 260);
            }
        }

        // ============================================
        // MAIN GAME LOOP
        // ============================================

        function update() {
            if (gameState === 'playing') {
                frameCount++;
                gameTime++;

                basket.update();
                spawnFry();

                // Update fries
                for (let i = fries.length - 1; i >= 0; i--) {
                    const fry = fries[i];
                    fry.update();

                    // Check collision with basket
                    if (fry.checkCollision() && !fry.caught) {
                        fry.caught = true;

                        if (fry.type === 'golden') {
                            score += 10;
                            friesCaught++;
                            sounds.catch();
                            createParticles(fry.x, fry.y, '#ffd700', 8);

                            // Speed up every 20 fries
                            if (friesCaught % 20 === 0) {
                                speedUp();
                            }
                        } else {
                            score = Math.max(0, score - 5);
                            sounds.badFry();
                            createParticles(fry.x, fry.y, '#3d2817', 5);
                        }

                        fries.splice(i, 1);
                        continue;
                    }

                    // Check if fry hit the ground
                    if (fry.y > GAME_HEIGHT) {
                        if (fry.type === 'golden' && !fry.caught) {
                            missedGolden++;
                            sounds.badFry();
                            if (missedGolden >= 3) {
                                gameOver();
                            }
                        }
                        fries.splice(i, 1);
                    }
                }

                // Update particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }

                reportScore(score);
            } else if (gameState === 'title') {
                frameCount++;
                if (inputState.A) {
                    resetGame();
                    gameState = 'playing';
                    startBGM();
                }
            } else if (gameState === 'gameover') {
                frameCount++;
                if (inputState.A) {
                    resetGame();
                    gameState = 'playing';
                    startBGM();
                }
            } else if (gameState === 'paused') {
                // Handle pause menu
                if (inputState.A) {
                    gameState = 'playing';
                    startBGM();
                }
                if (inputState.B) {
                    audioMuted = !audioMuted;
                    inputState.B = false; // Prevent rapid toggling
                }
            }
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Draw background
            drawKitchenBackground();

            if (gameState === 'playing' || gameState === 'paused') {
                // Draw fries
                fries.forEach(fry => fry.draw());

                // Draw basket
                basket.draw();

                // Draw particles
                particles.forEach(p => p.draw());

                // Draw UI
                drawUI();
            }

            // Draw overlays
            if (gameState === 'title') {
                drawTitleScreen();
            } else if (gameState === 'paused') {
                drawPauseMenu();
            } else if (gameState === 'gameover') {
                drawGameOver();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();

    </script>
</body>
</html>
