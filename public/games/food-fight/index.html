<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD FIGHT - Kitchen Kombat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(255, 100, 50, 0.5);
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
    </div>

<script>
// ============================================
// FOOD FIGHT - Kitchen Kombat
// A 1v1 Fighting Game with Food Mascots
// ============================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Constants
const GAME_WIDTH = 480;
const GAME_HEIGHT = 320;
const GROUND_Y = 260;
const FPS = 60;
const ROUND_TIME = 60;

// Game State
let gameState = 'TITLE'; // TITLE, SELECT, VERSUS, FIGHTING, ROUND_END, GAME_OVER, PAUSE, TRAINING
let gameMode = 'ARCADE'; // ARCADE, TRAINING
let currentRound = 1;
let playerWins = 0;
let enemyWins = 0;
let roundTimer = ROUND_TIME;
let frameCount = 0;
let screenShake = 0;
let score = 0;
let highScore = 0;

// Input State (PostMessage API)
const inputState = {
    UP: false, DOWN: false, LEFT: false, RIGHT: false,
    A: false, B: false, L: false, R: false, START: false, SELECT: false
};
const prevInputState = {...inputState};

// Audio Context
let audioCtx = null;
let audioMuted = false;
let bgmOscillator = null;

// ============================================
// POSTMESSAGE API
// ============================================
window.addEventListener('message', (e) => {
    const {type, button, state} = e.data;
    if (type === 'button') {
        inputState[button] = state === 'pressed';
    }
    if (type === 'mute') { 
        audioMuted = true; 
        if (bgmOscillator) {
            bgmOscillator.stop();
            bgmOscillator = null;
        }
    }
    if (type === 'unmute') {
        audioMuted = false;
    }
});

function reportScore(score) {
    parent.postMessage({type: 'score', value: score}, '*');
}

function saveGameState() {
    const saveData = {
        score, 
        highScore,
        gameMode, 
        timestamp: Date.now()
    };
    localStorage.setItem('munchboy_save_foodfight', JSON.stringify(saveData));
}

function loadGameState() {
    const saved = localStorage.getItem('munchboy_save_foodfight');
    if (saved) {
        const data = JSON.parse(saved);
        highScore = data.highScore || 0;
    }
}

// ============================================
// AUDIO SYSTEM (Web Audio API)
// ============================================
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type, frequency = 440, duration = 0.1) {
    if (audioMuted || !audioCtx) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    switch(type) {
        case 'punch':
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            duration = 0.1;
            break;
        case 'kick':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            duration = 0.15;
            break;
        case 'special':
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            duration = 0.3;
            break;
        case 'ultimate':
            osc.type = 'sawtooth';
            for (let i = 0; i < 5; i++) {
                const uOsc = audioCtx.createOscillator();
                const uGain = audioCtx.createGain();
                uOsc.connect(uGain);
                uGain.connect(audioCtx.destination);
                uOsc.frequency.setValueAtTime(200 + i * 100, audioCtx.currentTime);
                uOsc.frequency.exponentialRampToValueAtTime(600 + i * 100, audioCtx.currentTime + 0.5);
                uGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                uGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                uOsc.start();
                uOsc.stop(audioCtx.currentTime + 0.5);
            }
            return;
        case 'hit':
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            duration = 0.1;
            break;
        case 'block':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            duration = 0.08;
            break;
        case 'jump':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            duration = 0.2;
            break;
        case 'select':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            duration = 0.05;
            break;
    }
    
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playBGM() {
    if (audioMuted || !audioCtx || bgmOscillator) return;
    
    // Simple bassline loop
    const playNote = (freq, time, duration) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
        osc.start(time);
        osc.stop(time + duration);
    };
    
    const bassline = [65, 65, 73, 78, 87, 87, 78, 73]; // C, C, D, E, F, F, E, D
    let noteTime = audioCtx.currentTime;
    
    const scheduleBassline = () => {
        for (let i = 0; i < bassline.length; i++) {
            playNote(bassline[i], noteTime + i * 0.25, 0.2);
        }
        noteTime += bassline.length * 0.25;
    };
    
    scheduleBassline();
    setInterval(scheduleBassline, bassline.length * 250);
}

// ============================================
// PARTICLE SYSTEM
// ============================================
let particles = [];

class Particle {
    constructor(x, y, color, speed, life) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * speed;
        this.vy = (Math.random() - 0.5) * speed;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = Math.random() * 4 + 2;
    }
    
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.3; // gravity
        this.life--;
        this.size *= 0.95;
    }
    
    draw(ctx) {
        const alpha = this.life / this.maxLife;
        ctx.fillStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

function createParticles(x, y, color, count = 8, speed = 8) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, speed, 30));
    }
}

function updateParticles() {
    particles = particles.filter(p => {
        p.update();
        return p.life > 0;
    });
}

function drawParticles(ctx) {
    particles.forEach(p => p.draw(ctx));
}

// ============================================
// FIGHTER CLASS
// ============================================
class Fighter {
    constructor(x, y, type, isPlayer = true) {
        this.x = x;
        this.y = y;
        this.width = 40;
        this.height = 60;
        this.vx = 0;
        this.vy = 0;
        this.type = type;
        this.isPlayer = isPlayer;
        
        // Stats based on type
        this.stats = this.getStats(type);
        this.maxHealth = this.stats.health;
        this.health = this.maxHealth;
        this.maxPower = 100;
        this.power = 0;
        
        // State
        this.state = 'IDLE'; // IDLE, WALK, JUMP, CROUCH, ATTACK, BLOCK, HIT, KNOCKDOWN, SPECIAL, ULTIMATE
        this.facing = isPlayer ? 1 : -1;
        this.animFrame = 0;
        this.animTimer = 0;
        
        // Combat
        this.hitStun = 0;
        this.blockStun = 0;
        this.invincible = 0;
        this.comboCount = 0;
        this.lastAttackTime = 0;
        
        // Input buffer for special moves
        this.inputBuffer = [];
        this.bufferTime = 15;
        
        // Projectiles
        this.projectiles = [];
        
        // Ground check
        this.onGround = true;
    }
    
    getStats(type) {
        const stats = {
            burger: { health: 130, speed: 2, power: 15, name: 'Burger Brawler', color: '#D2691E' },
            taco: { health: 90, speed: 4.5, power: 10, name: 'Taco Terror', color: '#FFD700' },
            sushi: { health: 110, speed: 3.5, power: 12, name: 'Sushi Samurai', color: '#FF6B6B' },
            pizza: { health: 100, speed: 3, power: 11, name: 'Pizza Punisher', color: '#FFA500' },
            blender: { health: 200, speed: 2.5, power: 18, name: 'Giant Blender', color: '#888888' }
        };
        return stats[type] || stats.burger;
    }
    
    update() {
        // Apply gravity
        if (!this.onGround) {
            this.vy += 0.6;
        }
        
        // Update position
        this.x += this.vx;
        this.y += this.vy;
        
        // Ground collision
        if (this.y >= GROUND_Y - this.height) {
            this.y = GROUND_Y - this.height;
            this.vy = 0;
            this.onGround = true;
            if (this.state === 'JUMP') {
                this.state = 'IDLE';
            }
        }
        
        // Screen bounds
        this.x = Math.max(20, Math.min(GAME_WIDTH - 20 - this.width, this.x));
        
        // Update timers
        if (this.hitStun > 0) this.hitStun--;
        if (this.blockStun > 0) this.blockStun--;
        if (this.invincible > 0) this.invincible--;
        
        // Animation
        this.animTimer++;
        if (this.animTimer >= 6) {
            this.animTimer = 0;
            this.animFrame = (this.animFrame + 1) % 4;
        }
        
        // Clear input buffer
        this.inputBuffer = this.inputBuffer.filter(i => i.time > frameCount - this.bufferTime);
        
        // Update projectiles
        this.projectiles = this.projectiles.filter(p => {
            p.x += p.vx;
            p.life--;
            return p.life > 0 && p.x > 0 && p.x < GAME_WIDTH;
        });
        
        // Friction
        if (this.state !== 'WALK' && this.onGround) {
            this.vx *= 0.8;
        }
        
        // Reset combo if too much time passed
        if (frameCount - this.lastAttackTime > 60) {
            this.comboCount = 0;
        }
    }
    
    move(dir) {
        if (this.hitStun > 0 || this.blockStun > 0 || this.state === 'ATTACK' || 
            this.state === 'SPECIAL' || this.state === 'ULTIMATE') return;
        
        this.vx = dir * this.stats.speed;
        this.facing = dir;
        if (this.onGround && this.state !== 'JUMP') {
            this.state = 'WALK';
        }
    }
    
    jump() {
        if (this.onGround && this.hitStun === 0 && this.blockStun === 0 &&
            this.state !== 'ATTACK' && this.state !== 'SPECIAL' && this.state !== 'ULTIMATE') {
            this.vy = -12;
            this.onGround = false;
            this.state = 'JUMP';
            playSound('jump');
        }
    }
    
    crouch(isCrouching) {
        if (isCrouching && this.onGround && this.hitStun === 0 && this.blockStun === 0) {
            this.state = 'CROUCH';
            this.vx = 0;
        } else if (this.state === 'CROUCH') {
            this.state = 'IDLE';
        }
    }
    
    block(isBlocking) {
        if (isBlocking && this.onGround && this.hitStun === 0) {
            this.state = 'BLOCK';
            this.vx = 0;
        } else if (this.state === 'BLOCK') {
            this.state = 'IDLE';
        }
    }
    
    punch() {
        if (this.hitStun > 0 || this.blockStun > 0 || this.state === 'ULTIMATE') return;
        if (this.state === 'ATTACK' || this.state === 'SPECIAL') return;
        
        this.state = 'ATTACK';
        this.animFrame = 0;
        this.attackType = 'PUNCH';
        this.attackDamage = this.stats.power;
        this.attackHit = false;
        
        // Check for special
        if (this.checkSpecialInput('DOWN_FORWARD_A')) {
            this.performSpecial();
        } else {
            playSound('punch');
        }
        
        setTimeout(() => {
            if (this.state === 'ATTACK') this.state = 'IDLE';
        }, 200);
    }
    
    kick() {
        if (this.hitStun > 0 || this.blockStun > 0 || this.state === 'ULTIMATE') return;
        if (this.state === 'ATTACK' || this.state === 'SPECIAL') return;
        
        this.state = 'ATTACK';
        this.animFrame = 0;
        this.attackType = 'KICK';
        this.attackDamage = this.stats.power * 1.3;
        this.attackHit = false;
        
        // Check for slam
        if (this.checkSpecialInput('UP_DOWN_B')) {
            this.performSlam();
        } else {
            playSound('kick');
        }
        
        setTimeout(() => {
            if (this.state === 'ATTACK') this.state = 'IDLE';
        }, 250);
    }
    
    checkSpecialInput(sequence) {
        if (this.inputBuffer.length < 3) return false;
        
        const recent = this.inputBuffer.slice(-3);
        
        if (sequence === 'DOWN_FORWARD_A') {
            // Check for down, down+right/right, a
            const hasDown = recent.some(i => i.input === 'DOWN');
            const hasForward = recent.some(i => i.input === (this.facing === 1 ? 'RIGHT' : 'LEFT'));
            return hasDown && hasForward;
        }
        if (sequence === 'UP_DOWN_B') {
            const hasUp = recent.some(i => i.input === 'UP');
            const hasDown = recent.some(i => i.input === 'DOWN');
            return hasUp && hasDown;
        }
        return false;
    }
    
    performSpecial() {
        this.state = 'SPECIAL';
        playSound('special');
        
        switch(this.type) {
            case 'burger':
                // Throw patty projectile
                this.projectiles.push({
                    x: this.x + this.width * this.facing,
                    y: this.y + 20,
                    vx: 8 * this.facing,
                    vy: 0,
                    damage: 20,
                    life: 60,
                    type: 'pattie'
                });
                break;
            case 'taco':
                // Spin attack
                this.invincible = 30;
                this.vx = 10 * this.facing;
                break;
            case 'sushi':
                // Dash slice
                this.vx = 15 * this.facing;
                this.invincible = 15;
                break;
            case 'pizza':
                // Cheese stretch (extended hitbox)
                this.attackRange = 80;
                break;
        }
        
        setTimeout(() => {
            this.state = 'IDLE';
            this.vx = 0;
            this.attackRange = 0;
        }, 400);
    }
    
    performSlam() {
        this.state = 'SPECIAL';
        playSound('special');
        
        if (this.onGround) {
            this.vy = -8;
            this.onGround = false;
        }
        
        // Slam down
        const slamCheck = setInterval(() => {
            if (this.onGround && this.state === 'SPECIAL') {
                // Ground slam effect
                createParticles(this.x + this.width/2, this.y + this.height, '#888888', 12, 10);
                screenShake = 10;
                playSound('hit');
                clearInterval(slamCheck);
                this.state = 'IDLE';
            }
        }, 16);
    }
    
    ultimate() {
        if (this.power < this.maxPower) return;
        
        this.power = 0;
        this.state = 'ULTIMATE';
        this.invincible = 90;
        playSound('ultimate');
        
        // Ultimate animation and damage
        switch(this.type) {
            case 'burger':
                // Patty Storm
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        this.projectiles.push({
                            x: this.x + this.width * this.facing,
                            y: this.y + Math.random() * 40,
                            vx: 10 * this.facing,
                            vy: (Math.random() - 0.5) * 4,
                            damage: 15,
                            life: 45,
                            type: 'pattie'
                        });
                    }, i * 100);
                }
                break;
            case 'taco':
                // Shell Shock spin
                this.ultimateDamage = 40;
                break;
            case 'sushi':
                // Blade Dance
                this.ultimateDamage = 45;
                break;
            case 'pizza':
                // Cheese Avalanche
                this.ultimateDamage = 35;
                break;
        }
        
        setTimeout(() => {
            this.state = 'IDLE';
            this.ultimateDamage = 0;
        }, 1000);
    }
    
    takeDamage(damage, isBlock = false) {
        if (this.invincible > 0) return false;
        
        if (this.state === 'BLOCK' || isBlock) {
            this.blockStun = 20;
            this.health -= Math.floor(damage * 0.1);
            this.power += 5;
            playSound('block');
            createParticles(this.x + this.width/2, this.y + 20, '#FFFFFF', 3, 4);
        } else {
            this.hitStun = 25;
            this.health -= damage;
            this.power += 10;
            playSound('hit');
            createParticles(this.x + this.width/2, this.y + 20, '#FF0000', 8, 6);
            screenShake = 5;
            this.state = 'HIT';
            
            setTimeout(() => {
                if (this.state === 'HIT') this.state = 'IDLE';
            }, 250);
        }
        
        // Cap power
        this.power = Math.min(this.power, this.maxPower);
        
        // Check KO
        if (this.health <= 0) {
            this.health = 0;
            this.state = 'KNOCKDOWN';
            return true;
        }
        return false;
    }
    
    getHitbox() {
        return {
            x: this.x,
            y: this.y,
            width: this.width,
            height: this.height
        };
    }
    
    getAttackHitbox() {
        const range = this.attackRange || 50;
        return {
            x: this.facing === 1 ? this.x + this.width : this.x - range,
            y: this.y + 10,
            width: range,
            height: 40
        };
    }
    
    addInput(input) {
        this.inputBuffer.push({ input, time: frameCount });
    }
    
    draw(ctx) {
        // Draw projectiles
        this.projectiles.forEach(p => {
            ctx.fillStyle = this.stats.color;
            if (p.type === 'pattie') {
                ctx.fillRect(p.x - 8, p.y - 4, 16, 8);
                ctx.fillStyle = '#654321';
                ctx.fillRect(p.x - 6, p.y - 2, 12, 4);
            }
        });
        
        // Draw fighter
        ctx.save();
        
        // Flip if facing left
        if (this.facing === -1) {
            ctx.translate(this.x + this.width, this.y);
            ctx.scale(-1, 1);
            ctx.translate(-this.x - this.width, -this.y);
        }
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillEllipse = (x, y, rx, ry) => {
            ctx.beginPath();
            ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();
        };
        ctx.beginPath();
        ctx.ellipse(this.x + this.width/2, GROUND_Y, 20, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Draw based on type
        this.drawCharacter(ctx);
        
        // Block effect
        if (this.state === 'BLOCK') {
            ctx.fillStyle = 'rgba(100, 150, 255, 0.5)';
            ctx.fillRect(this.x - 5, this.y - 5, this.width + 10, this.height + 10);
        }
        
        // Hit flash
        if (this.hitStun > 0 && this.hitStun % 4 < 2) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fillRect(this.x, this.y, this.width, this.height);
        }
        
        ctx.restore();
    }
    
    drawCharacter(ctx) {
        const bounce = this.state === 'WALK' ? Math.sin(this.animFrame * Math.PI / 2) * 3 : 0;
        const y = this.y + bounce;
        
        switch(this.type) {
            case 'burger':
                this.drawBurger(ctx, this.x, y);
                break;
            case 'taco':
                this.drawTaco(ctx, this.x, y);
                break;
            case 'sushi':
                this.drawSushi(ctx, this.x, y);
                break;
            case 'pizza':
                this.drawPizza(ctx, this.x, y);
                break;
            case 'blender':
                this.drawBlender(ctx, this.x, y);
                break;
        }
    }
    
    drawBurger(ctx, x, y) {
        // Bun bottom
        ctx.fillStyle = '#D2691E';
        ctx.fillRect(x + 5, y + 45, 30, 12);
        // Patty
        ctx.fillStyle = '#654321';
        ctx.fillRect(x + 3, y + 38, 34, 10);
        // Cheese
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(x + 2, y + 35, 36, 5);
        // Lettuce
        ctx.fillStyle = '#32CD32';
        ctx.fillRect(x + 4, y + 30, 32, 6);
        // Tomato
        ctx.fillStyle = '#FF6347';
        ctx.fillRect(x + 6, y + 25, 28, 6);
        // Bun top
        ctx.fillStyle = '#D2691E';
        ctx.fillRect(x + 5, y + 10, 30, 18);
        // Sesame seeds
        ctx.fillStyle = '#F5DEB3';
        ctx.fillRect(x + 12, y + 15, 3, 3);
        ctx.fillRect(x + 20, y + 18, 3, 3);
        ctx.fillRect(x + 28, y + 14, 3, 3);
        // Eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 12, y + 32, 4, 4);
        ctx.fillRect(x + 24, y + 32, 4, 4);
        // Arms
        ctx.fillStyle = '#D2691E';
        if (this.state === 'ATTACK') {
            ctx.fillRect(x + 35, y + 25, 20, 8);

// ============================================
// AI CONTROLLER
// ============================================
class AIController {
    constructor(fighter, difficulty = 1) {
        this.fighter = fighter;
        this.difficulty = difficulty;
        this.thinkTimer = 0;
        this.target = null;
        this.action = 'IDLE';
        this.actionTimer = 0;
    }
    
    update(target) {
        this.target = target;
        this.thinkTimer++;
        this.actionTimer--;
        
        if (this.thinkTimer >= 20 - this.difficulty * 3) {
            this.thinkTimer = 0;
            this.decideAction();
        }
        
        this.executeAction();
    }
    
    decideAction() {
        const dist = Math.abs(this.fighter.x - this.target.x);
        const healthPercent = this.fighter.health / this.fighter.maxHealth;
        const targetHealthPercent = this.target.health / this.target.maxHealth;
        
        // Use ultimate if available
        if (this.fighter.power >= this.fighter.maxPower && Math.random() < 0.3) {
            this.action = 'ULTIMATE';
            this.actionTimer = 60;
            return;
        }
        
        // Block if target is attacking and close
        if (this.target.state === 'ATTACK' && dist < 80 && Math.random() < 0.4 + this.difficulty * 0.1) {
            this.action = 'BLOCK';
            this.actionTimer = 25;
            return;
        }
        
        // Special attack
        if (dist < 100 && Math.random() < 0.2 + this.difficulty * 0.05) {
            this.action = 'SPECIAL';
            this.actionTimer = 40;
            return;
        }
        
        // Attack if close
        if (dist < 60) {
            if (Math.random() < 0.5) {
                this.action = 'PUNCH';
            } else {
                this.action = 'KICK';
            }
            this.actionTimer = 20;
            return;
        }
        
        // Approach or retreat based on health
        if (healthPercent < 0.3 && Math.random() < 0.4) {
            this.action = 'RETREAT';
            this.actionTimer = 30;
        } else {
            this.action = 'APPROACH';
            this.actionTimer = 30;
        }
        
        // Random jump
        if (Math.random() < 0.1) {
            this.action = 'JUMP';
            this.actionTimer = 20;
        }
    }
    
    executeAction() {
        if (this.actionTimer <= 0) {
            this.action = 'IDLE';
        }
        
        const targetDir = this.target.x > this.fighter.x ? 1 : -1;
        
        switch(this.action) {
            case 'APPROACH':
                this.fighter.move(targetDir);
                break;
            case 'RETREAT':
                this.fighter.move(-targetDir);
                break;
            case 'JUMP':
                this.fighter.jump();
                break;
            case 'BLOCK':
                this.fighter.block(true);
                break;
            case 'PUNCH':
                this.fighter.punch();
                this.action = 'IDLE';
                break;
            case 'KICK':
                this.fighter.kick();
                this.action = 'IDLE';
                break;
            case 'SPECIAL':
                this.fighter.addInput('DOWN');
                this.fighter.addInput(targetDir === 1 ? 'RIGHT' : 'LEFT');
                this.fighter.punch();
                this.action = 'IDLE';
                break;
            case 'ULTIMATE':
                this.fighter.ultimate();
                this.action = 'IDLE';
                break;
            case 'IDLE':
                this.fighter.vx = 0;
                if (this.fighter.state === 'WALK') {
                    this.fighter.state = 'IDLE';
                }
                break;
        }
    }
}

// ============================================
// INPUT HANDLING
// ============================================
function handleInput() {
    // Copy current state to previous
    for (let key in inputState) {
        prevInputState[key] = inputState[key];
    }
    
    if (gameState === 'FIGHTING' || gameState === 'TRAINING') {
        if (!player) return;
        
        // Movement
        if (inputState.LEFT) {
            player.move(-1);
            player.addInput('LEFT');
        } else if (inputState.RIGHT) {
            player.move(1);
            player.addInput('RIGHT');
        } else if (player.state === 'WALK') {
            player.vx = 0;
            player.state = 'IDLE';
        }
        
        // Jump
        if (inputState.UP && !prevInputState.UP) {
            player.jump();
            player.addInput('UP');
        }
        
        // Crouch
        if (inputState.DOWN) {
            player.crouch(true);
            player.addInput('DOWN');
        } else {
            player.crouch(false);
        }
        
        // Block (hold back)
        if ((player.facing === 1 && inputState.LEFT) || (player.facing === -1 && inputState.RIGHT)) {
            player.block(true);
        } else if (player.state === 'BLOCK') {
            player.block(false);
        }
        
        // Attacks
        if (inputState.A && !prevInputState.A) {
            player.punch();
        }
        if (inputState.B && !prevInputState.B) {
            player.kick();
        }
        
        // Ultimate (L+R+A+B when meter full)
        if (inputState.L && inputState.R && inputState.A && inputState.B && 
            player.power >= player.maxPower) {
            player.ultimate();
        }
        
        // Pause
        if (inputState.START && !prevInputState.START) {
            gameState = 'PAUSE';
            playSound('select');
        }
    }
}

function checkCollisions() {
    if (!player || !enemy) return;
    
    // Player attacks enemy
    if (player.state === 'ATTACK' || player.state === 'SPECIAL' || player.state === 'ULTIMATE') {
        const hitbox = player.getAttackHitbox();
        const enemyBox = enemy.getHitbox();
        
        // Check projectile hits
        player.projectiles.forEach(p => {
            if (p.x > enemyBox.x && p.x < enemyBox.x + enemyBox.width &&
                p.y > enemyBox.y && p.y < enemyBox.y + enemyBox.height) {
                const isKO = enemy.takeDamage(p.damage);
                player.power = Math.min(player.power + 10, player.maxPower);
                p.life = 0;
                if (isKO) endRound(player);
            }
        });
        
        // Check melee hit
        if (!player.attackHit && 
            hitbox.x < enemyBox.x + enemyBox.width &&
            hitbox.x + hitbox.width > enemyBox.x &&
            hitbox.y < enemyBox.y + enemyBox.height &&
            hitbox.y + hitbox.height > enemyBox.y) {
            
            player.attackHit = true;
            player.comboCount++;
            player.lastAttackTime = frameCount;
            
            let damage = player.attackDamage;
            if (player.state === 'SPECIAL') damage *= 1.5;
            if (player.state === 'ULTIMATE') damage = player.ultimateDamage || 40;
            
            // Combo multiplier
            damage = Math.floor(damage * (1 + player.comboCount * 0.1));
            
            const isKO = enemy.takeDamage(damage);
            player.power = Math.min(player.power + 15, player.maxPower);
            
            // Score
            score += damage * 10 + player.comboCount * 50;
            
            if (isKO) endRound(player);
        }
    }
    
    // Enemy attacks player
    if (enemy.state === 'ATTACK' || enemy.state === 'SPECIAL' || enemy.state === 'ULTIMATE') {
        const hitbox = enemy.getAttackHitbox();
        const playerBox = player.getHitbox();
        
        // Enemy projectiles
        enemy.projectiles.forEach(p => {
            if (p.x > playerBox.x && p.x < playerBox.x + playerBox.width &&
                p.y > playerBox.y && p.y < playerBox.y + playerBox.height) {
                if (!trainingSettings.infiniteHealth) {
                    const isKO = player.takeDamage(p.damage);
                    if (isKO) endRound(enemy);
                }
                p.life = 0;
            }
        });
        
        // Enemy melee
        if (!enemy.attackHit && 
            hitbox.x < playerBox.x + playerBox.width &&
            hitbox.x + hitbox.width > playerBox.x &&
            hitbox.y < playerBox.y + playerBox.height &&
            hitbox.y + hitbox.height > playerBox.y) {
            
            enemy.attackHit = true;
            
            let damage = enemy.attackDamage || enemy.stats.power;
            if (enemy.state === 'SPECIAL') damage *= 1.5;
            if (enemy.state === 'ULTIMATE') damage = enemy.ultimateDamage || 40;
            
            if (!trainingSettings.infiniteHealth) {
                const isKO = player.takeDamage(damage);
                if (isKO) endRound(enemy);
            }
        }
    }
}

function endRound(winner) {
    if (winner === player) {
        playerWins++;
    } else {
        enemyWins++;
    }
    
    gameState = 'ROUND_END';
    
    setTimeout(() => {
        if (playerWins >= 2 || enemyWins >= 2) {
            endMatch();
        } else {
            startRound();
        }
    }, 2000);
}

function endMatch() {
    if (playerWins >= 2) {
        score += 5000;
        if (gameMode === 'ARCADE') {
            currentOpponentIndex++;
            if (currentOpponentIndex >= arcadeOpponents.length) {
                gameState = 'VICTORY';
                score += 10000;
                if (score > highScore) highScore = score;
                saveGameState();
                reportScore(score);
            } else {
                startArcadeMatch();
            }
        } else {
            gameState = 'VICTORY';
        }
    } else {
        gameState = 'DEFEAT';
        if (score > highScore) highScore = score;
        saveGameState();
        reportScore(score);
    }
}

// ============================================
// GAME FLOW
// ============================================
function startRound() {
    currentRound++;
    roundTimer = ROUND_TIME;
    
    // Reset positions
    player.x = 80;
    player.y = GROUND_Y - player.height;
    player.vx = 0;
    player.vy = 0;
    player.health = trainingSettings.infiniteHealth ? player.maxHealth : player.health;
    player.state = 'IDLE';
    player.hitStun = 0;
    player.projectiles = [];
    
    enemy.x = GAME_WIDTH - 120;
    enemy.y = GROUND_Y - enemy.height;
    enemy.vx = 0;
    enemy.vy = 0;
    enemy.health = enemy.maxHealth;
    enemy.state = 'IDLE';
    enemy.hitStun = 0;
    enemy.projectiles = [];
    
    gameState = 'VERSUS';
    
    setTimeout(() => {
        gameState = gameMode === 'TRAINING' ? 'TRAINING' : 'FIGHTING';
        playBGM();
    }, 2000);
}

function startArcadeMatch() {
    playerWins = 0;
    enemyWins = 0;
    currentRound = 1;
    
    const opponentType = arcadeOpponents[currentOpponentIndex];
    const difficulty = Math.min(1 + currentOpponentIndex * 0.15, 3);
    
    player = new Fighter(80, GROUND_Y - 60, selectedFighter, true);
    enemy = new Fighter(GAME_WIDTH - 120, GROUND_Y - 60, opponentType, false);
    aiController = new AIController(enemy, difficulty);
    
    startRound();
}

function resetGame() {
    player = null;
    enemy = null;
    aiController = null;
    currentOpponentIndex = 0;
    playerWins = 0;
    enemyWins = 0;
    currentRound = 1;
    score = 0;
    roundTimer = ROUND_TIME;
    particles = [];
}

    ctx.fillText('KITCHEN KOMBAT', GAME_WIDTH/2, 105);
    
    // Menu options
    const options = ['ARCADE MODE', 'TRAINING MODE', 'CONTROLS'];
    options.forEach((opt, i) => {
        ctx.fillStyle = menuSelection === i ? '#0F0' : '#FFF';
        ctx.font = menuSelection === i ? 'bold 16px monospace' : '16px monospace';
        ctx.fillText(opt, GAME_WIDTH/2, 160 + i * 35);
    });
    
    // High score
    ctx.fillStyle = '#FFD700';
    ctx.font = '14px monospace';
    ctx.fillText(`HIGH SCORE: ${highScore}`, GAME_WIDTH/2, 280);
    
    // Credits
    ctx.fillStyle = '#888';
    ctx.font = '10px monospace';
    ctx.fillText('PRESS START', GAME_WIDTH/2, 305);
}

function drawFighterSelect(ctx) {
    drawBackground(ctx);
    
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SELECT FIGHTER', GAME_WIDTH/2, 40);
    
    // Fighter boxes
    const boxWidth = 90;
    const boxHeight = 100;
    const startX = 30;
    const spacing = 110;
    
    fighters.forEach((fighter, i) => {
        const x = startX + i * spacing;
        const y = 80;
        
        // Box
        ctx.fillStyle = fighterSelection === i ? '#0F0' : '#444';
        ctx.fillRect(x, y, boxWidth, boxHeight);
        ctx.strokeStyle = fighterSelection === i ? '#FF0' : '#888';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, boxWidth, boxHeight);
        
        // Fighter preview
        const previewFighter = new Fighter(x + boxWidth/2 - 20, y + 30, fighter);
        previewFighter.draw(ctx);
        
        // Name
        ctx.fillStyle = '#FFF';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        const stats = previewFighter.stats;
        ctx.fillText(stats.name.split(' ')[0], x + boxWidth/2, y + boxHeight - 25);
        ctx.fillText(stats.name.split(' ')[1], x + boxWidth/2, y + boxHeight - 15);
    });
    
    // Stats display
    const selectedStats = new Fighter(0, 0, fighters[fighterSelection]).stats;
    ctx.fillStyle = '#FFF';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`HEALTH: ${'█'.repeat(Math.floor(selectedStats.health / 20))}`, 30, 210);
    ctx.fillText(`SPEED:  ${'█'.repeat(Math.floor(selectedStats.speed))}`, 30, 230);
    ctx.fillText(`POWER:  ${'█'.repeat(Math.floor(selectedStats.power / 3))}`, 30, 250);
    
    // Confirm
    ctx.fillStyle = '#0F0';
    ctx.textAlign = 'center';
    ctx.fillText('PRESS A TO SELECT', GAME_WIDTH/2, 295);
}

function drawVersusScreen(ctx) {
    drawBackground(ctx);
    
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    
    if (player && enemy) {
        ctx.fillText(player.stats.name.toUpperCase(), GAME_WIDTH/4, 120);
        ctx.fillStyle = '#F00';
        ctx.font = 'bold 36px monospace';
        ctx.fillText('VS', GAME_WIDTH/2, 140);
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 24px monospace';
        ctx.fillText(enemy.stats.name.toUpperCase(), GAME_WIDTH * 3/4, 120);
        
        // Round number
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 20px monospace';
        ctx.fillText(`ROUND ${currentRound}`, GAME_WIDTH/2, 200);
        
        // Fight text animation
        if (frameCount % 30 < 15) {
            ctx.fillStyle = '#F00';
            ctx.font = 'bold 48px monospace';
            ctx.fillText('FIGHT!', GAME_WIDTH/2, 260);
        }
    }
}

function drawPauseMenu(ctx) {
    // Darken background
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    // Menu box
    ctx.fillStyle = '#333';
    ctx.fillRect(GAME_WIDTH/2 - 100, 60, 200, 200);
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 3;
    ctx.strokeRect(GAME_WIDTH/2 - 100, 60, 200, 200);
    
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', GAME_WIDTH/2, 90);
    
    const options = ['RESUME', 'TRAINING: ' + (gameMode === 'TRAINING' ? 'ON' : 'OFF'), 
                     'COMBO LIST', 'PRACTICE SPECIAL', 'MUTE: ' + (audioMuted ? 'ON' : 'OFF'), 
                     'QUIT'];
    
    options.forEach((opt, i) => {
        ctx.fillStyle = pauseSelection === i ? '#0F0' : '#FFF';
        ctx.font = pauseSelection === i ? 'bold 12px monospace' : '12px monospace';
        ctx.fillText(opt, GAME_WIDTH/2, 120 + i * 25);
    });
}

function drawComboList(ctx) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('COMBO LIST', GAME_WIDTH/2, 30);
    
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    
    const combos = [
        'BASIC ATTACKS:',
        '  A = Punch',
        '  B = Kick',
        '',
        'SPECIAL MOVES:',
        '  ↓→ + A = Projectile/Special',
        '  ↑↓ + B = Slam Attack',
        '',
        'DEFENSE:',
        '  HOLD BACK = Block',
        '  L/R = Guard Crush',
        '',
        'ULTIMATE:',
        '  L+R+A+B (Full Power)'
    ];
    
    combos.forEach((line, i) => {
        ctx.fillStyle = line.includes(':') ? '#FFD700' : '#FFF';
        ctx.fillText(line, 30, 55 + i * 16);
    });
    
    ctx.fillStyle = '#0F0';
    ctx.textAlign = 'center';
    ctx.fillText('PRESS START TO CLOSE', GAME_WIDTH/2, 305);
}

function drawTrainingHUD(ctx) {
    if (!trainingSettings.showInputs) return;
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(10, 200, 120, 80);
    
    ctx.fillStyle = '#0F0';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('INPUT DISPLAY:', 15, 215);
    
    ctx.fillStyle = '#FFF';
    let y = 230;
    if (player && player.inputBuffer.length > 0) {
        const recent = player.inputBuffer.slice(-4);
        recent.forEach(input => {
            ctx.fillText(input.input, 15, y);
            y += 12;
        });
    }
}

function drawGameOver(ctx, victory) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    ctx.fillStyle = victory ? '#0F0' : '#F00';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(victory ? 'VICTORY!' : 'DEFEAT', GAME_WIDTH/2, 120);
    
    ctx.fillStyle = '#FFF';
    ctx.font = '18px monospace';
    ctx.fillText(`SCORE: ${score}`, GAME_WIDTH/2, 170);
    
    if (score === highScore && score > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.fillText('NEW HIGH SCORE!', GAME_WIDTH/2, 200);
    }
    
    ctx.fillStyle = '#0F0';
    ctx.font = '14px monospace';
    ctx.fillText('PRESS START TO CONTINUE', GAME_WIDTH/2, 260);
}

function drawControls(ctx) {
    drawBackground(ctx);
    
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CONTROLS', GAME_WIDTH/2, 35);
    
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    
    const controls = [
        'D-PAD: Move, Jump (Up), Crouch (Down)',
        'HOLD BACK: Block',
        'A: Punch',
        'B: Kick',
        'L/R: Guard Crush',
        '',
        'SPECIALS:',
        '↓→ + A: Special Projectile',
        '↑↓ + B: Slam Attack',
        '',
        'ULTIMATE:',
        'L+R+A+B (when power meter full)',
        '',
        'START: Pause Menu'
    ];
    
    controls.forEach((line, i) => {
        ctx.fillStyle = line.includes(':') && !line.startsWith('↓') ? '#FFD700' : '#FFF';
        ctx.fillText(line, 25, 60 + i * 16);
    });
    
    ctx.fillStyle = '#0F0';
    ctx.textAlign = 'center';
    ctx.fillText('PRESS START TO RETURN', GAME_WIDTH/2, 305);
}

// ============================================
// MAIN GAME LOOP
// ============================================
function update() {
    frameCount++;
    
    // Screen shake decay
    if (screenShake > 0) screenShake *= 0.9;
    if (screenShake < 0.5) screenShake = 0;
    
    // Update particles
    updateParticles();
    
    switch(gameState) {
        case 'TITLE':
            if (inputState.UP && !prevInputState.UP) menuSelection = (menuSelection - 1 + 3) % 3;
            if (inputState.DOWN && !prevInputState.DOWN) menuSelection = (menuSelection + 1) % 3;
            if (inputState.A && !prevInputState.A) {
                playSound('select');
                if (menuSelection === 0) {
                    gameState = 'SELECT';
                    gameMode = 'ARCADE';
                } else if (menuSelection === 1) {
                    gameState = 'SELECT';
                    gameMode = 'TRAINING';
                } else if (menuSelection === 2) {
                    gameState = 'CONTROLS';
                }
            }
            break;
            
        case 'SELECT':
            if (inputState.LEFT && !prevInputState.LEFT) fighterSelection = (fighterSelection - 1 + 4) % 4;
            if (inputState.RIGHT && !prevInputState.RIGHT) fighterSelection = (fighterSelection + 1) % 4;
            if (inputState.A && !prevInputState.A) {
                playSound('select');
                selectedFighter = fighters[fighterSelection];
                resetGame();
                if (gameMode === 'ARCADE') {
                    startArcadeMatch();
                } else {
                    player = new Fighter(80, GROUND_Y - 60, selectedFighter, true);
                    enemy = new Fighter(GAME_WIDTH - 120, GROUND_Y - 60, 'burger', false);
                    aiController = new AIController(enemy, 1);
                    trainingSettings.infiniteHealth = true;
                    startRound();
                }
            }
            if (inputState.B && !prevInputState.B) {
                gameState = 'TITLE';
            }
            break;
            
        case 'FIGHTING':
        case 'TRAINING':
            handleInput();
            
            // Timer
            if (frameCount % 60 === 0 && roundTimer > 0) {
                roundTimer--;
                if (roundTimer === 0) {
                    // Time over - higher health wins
                    if (player.health > enemy.health) {
                        endRound(player);
                    } else if (enemy.health > player.health) {
                        endRound(enemy);
                    } else {
                        // Draw - both lose health
                        player.health -= 20;
                        enemy.health -= 20;
                        if (player.health <= 0) endRound(enemy);
                        else if (enemy.health <= 0) endRound(player);
                        else roundTimer = 30; // Sudden death
                    }
                }
            }
            
            if (player) player.update();
            if (enemy) {
                enemy.update();
                if (aiController && gameState === 'FIGHTING') {
                    aiController.update(player);
                }
            }
            
            checkCollisions();
            break;
            
        case 'PAUSE':
            if (inputState.UP && !prevInputState.UP) pauseSelection = (pauseSelection - 1 + 6) % 6;
            if (inputState.DOWN && !prevInputState.DOWN) pauseSelection = (pauseSelection + 1) % 6;
            if (inputState.A && !prevInputState.A) {
                playSound('select');
                switch(pauseSelection) {
                    case 0: // Resume
                        gameState = gameMode === 'TRAINING' ? 'TRAINING' : 'FIGHTING';
                        break;
                    case 1: // Toggle training
                        gameMode = gameMode === 'TRAINING' ? 'ARCADE' : 'TRAINING';
                        trainingSettings.infiniteHealth = gameMode === 'TRAINING';
                        break;
                    case 2: // Combo list
                        gameState = 'COMBO_LIST';
                        break;
                    case 3: // Practice special
                        trainingSettings.practiceSpecial = !trainingSettings.practiceSpecial;
                        if (player) player.power = player.maxPower;
                        break;
                    case 4: // Mute
                        audioMuted = !audioMuted;
                        if (audioMuted && bgmOscillator) {
                            bgmOscillator.stop();
                            bgmOscillator = null;
                        }
                        break;
                    case 5: // Quit
                        resetGame();
                        gameState = 'TITLE';
                        break;
                }
            }
            break;
            
        case 'COMBO_LIST':
            if (inputState.START && !prevInputState.START) {
                gameState = 'PAUSE';
            }
            break;
            
        case 'CONTROLS':
            if (inputState.START && !prevInputState.START) {
                gameState = 'TITLE';
            }
            break;
            
        case 'VICTORY':
        case 'DEFEAT':
            if (inputState.START && !prevInputState.START) {
                gameState = 'TITLE';
                resetGame();
            }
            break;
    }
}

function draw() {
    // Clear canvas
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    // Apply screen shake
    ctx.save();
    if (screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * screenShake;
        const shakeY = (Math.random() - 0.5) * screenShake;
        ctx.translate(shakeX, shakeY);
    }
    
    switch(gameState) {
        case 'TITLE':
            drawTitleScreen(ctx);
            break;
            
        case 'SELECT':
            drawFighterSelect(ctx);
            break;
            
        case 'VERSUS':
            drawVersusScreen(ctx);
            break;
            
        case 'FIGHTING':
        case 'TRAINING':
        case 'ROUND_END':
            drawBackground(ctx);
            if (player) player.draw(ctx);
            if (enemy) enemy.draw(ctx);
            drawParticles(ctx);
            drawHUD(ctx);
            if (gameState === 'TRAINING') drawTrainingHUD(ctx);
            break;
            
        case 'PAUSE':
            drawBackground(ctx);
            if (player) player.draw(ctx);
            if (enemy) enemy.draw(ctx);
            drawHUD(ctx);
            drawPauseMenu(ctx);
            break;
            
        case 'COMBO_LIST':
            drawBackground(ctx);
            drawComboList(ctx);
            break;
            
        case 'CONTROLS':
            drawControls(ctx);
            break;
            
        case 'VICTORY':
            drawBackground(ctx);
            if (player) player.draw(ctx);
            drawHUD(ctx);
            drawGameOver(ctx, true);
            break;
            
        case 'DEFEAT':
            drawBackground(ctx);
            if (enemy) enemy.draw(ctx);
            drawHUD(ctx);
            drawGameOver(ctx, false);
            break;
    }
    
    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// ============================================
// KEYBOARD INPUT (for testing)
// ============================================
window.addEventListener('keydown', (e) => {
    const keyMap = {
        'ArrowUp': 'UP',
        'ArrowDown': 'DOWN',
        'ArrowLeft': 'LEFT',
        'ArrowRight': 'RIGHT',
        'z': 'A',
        'x': 'B',
        'a': 'L',
        's': 'R',
        'Enter': 'START',
        'Shift': 'SELECT'
    };
    
    if (keyMap[e.key]) {
        inputState[keyMap[e.key]] = true;
        if (!audioCtx) initAudio();
    }
});

window.addEventListener('keyup', (e) => {
    const keyMap = {
        'ArrowUp': 'UP',
        'ArrowDown': 'DOWN',
        'ArrowLeft': 'LEFT',
        'ArrowRight': 'RIGHT',
        'z': 'A',
        'x': 'B',
        'a': 'L',
        's': 'R',
        'Enter': 'START',
        'Shift': 'SELECT'
    };
    
    if (keyMap[e.key]) {
        inputState[keyMap[e.key]] = false;
    }
});

// ============================================
// INITIALIZATION
// ============================================
loadGameState();
gameLoop();

</script>
