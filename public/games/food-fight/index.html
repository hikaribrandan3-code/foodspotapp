<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FOOD FIGHT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { 
            background: #0f0f23; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }
        #gameCanvas { 
            background: linear-gradient(180deg, #1a1a3e 0%, #0f0f23 100%);
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.5);
        }
        #ui {
            position: absolute;
            top: 5px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-size: 16px;
        }
        .health-bar {
            width: 150px;
            height: 20px;
            background: #333;
            border: 2px solid #666;
            border-radius: 10px;
            overflow: hidden;
        }
        .health-fill {
            height: 100%;
            transition: width 0.2s;
        }
        .p1-health { background: linear-gradient(90deg, #22C55E, #16A34A); }
        .p2-health { background: linear-gradient(90deg, #DC2626, #B91C1C); }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: white;
            display: none;
            border: 3px solid #DC2626;
        }
        #gameOver h2 { 
            color: #DC2626; 
            font-size: 32px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #DC2626;
        }
        #gameOver button {
            background: linear-gradient(180deg, #DC2626, #991B1B);
            border: none;
            padding: 15px 30px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            text-transform: uppercase;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div id="ui">
        <div>
            <div style="color: #22C55E; font-weight: bold;">BURGER BOY</div>
            <div class="health-bar"><div id="p1Health" class="health-fill p1-health" style="width: 100%"></div></div>
        </div>
        <div style="font-size: 24px; font-weight: bold; color: #FCD34D;">
            <span id="timer">60</span>
        </div>
        <div>
            <div style="color: #DC2626; font-weight: bold;">PIZZA PUNK</div>
            <div class="health-bar"><div id="p2Health" class="health-fill p2-health" style="width: 100%"></div></div>
        </div>
    </div>
    
    <div id="gameOver">
        <h2 id="winnerText">K.O.!</h2>
        <p id="resultText">Burger Boy Wins!</p>
        <button onclick="resetGame()">FIGHT AGAIN</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game state
let gameState = 'playing';
let score = 0;
let timeLeft = 60;
let round = 1;

// Fighters
const P1 = {
    x: 100, y: 200, width: 50, height: 70,
    color: '#F59E0B', // Burger boy
    health: 100, maxHealth: 100,
    vx: 0, vy: 0,
    isJumping: false,
    facing: 1, // 1 = right, -1 = left
    attackCooldown: 0,
    hitStun: 0,
    emoji: '🍔'
};

const P2 = {
    x: 330, y: 200, width: 50, height: 70,
    color: '#DC2626', // Pizza punk
    health: 100, maxHealth: 100,
    vx: 0, vy: 0,
    isJumping: false,
    facing: -1,
    attackCooldown: 0,
    hitStun: 0,
    emoji: '🍕'
};

// Projectiles
let projectiles = [];
let particles = [];

// Physics
const GRAVITY = 0.6;
const FRICTION = 0.8;
const GROUND_Y = 270;

// Controls
const keys = {};

class Projectile {
    constructor(x, y, vx, vy, owner, type) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.owner = owner;
        this.type = type;
        this.width = 25;
        this.height = 25;
        this.life = 120;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2; // slight gravity
        this.life--;

        // Ground bounce
        if (this.y > GROUND_Y) {
            this.y = GROUND_Y;
            this.vy *= -0.5;
        }
    }

    draw() {
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        const emoji = this.type === 'burger' ? '🥩' : '🍕';
        ctx.fillText(emoji, this.x, this.y);
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.color = color;
        this.life = 30;
        this.size = Math.random() * 8 + 4;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.3;
        this.life--;
        this.size *= 0.95;
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life / 30;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1;
    }
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 10; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function updateFighter(p, isAI = false) {
    if (p.hitStun > 0) {
        p.hitStun--;
        p.vx *= 0.9;
    } else if (!isAI) {
        // Player controls
        if (keys['ArrowLeft']) { p.vx = -4; p.facing = -1; }
        else if (keys['ArrowRight']) { p.vx = 4; p.facing = 1; }
        else { p.vx *= FRICTION; }

        if (keys['ArrowUp'] && !p.isJumping) {
            p.vy = -12;
            p.isJumping = true;
        }

        if (keys['Space'] && p.attackCooldown <= 0) {
            throwProjectile(p, 'burger');
            p.attackCooldown = 20;
        }
    } else {
        // Simple AI for P2
        const dist = P1.x - p.x;
        
        if (Math.abs(dist) > 150) {
            p.vx = Math.sign(dist) * 3;
            p.facing = Math.sign(dist);
        } else {
            p.vx *= FRICTION;
            if (p.attackCooldown <= 0 && Math.random() < 0.05) {
                throwProjectile(p, 'pizza');
                p.attackCooldown = 25;
            }
            if (Math.random() < 0.02 && !p.isJumping) {
                p.vy = -10;
                p.isJumping = true;
            }
        }
    }

    // Physics
    p.vy += GRAVITY;
    p.x += p.vx;
    p.y += p.vy;

    // Ground collision
    if (p.y + p.height > GROUND_Y) {
        p.y = GROUND_Y - p.height;
        p.vy = 0;
        p.isJumping = false;
    }

    // Wall collision
    if (p.x < 0) { p.x = 0; p.vx = 0; }
    if (p.x + p.width > 480) { p.x = 480 - p.width; p.vx = 0; }

    // Cooldowns
    if (p.attackCooldown > 0) p.attackCooldown--;
}

function throwProjectile(p, type) {
    const vx = p.facing * 8;
    const vy = -3;
    const x = p.facing > 0 ? p.x + p.width : p.x;
    const y = p.y + p.height / 2;
    projectiles.push(new Projectile(x, y, vx, vy, p, type));
}

function checkCollisions() {
    // Projectiles vs fighters
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const proj = projectiles[i];
        
        // Remove old projectiles
        if (proj.life <= 0 || proj.x < -50 || proj.x > 530) {
            projectiles.splice(i, 1);
            continue;
        }

        // Check hit on opponent
        const target = proj.owner === P1 ? P2 : P1;
        if (proj.x > target.x && proj.x < target.x + target.width &&
            proj.y > target.y && proj.y < target.y + target.height) {
            
            // Hit!
            target.health -= 8;
            target.hitStun = 15;
            target.vx = proj.vx * 0.5;
            createExplosion(proj.x, proj.y, target.color);
            projectiles.splice(i, 1);
            
            // Update UI
            updateHealthBars();
            
            // Score
            if (proj.owner === P1) {
                score += 50;
                window.parent.postMessage({ type: 'SCORE', score: score }, '*');
            }
        }
    }
}

function updateHealthBars() {
    document.getElementById('p1Health').style.width = (P1.health / P1.maxHealth * 100) + '%';
    document.getElementById('p2Health').style.width = (P2.health / P2.maxHealth * 100) + '%';
}

function drawFighter(p) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(p.x + p.width/2, GROUND_Y, p.width/2, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Character
    ctx.font = '50px Arial';
    ctx.textAlign = 'center';
    
    // Flip emoji if facing left
    ctx.save();
    ctx.translate(p.x + p.width/2, p.y + p.height/2);
    if (p.facing < 0) ctx.scale(-1, 1);
    ctx.fillText(p.emoji, 0, 15);
    ctx.restore();

    // Hit flash
    if (p.hitStun > 0 && p.hitStun % 4 < 2) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(p.x, p.y, p.width, p.height);
    }
}

function drawBackground() {
    // Floor
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, GROUND_Y, 480, 50);
    
    // Grid pattern on floor
    ctx.strokeStyle = 'rgba(100,100,150,0.3)';
    ctx.lineWidth = 1;
    for (let x = 0; x < 480; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y);
        ctx.lineTo(x - 20, 320);
        ctx.stroke();
    }

    // Neon lines
    ctx.strokeStyle = '#DC2626';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(480, GROUND_Y);
    ctx.stroke();
}

function gameOver(winner) {
    gameState = 'gameover';
    
    const p1Won = P1.health > P2.health;
    document.getElementById('winnerText').textContent = p1Won ? 'YOU WIN!' : 'K.O.!';
    document.getElementById('winnerText').style.color = p1Won ? '#22C55E' : '#DC2626';
    document.getElementById('resultText').textContent = p1Won ? 'Burger Boy is Champion!' : 'Pizza Punk Wins!';
    document.getElementById('gameOver').style.display = 'block';
    
    window.parent.postMessage({ type: 'GAME_OVER', score: score, won: p1Won }, '*');
}

function resetGame() {
    P1.health = 100; P1.x = 100; P1.y = 200; P1.vx = 0; P1.vy = 0;
    P2.health = 100; P2.x = 330; P2.y = 200; P2.vx = 0; P2.vy = 0;
    projectiles = [];
    particles = [];
    score = 0;
    timeLeft = 60;
    gameState = 'playing';
    document.getElementById('gameOver').style.display = 'none';
    updateHealthBars();
}

// Timer
setInterval(() => {
    if (gameState === 'playing' && timeLeft > 0) {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        
        if (timeLeft <= 0 || P1.health <= 0 || P2.health <= 0) {
            gameOver();
        }
    }
}, 1000);

// Game loop
function gameLoop() {
    if (gameState === 'paused') return;
    
    ctx.clearRect(0, 0, 480, 320);
    
    drawBackground();
    
    updateFighter(P1, false);
    updateFighter(P2, true);
    
    checkCollisions();
    
    // Update projectiles
    projectiles.forEach(p => p.update());
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    
    // Draw
    drawFighter(P1);
    drawFighter(P2);
    projectiles.forEach(p => p.draw());
    particles.forEach(p => p.draw());
    
    requestAnimationFrame(gameLoop);
}

// Input
document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
});

document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

// Touch controls
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * (480 / rect.width);
    
    if (x < 160) {
        keys['ArrowLeft'] = true;
        keys['ArrowRight'] = false;
    } else if (x > 320) {
        keys['ArrowRight'] = true;
        keys['ArrowLeft'] = false;
    } else {
        keys['ArrowUp'] = true;
    }
});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    keys['ArrowLeft'] = false;
    keys['ArrowRight'] = false;
    keys['ArrowUp'] = false;
});

// Double tap to attack
let lastTap = 0;
canvas.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 300) {
        keys['Space'] = true;
        setTimeout(() => keys['Space'] = false, 100);
    }
    lastTap = now;
});

// PostMessage API
window.addEventListener('message', (e) => {
    switch(e.data.type) {
        case 'PAUSE': gameState = 'paused'; break;
        case 'RESUME': gameState = 'playing'; gameLoop(); break;
        case 'SAVE_STATE':
            localStorage.setItem('foodFight_state', JSON.stringify({
                p1: {health: P1.health, x: P1.x, y: P1.y},
                p2: {health: P2.health, x: P2.x, y: P2.y},
                score: score, timeLeft: timeLeft
            }));
            break;
        case 'LOAD_STATE':
            const saved = localStorage.getItem('foodFight_state');
            if (saved) {
                const data = JSON.parse(saved);
                Object.assign(P1, data.p1);
                Object.assign(P2, data.p2);
                score = data.score;
                timeLeft = data.timeLeft;
            }
            break;
    }
});

// Start
gameLoop();
</script>
</body>
</html>
