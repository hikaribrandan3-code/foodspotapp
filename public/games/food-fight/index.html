<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>BURGER STACK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0a00}
#gc{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body><canvas id="gc"></canvas>
<script>
const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
let W,H,SC,game={},particles=[];

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W;cv.height=H;
  SC=Math.min(W/390,H/520);
}
resize();window.addEventListener('resize',resize);

const isHB=window.parent!==window;
const CW=390,CH=520;

let state='title',score=0,combo=0,maxCombo=0,stack=[],curBlock=null,blockY=0,blockW=120,blockH=30,speed=3,dir=1,camY=0;

const ING=[
  {c:'#FF9A3C',s:'#8B4513',name:'Bun'},
  {c:'#8B4513',s:'#3D1A00',name:'Patty'},
  {c:'#FFD600',s:'#B8860B',name:'Cheese'},
  {c:'#00D44A',s:'#006400',name:'Lettuce'},
  {c:'#FF2020',s:'#8B0000',name:'Tomato'},
  {c:'#E040FB',s:'#4B0082',name:'Onion'},
  {c:'#7B3F1E',s:'#2F1810',name:'Patty2'},
  {c:'#FFBC42',s:'#D2691E',name:'TopBun'}
];

function cx(x){return(W-CW*SC)/2+x*SC}
function cy(y){return(y-camY)*SC}
function rnd(a,b){return a+Math.random()*(b-a)}

class Particle{
  constructor(x,y,c){this.x=x;this.y=y;this.vx=rnd(-3,3);this.vy=rnd(-5,-2);this.c=c;this.life=1}
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.3;this.life-=0.02}
  draw(){ctx.globalAlpha=this.life;ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(cx(this.x),cy(this.y),5*SC,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}

function reset(){
  score=0;combo=0;stack=[];camY=0;blockW=160;blockY=400;
  stack.push({x:(CW-blockW)/2,y:450,w:blockW,h:blockH,i:0});
  spawnBlock();
}

function spawnBlock(){
  blockY=stack[0].y-100-camY;
  blockW=stack[stack.length-1].w;
  curBlock={x:50,y:blockY,w:blockW,h:blockH,i:stack.length%ING.length,age:0};
  speed=Math.min(6,2.5+score*0.1);
}

function drop(){
  if(!curBlock||state!=='play')return;
  const top=stack[stack.length-1];
  const overlap=Math.max(0,Math.min(curBlock.x+curBlock.w,top.x+top.w)-Math.max(curBlock.x,top.x));
  
  if(overlap<5){
    state='over';
    return;
  }
  
  const isPerfect=Math.abs(curBlock.x-top.x)<3;
  if(isPerfect){
    combo++;
    if(combo>maxCombo)maxCombo=combo;
    score+=1+Math.floor(combo/3);
    for(let i=0;i<8;i++)particles.push(new Particle(curBlock.x+curBlock.w/2,curBlock.y,ING[curBlock.i].c));
  }else{
    combo=0;score++;
    const sliceW=curBlock.w-overlap;
    if(curBlock.x<top.x){
      particles.push({x:curBlock.x,y:curBlock.y,w:sliceW,h:blockH,vx:-2,vy:0,rot:0,life:1,c:ING[curBlock.i].c,update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.5;this.rot-=0.1;this.life-=0.02},draw(){ctx.save();ctx.globalAlpha=this.life;ctx.translate(cx(this.x+this.w/2),cy(this.y+this.h/2));ctx.rotate(this.rot);ctx.fillStyle=this.c;ctx.fillRect(-this.w/2*SC,-this.h/2*SC,this.w*SC,this.h*SC);ctx.restore()}});
    }
    curBlock.w=overlap;
    curBlock.x=Math.max(curBlock.x,top.x);
  }
  
  stack.push({...curBlock,y:top.y-blockH+camY});
  curBlock=null;
  
  if(stack.length>8)camY+=blockH;
  
  setTimeout(spawnBlock,200);
}

function drawBlock(b,glow=false){
  const ing=ING[b.i%ING.length];
  const bx=cx(b.x),by=cy(b.y),bw=b.w*SC,bh=b.h*SC;
  
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(bx+4,by+4,bw,bh);
  
  if(glow){
    ctx.shadowColor=ing.c;ctx.shadowBlur=15;
  }
  
  const grd=ctx.createLinearGradient(bx,by,bx,by+bh);
  grd.addColorStop(0,ing.c);grd.addColorStop(1,ing.s);
  ctx.fillStyle=grd;
  
  if(b.i%ING.length===0||b.i%ING.length===7){
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,b.i%ING.length===7?[bh/2,bh/2,4,4]:[4,4,bh/2,bh/2]);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(bx+5,by+3,bw-10,bh*0.3);
  }else if(b.i%ING.length===2){
    ctx.beginPath();ctx.moveTo(bx-5,by+bh*0.4);ctx.quadraticCurveTo(bx-8,by+bh+8,bx+10,by+bh);ctx.lineTo(bx+bw-10,by+bh);ctx.quadraticCurveTo(bx+bw+8,by+bh+8,bx+bw+5,by+bh*0.4);ctx.lineTo(bx+bw,by);ctx.lineTo(bx,by);ctx.fill();
  }else if(b.i%ING.length===3){
    ctx.beginPath();ctx.moveTo(bx-5,by+bh/2);for(let i=0;i<=8;i++)ctx.lineTo(bx+bw/8*i,by+bh+(i%2===0?-2:4));ctx.lineTo(bx+bw+5,by+bh/2);ctx.lineTo(bx+bw,by);ctx.lineTo(bx,by);ctx.fill();
  }else{
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,4);ctx.fill();
  }
  
  ctx.shadowBlur=0;
  ctx.strokeStyle=ing.s;ctx.lineWidth=2;ctx.stroke();
  
  if(b.w>40){
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath();ctx.arc(bx+bw*0.25,by+bh*0.4,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(bx+bw*0.75,by+bh*0.4,3,0,Math.PI*2);ctx.fill();
  }
}

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a0a00');g.addColorStop(1,'#3d1f00');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  
  ctx.fillStyle='rgba(139,69,19,0.3)';
  for(let y=0;y<H;y+=40){
    ctx.fillRect(0,y,W,1);
    for(let x=0;x<W;x+=40)if((x+y)%80===0)ctx.fillRect(x,y,2,2);
  }
  
  ctx.fillStyle='#8B4513';
  ctx.fillRect(cx(0),cy(450+blockH),CW*SC,10*SC);
  ctx.fillStyle='#654321';
  for(let i=0;i<CW;i+=20)ctx.fillRect(cx(i),cy(450+blockH),10*SC,10*SC);
}

function drawTitle(){
  drawBG();
  
  ctx.save();
  ctx.translate(W/2,H*0.25);
  
  ctx.shadowColor='#FF6B00';ctx.shadowBlur=30;
  ctx.font=`900 ${60*SC}px Arial Black`;ctx.textAlign='center';
  ctx.strokeStyle='#FF4500';ctx.lineWidth=8;
  ctx.strokeText('BURGER',0,-20*SC);ctx.strokeText('STACK',0,50*SC);
  ctx.shadowBlur=0;
  
  const grd=ctx.createLinearGradient(-100,-40,100,60);
  grd.addColorStop(0,'#FFD700');grd.addColorStop(0.5,'#FF8C00');grd.addColorStop(1,'#FF4500');
  ctx.fillStyle=grd;
  ctx.fillText('BURGER',0,-20*SC);ctx.fillText('STACK',0,50*SC);
  
  ctx.strokeStyle='#000';ctx.lineWidth=3;
  ctx.strokeText('BURGER',0,-20*SC);ctx.strokeText('STACK',0,50*SC);
  
  ctx.font=`bold ${16*SC}px Arial`;ctx.fillStyle='#FFA500';
  ctx.fillText('バーガースタック',0,85*SC);
  
  const pulse=0.6+Math.sin(Date.now()/300)*0.4;
  ctx.fillStyle=`rgba(255,100,0,${pulse})`;
  ctx.beginPath();ctx.roundRect(-80*SC,110*SC,160*SC,35*SC,17*SC);ctx.fill();
  ctx.strokeStyle='#FFF';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#FFF';ctx.font=`bold ${18*SC}px Arial`;
  ctx.fillText('PRESS START',0,133*SC);
  
  ctx.restore();
  
  ctx.fillStyle='rgba(255,200,100,0.6)';ctx.font=`${12*SC}px Arial`;ctx.textAlign='center';
  ctx.fillText('A = DROP  |  START = PAUSE  |  SELECT = MENU',W/2,H-20);
}

function drawGame(){
  drawBG();
  
  stack.forEach(b=>drawBlock(b));
  
  if(curBlock){
    curBlock.x+=dir*speed;
    if(curBlock.x<=20||curBlock.x+curBlock.w>=CW-20)dir*=-1;
    
    const top=stack[stack.length-1];
    ctx.globalAlpha=0.3;ctx.fillStyle='#FFD700';
    ctx.fillRect(cx(curBlock.x),cy(top.y-blockH),curBlock.w*SC,blockH*SC);
    ctx.globalAlpha=1;
    
    drawBlock(curBlock);
    
    ctx.fillStyle='#FFD700';ctx.font=`bold ${24*SC}px Arial`;ctx.textAlign='center';
    ctx.fillText('▼',cx(curBlock.x+curBlock.w/2),cy(curBlock.y-10));
  }
  
  particles.forEach((p,i)=>{p.update();p.draw();if(p.life<=0)particles.splice(i,1)});
  
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.roundRect(cx(10),10,120*SC,50*SC,10);ctx.fill();
  ctx.strokeStyle='#FF8C00';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#FF8C00';ctx.font=`bold ${14*SC}px Arial`;ctx.textAlign='left';
  ctx.fillText('SCORE',cx(20),30);
  ctx.fillStyle='#FFF';ctx.font=`900 ${22*SC}px Arial Black`;
  ctx.fillText(score,cx(20),55);
  
  if(combo>1){
    ctx.fillStyle='#FFD700';ctx.font=`900 ${18*SC}px Arial Black`;ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText(`COMBO x${combo}`,W/2,80);
    ctx.fillText(`COMBO x${combo}`,W/2,80);
  }
  
  if(state==='paused'){
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FFD700';ctx.font=`900 ${36*SC}px Arial Black`;ctx.textAlign='center';
    ctx.fillText('PAUSED',W/2,H/2);
    ctx.font=`${14*SC}px Arial`;ctx.fillStyle='#AAA';
    ctx.fillText('PRESS START TO RESUME',W/2,H/2+40);
  }
}

function drawOver(){
  drawGame();
  ctx.fillStyle='rgba(0,0,0,0.9)';ctx.fillRect(0,0,W,H);
  
  ctx.save();ctx.translate(W/2,H*0.4);
  ctx.fillStyle='#FF4500';ctx.font=`900 ${32*SC}px Arial Black`;ctx.textAlign='center';
  ctx.fillText('GAME OVER',0,0);
  
  ctx.fillStyle='#FFF';ctx.font=`bold ${20*SC}px Arial`;
  ctx.fillText(`Score: ${score}`,0,40*SC);
  ctx.fillText(`Best Combo: ${maxCombo}`,0,70*SC);
  
  const stars=score>=30?'⭐⭐⭐':score>=15?'⭐⭐':'⭐';
  ctx.font=`${30*SC}px Arial`;ctx.fillText(stars,0,110*SC);
  
  const pulse=0.5+Math.sin(Date.now()/400)*0.5;
  ctx.fillStyle=`rgba(255,200,0,${pulse})`;ctx.font=`bold ${16*SC}px Arial`;
  ctx.fillText('PRESS START TO RETRY',0,150*SC);
  ctx.restore();
}

function loop(){
  if(state==='title')drawTitle();
  else if(state==='play'||state==='paused')drawGame();
  else if(state==='over')drawOver();
  requestAnimationFrame(loop);
}

window.addEventListener('message',(e)=>{
  if(e.data.type==='BUTTON_PRESS'){
    const btn=e.data.button;
    if(btn==='start'){
      if(state==='title'){reset();state='play';}
      else if(state==='play')state='paused';
      else if(state==='paused')state='play';
      else if(state==='over'){state='title';}
    }
    if(btn==='a'||btn==='b'){
      if(state==='title'){reset();state='play';}
      else if(state==='play')drop();
      else if(state==='paused')state='play';
      else if(state==='over')state='title';
    }
    if(btn==='select'){
      if(window.parent!==window)window.parent.postMessage({type:'NAVIGATE',to:'gameSelect'},'*');
    }
  }
});

cv.addEventListener('touchstart',(e)=>{
  e.preventDefault();
  if(state==='title'){reset();state='play';}
  else if(state==='play')drop();
  else if(state==='paused')state='play';
  else if(state==='over')state='title';
},{passive:false});

cv.addEventListener('click',()=>{
  if(state==='title'){reset();state='play';}
  else if(state==='play')drop();
  else if(state==='paused')state='play';
  else if(state==='over')state='title';
});

loop();
</script>
</body>
</html>
