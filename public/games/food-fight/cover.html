<!DOCTYPE html>
<html>
<head>
<style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#000}
canvas{border:1px solid #333}
</style>
</head>
<body>
<canvas id="c" width="390" height="520"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=390,H=520;

// Background
const g=x.createLinearGradient(0,0,0,H);
g.addColorStop(0,'#1a0a00');g.addColorStop(1,'#3d1f00');
x.fillStyle=g;x.fillRect(0,0,W,H);

// Kitchen tile pattern
x.fillStyle='rgba(139,69,19,0.2)';
for(let y=0;y<H;y+=30){
  x.fillRect(0,y,W,1);
  for(let i=0;i<W;i+=30)x.fillRect(i,y,1,30);
}

// Big stacked burger in center
const cx=W/2,cy=H*0.45,bw=200;
const layers=[
  {c:'#FFBC42',h:35,r:[15,15,5,5]},
  {c:'#00D44A',h:15,r:[0,0,8,8]},
  {c:'#FF2020',h:20,r:[10,10,10,10]},
  {c:'#FFD600',h:18,r:[0,0,0,0]},
  {c:'#8B4513',h:28,r:[14,14,14,14]},
  {c:'#E040FB',h:15,r:[8,8,8,8]},
  {c:'#7B3F1E',h:28,r:[14,14,14,14]},
  {c:'#FF9A3C',h:35,r:[5,5,15,15]}
];

let ly=cy+80;
for(let i=layers.length-1;i>=0;i--){
  const l=layers[i];
  const grd=x.createLinearGradient(cx-bw/2,ly-l.h,cx+bw/2,ly);
  grd.addColorStop(0,l.c);grd.addColorStop(1,shade(l.c,-30));
  x.fillStyle=grd;
  x.beginPath();
  x.roundRect(cx-bw/2,ly-l.h,bw,l.h,l.r);
  x.fill();
  x.strokeStyle=shade(l.c,-50);x.lineWidth=3;x.stroke();
  ly-=l.h-2;
}

function shade(c,p){
  const n=parseInt(c.slice(1),16),r=(n>>16)+p,g=((n>>8)&255)+p,b=(n&255)+p;
  return`#${(Math.max(0,Math.min(255,r))<<16|Math.max(0,Math.min(255,g))<<8|Math.max(0,Math.min(255,b))).toString(16).padStart(6,'0')}`;
}

// Title
x.shadowColor='#FF4500';x.shadowBlur=25;
x.font='900 52px Arial Black';x.textAlign='center';
x.strokeStyle='#FF4500';x.lineWidth=10;
x.strokeText('BURGER',cx,ly-30);
x.strokeText('STACK',cx,ly+35);
x.shadowBlur=0;

const tgrd=x.createLinearGradient(cx-120,0,cx+120,0);
tgrd.addColorStop(0,'#FFD700');tgrd.addColorStop(0.5,'#FF8C00');tgrd.addColorStop(1,'#FF4500');
x.fillStyle=tgrd;
x.fillText('BURGER',cx,ly-30);
x.fillText('STACK',cx,ly+35);

x.strokeStyle='#000';x.lineWidth=3;
x.strokeText('BURGER',cx,ly-30);
x.strokeText('STACK',cx,ly+35);

// Japanese subtitle
x.fillStyle='#FF8C00';x.font='bold 16px Arial';
x.fillText('バーガースタック',cx,ly+65);

// Fire effects
for(let i=0;i<5;i++){
  x.fillStyle=`hsla(${20+i*10},100%,50%,0.6)`;
  x.beginPath();
  x.moveTo(cx-100+i*40,ly+90);
  x.lineTo(cx-80+i*40,ly-20);
  x.lineTo(cx-60+i*40,ly+90);
  x.fill();
}

// Stars
for(let i=0;i<10;i++){
  const sx=rnd(20,W-20),sy=rnd(20,H-20),sz=rnd(10,25);
  x.fillStyle='#FFD700';
  x.save();x.translate(sx,sy);x.rotate(Date.now()/1000+i);
  drawStar(0,0,sz/2,sz,5);x.restore();
}

function drawStar(cx,cy,ir,or,p){
  x.beginPath();
  for(let i=0;i<p*2;i++){
    const r=i%2===0?or:ir,a=Math.PI*i/p-Math.PI/2;
    x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
  }
  x.closePath();x.fill();
}

function rnd(a,b){return a+Math.random()*(b-a)}

// Play button hint
x.fillStyle='rgba(255,255,255,0.8)';
x.font='bold 14px Arial';x.textAlign='center';
x.fillText('▶ TAP TO PLAY',cx,H-40);

// Save
const link=document.createElement('a');
link.download='cover.png';
link.href=c.toDataURL();
link.click();
</script>
</body>
</html>
