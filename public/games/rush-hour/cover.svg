<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#622882"/>
      <stop offset="55%" stop-color="#f45a82"/>
      <stop offset="100%" stop-color="#ffb060"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" fill="url(#sky)"/>
  <!-- banded retro sun -->
  <g>
    <circle cx="160" cy="128" r="52" fill="#ffe878"/>
    <rect x="104" y="118" width="112" height="4" fill="#f45a82"/>
    <rect x="104" y="130" width="112" height="6" fill="#f45a82"/>
    <rect x="104" y="144" width="112" height="8" fill="#f45a82"/>
  </g>
  <!-- mountains -->
  <path d="M0 140 L45 110 L90 138 L140 104 L190 140 L240 112 L290 138 L320 120 L320 150 L0 150 Z" fill="#3a1650"/>
  <!-- ground -->
  <rect x="0" y="148" width="320" height="172" fill="#2a1240"/>
  <!-- road in perspective -->
  <path d="M160 150 L60 320 L260 320 Z" fill="#241d2c"/>
  <path d="M160 150 L56 320 L48 320 L158 150 Z" fill="#e5484d"/>
  <path d="M160 150 L264 320 L272 320 L162 150 Z" fill="#e5484d"/>
  <!-- cyan lane dashes -->
  <g fill="#3ef2e0">
    <rect x="126" y="240" width="7" height="22" transform="skewX(-8)"/>
    <rect x="139" y="192" width="5" height="14" transform="skewX(-8)"/>
    <rect x="205" y="240" width="7" height="22" transform="skewX(6)"/>
    <rect x="190" y="192" width="5" height="14" transform="skewX(6)"/>
    <rect x="156" y="164" width="3" height="8"/>
  </g>
  <!-- delivery car rear view -->
  <g>
    <ellipse cx="160" cy="298" rx="52" ry="8" fill="rgba(0,0,0,.4)"/>
    <rect x="118" y="284" width="14" height="12" fill="#14141c"/>
    <rect x="188" y="284" width="14" height="12" fill="#14141c"/>
    <rect x="116" y="260" width="88" height="30" fill="#d92b32"/>
    <rect x="116" y="260" width="88" height="6" fill="#f4494f"/>
    <rect x="126" y="242" width="68" height="20" fill="#c0242c"/>
    <rect x="132" y="245" width="56" height="13" fill="#1a2334"/>
    <rect x="118" y="268" width="10" height="7" fill="#ff5f57"/>
    <rect x="192" y="268" width="10" height="7" fill="#ff5f57"/>
    <rect x="150" y="274" width="20" height="9" fill="#e8e2d6"/>
    <rect x="134" y="222" width="52" height="18" fill="#ffd843"/>
    <text x="160" y="235" font-family="Courier New, monospace" font-weight="bold" font-size="9" fill="#b3245e" text-anchor="middle">FOODSPOT</text>
  </g>
  <text x="160" y="42" font-family="Courier New, monospace" font-weight="bold" font-size="34" fill="#ffd843" text-anchor="middle" stroke="#b3245e" stroke-width="1.5" letter-spacing="1">RUSH</text>
  <text x="160" y="76" font-family="Courier New, monospace" font-weight="bold" font-size="34" fill="#fff" text-anchor="middle" stroke="#b3245e" stroke-width="1.5" letter-spacing="1">HOUR</text>
  <rect x="0" y="0" width="320" height="320" fill="none" stroke="#ffd843" stroke-width="4"/>
</svg>
