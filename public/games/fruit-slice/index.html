<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Slice - MunchBoy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', Arial, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 480px;
            height: 320px;
            box-shadow: 0 0 30px rgba(255, 100, 50, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
    </div>

    <script>
        // ============================================
        // FRUIT SLICE - Complete Game
        // ============================================
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game Constants
        const GAME_WIDTH = 480;
        const GAME_HEIGHT = 320;
        const GRAVITY = 0.25;
        const ROUND_TIME = 60;
        
        // Fruit Types with point values
        const FRUIT_TYPES = {
            APPLE: { name: 'apple', color: '#ff4444', points: 10, radius: 18, weight: 1.2 },
            ORANGE: { name: 'orange', color: '#ff8800', points: 15, radius: 16, weight: 1.0 },
            WATERMELON: { name: 'watermelon', color: '#44aa44', points: 25, radius: 24, weight: 0.7 },
            BANANA: { name: 'banana', color: '#ffdd00', points: 20, radius: 14, weight: 0.9 },
            PINEAPPLE: { name: 'pineapple', color: '#ffaa00', points: 30, radius: 20, weight: 0.6 },
            KIWI: { name: 'kiwi', color: '#88aa44', points: 15, radius: 12, weight: 1.1 },
            BOMB: { name: 'bomb', color: '#333333', points: -50, radius: 20, weight: 0.8 }
        };
        
        // Game State
        let gameState = 'title'; // title, playing, paused, gameover
        let score = 0;
        let highScore = 0;
        let timeRemaining = ROUND_TIME;
        let combo = 0;
        let comboTimer = 0;
        let maxCombo = 0;
        
        // Power-ups
        let sugarRushActive = false;
        let sugarRushTimer = 0;
        let sugarRushCooldown = 0;
        let blenderBombCooldown = 0;
        
        // Time scale for slow motion
        let timeScale = 1.0;
        
        // Input State (PostMessage API)
        const inputState = {
            UP: false, DOWN: false, LEFT: false, RIGHT: false,
            A: false, B: false, X: false, Y: false,
            L: false, R: false, START: false, SELECT: false
        };
        
        // Audio State
        let audioMuted = false;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Game Objects
        let fruits = [];
        let particles = [];
        let trail = [];
        let floatingTexts = [];
        
        // Sword/Cursor
        const sword = {
            x: GAME_WIDTH / 2,
            y: GAME_HEIGHT / 2,
            prevX: GAME_WIDTH / 2,
            prevY: GAME_HEIGHT / 2,
            speed: 6,
            isSlicing: false,
            sliceTimer: 0
        };
        
        // Spawn Timer
        let spawnTimer = 0;
        let spawnInterval = 45;
        
        // Background pattern
        let bgPattern = null;
        
        // ============================================
        // AUDIO SYSTEM
        // ============================================
        
        function playSound(type, frequency = 440, duration = 0.1) {
            if (audioMuted) return;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            switch(type) {
                case 'slice':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.1);
                    break;
                    
                case 'splatter':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.15);
                    break;
                    
                case 'bomb':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.4, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.3);
                    break;
                    
                case 'sugarRush':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.5);
                    break;
                    
                case 'blender':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, audioContext.currentTime);
                    for (let i = 0; i < 5; i++) {
                        osc.frequency.setValueAtTime(400 + i * 100, audioContext.currentTime + i * 0.05);
                    }
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.3);
                    break;
                    
                case 'combo':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.2);
                    break;
                    
                case 'select':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioContext.currentTime);
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.1);
                    break;
            }
        }
        
        // Background music loop
        let musicInterval = null;
        function startMusic() {
            if (musicInterval) clearInterval(musicInterval);
            let noteIndex = 0;
            const melody = [262, 330, 392, 523, 392, 330, 262, 196];
            musicInterval = setInterval(() => {
                if (audioMuted || gameState !== 'playing') return;
                const freq = melody[noteIndex % melody.length];
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioContext.currentTime);
                gain.gain.setValueAtTime(0.08, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                osc.start();
                osc.stop(audioContext.currentTime + 0.3);
                noteIndex++;
            }, 400);
        }
        
        function stopMusic() {
            if (musicInterval) {
                clearInterval(musicInterval);
                musicInterval = null;
            }
        }
        
        // ============================================
        // POSTMESSAGE API
        // ============================================
        
        window.addEventListener('message', (e) => {
            const {type, button, state} = e.data;
            if (type === 'button' && button in inputState) {
                inputState[button] = state;
                
                // Handle button press events
                if (state === true) {
                    handleButtonPress(button);
                }
            }
            if (type === 'mute') audioMuted = true;
        });
        
        function handleButtonPress(button) {
            if (gameState === 'title') {
                if (button === 'A' || button === 'START') {
                    startGame();
                }
                return;
            }
            
            if (gameState === 'gameover') {
                if (button === 'A' || button === 'START') {
                    resetGame();
                    gameState = 'title';
                }
                return;
            }
            
            if (gameState === 'playing') {
                if (button === 'START') {
                    pauseGame();
                    return;
                }
                
                if (button === 'A') {
                    sword.isSlicing = true;
                    sword.sliceTimer = 10;
                }
                
                if (button === 'B' && blenderBombCooldown <= 0) {
                    activateBlenderBomb();
                }
                
                if ((button === 'L' || button === 'R') && sugarRushCooldown <= 0) {
                    activateSugarRush();
                }
            }
            
            if (gameState === 'paused') {
                if (button === 'START' || button === 'A') {
                    resumeGame();
                }
                if (button === 'B') {
                    resetGame();
                    gameState = 'title';
                }
                return;
            }
        }
        
        function reportScore(score) {
            parent.postMessage({type: 'score', value: score}, '*');
        }
        
        function saveGameState() {
            localStorage.setItem('munchboy_save_fruitslice', JSON.stringify({
                score, highScore, timestamp: Date.now()
            }));
        }
        
        function loadGameState() {
            const saved = localStorage.getItem('munchboy_save_fruitslice');
            if (saved) {
                const data = JSON.parse(saved);
                highScore = data.highScore || 0;
            }
        }
        
        // ============================================
        // GAME CLASSES
        // ============================================
        
        class Fruit {
            constructor() {
                const rand = Math.random();
                if (rand < 0.15) {
                    this.type = FRUIT_TYPES.BOMB;
                } else {
                    const types = ['APPLE', 'ORANGE', 'WATERMELON', 'BANANA', 'PINEAPPLE', 'KIWI'];
                    this.type = FRUIT_TYPES[types[Math.floor(Math.random() * types.length)]];
                }
                
                this.x = 40 + Math.random() * (GAME_WIDTH - 80);
                this.y = GAME_HEIGHT + 30;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = -(6 + Math.random() * 4);
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                this.sliced = false;
                this.radius = this.type.radius;
            }
            
            update() {
                this.vy += GRAVITY * timeScale;
                this.x += this.vx * timeScale;
                this.y += this.vy * timeScale;
                this.rotation += this.rotationSpeed * timeScale;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                if (this.type.name === 'bomb') {
                    // Draw bomb
                    ctx.fillStyle = '#222';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Spark effect
                    ctx.fillStyle = '#ff4400';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Fuse
                    ctx.strokeStyle = '#888';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius);
                    ctx.quadraticCurveTo(5, -this.radius - 8, 8, -this.radius - 5);
                    ctx.stroke();
                    
                    // Spark
                    if (Math.random() > 0.5) {
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(8, -this.radius - 5, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    // Draw fruit
                    ctx.fillStyle = this.type.color;
                    ctx.beginPath();
                    
                    if (this.type.name === 'banana') {
                        // Banana shape
                        ctx.ellipse(0, 0, this.radius * 1.5, this.radius * 0.6, 0, 0, Math.PI * 2);
                    } else if (this.type.name === 'pineapple') {
                        // Pineapple shape
                        ctx.ellipse(0, 0, this.radius * 0.9, this.radius * 1.2, 0, 0, Math.PI * 2);
                    } else {
                        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    }
                    ctx.fill();
                    
                    // Inner detail
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Fruit-specific details
                    if (this.type.name === 'watermelon') {
                        ctx.strokeStyle = '#228822';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius - 2, 0, Math.PI * 2);
                        ctx.stroke();
                    } else if (this.type.name === 'kiwi') {
                        ctx.fillStyle = '#ccff66';
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#333';
                        for (let i = 0; i < 8; i++) {
                            const angle = (i / 8) * Math.PI * 2;
                            ctx.beginPath();
                            ctx.arc(Math.cos(angle) * 5, Math.sin(angle) * 5, 1.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
                
                ctx.restore();
            }
        }
        
        class Particle {
            constructor(x, y, color, isJuice = true) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.color = color;
                this.life = 1.0;
                this.decay = 0.02 + Math.random() * 0.02;
                this.size = 3 + Math.random() * 5;
                this.isJuice = isJuice;
            }
            
            update() {
                this.vy += GRAVITY * 0.5 * timeScale;
                this.x += this.vx * timeScale;
                this.y += this.vy * timeScale;
                this.life -= this.decay * timeScale;
            }
            
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.isJuice) {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                } else {
                    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                }
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        class FloatingText {
            constructor(x, y, text, color, size = 20) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.size = size;
                this.life = 1.0;
                this.vy = -2;
            }
            
            update() {
                this.y += this.vy * timeScale;
                this.life -= 0.02 * timeScale;
            }
            
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.font = `bold ${this.size}px Arial Black`;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1;
            }
        }
        
        // ============================================
        // GAME FUNCTIONS
        // ============================================
        
        function createBackground() {
            const bgCanvas = document.createElement('canvas');
            bgCanvas.width = GAME_WIDTH;
            bgCanvas.height = GAME_HEIGHT;
            const bgCtx = bgCanvas.getContext('2d');
            
            // Kitchen background
            const gradient = bgCtx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            gradient.addColorStop(0, '#2a2a4a');
            gradient.addColorStop(0.5, '#3a3a5a');
            gradient.addColorStop(1, '#4a4a6a');
            bgCtx.fillStyle = gradient;
            bgCtx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // Tiles
            bgCtx.strokeStyle = 'rgba(100, 100, 120, 0.3)';
            bgCtx.lineWidth = 1;
            for (let x = 0; x < GAME_WIDTH; x += 40) {
                bgCtx.beginPath();
                bgCtx.moveTo(x, 0);
                bgCtx.lineTo(x, GAME_HEIGHT);
                bgCtx.stroke();
            }
            for (let y = 0; y < GAME_HEIGHT; y += 40) {
                bgCtx.beginPath();
                bgCtx.moveTo(0, y);
                bgCtx.lineTo(GAME_WIDTH, y);
                bgCtx.stroke();
            }
            
            // Countertop
            bgCtx.fillStyle = '#5a5a6a';
            bgCtx.fillRect(0, GAME_HEIGHT - 40, GAME_WIDTH, 40);
            bgCtx.fillStyle = '#6a6a7a';
            bgCtx.fillRect(0, GAME_HEIGHT - 40, GAME_WIDTH, 5);
            
            return bgCanvas;
        }
        
        function spawnFruit() {
            fruits.push(new Fruit());
        }
        
        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, true));
            }
        }
        
        function createExplosion(x, y) {
            for (let i = 0; i < 20; i++) {
                const colors = ['#ff4400', '#ff8800', '#ffaa00', '#888888'];
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], false));
            }
        }
        
        function checkSlice() {
            if (!sword.isSlicing) return;
            
            const dx = sword.x - sword.prevX;
            const dy = sword.y - sword.prevY;
            const sliceLength = Math.sqrt(dx * dx + dy * dy);
            
            if (sliceLength < 5) return;
            
            let fruitsSliced = 0;
            
            fruits.forEach(fruit => {
                if (fruit.sliced) return;
                
                // Check intersection with slice line
                const dist = pointToLineDistance(fruit.x, fruit.y, sword.prevX, sword.prevY, sword.x, sword.y);
                
                if (dist < fruit.radius + 10) {
                    fruit.sliced = true;
                    
                    if (fruit.type.name === 'bomb') {
                        // Hit bomb
                        score = Math.max(0, score - 50);
                        createExplosion(fruit.x, fruit.y);
                        playSound('bomb');
                        floatingTexts.push(new FloatingText(fruit.x, fruit.y - 20, '-50', '#ff4444', 24));
                        combo = 0;
                    } else {
                        // Slice fruit
                        fruitsSliced++;
                        score += fruit.type.points;
                        createParticles(fruit.x, fruit.y, fruit.type.color, 10);
                        playSound('splatter');
                        
                        // Create sliced fruit halves
                        createSlicedFruit(fruit);
                    }
                }
            });
            
            if (fruitsSliced > 0) {
                playSound('slice');
                
                if (fruitsSliced > 1) {
                    // Combo!
                    combo += fruitsSliced;
                    comboTimer = 60;
                    const bonus = fruitsSliced * 5;
                    score += bonus;
                    playSound('combo');
                    floatingTexts.push(new FloatingText(sword.x, sword.y - 30, `${fruitsSliced}x COMBO! +${bonus}`, '#ffff00', 22));
                } else {
                    combo = 0;
                }
            }
        }
        
        function createSlicedFruit(fruit) {
            // Visual effect - create particles that look like fruit pieces
            for (let i = 0; i < 6; i++) {
                const p = new Particle(fruit.x, fruit.y, fruit.type.color, false);
                p.vx = (Math.random() - 0.5) * 10;
                p.vy = (Math.random() - 0.5) * 10;
                p.size = 8 + Math.random() * 8;
                particles.push(p);
            }
        }
        
        function pointToLineDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1;
            const B = py - y1;
            const C = x2 - x1;
            const D = y2 - y1;
            
            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;
            
            if (lenSq !== 0) param = dot / lenSq;
            
            let xx, yy;
            
            if (param < 0) {
                xx = x1;
                yy = y1;
            } else if (param > 1) {
                xx = x2;
                yy = y2;
            } else {
                xx = x1 + param * C;
                yy = y1 + param * D;
            }
            
            const dx = px - xx;
            const dy = py - yy;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        function activateSugarRush() {
            sugarRushActive = true;
            sugarRushTimer = 300; // 5 seconds at 60fps
            sugarRushCooldown = 900; // 15 seconds cooldown
            timeScale = 0.3;
            playSound('sugarRush');
            floatingTexts.push(new FloatingText(GAME_WIDTH/2 - 60, GAME_HEIGHT/2, 'SUGAR RUSH!', '#ff88ff', 28));
        }
        
        function activateBlenderBomb() {
            blenderBombCooldown = 600; // 10 seconds cooldown
            playSound('blender');
            
            let fruitsCleared = 0;
            fruits.forEach(fruit => {
                if (!fruit.sliced && fruit.type.name !== 'bomb') {
                    fruit.sliced = true;
                    fruitsCleared++;
                    score += fruit.type.points;
                    createParticles(fruit.x, fruit.y, fruit.type.color, 8);
                }
            });
            
            if (fruitsCleared > 0) {
                floatingTexts.push(new FloatingText(GAME_WIDTH/2 - 50, GAME_HEIGHT/2, `BLENDER! +${fruitsCleared * 10}`, '#ff88ff', 26));
                score += fruitsCleared * 10;
            }
        }
        
        function updateSword() {
            sword.prevX = sword.x;
            sword.prevY = sword.y;
            
            // Move sword with D-PAD
            if (inputState.LEFT) sword.x -= sword.speed;
            if (inputState.RIGHT) sword.x += sword.speed;
            if (inputState.UP) sword.y -= sword.speed;
            if (inputState.DOWN) sword.y += sword.speed;
            
            // Clamp to screen
            sword.x = Math.max(10, Math.min(GAME_WIDTH - 10, sword.x));
            sword.y = Math.max(10, Math.min(GAME_HEIGHT - 10, sword.y));
            
            // Update trail
            if (sword.isSlicing || trail.length > 0) {
                trail.push({ x: sword.x, y: sword.y, life: 1.0 });
            }
            
            // Update trail life
            trail = trail.filter(t => {
                t.life -= 0.1 * timeScale;
                return t.life > 0;
            });
            
            // Limit trail length
            if (trail.length > 15) trail.shift();
            
            // Update slice timer
            if (sword.sliceTimer > 0) {
                sword.sliceTimer--;
            } else {
                sword.isSlicing = false;
            }
            
            // Check for slice
            checkSlice();
        }
        
        function drawSword() {
            // Draw trail
            if (trail.length > 1) {
                ctx.strokeStyle = `rgba(200, 255, 255, ${sword.isSlicing ? 0.8 : 0.4})`;
                ctx.lineWidth = sword.isSlicing ? 6 : 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    ctx.globalAlpha = trail[i].life;
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
            
            // Draw cursor/sword
            ctx.save();
            ctx.translate(sword.x, sword.y);
            
            // Glow effect
            ctx.shadowColor = sword.isSlicing ? '#88ffff' : '#ffffff';
            ctx.shadowBlur = sword.isSlicing ? 15 : 8;
            
            // Sword handle
            ctx.fillStyle = '#888';
            ctx.fillRect(-3, -15, 6, 15);
            
            // Sword blade
            const bladeGradient = ctx.createLinearGradient(0, 0, 0, 25);
            bladeGradient.addColorStop(0, '#cccccc');
            bladeGradient.addColorStop(0.5, '#ffffff');
            bladeGradient.addColorStop(1, '#88ccff');
            ctx.fillStyle = bladeGradient;
            ctx.beginPath();
            ctx.moveTo(-4, 0);
            ctx.lineTo(4, 0);
            ctx.lineTo(0, 30);
            ctx.closePath();
            ctx.fill();
            
            // Crossguard
            ctx.fillStyle = '#aa8800';
            ctx.fillRect(-10, -2, 20, 4);
            
            ctx.restore();
        }
        
        function update() {
            if (gameState !== 'playing') return;
            
            // Update time scale
            if (sugarRushActive) {
                sugarRushTimer--;
                if (sugarRushTimer <= 0) {
                    sugarRushActive = false;
                    timeScale = 1.0;
                }
            }
            
            // Update cooldowns
            if (sugarRushCooldown > 0) sugarRushCooldown--;
            if (blenderBombCooldown > 0) blenderBombCooldown--;
            
            // Update timer
            timeRemaining -= 1/60 * timeScale;
            if (timeRemaining <= 0) {
                endGame();
                return;
            }
            
            // Spawn fruits
            spawnTimer += timeScale;
            if (spawnTimer >= spawnInterval) {
                spawnFruit();
                spawnTimer = 0;
                // Decrease spawn interval as game progresses
                spawnInterval = Math.max(20, 45 - (ROUND_TIME - timeRemaining) / 3);
            }
            
            // Update sword
            updateSword();
            
            // Update fruits
            fruits = fruits.filter(fruit => {
                fruit.update();
                return fruit.y < GAME_HEIGHT + 50 && !fruit.sliced;
            });
            
            // Update particles
            particles = particles.filter(p => {
                p.update();
                return p.life > 0;
            });
            
            // Update floating texts
            floatingTexts = floatingTexts.filter(t => {
                t.update();
                return t.life > 0;
            });
            
            // Update combo timer
            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer <= 0) combo = 0;
            }
            
            // Update max combo
            if (combo > maxCombo) maxCombo = combo;
        }
        
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // Draw background
            if (!bgPattern) bgPattern = createBackground();
            ctx.drawImage(bgPattern, 0, 0);
            
            // Sugar rush effect
            if (sugarRushActive) {
                ctx.fillStyle = 'rgba(255, 100, 255, 0.1)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            }
            
            // Draw fruits
            fruits.forEach(fruit => fruit.draw());
            
            // Draw particles
            particles.forEach(p => p.draw());
            
            // Draw sword
            drawSword();
            
            // Draw floating texts
            floatingTexts.forEach(t => t.draw());
            
            // Draw UI
            drawUI();
        }
        
        function drawUI() {
            // Score
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Arial Black';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.strokeText(`SCORE: ${score}`, 10, 28);
            ctx.fillText(`SCORE: ${score}`, 10, 28);
            
            // Timer
            const timerColor = timeRemaining < 10 ? '#ff4444' : '#fff';
            ctx.fillStyle = timerColor;
            const timeText = `TIME: ${Math.ceil(timeRemaining)}`;
            ctx.strokeText(timeText, GAME_WIDTH - 120, 28);
            ctx.fillText(timeText, GAME_WIDTH - 120, 28);
            
            // Combo
            if (combo > 1) {
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 24px Arial Black';
                const comboText = `${combo}x COMBO!`;
                ctx.strokeText(comboText, GAME_WIDTH/2 - 60, 50);
                ctx.fillText(comboText, GAME_WIDTH/2 - 60, 50);
            }
            
            // Power-up indicators
            ctx.font = 'bold 12px Arial';
            
            // Sugar Rush
            const srX = 10;
            const srY = GAME_HEIGHT - 50;
            ctx.fillStyle = sugarRushCooldown > 0 ? '#666' : '#ff88ff';
            ctx.fillRect(srX, srY, 60, 18);
            ctx.fillStyle = '#000';
            ctx.fillText(sugarRushCooldown > 0 ? `L/R: ${Math.ceil(sugarRushCooldown/60)}` : 'L/R: READY', srX + 3, srY + 13);
            
            // Blender Bomb
            const bbX = 80;
            const bbY = GAME_HEIGHT - 50;
            ctx.fillStyle = blenderBombCooldown > 0 ? '#666' : '#88ff88';
            ctx.fillRect(bbX, bbY, 60, 18);
            ctx.fillStyle = '#000';
            ctx.fillText(blenderBombCooldown > 0 ? `B: ${Math.ceil(blenderBombCooldown/60)}` : 'B: READY', bbX + 3, bbY + 13);
            
            // Controls hint
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(GAME_WIDTH - 100, GAME_HEIGHT - 25, 95, 20);
            ctx.fillStyle = '#aaa';
            ctx.font = '10px Arial';
            ctx.fillText('D-PAD: Move | A: Slice', GAME_WIDTH - 98, GAME_HEIGHT - 12);
        }
        
        function drawTitle() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            if (bgPattern) ctx.drawImage(bgPattern, 0, 0);
            
            // Title
            ctx.fillStyle = '#ff6644';
            ctx.font = 'bold 42px Arial Black';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.strokeText('FRUIT SLICE', GAME_WIDTH/2 - 130, 80);
            ctx.fillText('FRUIT SLICE', GAME_WIDTH/2 - 130, 80);
            
            // Subtitle
            ctx.fillStyle = '#ffaa44';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('Slice Fruits! Avoid Bombs!', GAME_WIDTH/2 - 100, 110);
            
            // Instructions
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            const instructions = [
                'D-PAD: Move cursor',
                'A: Slice fruits',
                'B: Blender Bomb (clear all)',
                'L/R: Sugar Rush (slow mo)',
                'START: Pause'
            ];
            instructions.forEach((line, i) => {
                ctx.fillText(line, GAME_WIDTH/2 - 90, 150 + i * 22);
            });
            
            // High score
            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`HIGH SCORE: ${highScore}`, GAME_WIDTH/2 - 60, 270);
            
            // Press start
            if (Math.floor(Date.now() / 500) % 2 === 0) {
                ctx.fillStyle = '#44ff44';
                ctx.font = 'bold 18px Arial Black';
                ctx.fillText('PRESS A or START', GAME_WIDTH/2 - 80, 300);
            }
        }
        
        function drawPause() {
            // Darken screen
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // Pause title
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 32px Arial Black';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.strokeText('PAUSED', GAME_WIDTH/2 - 60, 100);
            ctx.fillText('PAUSED', GAME_WIDTH/2 - 60, 100);
            
            // Menu options
            ctx.font = 'bold 18px Arial';
            ctx.fillStyle = '#44ff44';
            ctx.fillText('A / START: Resume', GAME_WIDTH/2 - 70, 150);
            ctx.fillStyle = audioMuted ? '#ff4444' : '#44ff44';
            ctx.fillText(`Audio: ${audioMuted ? 'MUTED' : 'ON'}`, GAME_WIDTH/2 - 50, 180);
            ctx.fillStyle = '#ffaa44';
            ctx.fillText('B: Back to Menu', GAME_WIDTH/2 - 60, 210);
            
            // Current score
            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`Score: ${score}`, GAME_WIDTH/2 - 40, 260);
        }
        
        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // Game Over
            ctx.fillStyle = '#ff4444';
            ctx.font = 'bold 36px Arial Black';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.strokeText('TIME\'S UP!', GAME_WIDTH/2 - 90, 80);
            ctx.fillText('TIME\'S UP!', GAME_WIDTH/2 - 90, 80);
            
            // Final score
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.fillText(`Final Score: ${score}`, GAME_WIDTH/2 - 80, 130);
            
            // High score
            if (score >= highScore) {
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 20px Arial Black';
                ctx.fillText('NEW HIGH SCORE!', GAME_WIDTH/2 - 85, 165);
            } else {
                ctx.fillStyle = '#aaaaaa';
                ctx.font = 'bold 16px Arial';
                ctx.fillText(`High Score: ${highScore}`, GAME_WIDTH/2 - 55, 165);
            }
            
            // Stats
            ctx.fillStyle = '#aaa';
            ctx.font = '14px Arial';
            ctx.fillText(`Max Combo: ${maxCombo}x`, GAME_WIDTH/2 - 45, 200);
            
            // Continue prompt
            if (Math.floor(Date.now() / 500) % 2 === 0) {
                ctx.fillStyle = '#44ff44';
                ctx.font = 'bold 16px Arial Black';
                ctx.fillText('Press A or START', GAME_WIDTH/2 - 70, 250);
            }
        }
        
        // ============================================
        // GAME STATE MANAGEMENT
        // ============================================
        
        function startGame() {
            gameState = 'playing';
            score = 0;
            timeRemaining = ROUND_TIME;
            combo = 0;
            maxCombo = 0;
            comboTimer = 0;
            fruits = [];
            particles = [];
            trail = [];
            floatingTexts = [];
            sword.x = GAME_WIDTH / 2;
            sword.y = GAME_HEIGHT / 2;
            sugarRushActive = false;
            sugarRushCooldown = 0;
            blenderBombCooldown = 0;
            timeScale = 1.0;
            spawnInterval = 45;
            startMusic();
            playSound('select');
        }
        
        function pauseGame() {
            gameState = 'paused';
            stopMusic();
            playSound('select');
        }
        
        function resumeGame() {
            gameState = 'playing';
            startMusic();
            playSound('select');
        }
        
        function endGame() {
            gameState = 'gameover';
            stopMusic();
            if (score > highScore) {
                highScore = score;
            }
            saveGameState();
            reportScore(score);
            playSound('bomb');
        }
        
        function resetGame() {
            score = 0;
            timeRemaining = ROUND_TIME;
            combo = 0;
            fruits = [];
            particles = [];
            trail = [];
            floatingTexts = [];
            stopMusic();
        }
        
        // ============================================
        // MAIN LOOP
        // ============================================
        
        function gameLoop() {
            switch(gameState) {
                case 'title':
                    drawTitle();
                    break;
                case 'playing':
                    update();
                    draw();
                    break;
                case 'paused':
                    draw();
                    drawPause();
                    break;
                case 'gameover':
                    draw();
                    drawGameOver();
                    break;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // ============================================
        // INITIALIZATION
        // ============================================
        
        // Keyboard controls (for testing)
        window.addEventListener('keydown', (e) => {
            const keyMap = {
                'ArrowUp': 'UP', 'ArrowDown': 'DOWN', 'ArrowLeft': 'LEFT', 'ArrowRight': 'RIGHT',
                'w': 'UP', 's': 'DOWN', 'a': 'LEFT', 'd': 'RIGHT',
                'z': 'A', 'x': 'B', 'Enter': 'START', 'Shift': 'SELECT',
                'q': 'L', 'e': 'R'
            };
            if (keyMap[e.key]) {
                inputState[keyMap[e.key]] = true;
                handleButtonPress(keyMap[e.key]);
            }
        });
        
        window.addEventListener('keyup', (e) => {
            const keyMap = {
                'ArrowUp': 'UP', 'ArrowDown': 'DOWN', 'ArrowLeft': 'LEFT', 'ArrowRight': 'RIGHT',
                'w': 'UP', 's': 'DOWN', 'a': 'LEFT', 'd': 'RIGHT',
                'z': 'A', 'x': 'B', 'Enter': 'START', 'Shift': 'SELECT',
                'q': 'L', 'e': 'R'
            };
            if (keyMap[e.key]) {
                inputState[keyMap[e.key]] = false;
            }
        });
        
        // Mouse/touch controls (for testing)
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            sword.x = (e.clientX - rect.left) * scaleX;
            sword.y = (e.clientY - rect.top) * scaleY;
        });
        
        canvas.addEventListener('mousedown', () => {
            inputState.A = true;
            sword.isSlicing = true;
            sword.sliceTimer = 10;
            handleButtonPress('A');
        });
        
        canvas.addEventListener('mouseup', () => {
            inputState.A = false;
        });
        
        // Initialize
        loadGameState();
        bgPattern = createBackground();
        gameLoop();
    </script>
</body>
</html>
