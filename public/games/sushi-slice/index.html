<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>SUSHI SLICE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;display:flex;justify-content:center;align-items:center;font-family:'Arial Black',Arial,sans-serif}
#gameCanvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ============================================
// SUSHI SLICE - One-Tap Mobile Timing Game
// HikariBoy Edition - Single File
// ============================================

const isHikariBoy = window.parent !== window;
const GAME_W = 390, GAME_H = 520;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;

// Set canvas size for HikariBoy display
canvas.width = GAME_W * dpr;
canvas.height = GAME_H * dpr;
canvas.style.width = GAME_W + 'px';
canvas.style.height = GAME_H + 'px';
ctx.scale(dpr, dpr);

// ============================================
// AUDIO ENGINE
// ============================================
let AC = null, muted = false;
function initAudio() {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
}
function tone(f, d, type = 'sine', g = 0.1, slide = 0) {
    if (muted || !AC) return;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.connect(gn); gn.connect(AC.destination);
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(slide, AC.currentTime + d);
    gn.gain.setValueAtTime(g, AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.start(); o.stop(AC.currentTime + d);
}
function sfxSlice(quality) {
    if (quality === 'perfect') {
        tone(880, 0.08, 'sine', 0.12);
        setTimeout(() => tone(1100, 0.1, 'sine', 0.1), 50);
        setTimeout(() => tone(1320, 0.15, 'sine', 0.08), 100);
    } else if (quality === 'good') {
        tone(660, 0.1, 'sine', 0.1);
    } else {
        tone(440, 0.08, 'square', 0.08);
    }
}
function sfxChop() { tone(200, 0.05, 'sawtooth', 0.08); }
function sfxLevelUp() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'square', 0.1), i * 80));
}
function sfxGameOver() {
    [400, 350, 300, 250, 200].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sawtooth', 0.12), i * 120));
}
function sfxCount() { tone(660, 0.1, 'sine', 0.08); }
function sfxStart() {
    tone(880, 0.2, 'sine', 0.1);
    setTimeout(() => tone(1100, 0.15, 'sine', 0.08), 100);
}

// ============================================
// CONSTANTS & COLOR PALETTE
// ============================================
const COLORS = {
    mint: '#9FD5D1', salmon: '#F5A3A3', lavender: '#C5B8D9', sky: '#87CEEB', cream: '#FFF8E8',
    rice: '#FFFEF0', nori: '#2D4A3E', outline: '#2D2D2D', comboBurst: '#F5A563',
    sliceLine: '#7DF9FF', conveyorMain: '#6B7B8C', conveyorDark: '#4A5A6A', conveyorLight: '#8A9AAA',
    perfect: '#FFFFFF', good: '#90EE90', bad: '#FF6B6B', soClose: '#FFD700',
    golden: '#FFD700', bonus: '#FF69B4', forgiving: '#98FB98', speed: '#FF4500'
};

const LEVELS = [
    { name: 'TRANQUILO', speedMult: 1.0, spawnMult: 1.0, timingMult: 1.0, bgHue: 0, scoreThreshold: 0 },
    { name: 'RÁPIDO', speedMult: 1.4, spawnMult: 0.85, timingMult: 0.85, bgHue: 20, scoreThreshold: 800 },
    { name: 'CAOS', speedMult: 1.8, spawnMult: 0.65, timingMult: 0.7, bgHue: 40, scoreThreshold: 2000 }
];

const SUSHI_TYPES = {
    standard: { weight: 50, color: '#7FBFBF', points: 100, timingMult: 1.0, speedMult: 1.0, comboBonus: 0, label: '' },
    bonus: { weight: 15, color: '#FF69B4', points: 100, timingMult: 1.0, speedMult: 1.0, comboBonus: 2, label: '+COMBO' },
    forgiving: { weight: 15, color: '#98FB98', points: 80, timingMult: 1.4, speedMult: 0.85, comboBonus: 0, label: 'EASY' },
    speed: { weight: 12, color: '#FF4500', points: 150, timingMult: 0.8, speedMult: 1.6, comboBonus: 0, label: 'FAST' },
    golden: { weight: 8, color: '#FFD700', points: 300, timingMult: 1.0, speedMult: 1.0, comboBonus: 1, label: '★RARE★' }
};

const GAME_DURATION = 20;
const SLICE_LINE_X_RATIO = 0.5;
const BASE_TIMING = { perfect: 12, soClose: 25, good: 45 };
const BASE_SPAWN_INTERVAL = 1.0;

// ============================================
// GAME STATE
// ============================================
let gameState = {
    phase: 'start', hasStartedOnce: false, score: 0, combo: 0, bestCombo: 0, perfectSlices: 0,
    bestScore: 0, gameTime: GAME_DURATION, lastSliceTime: 0, comboDecayWarning: false,
    currentLevel: 0, levelUpAnim: 0, screenFlash: 0, screenFlashColor: 'white',
    conveyorShake: 0, conveyorSpeedMod: 1, vignetteAlpha: 0, feverMode: false
};

let sushiList = [], particles = [], sparkles = [], floatingTexts = [], bgTriangles = [], clouds = [];
let sliceLine = { active: true, flickerAlpha: 1, glowIntensity: 1 };
let spawnTimer = 0;
let lastTime = 0;
let cdVal = 3, cdTimer = null;

// Load best score
try { gameState.bestScore = parseInt(localStorage.getItem('sushi_hi') || '0'); } catch(e) {}

// ============================================
// BACKGROUND
// ============================================
function initBackground() {
    bgTriangles = [];
    const bgColors = [COLORS.mint, COLORS.salmon, COLORS.lavender, COLORS.sky, '#E8D5E0'];
    for (let i = 0; i < 8; i++) {
        const cx = GAME_W / 2, cy = GAME_H * 0.35;
        const angle = (i / 8) * Math.PI * 2, nextAngle = ((i + 1) / 8) * Math.PI * 2, r = Math.max(GAME_W, GAME_H);
        bgTriangles.push({
            points: [{ x: cx, y: cy }, { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r }, { x: cx + Math.cos(nextAngle) * r, y: cy + Math.sin(nextAngle) * r }],
            color: bgColors[i % bgColors.length], drift: Math.random() * 0.2 - 0.1, rotation: 0
        });
    }
    clouds = [
        { x: GAME_W * 0.1, y: GAME_H * 0.1, scale: 0.6 },
        { x: GAME_W * 0.85, y: GAME_H * 0.06, scale: 0.8 },
        { x: GAME_W * 0.6, y: GAME_H * 0.12, scale: 0.5 }
    ];
}
initBackground();

// ============================================
// SUSHI CLASS
// ============================================
function pickSushiType() {
    const types = Object.entries(SUSHI_TYPES);
    const totalWeight = types.reduce((sum, [, t]) => sum + t.weight, 0);
    let rand = Math.random() * totalWeight;
    for (const [name, type] of types) { rand -= type.weight; if (rand <= 0) return name; }
    return 'standard';
}

class Sushi {
    constructor() {
        this.sushiType = pickSushiType();
        const typeData = SUSHI_TYPES[this.sushiType];
        const level = LEVELS[gameState.currentLevel];
        this.type = Math.random() > 0.4 ? 'maki' : 'nigiri';
        this.x = -70;
        this.y = GAME_H * 0.48;
        this.width = this.type === 'nigiri' ? 65 : 55;
        this.height = 55;
        this.baseSpeed = 2.2 + Math.random() * 0.4;
        this.speed = this.baseSpeed * level.speedMult * typeData.speedMult;
        this.sliced = false;
        this.sliceGap = 0;
        this.fillColor = typeData.color;
        this.blushIntensity = 0.3 + Math.random() * 0.5;
        this.faceOffsetX = (Math.random() - 0.5) * 4;
        this.faceOffsetY = (Math.random() - 0.5) * 2;
        this.winking = false;
        this.glowPulse = 0;
    }

    getTimingZones() {
        const level = LEVELS[gameState.currentLevel];
        const typeData = SUSHI_TYPES[this.sushiType];
        const mult = level.timingMult * typeData.timingMult;
        return { perfect: BASE_TIMING.perfect * mult, soClose: BASE_TIMING.soClose * mult, good: BASE_TIMING.good * mult };
    }

    update(dt, speedMod = 1) {
        this.glowPulse += dt * 5;
        if (!this.sliced) {
            this.x += this.speed * speedMod * (60 * dt);
        } else {
            this.sliceGap = Math.min(this.sliceGap + 6 * dt * 60, 15);
            this.x += this.speed * 0.5 * speedMod * (60 * dt);
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        if (this.sushiType === 'golden' || this.sushiType === 'bonus') {
            ctx.shadowColor = this.fillColor;
            ctx.shadowBlur = 8 + Math.sin(this.glowPulse) * 4;
        }
        if (this.sliced) {
            this.drawHalf(-this.sliceGap, true);
            this.drawHalf(this.sliceGap, false);
        } else {
            this.drawFull();
        }
        ctx.restore();
    }

    drawFull() {
        if (this.type === 'maki') this.drawMaki(0, 0, this.width, this.height, true);
        else this.drawNigiri(0, 0, this.width, this.height, true);
    }

    drawHalf(offsetX, isLeft) {
        ctx.save();
        ctx.translate(offsetX, 0);
        ctx.beginPath();
        if (isLeft) ctx.rect(-this.width, -this.height, this.width, this.height * 2);
        else ctx.rect(0, -this.height, this.width, this.height * 2);
        ctx.clip();
        if (this.type === 'maki') this.drawMaki(0, 0, this.width, this.height, !isLeft);
        else this.drawNigiri(0, 0, this.width, this.height, !isLeft);
        ctx.restore();
    }

    drawMaki(x, y, w, h, showFace) {
        ctx.fillStyle = COLORS.nori;
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 2;
        roundRect(x - w / 2, y - h / 2, w, h, 6);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = COLORS.rice;
        roundRect(x - w / 2 + 5, y - h / 2 + 5, w - 10, h - 10, 3);
        ctx.fill();
        ctx.fillStyle = this.fillColor;
        ctx.beginPath();
        ctx.ellipse(x, y, w * 0.22, h * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (showFace) this.drawFace(x + this.faceOffsetX, y - 4 + this.faceOffsetY);
    }

    drawNigiri(x, y, w, h, showFace) {
        ctx.fillStyle = COLORS.rice;
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(x, y + 4, w * 0.4, h * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = this.fillColor;
        ctx.beginPath();
        ctx.ellipse(x, y - 6, w * 0.42, h * 0.24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x - w * 0.25, y - 8);
        ctx.quadraticCurveTo(x, y - 12, x + w * 0.25, y - 8);
        ctx.stroke();
        if (showFace) this.drawFace(x + this.faceOffsetX, y + 6 + this.faceOffsetY);
    }

    drawFace(x, y) {
        ctx.fillStyle = `rgba(255,150,150,${this.blushIntensity})`;
        ctx.beginPath();
        ctx.ellipse(x - 10, y + 2, 5, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + 10, y + 2, 5, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = COLORS.outline;
        if (this.winking) {
            ctx.beginPath();
            ctx.moveTo(x - 10, y - 2);
            ctx.lineTo(x - 5, y);
            ctx.lineTo(x - 10, y + 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(x + 7, y, 2.5, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(x - 7, y, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 7, y, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(x, y + 4, 5, 0.2, Math.PI - 0.2);
        ctx.stroke();
    }
}

// ============================================
// PARTICLES & EFFECTS
// ============================================
class Particle {
    constructor(x, y, type = 'rice') {
        this.x = x; this.y = y; this.type = type;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = -Math.random() * 5 - 1;
        this.gravity = 0.25;
        this.life = 1;
        this.decay = 0.02 + Math.random() * 0.02;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.2;
        this.size = type === 'rice' ? 3 + Math.random() * 2 : 6 + Math.random() * 3;
    }
    update(dt) {
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.vy += this.gravity * dt * 60;
        this.rotation += this.rotationSpeed * dt * 60;
        this.life -= this.decay * dt * 60;
    }
    draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.life;
        ctx.fillStyle = COLORS.rice;
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }
}

class Sparkle {
    constructor(x, y, color = COLORS.perfect) {
        this.x = x; this.y = y; this.color = color;
        this.size = 8 + Math.random() * 8;
        this.life = 1;
        this.decay = 0.03 + Math.random() * 0.02;
        this.rotation = Math.random() * Math.PI * 0.5;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2 - 1;
    }
    update(dt) {
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.life -= this.decay * dt * 60;
        this.rotation += 0.05 * dt * 60;
    }
    draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
            const angle = (i / 4) * Math.PI * 2;
            const outerX = Math.cos(angle) * this.size;
            const outerY = Math.sin(angle) * this.size;
            const innerAngle = angle + Math.PI / 4;
            const innerX = Math.cos(innerAngle) * (this.size * 0.3);
            const innerY = Math.sin(innerAngle) * (this.size * 0.3);
            if (i === 0) ctx.moveTo(outerX, outerY);
            else ctx.lineTo(outerX, outerY);
            ctx.lineTo(innerX, innerY);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

class FloatingText {
    constructor(x, y, text, color, scale = 1) {
        this.x = x; this.y = y; this.text = text; this.color = color;
        this.life = 1; this.decay = 0.025; this.scale = 0.5;
        this.targetScale = scale;
    }
    update(dt) {
        this.y -= 1.2 * dt * 60;
        this.life -= this.decay * dt * 60;
        this.scale += (this.targetScale - this.scale) * 0.2;
    }
    draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);
        ctx.globalAlpha = this.life;
        ctx.font = 'bold 22px Arial Black, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 4;
        ctx.strokeText(this.text, 0, 0);
        ctx.fillStyle = this.color;
        ctx.fillText(this.text, 0, 0);
        ctx.restore();
    }
}

// ============================================
// SPAWNING & LEVEL CHECK
// ============================================
function spawnSushi() { sushiList.push(new Sushi()); }

function updateSpawning(dt) {
    const level = LEVELS[gameState.currentLevel];
    let spawnInterval = BASE_SPAWN_INTERVAL * level.spawnMult;
    if (gameState.gameTime <= 3) spawnInterval *= 0.75;
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnSushi(); }
}

function checkLevelUp() {
    const newLevel = LEVELS.findIndex((l, i) => i === LEVELS.length - 1 || gameState.score < LEVELS[i + 1].scoreThreshold);
    if (newLevel > gameState.currentLevel) {
        gameState.currentLevel = newLevel;
        gameState.levelUpAnim = 1;
        gameState.screenFlash = 0.3;
        gameState.screenFlashColor = LEVELS[newLevel].name === 'CAOS' ? '#FF4500' : '#FFD700';
        sfxLevelUp();
        floatingTexts.push(new FloatingText(GAME_W / 2, GAME_H / 2 - 40, LEVELS[newLevel].name, COLORS.golden, 1.2));
    }
}

// ============================================
// SLICE DETECTION
// ============================================
function attemptSlice() {
    if (gameState.phase !== 'playing') return;
    const sliceX = GAME_W * SLICE_LINE_X_RATIO;
    let slicedAny = false;

    for (const sushi of sushiList) {
        if (sushi.sliced) continue;
        const distance = Math.abs(sushi.x - sliceX);
        const zones = sushi.getTimingZones();
        const typeData = SUSHI_TYPES[sushi.sushiType];

        if (distance <= zones.good) {
            sushi.sliced = true;
            slicedAny = true;
            let result, points, color;

            if (distance <= zones.perfect) {
                result = 'PERFECT!';
                points = typeData.points;
                color = COLORS.perfect;
                gameState.combo += 1 + typeData.comboBonus;
                gameState.perfectSlices++;
                sushi.winking = true;
                spawnPerfectEffects(sushi.x, sushi.y, sushi.fillColor);
                gameState.screenFlash = 0.12;
                gameState.screenFlashColor = 'white';
                gameState.conveyorShake = 2;
                sfxSlice('perfect');
            } else if (distance <= zones.soClose) {
                result = 'SO CLOSE!';
                points = Math.floor(typeData.points * 0.5);
                color = COLORS.soClose;
                gameState.combo += 1 + typeData.comboBonus;
                spawnSoCloseEffects(sushi.x, sushi.y, sushi.fillColor);
                gameState.conveyorShake = 1;
                sfxSlice('good');
            } else {
                result = 'GOOD';
                points = Math.floor(typeData.points * 0.3);
                color = COLORS.good;
                gameState.combo += 1 + typeData.comboBonus;
                sfxSlice('good');
            }

            if (typeData.label) {
                floatingTexts.push(new FloatingText(sushi.x, sushi.y - 80, typeData.label, sushi.fillColor, 0.8));
            }

            const finalPoints = points * Math.max(1, gameState.combo);
            gameState.score += finalPoints;
            gameState.bestCombo = Math.max(gameState.bestCombo, gameState.combo);
            gameState.lastSliceTime = Date.now();
            gameState.comboDecayWarning = false;

            floatingTexts.push(new FloatingText(sushi.x, sushi.y - 35, result, color, 0.9));
            floatingTexts.push(new FloatingText(sushi.x, sushi.y - 60, `+${finalPoints}`, color, 0.7));

            checkLevelUp();
            break;
        }
    }

    if (!slicedAny) {
        const closestSushi = sushiList.find(s => !s.sliced);
        if (closestSushi && Math.abs(closestSushi.x - GAME_W * SLICE_LINE_X_RATIO) <= 120) {
            gameState.combo = 0;
            gameState.vignetteAlpha = 0.4;
            gameState.conveyorSpeedMod = 1.3;
            floatingTexts.push(new FloatingText(GAME_W / 2, GAME_H / 2, 'MISS!', COLORS.bad, 1.1));
            sfxChop();
        } else {
            sfxChop();
        }
    }
}

function spawnPerfectEffects(x, y, color) {
    for (let i = 0; i < 6; i++) sparkles.push(new Sparkle(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30, color === COLORS.golden ? color : COLORS.perfect));
    for (let i = 0; i < 8; i++) particles.push(new Particle(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 15, 'rice'));
}

function spawnSoCloseEffects(x, y, color) {
    for (let i = 0; i < 3; i++) sparkles.push(new Sparkle(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20, color));
}

// ============================================
// COMBO DECAY
// ============================================
function updateComboDecay() {
    if (gameState.combo === 0) { gameState.comboDecayWarning = false; return; }
    const timeSinceSlice = Date.now() - gameState.lastSliceTime;
    if (timeSinceSlice > 2000) { gameState.combo = 0; gameState.comboDecayWarning = false; }
    else if (timeSinceSlice > 1200) gameState.comboDecayWarning = true;
    else gameState.comboDecayWarning = false;
}

// ============================================
// DRAWING
// ============================================
function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawBackground() {
    const hueShift = LEVELS[gameState.currentLevel].bgHue;
    for (const tri of bgTriangles) {
        tri.rotation += tri.drift * 0.001;
        ctx.save();
        ctx.translate(GAME_W / 2, GAME_H * 0.35);
        ctx.rotate(tri.rotation);
        ctx.translate(-GAME_W / 2, -GAME_H * 0.35);
        ctx.fillStyle = tri.color;
        if (hueShift) ctx.filter = `hue-rotate(${hueShift}deg)`;
        ctx.beginPath();
        ctx.moveTo(tri.points[0].x, tri.points[0].y);
        ctx.lineTo(tri.points[1].x, tri.points[1].y);
        ctx.lineTo(tri.points[2].x, tri.points[2].y);
        ctx.closePath();
        ctx.fill();
        ctx.filter = 'none';
        ctx.restore();
    }
}

function drawClouds() {
    for (const cloud of clouds) {
        ctx.save();
        ctx.translate(cloud.x, cloud.y);
        ctx.scale(cloud.scale, cloud.scale);
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(-15, 0, 15, 0, Math.PI * 2);
        ctx.arc(0, -8, 20, 0, Math.PI * 2);
        ctx.arc(20, 0, 17, 0, Math.PI * 2);
        ctx.arc(8, 4, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function drawConveyor() {
    const y = GAME_H * 0.62, height = 50;
    const shakeX = gameState.conveyorShake * (Math.random() - 0.5);
    ctx.save();
    ctx.translate(shakeX, 0);
    ctx.fillStyle = COLORS.conveyorMain;
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 2;
    roundRect(0, y, GAME_W, height, 0);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = COLORS.conveyorDark;
    const stripeWidth = 16, stripeGap = 32;
    const time = Date.now() * 0.04 * gameState.conveyorSpeedMod * LEVELS[gameState.currentLevel].speedMult;
    for (let x = -stripeWidth + (time % stripeGap); x < GAME_W + stripeWidth; x += stripeGap) {
        ctx.fillRect(x, y + 4, stripeWidth, height - 8);
    }
    ctx.fillStyle = COLORS.conveyorLight;
    ctx.fillRect(0, y, GAME_W, 3);
    ctx.fillStyle = COLORS.conveyorDark;
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 1.5;
    for (let rx = 35; rx < GAME_W; rx += 70) {
        ctx.beginPath();
        ctx.arc(rx, y + height + 8, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = COLORS.conveyorMain;
        ctx.beginPath();
        ctx.arc(rx, y + height + 8, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = COLORS.conveyorDark;
    }
    ctx.restore();
}

function drawSliceLine() {
    if (!sliceLine.active) return;
    const x = GAME_W * SLICE_LINE_X_RATIO;
    const topY = GAME_H * 0.15;
    const bottomY = GAME_H * 0.72;
    let glowIntensity = sliceLine.glowIntensity;
    if (gameState.gameTime <= 3) glowIntensity = 1 + Math.sin(Date.now() * 0.01) * 0.3;
    if (gameState.currentLevel === 2) glowIntensity *= 1.3;

    const gradient = ctx.createLinearGradient(x, topY - 60, x, topY + 40);
    gradient.addColorStop(0, 'rgba(125, 249, 255, 0)');
    gradient.addColorStop(0.5, `rgba(125, 249, 255, ${0.2 * glowIntensity})`);
    gradient.addColorStop(1, `rgba(125, 249, 255, ${0.35 * glowIntensity})`);
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(x - 50, topY - 35);
    ctx.lineTo(x + 50, topY - 35);
    ctx.lineTo(x, bottomY);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = COLORS.sliceLine;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.globalAlpha = sliceLine.flickerAlpha;
    ctx.shadowColor = COLORS.sliceLine;
    ctx.shadowBlur = 12 * glowIntensity;
    ctx.beginPath();
    ctx.moveTo(x, topY);
    ctx.lineTo(x, bottomY);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
}

function drawUI() {
    const levelData = LEVELS[gameState.currentLevel];
    ctx.fillStyle = gameState.currentLevel === 2 ? '#FF4500' : (gameState.currentLevel === 1 ? COLORS.comboBurst : COLORS.mint);
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 2;
    roundRect(8, 8, 90, 24, 12);
    ctx.fill();
    ctx.stroke();
    ctx.font = 'bold 12px Arial Black, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = COLORS.outline;
    ctx.fillText(levelData.name, 53, 24);

    const scoreX = GAME_W / 2, scoreY = 28;
    ctx.fillStyle = COLORS.cream;
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 2;
    roundRect(scoreX - 70, scoreY - 16, 140, 32, 16);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = COLORS.outline;
    ctx.fillRect(scoreX - 25, 0, 50, 14);
    roundRect(scoreX - 30, 10, 60, 8, 2);
    ctx.fill();
    ctx.font = 'bold 18px Arial Black, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COLORS.outline;
    ctx.fillText(gameState.score, scoreX, scoreY);

    if (gameState.combo > 0) {
        const x = GAME_W - 50, y = 45;
        ctx.save();
        if (gameState.comboDecayWarning) ctx.translate(Math.sin(Date.now() * 0.02) * 2, 0);
        if (gameState.gameTime <= 3) { ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 8; }
        ctx.fillStyle = COLORS.comboBurst;
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 20; i++) {
            const angle = (i / 20) * Math.PI * 2 - Math.PI / 2;
            const r = i % 2 === 0 ? 32 : 24;
            const px = x + Math.cos(angle) * r;
            const py = y + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        if (gameState.comboDecayWarning) ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.01) * 0.3;
        ctx.font = 'bold 10px Arial Black, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = COLORS.outline;
        ctx.fillText('COMBO:', x, y - 6);
        ctx.font = 'bold 16px Arial Black, Arial, sans-serif';
        ctx.fillText(`x${gameState.combo}`, x, y + 10);
        ctx.restore();
    }

    const barWidth = GAME_W * 0.55, barHeight = 6;
    const bx = (GAME_W - barWidth) / 2, by = GAME_H - 20;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    roundRect(bx, by, barWidth, barHeight, 3);
    ctx.fill();
    const progress = gameState.gameTime / GAME_DURATION;
    ctx.fillStyle = gameState.gameTime <= 3 ? COLORS.bad : (gameState.gameTime <= 7 ? COLORS.comboBurst : COLORS.mint);
    roundRect(bx, by, barWidth * progress, barHeight, 3);
    ctx.fill();
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 1.5;
    roundRect(bx, by, barWidth, barHeight, 3);
    ctx.stroke();

    ctx.fillStyle = 'rgba(60,30,60,0.5)';
    roundRect(GAME_W - 36, 8, 28, 24, 8);
    ctx.fill();
    ctx.font = '12px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = muted ? '#888' : '#FFD700';
    ctx.fillText(muted ? '🔇' : '🔊', GAME_W - 22, 20);
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    const centerX = GAME_W / 2, centerY = GAME_H / 2;
    
    ctx.fillStyle = COLORS.cream;
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 3;
    roundRect(centerX - 110, centerY - 70, 220, 140, 20);
    ctx.fill();
    ctx.stroke();
    
    ctx.font = 'bold 36px Arial Black, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COLORS.comboBurst;
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 4;
    ctx.strokeText('SUSHI', centerX, centerY - 25);
    ctx.fillText('SUSHI', centerX, centerY - 25);
    ctx.strokeText('SLICE!', centerX, centerY + 10);
    ctx.fillText('SLICE!', centerX, centerY + 10);
    
    const pulse = 0.7 + Math.sin(Date.now() * 0.005) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 14px Arial Black, Arial, sans-serif';
    ctx.fillStyle = COLORS.outline;
    ctx.fillText('TAP TO START', centerX, centerY + 45);
    ctx.globalAlpha = 1;
    
    if (gameState.bestScore > 0) {
        ctx.font = '12px Arial, sans-serif';
        ctx.fillStyle = 'rgba(45,45,45,0.7)';
        ctx.fillText(`BEST: ${gameState.bestScore}`, centerX, centerY + 70);
    }
}

function drawCountdown() {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    const centerX = GAME_W / 2, centerY = GAME_H / 2;
    
    const scale = 1 + Math.sin(Date.now() * 0.015) * 0.1;
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.scale(scale, scale);
    ctx.font = 'bold 100px Arial Black, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 8;
    ctx.strokeText(cdVal, 0, 0);
    const grad = ctx.createLinearGradient(-50, -50, 50, 50);
    grad.addColorStop(0, '#FFD700');
    grad.addColorStop(1, '#FF8C00');
    ctx.fillStyle = grad;
    ctx.fillText(cdVal, 0, 0);
    ctx.restore();
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(255,248,232,0.92)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    const centerX = GAME_W / 2, centerY = GAME_H * 0.4;
    
    ctx.font = 'bold 32px Arial Black, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COLORS.bad;
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 3;
    ctx.strokeText('TIME UP!', centerX, centerY - 60);
    ctx.fillText('TIME UP!', centerX, centerY - 60);
    
    ctx.font = 'bold 48px Arial Black, Arial, sans-serif';
    ctx.fillStyle = COLORS.outline;
    ctx.fillText(gameState.score, centerX, centerY);
    
    ctx.font = '14px Arial, sans-serif';
    ctx.fillStyle = COLORS.conveyorDark;
    ctx.fillText(`BEST: ${gameState.bestScore}`, centerX, centerY + 35);
    
    if (gameState.bestCombo > 0) {
        ctx.font = '12px Arial, sans-serif';
        ctx.fillStyle = COLORS.comboBurst;
        ctx.fillText(`BEST COMBO: x${gameState.bestCombo}`, centerX, centerY + 55);
    }
    
    ctx.fillStyle = COLORS.comboBurst;
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 3;
    roundRect(centerX - 90, centerY + 80, 180, 45, 22);
    ctx.fill();
    ctx.stroke();
    
    const pulse = 0.8 + Math.sin(Date.now() * 0.008) * 0.2;
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 18px Arial Black, Arial, sans-serif';
    ctx.fillStyle = COLORS.cream;
    ctx.strokeStyle = COLORS.outline;
    ctx.lineWidth = 2;
    ctx.strokeText('SLICE AGAIN', centerX, centerY + 102);
    ctx.fillText('SLICE AGAIN', centerX, centerY + 102);
    ctx.globalAlpha = 1;
}

function drawScreenEffects() {
    if (gameState.screenFlash > 0) {
        ctx.fillStyle = gameState.screenFlashColor === 'white' ? 
            `rgba(255,255,255,${gameState.screenFlash})` : 
            `rgba(255,100,100,${gameState.screenFlash})`;
        ctx.fillRect(0, 0, GAME_W, GAME_H);
    }
    if (gameState.vignetteAlpha > 0) {
        const gradient = ctx.createRadialGradient(GAME_W / 2, GAME_H / 2, GAME_H * 0.25, GAME_W / 2, GAME_H / 2, GAME_H * 0.7);
        gradient.addColorStop(0, 'rgba(255,0,0,0)');
        gradient.addColorStop(1, `rgba(255,0,0,${gameState.vignetteAlpha})`);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, GAME_W, GAME_H);
    }
}

// ============================================
// GAME LOOP
// ============================================
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    ctx.clearRect(0, 0, GAME_W, GAME_H);
    drawBackground();
    drawClouds();

    if (gameState.phase === 'start') {
        drawConveyor();
        drawSliceLine();
        drawStartScreen();
    } else if (gameState.phase === 'countdown') {
        drawConveyor();
        drawSliceLine();
        drawCountdown();
    } else if (gameState.phase === 'playing') {
        gameState.gameTime -= dt;
        if (gameState.gameTime <= 0) {
            endGame();
        } else {
            updateSpawning(dt);
            updateComboDecay();
            for (const sushi of sushiList) sushi.update(dt, gameState.conveyorSpeedMod);
            sushiList = sushiList.filter(s => s.x < GAME_W + 80);
            for (const p of particles) p.update(dt);
            particles = particles.filter(p => p.life > 0);
            for (const s of sparkles) s.update(dt);
            sparkles = sparkles.filter(s => s.life > 0);
            for (const t of floatingTexts) t.update(dt);
            floatingTexts = floatingTexts.filter(t => t.life > 0);
            gameState.screenFlash *= 0.85;
            gameState.conveyorShake *= 0.85;
            gameState.conveyorSpeedMod += (1 - gameState.conveyorSpeedMod) * 0.05;
            gameState.vignetteAlpha *= 0.9;
            gameState.levelUpAnim *= 0.95;
        }
        drawConveyor();
        drawSliceLine();
        for (const sushi of sushiList) sushi.draw();
        for (const p of particles) p.draw();
        for (const s of sparkles) s.draw();
        for (const t of floatingTexts) t.draw();
        drawUI();
        drawScreenEffects();
    } else if (gameState.phase === 'gameover') {
        drawConveyor();
        for (const sushi of sushiList) sushi.draw();
        drawGameOver();
    }
    requestAnimationFrame(gameLoop);
}

// ============================================
// GAME STATE MANAGEMENT
// ============================================
function startCountdown() {
    gameState.phase = 'countdown';
    cdVal = 3;
    sfxCount();
    if (cdTimer) clearInterval(cdTimer);
    cdTimer = setInterval(() => {
        cdVal--;
        if (cdVal > 0) {
            sfxCount();
        } else {
            clearInterval(cdTimer);
            startGame();
        }
    }, 1000);
}

function startGame() {
    initAudio();
    gameState.hasStartedOnce = true;
    gameState.phase = 'playing';
    gameState.score = 0;
    gameState.combo = 0;
    gameState.bestCombo = 0;
    gameState.perfectSlices = 0;
    gameState.gameTime = GAME_DURATION;
    gameState.lastSliceTime = Date.now();
    gameState.currentLevel = 0;
    sushiList = [];
    particles = [];
    sparkles = [];
    floatingTexts = [];
    spawnTimer = 0;
    sliceLine.active = true;
    sliceLine.flickerAlpha = 1;
    sfxStart();
    spawnSushi();
}

function endGame() {
    gameState.phase = 'gameover';
    if (gameState.score > gameState.bestScore) {
        gameState.bestScore = gameState.score;
        try { localStorage.setItem('sushi_hi', gameState.bestScore); } catch(e) {}
    }
    sliceLine.active = false;
    sfxGameOver();
}

function restartGame() {
    startCountdown();
}

// ============================================
// INPUT HANDLING
// ============================================
function handleInput(e) {
    e.preventDefault();
    initAudio();
    
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;
    
    if (x > GAME_W - 40 && y < 40) {
        muted = !muted;
        return;
    }
    
    if (gameState.phase === 'start') {
        startCountdown();
    } else if (gameState.phase === 'playing') {
        attemptSlice();
    } else if (gameState.phase === 'gameover') {
        restartGame();
    }
}

canvas.addEventListener('touchstart', handleInput, { passive: false });
canvas.addEventListener('mousedown', handleInput);
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'KeyA') {
        e.preventDefault();
        initAudio();
        if (gameState.phase === 'start') startCountdown();
        else if (gameState.phase === 'playing') attemptSlice();
        else if (gameState.phase === 'gameover') restartGame();
    }
});

// HikariBoy button support
window.addEventListener('message', e => {
    if (e.data && e.data.type === 'BUTTON_PRESS') {
        const btn = e.data.button;
        initAudio();
        if (btn === 'start' || btn === 'a') {
            if (gameState.phase === 'start') startCountdown();
            else if (gameState.phase === 'playing') attemptSlice();
            else if (gameState.phase === 'gameover') restartGame();
        }
        if (btn === 'select' && isHikariBoy) {
            window.parent.postMessage({ type: 'GAME_EXIT', gameId: 'sushi-slice' }, '*');
        }
    }
});

// Auto-start for HikariBoy
if (isHikariBoy) {
    initAudio();
    startCountdown();
}

requestAnimationFrame(gameLoop);
</script>
