<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="600" height="400"></canvas>
<script>
const c = document.getElementById('c');
const x = c.getContext('2d');

// Background
const g = x.createLinearGradient(0, 0, 600, 400);
g.addColorStop(0, '#9FD5D1');
g.addColorStop(0.5, '#C5B8D9');
g.addColorStop(1, '#F5A3A3');
x.fillStyle = g;
x.fillRect(0, 0, 600, 400);

// Decorative triangles
const colors = ['#9FD5D1', '#F5A3A3', '#C5B8D9', '#87CEEB', '#E8D5E0'];
for (let i = 0; i < 6; i++) {
    const cx = 300, cy = 200;
    const angle = (i / 6) * Math.PI * 2;
    const nextAngle = ((i + 1) / 6) * Math.PI * 2;
    const r = 400;
    x.fillStyle = colors[i % colors.length];
    x.globalAlpha = 0.3;
    x.beginPath();
    x.moveTo(cx, cy);
    x.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
    x.lineTo(cx + Math.cos(nextAngle) * r, cy + Math.sin(nextAngle) * r);
    x.closePath();
    x.fill();
}
x.globalAlpha = 1;

// Draw Sushi
function drawMaki(xp, yp, w, h) {
    x.fillStyle = '#2D4A3E';
    x.strokeStyle = '#2D2D2D';
    x.lineWidth = 3;
    x.beginPath();
    x.roundRect(xp - w/2, yp - h/2, w, h, 8);
    x.fill();
    x.stroke();
    x.fillStyle = '#FFFEF0';
    x.beginPath();
    x.roundRect(xp - w/2 + 6, yp - h/2 + 6, w - 12, h - 12, 4);
    x.fill();
    x.fillStyle = '#FF69B4';
    x.beginPath();
    x.ellipse(xp, yp, w * 0.22, h * 0.22, 0, 0, Math.PI * 2);
    x.fill();
    x.strokeStyle = '#2D2D2D';
    x.lineWidth = 2;
    x.stroke();
}

function drawNigiri(xp, yp, w, h) {
    x.fillStyle = '#FFFEF0';
    x.strokeStyle = '#2D2D2D';
    x.lineWidth = 3;
    x.beginPath();
    x.ellipse(xp, yp + 4, w * 0.45, h * 0.35, 0, 0, Math.PI * 2);
    x.fill();
    x.stroke();
    x.fillStyle = '#F5A3A3';
    x.beginPath();
    x.ellipse(xp, yp - 6, w * 0.48, h * 0.28, 0, 0, Math.PI * 2);
    x.fill();
    x.stroke();
}

// Draw multiple sushi
const positions = [
    [150, 280, 'maki'], [300, 320, 'nigiri'], [450, 260, 'maki'],
    [220, 180, 'nigiri'], [380, 200, 'maki']
];

positions.forEach(([px, py, type]) => {
    if (type === 'maki') drawMaki(px, py, 70, 70);
    else drawNigiri(px, py, 80, 75);
});

// Title
x.font = '900 52px Arial Black, Arial, sans-serif';
x.textAlign = 'center';
x.fillStyle = '#2D2D2D';
x.strokeStyle = '#FFF';
x.lineWidth = 8;
x.strokeText('SUSHI SLICE', 300, 110);
x.fillText('SUSHI SLICE', 300, 110);

// Subtitle
x.font = 'bold 20px Arial, sans-serif';
x.fillStyle = '#2D2D2D';
x.fillText('TAP TO SLICE!', 300, 145);

// Pixel art style border
x.strokeStyle = '#2D2D2D';
x.lineWidth = 8;
x.strokeRect(4, 4, 592, 392);

// Sparkles
x.fillStyle = '#FFD700';
for (let i = 0; i < 8; i++) {
    const sx = 80 + Math.random() * 440;
    const sy = 60 + Math.random() * 280;
    const sz = 4 + Math.random() * 8;
    x.beginPath();
    for (let j = 0; j < 4; j++) {
        const a = (j / 4) * Math.PI * 2 - Math.PI / 2;
        const ox = Math.cos(a) * sz;
        const oy = Math.sin(a) * sz;
        const ix = Math.cos(a + Math.PI / 4) * (sz * 0.3);
        const iy = Math.sin(a + Math.PI / 4) * (sz * 0.3);
        if (j === 0) x.moveTo(sx + ox, sy + oy);
        else x.lineTo(sx + ox, sy + oy);
        x.lineTo(sx + ix, sy + iy);
    }
    x.closePath();
    x.fill();
}
</script>
</body>
</html>
