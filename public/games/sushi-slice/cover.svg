<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FD5D1"/>
      <stop offset="50%" stop-color="#C5B8D9"/>
      <stop offset="100%" stop-color="#F5A3A3"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  
  <!-- Decorative triangles -->
  <g opacity="0.3">
    <polygon points="300,200 100,50 150,350" fill="#9FD5D1"/>
    <polygon points="300,200 500,50 550,250" fill="#F5A3A3"/>
    <polygon points="300,200 50,300 200,380" fill="#C5B8D9"/>
    <polygon points="300,200 400,380 580,350" fill="#87CEEB"/>
  </g>
  
  <!-- Sushi 1 - Maki -->
  <g transform="translate(150, 280)">
    <rect x="-35" y="-35" width="70" height="70" rx="8" fill="#2D4A3E" stroke="#2D2D2D" stroke-width="3"/>
    <rect x="-29" y="-29" width="58" height="58" rx="4" fill="#FFFEF0"/>
    <ellipse cx="0" cy="0" rx="15" ry="15" fill="#FF69B4" stroke="#2D2D2D" stroke-width="2"/>
  </g>
  
  <!-- Sushi 2 - Nigiri -->
  <g transform="translate(300, 320)">
    <ellipse cx="0" cy="4" rx="36" ry="28" fill="#FFFEF0" stroke="#2D2D2D" stroke-width="3"/>
    <ellipse cx="0" cy="-6" rx="38" ry="22" fill="#F5A3A3" stroke="#2D2D2D" stroke-width="2"/>
    <path d="M -15 -8 Q 0 -12 15 -8" stroke="rgba(255,255,255,0.5)" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Sushi 3 - Maki (Gold) -->
  <g transform="translate(450, 260)">
    <rect x="-35" y="-35" width="70" height="70" rx="8" fill="#2D4A3E" stroke="#2D2D2D" stroke-width="3"/>
    <rect x="-29" y="-29" width="58" height="58" rx="4" fill="#FFFEF0"/>
    <ellipse cx="0" cy="0" rx="15" ry="15" fill="#FFD700" stroke="#2D2D2D" stroke-width="2"/>
  </g>
  
  <!-- Sushi 4 - Nigiri -->
  <g transform="translate(220, 180)">
    <ellipse cx="0" cy="4" rx="36" ry="28" fill="#FFFEF0" stroke="#2D2D2D" stroke-width="3"/>
    <ellipse cx="0" cy="-6" rx="38" ry="22" fill="#7FBFBF" stroke="#2D2D2D" stroke-width="2"/>
  </g>
  
  <!-- Sushi 5 - Maki -->
  <g transform="translate(380, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="6" fill="#2D4A3E" stroke="#2D2D2D" stroke-width="2"/>
    <rect x="-25" y="-25" width="50" height="50" rx="3" fill="#FFFEF0"/>
    <ellipse cx="0" cy="0" rx="12" ry="12" fill="#98FB98" stroke="#2D2D2D" stroke-width="1.5"/>
  </g>
  
  <!-- Title -->
  <text x="300" y="110" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" fill="#2D2D2D" stroke="#FFF" stroke-width="6" font-weight="900">SUSHI SLICE</text>
  <text x="300" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#2D2D2D" font-weight="bold">TAP TO SLICE!</text>
  
  <!-- Sparkles -->
  <g fill="#FFD700">
    <polygon points="80,80 82,86 88,88 82,90 80,96 78,90 72,88 78,86"/>
    <polygon points="520,120 522,126 528,128 522,130 520,136 518,130 512,128 518,126"/>
    <polygon points="100,300 102,306 108,308 102,310 100,316 98,310 92,308 98,306"/>
    <polygon points="500,320 502,326 508,328 502,330 500,336 498,330 492,328 498,326"/>
    <polygon points="50,200 51,203 54,204 51,205 50,208 49,205 46,204 49,203"/>
    <polygon points="550,220 551,223 554,224 551,225 550,228 549,225 546,224 549,223"/>
  </g>
  
  <!-- Border -->
  <rect x="4" y="4" width="592" height="392" fill="none" stroke="#2D2D2D" stroke-width="8"/>
</svg>
