<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BulletGBA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { 
            background: #1a0a2e; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #gameCanvas { 
            image-rendering: pixelated;
            box-shadow: 0 0 30px rgba(255,0,128,0.4);
            max-width: 100%;
            max-height: 70vh;
        }
        #demoScreen {
            position: absolute;
            width: 240px;
            height: 320px;
            background: radial-gradient(circle at center, #ff008033 0%, #1a0a2e 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff0080;
            text-align: center;
        }
        #demoScreen h1 {
            font-size: 24px;
            text-shadow: 0 0 15px rgba(255,0,128,0.8);
            margin-bottom: 30px;
        }
        #demoScreen .bullets {
            position: relative;
            width: 100px;
            height: 100px;
        }
        #demoScreen .bullet {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: float 2s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-20px); opacity: 1; }
        }
        #demoScreen .info {
            font-size: 11px;
            color: #888;
            margin-top: 30px;
        }
        #demoScreen .controls {
            font-size: 10px;
            color: #666;
            margin-top: 10px;
        }
        #ui, #loading { display: none; }
    </style>
</head>
<body>
    <div id="demoScreen">
        <h1>BULLETGBA</h1>
        <div class="bullets">
            <div class="bullet" style="left:20px;top:20px;animation-delay:0s"></div>
            <div class="bullet" style="left:60px;top:40px;animation-delay:0.3s"></div>
            <div class="bullet" style="left:30px;top:60px;animation-delay:0.6s"></div>
            <div class="bullet" style="left:70px;top:70px;animation-delay:0.9s"></div>
            <div class="bullet" style="left:45px;top:30px;animation-delay:1.2s"></div>
        </div>
        <div class="info">64KB • Chiptune • Bullet Hell</div>
        <div class="controls">A=SHOOT • L/R=SLOW/FOCUS • SELECT=EXIT</div>
    </div>
    
    <div id="loading">LOADING...</div>
    <canvas id="gameCanvas" width="240" height="320"></canvas>

<script type="module">
import mGBA from 'https://cdn.jsdelivr.net/npm/@thenick775/mgba-wasm@2.4.1/dist/mgba-wasm.min.js';

const canvas = document.getElementById('gameCanvas');
const demoScreen = document.getElementById('demoScreen');
const loading = document.getElementById('loading');
let emulator = null;

const BUTTONS = { A: 0, B: 1, SELECT: 2, START: 3, RIGHT: 4, LEFT: 5, UP: 6, DOWN: 7, R: 8, L: 9 };

async function checkROM() {
    try {
        const response = await fetch('bulletgba.gba', { method: 'HEAD' });
        if (response.ok) {
            demoScreen.style.display = 'none';
            loading.style.display = 'block';
            initEmulator();
        }
    } catch (e) {
        console.log('Demo mode: bulletgba.gba not found');
    }
}

async function initEmulator() {
    try {
        const Module = await mGBA({ canvas });
        await Module.FSInit();
        const romData = await fetch('bulletgba.gba').then(r => r.arrayBuffer());
        Module.FS.writeFile('/bulletgba.gba', new Uint8Array(romData));
        Module.loadGame('/bulletgba.gba');
        Module.run();
        emulator = Module;
        loading.style.display = 'none';
    } catch (err) {
        loading.innerHTML = `ERROR: ${err.message}`;
    }
}

function exitGame() {
    if (emulator) emulator.pause();
    window.parent.postMessage({ type: 'GAME_EXIT', gameId: 'bulletgba' }, '*');
}

window.addEventListener('message', (e) => {
    switch(e.data.type) {
        case 'BUTTON_PRESS':
            if (e.data.button === 'select') {
                exitGame();
                return;
            }
            if (!emulator) return;
            switch(e.data.button) {
                case 'dpad-up': emulator.buttonPress(BUTTONS.UP); break;
                case 'dpad-down': emulator.buttonPress(BUTTONS.DOWN); break;
                case 'dpad-left': emulator.buttonPress(BUTTONS.LEFT); break;
                case 'dpad-right': emulator.buttonPress(BUTTONS.RIGHT); break;
                case 'a': emulator.buttonPress(BUTTONS.A); break;
                case 'b': emulator.buttonPress(BUTTONS.B); break;
                case 'l': emulator.buttonPress(BUTTONS.L); break;
                case 'r': emulator.buttonPress(BUTTONS.R); break;
                case 'start': emulator.buttonPress(BUTTONS.START); break;
            }
            break;
        case 'PAUSE': if (emulator) emulator.pause(); break;
        case 'RESUME': if (emulator) emulator.resume(); break;
    }
});

checkROM();
</script>
</body>
</html>
