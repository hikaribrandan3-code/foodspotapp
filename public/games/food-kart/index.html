<body>
<div id="game-container"><canvas id="game-canvas"></canvas></div>
<script>
// ============================================================
// FOODKART GP — Mode-7 style kart racer for HikariBoy
// 240x160 native (GBA), vanilla canvas, zero dependencies.
// Shell contract: BUTTON_PRESS / BUTTON_RELEASE postMessages,
// GAME_LOADED on boot, GAME_EXIT on select.
// ============================================================
'use strict';

const isMobileDevice = /mobile|android|phone/i.test(navigator.userAgent);
const W = 240, H = 160;
const HOR = 56;            // horizon row
const FOCAL = 110;         // projection focal length
const CAMH = 26;           // camera height (world units)
const CAMBACK = 40;        // camera distance behind player
const NWP = 320;           // waypoints per track
const KARTS = 6;           // racers per race
const LAPS = 3;

const canvas = document.getElementById('game-canvas');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
ctx.imageSmoothingEnabled = false;

// ---------------- device tier detection ----------------
// navigator.hardwareConcurrency/deviceMemory are unreliable alone (iOS Safari
// doesn't expose deviceMemory at all, and misreports cores on some models), so
// a quick synthetic timing probe backs them up. One-time cost at boot, ~1-2ms.
function detectDeviceTier() {
  let score = 0;
  const cores = navigator.hardwareConcurrency || 4;
  score += cores >= 6 ? 2 : (cores >= 4 ? 1 : 0);
  if (navigator.deviceMemory) score += navigator.deviceMemory >= 6 ? 2 : (navigator.deviceMemory >= 4 ? 1 : 0);
  const t0 = performance.now();
  let acc = 0;
  for (let i = 0; i < 200000; i++) acc += Math.sin(i * 0.001) * Math.cos(i * 0.002);
  const probeMs = performance.now() - t0;
  score += probeMs < 4 ? 2 : (probeMs < 9 ? 1 : 0);
  if (score >= 5) return 'high';
  if (score >= 3) return 'mid';
  return 'low';
}
const DEVICE_TIER = detectDeviceTier();
const TIER_LOW = DEVICE_TIER === 'low';
const BOOST_REPAINT_INTERVAL = DEVICE_TIER === 'low' ? 12 : (DEVICE_TIER === 'mid' ? 8 : 4);

function fitCanvas() {
  const c = document.getElementById('game-container');
  const sx = c.clientWidth / W, sy = c.clientHeight / H;
  let s = Math.min(sx, sy);
  if (s >= 2) s = Math.floor(s);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ---------------- utils ----------------
const PI2 = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
function wrapPi(a) { while (a > Math.PI) a -= PI2; while (a < -Math.PI) a += PI2; return a; }
function approachAng(cur, target, k) { return cur + wrapPi(target - cur) * k; }
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
function u32(hex) { // '#rrggbb' -> ABGR packed for little-endian ImageData
  const n = parseInt(hex.slice(1), 16);
  return 0xFF000000 | ((n & 0xFF) << 16) | (n & 0xFF00) | (n >> 16);
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------------- bitmap font (5x7) ----------------
const GLYPHS = {
'A':'01110 10001 10001 11111 10001 10001 10001','B':'11110 10001 10001 11110 10001 10001 11110',
'C':'01110 10001 10000 10000 10000 10001 01110','D':'11100 10010 10001 10001 10001 10010 11100',
'E':'11111 10000 10000 11110 10000 10000 11111','F':'11111 10000 10000 11110 10000 10000 10000',
'G':'01110 10001 10000 10111 10001 10001 01111','H':'10001 10001 10001 11111 10001 10001 10001',
'I':'01110 00100 00100 00100 00100 00100 01110','J':'00111 00010 00010 00010 00010 10010 01100',
'K':'10001 10010 10100 11000 10100 10010 10001','L':'10000 10000 10000 10000 10000 10000 11111',
'M':'10001 11011 10101 10101 10001 10001 10001','N':'10001 11001 10101 10011 10001 10001 10001',
'O':'01110 10001 10001 10001 10001 10001 01110','P':'11110 10001 10001 11110 10000 10000 10000',
'Q':'01110 10001 10001 10001 10101 10010 01101','R':'11110 10001 10001 11110 10100 10010 10001',
'S':'01111 10000 10000 01110 00001 00001 11110','T':'11111 00100 00100 00100 00100 00100 00100',
'U':'10001 10001 10001 10001 10001 10001 01110','V':'10001 10001 10001 10001 10001 01010 00100',
'W':'10001 10001 10001 10101 10101 11011 10001','X':'10001 10001 01010 00100 01010 10001 10001',
'Y':'10001 10001 01010 00100 00100 00100 00100','Z':'11111 00001 00010 00100 01000 10000 11111',
'0':'01110 10001 10011 10101 11001 10001 01110','1':'00100 01100 00100 00100 00100 00100 01110',
'2':'01110 10001 00001 00110 01000 10000 11111','3':'11110 00001 00001 01110 00001 00001 11110',
'4':'00010 00110 01010 10010 11111 00010 00010','5':'11111 10000 11110 00001 00001 10001 01110',
'6':'00110 01000 10000 11110 10001 10001 01110','7':'11111 00001 00010 00100 01000 01000 01000',
'8':'01110 10001 10001 01110 10001 10001 01110','9':'01110 10001 10001 01111 00001 00010 01100',
':':'00000 00100 00100 00000 00100 00100 00000','/':'00001 00001 00010 00100 01000 10000 10000',
'!':'00100 00100 00100 00100 00100 00000 00100','?':'01110 10001 00001 00110 00100 00000 00100',
'.':'00000 00000 00000 00000 00000 00110 00110',',':'00000 00000 00000 00000 00110 00100 01000',
'-':'00000 00000 00000 01110 00000 00000 00000',"'":'00100 00100 01000 00000 00000 00000 00000',
'+':'00000 00100 00100 11111 00100 00100 00000','%':'11001 11010 00010 00100 01000 01011 10011',
' ':'00000 00000 00000 00000 00000 00000 00000'
};
const FONT = {};
for (const ch in GLYPHS) {
  const rows = GLYPHS[ch].split(' ');
  const bits = [];
  for (let r = 0; r < 7; r++) { let b = 0; for (let c = 0; c < 5; c++) if (rows[r][c] === '1') b |= (1 << c); bits.push(b); }
  FONT[ch] = bits;
}
const atlasCache = {};
function fontAtlas(scale, col, outline) {
  const key = scale + '|' + col + '|' + (outline || '');
  if (atlasCache[key]) return atlasCache[key];
  const chars = Object.keys(FONT);
  const cw = 6 * scale + 2, ch = 8 * scale + 2;
  const cv = mkCanvas(cw * chars.length, ch);
  const g = cv.getContext('2d');
  const map = {};
  chars.forEach((c, i) => {
    map[c] = i * cw;
    const ox = i * cw + 1, oy = 1;
    const bits = FONT[c];
    const paint = (color, dx, dy) => {
      g.fillStyle = color;
      for (let r = 0; r < 7; r++) for (let x = 0; x < 5; x++)
        if (bits[r] & (1 << x)) g.fillRect(ox + x * scale + dx, oy + r * scale + dy, scale, scale);
    };
    if (outline) { paint(outline, -1, 0); paint(outline, 1, 0); paint(outline, 0, -1); paint(outline, 0, 1); paint(outline, 1, 1); }
    paint(col, 0, 0);
  });
  const a = { cv, map, cw, ch, scale };
  atlasCache[key] = a;
  return a;
}
// align: 0 left, 1 center, 2 right
function text(str, x, y, scale, col, outline, align) {
  str = String(str).toUpperCase();
  const a = fontAtlas(scale || 1, col || '#fff', outline);
  const adv = 6 * (scale || 1);
  const w = str.length * adv;
  if (align === 1) x -= (w >> 1);
  else if (align === 2) x -= w;
  x |= 0; y |= 0;
  for (let i = 0; i < str.length; i++) {
    const sx = a.map[str[i]];
    if (sx === undefined) continue;
    ctx.drawImage(a.cv, sx, 0, a.cw, a.ch, x + i * adv - 1, y - 1, a.cw, a.ch);
  }
  return w;
}

// ---------------- audio ----------------
let AC = null, masterGain = null, musicGain = null, sfxGain = null;
let engineOsc = null, engineOsc2 = null, engineGain = null, engineFilter = null;
let muted = false;
function initAC() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = muted ? 0 : 1; masterGain.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.11; musicGain.connect(masterGain);
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(masterGain);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function resumeAC() { if (AC && AC.state === 'suspended') AC.resume(); }
function setMuted(m) { muted = m; if (masterGain) masterGain.gain.value = m ? 0 : 1; }
function beep(freq, dur, type, vol, slideTo) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), AC.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.2, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(); o.stop(AC.currentTime + dur + 0.02);
  } catch (e) {}
}
let noiseBuf = null;
function noise(dur, vol, hp) {
  if (!AC) return;
  try {
    if (!noiseBuf) {
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const g = AC.createGain(); g.gain.setValueAtTime(vol || 0.15, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    const f = AC.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp ? 4000 : 1200;
    s.connect(f); f.connect(g); g.connect(sfxGain);
    s.start(); s.stop(AC.currentTime + dur + 0.02);
  } catch (e) {}
}
const SND = {
  menuMove:  () => beep(520, 0.05, 'square', 0.12),
  menuPick:  () => { beep(660, 0.07, 'square', 0.15); beep(990, 0.1, 'square', 0.12); },
  menuBack:  () => beep(330, 0.08, 'square', 0.12),
  count:     () => beep(440, 0.12, 'square', 0.25),
  go:        () => beep(880, 0.4, 'square', 0.25),
  coin:      () => { beep(988, 0.05, 'square', 0.14); setTimeout(() => beep(1319, 0.12, 'square', 0.14), 45); },
  itemGet:   () => { beep(523, 0.05, 'square', 0.13); setTimeout(() => beep(659, 0.05, 'square', 0.13), 50); setTimeout(() => beep(784, 0.09, 'square', 0.13), 100); },
  roll:      () => beep(rnd(400, 700), 0.03, 'square', 0.07),
  throwIt:   () => noise(0.15, 0.2, true),
  boost:     () => beep(220, 0.35, 'sawtooth', 0.2, 880),
  hit:       () => { beep(300, 0.25, 'square', 0.25, 80); noise(0.2, 0.25); },
  bump:      () => beep(140, 0.08, 'square', 0.18),
  spinout:   () => beep(500, 0.4, 'sawtooth', 0.18, 100),
  star:      () => { for (let i = 0; i < 6; i++) setTimeout(() => beep(660 + i * 110, 0.08, 'square', 0.12), i * 60); },
  lap:       () => { beep(587, 0.08, 'square', 0.16); setTimeout(() => beep(740, 0.08, 'square', 0.16), 80); setTimeout(() => beep(880, 0.14, 'square', 0.16), 160); },
  finalLap:  () => { beep(880, 0.09, 'square', 0.16); setTimeout(() => beep(880, 0.09, 'square', 0.16), 110); setTimeout(() => beep(1175, 0.2, 'square', 0.16), 220); },
  fall:      () => beep(600, 0.5, 'sine', 0.2, 100),
  finish:    () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'square', 0.16), i * 130)); },
  horn:      () => beep(392, 0.15, 'sawtooth', 0.2),
};
function engineStart() {
  if (!AC || engineOsc) return;
  try {
    engineOsc = AC.createOscillator(); engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 60;
    engineOsc2 = AC.createOscillator(); engineOsc2.type = 'square'; engineOsc2.frequency.value = 31;
    engineFilter = AC.createBiquadFilter(); engineFilter.type = 'lowpass'; engineFilter.frequency.value = 700;
    engineGain = AC.createGain(); engineGain.gain.value = 0;
    engineOsc.connect(engineFilter); engineOsc2.connect(engineFilter);
    engineFilter.connect(engineGain); engineGain.connect(masterGain);
    engineOsc.start(); engineOsc2.start();
  } catch (e) { engineOsc = null; }
}
function engineUpdate(speedRatio, on) {
  if (!engineOsc) return;
  const f = 55 + speedRatio * 170 + Math.sin(frame * 0.7) * 2;
  engineOsc.frequency.value = f;
  engineOsc2.frequency.value = f * 0.5;
  engineGain.gain.value = on ? 0.035 + speedRatio * 0.03 : 0;
}
function engineStop() { if (engineGain) engineGain.gain.value = 0; }

// --- music sequencer (16th-note grid, 32 steps) ---
const SONGS = {
  candy:   { bpm: 138, base: 60, bass: [0,0,7,0, 5,0,7,0, 0,0,7,0, 3,0,5,0, 0,0,7,0, 5,0,7,0, 8,0,7,0, 5,0,3,0], lead: [12,0,16,19, 0,19,16,12, 14,0,12,0, 11,0,12,14, 12,0,16,19, 0,21,19,16, 14,16,14,11, 12,0,0,0] },
  desert:  { bpm: 126, base: 57, bass: [0,0,0,7, 0,0,10,0, 0,0,0,7, 0,0,5,0, 0,0,0,7, 0,0,10,0, 12,0,10,0, 7,0,5,0], lead: [12,0,15,0, 17,0,15,12, 0,15,12,0, 10,0,12,0, 12,0,15,0, 19,0,17,15, 12,15,12,10, 7,0,0,0] },
  ice:     { bpm: 132, base: 62, bass: [0,0,7,0, 0,0,5,0, 0,0,7,0, 0,0,9,0, 0,0,7,0, 0,0,5,0, 3,0,5,0, 7,0,0,0], lead: [7,0,12,0, 11,0,12,14, 0,0,12,0, 16,14,12,11, 7,0,12,0, 11,0,14,16, 19,0,16,14, 12,0,0,0] },
  rainbow: { bpm: 144, base: 58, bass: [0,0,12,0, 0,0,10,0, 0,0,8,0, 0,0,7,0, 0,0,12,0, 0,0,10,0, 8,0,10,0, 12,0,0,0], lead: [12,15,19,0, 20,19,15,12, 10,13,17,0, 19,17,13,10, 12,15,19,0, 22,20,19,15, 17,15,13,10, 12,0,0,0] }
};
let music = { on: false, song: null, step: 0, nextT: 0, timer: null, tempoMul: 1 };
function musicStart(songKey, tempoMul) {
  musicStop();
  if (!AC) return;
  music.song = SONGS[songKey]; music.on = true; music.step = 0;
  music.tempoMul = tempoMul || 1;
  music.nextT = AC.currentTime + 0.06;
  music.timer = setInterval(musicTick, 25);
}
function musicStop() { music.on = false; if (music.timer) { clearInterval(music.timer); music.timer = null; } }
function musicTick() {
  if (!music.on || !AC) return;
  const s = music.song;
  const stepDur = (60 / (s.bpm * music.tempoMul)) / 4;
  while (music.nextT < AC.currentTime + 0.12) {
    const i = music.step % 32;
    const t = music.nextT;
    const b = s.bass[i], l = s.lead[i];
    try {
      if (b) {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'triangle'; o.frequency.value = 440 * Math.pow(2, (s.base - 24 + b - 69) / 12);
        g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.01, t + stepDur * 1.8);
        o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + stepDur * 2);
      }
      if (l) {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'square'; o.frequency.value = 440 * Math.pow(2, (s.base + l - 69) / 12);
        g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.01, t + stepDur * 1.2);
        o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + stepDur * 1.4);
      }
      if (i % 2 === 0 && noiseBuf) { // hat
        const n = AC.createBufferSource(); n.buffer = noiseBuf;
        const g = AC.createGain(); g.gain.setValueAtTime(i % 8 === 4 ? 0.09 : 0.045, t);
        g.gain.exponentialRampToValueAtTime(0.005, t + 0.03);
        const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;

    music.step++;
  }
}

// ---------------- characters ----------------
const CHARS = [
  { name: 'BURGER',  spd: 0.92, acc: 0.90, hdl: 0.90, wt: 1.0, hue: '#E8543A' },
  { name: 'TACO',    spd: 0.88, acc: 1.00, hdl: 1.00, wt: 0.8, hue: '#F4C542' },
  { name: 'PIZZA',   spd: 1.00, acc: 0.78, hdl: 0.82, wt: 1.3, hue: '#E8862A' },
  { name: 'PANCAKE', spd: 0.97, acc: 0.82, hdl: 0.85, wt: 1.2, hue: '#C98A3B' },
  { name: 'PASTA',   spd: 0.90, acc: 0.88, hdl: 0.96, wt: 1.0, hue: '#F2D272' },
  { name: 'HOTDOG',  spd: 0.94, acc: 0.95, hdl: 0.87, wt: 0.9, hue: '#C0392B' },
];
function P(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w, h); }

// Body painters. g is a 32x32 ctx. sh = horizontal parallax shift, face = true if front visible, ex = eye x offset.
function drawFace(g, cx, y, ex, happy) {
  P(g, cx - 4 + ex, y, 2, 3, '#1a1a1a'); P(g, cx + 2 + ex, y, 2, 3, '#1a1a1a');
  P(g, cx - 4 + ex, y, 1, 1, '#fff'); P(g, cx + 2 + ex, y, 1, 1, '#fff');
  if (happy) { P(g, cx - 2 + ex, y + 4, 4, 1, '#1a1a1a'); P(g, cx - 3 + ex, y + 3, 1, 1, '#1a1a1a'); P(g, cx + 2 + ex, y + 3, 1, 1, '#1a1a1a'); }
}
// Paint minimal fallback sprite per character (used if PNG load fails)
function makeFallbackSprite(ci) {
  const frames = [];
  const hues = ['#F0B04C', '#F4C542', '#FFD966', '#FFE97A', '#F2D272', '#C0392B'];
  const col = hues[ci];
  for (let f = 0; f < 16; f++) {
    const cv = mkCanvas(64, 64), g = cv.getContext('2d');
    g.fillStyle = col;
    g.fillRect(20, 20, 24, 24);
    g.fillStyle = '#222';
    g.fillRect(18, 30, 6, 6);
    g.fillRect(28, 30, 6, 6);
    frames.push(cv);
  }
  return frames;
}
const charFrames = CHARS.map(() => []);
const charFeet = [0.5, 0.5, 0.5, 0.5, 0.5, 0.5];
const charIcons = CHARS.map(() => mkCanvas(16, 16));
// Initialize fallback sprites for all characters + build their icons
for (let ci = 0; ci < CHARS.length; ci++) {
  charFrames[ci] = makeFallbackSprite(ci);
  const cv = mkCanvas(16, 16), g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(charFrames[ci][8], 8, 4, 48, 48, 0, 0, 16, 16);
  charIcons[ci] = cv;
}
// Try loading PNG sprites; fall back to painted if load fails
const spriteLoadPromise = (async function loadAllSprites() {
  const angles = ['0', '22.5', '45', '67.5', '90', '112.5', '135', '157.5', '180', '202.5', '225', '247.5', '270', '292.5', '315', '337.5'];
  const chars = ['burger', 'taco', 'pizza', 'pancake', 'pasta', 'hotdog'];
  const loadChar = async (ci) => {
    const charName = chars[ci];
    const frames = [];
    try {
      for (const ang of angles) {
        const img = new Image();
        img.src = `/games/food-kart/sprites/${charName}/${charName}-${ang}deg.png`;
        await Promise.race([
          new Promise((res, rej) => { img.onload = res; img.onerror = rej; }),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500))
        ]);
        frames.push(img);
      }
      if (frames.length === 16) {
        charFrames[ci] = frames;
        const cv = mkCanvas(16, 16), g = cv.getContext('2d');
        g.imageSmoothingEnabled = false;
        g.drawImage(charFrames[ci][8], 8, 4, 48, 48, 0, 0, 16, 16);
        charIcons[ci] = cv;
      }
    } catch (e) { console.log(`${charName} using fallback`); }
  };
  await Promise.all(chars.map((_, ci) => loadChar(ci)));
})();

// ---------------- item / pickup sprites ----------------
function makeItemSprites() {
  const s = {};
  // item box: rainbow cube, 3 spin frames
  s.box = [];
  for (let f = 0; f < 3; f++) {

function catmull(pts, per) {
  const out = [], c = pts.length;
  for (let i = 0; i < c; i++) {
    const p0 = pts[(i - 1 + c) % c], p1 = pts[i], p2 = pts[(i + 1) % c], p3 = pts[(i + 2) % c];
    for (let j = 0; j < per; j++) {
      const t = j / per, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  return out;
}
function resample(pts, N) {
  const L = [0]; let tot = 0;
  for (let i = 1; i <= pts.length; i++) {
    const a = pts[i - 1], b = pts[i % pts.length];
    tot += Math.hypot(b[0] - a[0], b[1] - a[1]); L.push(tot);
  }
  const out = []; let seg = 0;
  for (let k = 0; k < N; k++) {
    const target = tot * k / N;
    while (L[seg + 1] < target) seg++;
    const a = pts[seg % pts.length], b = pts[(seg + 1) % pts.length];
    const t = (target - L[seg]) / ((L[seg + 1] - L[seg]) || 1);
    out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
  }
  out.total = tot;
  return out;
}

    g.fillStyle = th.roadDark;
    denseFine.forEach(p => { g.beginPath(); g.arc(p[0], p[1], roadW / 2 + 5, 0, PI2); g.fill(); });
    g.fillStyle = th.road;
    denseFine.forEach(p => { g.beginPath(); g.arc(p[0], p[1], roadW / 2, 0, PI2); g.fill(); });
  }

  for (let i = 0; i < NWP; i++) {

    const nx = -dy / len, ny = dx / len;

    const eo = roadW / 2 - 3;
    g.fillRect(p[0] + nx * eo - 2, p[1] + ny * eo - 2, 4, 4);
    g.fillRect(p[0] - nx * eo - 2, p[1] - ny * eo - 2, 4, 4);
  }
  // start/finish checker
  {
    const p = wps[0], q = wps[1];
    const dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy) || 1;
    const tx = dx / len, ty = dy / len, nx = -ty, ny = tx;
    for (let a = -roadW / 2; a < roadW / 2; a += 4) {
      for (let b = 0; b < 12; b += 4) {

// Draws 3 stacked arrow chevrons (oriented along the track direction) onto the
// texture context, then patches just that small region back into texU32 so the
// repaint is cheap enough to call every couple of frames for a "flowing" animation.
function paintBoostPad(g, roadW, pad, hueBase) {

  g.save();
  g.translate(pad.x, pad.y);
  g.rotate(pad.a);
  g.fillStyle = '#232030';
  g.fillRect(-padW / 2 - 2, -span / 2 - 4, padW + 4, span + 8);
  for (let i = 0; i < 3; i++) {
    const yy = span / 2 - 6 - i * 14;

    g.beginPath();
    g.moveTo(0, yy - chevH);
    g.lineTo(padW * 0.42, yy + chevH * 0.6);
    g.lineTo(0, yy + chevH * 0.1);
    g.lineTo(-padW * 0.42, yy + chevH * 0.6);
    g.closePath();
    g.fill();
  }

function updateRace() {
  const pl = player();
  if (frame % BOOST_REPAINT_INTERVAL === 0) track.boostPads.forEach(pad => repaintBoostPad(track, pad));
  if (state === ST.COUNT) {
    countT--;
    if (countT === 180 || countT === 120 || countT === 60) SND.count();
    if (countT === 0) {
      state = ST.RACE;
      SND.go();
      musicStart(track.th.song, 1);
      // GO! — circular launch burst around the player
      for (let i = 0; i < 24; i++) {
        const ba = (i / 24) * PI2;
        parts.push({ x: pl.x + Math.sin(ba) * 6, y: pl.y - Math.cos(ba) * 6, vx: Math.sin(ba) * 1.4, vy: -Math.cos(ba) * 1.4, life: ri(14, 24), col: (i & 1) ? '#4CD34C' : '#fff', sz: 2 });
      }
      // rocket start: A pressed during last beat
      if (keys['a'] && pl.rocketOk) { pl.boostT = 50; SND.boost(); }
    }
    if (countT < 60 && countT > 6 && keys['a']) pl.rocketOk = true;
    updateCamera();
    return;
  }
  raceT++;
  karts.forEach(k => {
    if (k.isPlayer && state === ST.RACE) controlPlayer(k);
    else if (k.isPlayer) { controlAI(k); k.throttle = 0.7; k.brake = 0; } // victory autopilot
    else controlAI(k);
    stepKart(k);
  });

  stepHazards();
  stepPickups();
  stepBoostPads();
  stepParts();
  if (frame % 6 === 0) updateRanks();
  updateCamera();
  if (bannerT > 0) bannerT--;

  // wrong way check
  if (state === ST.RACE) {
    const dot = Math.cos(wrapPi(pl.a - track.tang[pl.wp]));
    if (dot < -0.2 && pl.speed > 0.8) wrongWayT++; else wrongWayT = 0;

    ctx.fillRect(x, y, cw - 6, chh - 5);
    if (sel) { ctx.strokeStyle = '#fff'; ctx.strokeRect(x + 0.5, y + 0.5, cw - 7, chh - 6); }
    text(CHARS[i].name, x + (cw - 6) / 2, y + 3, 1, sel ? '#442200' : '#fff', undefined, 1);
    const f = sel ? ((titleT >> 3) & 15) : 8;
    ctx.drawImage(charFrames[i][f], x, y + 9, 32, 32);
    // stat pips
    const stats = [CHARS[i].spd, CHARS[i].acc, CHARS[i].hdl];
    const labels = ['S', 'A', 'H'];
    stats.forEach((s, si) => {
      text(labels[si], x + 32, y + 14 + si * 8, 1, sel ? '#7A3010' : '#aaa');
      for (let p = 0; p < 5; p++) {
        ctx.fillStyle = p < Math.round((s - 0.75) * 20) ? (sel ? '#E8402A' : '#FFD23F') : 'rgba(255,255,255,.25)';
        ctx.fillRect(x + 40 + p * 5, y + 15 + si * 8, 4, 4);
      }
    });
  }
  text('A: OK   B: BACK', W / 2, H - 10, 1, '#fff', '#333', 1);
}
function drawTrackSelect() {
  menuBg(titleT);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, 14);
  text('PICK A TRACK', W / 2, 4, 1, '#FFD23F', '#442200', 1);
  for (let i = 0; i < 4; i++) {
    const y = 20 + i * 26;
    const sel = i === selTrack;
    ctx.fillStyle = sel ? 'rgba(255,210,63,.9)' : 'rgba(0,0,0,.35)';
    ctx.fillRect(20, y, 200, 22);
    if (sel) { ctx.strokeStyle = '#fff'; ctx.strokeRect(20.5, y + 0.5, 199, 21); }
    text(TRACKS[i].name, 28, y + 4, 1, sel ? '#442200' : '#fff');
    let stars = '';
    for (let s = 0; s < TRACKS[i].diff; s++) stars += '+';
    text(stars, 28, y + 13, 1, sel ? '#E8402A' : '#FFD23F');
    const b = best(i);
    text(b ? fmtTime(b) : '--:--.--', 214, y + 13, 1, sel ? '#7A3010' : '#8CB4FF', undefined, 2);
    try {
      const preview = buildTrack(i).mm;
      ctx.drawImage(preview, 190, y + 1, 20, 20);
    } catch (e) {
      // Skip preview on error, continue drawing other tracks
    }
  }
  text('A: RACE!   B: BACK', W / 2, H - 10, 1, '#fff', '#333', 1);
}
function drawResults() {
  ctx.fillStyle = 'rgba(10,10,30,.88)'; ctx.fillRect(0, 0, W, H);
  const pl = player();
  text('RACE RESULTS', W / 2, 6, 1, '#FFD23F', '#442200', 1);
  text(TRACKS[selTrack].name, W / 2, 16, 1, '#8CB4FF', undefined, 1);
  const order = karts.slice().sort((a, b) => a.rank - b.rank);
  order.forEach((k, i) => {
    const y = 30 + i * 15;
    const isP = k.isPlayer;
    if (isP && (frame & 16) < 10) { ctx.fillStyle = 'rgba(255,210,63,.25)'; ctx.fillRect(14, y - 2, 212, 13); }
    text(ORD[i], 18, y, 1, ORD_COL[i], '#333');
    ctx.drawImage(charIcons[k.ci], 48, y - 3, 12, 12);
    text(CHARS[k.ci].name + (isP ? ' (YOU)' : ''), 64, y, 1, isP ? '#FFD23F' : '#fff');
    text(k.finished ? fmtTime(Math.floor(k.finishTime * 100 / 60)) : '+' + fmtTime(Math.floor((raceT - 0) * 100 / 60)), 222, y, 1, '#8CB4FF', undefined, 2);
  });
  if (pl.rank === 0 && resultT % 5 === 0 && resultT < 120) {
    parts.push({ x: rnd(0, W), y: -4, vx: rnd(-0.3, 0.3), vy: rnd(0.6, 1.4), life: 120, col: ['#FF6EC7', '#5E8CFF', '#FFD23F', '#4CD34C'][ri(0, 3)], sz: 2, screen: true });
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (!p.screen) continue;
    p.x += p.vx; p.y += p.vy; p.life--;
    ctx.fillStyle = p.col; ctx.fillRect(p.x | 0, p.y | 0, p.sz, p.sz);
    if (p.life <= 0 || p.y > H) parts.splice(i, 1);
  }
  if ((frame & 32) < 20) text('A: RETRY  B: TRACKS  START: TITLE', W / 2, H - 10, 1, '#fff', '#333', 1);
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
  text('PAUSED', W / 2, 30, 2, '#FFD23F', '#442200', 1);
  const opts = ['RESUME', 'RESTART', muted ? 'SOUND: OFF' : 'SOUND: ON', 'QUIT'];
  opts.forEach((o, i) => {
    const sel = i === pauseSel;
    if (sel) text('>', W / 2 - 42, 62 + i * 14, 1, '#FFD23F');
    text(o, W / 2, 62 + i * 14, 1, sel ? '#FFD23F' : '#fff', sel ? '#442200' : undefined, 1);
  });
}

// ---------------- state machine ----------------
function btnPress(b) {
  console.log('[btnPress] Called with button:', b, 'state:', state, 'ST.TRACK=', ST.TRACK);
  if (state === ST.TITLE) {
    if (b === 'start' || b === 'a') { SND.menuPick(); state = ST.CHAR; }
    return;
  }
  if (state === ST.CHAR) {
    if (b === 'dpad-left')  { selChar = (selChar + 5) % 6; SND.menuMove(); return; }
    if (b === 'dpad-right') { selChar = (selChar + 1) % 6; SND.menuMove(); return; }
    if (b === 'dpad-up' || b === 'dpad-down') { selChar = (selChar + 3) % 6; SND.menuMove(); return; }
    if (b === 'a' || b === 'start') { SND.menuPick(); state = ST.TRACK; console.log('[btnPress] Transitioning to TRACK state'); return; }
    if (b === 'b') { SND.menuBack(); state = ST.TITLE; return; }
    return;
  }
  if (state === ST.TRACK) {
    console.log('[btnPress] In TRACK state, button:', b);
    if (b === 'dpad-up')   { selTrack = (selTrack + 3) % 4; SND.menuMove(); return; }
    if (b === 'dpad-down') { selTrack = (selTrack + 1) % 4; SND.menuMove(); return; }
    if (b === 'dpad-left') { selTrack = (selTrack + 3) % 4; SND.menuMove(); return; }
    if (b === 'dpad-right'){ selTrack = (selTrack + 1) % 4; SND.menuMove(); return; }
    if (b === 'a' || b === 'start') { SND.menuPick(); initRace(selChar, selTrack); return; }
    if (b === 'b') { SND.menuBack(); state = ST.CHAR; return; }
    return;
  }
  if (state === ST.COUNT || state === ST.RACE || state === ST.FINISH) {
    if (paused) {
      if (b === 'dpad-up')   { pauseSel = (pauseSel + 3) % 4; SND.menuMove(); return; }
      if (b === 'dpad-down') { pauseSel = (pauseSel + 1) % 4; SND.menuMove(); return; }
      if (b === 'a' || b === 'start') {
        if (b === 'start' || pauseSel === 0) { paused = false; if (state === ST.RACE) musicStart(track.th.song, player().lap === LAPS ? 1.12 : 1); }
        else if (pauseSel === 1) { musicStop(); initRace(selChar, selTrack); paused = false; }
        else if (pauseSel === 2) { setMuted(!muted); }
        else if (pauseSel === 3) { paused = false; musicStop(); engineStop(); state = ST.TITLE; exitGameIfEmbeddedElseTitle(); }
        return;
      }
      if (b === 'b') { paused = false; if (state === ST.RACE) musicStart(track.th.song, player().lap === LAPS ? 1.12 : 1); return; }
      return;
    }
    if (b === 'start') { paused = true; pauseSel = 0; musicStop(); engineStop(); return; }
    if (b === 'item' && state === ST.RACE) useItem(player());
    return;
  }
  if (state === ST.RESULT) {
    if (b === 'a') { SND.menuPick(); initRace(selChar, selTrack); }
    if (b === 'b') { SND.menuBack(); musicStop(); state = ST.TRACK; }
    if (b === 'start') { SND.menuPick(); musicStop(); state = ST.TITLE; }
    return;
  }
}
function exitGameIfEmbeddedElseTitle() {
  if (isEmbedded) exitGame();
}

// ---------------- main loop ----------------
const FPS = isMobileDevice ? 30 : 60;
const STEP = 1 / FPS;
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let stepped = false;
  while (acc >= STEP) {
    acc -= STEP;
    frame++;
    if (state === ST.TITLE || state === ST.CHAR || state === ST.TRACK) titleT++;
    else if (!paused && (state === ST.COUNT || state === ST.RACE || state === ST.FINISH)) updateRace();
    else if (state === ST.RESULT) resultT++;
    stepped = true;
  }
  if (!stepped) return;
  // render
  ctx.save();
  if (shakeT > 0 && !paused) ctx.translate(ri(-2, 2), ri(-1, 1));
  if (state === ST.TITLE) drawTitle();
  else if (state === ST.CHAR) drawCharSelect();
  else if (state === ST.TRACK) drawTrackSelect();
  else if (state === ST.COUNT || state === ST.RACE || state === ST.FINISH) {
    renderRace();
    drawHUD();
    drawCountdown();
    drawGo();
    if (state === ST.FINISH) {
      text('FINISH!', W / 2, 50, 3, '#FFD23F', '#7A3010', 1);
      text(ORD[player().rank], W / 2, 78, 2, ORD_COL[player().rank], '#333', 1);
    }
    if (paused) drawPause();
  }
  else if (state === ST.RESULT) drawResults();
  ctx.restore();
}
// wait for sprites to load before starting game loop (avoid flicker on first frame)
spriteLoadPromise.finally(() => requestAnimationFrame(loop));

// cover-render mode for generating the arcade card (?cover=1)
if (location.search.indexOf('cover=1') >= 0) {
  state = ST.TITLE;
  titleT = 30;
}

window.addEventListener('load', () => {
  window.parent.postMessage({ type: 'GAME_LOADED' }, '*');
});
</script>
