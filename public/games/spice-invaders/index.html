<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spice Invaders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; }
        #gameCanvas { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 10px; left: 10px; color: #0f0; font-weight: bold; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; text-align: center; color: white; display: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div id="ui">SCORE: <span id="score">0</span> | LIVES: <span id="lives">3</span></div>
    <div id="gameOver">
        <h2 style="color: #DC2626;">GAME OVER!</h2>
        <button onclick="resetGame()" style="background: #DC2626; border: none; padding: 10px 20px; color: white; border-radius: 5px; cursor: pointer;">INVADE AGAIN</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'playing';
let score = 0;
let lives = 3;
let player = { x: 220, y: 280 };
let bullets = [];
let enemies = [];
let enemyDir = 1;
let enemySpeed = 0.3;

class Bullet {
    constructor(x, y) { this.x = x; this.y = y; }
    update() { this.y -= 6; }
    draw() { ctx.fillStyle = '#0f0'; ctx.fillRect(this.x, this.y, 4, 10); }
}

class Enemy {
    constructor(x, y) { this.x = x; this.y = y; this.emoji = '🌶️'; }
    draw() { ctx.font = '25px Arial'; ctx.textAlign = 'center'; ctx.fillText(this.emoji, this.x, this.y); }
}

function createEnemies() {
    enemies = [];
    for (let y = 0; y < 3; y++) {
        for (let x = 0; x < 8; x++) {
            enemies.push(new Enemy(60 + x * 50, 50 + y * 40));
        }
    }
}

function gameLoop() {
    if (gameState === 'paused') return;
    
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 480, 320);
    
    // Stars
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 20; i++) {
        ctx.fillRect((i * 47) % 480, (i * 23) % 320, 2, 2);
    }
    
    // Player
    ctx.font = '35px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('🧂', player.x, player.y);
    
    // Update bullets
    bullets = bullets.filter(b => {
        b.update();
        b.draw();
        return b.y > 0;
    });
    
    // Move enemies
    let hitEdge = false;
    enemies.forEach(e => {
        e.x += enemySpeed * enemyDir;
        if (e.x < 30 || e.x > 450) hitEdge = true;
    });
    
    if (hitEdge) {
        enemyDir *= -1;
        enemies.forEach(e => e.y += 20);
    }
    
    // Check collisions
    for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].draw();
        
        for (let j = bullets.length - 1; j >= 0; j--) {
            if (Math.abs(bullets[j].x - enemies[i].x) < 15 && Math.abs(bullets[j].y - enemies[i].y) < 15) {
                enemies.splice(i, 1);
                bullets.splice(j, 1);
                score += 100;
                document.getElementById('score').textContent = score;
                window.parent.postMessage({ type: 'SCORE', score: score }, '*');
                break;
            }
        }
    }
    
    // Game over check
    if (enemies.some(e => e.y > 260)) {
        lives = 0;
        document.getElementById('lives').textContent = lives;
        gameOver();
    }
    
    if (enemies.length === 0) {
        enemySpeed += 0.1;
        createEnemies();
    }
    
    requestAnimationFrame(gameLoop);
}

function shoot() {
    bullets.push(new Bullet(player.x, player.y - 20));
}

function gameOver() {
    gameState = 'gameover';
    document.getElementById('gameOver').style.display = 'block';
    window.parent.postMessage({ type: 'GAME_OVER', score: score }, '*');
}

function resetGame() {
    score = 0;
    lives = 3;
    bullets = [];
    enemySpeed = 0.3;
    createEnemies();
    gameState = 'playing';
    document.getElementById('gameOver').style.display = 'none';
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
}

// Controls
document.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft') player.x = Math.max(30, player.x - 15);
    if (e.code === 'ArrowRight') player.x = Math.min(450, player.x + 15);
    if (e.code === 'Space') shoot();
});

function movePlayer(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (480 / rect.width);
    player.x = Math.max(30, Math.min(450, x));
}

canvas.addEventListener('mousemove', (e) => movePlayer(e.clientX));
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); movePlayer(e.touches[0].clientX); });
canvas.addEventListener('click', shoot);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });

// PostMessage API
window.addEventListener('message', (e) => {
    switch(e.data.type) {
        case 'BUTTON_PRESS':
            const btn = e.data.button;
            if (btn === 'dpad-left') player.x = Math.max(30, player.x - 20);
            if (btn === 'dpad-right') player.x = Math.min(450, player.x + 20);
            if (btn === 'a' || btn === 'b' || btn === 'start') shoot();
            if (btn === 'select') window.parent.postMessage({ type: 'GAME_EXIT', gameId: 'spice-invaders' }, '*');
            break;
        case 'PAUSE': gameState = 'paused'; break;
        case 'RESUME': gameState = 'playing'; gameLoop(); break;
        case 'SAVE_STATE': localStorage.setItem('spiceInvaders_state', JSON.stringify({score})); break;
        case 'LOAD_STATE':
            const saved = localStorage.getItem('spiceInvaders_state');
            if (saved) { score = JSON.parse(saved).score; }
            break;
    }
});

createEnemies();
gameLoop();
</script>
</body>
</html>
