const BW=320,BH=480,HUD_H=72;
const PLAYER_SPEED=5.5,BULLET_SPEED=19.5,MAX_SPICE=100,GARLIC_BOMBS_MAX=3,BOSS_EVERY=3;
function isBossWave(w){return w%BOSS_EVERY===0;}
function getBossType(w){return(Math.floor(w/BOSS_EVERY)%2===1)?'chili':'garlic';}

const KILL_TEXTS=[
  {min:0,  words:['ok.','sure.','mid.','exists.']},
  {min:2,  words:['NICE','CLEAN','LET\'S GO','SHEESH']},
  {min:4,  words:['COOKED','RATIO\'D','NO CAP','BUSSIN']},
  {min:7,  words:['DEMOLISHED','GET REKT','L BOZO','SENT HOME']},
  {min:11, words:['UNREAL','GG EZ','GOATED','ASTRONOMICAL','COOKED FR FR']},
];
function getKillText(combo){
  let pool=KILL_TEXTS[0].words;
  for(let i=0;i<KILL_TEXTS.length;i++){if(combo>=KILL_TEXTS[i].min)pool=KILL_TEXTS[i].words;}
  return pool[Math.floor(Math.random()*pool.length)];
}
function calcWaveGrade(timeFrames,maxCombo,damageTaken,wave){
  let pts=100;
  const timePar=600+wave*60;
  if(timeFrames<timePar*0.6)pts+=20;
  else if(timeFrames<timePar*0.8)pts+=10;
  else if(timeFrames>timePar*1.4)pts-=15;
  if(maxCombo>=11)pts+=25;
  else if(maxCombo>=7)pts+=15;
  else if(maxCombo>=4)pts+=8;
  else if(maxCombo>=2)pts+=3;
  pts-=Math.floor(damageTaken/10)*8;
  if(pts>=115)return'S';
  if(pts>=90)return'A';
  if(pts>=70)return'B';
  if(pts>=50)return'C';
  return'D';
}
const GRADE_COL={S:'#ffdd00',A:'#00ff99',B:'#00ccff',C:'#ff8800',D:'#ff2200'};
const COMBO_TIERS=[
  {min:0, label:null,    col:'#ffffff',scale:1.0},
  {min:2, label:'COMBO', col:'#ffff00',scale:1.1},
  {min:4, label:'NICE!', col:'#ff8800',scale:1.3},
  {min:7, label:'SICK!!',col:'#ff2200',scale:1.5},
  {min:11,label:'MAX!!!',col:'rainbow',scale:1.8},
];
function getComboTier(kills){
  let t=COMBO_TIERS[0];
  for(let i=0;i<COMBO_TIERS.length;i++){if(kills>=COMBO_TIERS[i].min)t=COMBO_TIERS[i];}
  return t;
}

const debrisCache={};
function getDebrisCanvas(kind,sz){
  const key=kind+'_'+sz;
  if(debrisCache[key])return debrisCache[key];
  const oc=document.createElement('canvas');oc.width=36;oc.height=36;
  const dc=oc.getContext('2d');
  dc.translate(18,18);dc.strokeStyle='rgba(190,170,130,1)';dc.fillStyle='rgba(190,170,130,1)';dc.lineWidth=1.5;
  dc.scale(sz,sz);
  switch(kind){
    case 'whisk':dc.beginPath();dc.moveTo(0,-10);dc.lineTo(0,3);dc.stroke();for(let i=-2;i<=2;i+=2){dc.beginPath();dc.moveTo(0,3);dc.quadraticCurveTo(i*4,8,i*2,13);dc.stroke();}dc.beginPath();dc.arc(0,13,4,0,Math.PI*2);dc.stroke();break;
    case 'spatula':dc.beginPath();dc.moveTo(0,-12);dc.lineTo(0,3);dc.stroke();dc.strokeRect(-5,3,10,8);break;
    case 'fork':dc.beginPath();dc.moveTo(0,4);dc.lineTo(0,-7);dc.stroke();for(let i=-2;i<=2;i+=2){dc.beginPath();dc.moveTo(i,-7);dc.lineTo(i,-13);dc.stroke();}break;
    case 'ladle':dc.beginPath();dc.moveTo(2,-12);dc.lineTo(-3,5);dc.stroke();dc.beginPath();dc.arc(-5,9,5,0,Math.PI*2);dc.stroke();break;
  }
  debrisCache[key]=oc;return oc;
}

const enemyCache={};
function getEnemyCanvas(type,small){
  const key=type+(small?'_s':'');
  if(enemyCache[key])return enemyCache[key];
  const oc=document.createElement('canvas');oc.width=44;oc.height=44;
  const ec=oc.getContext('2d');
  ec.translate(22,22);if(small)ec.scale(0.62,0.62);
  const sc={
    pepper:{wing:'#3a0000',trim:'#ff2200',body:'#cc0000',body2:'#ff5555'},
    jalapeno:{wing:'#003a00',trim:'#00ff44',body:'#006600',body2:'#00ff44'},
    onion:{wing:'#2d0050',trim:'#cc66ff',body:'#9966cc',body2:'#dd99ff'},
    carrot:{wing:'#2a1400',trim:'#ff8800',body:'#ff8800',body2:'#00aa00'},
    broccoli:{wing:'#002800',trim:'#44cc22',body:'#228822',body2:'#228822'},
    mushroom:{wing:'#2a1800',trim:'#cc8844',body:'#8b4513',body2:'#f5deb3'},
    tomato:{wing:'#2a0000',trim:'#ff4444',body:'#ff4444',body2:'#228822'}
  }[type]||{wing:'#222',trim:'#fff',body:'#888',body2:'#aaa'};
  ec.fillStyle=sc.wing;
  ec.beginPath();ec.moveTo(-3,-2);ec.lineTo(-15,4);ec.lineTo(-11,8);ec.lineTo(-3,4);ec.closePath();ec.fill();
  ec.beginPath();ec.moveTo(3,-2);ec.lineTo(15,4);ec.lineTo(11,8);ec.lineTo(3,4);ec.closePath();ec.fill();
  ec.strokeStyle=sc.trim;ec.lineWidth=1;ec.globalAlpha=0.5;
  ec.beginPath();ec.moveTo(-3,-2);ec.lineTo(-15,4);ec.stroke();
  ec.beginPath();ec.moveTo(3,-2);ec.lineTo(15,4);ec.stroke();
  ec.globalAlpha=1;ec.fillStyle=sc.wing;
  ec.beginPath();ec.ellipse(-13,5,3,2,0.3,0,Math.PI*2);ec.fill();
  ec.beginPath();ec.ellipse(13,5,3,2,-0.3,0,Math.PI*2);ec.fill();
  ec.fillStyle=sc.body;
  switch(type){
    case 'pepper':ec.beginPath();ec.ellipse(0,0,7,10,0,0,Math.PI*2);ec.fill();ec.fillStyle=sc.body2;ec.beginPath();ec.arc(-2,-2,3,0,Math.PI*2);ec.fill();break;
    case 'jalapeno':ec.beginPath();ec.ellipse(0,1,5,11,0.25,0,Math.PI*2);ec.fill();ec.fillStyle=sc.body;ec.beginPath();ec.ellipse(3,9,3,4,-0.5,0,Math.PI*2);ec.fill();ec.fillStyle=sc.body2;ec.beginPath();ec.ellipse(-1,-3,2,5,0.1,0,Math.PI*2);ec.fill();ec.fillStyle='#004400';ec.beginPath();ec.roundRect(-2,-13,4,5,1);ec.fill();break;
    case 'onion':ec.beginPath();ec.arc(0,0,9,0,Math.PI*2);ec.fill();ec.strokeStyle=sc.body2;ec.lineWidth=1.5;ec.beginPath();ec.arc(0,0,5,0,Math.PI*2);ec.stroke();break;
    case 'carrot':ec.beginPath();ec.ellipse(0,0,5,11,0,0,Math.PI*2);ec.fill();ec.fillStyle=sc.body2;ec.fillRect(-2,-14,5,5);break;
    case 'broccoli':ec.beginPath();ec.arc(0,-3,7,0,Math.PI*2);ec.arc(-5,4,5,0,Math.PI*2);ec.arc(5,4,5,0,Math.PI*2);ec.fill();break;
    case 'mushroom':ec.beginPath();ec.arc(0,-3,9,Math.PI,0);ec.fill();ec.fillStyle=sc.body2;ec.fillRect(-3,-3,7,9);break;
    case 'tomato':ec.beginPath();ec.arc(0,0,8,0,Math.PI*2);ec.fill();ec.fillStyle=sc.body2;ec.beginPath();ec.moveTo(0,-7);ec.lineTo(-3,-12);ec.lineTo(3,-12);ec.fill();break;
  }
  ec.fillStyle='rgba(180,230,255,0.7)';ec.beginPath();ec.ellipse(0,-2,3,4,0,0,Math.PI*2);ec.fill();
  enemyCache[key]=oc;return oc;
}

const bgMusic=new Audio('music.mp3');bgMusic.loop=true;bgMusic.volume=0.45;
class AudioEngine{
  constructor(){
    this.muted=false;
    try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){this.ctx=null;}
    this._shootCount=0;
  }
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}
  n2f(s){return 261.63*Math.pow(2,s/12);}
  tone(f,dur,type,vol){
    if(this.muted||!this.ctx)return;
    type=type||'square';vol=vol||0.25;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur);
    o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+dur);
  }
  playMusic(seq){
    if(this.muted)return;
    bgMusic.currentTime=0;
    bgMusic.play().catch(function(){});
  }
  stopMusic(){bgMusic.pause();bgMusic.currentTime=0;}
  shoot(){this._shootCount=(this._shootCount+1)%3;if(this._shootCount===0)this.tone(800,0.08,'square',0.035);}
  explode(){this.tone(200,0.3,'sawtooth',0.06);}
  combo(){this.tone(1400,0.06,'square',0.04);setTimeout(()=>this.tone(1800,0.05,'square',0.03),60);}
  bomb(){this.tone(100,0.8,'square',0.09);}
  powerup(){this.tone(1200,0.2,'sine',0.05);setTimeout(()=>this.tone(1600,0.15,'sine',0.05),100);}
  bossWarn(){[300,250,200].forEach((f,i)=>setTimeout(()=>this.tone(f,0.45,'sawtooth',0.08),i*200));}
  gameOver(){this.stopMusic();[400,350,300,250,200].forEach((f,i)=>setTimeout(()=>this.tone(f,0.38,'sawtooth',0.08),i*140));}
}

class Nebula{
  constructor(){
    this.blobs=[];this.t=0;this.dirty=true;
    for(let i=0;i<10;i++)this.blobs.push({x:Math.random()*BW,y:Math.random()*BH,r:60+Math.random()*100,hue:[270,300,220,200,180][Math.floor(Math.random()*5)],sat:60+Math.random()*30,speed:0.08+Math.random()*0.12,phase:Math.random()*Math.PI*2});
  }
  update(frame){this.t+=0.004;if(frame%8===0)this.dirty=true;}
  _render(){
    nebCtx.clearRect(0,0,BW,BH);
    const bg=nebCtx.createLinearGradient(0,0,0,BH);
    bg.addColorStop(0,'#06001a');bg.addColorStop(0.5,'#0d0030');bg.addColorStop(1,'#1a0010');
    nebCtx.fillStyle=bg;nebCtx.fillRect(0,0,BW,BH);
    nebCtx.globalCompositeOperation='screen';
    for(const b of this.blobs){
      const x=b.x+Math.sin(this.t*b.speed+b.phase)*30,y=b.y+Math.cos(this.t*b.speed*0.7+b.phase)*20;
      const p=0.06+0.03*Math.sin(this.t*1.2+b.phase);
      const g=nebCtx.createRadialGradient(x,y,0,x,y,b.r);
      g.addColorStop(0,'hsla('+b.hue+','+b.sat+'%,60%,'+p+')');g.addColorStop(1,'transparent');
      nebCtx.fillStyle=g;nebCtx.beginPath();nebCtx.arc(x,y,b.r,0,Math.PI*2);nebCtx.fill();
    }
    nebCtx.globalCompositeOperation='source-over';this.dirty=false;
  }
  draw(cx){if(this.dirty)this._render();cx.drawImage(nebulaCanvas,0,0);}
}

class Starfield{
  constructor(){this.layers=[{stars:this._g(15,0.5,1),speed:0.15,alpha:0.35},{stars:this._g(10,1,1.5),speed:0.4,alpha:0.6},{stars:this._g(5,1.5,2.5),speed:0.9,alpha:0.9}];}
  _g(n,a,b){return Array.from({length:n},()=>({x:Math.random()*BW,y:Math.random()*BH,s:a+Math.random()*(b-a),tw:Math.random()*Math.PI*2}));}
  update(){this.layers.forEach((l,li)=>l.stars.forEach(s=>{s.y+=l.speed;s.tw+=0.05+li*0.02;if(s.y>BH){s.y=0;s.x=Math.random()*BW;}}));}
  draw(cx){cx.fillStyle='#fff';this.layers.forEach(l=>l.stars.forEach(s=>{cx.globalAlpha=l.alpha*(0.6+0.4*Math.sin(s.tw));cx.beginPath();cx.arc(s.x,s.y,s.s,0,Math.PI*2);cx.fill();}));cx.globalAlpha=1;}
}

class KitchenDebris{
  constructor(){
    this.items=[];
    ['whisk','spatula','fork','ladle'].forEach(k=>[0.5,0.75,1.0].forEach(sz=>getDebrisCanvas(k,sz)));
    for(let i=0;i<3;i++)this.items.push(this._spawn(true));
  }
  _spawn(anywhere){
    const kinds=['whisk','spatula','fork','ladle'],kind=kinds[Math.floor(Math.random()*kinds.length)];
    const speed=0.5+Math.random()*1.5,depth=speed<0.8?0:speed<1.2?1:2,angle=Math.random()*Math.PI*2;
    return{kind,depth,x:anywhere?Math.random()*BW:(Math.random()<0.5?-20:BW+20),y:anywhere?Math.random()*BH:Math.random()*BH,vx:Math.cos(angle)*speed*(Math.random()<0.5?1:-1),vy:Math.sin(angle)*speed+0.2,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.03,alpha:[0.1,0.18,0.28][depth],size:[0.5,0.75,1.0][depth]};
  }
  update(){this.items=this.items.filter(d=>{d.x+=d.vx;d.y+=d.vy;d.rot+=d.rotV;return d.x>-60&&d.x<BW+60&&d.y<BH+60;});while(this.items.length<3)this.items.push(this._spawn(false));}
  draw(cx){for(const d of this.items){cx.save();cx.globalAlpha=d.alpha;cx.translate(d.x,d.y);cx.rotate(d.rot);cx.drawImage(getDebrisCanvas(d.kind,d.size),-18,-18);cx.restore();}}
}

class Shake{
  constructor(){this.t=0;this.mag=0;this.freeze=0;}
  trigger(m,d,f){this.mag=Math.max(this.mag,m);this.t=Math.max(this.t,d);this.freeze=f||0;}
  apply(cx){
    if(this.t<=0&&this.freeze<=0)return;
    cx.translate((Math.random()*2-1)*this.mag*(this.t/18),(Math.random()*2-1)*this.mag*(this.t/18));
    if(this.freeze>0){this.freeze--;return;}
    this.t--;this.mag*=0.9;
  }
}

class Meteor{
  constructor(){this.x=Math.random()*BW;this.y=HUD_H-20;this.vx=(Math.random()-0.5)*2;this.vy=3+Math.random()*3;this.r=6+Math.random()*10;this.hp=Math.ceil(this.r/4);this.flash=0;}
  update(){this.x+=this.vx;this.y+=this.vy;if(this.flash>0)this.flash--;}
  draw(cx){
    cx.save();cx.translate(this.x,this.y);
    if(this.flash>0){cx.fillStyle='#fff';cx.beginPath();cx.arc(0,0,this.r,0,Math.PI*2);cx.fill();cx.restore();return;}
    cx.fillStyle='#885533';cx.beginPath();cx.arc(0,0,this.r,0,Math.PI*2);cx.fill();
    cx.fillStyle='#664422';cx.beginPath();cx.arc(-this.r*0.2,-this.r*0.2,this.r*0.5,0,Math.PI*2);cx.fill();
    cx.strokeStyle='rgba(255,180,80,0.4)';cx.lineWidth=1.5;cx.beginPath();cx.arc(0,0,this.r,0,Math.PI*2);cx.stroke();
    cx.globalAlpha=0.3;cx.fillStyle='#ff8800';cx.beginPath();cx.ellipse(0,-this.r*1.5,this.r*0.4,this.r*1.2,0,0,Math.PI*2);cx.fill();
    cx.restore();
  }
  hit(d){this.hp-=d;this.flash=5;return this.hp<=0;}
  offScreen(){return this.y>BH+20||this.x<-40||this.x>BW+40;}
}

    cx.beginPath();cx.moveTo(-7,-8);cx.lineTo(-28,13);cx.stroke();
    cx.beginPath();cx.moveTo(7,-8);cx.lineTo(28,13);cx.stroke();

    const hpSlots=[{x:-30,y:6},{x:0,y:-2},{x:30,y:6}];

      if(i>=bombs)continue;

const enemyPool=[];
for(let i=0;i<80;i++)enemyPool.push({alive:false});

function acquireEnemy(x,y,type,wave,small,elite){
  let e=null;
  for(let i=0;i<enemyPool.length;i++){if(!enemyPool[i].alive){e=enemyPool[i];break;}}
  if(!e){e={};enemyPool.push(e);}
  e.alive=true;e.x=e.fx=x;e.y=e.fy=y;e.type=type;e.small=small||false;
  e.elite=(elite&&!small)||false;
  const base={pepper:1,onion:2,carrot:1,broccoli:2,mushroom:2,tomato:1};
  e.hp=e.maxHp=(small?1:(base[type]||1)+Math.floor(wave/4))*(e.elite?2:1);
  e.cd=Math.random()*30;e.breaking=false;e.bx=0;e.by=0;e.bt=0;e.flash=0;
  e._fireChance=0.27;e._fireSpeed=e.elite?7:5.2;e._zigzag=0;
  e.kamikazeActive=false;e.pincerDir=0;
  return e;
}
function enemyScore(e){return(({pepper:10,onion:20,carrot:10,broccoli:30,mushroom:20,tomato:15}[e.type]||10))*(e.small?0.5:1)*(e.elite?3:1);}
function enemySplittable(e){return!e.small&&['onion','broccoli','mushroom'].includes(e.type);}

function updateEnemy(e,ox,px,py,dt,wave){
  if(e.flash>0)e.flash-=dt;
  if(e.kamikazeActive){
    e.x+=e.bx*3;e.y+=e.by*3;e.bt+=dt;
    if(e.bt>200||e.y>BH+30){e.kamikazeActive=false;e.breaking=false;e.bt=0;e.fx=e.x-ox;e.fy=e.y;}
    e.cd-=dt;
    if(e.cd<=0&&e.y>HUD_H){e.cd=80+Math.random()*80;if(Math.random()<e._fireChance*1.5){const a=Math.atan2(py-e.y,px-e.x);return{x:e.x,y:e.y+14,vx:Math.cos(a)*e._fireSpeed,vy:Math.sin(a)*e._fireSpeed};}}
    return null;
  }
  if(!e.breaking){
    e._zigzag+=e.elite?0.14:0.08;
    const zig=e.type==='jalapeno'?Math.sin(e._zigzag)*28:(e.elite?Math.sin(e._zigzag)*18:0);
    e.x=e.fx+ox+zig+e.pincerDir;e.y=Math.max(HUD_H,e.fy);
    if(e.type==='pepper')e.fx+=Math.sin(e.y*0.05)*0.4;
    if(Math.random()<(e.elite?0.002:0.0005)&&e.y>HUD_H+40&&!e.warnTimer){
      e.breaking=true;e.warnTimer=45;
      const a=Math.atan2(py-e.y,px-e.x);e.bx=Math.cos(a)*2.5;e.by=Math.sin(a)*2.5;e.bt=0;e.flash=8;
    }
  }else{
    if(e.warnTimer>0){e.warnTimer--;e.flash=4;return null;}
    e.kamikazeActive=true;
    e.x+=e.bx;e.y+=e.by;e.bt+=dt;
    if(e.type==='carrot')e.by+=0.08;
    if(e.bt>180||e.y>BH+30){e.breaking=false;e.bt=0;e.kamikazeActive=false;}
  }
  e.cd-=dt;
  if(e.cd<=0&&!e.breaking&&e.y>HUD_H){
    e.cd=140+Math.random()*160;
    if(Math.random()<e._fireChance){
      const a=Math.atan2(py-e.y,px-e.x);
      if(wave>=12&&e.elite)return [{x:e.x,y:e.y+14,vx:Math.cos(a-0.15)*e._fireSpeed,vy:Math.sin(a-0.15)*e._fireSpeed},{x:e.x,y:e.y+14,vx:Math.cos(a+0.15)*e._fireSpeed,vy:Math.sin(a+0.15)*e._fireSpeed}];
      return{x:e.x,y:e.y+14,vx:Math.cos(a)*e._fireSpeed,vy:Math.sin(a)*e._fireSpeed};
    }
  }
  return null;
}

      cx.save();cx.globalAlpha=0.2+chargeRatio*0.5;cx.fillStyle='rgba(255,170,0,0.6)';cx.beginPath();cx.arc(this.x,this.y-18,chargeSize*1.5,0,Math.PI*2);cx.fill();

      for(let i=0;i<Math.floor(chargeRatio*12);i++){const angle=frame*0.2+i*Math.PI/6;const dist=chargeSize+8;const px=this.x+Math.cos(angle)*dist;const py=this.y-18+Math.sin(angle)*dist;const ps=1+Math.random()*2;cx.globalAlpha=Math.random()*0.7;cx.fillStyle=Math.random()<0.5?'#ffff00':'#ff8800';cx.fillRect(px-ps/2,py-ps/2,ps,ps);}
      cx.restore();
    }
    SpiceSpr.player(cx,this.x,this.y,frame,this.shielded,this.bombs);
    cx.save();cx.translate(this.x,this.y);
    for(let i=0;i<this.sparks.length;i++){const s=this.sparks[i];cx.globalAlpha=s.life*0.9;cx.fillStyle=s.col;cx.beginPath();cx.arc(s.x,s.y,Math.max(0.1,1.5*s.life),0,Math.PI*2);cx.fill();}
    cx.restore();
  }
  hit(dmg){
    if(this.invuln>0)return false;
    if(this.shielded){this.shielded=false;this.invuln=40;return false;}
    this.spice=Math.max(0,this.spice-Math.max(10,Math.round(dmg/10)*10));
    this.invuln=60;return this.spice<=0;
  }
  heal(n){this.spice=Math.min(MAX_SPICE,this.spice+n);}
  addBomb(){this.bombs=Math.min(GARLIC_BOMBS_MAX,this.bombs+1);}
  applyPU(type){
    if(type==='spread'){this.weapon='spread';this.weaponTimer=300;}
    else if(type==='beam'){this.weapon='beam';this.weaponTimer=600;this.beamActive=false;this.beamTimer=0;this.beamCharge=0;this._beamFired=false;}
    else if(type==='shield'){this.shielded=true;}
    else if(type==='heal'){this.heal(40);}
  }
}

class Boss{
  constructor(type,wave){
    this.type=type;this.x=BW/2;this.y=90+HUD_H/2;
    this.hp=this.maxHp=(type==='chili'?46:52)+wave*2;
    this.targetX=this.x;this.mt=0;this.st=0;this.flash=0;
    this.orbs=[{x:-35,y:-25,hp:5,alive:true,flash:0},{x:35,y:-25,hp:5,alive:true,flash:0},{x:0,y:30,hp:5,alive:true,flash:0}];
    this.coreExposed=false;
  }
  update(px,py,dt){
    if(this.flash>0)this.flash-=dt;
    this.mt+=dt;if(this.mt>100){this.mt=0;this.targetX=70+Math.random()*(BW-140);}
    this.x+=(this.targetX-this.x)*0.025;
    if(!this.coreExposed&&this.orbs.every(o=>!o.alive)){this.coreExposed=true;this.flash=20;}
    this.st+=dt;const interval=this.coreExposed?40:58;
    if(this.st>interval){this.st=0;return this.fire(px,py);}
    return null;
  }
  fire(px,py){
    const b=[];
    if(this.type==='chili'){const a=Math.atan2(py-this.y,px-this.x);for(let i=-2;i<=2;i++)b.push({x:this.x,y:this.y+45,vx:Math.cos(a+i*0.28)*4,vy:Math.sin(a+i*0.28)*4});}
    else{const t=Date.now()*0.002;for(let i=0;i<6;i++){const a=t+i*Math.PI/3;b.push({x:this.x,y:this.y+40,vx:Math.cos(a)*3,vy:Math.sin(a)*3});}}
    return b;
  }
  hit(d,bx,by){
    if(!this.coreExposed){
      let hitOrb=false;
      for(let i=0;i<this.orbs.length;i++){
        const o=this.orbs[i];
        if(o.alive){const dx=(bx||this.x)-(this.x+o.x),dy=(by||this.y)-(this.y+o.y);if(dx*dx+dy*dy<900){o.hp-=d;o.flash=5;if(o.hp<=0){o.alive=false;this.flash=10;}hitOrb=true;break;}}
      }
      if(!hitOrb){this.hp-=Math.ceil(d*0.5);this.flash=4;}
      return this.hp<=0;
    }
    this.hp-=d;this.flash=8;return this.hp<=0;
  }
  draw(cx,frame){
    SpiceSpr.boss(cx,this.x,this.y,this.type,this.hp,this.maxHp,frame);
    if(!this.coreExposed){
      const aliveCount=this.orbs.filter(o=>o.alive).length;
      for(let i=0;i<this.orbs.length;i++){
        const o=this.orbs[i];
        if(o.alive){
          // pulsing outer ring — makes orbs unmissable
          const pulse=0.35+0.35*Math.sin(frame*0.18+i*1.2);
          cx.strokeStyle='rgba(255,0,255,'+pulse+')';cx.lineWidth=2.5;
          cx.beginPath();cx.arc(this.x+o.x,this.y+o.y,16+Math.sin(frame*0.15+i)*2,0,Math.PI*2);cx.stroke();
          // orb body
          cx.fillStyle=o.flash>0?'#fff':'#ff00ff';if(o.flash>0)o.flash--;
          cx.beginPath();cx.arc(this.x+o.x,this.y+o.y,10,0,Math.PI*2);cx.fill();
          cx.fillStyle='#fff';cx.beginPath();cx.arc(this.x+o.x-3,this.y+o.y-3,3,0,Math.PI*2);cx.fill();
          // tiny HP bar under each orb
          const hpR=Math.max(0,o.hp/5);
          cx.fillStyle='rgba(0,0,0,0.7)';cx.fillRect(this.x+o.x-11,this.y+o.y+13,22,4);
          cx.fillStyle=hpR>0.5?'#ff00ff':'#ff2200';cx.fillRect(this.x+o.x-11,this.y+o.y+13,22*hpR,4);
        }
      }
      // "SHOOT ORBS" hint — fades out once player starts hitting them
      const hintAlpha=(0.6+0.4*Math.sin(frame*0.1))*Math.min(1,(aliveCount/3)+0.2);
      cx.save();cx.globalAlpha=hintAlpha;cx.textAlign='center';
      cx.strokeStyle='#000';cx.lineWidth=3;cx.font='bold 9px Courier New';
      cx.strokeText('▼ SHOOT THE ORBS ▼',this.x,this.y+78);
      cx.fillStyle='#ff00ff';cx.fillText('▼ SHOOT THE ORBS ▼',this.x,this.y+78);
      cx.restore();
    }
  }
}

function drawCombo(cx,kills,timer,frame){
  if(kills<2||timer<=0)return;
  const tier=getComboTier(kills);if(!tier.label)return;
  const fade=Math.min(1,timer/20);
  const punch=1+Math.max(0,0.3-timer/40)*2;
  const sc=tier.scale*punch+(Math.sin(frame*0.3)*0.04);
  const fontSize=Math.round(26*sc);
  cx.save();cx.textAlign='center';cx.textBaseline='middle';
  const cx2=BW/2,cy=BH/2-55;
  cx.font='bold '+fontSize+'px Courier New';
  if(tier.col==='rainbow'){
    const txt=kills+'  '+tier.label;
    const totalW=cx.measureText(txt).width+8;
    cx.globalAlpha=fade*0.6;cx.fillStyle='rgba(0,0,0,0.7)';
    cx.beginPath();cx.roundRect(cx2-totalW/2-8,cy-fontSize/2-6,totalW+16,fontSize+12,10);cx.fill();
    cx.globalAlpha=fade*(0.4+0.3*Math.sin(frame*0.18));
    cx.strokeStyle='#ff00ff';cx.lineWidth=3;cx.beginPath();cx.arc(cx2,cy,totalW/2+18+Math.sin(frame*0.2)*5,0,Math.PI*2);cx.stroke();
    cx.strokeStyle='#00ffff';cx.lineWidth=2;cx.beginPath();cx.arc(cx2,cy,totalW/2+28+Math.sin(frame*0.15)*7,0,Math.PI*2);cx.stroke();
    cx.strokeStyle='#ffff00';cx.lineWidth=1;cx.beginPath();cx.arc(cx2,cy,totalW/2+36+Math.sin(frame*0.1)*9,0,Math.PI*2);cx.stroke();
    let ox=cx2-totalW/2+4;
    for(let i=0;i<txt.length;i++){
      const cw=cx.measureText(txt[i]).width;
      cx.globalAlpha=fade;cx.fillStyle=RAINBOW[Math.floor((frame*0.4+i*1.5)%RAINBOW.length)];
      cx.fillText(txt[i],ox+cw/2,cy);ox+=cw;
    }
  }else{
    const txt=kills+'x  '+tier.label;
    const totalW=cx.measureText(txt).width;
    cx.globalAlpha=fade*0.55;cx.fillStyle='rgba(0,0,0,0.65)';
    cx.beginPath();cx.roundRect(cx2-totalW/2-10,cy-fontSize/2-6,totalW+20,fontSize+12,8);cx.fill();
    cx.globalAlpha=fade;cx.fillStyle=tier.col;cx.fillText(txt,cx2,cy);
    cx.globalAlpha=fade*0.25;cx.strokeStyle=tier.col;cx.lineWidth=2;
    cx.beginPath();cx.roundRect(cx2-totalW/2-10,cy-fontSize/2-6,totalW+20,fontSize+12,8);cx.stroke();
  }
  const nextMin=(COMBO_TIERS.find(t=>t.min>kills)||COMBO_TIERS[COMBO_TIERS.length-1]).min;
  const prog=Math.min(1,(kills-tier.min)/Math.max(1,nextMin-tier.min));
  const barW=70,barH=4,barX=cx2-barW/2,barY=cy+fontSize/2+10;
  cx.globalAlpha=fade*0.5;cx.fillStyle='rgba(255,255,255,0.1)';cx.fillRect(barX,barY,barW,barH);
  cx.globalAlpha=fade*0.85;cx.fillStyle=tier.col==='rainbow'?RAINBOW[frame%RAINBOW.length]:tier.col;
  cx.fillRect(barX,barY,barW*prog,barH);
  cx.globalAlpha=1;cx.textBaseline='alphabetic';cx.restore();
}

  constructor(x,y,text,col){this.x=x;this.y=y;this.text=text;this.col=col||'#fff';this.life=1;this.vy=1.4+Math.random()*0.6;this.vx=(Math.random()-0.5)*1.2;this.rot=(Math.random()-0.5)*0.3;this.scale=1.2;}
  update(){this.x+=this.vx;this.y-=this.vy;this.vy*=0.94;this.scale+=(1-this.scale)*0.15;this.life-=0.018;return this.life>0;}
  draw(cx){cx.save();cx.globalAlpha=this.life;cx.translate(this.x,this.y);cx.rotate(this.rot);cx.textAlign='center';cx.textBaseline='middle';cx.font='bold '+Math.round(11*this.scale)+'px Courier New';cx.fillStyle='rgba(0,0,0,0.5)';cx.fillText(this.text,1,1);cx.fillStyle=this.col;cx.fillText(this.text,0,0);cx.restore();}
}

class TitleFormation{
  constructor(){
    this.frame=0;const types=['pepper','onion','carrot','broccoli','tomato','mushroom'];
    this.enemies=[];
    for(let r=0;r<3;r++)for(let c=0;c<6;c++)
      this.enemies.push({type:types[(r*2+c)%types.length],x:BW*0.15+c*(BW*0.14),y:-60-r*40-c*15,ty:80+r*40,tx:BW*0.15+c*(BW*0.14),arrived:false,t:0,phase:Math.random()*Math.PI*2});
  }
  update(){
    this.frame++;
    this.enemies.forEach(function(e){
      if(!e.arrived){e.y+=(e.ty-e.y)*0.06;if(Math.abs(e.y-e.ty)<1){e.y=e.ty;e.arrived=true;}}
      else{e.t+=0.03;e.y=e.ty+Math.sin(e.t+e.phase)*6;e.x=e.tx+Math.sin(e.t*0.7+e.phase)*4;}
    });
  }
  draw(cx){this.enemies.forEach(e=>SpiceSpr.enemy(cx,e.x,e.y,e.type,this.frame,false,false,false));}
}

const Haptics={
  lastFrame:0,minGap:4,
  _now(){return typeof game!=='undefined'?game.frame:0;},
  canFire(){return this._now()-this.lastFrame>=this.minGap;},
  fire(pat,force){
    if(!navigator.vibrate)return;
    if(!force&&!this.canFire())return;
    this.lastFrame=this._now();
    try{navigator.vibrate(pat);}catch(e){}
  },
  kill:25, hit:60, shieldBreak:30, orbBreak:35,
  bossDeath:[40,20,80], bomb:[30,15,30], powerup:[15,10,25],
  missileHit:80, meteorHit:70, waveClear:[20,10,40],
  gameOver:[50,30,50,30,100],
  comboTier(kills){
    return kills>=11?[30,10,30,10,60]:kills>=7?40:kills>=4?25:15;
  }
};
class Game{
  constructor(){
    this.audio=new AudioEngine();
    this.nebula=new Nebula();this.stars=new Starfield();this.debris=new KitchenDebris();this.shake=new Shake();
    this.inp={LEFT:0,RIGHT:0,A:0,B:0,START:0,A_DOWN:false};
    this.state='title';this.score=0;this.wave=1;this.frame=0;
    this.highScore=parseInt(localStorage.getItem('si_hs')||'0');
    this.player=null;this.enemies=[];this.boss=null;
    this.bullets=[];this.blastOrbs=[];this.eBullets=[];this.missiles=[];this.explosions=[];
    this.drops=[];this.powerups=[];this.popups=[];this.killTexts=[];this.bombFx=null;
    this.beamSweep=null;this.bombUsed=false;
    this.fmtX=12;this.fmtDir=1;this.waveIntro=null;
    this.modifier='normal';this.missileTimer=60;
    this.comboKills=0;this.comboTimer=0;this.comboDecay=120;this.maxComboThisWave=0;
    this.waveStartFrame=0;this.waveDamageTaken=0;
    this.lastGrade=null;this.gradeTimer=0;
    this.waveClearing=false;this.waveStartClear=0;this.maxComboFlash=0;
    this.midWaveTimer=0;this.midWaveInterval=480;this.meteors=[];
    this.eventBanner='';this.eventBannerT=0;
    this.diveTimer=0;this.pincerTimer=0;
    this.waveStartEnemyCount=0;this.lastStartFrame=0;
    this.titleFmt=new TitleFormation();
    this.setupInput();requestAnimationFrame((t)=>this.loop(t));
  }

  setupInput(){
    canvas.addEventListener('click',e=>{
      const mx=e.clientX*(BW/W),my=e.clientY*(BH/H);
      if(mx>BW-26&&mx<BW-4&&my>44&&my<64){
        this.audio.muted=!this.audio.muted;
        if(this.audio.muted)this.audio.stopMusic();
        else{this.audio.resume();if(this.state==='playing')this.audio.playMusic(isBossWave(this.wave)?this.audio.bossSeq:this.audio.gameSeq);else if(this.state==='title')this.audio.playMusic(this.audio.titleSeq);}
      }
    });

    // D-pad touch controls — recalculates W/H live so iOS address bar never breaks coords
    const getTouch=(e)=>{
      // Get canvas bounding rect for accurate offset on iOS
      const rect=canvas.getBoundingClientRect();
      const scaleX=BW/rect.width;
      return(e.touches[0].clientX - rect.left)*scaleX;
    };

    canvas.addEventListener('touchstart',(e)=>{
      if(e.touches.length!==1)return;
      const tx=getTouch(e);
      const threshold=BW*0.3;
      if(tx<threshold){this.inp.LEFT=1;this.inp.RIGHT=0;}
      else if(tx>BW-threshold){this.inp.RIGHT=1;this.inp.LEFT=0;}
    },{passive:true});

    canvas.addEventListener('touchmove',(e)=>{
      if(e.touches.length===0)return;
      const tx=getTouch(e);
      const threshold=BW*0.3;
      if(tx<threshold){this.inp.RIGHT=0;this.inp.LEFT=1;}
      else if(tx>BW-threshold){this.inp.LEFT=0;this.inp.RIGHT=1;}
      else{this.inp.LEFT=0;this.inp.RIGHT=0;}
      e.preventDefault();
    },{passive:false});

    canvas.addEventListener('touchend',(e)=>{
      this.inp.LEFT=0;
      this.inp.RIGHT=0;
    },{passive:true});

    window.addEventListener('message',e=>{
      if(e.data.type==='AUDIO_UNLOCK'){if(game&&game.audio)game.audio.initAudio();return;}
      if(e.data.type==='AUDIO_RESUME'){if(game&&game.audio)game.audio.resume();return;}
      if(e.data.type==='BUTTON_PRESS'){
        const btn=e.data.button;
        if(btn==='dpad-left'||btn==='left'){this.inp.LEFT=1;}
        if(btn==='dpad-right'||btn==='right'){this.inp.RIGHT=1;}
        if(btn==='a'||btn==='A'){if(!this.inp.A_DOWN){this.inp.A=1;this.inp.A_DOWN=true;}setTimeout(()=>{this.inp.A=0;this.inp.A_DOWN=false;},80);}
        if(btn==='b'||btn==='B'||btn==='x'||btn==='X'){this.inp.B=1;setTimeout(()=>this.inp.B=0,100);}
        if(btn==='start'){this.inp.START=1;setTimeout(()=>this.inp.START=0,100);}
      }
      if(e.data.type==='BUTTON_RELEASE'){
        const btn=e.data.button;
        if(btn==='dpad-left'||btn==='left'){this.inp.LEFT=0;}
        if(btn==='dpad-right'||btn==='right'){this.inp.RIGHT=0;}
        if(btn==='a'||btn==='A'){this.inp.A_DOWN=false;}
        if(btn==='b'||btn==='B'||btn==='x'||btn==='X'){this.inp.B=0;}
      }
    });
    window.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft')this.inp.LEFT=1;
      if(e.key==='ArrowRight')this.inp.RIGHT=1;
      if((e.key==='z'||e.key==='Z'||e.key===' ')&&!this.inp.A_DOWN){this.inp.A=1;this.inp.A_DOWN=true;}
      if(e.key==='b'||e.key==='B')this.inp.B=1;
      if(e.key==='Enter')this.inp.START=1;
      e.preventDefault();
    });
    window.addEventListener('keyup',e=>{
      if(e.key==='ArrowLeft')this.inp.LEFT=0;
      if(e.key==='ArrowRight')this.inp.RIGHT=0;
      if(e.key==='z'||e.key==='Z'||e.key===' '){this.inp.A=0;this.inp.A_DOWN=false;}
      if(e.key==='b'||e.key==='B')this.inp.B=0;
      if(e.key==='Enter')this.inp.START=0;
    });
  }

  start(){
    this.state='playing';this.score=0;this.wave=1;
    this.player=new Player();
    this.fmtX=12;this.fmtDir=1;this.missileTimer=60;
    this.beamSweep=null;this.bombUsed=false;
    this.comboKills=0;this.comboTimer=0;this.maxComboThisWave=0;
    this.waveStartFrame=0;this.waveDamageTaken=0;
    this.lastGrade=null;this.gradeTimer=0;
    this.waveClearing=false;this.waveStartClear=0;this.waveStartEnemyCount=0;this.lastStartFrame=0;this.maxComboFlash=0;
    this.midWaveTimer=0;this.meteors=[];this.eventBanner='';this.eventBannerT=0;
    this.diveTimer=0;this.pincerTimer=0;this.killTexts=[];
    this.bullets=[];this.blastOrbs=[];this.eBullets=[];this.missiles=[];this.explosions=[];
    this.drops=[];this.powerups=[];this.popups=[];
    for(let i=0;i<enemyPool.length;i++)enemyPool[i].alive=false;
    this.enemies=[];
    this.spawnWave();this.audio.resume();this.audio.playMusic(this.audio.gameSeq);
  }

  spawnWave(){
    console.log(`[spawnWave] CALLED at wave=${this.wave}, frame=${this.frame}`);
    for(let i=0;i<this.enemies.length;i++)this.enemies[i].alive=false;
    this.enemies=[];this.boss=null;this.bullets=[];this.eBullets=[];this.missiles=[];
    this.missileTimer=60;this.waveIntro=null;this.meteors=[];
    this.midWaveTimer=0;this.diveTimer=300;this.pincerTimer=500;
    this.maxComboThisWave=0;this.waveStartFrame=this.frame;this.waveDamageTaken=0;
    const boss=isBossWave(this.wave);
    console.log(`[spawnWave] isBossWave=${boss}, wave=${this.wave}`);
    const modifiers=['normal','fast','tanky','swarm'];
    this.modifier=this.wave>=7?modifiers[Math.floor((this.wave-1)/3)%4]:'normal';
    this.waveIntro=new WaveIntro(this.wave,boss);this.breather=120;
    if(boss){
      this.boss=new Boss(getBossType(this.wave),this.wave);this.audio.bossWarn();
      console.log(`[spawnWave] Spawned BOSS`);
    }else{
      const types=['pepper','jalapeno','onion','carrot','broccoli','mushroom','tomato'];
      const w=this.wave;
      let rows,cols,fireChance,fireSpeed,enemyHpMult,startY;
      if(w===1){rows=2;cols=4;fireChance=0.045;fireSpeed=1.4;enemyHpMult=0.5;startY=HUD_H+20;}
      else if(w===2){rows=2;cols=6;fireChance=0.060;fireSpeed=1.7;enemyHpMult=0.55;startY=HUD_H+26;}
      else if(w===3){rows=3;cols=7;fireChance=0.080;fireSpeed=2.0;enemyHpMult=0.6;startY=HUD_H+28;}
      else{rows=Math.min(6,2+Math.floor((w-1)/2));cols=Math.min(9,4+Math.floor((w-1)*0.7));fireChance=Math.min(0.25,0.10+(w-1)*0.015);fireSpeed=Math.min(4.8,3.2+(w-1)*0.15);enemyHpMult=Math.min(2.5,0.85+(w-1)*0.12);startY=HUD_H+28;}
      if(this.modifier==='swarm'){rows=Math.min(7,rows+1);cols=Math.min(10,cols+2);}
      const sx=Math.min(34,(BW-24)/cols);
      console.log(`[spawnWave] Normal wave: rows=${rows}, cols=${cols}, total=${rows*cols}`);
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          const isElite=w>=9&&Math.random()<0.15;
          const e=acquireEnemy(12+c*sx+sx/2,startY+r*28,types[(r+w)%types.length],w,false,isElite);
          e.hp=e.maxHp=Math.max(1,Math.round(e.maxHp*enemyHpMult));
          e._fireChance=fireChance;e._fireSpeed=isElite?fireSpeed*1.4:fireSpeed;
          if(this.modifier==='fast')e.cd=Math.max(10,e.cd*0.6);
          if(this.modifier==='tanky')e.hp=e.maxHp=Math.floor(e.hp*1.8);
          this.enemies.push(e);
        }
      }
    }
    this.waveStartEnemyCount=this.enemies.length;
    console.log(`[spawnWave] COMPLETED: enemies spawned=${this.enemies.length}, waveStartEnemyCount=${this.waveStartEnemyCount}`);
    for(let i=0;i<1+Math.floor(Math.random()*2);i++){
      setTimeout(()=>{
        if(this.state!=='playing')return;
        this.powerups.push({x:30+Math.random()*(BW-60),y:-20,type:PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)],vy:1.2+Math.random()*0.6});
      },3000+i*4000);
    }
  }

  _playerHit(dmg,pat){
    const wasShielded=this.player.shielded;
    const dead=this.player.hit(dmg);
    if(wasShielded && !this.player.shielded){
      Haptics.fire(Haptics.shieldBreak,true);
    }else if(!wasShielded){
      Haptics.fire(pat||Haptics.hit,true);
    }
    if(!wasShielded&&!this.player.shielded)this.waveDamageTaken+=dmg;
    return dead;
  }

  registerKill(x,y,baseScore){
    this.comboKills++;this.comboTimer=this.comboDecay;
    if(this.comboKills>this.maxComboThisWave)this.maxComboThisWave=this.comboKills;
    const mult=this.comboKills>=11?5:this.comboKills>=7?4:this.comboKills>=4?3:this.comboKills>=2?2:1;
    const pts=Math.floor(baseScore*mult);
    this.score+=pts;
    const tier=getComboTier(this.comboKills);
    const popCol=tier.col==='rainbow'?RAINBOW[Math.floor(Math.random()*RAINBOW.length)]:tier.col;
    this.popups.push(new Popup(x,y,pts,popCol));
    const showText=this.comboKills===2||this.comboKills===4||this.comboKills===7||this.comboKills===11||Math.random()<0.22;
    if(showText){
      const ktxt=getKillText(this.comboKills);
      const ktCol=tier.col==='rainbow'?RAINBOW[Math.floor(Math.random()*RAINBOW.length)]:tier.col;
      this.killTexts.push(new KillText(x+(Math.random()-0.5)*30,y-14,ktxt,ktCol));
    }
    if(mult>1)this.audio.combo();
    if(this.comboKills===11)this.maxComboFlash=60;
    Haptics.fire(Haptics.kill);
    Haptics.fire(Haptics.comboTier(this.comboKills));
    return pts;
  }

  triggerMidWaveEvent(){
    if(this.boss||this.enemies.length<3)return;
    const roll=Math.random();
    if(roll<0.35){
      const pool=['ROCKS FROM GOD','YOU COOKED BRO','DODGE OR DIE FR'];
      this.eventBanner=pool[Math.floor(Math.random()*pool.length)];this.eventBannerT=60;
      for(let i=0;i<6+this.wave;i++)setTimeout(()=>{if(this.state==='playing')this.meteors.push(new Meteor());},i*200);
    }else if(roll<0.65){
      const pool=['THEY CALLED BACKUP','MORE INCOMING FR','REINFORCEMENTS NO CAP'];
      this.eventBanner=pool[Math.floor(Math.random()*pool.length)];this.eventBannerT=60;
      const types=['pepper','carrot','tomato','jalapeno'];
      const cols=Math.min(7,3+Math.floor(this.wave/3));
      const sx=(BW-24)/cols;
      for(let c=0;c<cols;c++){
        const e=acquireEnemy(12+c*sx+sx/2,HUD_H+10,types[Math.floor(Math.random()*types.length)],this.wave,true,false);
        e._fireChance=0.15;this.enemies.push(e);
      }
    }else{
      const pool=['MINI BOSS ATE','GOAT STATUS ENEMY','BIG GUY DIFF'];
      this.eventBanner=pool[Math.floor(Math.random()*pool.length)];this.eventBannerT=60;
      const types=['onion','broccoli','mushroom'];
      const e=acquireEnemy(BW/2,HUD_H+20,types[Math.floor(Math.random()*types.length)],this.wave,false,true);
      e.hp=e.maxHp=20+this.wave*2;e._fireChance=0.5;e._fireSpeed=4;
      this.enemies.push(e);this.audio.bossWarn();
    }
  }

  triggerDive(){
    if(this.enemies.length<4)return;
    const col=this.enemies.filter(e=>!e.kamikazeActive&&!e.breaking);
    if(col.length<2)return;
    const pool=['THEY RUSHING FR','ATTACKKKKK','MAX AURA CHARGE','ONGOD THEY DIVING'];
    this.eventBanner=pool[Math.floor(Math.random()*pool.length)];this.eventBannerT=45;
    col.slice(0,Math.min(3,col.length)).forEach((e,i)=>{
      setTimeout(()=>{
        if(!e.alive)return;
        e.breaking=true;e.warnTimer=40;
        const a=Math.atan2(this.player.y-e.y,this.player.x-e.x);
        e.bx=Math.cos(a)*2.2;e.by=Math.sin(a)*2.2;e.bt=0;e.flash=6;
      },i*120);
    });
  }

  triggerPincer(){
    if(this.enemies.length<4)return;
    const sorted=[...this.enemies].sort((a,b)=>a.x-b.x);
    const left=sorted[0],right=sorted[sorted.length-1];
    if(!left||!right||left===right)return;
    const pool=['THEY MAXXING ON YOU','SURROUND DIFF','GAME MAXXING RN','AURA SANDWICH'];
    this.eventBanner=pool[Math.floor(Math.random()*pool.length)];this.eventBannerT=45;
    let lt=0;
    const iv=setInterval(()=>{
      if(!left.alive||!right.alive||this.state!=='playing'){clearInterval(iv);return;}
      lt++;left.pincerDir+=0.8;right.pincerDir-=0.8;
      if(lt>60){left.pincerDir=0;right.pincerDir=0;clearInterval(iv);}
    },16);
  }

  update(){
    this.frame++;
    this.nebula.update(this.frame);this.stars.update();this.debris.update();
    if(this.waveIntro&&!this.waveIntro.done)this.waveIntro.update();
    if(this.state==='title'){
      this.titleFmt.update();
      if(!this.audio.musicPlaying){this.audio.resume();this.audio.playMusic(this.audio.titleSeq);}
      if(this.inp.A===1||this.inp.START===1)this.start();
    }else if(this.state==='playing'){
      this.updatePlay();
    }else if(this.state==='paused'){
      if(this.inp.START===1&&(this.frame-this.lastStartFrame)>30){
        this.lastStartFrame=this.frame;
        this.state='playing';
        if(this.waveClearing&&!this.enemies.length&&!this.boss){
          this.wave++;this.spawnWave();this.player.heal(30);this.popups.push(new Popup(this.player.x,this.player.y-30,30,'#00ff66'));this.waveClearing=false;
        }
        this.audio.resume();this.audio.playMusic(isBossWave(this.wave)?this.audio.bossSeq:this.audio.gameSeq);
      }
    }else if(this.state==='gameover'||this.state==='victory'){
      if(this.inp.A===1||this.inp.START===1)this.state='title';
    }
  }

  updatePlay(){
    if(this.inp.START===1&&(this.frame-this.lastStartFrame)>30){this.lastStartFrame=this.frame;this.state='paused';this.audio.stopMusic();return;}
    if(this.inp.B===1){
      this.inp.B=0;
      if(this.player&&this.player.bombs>0&&!this.beamSweep&&!this.bombUsed){
        this.bombUsed=true;this.player.bombs--;
        this.beamSweep={y:HUD_H,charging:true,chargeT:0,active:false};
        this.audio.bomb();Haptics.fire(Haptics.bomb,true);
      }
    }
    const act=this.player.update(this.inp,1,this.frame);
    if(act&&act.type==='bullets'&&act.bullets.length>0){this.bullets.push(...act.bullets);this.audio.shoot();}
    if(act&&act.type==='blastorbs'&&act.orbs.length>0){this.blastOrbs.push(...act.orbs);this.audio.shoot();}
    if(this.comboTimer>0){this.comboTimer--;if(this.comboTimer<=0)this.comboKills=0;}
    if(this.maxComboFlash>0)this.maxComboFlash--;
    const enemyRatio=(!this.boss&&this.waveStartEnemyCount>0)?this.enemies.length/this.waveStartEnemyCount:1;
    const fmtSpd=1.15*(1+(1-enemyRatio)*2.2);
    this.fmtX+=fmtSpd*this.fmtDir;if(Math.abs(this.fmtX)>28)this.fmtDir*=-1;
    if(this.breather>0){this.breather--;}
    if(!this.boss&&this.enemies.length>0&&this.breather<=0){
      this.midWaveTimer++;
      if(this.midWaveTimer>this.midWaveInterval){this.midWaveTimer=0;this.midWaveInterval=360+Math.random()*240;this.triggerMidWaveEvent();}
      this.diveTimer--;if(this.diveTimer<=0){this.diveTimer=320+Math.random()*200;this.triggerDive();}
      this.pincerTimer--;if(this.pincerTimer<=0){this.pincerTimer=400+Math.random()*300;this.triggerPincer();}
    }
    if(this.eventBannerT>0)this.eventBannerT--;
    this.meteors=this.meteors.filter(m=>{
      m.update();
      const dx=m.x-this.player.x,dy=m.y-this.player.y;
      if(dx*dx+dy*dy<(m.r+14)*(m.r+14)){
        this.boom(m.x,m.y,m.r*2);this.shake.trigger(6,10,1);
        if(this._playerHit(12,Haptics.meteorHit)){if(this.score>this.highScore){this.highScore=this.score;localStorage.setItem('si_hs',this.highScore);}this.state='gameover';this.audio.gameOver();Haptics.fire(Haptics.gameOver,true);}
        return false;
      }
      return !m.offScreen();
    });
    if(this.player.beamActive&&this.player.beamCharge<=0&&this.frame%3===0){
      const bx=this.player.x;
      for(let i=this.enemies.length-1;i>=0;i--){
        const e=this.enemies[i];
        if(Math.abs(e.x-bx)<12&&e.y<this.player.y){
          if(hitEnemy(e,1)){
            this.boom(e.x,e.y,e.small?12:18);this.registerKill(e.x,e.y,enemyScore(e));
            if(enemySplittable(e)){[-18,18].forEach(ox=>this.enemies.push(acquireEnemy(e.x+ox,e.y,e.type,this.wave,true)));}
            e.alive=false;this.enemies.splice(i,1);this.audio.explode();
          }
        }
      }
      if(this.boss&&Math.abs(this.boss.x-bx)<40){if(this.boss.hit(1,bx,this.player.y)){this.boom(this.boss.x,this.boss.y,60);this.score+=1000;this.boss=null;this.shake.trigger(12,22,3);this.audio.explode();}}
      for(let mi=this.missiles.length-1;mi>=0;mi--){const m=this.missiles[mi];if(Math.abs(m.x-bx)<12&&m.y<this.player.y){this.boom(m.x,m.y,20);this.missiles.splice(mi,1);}}
    }
    for(let i=this.enemies.length-1;i>=0;i--){
      const e=this.enemies[i];
      if(this.breather>0)continue;
      const b=updateEnemy(e,this.fmtX,this.player.x,this.player.y,1,this.wave);
      if(b){if(Array.isArray(b))this.eBullets.push(...b);else this.eBullets.push(b);if(this.eBullets.length>40)this.eBullets.splice(0,this.eBullets.length-40);}
      if(Math.abs(e.x-this.player.x)<40&&Math.abs(e.y-this.player.y)<40){
        const dx=e.x-this.player.x,dy=e.y-this.player.y;
        if(dx*dx+dy*dy<1100){
          this.boom(e.x,e.y,28);this.audio.explode();this.shake.trigger(8,14,2);
          e.alive=false;this.enemies.splice(i,1);
          if(this._playerHit(22,Haptics.hit)){if(this.score>this.highScore){this.highScore=this.score;localStorage.setItem('si_hs',this.highScore);}this.state='gameover';this.audio.gameOver();Haptics.fire(Haptics.gameOver,true);}
        }
      }
    }
    if(this.boss&&this.breather<=0){const bs=this.boss.update(this.player.x,this.player.y,1);if(bs)this.eBullets.push(...bs.map(b=>({x:b.x,y:b.y,vx:b.vx*1.5,vy:b.vy*1.5})));}
    if(this.wave>=2&&this.breather<=0){this.missileTimer--;if(this.missileTimer<=0){this.missileTimer=Math.max(180,420-this.wave*18)+Math.random()*80;this._spawnMissile();}}
    if(this.beamSweep){
      const sw=this.beamSweep;
      if(sw.charging){sw.chargeT++;if(sw.chargeT>30){sw.charging=false;sw.active=true;sw.y=HUD_H;}}
      else if(sw.active){
        sw.y+=8;
        for(let i=this.enemies.length-1;i>=0;i--){
          const e=this.enemies[i];
          if(e.y>=sw.y-12&&e.y<=sw.y+12){this.boom(e.x,e.y,e.small?14:22);this.registerKill(e.x,e.y,enemyScore(e));e.alive=false;this.enemies.splice(i,1);}
        }
        if(this.boss&&this.boss.y>=sw.y-20&&this.boss.y<=sw.y+20){
          if(this.boss.hit(8,this.boss.x,this.boss.y)){this.boom(this.boss.x,this.boss.y,60);this.score+=1000;this.boss=null;this.shake.trigger(12,22,3);this.audio.explode();}
        }
        for(let i=this.missiles.length-1;i>=0;i--){const m=this.missiles[i];if(m.y>=sw.y-12&&m.y<=sw.y+12){this.boom(m.x,m.y,20);this.missiles.splice(i,1);}}
        this.eBullets=this.eBullets.filter(b=>b.y<sw.y-4);
        if(sw.y>BH+20){this.beamSweep=null;this.bombUsed=false;}
      }
    }
    this.updateBullets();this.updateBlastOrbs();this.updateMissiles();
    this.powerups=this.powerups.filter(p=>{
      p.y+=p.vy;const dx=p.x-this.player.x,dy=p.y-this.player.y;
      if(dx*dx+dy*dy<900){this.player.applyPU(p.type);this.audio.powerup();Haptics.fire(Haptics.powerup,true);return false;}
      return p.y<BH+30;
    });
    if(this.explosions.length>25)this.explosions.splice(0,this.explosions.length-25);
    this.explosions=this.explosions.filter(e=>{e.p+=0.06;return e.p<1;});
    this.drops=this.drops.filter(d=>{
      d.y+=2.5;const dx=d.x-this.player.x,dy=d.y-this.player.y;
      if(dx*dx+dy*dy<900){this.player.heal(18);this.audio.powerup();return false;}
      return d.y<BH+60;
    });
    this.popups=this.popups.filter(p=>p.update());
    this.killTexts=this.killTexts.filter(k=>k.update());
    if(this.bombFx){this.bombFx.p+=0.03;if(this.bombFx.p>=1)this.bombFx=null;}
    if(this.gradeTimer>0)this.gradeTimer--;
    if(this.frame%90===0)this.player.spice=Math.max(0,this.player.spice-0.5);
    if(this.player.spice<=0){if(this.score>this.highScore){this.highScore=this.score;localStorage.setItem('si_hs',this.highScore);}this.state='gameover';this.audio.gameOver();Haptics.fire(Haptics.gameOver,true);}
    if(!this.enemies.length&&!this.boss&&!this.waveClearing){
      console.log(`[WAVE CLEAR] Wave ${this.wave} cleared! enemies=${this.enemies.length}, boss=${this.boss}, frame=${this.frame}`);
      this.waveClearing=true;this.waveStartClear=this.frame;Haptics.fire(Haptics.waveClear,true);
      const g=calcWaveGrade(this.frame-this.waveStartFrame,this.maxComboThisWave,this.waveDamageTaken,this.wave);
      this.lastGrade=g;this.gradeTimer=140;
      const clearedWave=this.wave;
      setTimeout(()=>{
        console.log(`[TIMEOUT FIRED] clearedWave=${clearedWave}, currentWave=${this.wave}, state=${this.state}, waveClearing=${this.waveClearing}`);
        if(this.state!=='playing'){console.log(`[TIMEOUT SKIP] state not playing`);return;}
        if(this.wave!==clearedWave){console.log(`[TIMEOUT SKIP] wave already advanced`);return;}
        console.log(`[TIMEOUT ADVANCE] incrementing from wave ${this.wave} to ${this.wave+1}`);
        this.wave++;this.spawnWave();this.player.heal(30);this.popups.push(new Popup(this.player.x,this.player.y-30,30,'#00ff66'));this.waveClearing=false;
        this.audio.playMusic(isBossWave(this.wave)?this.audio.bossSeq:this.audio.gameSeq);
      },800);
    }
    if(this.waveClearing&&this.waveStartClear&&(this.frame-this.waveStartClear)>300){
      console.log(`[SAFETY NET] Wave clearing took >300 frames, advancing from ${this.wave} to ${this.wave+1}`);
      this.wave++;this.spawnWave();this.player.heal(30);this.popups.push(new Popup(this.player.x,this.player.y-30,30,'#00ff66'));this.waveClearing=false;
      this.audio.playMusic(isBossWave(this.wave)?this.audio.bossSeq:this.audio.gameSeq);
    }
  }

  _spawnMissile(){
    const fromLeft=Math.random()<0.5,x=fromLeft?-10:BW+10,y=100+Math.random()*(BH-220);
    const speed=1.4+this.wave*0.08;
    const tx=this.player.x+(Math.random()-0.5)*60,ty=this.player.y+(Math.random()-0.5)*40;
    const dist=Math.hypot(tx-x,ty-y)||1;
    this.missiles.push({x,y,vx:(tx-x)/dist*speed,vy:(ty-y)/dist*speed,trail:[],life:260});
  }

  updateMissiles(){
    this.missiles=this.missiles.filter(m=>{
      m.x+=m.vx;m.y+=m.vy;m.life--;
      const dx=this.player.x-m.x,dy=this.player.y-m.y,dist=Math.hypot(dx,dy)||1;
      m.vx+=(dx/dist)*0.035;m.vy+=(dy/dist)*0.035;
      const spd=Math.hypot(m.vx,m.vy),maxSpd=3.5+this.wave*0.1;
      if(spd>maxSpd){m.vx=m.vx/spd*maxSpd;m.vy=m.vy/spd*maxSpd;}
      m.trail.push({x:m.x,y:m.y,life:1});if(m.trail.length>12)m.trail.shift();
      m.trail.forEach(t=>t.life-=0.09);
      const pdx=m.x-this.player.x,pdy=m.y-this.player.y;
      if(pdx*pdx+pdy*pdy<625){
        this.boom(m.x,m.y,32);this.audio.explode();this.shake.trigger(9,16,2);
        if(this._playerHit(18,Haptics.missileHit)){if(this.score>this.highScore){this.highScore=this.score;localStorage.setItem('si_hs',this.highScore);}this.state='gameover';this.audio.gameOver();Haptics.fire(Haptics.gameOver,true);}
        return false;
      }
      return m.life>0&&m.x>-30&&m.x<BW+30&&m.y>-30&&m.y<BH+30;
    });
  }

  updateBullets(){
    this.bullets=this.bullets.filter(b=>{
      b.x+=b.vx;b.y+=b.vy;let hit=false;
      if(this.boss){
        const dx=b.x-this.boss.x,dy=b.y-this.boss.y;
        if(dx*dx+dy*dy<2500){
          if(this.boss.hit(b.dmg,b.x,b.y)){this.boom(this.boss.x,this.boss.y,60);this.score+=1000;this.boss=null;this.shake.trigger(12,22,3);this.audio.explode();Haptics.fire(Haptics.bossDeath,true);this.player.heal(25);this.player.addBomb();this.popups.push(new Popup(this.player.x,this.player.y-30,25,'#00ff66'));this.powerups.push({x:this.player.x,y:this.player.y-40,type:PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)],vy:0});this.missiles=[];this.missileTimer=300;}
          else{this.shake.trigger(4,8,1);Haptics.fire(Haptics.orbBreak,true);}hit=!b.pierce;
        }
      }
      if(!hit){
        for(let i=this.enemies.length-1;i>=0;i--){
          const e=this.enemies[i];
          if(Math.abs(e.y-b.y)>28||Math.abs(e.x-b.x)>28)continue;
          const dx=b.x-e.x,dy=b.y-e.y;
          if(dx*dx+dy*dy<(e.small?144:380)){
            if(hitEnemy(e,b.dmg)){
              this.boom(e.x,e.y,e.small?14:22);this.registerKill(e.x,e.y,enemyScore(e));
              if(Math.random()<0.08)this.drops.push({x:e.x,y:e.y});
              if(enemySplittable(e))[-18,18].forEach(ox=>this.enemies.push(acquireEnemy(e.x+ox,e.y,e.type,this.wave,true)));
              e.alive=false;this.enemies.splice(i,1);this.audio.explode();this.shake.trigger(3,6,0);
            }
            hit=!b.pierce;break;
          }
        }
      }
      if(!hit){
        for(let mi=this.meteors.length-1;mi>=0;mi--){
          const m=this.meteors[mi];const dx=b.x-m.x,dy=b.y-m.y;
          if(dx*dx+dy*dy<m.r*m.r){if(m.hit(b.dmg)){this.boom(m.x,m.y,m.r*2);this.meteors.splice(mi,1);this.registerKill(m.x,m.y,50);}hit=true;break;}
        }
      }
      if(!hit){
        for(let mi=this.missiles.length-1;mi>=0;mi--){
          const m=this.missiles[mi];const dx=b.x-m.x,dy=b.y-m.y;
          if(dx*dx+dy*dy<400){this.boom(m.x,m.y,22);this.audio.explode();this.missiles.splice(mi,1);hit=!b.pierce;break;}
        }
      }
      return b.y>-20&&!hit;
    });
    this.eBullets=this.eBullets.filter(b=>{
      b.x+=b.vx;b.y+=b.vy;
      const dx=b.x-this.player.x,dy=b.y-this.player.y;
      if(dx*dx+dy*dy<324){
        if(this._playerHit(14,Haptics.hit)){if(this.score>this.highScore){this.highScore=this.score;localStorage.setItem('si_hs',this.highScore);}this.state='gameover';this.audio.gameOver();Haptics.fire(Haptics.gameOver,true);}
        else this.shake.trigger(6,12,0);return false;
      }
      return b.y<BH+20&&b.x>-20&&b.x<BW+20;
    });
  }

  updateBlastOrbs(){
    this.blastOrbs=this.blastOrbs.filter(orb=>{
      orb.x+=orb.vx;orb.y+=orb.vy;let hit=false;
      if(this.boss){
        const dx=orb.x-this.boss.x,dy=orb.y-this.boss.y,dist=Math.hypot(dx,dy);
        if(dist<orb.size+40){
          const dmgMult=1+orb.power*2;
          if(this.boss.hit(orb.dmg*dmgMult,orb.x,orb.y)){this.boom(this.boss.x,this.boss.y,60);this.score+=1000;this.boss=null;this.shake.trigger(12,22,3);this.audio.explode();Haptics.fire(Haptics.bossDeath,true);this.player.heal(25);this.player.addBomb();this.popups.push(new Popup(this.player.x,this.player.y-30,25,'#00ff66'));this.powerups.push({x:this.player.x,y:this.player.y-40,type:PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)],vy:0});this.missiles=[];this.missileTimer=300;}
          else{this.shake.trigger(4,8,1);Haptics.fire(Haptics.orbBreak,true);}hit=true;
        }
      }
      if(!hit){
        for(let i=this.enemies.length-1;i>=0;i--){
          const e=this.enemies[i];const dx=orb.x-e.x,dy=orb.y-e.y;
          if(dx*dx+dy*dy<(orb.size+20)*(orb.size+20)){
            const dmgMult=1+orb.power*2;
            if(hitEnemy(e,orb.dmg*dmgMult)){
              this.boom(e.x,e.y,orb.size*1.2);this.registerKill(e.x,e.y,enemyScore(e));
              if(Math.random()<0.08)this.drops.push({x:e.x,y:e.y});
              if(enemySplittable(e))[-18,18].forEach(ox=>this.enemies.push(acquireEnemy(e.x+ox,e.y,e.type,this.wave,true)));
              e.alive=false;this.enemies.splice(i,1);this.audio.explode();this.shake.trigger(3,6,0);
            }
            hit=true;break;
          }
        }
      }
      if(!hit){
        for(let mi=this.missiles.length-1;mi>=0;mi--){
          const m=this.missiles[mi];const dx=orb.x-m.x,dy=orb.y-m.y;
          if(dx*dx+dy*dy<(orb.size+20)*(orb.size+20)){this.boom(m.x,m.y,orb.size);this.audio.explode();this.missiles.splice(mi,1);hit=true;break;}
        }
      }
      return orb.y>-40&&!hit;
    });
  }

  boom(x,y,size){this.explosions.push({x,y,size,p:0});}

  draw(){
    ctx.save();ctx.clearRect(0,0,W,H);ctx.scale(W/BW,H/BH);
    this.shake.apply(ctx);
    this.nebula.draw(ctx);this.stars.draw(ctx);this.debris.draw(ctx);
    if(this.state==='title')this.drawTitle();
    else if(this.state==='playing')this.drawPlay();
    else if(this.state==='paused'){this.drawPlay();this.drawPaused();}
    else if(this.state==='gameover'){this.drawPlay();this.drawGameOver();}
    else if(this.state==='victory'){this.drawPlay();this.drawVictory();}
    if(this.waveIntro&&!this.waveIntro.done)this.waveIntro.draw(ctx);
    ctx.restore();
  }

  drawTitle(){
    this.titleFmt.draw(ctx);ctx.textAlign='center';
    ctx.fillStyle='#ff6600';ctx.font='bold 40px Courier New';ctx.fillText('SPICE',BW/2,BH/2-40);
    ctx.fillStyle='#ffcc00';ctx.font='bold 40px Courier New';ctx.fillText('INVADERS',BW/2,BH/2);
    if(this.highScore>0){ctx.fillStyle='#000';ctx.font='bold 14px Courier New';ctx.fillText('BEST: '+this.highScore,BW/2+1,BH/2+36);ctx.fillStyle='#fff';ctx.fillText('BEST: '+this.highScore,BW/2,BH/2+35);}
    ctx.fillStyle='#aaa';ctx.font='11px Courier New';ctx.fillText('Z: Shoot  B: Bomb  Grab powerups!',BW/2,BH/2+62);
    if(Math.floor(this.frame/28)%2===0){ctx.fillStyle='#00ff44';ctx.font='bold 17px Courier New';ctx.fillText('PRESS START',BW/2,BH/2+115);}
  }

  drawPlay(){
    if(this.player){this.player.drawTrail(ctx);this.player.draw(ctx,this.frame);}
    this.enemies.forEach(e=>drawEnemy(ctx,e,this.frame));
    if(this.boss)this.boss.draw(ctx,this.frame);
    this.meteors.forEach(m=>m.draw(ctx,this.frame));
    this.bullets.forEach(b=>SpiceSpr.bullet(ctx,b.x,b.y));
    this.blastOrbs.forEach(orb=>SpiceSpr.blastOrb(ctx,orb.x,orb.y,orb.size,orb.power,this.frame));
    this.eBullets.forEach(b=>SpiceSpr.eBullet(ctx,b.x,b.y));
    this.missiles.forEach(m=>SpiceSpr.missile(ctx,m.x,m.y,m.vx,m.vy,m.trail));
    this.explosions.forEach(e=>SpiceSpr.explosion(ctx,e.x,e.y,e.size,e.p));
    this.drops.forEach(d=>SpiceSpr.drop(ctx,d.x,d.y,this.frame));
    this.powerups.forEach(p=>drawPU(ctx,p.x,p.y,p.type,this.frame));
    if(this.beamSweep){
      const sw=this.beamSweep;
      if(sw.charging){
        const cp=sw.chargeT/30;
        ctx.save();ctx.globalAlpha=cp*0.5;ctx.fillStyle='rgba(0,200,255,0.3)';ctx.fillRect(0,0,BW,BH);
        for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2+this.frame*0.25,r=(1-cp)*60+8;ctx.globalAlpha=cp*0.9;ctx.fillStyle='#00ffff';ctx.beginPath();ctx.arc(this.player.x+Math.cos(a)*r,this.player.y+Math.sin(a)*r,2+cp*3,0,Math.PI*2);ctx.fill();}
        ctx.globalAlpha=cp*0.7;const g=ctx.createRadialGradient(this.player.x,this.player.y,0,this.player.x,this.player.y,40);g.addColorStop(0,'rgba(0,255,255,0.6)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.player.x,this.player.y,40,0,Math.PI*2);ctx.fill();ctx.restore();
      }else if(sw.active){
        ctx.save();
        const bg=ctx.createLinearGradient(0,sw.y-18,0,sw.y+18);
        bg.addColorStop(0,'rgba(0,255,255,0)');bg.addColorStop(0.3,'rgba(0,255,255,0.85)');bg.addColorStop(0.5,'rgba(255,255,255,1)');bg.addColorStop(0.7,'rgba(0,200,255,0.85)');bg.addColorStop(1,'rgba(0,255,255,0)');
        ctx.fillStyle=bg;ctx.fillRect(0,sw.y-18,BW,36);
        ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,sw.y);ctx.lineTo(BW,sw.y);ctx.stroke();
        ctx.globalAlpha=0.08;ctx.fillStyle='#00ffff';ctx.fillRect(0,0,BW,BH);ctx.restore();
        this.shake.trigger(5,4,0);
      }
    }
    this.popups.forEach(p=>p.draw(ctx));
    this.killTexts.forEach(k=>k.draw(ctx));
    drawCombo(ctx,this.comboKills,this.comboTimer,this.frame);
    if(this.eventBannerT>0)drawEventBanner(ctx,this.eventBanner,this.eventBannerT);
    if(this.lastGrade&&this.gradeTimer>0){
      const fade=Math.min(1,this.gradeTimer/20)*(this.gradeTimer>100?(1-(this.gradeTimer-100)/40):1);
      const sc=1+Math.max(0,(130-this.gradeTimer)/130)*0.4;
      ctx.save();ctx.globalAlpha=fade;ctx.textAlign='right';ctx.textBaseline='middle';
      ctx.font='bold '+Math.round(52*sc)+'px Courier New';
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillText(this.lastGrade,BW-18,BH/2+2);
      ctx.fillStyle=GRADE_COL[this.lastGrade]||'#fff';ctx.fillText(this.lastGrade,BW-20,BH/2);
      ctx.strokeStyle=GRADE_COL[this.lastGrade]||'#fff';ctx.lineWidth=2;ctx.globalAlpha=fade*0.3;
      ctx.beginPath();ctx.arc(BW-44,BH/2,38*sc,0,Math.PI*2);ctx.stroke();
      if(this.lastGrade==='S'){for(let i=0;i<6;i++){const a=i/6*Math.PI*2+this.frame*0.05;ctx.globalAlpha=fade*0.7;ctx.fillStyle='#ffdd00';ctx.beginPath();ctx.arc(BW-44+Math.cos(a)*46*sc,BH/2+Math.sin(a)*46*sc,2+Math.sin(this.frame*0.2+i),0,Math.PI*2);ctx.fill();}}
      ctx.textBaseline='alphabetic';ctx.restore();
    }
    const pl=this.player||{spice:MAX_SPICE,shielded:false,weapon:'chili',weaponTimer:0,bombs:GARLIC_BOMBS_MAX};
    drawNeonHUD(ctx,pl,this.score,this.wave,this.frame,this.audio.muted,this.comboKills,this.maxComboFlash);
    if(this.boss)drawBossBar(ctx,this.boss);
  }

  drawPaused(){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,BW,BH);ctx.textAlign='center';
    ctx.fillStyle='#00ff44';ctx.font='bold 32px Courier New';ctx.fillText('PAUSED',BW/2,BH/2-20);
    ctx.fillStyle='#aaa';ctx.font='14px Courier New';ctx.fillText('PRESS START TO RESUME',BW/2,BH/2+20);
  }

  drawGameOver(){
    ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,BW,BH);ctx.textAlign='center';
    ctx.fillStyle='#ff2200';ctx.font='bold 36px Courier New';ctx.fillText('GAME OVER',BW/2,BH/2-60);
    ctx.fillStyle='#fff';ctx.font='16px Courier New';ctx.fillText('SCORE: '+this.score,BW/2,BH/2-20);ctx.fillText('WAVE: '+this.wave,BW/2,BH/2+4);
    if(this.maxComboThisWave>1){ctx.fillStyle='#ffaa00';ctx.font='bold 11px Courier New';ctx.fillText('BEST COMBO: '+this.maxComboThisWave+'x',BW/2,BH/2+26);}
    if(this.lastGrade){ctx.fillStyle=GRADE_COL[this.lastGrade]||'#fff';ctx.font='bold 14px Courier New';ctx.fillText('LAST GRADE: '+this.lastGrade,BW/2,BH/2+46);}
    const isNew=this.score>0&&this.score===this.highScore;
    ctx.fillStyle=isNew?'#ffdd00':'#aaa';ctx.font='bold 13px Courier New';ctx.fillText(isNew?'NEW BEST: '+this.highScore:'BEST: '+this.highScore,BW/2,BH/2+68);
    if(Math.floor(this.frame/28)%2===0){ctx.fillStyle='#00ff44';ctx.font='13px Courier New';ctx.fillText('PRESS START',BW/2,BH/2+92);}
    ctx.save();const py=BH-30;ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.roundRect(BW/2-61,py-13,122,22,10);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 10px Courier New';ctx.textAlign='center';ctx.fillText('© FOODSPOT MOBILE',BW/2,py+3);ctx.restore();
  }

  drawVictory(){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,BW,BH);ctx.textAlign='center';
    ctx.fillStyle='#ffd700';ctx.font='bold 36px Courier New';ctx.fillText('VICTORY!',BW/2,BH/2-60);
    ctx.fillStyle='#ff6600';ctx.font='bold 16px Courier New';ctx.fillText('ENDLESS MODE!',BW/2,BH/2-28);
    ctx.fillStyle='#fff';ctx.font='16px Courier New';ctx.fillText('SCORE: '+this.score,BW/2,BH/2+10);
    if(Math.floor(this.frame/28)%2===0){ctx.fillStyle='#00ff44';ctx.font='13px Courier New';ctx.fillText('PRESS START',BW/2,BH/2+110);}
  }

  loop(t){
    const elapsed=lastLoopTime?Math.min(t-lastLoopTime,100):FRAME_TIME;
    lastLoopTime=t;frameAcc+=elapsed;
    while(frameAcc>=FRAME_TIME){this.update();frameAcc-=FRAME_TIME;}
    this.draw();requestAnimationFrame((ts)=>this.loop(ts));
  }
}

const isHikariBoy=window.parent!==window;
const FRAME_TIME=1000/60;
let game,lastLoopTime=0,frameAcc=0;
window.onload=function(){
  game=new Game(); // init game
  if(isHikariBoy){setTimeout(function(){game.start();},100);}
};
</script>
<script src="../game-sounds.js"></script>
