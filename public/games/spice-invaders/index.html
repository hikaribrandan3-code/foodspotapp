<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,SCALE;
function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;SCALE=H/480;}
resize();
window.addEventListener('resize',resize);

// ── CONSTANTS ──────────────────────────────────────────────────────────────
const BW=320,BH=480;
const PLAYER_SPEED=6.8,BULLET_SPEED=10.5,MAX_SPICE=100,GARLIC_BOMBS_MAX=3,BOSS_EVERY=5;
function isBossWave(w){return w%BOSS_EVERY===0;}
function getBossType(w){return(Math.floor(w/BOSS_EVERY)%2===1)?'chili':'garlic';}

// ── AUDIO ──────────────────────────────────────────────────────────────────
class Audio {
  constructor(){
    this.muted=false;
    try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
    this.musicPlaying=false;this.beatTimer=null;this.seqPos=0;this.currentSeq=null;this.nextNoteTime=0;this.baseBPM=148;
    this.titleSeq=[[0,1],[0,.5],[7,.5],[12,1],[10,.5],[9,.5],[7,1],[5,.5],[5,.5],[7,.5],[9,.5],[10,1],[9,2]];
    this.gameSeq= [[0,.5],[3,.5],[7,.5],[10,.5],[12,.5],[10,.5],[7,.5],[3,.5],[5,.5],[8,.5],[12,.5],[8,.5],[5,1],[3,.5],[0,.5]];
    this.bossSeq= [[0,.5],[0,.5],[7,.5],[0,.5],[8,.5],[0,.5],[7,.5],[6,.5],[5,1],[5,.5],[3,.5],[0,1],[0,.5],[0,.5],[3,.5],[5,.5]];
  }
  resume(){if(this.ctx?.state==='suspended')this.ctx.resume();}
  n2f(s){return 261.63*Math.pow(2,s/12);}
  tone(f,dur,type='square',vol=0.25){
    if(this.muted||!this.ctx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur);
    o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+dur);
  }
  playMusic(seq){
    if(!this.ctx)return;
    this.stopMusic();
    this.currentSeq=seq;this.seqPos=0;this.nextNoteTime=this.ctx.currentTime+0.05;this.musicPlaying=true;
    this._tick();
  }
  _tick(){
    if(!this.musicPlaying||!this.ctx)return;
    while(this.nextNoteTime<this.ctx.currentTime+0.15){
      const t=this.nextNoteTime;
      const[semi,dur]=this.currentSeq[this.seqPos];
      const bl=60/this.baseBPM*dur;
      if(!this.muted){
        // melody
        const mo=this.ctx.createOscillator(),mg=this.ctx.createGain();
        mo.type='square';mo.frequency.value=this.n2f(semi+12);
        mg.gain.setValueAtTime(0.12,t);mg.gain.exponentialRampToValueAtTime(0.001,t+bl*0.8);
        mo.connect(mg);mg.connect(this.ctx.destination);mo.start(t);mo.stop(t+bl);
        // bass
        if(this.seqPos%2===0){
          const bo=this.ctx.createOscillator(),bg=this.ctx.createGain();
          bo.type='sawtooth';bo.frequency.value=this.n2f(semi);
          bg.gain.setValueAtTime(0.09,t);bg.gain.exponentialRampToValueAtTime(0.001,t+bl*0.6);
          bo.connect(bg);bg.connect(this.ctx.destination);bo.start(t);bo.stop(t+bl);
        }
        // kick
        if(this.seqPos%4===0){
          const ko=this.ctx.createOscillator(),kg=this.ctx.createGain();
          ko.type='sine';ko.frequency.setValueAtTime(120,t);ko.frequency.exponentialRampToValueAtTime(30,t+0.12);
          kg.gain.setValueAtTime(0.28,t);kg.gain.exponentialRampToValueAtTime(0.001,t+0.15);
          ko.connect(kg);kg.connect(this.ctx.destination);ko.start(t);ko.stop(t+0.15);
        }
        // hihat
        if(this.seqPos%2===0){
          const buf=this.ctx.createBuffer(1,this.ctx.sampleRate*0.04,this.ctx.sampleRate);
          const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
          const src=this.ctx.createBufferSource(),hg=this.ctx.createGain(),hf=this.ctx.createBiquadFilter();
          hf.type='highpass';hf.frequency.value=6000;
          hg.gain.setValueAtTime(0.06,t);hg.gain.exponentialRampToValueAtTime(0.001,t+0.04);
          src.buffer=buf;src.connect(hf);hf.connect(hg);hg.connect(this.ctx.destination);src.start(t);
        }
      }
      this.nextNoteTime+=bl;
      this.seqPos=(this.seqPos+1)%this.currentSeq.length;
    }
    this.beatTimer=setTimeout(()=>this._tick(),50);
  }
  stopMusic(){this.musicPlaying=false;if(this.beatTimer){clearTimeout(this.beatTimer);this.beatTimer=null;}}
  shoot(){this.tone(800,0.08,'square',0.07);}
  explode(){
    if(!this.ctx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(200,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(40,this.ctx.currentTime+0.3);
    g.gain.setValueAtTime(0.12,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.3);
    o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+0.3);
  }
  bomb(){
    if(!this.ctx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='square';o.frequency.setValueAtTime(100,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(20,this.ctx.currentTime+0.8);
    g.gain.setValueAtTime(0.18,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.8);
    o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+0.8);
  }
  powerup(){this.tone(1200,0.2,'sine',0.1);setTimeout(()=>this.tone(1600,0.15,'sine',0.1),100);}
  bossWarn(){[300,250,200].forEach((f,i)=>setTimeout(()=>this.tone(f,0.45,'sawtooth',0.15),i*200));}
  gameOver(){this.stopMusic();[400,350,300,250,200].forEach((f,i)=>setTimeout(()=>this.tone(f,0.38,'sawtooth',0.15),i*140));}
}

// ── NEBULA ─────────────────────────────────────────────────────────────────
class Nebula{
  constructor(){
    this.blobs=[];this.t=0;
    for(let i=0;i<12;i++)this.blobs.push({x:Math.random()*BW,y:Math.random()*BH,r:60+Math.random()*100,hue:[270,300,220,200,180][Math.floor(Math.random()*5)],sat:60+Math.random()*30,speed:0.08+Math.random()*0.12,phase:Math.random()*Math.PI*2});
  }
  update(){this.t+=0.004;}
  draw(cx){
    cx.save();
    const bg=cx.createLinearGradient(0,0,0,BH);
    bg.addColorStop(0,'#06001a');bg.addColorStop(0.5,'#0d0030');bg.addColorStop(1,'#1a0010');
    cx.fillStyle=bg;cx.fillRect(0,0,BW,BH);
    cx.globalCompositeOperation='screen';
    for(const b of this.blobs){
      const x=b.x+Math.sin(this.t*b.speed+b.phase)*30,y=b.y+Math.cos(this.t*b.speed*0.7+b.phase)*20;
      const p=0.06+0.03*Math.sin(this.t*1.2+b.phase);
      const g=cx.createRadialGradient(x,y,0,x,y,b.r);
      g.addColorStop(0,`hsla(${b.hue},${b.sat}%,60%,${p})`);g.addColorStop(1,'transparent');
      cx.fillStyle=g;cx.beginPath();cx.arc(x,y,b.r,0,Math.PI*2);cx.fill();
    }
    cx.globalCompositeOperation='source-over';cx.restore();
  }
}

// ── STARFIELD ──────────────────────────────────────────────────────────────
class Starfield{
  constructor(){
    this.layers=[
      {stars:this._g(40,0.5,1),speed:0.15,alpha:0.35},
      {stars:this._g(30,1,1.5),speed:0.4,alpha:0.6},
      {stars:this._g(15,1.5,2.5),speed:0.9,alpha:0.9}
    ];
  }
  _g(n,a,b){return Array.from({length:n},()=>({x:Math.random()*BW,y:Math.random()*BH,s:a+Math.random()*(b-a),tw:Math.random()*Math.PI*2}));}
  update(){this.layers.forEach((l,li)=>l.stars.forEach(s=>{s.y+=l.speed;s.tw+=0.05+li*0.02;if(s.y>BH){s.y=0;s.x=Math.random()*BW;}}));}
  draw(cx){this.layers.forEach(l=>l.stars.forEach(s=>{const a=l.alpha*(0.6+0.4*Math.sin(s.tw));cx.fillStyle=`rgba(255,255,255,${a})`;cx.beginPath();cx.arc(s.x,s.y,s.s,0,Math.PI*2);cx.fill();}));}
}

// ── SCREEN SHAKE ───────────────────────────────────────────────────────────
class Shake{
  constructor(){this.t=0;this.mag=0;}
  trigger(m,d){this.mag=m;this.t=d;}
  apply(cx){if(this.t<=0)return;cx.translate((Math.random()*2-1)*this.mag*(this.t/18),(Math.random()*2-1)*this.mag*(this.t/18));this.t--;this.mag*=0.9;}
}

// ── SPRITES ────────────────────────────────────────────────────────────────
class Spr{
  static player(cx,x,y,frame,shielded){
    cx.save();cx.translate(x,y);
    // tractor beam
    const ba=0.13+Math.sin(frame*0.18)*0.07;
    const bg=cx.createLinearGradient(0,14,0,60);
    bg.addColorStop(0,`rgba(255,80,0,${ba})`);bg.addColorStop(1,'rgba(255,40,0,0)');
    cx.fillStyle=bg;cx.beginPath();cx.moveTo(-10,14);cx.lineTo(-26,60);cx.lineTo(26,60);cx.lineTo(10,14);cx.closePath();cx.fill();
    // flames
    const fl=Math.sin(frame*0.45)*3+8;
    [-10,10].forEach(ex=>{
      const f1=cx.createLinearGradient(ex,10,ex,10+fl+14);
      f1.addColorStop(0,'rgba(255,220,60,1)');f1.addColorStop(0.4,'rgba(255,100,0,0.8)');f1.addColorStop(1,'rgba(180,0,0,0)');
      cx.fillStyle=f1;cx.beginPath();cx.moveTo(ex-4,10);cx.lineTo(ex,10+fl+14);cx.lineTo(ex+4,10);cx.fill();
      const f2=cx.createLinearGradient(ex,10,ex,10+fl*0.5);
      f2.addColorStop(0,'rgba(255,255,200,1)');f2.addColorStop(1,'rgba(255,200,50,0)');
      cx.fillStyle=f2;cx.beginPath();cx.moveTo(ex-2,10);cx.lineTo(ex,10+fl*0.5);cx.lineTo(ex+2,10);cx.fill();
    });
    // wings underside
    cx.fillStyle='#880000';
    cx.beginPath();cx.moveTo(-8,4);cx.lineTo(-26,15);cx.lineTo(-20,4);cx.lineTo(-8,0);cx.closePath();cx.fill();
    cx.beginPath();cx.moveTo(8,4);cx.lineTo(26,15);cx.lineTo(20,4);cx.lineTo(8,0);cx.closePath();cx.fill();
    // wings top
    cx.shadowBlur=10;cx.shadowColor='#ff2200';
    const wg=cx.createLinearGradient(0,-6,0,14);wg.addColorStop(0,'#ff5533');wg.addColorStop(1,'#cc1100');
    cx.fillStyle=wg;
    cx.beginPath();cx.moveTo(-8,-3);cx.lineTo(-26,11);cx.lineTo(-20,2);cx.lineTo(-8,-7);cx.closePath();cx.fill();
    cx.beginPath();cx.moveTo(8,-3);cx.lineTo(26,11);cx.lineTo(20,2);cx.lineTo(8,-7);cx.closePath();cx.fill();
    cx.strokeStyle='rgba(255,180,100,0.7)';cx.lineWidth=1;
    cx.beginPath();cx.moveTo(-8,-7);cx.lineTo(-26,11);cx.stroke();
    cx.beginPath();cx.moveTo(8,-7);cx.lineTo(26,11);cx.stroke();
    // wingtip pods
    cx.fillStyle='#440000';
    cx.beginPath();cx.ellipse(-23,12,5,3,0.3,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.ellipse(23,12,5,3,-0.3,0,Math.PI*2);cx.fill();
    cx.fillStyle='#ffcc44';
    cx.beginPath();cx.ellipse(-23,13,3,2,0.3,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.ellipse(23,13,3,2,-0.3,0,Math.PI*2);cx.fill();
    cx.shadowBlur=0;
    // body
    cx.shadowBlur=18;cx.shadowColor='rgba(255,60,0,0.7)';
    const bd=cx.createLinearGradient(-10,-18,10,14);
    bd.addColorStop(0,'#ff6644');bd.addColorStop(0.3,'#ff2200');bd.addColorStop(0.7,'#cc1100');bd.addColorStop(1,'#880000');
    cx.fillStyle=bd;cx.beginPath();cx.ellipse(0,-2,10,16,0,0,Math.PI*2);cx.fill();
    cx.shadowBlur=0;
    const gl=cx.createLinearGradient(-7,-16,-2,-4);
    gl.addColorStop(0,'rgba(255,200,180,0.6)');gl.addColorStop(1,'rgba(255,100,80,0)');
    cx.fillStyle=gl;cx.beginPath();cx.ellipse(-4,-10,3,8,0,0,Math.PI*2);cx.fill();
    // stem
    cx.fillStyle='#44aa22';cx.beginPath();cx.roundRect(-4,-20,8,7,2);cx.fill();
    cx.strokeStyle='#66cc33';cx.lineWidth=2;cx.lineCap='round';
    cx.beginPath();cx.moveTo(0,-20);cx.bezierCurveTo(6,-26,10,-22,7,-18);cx.stroke();
    // cockpit
    const ck=cx.createRadialGradient(-2,-8,1,0,-6,6);
    ck.addColorStop(0,'rgba(220,240,255,0.95)');ck.addColorStop(1,'rgba(80,160,255,0.4)');
    cx.fillStyle=ck;cx.beginPath();cx.ellipse(0,-6,5,6,0,0,Math.PI*2);cx.fill();
    // shield
    if(shielded){
      const sp=frame*0.08;
      cx.shadowBlur=18;cx.shadowColor='#00ccff';
      cx.strokeStyle=`rgba(0,200,255,${0.6+Math.sin(sp)*0.3})`;cx.lineWidth=2.5;
      cx.beginPath();cx.arc(0,-2,30,0,Math.PI*2);cx.stroke();
      cx.fillStyle=`rgba(0,180,255,${0.06+Math.sin(sp)*0.03})`;cx.beginPath();cx.arc(0,-2,30,0,Math.PI*2);cx.fill();
      cx.shadowBlur=0;
    }
    cx.restore();
  }

  static enemy(cx,x,y,type,frame,flash,small){
    cx.save();cx.translate(x,y);
    const sc=small?0.6:1;cx.scale(sc,sc);
    const w=Math.sin(frame*0.1+x*0.3)*1.5;
    const glows={pepper:'#ff3300',onion:'#cc88ff',carrot:'#ff8800',broccoli:'#44ff44',mushroom:'#cc8844',tomato:'#ff4444'};
    cx.shadowBlur=flash?0:10;cx.shadowColor=glows[type]||'#fff';
    if(flash){cx.fillStyle='#ffffff';}
    const c=(col)=>flash?void 0:void(cx.fillStyle=col);
    switch(type){
      case 'pepper':
        c('#cc0000');cx.beginPath();cx.ellipse(w,0,9,13,0,0,Math.PI*2);cx.fill();
        c('#ff6666');if(!flash)cx.beginPath(),cx.arc(w-3,-3,4,0,Math.PI*2),cx.fill();break;
      case 'onion':
        c('#9966cc');cx.beginPath();cx.arc(w,0,11,0,Math.PI*2);cx.fill();
        cx.strokeStyle=flash?'#fff':'#dd99ff';cx.lineWidth=1.5;cx.beginPath();cx.arc(w,0,7,0,Math.PI*2);cx.stroke();break;
      case 'carrot':
        c('#ff8800');cx.beginPath();cx.ellipse(w,0,7,14,0,0,Math.PI*2);cx.fill();
        c('#00aa00');if(!flash)cx.fillRect(w-3,-17,6,6);break;
      case 'broccoli':
        c('#228822');cx.beginPath();cx.arc(w,-5,9,0,Math.PI*2);cx.arc(w-7,4,6,0,Math.PI*2);cx.arc(w+7,4,6,0,Math.PI*2);cx.fill();break;
      case 'mushroom':
        c('#8b4513');cx.beginPath();cx.arc(w,-4,11,Math.PI,0);cx.fill();
        c('#f5deb3');if(!flash)cx.fillRect(w-4,-4,8,11);break;
      case 'tomato':
        c('#ff4444');cx.beginPath();cx.arc(w,0,10,0,Math.PI*2);cx.fill();
        c('#228822');if(!flash){cx.beginPath();cx.moveTo(w,-9);cx.lineTo(w-4,-15);cx.lineTo(w+4,-15);cx.fill();}break;
    }
    cx.shadowBlur=0;cx.restore();
  }

  static boss(cx,x,y,type,hp,maxHp,frame){
    cx.save();cx.translate(x,y);
    const pulse=Math.sin(frame*0.05)*4;
    if(type==='chili'){
      cx.shadowBlur=30+pulse*2;cx.shadowColor='#ff4400';
      cx.fillStyle='#aa0000';cx.beginPath();cx.ellipse(0,0,32+pulse,50+pulse,0,0,Math.PI*2);cx.fill();
      cx.shadowBlur=0;
      cx.fillStyle='#228822';cx.fillRect(-7,-60,14,13);
      cx.fillStyle='#ffff00';cx.beginPath();cx.ellipse(-11,-14,7,11,-0.3,0,Math.PI*2);cx.ellipse(11,-14,7,11,0.3,0,Math.PI*2);cx.fill();
      cx.fillStyle='#000';cx.beginPath();cx.arc(-11,-14,3.5,0,Math.PI*2);cx.arc(11,-14,3.5,0,Math.PI*2);cx.fill();
      cx.fillStyle='#660000';cx.beginPath();cx.arc(0,14,13,0,Math.PI);cx.fill();
      for(let i=0;i<6;i++){const a=frame*0.12+i*Math.PI/3,fx=Math.cos(a)*48,fy=Math.sin(a)*48;cx.fillStyle=`rgba(255,${80+Math.random()*80},0,0.85)`;cx.beginPath();cx.arc(fx,fy,7+Math.sin(frame*0.2+i)*3,0,Math.PI*2);cx.fill();}
    }else{
      cx.shadowBlur=30;cx.shadowColor='#9933cc';
      cx.fillStyle='#f0f0dc';cx.beginPath();cx.arc(0,0,42+pulse,0,Math.PI*2);cx.fill();
      cx.shadowBlur=0;
      cx.fillStyle='#e0e0c8';
      for(let i=0;i<5;i++){const a=i*Math.PI*2/5;cx.beginPath();cx.arc(Math.cos(a)*23,Math.sin(a)*23,14,0,Math.PI*2);cx.fill();}
      cx.fillStyle='#6600cc';cx.beginPath();cx.ellipse(-14,-9,9,14,-0.2,0,Math.PI*2);cx.ellipse(14,-9,9,14,0.2,0,Math.PI*2);cx.fill();
      cx.fillStyle='#000';cx.beginPath();cx.arc(-14,-9,4.5,0,Math.PI*2);cx.arc(14,-9,4.5,0,Math.PI*2);cx.fill();
      cx.strokeStyle=`rgba(153,51,204,${0.4+Math.sin(frame*0.1)*0.3})`;cx.lineWidth=3;cx.beginPath();cx.arc(0,0,55+Math.sin(frame*0.1)*5,0,Math.PI*2);cx.stroke();
    }
    cx.restore();
  }

  static bullet(cx,x,y){
    cx.save();cx.translate(x,y);
    cx.shadowBlur=10;cx.shadowColor='#ff4400';
    cx.fillStyle='#ff2200';cx.beginPath();cx.ellipse(0,0,3,7,0,0,Math.PI*2);cx.fill();
    cx.fillStyle='#ffaa00';cx.fillRect(-2,-2,4,4);
    cx.shadowBlur=0;cx.restore();
  }

  static eBullet(cx,x,y){
    cx.save();cx.translate(x,y);
    cx.shadowBlur=8;cx.shadowColor='#ff00ff';
    cx.fillStyle='#ff44ff';cx.beginPath();cx.arc(0,0,4,0,Math.PI*2);cx.fill();
    cx.shadowBlur=0;cx.restore();
  }

  static explosion(cx,x,y,size,p){
    cx.save();cx.translate(x,y);
    const a=1-p,r=size*(0.5+p*0.5);
    cx.fillStyle=`rgba(255,100,0,${a})`;cx.beginPath();cx.arc(0,0,r,0,Math.PI*2);cx.fill();
    cx.fillStyle=`rgba(255,220,0,${a*0.8})`;cx.beginPath();cx.arc(0,0,r*0.55,0,Math.PI*2);cx.fill();
    cx.fillStyle=`rgba(255,255,200,${a*0.5})`;cx.beginPath();cx.arc(0,0,r*0.25,0,Math.PI*2);cx.fill();
    cx.restore();
  }

  static bombFx(cx,x,y,p){
    cx.save();cx.translate(x,y);
    const r=p*BH*0.65,a=1-p;
    cx.strokeStyle=`rgba(255,255,255,${a})`;cx.lineWidth=6;cx.beginPath();cx.arc(0,0,r,0,Math.PI*2);cx.stroke();
    cx.fillStyle=`rgba(255,200,0,${a*0.6})`;cx.beginPath();cx.arc(0,0,r*0.7,0,Math.PI*2);cx.fill();
    cx.fillStyle=`rgba(255,100,0,${a*0.8})`;cx.beginPath();cx.arc(0,0,r*0.4,0,Math.PI*2);cx.fill();
    cx.restore();
  }

  static drop(cx,x,y,frame){
    cx.save();cx.translate(x,y);
    const b=Math.sin(frame*0.2)*3;
    cx.shadowBlur=10;cx.shadowColor='#ff6600';
    cx.fillStyle='#ff6600';cx.beginPath();cx.moveTo(0,-9+b);cx.lineTo(-7,4+b);cx.lineTo(0,1+b);cx.lineTo(7,4+b);cx.fill();
    cx.fillStyle='#ffff00';cx.beginPath();cx.arc(0,b,3.5,0,Math.PI*2);cx.fill();
    cx.shadowBlur=0;cx.restore();
  }
}

// ── POWERUPS ───────────────────────────────────────────────────────────────
const PU_TYPES=['spread','pierce','shield','heal'];
const PU_COL={spread:'#ffaa00',pierce:'#00ffff',shield:'#00ccff',bomb:'#ff88ff',heal:'#00ff88'};
const PU_LBL={spread:'SPR',pierce:'PRC',shield:'SHD',bomb:'BMB',heal:'HEL'};
function drawPU(cx,x,y,type,frame){
  cx.save();cx.translate(x,y);
  const col=PU_COL[type]||'#fff';
  cx.shadowBlur=14;cx.shadowColor=col;
  cx.save();cx.rotate(frame*0.05);
  cx.strokeStyle=col;cx.lineWidth=2;
  cx.beginPath();
  for(let i=0;i<6;i++){const a=i*Math.PI/3;i===0?cx.moveTo(Math.cos(a)*12,Math.sin(a)*12):cx.lineTo(Math.cos(a)*12,Math.sin(a)*12);}
  cx.closePath();cx.stroke();
  cx.fillStyle=col+'33';cx.fill();
  cx.restore();cx.shadowBlur=0;
  cx.fillStyle=col;cx.font='bold 7px Courier New';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(PU_LBL[type],0,0);cx.textBaseline='alphabetic';
  cx.restore();
}

// ── PLAYER ─────────────────────────────────────────────────────────────────
class Player{
  constructor(){
    this.x=BW/2;this.y=BH-50;
    this.spice=MAX_SPICE;this.bombs=GARLIC_BOMBS_MAX;
    this.weapon='chili';this.weaponTimer=0;
    this.unlockedWeapons=['chili'];
    this.cooldown=0;this.invuln=0;this.shielded=false;
    this.trail=[];
  }
  update(inp,dt){
    if(inp.LEFT&&this.x>18)this.x-=PLAYER_SPEED;
    if(inp.RIGHT&&this.x<BW-18)this.x+=PLAYER_SPEED;
    this.trail.push({x:this.x,y:this.y,life:1});
    if(this.trail.length>18)this.trail.shift();
    this.trail.forEach(t=>t.life-=0.06);
    this.trail=this.trail.filter(t=>t.life>0);
    if(this.weaponTimer>0){this.weaponTimer-=dt;if(this.weaponTimer<=0){this.unlockedWeapons=this.unlockedWeapons.filter(w=>w==='chili');this.weapon='chili';}}
    if(this.cooldown>0)this.cooldown-=dt;
    if(this.invuln>0)this.invuln-=dt;
    // B = cycle weapon
    if(inp.B_PRESSED){
      const idx=this.unlockedWeapons.indexOf(this.weapon);
      this.weapon=this.unlockedWeapons[(idx+1)%this.unlockedWeapons.length];
    }
    // A = shoot
    if(inp.A_PRESSED&&this.cooldown<=0)return this.shoot();
    return null;
  }
  shoot(){
    const b=[];
    if(this.weapon==='chili'){this.cooldown=8;b.push({x:this.x,y:this.y-18,vx:0,vy:-BULLET_SPEED,dmg:1});}
    else if(this.weapon==='spread'){this.cooldown=12;[-2.5,0,2.5].forEach(vx=>b.push({x:this.x,y:this.y-18,vx,vy:-BULLET_SPEED,dmg:1}));}
    else if(this.weapon==='pierce'){this.cooldown=15;b.push({x:this.x,y:this.y-18,vx:0,vy:-BULLET_SPEED,dmg:3,pierce:true});}
    return{type:'bullets',bullets:b};
  }
  drawTrail(cx){
    this.trail.forEach((t,i)=>{
      const a=t.life*0.35;
      cx.save();cx.globalAlpha=a;cx.shadowBlur=8;cx.shadowColor='#ff8800';
      cx.fillStyle=`rgba(255,${120+i*6},0,${a})`;
      cx.beginPath();cx.ellipse(t.x,t.y,4*t.life,6*t.life,0,0,Math.PI*2);cx.fill();
      cx.shadowBlur=0;cx.restore();
    });
  }
  draw(cx,frame){if(this.invuln>0&&Math.floor(frame/4)%2===0)return;Spr.player(cx,this.x,this.y,frame,this.shielded);}
  hit(dmg){if(this.invuln>0)return false;if(this.shielded){this.shielded=false;return false;}this.spice-=dmg;this.invuln=60;return this.spice<=0;}
  heal(n){this.spice=Math.min(MAX_SPICE,this.spice+n);}
  addBomb(){this.bombs=Math.min(GARLIC_BOMBS_MAX,this.bombs+1);}
  applyPU(type){
    if(type==='spread'){
      if(!this.unlockedWeapons.includes('spread'))this.unlockedWeapons.push('spread');
      this.weapon='spread';this.weaponTimer=600;
    }else if(type==='pierce'){
      if(!this.unlockedWeapons.includes('pierce'))this.unlockedWeapons.push('pierce');
      this.weapon='pierce';this.weaponTimer=600;
    }else if(type==='shield'){this.shielded=true;
    }else if(type==='bomb'){this.addBomb();
    }else if(type==='heal'){this.heal(40);}
  }
}

// ── ENEMY ──────────────────────────────────────────────────────────────────
class Enemy{
  constructor(x,y,type,wave,small){
    this.x=this.fx=x;this.y=this.fy=y;this.type=type;this.small=small||false;
    const base={pepper:1,onion:2,carrot:1,broccoli:2,mushroom:2,tomato:1};
    this.hp=this.maxHp=small?1:(base[type]||1)+Math.floor(wave/4);
    this.cd=90+Math.random()*150;this.breaking=false;this.bx=0;this.by=0;this.bt=0;this.flash=0;
  }
  score(){return((({pepper:10,onion:20,carrot:10,broccoli:30,mushroom:20,tomato:15}[this.type]||10))*(this.small?0.5:1));}
  splittable(){return!this.small&&['onion','broccoli','mushroom'].includes(this.type);}
  update(ox,oy,px,py,dt){
    if(this.flash>0)this.flash-=dt;
    if(!this.breaking){
      this.x=this.fx+ox;this.y=this.fy+oy;
      if(Math.random()<0.0015){this.breaking=true;const a=Math.atan2(py-this.y,px-this.x);this.bx=Math.cos(a)*2;this.by=Math.sin(a)*2;}
    }else{
      this.x+=this.bx;this.y+=this.by;this.bt+=dt;
      if(this.bt>180||this.y>BH+30){this.breaking=false;this.bt=0;}
    }
    this.cd-=dt;
    if(this.cd<=0&&!this.breaking&&this.y>0){this.cd=100+Math.random()*150;if(Math.random()<0.25)return this.fire(px,py);}
    return null;
  }
  fire(px,py){const a=Math.atan2(py-this.y,px-this.x);return{x:this.x,y:this.y+14,vx:Math.cos(a)*3.3,vy:Math.sin(a)*3.3};}
  hit(d){this.hp-=d;this.flash=8;return this.hp<=0;}
  draw(cx,frame){Spr.enemy(cx,this.x,this.y,this.type,frame,this.flash>0,this.small);}
}

// ── BOSS ───────────────────────────────────────────────────────────────────
class Boss{
  constructor(type,wave){
    this.type=type;this.x=BW/2;this.y=90;
    const base=type==='chili'?80:120;
    this.hp=this.maxHp=base+wave*4;
    this.targetX=this.x;this.mt=0;this.st=0;this.flash=0;
  }
  update(px,py,dt){
    if(this.flash>0)this.flash-=dt;
    this.mt+=dt;if(this.mt>100){this.mt=0;this.targetX=70+Math.random()*(BW-140);}
    this.x+=(this.targetX-this.x)*0.025;
    this.st+=dt;const interval=this.hp<this.maxHp*0.5?28:48;
    if(this.st>interval){this.st=0;return this.fire(px,py);}
    return null;
  }
  fire(px,py){
    const b=[];
    if(this.type==='chili'){const a=Math.atan2(py-this.y,px-this.x);for(let i=-2;i<=2;i++)b.push({x:this.x,y:this.y+45,vx:Math.cos(a+i*0.28)*4,vy:Math.sin(a+i*0.28)*4});}
    else{const t=Date.now()*0.002;for(let i=0;i<6;i++){const a=t+i*Math.PI/3;b.push({x:this.x,y:this.y+40,vx:Math.cos(a)*3,vy:Math.sin(a)*3});}}
    return b;
  }
  hit(d){this.hp-=d;this.flash=8;return this.hp<=0;}
  draw(cx,frame){Spr.boss(cx,this.x,this.y,this.type,this.hp,this.maxHp,frame);}
}

// ── WAVE INTRO ─────────────────────────────────────────────────────────────
class WaveIntro{
  constructor(wave,isBoss){this.wave=wave;this.isBoss=isBoss;this.t=0;this.done=false;}
  update(){this.t++;if(this.t>120)this.done=true;}
  draw(cx){
    const si=Math.min(1,this.t/30),fo=this.t>90?(1-(this.t-90)/30):1,al=si*fo;
    cx.save();
    cx.fillStyle=`rgba(0,0,0,${al*0.6})`;cx.fillRect(0,BH/2-55,BW,110);
    cx.strokeStyle=`rgba(255,100,0,${al})`;cx.lineWidth=2;
    cx.beginPath();cx.moveTo(0,BH/2-55);cx.lineTo(BW,BH/2-55);cx.stroke();
    cx.beginPath();cx.moveTo(0,BH/2+55);cx.lineTo(BW,BH/2+55);cx.stroke();
    cx.globalAlpha=al;cx.textAlign='center';
    if(this.isBoss){
      cx.fillStyle='#ff0000';cx.shadowBlur=25;cx.shadowColor='#ff0000';
      cx.font='bold 38px Courier New';cx.fillText('⚠ BOSS ⚠',BW/2,BH/2+2);
      cx.shadowBlur=0;cx.fillStyle='#ffaa00';cx.font='16px Courier New';
      cx.fillText(getBossType(this.wave)==='chili'?'CHILI OVERLORD':'GARLIC EMPEROR',BW/2,BH/2+28);
    }else{
      cx.fillStyle='#ff6600';cx.shadowBlur=15;cx.shadowColor='#ff6600';
      cx.font='bold 34px Courier New';cx.fillText(`WAVE ${this.wave}`,BW/2,BH/2+2);
      cx.shadowBlur=0;cx.fillStyle='#ffcc00';cx.font='14px Courier New';cx.fillText('ENDLESS',BW/2,BH/2+26);
    }
    cx.globalAlpha=1;cx.restore();
  }
}

// ── BOSS BAR ───────────────────────────────────────────────────────────────
function drawBossBar(cx,boss,frame){
  const bw=BW-40,bh=16,bx=20,by=14,ratio=boss.hp/boss.maxHp,pulse=Math.sin(frame*0.15)*0.3+0.7;
  cx.fillStyle='rgba(0,0,0,0.7)';cx.fillRect(bx-4,by-4,bw+8,bh+22);
  cx.fillStyle='#ffaa00';cx.font='bold 10px Courier New';cx.textAlign='left';
  cx.fillText(boss.type==='chili'?'CHILI OVERLORD':'GARLIC EMPEROR',bx,by-1);
  cx.fillStyle='#1a0010';cx.fillRect(bx,by+10,bw,bh);
  const col=ratio>0.6?'#00ff44':ratio>0.3?'#ffcc00':`rgba(255,${Math.floor(30*pulse)},0,1)`;
  if(ratio<0.3){cx.shadowBlur=12*pulse;cx.shadowColor='#ff0000';}
  cx.fillStyle=col;cx.fillRect(bx,by+10,bw*ratio,bh);cx.shadowBlur=0;
  cx.strokeStyle='rgba(0,0,0,0.4)';cx.lineWidth=1;
  for(let i=1;i<10;i++){const sx=bx+bw*i/10;cx.beginPath();cx.moveTo(sx,by+10);cx.lineTo(sx,by+26);cx.stroke();}
  cx.strokeStyle='rgba(255,255,255,0.5)';cx.lineWidth=1.5;cx.strokeRect(bx,by+10,bw,bh);
  cx.fillStyle='#fff';cx.textAlign='center';cx.font='9px Courier New';cx.fillText(`${boss.hp} / ${boss.maxHp}`,bx+bw/2,by+23);
}

// ── TITLE FORMATION ────────────────────────────────────────────────────────
class TitleFormation{
  constructor(){
    this.frame=0;
    const types=['pepper','onion','carrot','broccoli','tomato','mushroom'];
    this.enemies=[];
    for(let r=0;r<3;r++)for(let c=0;c<6;c++)
      this.enemies.push({type:types[(r*2+c)%types.length],x:BW*0.15+c*(BW*0.14),y:-60-r*40-c*15,ty:80+r*40,tx:BW*0.15+c*(BW*0.14),arrived:false,t:0,phase:Math.random()*Math.PI*2});
  }
  update(){
    this.frame++;
    this.enemies.forEach(e=>{
      if(!e.arrived){e.y+=(e.ty-e.y)*0.06;if(Math.abs(e.y-e.ty)<1){e.y=e.ty;e.arrived=true;}}
      else{e.t+=0.03;e.y=e.ty+Math.sin(e.t+e.phase)*6;e.x=e.tx+Math.sin(e.t*0.7+e.phase)*4;}
    });
  }
  draw(cx){this.enemies.forEach(e=>Spr.enemy(cx,e.x,e.y,e.type,this.frame,false,false));}
}

// ── SCORE POPUPS ───────────────────────────────────────────────────────────
class Popup{
  constructor(x,y,val){this.x=x;this.y=y;this.val=val;this.life=1;}
  update(){this.y-=0.8;this.life-=0.018;return this.life>0;}
  draw(cx){
    cx.save();cx.globalAlpha=this.life;
    cx.fillStyle=`hsl(${40+this.val/3},100%,65%)`;cx.font=`bold ${10+Math.min(this.val/10,8)}px Courier New`;
    cx.textAlign='center';cx.shadowBlur=8;cx.shadowColor='#ffaa00';
    cx.fillText(`+${this.val}`,this.x,this.y);cx.shadowBlur=0;cx.restore();

// ── GAME ───────────────────────────────────────────────────────────────────
class Game{
  constructor(){
    this.audio=new Audio();
    this.nebula=new Nebula();this.stars=new Starfield();this.shake=new Shake();
    this.inp={LEFT:false,RIGHT:false,A:false,B:false,L:false,R:false,START:false,
              A_PRESSED:false,B_PRESSED:false,L_PRESSED:false,R_PRESSED:false,START_PRESSED:false};

    this.state='title';this.score=0;this.wave=1;this.frame=0;
    this.highScore=parseInt(localStorage.getItem('si_hs')||'0');
    this.player=null;this.enemies=[];this.boss=null;
    this.bullets=[];this.eBullets=[];this.explosions=[];
    this.drops=[];this.powerups=[];this.popups=[];this.bombFx=null;
    this.fmtX=0;this.fmtDir=1;this.fmtY=0;this.waveIntro=null;
    this.titleFmt=new TitleFormation();
    this.setupInput();this.loop();
  }

  setupInput(){
    // HikariBoy message handler - uses state field for held buttons
    window.addEventListener('message',e=>{
      const{type,button,state}=e.data;
      if(type!=='BUTTON_PRESS'&&type!=='BUTTON_RELEASE')return;
      const map={'dpad-left':'LEFT','dpad-right':'RIGHT','dpad-up':'UP','dpad-down':'DOWN','a':'A','b':'B','start':'START'};
      const g=map[button];if(!g)return;
      const isDown=(state!==undefined)?state:(type==='BUTTON_PRESS');
      if(isDown&&!this.inp[g])this.inp[g+'_PRESSED']=true;
      this.inp[g]=isDown;
    });
    // Keyboard for testing only - remove conflicting keybinds
    window.addEventListener('keydown',e=>{
      const map={'ArrowLeft':'LEFT','ArrowRight':'RIGHT','ArrowUp':'UP','ArrowDown':'DOWN','z':'A','Z':'A','x':'B','X':'B','Enter':'START',' ':'A'};
      const g=map[e.key];
      if(g){if(!this.inp[g])this.inp[g+'_PRESSED']=true;this.inp[g]=true;}
      e.preventDefault();
    });
    window.addEventListener('keyup',e=>{
      const map={'ArrowLeft':'LEFT','ArrowRight':'RIGHT','ArrowUp':'UP','ArrowDown':'DOWN','z':'A','Z':'A','x':'B','X':'B','Enter':'START',' ':'A'};
      const g=map[e.key];if(g)this.inp[g]=false;
    });
    // Touch disabled - use d-pad buttons only
  }

  start(){
    this.state='playing';this.score=0;this.wave=1;
    this.player=new Player();this.spawnWave();
    this.audio.resume();this.audio.playMusic(this.audio.gameSeq);
  }

  spawnWave(){
    this.enemies=[];this.boss=null;this.bullets=[];this.eBullets=[];
    this.fmtX=0;this.fmtDir=1;this.fmtY=0;
    const boss=isBossWave(this.wave);
    this.waveIntro=new WaveIntro(this.wave,boss);
    if(boss){
      this.boss=new Boss(getBossType(this.wave),this.wave);
      this.audio.bossWarn();
    }else{
      const types=['pepper','onion','carrot','broccoli','mushroom','tomato'];
      const rows=Math.min(5,2+Math.floor(this.wave/4));
      const cols=Math.min(8,4+Math.floor(this.wave/3));
      const sx=Math.min(44,(BW-40)/cols);
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
        this.enemies.push(new Enemy(20+c*sx+sx/2,55+r*34,types[(r+this.wave)%types.length],this.wave,false));
    }
    const count=1+Math.floor(Math.random()*2);
    for(let i=0;i<count;i++){
      setTimeout(()=>{
        if(this.state!=='playing')return;
        this.powerups.push({x:30+Math.random()*(BW-60),y:-20,type:PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)],vy:0.8+Math.random()*0.4});
      },3000+i*4000);
    }
  }

  update(){
    this.frame++;
    // Keyboard override flags removed - was causing auto-move with d-pad
    this.nebula.update();this.stars.update();
    if(this.waveIntro&&!this.waveIntro.done)this.waveIntro.update();
    switch(this.state){
      case 'title':this.updateTitle();break;
      case 'playing':this.updatePlay();break;
      case 'paused':this.updatePaused();break;
      case 'gameover':case 'victory':if(this.inp.A_PRESSED||this.inp.START_PRESSED)this.state='title';break;
    }
    // Only clear PRESSED flags each frame - LEFT/RIGHT stay held until BUTTON_RELEASE
    ['A_PRESSED','B_PRESSED','L_PRESSED','R_PRESSED','START_PRESSED'].forEach(k=>this.inp[k]=false);
  }

  updateTitle(){
    this.titleFmt.update();
    if(!this.audio.musicPlaying){this.audio.resume();this.audio.playMusic(this.audio.titleSeq);}
    if(this.inp.A_PRESSED||this.inp.START_PRESSED)this.start();
  }

  updatePlay(){
    if(this.waveIntro&&!this.waveIntro.done)return;
    
    // START button pauses during gameplay
    if(this.inp.START_PRESSED){
      this.state='paused';
      this.audio.stopMusic();
      return;
    }
    
    const act=this.player.update(this.inp,1);
    if(act){
      if(act.type==='bullets'){this.bullets.push(...act.bullets);this.audio.shoot();}
      else if(act.type==='bomb')this.triggerBomb();
    }
    this.fmtX+=0.75*this.fmtDir;
    if(Math.abs(this.fmtX)>25){this.fmtDir*=-1;this.fmtY+=2;}
    this.enemies.forEach(e=>{const b=e.update(this.fmtX,this.fmtY,this.player.x,this.player.y,1);if(b)this.eBullets.push(b);});
    if(this.boss){const bs=this.boss.update(this.player.x,this.player.y,1);      if(bs)this.eBullets.push(...bs.map(b=>({...b,vx:b.vx*1.5,vy:b.vy*1.5})));}
    this.updateBullets();
    this.powerups=this.powerups.filter(p=>{
      p.y+=p.vy;const dx=p.x-this.player.x,dy=p.y-this.player.y;
      if(dx*dx+dy*dy<900){this.player.applyPU(p.type);this.audio.powerup();return false;}
      return p.y<BH+30;
    });
    this.explosions=this.explosions.filter(e=>{e.p+=0.055;return e.p<1;});
    this.drops=this.drops.filter(d=>{
      d.y+=1.8;const dx=d.x-this.player.x,dy=d.y-this.player.y;
      if(dx*dx+dy*dy<625){this.player.heal(18);this.audio.powerup();return false;}
      return d.y<BH+20;
    });
    this.popups=this.popups.filter(p=>p.update());
    if(this.bombFx){this.bombFx.p+=0.03;if(this.bombFx.p>=1)this.bombFx=null;}
    if(this.frame%90===0)this.player.spice=Math.max(0,this.player.spice-0.5);
    if(this.player.spice<=0){
      if(this.score>this.highScore){this.highScore=this.score;localStorage.setItem('si_hs',this.highScore);}
      this.state='gameover';this.audio.gameOver();
    }
    if(!this.enemies.length&&!this.boss){
      this.wave++;this.spawnWave();this.player.heal(20);this.player.addBomb();
      if(isBossWave(this.wave))this.audio.playMusic(this.audio.bossSeq);
      else this.audio.playMusic(this.audio.gameSeq);
    }
  }
  
  updatePaused(){
    // START button resumes
    if(this.inp.START_PRESSED){
      this.state='playing';
      if(isBossWave(this.wave))this.audio.playMusic(this.audio.bossSeq);
      else this.audio.playMusic(this.audio.gameSeq);
    }
  }

  updateBullets(){
    this.bullets=this.bullets.filter(b=>{
      b.x+=b.vx;b.y+=b.vy;let hit=false;
      if(this.boss){
        const dx=b.x-this.boss.x,dy=b.y-this.boss.y;
        if(dx*dx+dy*dy<2500){
          if(this.boss.hit(b.dmg)){this.boom(this.boss.x,this.boss.y,60);this.score+=1000;this.boss=null;this.shake.trigger(12,22);this.audio.explode();}
          else this.shake.trigger(4,8);
          hit=!b.pierce;
        }
      }
      if(!hit){
        for(let i=this.enemies.length-1;i>=0;i--){
          const e=this.enemies[i];const dx=b.x-e.x,dy=b.y-e.y;
          if(dx*dx+dy*dy<(e.small?150:400)){
            if(e.hit(b.dmg)){
              this.boom(e.x,e.y,e.small?14:22);
              const sc=Math.floor(e.score());this.score+=sc;
              this.popups.push(new Popup(e.x,e.y,sc));
              if(Math.random()<0.25)this.drops.push({x:e.x,y:e.y});
              if(e.splittable())[-18,18].forEach(ox=>this.enemies.push(new Enemy(e.x+ox,e.y,e.type,this.wave,true)));
              this.enemies.splice(i,1);this.audio.explode();this.shake.trigger(3,6);
            }
            hit=!b.pierce;break;
          }
        }
      }
      return b.y>-20&&!hit;
    });
    this.eBullets=this.eBullets.filter(b=>{
      b.x+=b.vx;b.y+=b.vy;
      const dx=b.x-this.player.x,dy=b.y-this.player.y;
      if(dx*dx+dy*dy<324){
        if(this.player.hit(14)){if(this.score>this.highScore){this.highScore=this.score;localStorage.setItem('si_hs',this.highScore);}this.state='gameover';this.audio.gameOver();}
        else this.shake.trigger(6,12);
        return false;
      }
      return b.y<BH+20&&b.x>-20&&b.x<BW+20;
    });
  }

  triggerBomb(){
    this.bombFx={x:BW/2,y:BH/2,p:0};this.audio.bomb();this.shake.trigger(14,28);
    this.enemies.forEach(e=>{this.boom(e.x,e.y,22);this.score+=Math.floor(e.score()/2);});
    this.enemies=[];
    if(this.boss&&this.boss.hit(30)){this.boom(this.boss.x,this.boss.y,60);this.score+=500;this.boss=null;}
    this.eBullets=[];
  }

  boom(x,y,size){this.explosions.push({x,y,size,p:0});}

  draw(){
    ctx.save();ctx.clearRect(0,0,W,H);
    // Scale to fill full width and height (no black bars, slight stretch)
    ctx.scale(W/320, H/480);
    this.shake.apply(ctx);
    this.nebula.draw(ctx);this.stars.draw(ctx,this.frame);
    switch(this.state){
      case 'title':this.drawTitle();break;
      case 'playing':this.drawPlay();break;
      case 'paused':this.drawPlay();this.drawPaused();break;
      case 'gameover':this.drawPlay();this.drawGameOver();break;
      case 'victory':this.drawPlay();this.drawVictory();break;
    }
    if(this.waveIntro&&!this.waveIntro.done)this.waveIntro.draw(ctx);
    ctx.restore();
  }

  drawTitle(){
    this.titleFmt.draw(ctx);
    ctx.textAlign='center';
    ctx.shadowBlur=30;ctx.shadowColor='#ff6600';
    ctx.fillStyle='#ff6600';ctx.font='bold 40px Courier New';ctx.fillText('SPICE',BW/2,BH/2-80);
    ctx.fillStyle='#ffcc00';ctx.font='bold 40px Courier New';ctx.fillText('INVADERS',BW/2,BH/2-40);
    ctx.shadowBlur=0;
    if(this.highScore>0){
      ctx.fillStyle='#ffdd44';ctx.font='bold 13px Courier New';ctx.shadowBlur=8;ctx.shadowColor='#ffaa00';
      ctx.fillText(`🏆 BEST: ${this.highScore}`,BW/2,BH/2-10);ctx.shadowBlur=0;
    }
    ctx.fillStyle='#aaa';ctx.font='11px Courier New';
    ctx.fillText('A: Shoot   B: Swap weapon',BW/2,BH/2+20);
    ctx.fillText('Grab falling powerups!',BW/2,BH/2+38);
    if(Math.floor(this.frame/28)%2===0){
      ctx.shadowBlur=10;ctx.shadowColor='#00ff44';ctx.fillStyle='#00ff44';ctx.font='bold 17px Courier New';
      ctx.fillText('PRESS START OR Z',BW/2,BH/2+80);ctx.shadowBlur=0;
    }
    const py=BH/2+115;
    ctx.fillStyle='#888';ctx.font='9px Courier New';ctx.fillText('POWERUPS:',BW/2,py);
    PU_TYPES.forEach((t,i)=>drawPU(ctx,BW*0.12+i*(BW*0.18),py+22,t,this.frame+i*20));
  }

  drawPlay(){
    // Top banner - show wave and score at top of screen
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,BW,28);
    ctx.strokeStyle='#ff6600';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,28);ctx.lineTo(BW,28);ctx.stroke();
    ctx.fillStyle='#ff6600';ctx.font='bold 14px Courier New';ctx.textAlign='left';
    ctx.fillText(`WAVE ${this.wave}`,10,20);
    ctx.fillStyle='#ffcc00';ctx.textAlign='right';
    ctx.fillText(`SCORE: ${this.score}`,BW-10,20);
    if(this.player){this.player.drawTrail(ctx);this.player.draw(ctx,this.frame);}
    this.enemies.forEach(e=>e.draw(ctx,this.frame));
    if(this.boss){this.boss.draw(ctx,this.frame);drawBossBar(ctx,this.boss,this.frame);}
    this.bullets.forEach(b=>Spr.bullet(ctx,b.x,b.y));
    this.eBullets.forEach(b=>Spr.eBullet(ctx,b.x,b.y));
    this.explosions.forEach(e=>Spr.explosion(ctx,e.x,e.y,e.size,e.p));
    this.drops.forEach(d=>Spr.drop(ctx,d.x,d.y,this.frame));
    this.powerups.forEach(p=>drawPU(ctx,p.x,p.y,p.type,this.frame));
    if(this.bombFx)Spr.bombFx(ctx,this.bombFx.x,this.bombFx.y,this.bombFx.p);
    this.popups.forEach(p=>p.draw(ctx));
    if(this.player)drawHUD(ctx,this.player,this.score,this.wave,!!this.boss,this.frame);
  }
  
  drawPaused(){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,BW,BH);
    ctx.textAlign='center';ctx.shadowBlur=20;ctx.shadowColor='#00ff44';
    ctx.fillStyle='#00ff44';ctx.font='bold 32px Courier New';ctx.fillText('⏸ PAUSED',BW/2,BH/2-20);
    ctx.shadowBlur=0;ctx.fillStyle='#aaa';ctx.font='14px Courier New';
    ctx.fillText('PRESS START TO RESUME',BW/2,BH/2+20);
  }

  drawGameOver(){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,BW,BH);
    ctx.textAlign='center';ctx.shadowBlur=20;ctx.shadowColor='#ff0000';
    ctx.fillStyle='#ff2200';ctx.font='bold 36px Courier New';ctx.fillText('GAME OVER',BW/2,BH/2-50);
    ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='16px Courier New';
    ctx.fillText(`SCORE: ${this.score}`,BW/2,BH/2-10);
    ctx.fillText(`WAVE: ${this.wave}`,BW/2,BH/2+14);
    const isNew=this.score>0&&this.score===this.highScore;
    ctx.fillStyle=isNew?'#ffdd00':'#aaa';ctx.font='bold 13px Courier New';
    ctx.shadowBlur=isNew?10:0;ctx.shadowColor='#ffaa00';
    ctx.fillText(isNew?`🏆 NEW BEST: ${this.highScore}`:`BEST: ${this.highScore}`,BW/2,BH/2+38);
    ctx.shadowBlur=0;
    if(Math.floor(this.frame/28)%2===0){ctx.fillStyle='#00ff44';ctx.font='13px Courier New';ctx.fillText('PRESS Z OR START',BW/2,BH/2+68);}
  }

  drawVictory(){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,BW,BH);
    ctx.textAlign='center';ctx.shadowBlur=25;ctx.shadowColor='#ffd700';
    ctx.fillStyle='#ffd700';ctx.font='bold 36px Courier New';ctx.fillText('VICTORY!',BW/2,BH/2-60);
    ctx.shadowBlur=0;ctx.fillStyle='#ff6600';ctx.font='bold 16px Courier New';ctx.fillText('ENDLESS MODE!',BW/2,BH/2-28);
    ctx.fillStyle='#fff';ctx.font='16px Courier New';ctx.fillText(`SCORE: ${this.score}`,BW/2,BH/2+10);
    for(let i=0;i<6;i++){const fx=40+i*(BW-80)/5,fy=BH/2+60+Math.sin(this.frame*0.12+i)*20;ctx.fillStyle=['#ff0000','#00ff44','#0088ff','#ffff00','#ff00ff','#ff6600'][i];ctx.shadowBlur=12;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(fx,fy,7,0,Math.PI*2);ctx.fill();}
    ctx.shadowBlur=0;
    if(Math.floor(this.frame/28)%2===0){ctx.fillStyle='#00ff44';ctx.font='13px Courier New';ctx.fillText('PRESS Z OR START',BW/2,BH/2+110);}
  }

  loop(){this.update();this.draw();requestAnimationFrame(()=>this.loop());}
}

window.onload=()=>new Game();
</script>
</body>
</html>
