<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <g transform="translate(200,205)">
    <!-- outer ring shadow -->
    <circle r="160" fill="none" stroke="#000" stroke-width="10"/>

    <!-- quadrants -->
    <path d="M 0 0 L 0 -160 A 160 160 0 0 0 -160 0 Z" fill="#22C55E"/>
    <path d="M 0 0 L -160 0 A 160 160 0 0 0 0 160 Z" fill="#3B82F6"/>
    <path d="M 0 0 L 0 160 A 160 160 0 0 0 160 0 Z" fill="#F5B700"/>
    <path d="M 0 0 L 160 0 A 160 160 0 0 0 0 -160 Z" fill="#EF4444"/>

    <!-- divider lines -->
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#0a0a12" stroke-width="6"/>
    <line x1="0" y1="0" x2="-160" y2="0" stroke="#0a0a12" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="160" stroke="#0a0a12" stroke-width="6"/>
    <line x1="0" y1="0" x2="160" y2="0" stroke="#0a0a12" stroke-width="6"/>

    <!-- icons -->
    <g stroke="#fff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.95">
      <!-- carrot/leaf top-left -->
      <g transform="translate(-80,-80)">
        <path d="M -18 20 L 18 20 L 0 -22 Z"/>
        <path d="M -6 -22 L 0 -38 L 6 -22"/>
      </g>
      <!-- burger top-right -->
      <g transform="translate(80,-80)">
        <path d="M -20 -8 A 20 20 0 0 1 20 -8" fill="none"/>
        <line x1="-20" y1="0" x2="20" y2="0"/>
        <line x1="-20" y1="10" x2="20" y2="10"/>
        <path d="M -18 20 Q 0 28 18 20"/>
      </g>
      <!-- map pin bottom-left -->
      <g transform="translate(-80,80)">
        <circle cx="0" cy="-8" r="18"/>
        <path d="M 0 26 L -12 2 L 12 2 Z"/>
        <circle cx="0" cy="-8" r="6" fill="#fff"/>
      </g>
      <!-- stall bottom-right -->
      <g transform="translate(80,80)">
        <path d="M -22 -6 L 0 -26 L 22 -6"/>
        <line x1="-17" y1="-6" x2="-17" y2="22"/>
        <line x1="17" y1="-6" x2="17" y2="22"/>
        <line x1="-19" y1="22" x2="19" y2="22"/>
      </g>
    </g>

    <!-- hub -->
    <circle r="54" fill="#111119" stroke="#000" stroke-width="4"/>
    <g fill="rgba(255,255,255,0.18)">
      <circle cx="14" cy="0" r="1.6"/><circle cx="-14" cy="0" r="1.6"/>
      <circle cx="0" cy="14" r="1.6"/><circle cx="0" cy="-14" r="1.6"/>
      <circle cx="10" cy="10" r="1.6"/><circle cx="-10" cy="10" r="1.6"/>
      <circle cx="10" cy="-10" r="1.6"/><circle cx="-10" cy="-10" r="1.6"/>
      <circle cx="25" cy="0" r="1.6"/><circle cx="-25" cy="0" r="1.6"/>
      <circle cx="0" cy="25" r="1.6"/><circle cx="0" cy="-25" r="1.6"/>
    </g>
    <circle cx="0" cy="32" r="5" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
