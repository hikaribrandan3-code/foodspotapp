<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>PICU SWEETS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none;}
    html,body{width:100%;height:100%;overflow:hidden;background:#1a0a1a;display:flex;justify-content:center;align-items:flex-start;font-family:'Arial Black',Arial,sans-serif;}
    #gc{position:relative;width:390px;height:844px;transform-origin:top left;}
    canvas{display:block;width:100%;height:100%;}
  </style>
</head>
<body>
  <div id="gc"><canvas id="C"></canvas></div>
  <script>
    // === SCALING ===
    const gc=document.getElementById('gc');
    function rs(){const s=Math.min((window.innerHeight*.56)/844,window.innerWidth/390);gc.style.transform=`scale(${s})`;gc.style.transformOrigin='top left';gc.style.marginLeft=`${(window.innerWidth-390*s)/2}px`;}
    rs();window.addEventListener('resize',rs);

    // === HIKARIBOY CONSTANTS ===
    const isHikariBoy=window.parent!==window;
    const SAFE_H=isHikariBoy?844*0.53:844;
    const CAM_SHIFT=isHikariBoy?-844*0.06:0;
    const W=390,H=844;

    // === CANVAS ===
    const canvas=document.getElementById('C'),ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;
    canvas.width=W*dpr;canvas.height=H*dpr;ctx.scale(dpr,dpr);

    // === AUDIO ===
    let AC=null,muted=false;
    function initAC(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();}}
    function sfx(f,d,tp='sine',v=.2,f2=null){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=tp;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}
    function vibe(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
    const sndSelect=()=>sfx(880,.05,'sine',.15);
    const sndSwap=()=>sfx(440,.08,'triangle',.12);
    const sndMatch=(n=1)=>{[523,659,784,1047].slice(0,n+2).forEach((f,i)=>setTimeout(()=>sfx(f,.1,'sine',.2),i*40));};
    const sndSpecial=()=>{[880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>sfx(f,.12,'square',.25),i*60));};
    const sndLevelUp=()=>{[523,784,1047,1568].forEach((f,i)=>setTimeout(()=>sfx(f,.15,'sine',.3),i*80));};
    const sndFever=()=>{[880,1109,1320,1760,2217].forEach((f,i)=>setTimeout(()=>sfx(f,.1,'square',.2),i*50));};
    const sndGameOver=()=>{sfx(200,.5,'sawtooth',.2);setTimeout(()=>sfx(150,.4,'sawtooth',.2),300);};
    const sndNoMatch=()=>sfx(200,.08,'sawtooth',.1);

    // === CANDY DEFINITIONS ===
    const CANDIES=[
      {id:'gummy',name:'Gummy',col:'#FF69B4',glow:'#FF1493',shape:'circle'},
      {id:'worm',name:'Worm',col:'#00FF9F',glow:'#00CC7A',shape:'wave'},
      {id:'lolly',name:'Lolly',col:'#9D00FF',glow:'#7700CC',shape:'swirl'},
      {id:'jelly',name:'Jelly',col:'#FF9500',glow:'#CC7700',shape:'oval'},
      {id:'hard',name:'Hard',col:'#00FFFF',glow:'#00CCCC',shape:'diamond'},
      {id:'choco',name:'Choco',col:'#8B4513',glow:'#5C2E0C',shape:'square'}
    ];

    // === GAME STATE ===
    let gameState=isHikariBoy?'playing':'start';
    let levelNum=1,score=0,moves=0,target=1000,feverMode=false,feverTimer=0;
    let grid=[],cursor={x:3,y:3,selected:null},particles=[],floats=[],bgSparkles=[];
    let shakeAmt=0,combo=0,lastMatchTime=0;
    let animating=false,dropAnim=[];

    const LEVELS=[
      {id:1,target:1000,moves:20,type:'score',name:'SWEET START'},
      {id:2,target:15,moves:25,type:'collect',collect:'gummy',name:'GUMMY HUNT'},
      {id:3,target:8,moves:30,type:'clear',name:'CANDY CRUSH'},
      {id:4,target:2000,moves:15,type:'score',fever:true,name:'SUGAR RUSH'},
      {id:5,target:20,moves:35,type:'collect',collect:'lolly',name:'LOLLIPOP DROP'}
    ];

    // === GRID FUNCTIONS ===
    function initGrid(){grid=[];for(let y=0;y<8;y++){grid[y]=[];for(let x=0;x<8;x++){grid[y][x]=randomCandy(x,y);}}removeInitialMatches();}
    function randomCandy(x,y){const type=Math.floor(Math.random()*6);return{type,special:null,x,y,scale:1,offsetY:0,glow:0,bob:Math.random()*Math.PI*2};}
    function removeInitialMatches(){let matches;while((matches=findMatches()).length>0){matches.forEach(m=>{grid[m.y][m.x]=randomCandy(m.x,m.y);});}}

    function findMatches(){
      const matches=[],matched=new Set();
      for(let y=0;y<8;y++)for(let x=0;x<6;x++){const t=grid[y][x]?.type;if(t!==null&&t===grid[y][x+1]?.type&&t===grid[y][x+2]?.type){matched.add(`${x},${y}`);matched.add(`${x+1},${y}`);matched.add(`${x+2},${y}`);}}
      for(let x=0;x<8;x++)for(let y=0;y<6;y++){const t=grid[y][x]?.type;if(t!==null&&t===grid[y+1][x]?.type&&t===grid[y+2][x]?.type){matched.add(`${x},${y}`);matched.add(`${x},${y+1}`);matched.add(`${x},${y+2}`);}}
      return Array.from(matched).map(s=>{const[x,y]=s.split(',').map(Number);return{x,y};});
    }

    function attemptSwap(a,b){
      if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)!==1)return false;
      const tmp=grid[a.y][a.x];grid[a.y][a.x]=grid[b.y][b.x];grid[b.y][b.x]=tmp;
      const matches=findMatches();
      if(matches.length===0){grid[b.y][b.x]=grid[a.y][a.x];grid[a.y][a.x]=tmp;sndNoMatch();return false;}
      sndSwap();moves--;checkMatches();return true;
    }

    function checkMatches(){
      const matches=findMatches();if(matches.length===0){combo=0;animating=false;return;}
      animating=true;combo++;lastMatchTime=Date.now();
      const pts=matches.length*10*(combo>1?combo:1)*(feverMode?3:1);score+=pts;
      if(matches.length>=4)sndSpecial();else sndMatch(Math.min(combo,3));
      if(matches.length>=4)shakeAmt=matches.length>=5?8:5;
      
      matches.forEach(m=>{
        const c=grid[m.y][m.x];if(!c)return;
        burst(m.x,m.y,CANDIES[c.type].col);
        grid[m.y][m.x]=null;
      });
      
      const texts=['SWEET!','TASTY!','DELICIOUS!','SUGAR RUSH!','PICU BLAST!'];
      const txt=texts[Math.min(combo-1,texts.length-1)];
      floatText(gridX(3.5),gridY(-1),txt,combo>2?'#FFD700':'#FF69B4',20+combo*4);
      
      setTimeout(()=>{applyGravity();fillEmpty();setTimeout(checkMatches,300);},200);
    }

    function applyGravity(){for(let x=0;x<8;x++){let writeY=7;for(let y=7;y>=0;y--){if(grid[y][x]){if(writeY!==y){grid[writeY][x]=grid[y][x];grid[writeY][x].y=writeY;grid[y][x]=null;dropAnim.push({x,y:writeY,t:0,fromY:y});}writeY--;}}}}
    function fillEmpty(){for(let x=0;x<8;x++)for(let y=0;y<8;y++)if(!grid[y][x]){grid[y][x]=randomCandy(x,y);grid[y][x].offsetY=-400;dropAnim.push({x,y,t:0,fromY:-8+y});}}

    // === RENDER HELPERS ===
    const gridX=(c)=>35+c*40,gridY=(r)=>120+r*40;
    function drawCandy(c,px,py,sz=34){
      if(!c)return;const cd=CANDIES[c.type];ctx.save();
      ctx.translate(px+sz/2,py+sz/2+c.offsetY);
      ctx.scale(c.scale,c.scale);
      if(c.glow>0){ctx.shadowColor=cd.glow;ctx.shadowBlur=c.glow*20;}
      const g=ctx.createRadialGradient(-8,-8,2,0,0,sz/1.5);g.addColorStop(0,'#fff');g.addColorStop(0.3,cd.col);g.addColorStop(1,cd.glow);
      ctx.fillStyle=g;
      if(cd.shape==='circle'){ctx.beginPath();ctx.arc(0,0,sz/2-2,0,Math.PI*2);ctx.fill();}
      else if(cd.shape==='square'){ctx.beginPath();ctx.roundRect(-sz/2+3,-sz/2+3,sz-6,sz-6,6);ctx.fill();}
      else if(cd.shape==='diamond'){ctx.beginPath();ctx.moveTo(0,-sz/2+4);ctx.lineTo(sz/2-4,0);ctx.lineTo(0,sz/2-4);ctx.lineTo(-sz/2+4,0);ctx.closePath();ctx.fill();}
      else{ctx.beginPath();ctx.arc(0,0,sz/2-2,0,Math.PI*2);ctx.fill();}
      ctx.shadowBlur=0;
      if(c.special==='stripedH'||c.special==='stripedV'){ctx.fillStyle='#fff';ctx.fillRect(-sz/2+8,-2,sz-16,4);ctx.fillRect(-2,-sz/2+8,4,sz-16);}
      ctx.restore();
    }

    function drawGrid(){
      ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.roundRect(30,115,320,320,12);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.stroke();
      for(let y=0;y<8;y++)for(let x=0;x<8;x++){drawCandy(grid[y][x],gridX(x),gridY(y));}
    }

    function drawCursor(){
      const x=gridX(cursor.x),y=gridY(cursor.y);
      ctx.strokeStyle='#FFD700';ctx.lineWidth=3;ctx.shadowColor='#FFD700';ctx.shadowBlur=15;
      ctx.strokeRect(x-2,y-2,38,38);ctx.shadowBlur=0;
      if(cursor.selected){const sx=gridX(cursor.selected.x),sy=gridY(cursor.selected.y);ctx.strokeStyle='#FF69B4';ctx.strokeRect(sx-2,sy-2,38,38);}
    }

    // === PARTICLES & EFFECTS ===
    class Particle{
      constructor(x,y,col){this.x=x;this.y=y;this.vx=(Math.random()-.5)*12;this.vy=(Math.random()-.5)*12-5;this.life=1;this.col=col;this.sz=Math.random()*8+4;this.rot=Math.random()*Math.PI*2;}
      update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.4;this.life-=.025;this.rot+=.15;}
      draw(){ctx.save();ctx.globalAlpha=this.life;ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.col;ctx.fillRect(-this.sz/2,-this.sz/2,this.sz,this.sz);ctx.restore();}
    }
    function burst(gx,gy,col){const x=gridX(gx)+20,y=gridY(gy)+20;for(let i=0;i<12;i++)particles.push(new Particle(x,y,col));vibe(30);}

    class FloatText{
      constructor(x,y,t,c,sz){this.x=x;this.y=y;this.t=t;this.c=c;this.sz=sz;this.life=1;this.vy=-3;}
      update(){this.y+=this.vy;this.vy*=.95;this.life-=.02;}
      draw(){ctx.save();ctx.globalAlpha=this.life;ctx.font=`900 ${this.sz}px Arial Black`;ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.strokeText(this.t,this.x,this.y);const g=ctx.createLinearGradient(this.x-50,0,this.x+50,0);g.addColorStop(0,'#FFD700');g.addColorStop(.5,this.c);g.addColorStop(1,'#FF69B4');ctx.fillStyle=g;ctx.fillText(this.t,this.x,this.y);ctx.restore();}
    }
    function floatText(x,y,t,c,sz){floats.push(new FloatText(x,y,t,c,sz));}

    // === BACKGROUND ===
    function initBgSparkles(){for(let i=0;i<30;i++)bgSparkles.push({x:Math.random()*W,y:Math.random()*SAFE_H,sz:Math.random()*3+1,spd:Math.random()*.5+.2,phase:Math.random()*Math.PI*2});}
    function drawBackground(){
      const bg=ctx.createLinearGradient(0,0,0,SAFE_H);bg.addColorStop(0,'#2d1b4e');bg.addColorStop(1,'#1a0a2e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,SAFE_H);
      if(feverMode){ctx.fillStyle=`hsla(${(Date.now()/10)%360},100%,50%,0.15)`;ctx.fillRect(0,0,W,SAFE_H);}
      bgSparkles.forEach(s=>{s.y-=s.spd;if(s.y<0)s.y=SAFE_H;s.phase+=.05;ctx.save();ctx.globalAlpha=.3+Math.sin(s.phase)*.2;ctx.fillStyle=feverMode?`hsl(${(s.x+Date.now()/20)%360},100%,70%)`:'#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.sz,0,Math.PI*2);ctx.fill();ctx.restore();});
    }

    // === UI ===
    function drawUI(){
      ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.roundRect(20,15,350,45,20);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=2;ctx.stroke();
      ctx.font='900 22px Arial Black';ctx.textAlign='left';ctx.fillStyle='#FFD700';ctx.fillText(`★ ${score.toLocaleString()}`,40,48);
      const lvl=LEVELS[levelNum-1]||LEVELS[0];ctx.textAlign='right';ctx.fillStyle='#00FFFF';ctx.fillText(`${lvl.name}`,370,48);
      ctx.textAlign='center';ctx.fillStyle=moves<5?'#FF3860':'#fff';ctx.font='900 18px Arial Black';ctx.fillText(`MOVES: ${moves}`,195,95);
      if(feverMode){ctx.fillStyle='#FF69B4';ctx.font='900 16px Arial Black';ctx.fillText('🔥 FEVER MODE 🔥',195,390);}
      const barW=300,barH=10;ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(45,405,barW,barH);const pct=Math.min(1,score/target);const g=ctx.createLinearGradient(45,0,345,0);g.addColorStop(0,'#FF69B4');g.addColorStop(1,'#00FFFF');ctx.fillStyle=g;ctx.fillRect(45,405,barW*pct,barH);
    }

    function drawStart(){
      drawBackground();ctx.save();ctx.translate(W/2,SAFE_H*.35);
      ctx.font='900 48px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#FF69B4';ctx.lineWidth=12;ctx.strokeText('PICU',0,0);ctx.strokeText('SWEETS',0,55);
      const lg=ctx.createLinearGradient(-100,-20,100,40);lg.addColorStop(0,'#FF69B4');lg.addColorStop(.5,'#FFD700');lg.addColorStop(1,'#00FFFF');ctx.fillStyle=lg;ctx.fillText('PICU',0,0);ctx.fillText('SWEETS',0,55);
      ctx.restore();
      ctx.fillStyle='#fff';ctx.font='900 16px Arial Black';ctx.textAlign='center';ctx.fillText('Press A or START to Play',W/2,SAFE_H*.6);
      ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillText('Match 3+ candies • Create specials',W/2,SAFE_H*.7);
    }

    function drawLevelComplete(){
      ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,SAFE_H);
      ctx.save();ctx.translate(W/2,SAFE_H*.4);
      ctx.font='900 36px Arial Black';ctx.textAlign='center';ctx.fillStyle='#FFD700';ctx.fillText('LEVEL CLEAR!',0,0);
      ctx.restore();
      ctx.font='900 18px Arial Black';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(`Score: ${score.toLocaleString()}`,W/2,SAFE_H*.55);
      ctx.fillStyle='#00FFFF';ctx.fillText('Press A for Next Level',W/2,SAFE_H*.7);
    }

    function drawGameOver(){
      ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,SAFE_H);
      ctx.save();ctx.translate(W/2,SAFE_H*.4);
      ctx.font='900 36px Arial Black';ctx.textAlign='center';ctx.fillStyle='#FF3860';ctx.fillText('GAME OVER',0,0);
      ctx.restore();
      ctx.font='900 18px Arial Black';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(`Final Score: ${score.toLocaleString()}`,W/2,SAFE_H*.55);
      ctx.fillStyle='#00FFFF';ctx.fillText('Press A to Restart',W/2,SAFE_H*.7);
    }

    // === INPUT HANDLERS ===
    function moveCursor(dx,dy){cursor.x=Math.max(0,Math.min(7,cursor.x+dx));cursor.y=Math.max(0,Math.min(7,cursor.y+dy));sndSelect();}
    function handleSelect(){if(animating)return;if(!cursor.selected){cursor.selected={x:cursor.x,y:cursor.y};}else{if(cursor.x===cursor.selected.x&&cursor.y===cursor.selected.y){cursor.selected=null;return;}attemptSwap(cursor.selected,cursor);cursor.selected=null;}}

    function startLevel(n){
      levelNum=n;const lvl=LEVELS[n-1];if(!lvl)return;
      score=0;target=lvl.target;moves=lvl.moves;feverMode=lvl.fever||false;feverTimer=feverMode?600:0;
      initGrid();gameState='playing';if(isHikariBoy)initAC();
    }
    function nextLevel(){if(levelNum<LEVELS.length)startLevel(levelNum+1);else{levelNum=1;gameState='start';}}
    function resetGame(){levelNum=1;gameState='start';}

    // === BUTTON PRESS HANDLER ===
    window.addEventListener('message',e=>{
      if(e.data?.type==='BUTTON_PRESS'){
        const btn=e.data.button;initAC();
        if(btn==='start'){
          if(gameState==='start')startLevel(1);
          else if(gameState==='playing')gameState='paused';
          else if(gameState==='paused')gameState='playing';
          else if(gameState==='levelComplete')nextLevel();
          else if(gameState==='gameOver')resetGame();
        }
        if(btn==='a'){
          if(gameState==='start')startLevel(1);
          else if(gameState==='playing')handleSelect();
          else if(gameState==='levelComplete')nextLevel();
          else if(gameState==='gameOver')resetGame();
        }
        if(btn==='select'&&isHikariBoy){window.parent.postMessage({type:'GAME_EXIT',gameId:'picu-sweets'},'*');}
        if(btn==='dpad-up')moveCursor(0,-1);
        if(btn==='dpad-down')moveCursor(0,1);
        if(btn==='dpad-left')moveCursor(-1,0);
        if(btn==='dpad-right')moveCursor(1,0);
      }
    });

    // === TOUCH SUPPORT ===
    canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();const tx=((e.touches[0].clientX-r.left)/(r.width/390)-35)/40;const ty=((e.touches[0].clientY-r.top)/(r.height/844)-120)/40;if(tx>=0&&tx<8&&ty>=0&&ty<8){cursor.x=Math.floor(tx);cursor.y=Math.floor(ty);handleSelect();}},{passive:false});

    // === MAIN LOOP ===
    function update(){
      bgSparkles.forEach(s=>{s.y-=s.spd;if(s.y<0)s.y=SAFE_H;s.phase+=.05;});
      particles=particles.filter(p=>{p.update();return p.life>0;});
      floats=floats.filter(f=>{f.update();return f.life>0;});
      if(shakeAmt>0)shakeAmt*=.9;if(shakeAmt<0.5)shakeAmt=0;
      for(let y=0;y<8;y++)for(let x=0;x<8;x++){const c=grid[y][x];if(c){c.bob+=.05;c.glow*=0.95;if(c.offsetY<0)c.offsetY+=20;if(c.offsetY>0)c.offsetY=0;}}
      if(gameState==='playing'&&moves<=0&&!animating){gameState='gameOver';sndGameOver();}
      if(gameState==='playing'&&score>=target&&!animating){gameState='levelComplete';sndLevelUp();}
      if(feverMode){feverTimer--;if(feverTimer<=0)feverMode=false;}
    }

    function render(){
      ctx.save();
      if(CAM_SHIFT!==0)ctx.translate(0,CAM_SHIFT);
      if(shakeAmt>0)ctx.translate((Math.random()-.5)*shakeAmt,(Math.random()-.5)*shakeAmt);
      
      if(gameState==='start'){drawStart();}
      else if(gameState==='levelComplete'){drawBackground();drawGrid();drawUI();drawLevelComplete();}
      else if(gameState==='gameOver'){drawBackground();drawGrid();drawUI();drawGameOver();}
      else{
        drawBackground();drawGrid();drawCursor();drawUI();
        particles.forEach(p=>p.draw());floats.forEach(f=>f.draw());
      }
      
      if(isHikariBoy){ctx.fillStyle='rgba(0,200,255,0.15)';ctx.beginPath();ctx.roundRect(W/2-50,SAFE_H-14,100,12,4);ctx.fill();ctx.fillStyle='rgba(0,200,255,0.7)';ctx.font='bold 7px Arial';ctx.textAlign='center';ctx.fillText('▲ PICU SWEETS ▲',W/2,SAFE_H-5);}
      ctx.restore();
      requestAnimationFrame(render);
    }

    // === INIT ===
    initBgSparkles();
    if(isHikariBoy){initAC();startLevel(1);}
    setInterval(update,1000/60);render();
  </script>
</body>
</html>
