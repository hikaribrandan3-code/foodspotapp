function tone(f,d,type='sine',g=0.08,slide=0){if(muted||!aCtx)return;const o=aCtx.createOscillator(),gn=aCtx.createGain();o.connect(gn);gn.connect(aCtx.destination);o.type=type;o.frequency.value=f;if(slide)o.frequency.linearRampToValueAtTime(slide,aCtx.currentTime+d);gn.gain.value=g;gn.gain.exponentialRampToValueAtTime(0.001,aCtx.currentTime+d);o.start();o.stop(aCtx.currentTime+d);}

let overStingNodes=[];
function stopOverSting(){for(const n of overStingNodes){try{n.stop();}catch(e){}}overStingNodes=[];}
function sfxGameOverSting(){
  if(muted||!aCtx)return;
  stopOverSting();
  const now=aCtx.currentTime;
  // impact hit
  const imp=aCtx.createOscillator(),impG=aCtx.createGain();
  imp.connect(impG);impG.connect(aCtx.destination);
  imp.type='sawtooth';imp.frequency.setValueAtTime(440,now);
  imp.frequency.exponentialRampToValueAtTime(55,now+0.18);
  impG.gain.setValueAtTime(0.22,now);impG.gain.exponentialRampToValueAtTime(0.0001,now+0.22);
  imp.start(now);imp.stop(now+0.23);overStingNodes.push(imp);
  // low bass
  const bass=aCtx.createOscillator(),bassG=aCtx.createGain();
  bass.connect(bassG);bassG.connect(aCtx.destination);
  bass.type='sine';bass.frequency.setValueAtTime(55,now+0.1);
  bassG.gain.setValueAtTime(0.15,now+0.1);bassG.gain.exponentialRampToValueAtTime(0.0001,now+2.2);
  bass.start(now+0.1);bass.stop(now+2.3);overStingNodes.push(bass);
  // violin simulation: sawtooth + vibrato via FM
  const mel=[{f:587,t:0.3},{f:494,t:0.82},{f:440,t:1.28},{f:370,t:1.78},{f:330,t:2.3},{f:277,t:2.9}];
  for(const{f,t} of mel){
    // vibrato LFO
    const lfo=aCtx.createOscillator(),lfoG=aCtx.createGain();
    lfo.frequency.value=5.5;lfoG.gain.value=6;
    lfo.connect(lfoG);
    // main violin tone — sawtooth for bow friction
    const o=aCtx.createOscillator(),g=aCtx.createGain();
    lfoG.connect(o.frequency);
    o.connect(g);g.connect(aCtx.destination);
    o.type='sawtooth';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,now+t);
    g.gain.linearRampToValueAtTime(0.07,now+t+0.12); // slow bow attack
    g.gain.setValueAtTime(0.07,now+t+0.38);
    g.gain.exponentialRampToValueAtTime(0.0001,now+t+0.72);
    lfo.start(now+t);lfo.stop(now+t+0.75);
    o.start(now+t);o.stop(now+t+0.75);
    overStingNodes.push(o,lfo);
    // soft octave below for warmth
    const o2=aCtx.createOscillator(),g2=aCtx.createGain();
    o2.connect(g2);g2.connect(aCtx.destination);
    o2.type='triangle';o2.frequency.value=f*0.5;
    g2.gain.setValueAtTime(0.0001,now+t);
    g2.gain.linearRampToValueAtTime(0.03,now+t+0.14);
    g2.gain.exponentialRampToValueAtTime(0.0001,now+t+0.7);
    o2.start(now+t);o2.stop(now+t+0.75);overStingNodes.push(o2);
    // harmony a minor third above for sadness
    const o3=aCtx.createOscillator(),g3=aCtx.createGain();
    o3.connect(g3);g3.connect(aCtx.destination);
    o3.type='sawtooth';o3.frequency.value=f*1.189;
    g3.gain.setValueAtTime(0.0001,now+t);
    g3.gain.linearRampToValueAtTime(0.025,now+t+0.15);
    g3.gain.exponentialRampToValueAtTime(0.0001,now+t+0.65);
    o3.start(now+t);o3.stop(now+t+0.75);overStingNodes.push(o3);
  }
}

// ── PARTICLES ──
function spawnParticles(x,y,n,cols,spd=3,life=30){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(0.5+Math.random());particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col:cols[Math.floor(Math.random()*cols.length)],r:2+Math.random()*3,life,maxLife:life});}}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;if(p.life<=0)particles.splice(i,1);}}
function drawParticles(){for(const p of particles){ctx.save();ctx.globalAlpha=(p.life/p.maxLife)*0.9;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();}}

function spawnDeathBurst(x,y){deathParticles=[];for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*9;deathParticles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col:CANDY_COLS[Math.floor(Math.random()*CANDY_COLS.length)],r:3+Math.random()*6,life:60,maxLife:60,rot:Math.random()*Math.PI*2,rotSpd:(Math.random()-0.5)*0.3});}}
function updateDeathParticles(){for(const p of deathParticles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.vx*=0.97;p.life--;p.rot+=p.rotSpd;}}
function drawDeathParticles(){for(const p of deathParticles){if(p.life<=0)continue;ctx.save();ctx.globalAlpha=(p.life/p.maxLife);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);ctx.restore();}}

// power-up pickup shockwave ring — bounded array, few active at once, cheap to draw
let shockwaves=[];
function spawnShockwave(x,y,col){shockwaves.push({x,y,col,life:22,maxLife:22});}
function updateShockwaves(){for(let i=shockwaves.length-1;i>=0;i--){shockwaves[i].life--;if(shockwaves[i].life<=0)shockwaves.splice(i,1);}}
function drawShockwaves(){for(const s of shockwaves){const t=1-s.life/s.maxLife,r=6+t*48;ctx.save();ctx.globalAlpha=(1-t)*0.8;ctx.strokeStyle=s.col;ctx.lineWidth=4*(1-t*0.6);ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.stroke();ctx.restore();}}

function addPopup(txt,x,y,col='#FFFFFF',scale=1){popups.push({txt,x,y,col,life:80,maxLife:80,scale});}
function updatePopups(){for(let i=popups.length-1;i>=0;i--){popups[i].life--;popups[i].y-=0.4;if(popups[i].life<=0)popups.splice(i,1);}}
function drawPopups(){for(const p of popups){const a=Math.min(1,p.life/p.maxLife*2);ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.font=`bold ${Math.round(18*p.scale)}px "Segoe UI",sans-serif`;ctx.textAlign='center';ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=4;ctx.strokeText(p.txt,0,0);ctx.fillStyle=p.col;ctx.fillText(p.txt,0,0);ctx.restore();}}

function addFlare(x,y){lensFlares.push({x,y,life:20,maxLife:20});}
function drawFlares(){for(let i=lensFlares.length-1;i>=0;i--){const f=lensFlares[i],a=f.life/f.maxLife,r=20*(1-a);ctx.save();ctx.globalAlpha=a*0.8;const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r+20);g.addColorStop(0,'rgba(255,240,210,0.9)');g.addColorStop(1,'rgba(255,180,120,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r+20,0,Math.PI*2);ctx.fill();ctx.strokeStyle=`rgba(255,220,180,${a})`;ctx.lineWidth=1.5;for(let k=0;k<8;k++){const ang=k*Math.PI/4,len=8+14*a;ctx.beginPath();ctx.moveTo(f.x+Math.cos(ang)*4,f.y+Math.sin(ang)*4);ctx.lineTo(f.x+Math.cos(ang)*len,f.y+Math.sin(ang)*len);ctx.stroke();}ctx.restore();f.life--;if(f.life<=0)lensFlares.splice(i,1);}}
function buildSpeedLines(){speedLines=[];for(let i=0;i<18;i++)speedLines.push({angle:(Math.random()-0.5)*0.3,len:40+Math.random()*80,y:Math.random()*C.H,col:CANDY_COLS[i%CANDY_COLS.length]});}
function drawSpeedLines(){if(!feverActive)return;ctx.save();ctx.globalAlpha=0.35;for(const l of speedLines){l.y+=(Math.random()-0.5)*2;ctx.strokeStyle=l.col;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(C.W,l.y);ctx.lineTo(C.W-l.len,l.y+Math.sin(l.angle)*l.len);ctx.stroke();}ctx.restore();}

// ── SPAWN ──
function spawnRow(){
  const now=performance.now();
  if(now-lastSpawn<spawnInt)return;
  const last=obstacles[obstacles.length-1];
  if(last&&last.x>C.W-C.GAP)return;
  lastSpawn=now;
  const h=C.OBS_MIN_H+Math.random()*(C.OBS_MAX_H-C.OBS_MIN_H);
  const candyTypes=['lollipop','candycane','licorice','gummybear','jawbreaker'];
  const ctype=candyTypes[Math.floor(Math.random()*candyTypes.length)];
  const ccol=CANDY_COLS[Math.floor(Math.random()*CANDY_COLS.length)];
  const phase=Math.random()*Math.PI*2;
  if(Math.random()>0.5)obstacles.push({x:C.W,y:floorY-h,w:C.OBS_W,h,col:ccol,ctype,fromFloor:true,phase});
  else obstacles.push({x:C.W,y:ceilingY,w:C.OBS_W,h,col:ccol,ctype,fromFloor:false,phase});
  if(Math.random()<0.55){const cy=(Math.random()>0.5)?floorY-9*2-Math.random()*40:ceilingY+9*2+Math.random()*40;coins.push({x:C.W+40,y:cy,r:9,spin:0,collected:false,life:1});}
  if(Math.random()<C.POWERUP_SPAWN){const t=C.POWERUP_TYPES[Math.floor(Math.random()*C.POWERUP_TYPES.length)];const py=(Math.random()>0.5)?floorY-44:ceilingY+44;powerups.push({x:C.W+70,y:py,type:t,r:12,spin:0});}
}

// ── UPDATE ──
function update(dt){
  if(state===GS.DYING){
    deathTimer-=dt;deathShake*=0.88;updateDeathParticles();
    const spd=speed*0.04;for(const o of obstacles)o.x-=spd;
    if(deathTimer<=0){state=GS.OVER;setTimeout(()=>sfxGameOverSting(),80);}
    return;
  }
  if(state!==GS.PLAY)return;
  frameNum++;gameTime+=dt;
  // record ghost frame
  currentRunFrames.push(playerY);
  playerTrail.push({y:playerY});if(playerTrail.length>7)playerTrail.shift();
  // tutorial fade
  tutorialAlpha=gameTime<7000?1:Math.max(0,1-(gameTime-7000)/1000);

  const fm=(feverActive?2:1)*(multi2Active?2:1);
  const fs=feverActive?1.2:1,ss=slowmoActive?0.5:1;
  score+=C.SCORE_INC*(dt/16.67)*fm;
  if(shieldActive){shieldTimer-=dt;if(shieldTimer<=0)shieldActive=false;}
  if(magnetActive){magnetTimer-=dt;if(magnetTimer<=0)magnetActive=false;}
  if(slowmoActive){slowmoTimer-=dt;if(slowmoTimer<=0)slowmoActive=false;}
  if(multi2Active){multi2Timer-=dt;if(multi2Timer<=0)multi2Active=false;}
  if(feverActive){feverTimer-=dt;feverColor=(feverColor+0.008)%1;if(feverTimer<=0)feverActive=false;}
  const fc=Math.floor(score/C.FEVER_EVERY);
  if(!feverActive&&fc>Math.floor((score-C.SCORE_INC*(dt/16.67)*fm)/C.FEVER_EVERY)&&fc>0){feverActive=true;feverTimer=C.FEVER_DUR;buildSpeedLines();sfxFever();Haptics.fire(Haptics.fever,true);addPopup('🔥 FEVER MODE 🔥',C.W/2,C.H/2-40,'#FF6B00',1.3);}
  if(nextHypeIdx<HYPE.length&&score>=HYPE[nextHypeIdx].at&&(gameTime-lastHypeTime)>4000){addPopup(HYPE[nextHypeIdx].msg,C.W/2,C.H/2,'#FFFFFF',1.1);lastHypeTime=gameTime;nextHypeIdx++;}
  squishX+=(1-squishX)*0.22;squishY+=(1-squishY)*0.22;
  spawnRow();updateBgObjs();
  const spd=speed*fs*ss;
  for(let i=obstacles.length-1;i>=0;i--){
    obstacles[i].x-=spd;
    if(!obstacles[i].counted&&obstacles[i].x+obstacles[i].w<C.PLAYER_X){obstacles[i].counted=true;comboCount++;comboDisplay=comboCount;if(comboCount>0&&comboCount%C.COMBO_MILESTONE===0){const bonus=comboCount*5;score+=bonus*fm;sfxCombo();Haptics.fire(Haptics.combo,true);addPopup(`${comboCount}× COMBO! +${bonus}`,C.W/2,C.H/2-30,'#FFE44E',1.3);}}
    if(obstacles[i].x+obstacles[i].w<0)obstacles.splice(i,1);
  }
  for(const cn of coins){if(!cn.collected){if(magnetActive){const dx=C.PLAYER_X+C.PLAYER_SIZE/2-cn.x,dy=playerY+C.PLAYER_SIZE/2-cn.y;if(Math.sqrt(dx*dx+dy*dy)<C.MAGNET_R){cn.x+=dx*0.12;cn.y+=dy*0.12;}}cn.x-=spd;cn.spin+=0.08;}}
  for(let i=coins.length-1;i>=0;i--){coins[i].life-=dt/2000;if(coins[i].x+9<0||coins[i].life<=0)coins.splice(i,1);}
  for(let i=powerups.length-1;i>=0;i--){powerups[i].x-=spd;powerups[i].spin+=0.05;if(powerups[i].x<-20)powerups.splice(i,1);}
  for(const cn of coins){if(!cn.collected){const dx=C.PLAYER_X+C.PLAYER_SIZE/2-cn.x,dy=playerY+C.PLAYER_SIZE/2-cn.y;if(Math.sqrt(dx*dx+dy*dy)<9+C.PLAYER_SIZE/2){cn.collected=true;cn.life=-1;score+=10*fm;sfxCoin();Haptics.fire(Haptics.coin);addFlare(cn.x,cn.y);spawnParticles(cn.x,cn.y,8,['#FFD700','#FFECB3','#FFA500'],3,25);addPopup(multi2Active?'+20':'+10',cn.x,cn.y-12,'#FFD700');}}}
  for(let i=powerups.length-1;i>=0;i--){const pu=powerups[i];const dx=C.PLAYER_X+C.PLAYER_SIZE/2-pu.x,dy=playerY+C.PLAYER_SIZE/2-pu.y;if(Math.sqrt(dx*dx+dy*dy)<pu.r+C.PLAYER_SIZE/2){const m=PU_META[pu.type];if(pu.type==='shield'){shieldActive=true;shieldTimer=C.SHIELD_DUR;}if(pu.type==='magnet'){magnetActive=true;magnetTimer=C.MAGNET_DUR;}if(pu.type==='slowmo'){slowmoActive=true;slowmoTimer=C.SLOWMO_DUR;sfxSlowmo();}if(pu.type==='multi2'){multi2Active=true;multi2Timer=C.MULTI2_DUR;sfxMulti();}Haptics.fire(Haptics.powerup);addPopup(m.icon+' '+m.label+'!',C.W/2,C.H/2-10,m.col,1.15);spawnParticles(pu.x,pu.y,20,[m.col,'#FFFFFF'],4,34);spawnShockwave(pu.x,pu.y,m.col);puFlashFrames=10;puFlashCol=m.col;powerups.splice(i,1);}}
  if(checkCollision()){if(shieldActive){shieldActive=false;shieldTimer=0;sfxShield();Haptics.fire(Haptics.shieldBreak,true);flashFrames=8;chromaFrames=10;spawnParticles(C.PLAYER_X+C.PLAYER_SIZE/2,playerY+C.PLAYER_SIZE/2,16,['#00BFFF','#FFFFFF'],4,40);addPopup('🛡 BLOCKED!',C.PLAYER_X+30,playerY-10,'#00BFFF',1.1);}else triggerDeath();}
  speed=Math.min(C.MAX_SPEED,speed+C.SPEED_INC);spawnInt=Math.max(C.MIN_SPAWN,spawnInt-C.SPAWN_DEC);
  updateParticles();updatePopups();
  if(flashFrames>0)flashFrames--;if(chromaFrames>0)chromaFrames--;if(puFlashFrames>0)puFlashFrames--;
  updateShockwaves();
}

function checkCollision(){const px=C.PLAYER_X+3,py=playerY+3,pw=C.PLAYER_SIZE-6,ph=C.PLAYER_SIZE-6;for(const o of obstacles){if(px<o.x+o.w&&px+pw>o.x&&py<o.y+o.h&&py+ph>o.y)return true;}return false;}

function triggerDeath(){
  state=GS.DYING;deathTimer=C.DEATH_DUR;deathShake=18;stopMusic();sfxOver();Haptics.fire(Haptics.death,true);
  spawnDeathBurst(C.PLAYER_X+C.PLAYER_SIZE/2,playerY+C.PLAYER_SIZE/2);
  flashFrames=12;
  if(score>hiScore){hiScore=score;saveHiScore();}
  initOverScreen();
}
function flip(){
  if(state!==GS.PLAY)return;
  gravDown=!gravDown;playerY=gravDown?floorY-C.PLAYER_SIZE:ceilingY;
  Haptics.fire(Haptics.flip);sfxFlip();squishX=1.45;squishY=0.58;
  spawnParticles(C.PLAYER_X+C.PLAYER_SIZE/2,playerY+C.PLAYER_SIZE/2,10,CANDY_COLS,4,20);
  addPopup(gravDown?'FLIP! ↓':'FLIP! ↑',C.PLAYER_X+60,playerY+(gravDown?-12:C.PLAYER_SIZE+16),'#FFFFFF');
}
function startCount(){
  stopOverSting();state=GS.COUNT;countVal=3;sfxCount();
  countParticles=[];countPhase=0;countFlash=0;
  tickCountAnim(3);
  countTimer=setInterval(()=>{
    countVal--;
    if(countVal>0){sfxCount();Haptics.fire(Haptics.countTick);tickCountAnim(countVal);}
    else{
      tickCountAnim(0);sfxStart();Haptics.fire(Haptics.countGo,true);
      setTimeout(()=>{
        clearInterval(countTimer);countTimer=null;
        countParticles=[];countPhase=0;countFlash=0;
        popups=[];
        state=GS.PLAY;lastSpawn=performance.now();startMusic();
      },900);
    }
  },1000);
}
function pauseToggle(){if(state===GS.PLAY){state=GS.PAUSE;stopMusic();}else if(state===GS.PAUSE){state=GS.PLAY;if(aCtx)startMusic();}}

function coord(cx,cy){const r=canvas.getBoundingClientRect();return{x:(cx-r.left)*(C.W/r.width),y:(cy-r.top)*(C.H/r.height)};}
function input(x,y){
  initAudio();
  if(x>C.W-48&&y<50){muted=!muted;if(muted)stopMusic();else if(state===GS.PLAY)startMusic();return;}
  if((state===GS.PLAY||state===GS.PAUSE)&&x>C.W-96&&x<C.W-52&&y<50){pauseToggle();return;}
  switch(state){case GS.START:startCount();break;case GS.PLAY:flip();break;case GS.PAUSE:pauseToggle();break;case GS.DYING:break;case GS.OVER:resetGame();startCount();break;}
}
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const c=coord(t.clientX,t.clientY);input(c.x,c.y);},{passive:false});
canvas.addEventListener('click',e=>{const c=coord(e.clientX,e.clientY);input(c.x,c.y);});
// ── HikariaBoy button wiring ──
window.addEventListener('message',(e)=>{
  if(e.data?.type==='AUDIO_UNLOCK'){initAudio();return;}
  if(e.data?.type==='AUDIO_RESUME'){initAudio();if(aCtx&&aCtx.state==='suspended')aCtx.resume();return;}
  if(e.data?.type==='BUTTON_PRESS'){
    const btn=e.data.button;
    if(btn==='a'||btn==='start'){
      initAudio();
      if(state===GS.START)startCount();
      else if(state===GS.PLAY)flip();
      else if(state===GS.PAUSE)pauseToggle();
      else if(state===GS.OVER){resetGame();startCount();}
    }
    if(btn==='select'){
      window.parent.postMessage({type:'GAME_EXIT',gameId:'gumball-gravity'},'*');
    }
  }
});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();initAudio();switch(state){case GS.START:startCount();break;case GS.PLAY:flip();break;case GS.OVER:resetGame();startCount();break;}}
  if(e.code==='Escape'||e.code==='KeyP')pauseToggle();
  if(e.code==='KeyM'){muted=!muted;if(muted)stopMusic();else if(state===GS.PLAY)startMusic();}
});

// ══ DRAW ══
function drawBG(){
  if(feverActive){const g=ctx.createLinearGradient(0,0,0,C.H);g.addColorStop(0,`hsl(${feverColor*360},100%,62%)`);g.addColorStop(0.5,`hsl(${(feverColor+0.33)*360%360},100%,68%)`);g.addColorStop(1,`hsl(${(feverColor+0.66)*360%360},100%,62%)`);ctx.fillStyle=g;}
  else{const g=ctx.createLinearGradient(0,0,0,C.H);g.addColorStop(0,'#2D0033');g.addColorStop(0.3,'#5A0060');g.addColorStop(0.65,'#8B0060');g.addColorStop(1,'#C2006A');ctx.fillStyle=g;}
  ctx.fillRect(0,0,C.W,C.H);
  const blobs=[{x:C.W*0.12,y:C.H*0.32,r:54,col:'rgba(255,80,160,0.13)'},{x:C.W*0.78,y:C.H*0.28,r:48,col:'rgba(180,60,255,0.12)'},{x:C.W*0.45,y:C.H*0.55,r:60,col:'rgba(255,50,130,0.10)'},{x:C.W*0.88,y:C.H*0.62,r:42,col:'rgba(255,140,200,0.12)'},{x:C.W*0.25,y:C.H*0.72,r:38,col:'rgba(220,80,255,0.10)'}];
  for(const b of blobs){const bg=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);bg.addColorStop(0,b.col);bg.addColorStop(1,'transparent');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();}
  const sw=14;
  for(let x=0;x<C.W;x+=sw){const even=Math.floor(x/sw)%2===0;ctx.fillStyle=even?'rgba(255,80,140,0.7)':'rgba(255,255,255,0.55)';ctx.fillRect(x,0,Math.min(sw,C.W-x),ceilingY-4);ctx.fillStyle=even?'rgba(255,80,140,0.7)':'rgba(255,255,255,0.55)';ctx.fillRect(x,floorY+5,Math.min(sw,C.W-x),Math.floor((C.H-floorY-5)*0.5));}
}

function drawBgObjs(){
  for(const b of bgObjs){
    ctx.save();
    if(b.type==='lolly'){ctx.globalAlpha=0.45;ctx.strokeStyle='rgba(160,100,50,0.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y+b.sz);ctx.lineTo(b.x,b.y+b.sz*2.4);ctx.stroke();ctx.globalAlpha=0.42;ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.sz,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1.4;ctx.beginPath();for(let t=0.1;t<Math.PI*1.9;t+=0.12){const rr=t/(Math.PI*2)*b.sz*0.85;ctx.lineTo(b.x+Math.cos(t+b.spin)*rr,b.y+Math.sin(t+b.spin)*rr);}ctx.stroke();}
    else if(b.type==='star'){const tw=0.25+0.75*Math.abs(Math.sin(frameNum*0.04+b.phase));ctx.globalAlpha=tw*0.55;ctx.fillStyle='#FFD6F7';ctx.beginPath();ctx.arc(b.x,b.y,b.sz,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,200,240,0.7)';ctx.lineWidth=0.9;ctx.globalAlpha=tw*0.35;ctx.beginPath();ctx.moveTo(b.x-b.sz*2.2,b.y);ctx.lineTo(b.x+b.sz*2.2,b.y);ctx.stroke();ctx.beginPath();ctx.moveTo(b.x,b.y-b.sz*2.2);ctx.lineTo(b.x,b.y+b.sz*2.2);ctx.stroke();}
    else if(b.type==='cloud'){ctx.globalAlpha=0.18;ctx.fillStyle='#FFF0FF';ctx.beginPath();ctx.arc(b.x,b.y,b.sz,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(b.x+b.sz*0.88,b.y+3,b.sz*0.72,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(b.x-b.sz*0.82,b.y+3,b.sz*0.66,0,Math.PI*2);ctx.fill();}
    else if(b.type==='gumdrop'){ctx.globalAlpha=0.38;ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.sz,Math.PI,Math.PI*2);ctx.bezierCurveTo(b.x+b.sz,b.y,b.x,b.y+b.sz*1.6,b.x,b.y+b.sz*1.6);ctx.bezierCurveTo(b.x,b.y+b.sz*1.6,b.x-b.sz,b.y,b.x-b.sz,b.y);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.ellipse(b.x-b.sz*0.28,b.y-b.sz*0.22,b.sz*0.22,b.sz*0.34,0,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}

function drawLanes(){
  const sw=16,lh=6;
  for(let x=0;x<C.W;x+=sw){ctx.fillStyle=Math.floor(x/sw)%2===0?'#FF3A7A':'#FFFFFF';ctx.fillRect(x,floorY,Math.min(sw,C.W-x),lh);}
  for(let x=0;x<C.W;x+=sw){ctx.fillStyle=Math.floor(x/sw)%2===0?'#FF3A7A':'#FFFFFF';ctx.fillRect(x,ceilingY-lh,Math.min(sw,C.W-x),lh);}
  ctx.save();ctx.strokeStyle='rgba(255,58,122,0.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,floorY);ctx.lineTo(C.W,floorY);ctx.stroke();ctx.beginPath();ctx.moveTo(0,ceilingY);ctx.lineTo(C.W,ceilingY);ctx.stroke();ctx.restore();
}

function shadeCol(hex,amt){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));return `rgb(${r},${g},${b})`;}

function drawObstacles(){
  for(const o of obstacles){
    ctx.save();
    const cx=o.x+o.w/2,col=o.col,fromFloor=o.fromFloor;
    const ph=o.phase||0;

    if(o.ctype==='lollipop'){
      // HEAD WOBBLE — bobs up/down
      const wobOff=Math.sin(frameNum*0.09+ph)*4;
      ctx.strokeStyle='rgba(210,160,90,0.9)';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,o.y+o.h);ctx.lineTo(cx,o.y+o.h*0.45+wobOff);ctx.stroke();
      const cr=o.w*0.72;const headY=(fromFloor?o.y+cr*0.9:o.y+o.h-cr*0.9)+wobOff;
      const bg=ctx.createRadialGradient(cx-cr*0.25,headY-cr*0.25,cr*0.1,cx,headY,cr);bg.addColorStop(0,'#fff');bg.addColorStop(0.3,col);bg.addColorStop(1,shadeCol(col,-60));ctx.fillStyle=bg;ctx.beginPath();ctx.arc(cx,headY,cr,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.beginPath();ctx.arc(cx,headY,cr,0,Math.PI*2);ctx.clip();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();for(let t=0;t<Math.PI*3.5;t+=0.14){const r2=t/(Math.PI*3.5)*cr*0.9;ctx.lineTo(cx+Math.cos(t)*r2,headY+Math.sin(t)*r2);}ctx.stroke();ctx.restore();
      ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,headY,cr,0,Math.PI*2);ctx.stroke();

    } else if(o.ctype==='candycane'){
      ctx.save();ctx.beginPath();ctx.rect(o.x,o.y,o.w,o.h);ctx.clip();const rg=ctx.createLinearGradient(o.x,0,o.x+o.w,0);rg.addColorStop(0,'rgba(255,255,255,0.9)');rg.addColorStop(0.5,col);rg.addColorStop(1,'rgba(255,255,255,0.7)');ctx.fillStyle=rg;ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=6;for(let d=-o.h*2;d<o.h*2;d+=12){ctx.beginPath();ctx.moveTo(o.x+d,o.y);ctx.lineTo(o.x+d+o.h,o.y+o.h);ctx.stroke();}ctx.restore();
      const hookY=fromFloor?o.y:o.y+o.h,hookDir=fromFloor?-1:1;ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=o.w+6;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx+o.w*0.3,hookY,o.w*0.55,Math.PI,Math.PI*1.85*hookDir||0,hookDir<0);ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=o.w;ctx.beginPath();ctx.arc(cx+o.w*0.3,hookY,o.w*0.55,Math.PI,Math.PI*1.85*hookDir||0,hookDir<0);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.strokeRect(o.x,o.y,o.w,o.h);

    } else if(o.ctype==='licorice'){
      ctx.save();ctx.beginPath();ctx.rect(o.x,o.y,o.w,o.h);ctx.clip();const bands=['#CC0033','#111111','#CC0033','#111111'];const bw=o.w/bands.length;for(let i=0;i<bands.length;i++){ctx.fillStyle=bands[i];ctx.fillRect(o.x+i*bw,o.y,bw,o.h);}ctx.strokeStyle='rgba(255,100,100,0.35)';ctx.lineWidth=2;for(let y=o.y;y<o.y+o.h;y+=8){ctx.beginPath();ctx.moveTo(o.x,y);ctx.bezierCurveTo(o.x+o.w*0.33,y+4,o.x+o.w*0.66,y-4,o.x+o.w,y);ctx.stroke();}ctx.restore();
      ctx.strokeStyle='rgba(255,180,180,0.6)';ctx.lineWidth=1.5;ctx.strokeRect(o.x,o.y,o.w,o.h);const nubY=fromFloor?o.y:o.y+o.h;ctx.fillStyle='#FF4466';ctx.beginPath();ctx.ellipse(cx,nubY,o.w/2+1,5,0,0,Math.PI*2);ctx.fill();

    } else if(o.ctype==='gummybear'){
      // SWAY — whole column sways side to side
      const sway=Math.sin(frameNum*0.11+ph)*2.5;
      const bearH=Math.min(30,o.h/Math.max(1,Math.floor(o.h/28)));
      const count=Math.floor(o.h/bearH);
      for(let i=0;i<count;i++){
        const by=o.y+i*bearH,bcy=by+bearH/2;
        // each bear sways with slight offset per index
        const bcx=cx+sway+Math.sin(frameNum*0.11+ph+i*0.7)*1.5;
        const br=bearH*0.32;
        const bg2=ctx.createRadialGradient(bcx-br*0.3,bcy-br*0.2,br*0.1,bcx,bcy,br*1.1);bg2.addColorStop(0,'rgba(255,255,255,0.7)');bg2.addColorStop(0.4,col);bg2.addColorStop(1,shadeCol(col,-40));
        ctx.fillStyle=bg2;ctx.beginPath();ctx.ellipse(bcx,bcy+br*0.1,br*0.72,br*0.9,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(bcx,bcy-br*0.62,br*0.58,br*0.62,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(bcx-br*0.38,bcy-br*1.1,br*0.22,br*0.24,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(bcx+br*0.38,bcy-br*1.1,br*0.22,br*0.24,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.arc(bcx-br*0.2,bcy-br*0.72,br*0.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bcx+br*0.2,bcy-br*0.72,br*0.1,0,Math.PI*2);ctx.fill();
      }
    } else {
      const jr=o.w*0.52,count=Math.max(1,Math.floor(o.h/(jr*1.8))),spacing=o.h/count;
      for(let i=0;i<count;i++){const jy=o.y+spacing*i+spacing/2;const rings=[shadeCol(col,40),col,shadeCol(col,-30),'#FFFFFF',shadeCol(col,20)];for(let ri=rings.length-1;ri>=0;ri--){ctx.fillStyle=rings[ri];ctx.beginPath();ctx.arc(cx,jy,jr*(0.4+ri*0.15),0,Math.PI*2);ctx.fill();}ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.ellipse(cx-jr*0.2,jy-jr*0.22,jr*0.28,jr*0.18,0,0,Math.PI*2);ctx.fill();}
    }
    ctx.restore();
  }
}

// ── GHOST ──
function drawGhost(){
  if(!ghostVisible||ghostData.length===0)return;
  const gy=ghostData[Math.min(frameNum,ghostData.length-1)];
  if(gy===undefined)return;
  const gcx=C.PLAYER_X+C.PLAYER_SIZE/2,gcy=gy+C.PLAYER_SIZE/2,r=C.PLAYER_SIZE/2;
  ctx.save();
  ctx.globalAlpha=0.3;
  // ghost orb
  const grd=ctx.createRadialGradient(gcx-3,gcy-3,2,gcx,gcy,r);
  grd.addColorStop(0,'rgba(255,255,255,0.9)');grd.addColorStop(1,'rgba(200,150,255,0.2)');
  ctx.fillStyle=grd;
  ctx.beginPath();ctx.arc(gcx,gcy,r,0,Math.PI*2);ctx.fill();
  // ghost outline
  ctx.strokeStyle='rgba(220,180,255,0.6)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(gcx,gcy,r,0,Math.PI*2);ctx.stroke();
  // tiny ghost eyes
  ctx.globalAlpha=0.22;ctx.fillStyle='#1A0030';
  const sq=gy<(C.H/2)?-1:1; // ceiling or floor
  ctx.beginPath();ctx.ellipse(gcx-r*0.28,gcy-2*sq,3,4,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(gcx+r*0.28,gcy-2*sq,3,4,0,0,Math.PI*2);ctx.fill();
  // "GHOST" label above
  ctx.globalAlpha=0.35;ctx.fillStyle='#CC88FF';ctx.font='bold 9px "Segoe UI",sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('LAST RUN',gcx,gy-4);
  ctx.restore();
}

// ── TUTORIAL ──
function drawTutorial(){
  if(tutorialAlpha<=0)return;
  const step=gameTime<2600?0:gameTime<5200?1:gameTime<7800?2:-1;
  if(step<0)return;
  const tips=[
    {icon:'👆',msg:'TAP TO FLIP!',sub:'Switch between floor & ceiling',col:'#FFFFFF'},
    {icon:'💀',msg:'DODGE CANDY BLOCKS!',sub:'Any block that hits you = dead',col:'#FF4466'},
    {icon:'✨',msg:'GRAB POWER-UPS!',sub:'Green glow = safe! Collect them!',col:'#00FF88'},
  ];
  const t=tips[step];
  const bounce=Math.sin(frameNum*0.22)*4;
  const bx=C.W/2,by=C.H/2+22+bounce;
  ctx.save();ctx.globalAlpha=tutorialAlpha;
  // pill background
  ctx.fillStyle='rgba(15,0,25,0.82)';rr(bx-115,by-30,230,56,16);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=5;rr(bx-115,by-30,230,56,16);ctx.stroke();
  ctx.strokeStyle=t.col;ctx.lineWidth=2;rr(bx-115,by-30,230,56,16);ctx.stroke();
  // headline
  ctx.font='bold 13px "Segoe UI",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=3;ctx.strokeText(t.icon+'  '+t.msg,bx,by-10);
  ctx.fillStyle=t.col;ctx.fillText(t.icon+'  '+t.msg,bx,by-10);
  // sub-text
  ctx.fillStyle='rgba(255,220,240,0.72)';
  ctx.font='10px "Segoe UI",sans-serif';ctx.fillText(t.sub,bx,by+10);
  // step dots
  for(let i=0;i<3;i++){
    ctx.fillStyle=i===step?t.col:'rgba(255,255,255,0.18)';
    ctx.beginPath();ctx.arc(bx+(i-1)*13,by+30,3.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawMagicalGirl(r,sq,tier,bc0,bc1,isDying){
  // ── BODY ──
  ctx.save();
  const grd=ctx.createRadialGradient(-r*0.3,-r*0.35,2,0,0,r*1.3);
  grd.addColorStop(0,'#FFFFFF');grd.addColorStop(0.35,bc0);grd.addColorStop(1,bc1);
  ctx.fillStyle=grd;ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=2;
  if(shieldActive){ctx.beginPath();ctx.arc(0,0,r*1.28,0,Math.PI*2);ctx.fill();ctx.stroke();}
  else if(magnetActive){ctx.beginPath();ctx.ellipse(0,0,r*1.35,r*0.78,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=bc1;ctx.beginPath();ctx.ellipse(-r*1.25,0,4,7,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(r*1.25,0,4,7,0,0,Math.PI*2);ctx.fill();}
  else if(slowmoActive){ctx.beginPath();ctx.ellipse(0,r*0.1,r*1.1,r*0.82,0,0,Math.PI*2);ctx.fill();ctx.stroke();}
  else if(multi2Active){ctx.beginPath();for(let i=0;i<8;i++){const ang=i*Math.PI/4-Math.PI/2,rd=i%2===0?r*1.2:r*0.85;i===0?ctx.moveTo(Math.cos(ang)*rd,Math.sin(ang)*rd):ctx.lineTo(Math.cos(ang)*rd,Math.sin(ang)*rd);}ctx.closePath();ctx.fill();ctx.stroke();}
  else{ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.stroke();}
  ctx.restore();

  // ── AHOGE (hair strand) ──
  if(!isDying){
    const ahogeWag=Math.sin(frameNum*0.18)*0.28;
    ctx.save();ctx.strokeStyle='#FF80C8';ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.translate(r*0.08,-r*0.95*sq);ctx.rotate(ahogeWag);
    ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(r*0.3,-r*0.5*sq,r*0.5,-r*0.9*sq,r*0.2,-r*1.1*sq);
    ctx.stroke();
    // little heart at tip
    ctx.fillStyle='#FF40A0';
    ctx.font='7px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('♥',r*0.2,-r*1.18*sq);
    ctx.restore();
  }

  // ── FACE ──
  const eyeY=-2*sq, mouthY=5*sq;
  const faceTier=isDying?'dead':tier;

  // rosy cheeks — bigger, more defined
  ctx.fillStyle='rgba(255,100,150,0.45)';
  ctx.beginPath();ctx.ellipse(-r*0.54,eyeY+5*sq,5.5,3,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(r*0.54,eyeY+5*sq,5.5,3,0,0,Math.PI*2);ctx.fill();
  // cheek sparkles
  ctx.fillStyle='rgba(255,180,210,0.7)';
  ctx.font='6px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('✦',-r*0.7,eyeY+7*sq);ctx.fillText('✦',r*0.7,eyeY+7*sq);

  if(faceTier==='dead'){
    // sparkle tears
    ctx.fillStyle='#88DDFF';ctx.font='8px sans-serif';ctx.textAlign='center';
    ctx.fillText('💧',-r*0.3,eyeY+6*sq);ctx.fillText('💧',r*0.3,eyeY+6*sq);
    // X eyes
    ctx.strokeStyle='#1A0030';ctx.lineWidth=2.2;ctx.lineCap='round';
    for(const ex of[-r*0.28,r*0.28]){ctx.beginPath();ctx.moveTo(ex-3.5,eyeY-3.5*sq);ctx.lineTo(ex+3.5,eyeY+3.5*sq);ctx.stroke();ctx.beginPath();ctx.moveTo(ex+3.5,eyeY-3.5*sq);ctx.lineTo(ex-3.5,eyeY+3.5*sq);ctx.stroke();}
    // spiral mouth
    ctx.strokeStyle='#CC0044';ctx.lineWidth=1.8;ctx.beginPath();
    for(let t=0;t<Math.PI*1.5;t+=0.1){const sr=t/3*4;ctx.lineTo(Math.cos(t)*sr,mouthY+Math.sin(t)*sr*0.4*sq);}ctx.stroke();

  } else if(faceTier===0){
    // dreamy star eyes
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.ellipse(-r*0.28,eyeY,5,6.5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.28,eyeY,5,6.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1A0030';
    ctx.beginPath();ctx.ellipse(-r*0.28,eyeY+0.5,3,4,0,0,Math.PI*2);ctx.fill();

    // gentle smile

    ctx.beginPath();ctx.moveTo(-5,mouthY);ctx.bezierCurveTo(-2,mouthY+4*sq,2,mouthY+4*sq,5,mouthY);ctx.stroke();

  } else if(faceTier===1){

    ctx.beginPath();ctx.ellipse(r*0.28,eyeY,5.5,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1A0030';
    ctx.beginPath();ctx.ellipse(-r*0.28,eyeY+0.5,3.2,4.5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.28,eyeY+0.5,3.2,4.5,0,0,Math.PI*2);ctx.fill();
    // heart pupils
    ctx.fillStyle='#FF6699';ctx.font='5px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('♥',-r*0.28,eyeY+0.8);ctx.fillText('♥',r*0.28,eyeY+0.8);
    // determined brows
    ctx.strokeStyle='#1A0030';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-r*0.48,eyeY-6*sq);ctx.lineTo(-r*0.1,eyeY-4*sq);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r*0.48,eyeY-6*sq);ctx.lineTo(r*0.1,eyeY-4*sq);ctx.stroke();
    ctx.strokeStyle='#CC4488';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(-5,mouthY);ctx.bezierCurveTo(-3,mouthY+3*sq,3,mouthY+3*sq,5,mouthY);ctx.stroke();
    // sweat drop
    ctx.fillStyle='#88DDFF';
    ctx.beginPath();ctx.moveTo(r*0.72,eyeY-r*0.3);ctx.bezierCurveTo(r*0.82,eyeY,r*0.9,eyeY+r*0.4,r*0.72,eyeY+r*0.45);ctx.bezierCurveTo(r*0.54,eyeY+r*0.4,r*0.62,eyeY,r*0.72,eyeY-r*0.3);ctx.fill();

  } else if(faceTier===2){
    // wide panic eyes
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.ellipse(-r*0.28,eyeY,6,8,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.28,eyeY,6,8,0,0,Math.PI*2);ctx.fill();
    const po=(Math.random()-0.5)*1.2;
    ctx.fillStyle='#1A0030';
    ctx.beginPath();ctx.arc(-r*0.28+po,eyeY+po,2.8,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(r*0.28+po,eyeY+po,2.8,0,Math.PI*2);ctx.fill();
    // star burst in eyes
    ctx.fillStyle='#FFFFFF';ctx.font='4px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('✦',-r*0.28+po,eyeY+po);ctx.fillText('✦',r*0.28+po,eyeY+po);
    ctx.strokeStyle='#1A0030';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-r*0.5,eyeY-8*sq);ctx.lineTo(-r*0.08,eyeY-5*sq);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r*0.08,eyeY-5*sq);ctx.lineTo(r*0.5,eyeY-8*sq);ctx.stroke();
    // open mouth with star
    ctx.fillStyle='#1A0030';ctx.beginPath();ctx.ellipse(0,mouthY+1*sq,5,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FF4488';ctx.beginPath();ctx.ellipse(0,mouthY+1*sq,3,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFFFFF';ctx.font='5px sans-serif';ctx.fillText('★',0,mouthY+1*sq);
    // multiple sweat drops
    ctx.fillStyle='#88DDFF';
    for(const[dx,dy]of[[-r*0.75,eyeY-2],[r*0.7,eyeY+2]]){ctx.beginPath();ctx.arc(dx,dy,2.5,0,Math.PI*2);ctx.fill();}

    ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.ellipse(-r*0.3,eyeY,6.5,8.5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.3,eyeY,6.5,8.5,0,0,Math.PI*2);ctx.fill();

    ctx.beginPath();ctx.ellipse(r*0.3,eyeY+1,2,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(-r*0.24,eyeY-1.5,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(r*0.36,eyeY-1.5,1.5,0,Math.PI*2);ctx.fill();
    // crisis brows
    ctx.strokeStyle='#1A0030';ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-r*0.55,eyeY-8*sq);ctx.lineTo(-r*0.05,eyeY-5*sq);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r*0.05,eyeY-5*sq);ctx.lineTo(r*0.55,eyeY-8*sq);ctx.stroke();

    ctx.fillStyle='#FF2266';ctx.beginPath();ctx.ellipse(0,mouthY+2*sq,4.5,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFFFFF';ctx.font='7px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,mouthY+2*sq);

    ctx.strokeStyle='rgba(255,200,240,0.35)';ctx.lineWidth=1;
    for(let i=0;i<8;i++){const la=i/8*Math.PI*2,ls=r*1.3,le=r*1.7;ctx.beginPath();ctx.moveTo(Math.cos(la)*ls,Math.sin(la)*ls);ctx.lineTo(Math.cos(la)*le,Math.sin(la)*le);ctx.stroke();}
  }

  // highlight gloss
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.ellipse(0,-r*0.55,r*0.42,r*0.2,0,0,Math.PI*2);ctx.fill();
}

function drawPlayer(){
  if(state===GS.DYING&&deathTimer<C.DEATH_DUR*0.6)return;
  const cx=C.PLAYER_X+C.PLAYER_SIZE/2,cy=playerY+C.PLAYER_SIZE/2,r=C.PLAYER_SIZE/2;
  const sq=gravDown?1:-1;
  const tier=speed<7?0:speed<9?1:speed<11.5?2:3;
  const shk=tier===3?(Math.random()-0.5)*3:0;
  const dyingAlpha=state===GS.DYING?Math.max(0,deathTimer/C.DEATH_DUR):1;
  const dyingScale=state===GS.DYING?1+(1-deathTimer/C.DEATH_DUR)*1.8:1;
  const bob=state===GS.DYING?0:Math.sin(frameNum*0.22)*2.8;

  // motion trail
  for(let ti=0;ti<playerTrail.length;ti++){
    const ta=(ti+1)/playerTrail.length*0.22;
    const trailX=cx-(playerTrail.length-ti)*4.5;
    const trailY=playerTrail[ti].y+C.PLAYER_SIZE/2+bob;
    const trailR=r*(0.45+ti/playerTrail.length*0.35);
    ctx.save();ctx.globalAlpha=ta;
    ctx.fillStyle=feverActive?`hsl(${(feverColor+ti*0.05)*360%360},100%,70%)`:'#FF80C8';
    ctx.beginPath();ctx.arc(trailX,trailY,trailR,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  const tilt=state===GS.DYING?0:gravDown?0.13:-0.13;
  ctx.save();ctx.globalAlpha=dyingAlpha;ctx.translate(cx+shk,cy+shk+bob);ctx.rotate(tilt);ctx.scale(squishX*dyingScale,squishY*dyingScale);

  if(chromaFrames>0){ctx.save();ctx.globalAlpha=0.4;ctx.fillStyle='#FF0000';ctx.beginPath();ctx.arc(-3,0,r-2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0000FF';ctx.beginPath();ctx.arc(3,0,r-2,0,Math.PI*2);ctx.fill();ctx.restore();}
  if(shieldActive){const p=0.7+0.3*Math.sin(frameNum*0.15);ctx.save();ctx.globalAlpha=0.4*p;ctx.strokeStyle='#00BFFF';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r+9,0,Math.PI*2);ctx.stroke();ctx.restore();}
  if(magnetActive){const p=0.5+0.5*Math.sin(frameNum*0.2);ctx.save();ctx.globalAlpha=0.35*p;ctx.strokeStyle='#CC00FF';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r+14,0,Math.PI*2);ctx.stroke();ctx.restore();}
  if(slowmoActive){const p=0.4+0.4*Math.sin(frameNum*0.1);ctx.save();ctx.globalAlpha=p;ctx.strokeStyle='#00FFD0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r+18,0,Math.PI*2);ctx.stroke();ctx.restore();}
  if(multi2Active){const p=0.5+0.5*Math.sin(frameNum*0.25);ctx.save();ctx.globalAlpha=0.45*p;ctx.strokeStyle='#FFD700';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r+11,0,Math.PI*2);ctx.stroke();ctx.restore();}
  if(feverActive){ctx.save();ctx.globalAlpha=0.5;const ag=ctx.createRadialGradient(0,0,r-4,0,0,r+12);ag.addColorStop(0,`hsl(${feverColor*360},100%,65%)`);ag.addColorStop(1,'transparent');ctx.fillStyle=ag;ctx.beginPath();ctx.arc(0,0,r+12,0,Math.PI*2);ctx.fill();ctx.restore();}

  const bc0=state===GS.DYING?'#FF8888':feverActive?`hsl(${feverColor*360},100%,70%)`:shieldActive?'#B3E8FF':magnetActive?'#E8B3FF':slowmoActive?'#B3FFE8':multi2Active?'#FFE87A':'#FFB3DE';
  const bc1=state===GS.DYING?'#FF2222':feverActive?`hsl(${feverColor*360},100%,45%)`:shieldActive?'#0080FF':magnetActive?'#9900CC':slowmoActive?'#00C9A0':multi2Active?'#FFB300':'#FF0080';

  drawMagicalGirl(r,sq,tier,bc0,bc1,state===GS.DYING);
  ctx.restore();
}

function drawCoins(){for(const cn of coins){if(cn.collected)continue;ctx.save();ctx.translate(cn.x,cn.y);ctx.rotate(cn.spin);const sx=Math.abs(Math.cos(cn.spin));ctx.scale(sx,1);const g=ctx.createRadialGradient(0,-2,1,0,0,9);g.addColorStop(0,'#FFFACD');g.addColorStop(0.5,'#FFD700');g.addColorStop(1,'#B8860B');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.5;ctx.stroke();ctx.save();ctx.scale(1/sx,1);ctx.fillStyle='rgba(0,0,0,0.5)';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,0);ctx.restore();ctx.restore();}}
function drawPowerups(){
  for(const pu of powerups){
    const m=PU_META[pu.type];const pulse=0.7+0.3*Math.sin(frameNum*0.18);
    ctx.save();ctx.translate(pu.x,pu.y);
    // safe green outer ring — signals "collect me!"
    ctx.strokeStyle=`rgba(100,255,160,${0.7*pulse})`;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,pu.r+8,0,Math.PI*2);ctx.stroke();
    // main orb
    ctx.rotate(pu.spin);
    const g=ctx.createRadialGradient(0,0,2,0,0,pu.r);
    g.addColorStop(0,'rgba(255,255,255,0.9)');g.addColorStop(1,m.col);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,pu.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.stroke();

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function ease(t,pow=3){return 1-Math.pow(1-Math.min(t,1),pow);}
function easeBack(t){const c=1.7;return 1+c*(Math.pow(t-1,3))+c*(Math.pow(t-1,2));}

function drawOverScreen(){
  overTimer+=1/60;
  const cx=C.W/2,aura=getAura(score);

  // dark overlay
  overlay(0.82);

  // ── CONFETTI PARTICLES ──
  ctx.save();
  for(const p of overParticles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.09;p.vx*=0.98;p.life-=p.decay;p.rot+=p.rotSpd;
    if(p.life<=0)continue;
    ctx.save();ctx.globalAlpha=p.life*0.9;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.col;
    if(p.shape===0){ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();}
    else if(p.shape===1){ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);}
    else{ctx.beginPath();ctx.moveTo(0,-p.r);ctx.lineTo(p.r*0.6,p.r*0.5);ctx.lineTo(-p.r*0.6,p.r*0.5);ctx.closePath();ctx.fill();}
    ctx.restore();
  }
  ctx.restore();

  const cy=C.H/2-20; // true center

  // ── GAME OVER TITLE — slams in ──
  const t0=ease(overTimer/0.5);

    ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=14;ctx.lineJoin='round';ctx.strokeText(Math.floor(score),0,0);ctx.strokeStyle='#FF8800';ctx.lineWidth=8;ctx.strokeText(Math.floor(score),0,0);

    ctx.restore();
  }


  if(overIsNewBest&&overTimer>0.55){

    if(isIridescent){
      const tg=ctx.createLinearGradient(cx-cardW/2+16,0,cx+cardW/2-16,0);
      for(let s=0;s<=1;s+=0.2)tg.addColorStop(s,`hsl(${((overTimer*80)+s*200)%360},100%,80%)`);
      ctx.fillStyle=tg;
    } else {ctx.fillStyle=auraCol;}
    ctx.fillText(labelText,cx,cardY+63);
    // keep grinding
    ctx.fillStyle='#FF6BBA';
    ctx.font='bold 9px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('keep grinding 👊',cx,cardY+78);
    ctx.restore();
  }

  // ── CANDY BUTTON — slides in at 1.1s ──
  if(overTimer>1.1){
    const t4=ease((overTimer-1.1)/0.4);
    const slideY=(1-t4)*40;
    const bw=210,bh=44,bx=cx-bw/2,by=cy+132+slideY;
    const pulse=0.88+0.12*Math.sin(overTimer*4);
    ctx.save();ctx.globalAlpha=t4;
    ctx.fillStyle='rgba(180,0,60,0.5)';rr(bx+4,by+6,bw,bh,22);ctx.fill();
    const bg=ctx.createLinearGradient(bx,by,bx,by+bh);
    bg.addColorStop(0,'#FF6BC4');bg.addColorStop(0.45,'#FF1493');bg.addColorStop(1,'#C0006A');
    ctx.fillStyle=bg;rr(bx,by,bw,bh,22);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.18)';rr(bx+10,by+5,bw-20,bh*0.38,12);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=5;rr(bx,by,bw,bh,22);ctx.stroke();
    ctx.strokeStyle='rgba(255,180,220,0.8)';ctx.lineWidth=2;rr(bx,by,bw,bh,22);ctx.stroke();
    ctx.font='bold 16px "Segoe UI",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=4;ctx.strokeText('▶  RUN IT BACK',cx,by+bh/2);
    ctx.fillStyle='#FFFFFF';ctx.fillText('▶  RUN IT BACK',cx,by+bh/2);

    // ── FOODSPOT RETRO PILL ──
    const pw=180,ph=28,px=cx-pw/2,py=by+bh+14;
    ctx.globalAlpha=t4*0.92;
    // pill bg — dark retro
    ctx.fillStyle='#0D0D1A';rr(px,py,pw,ph,14);ctx.fill();
    // retro scanline shimmer
    ctx.save();ctx.beginPath();rr(px,py,pw,ph,14);ctx.clip();
    for(let sy=py;sy<py+ph;sy+=3){ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(px,sy,pw,1.5);}
    ctx.restore();
    // pixel-style border — two tone
    ctx.strokeStyle='#C44EFF';ctx.lineWidth=1.5;
    rr(px,py,pw,ph,14);ctx.stroke();
    ctx.strokeStyle='rgba(196,78,255,0.25)';ctx.lineWidth=1;
    rr(px+2,py+2,pw-4,ph-4,12);ctx.stroke();
    // dot separators — pink
    ctx.fillStyle='#FF6BBA';
    ctx.beginPath();ctx.arc(px+14,py+ph/2,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(px+pw-14,py+ph/2,2,0,Math.PI*2);ctx.fill();
    // FOODSPOT — pink-to-purple gradient, MOBILE — soft white
    ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    const ftw=ctx.measureText('FOODSPOT').width;
    const mtw=ctx.measureText(' MOBILE').width;
    const fsG=ctx.createLinearGradient(cx-ftw,py,cx,py+ph);
    fsG.addColorStop(0,'#FF6BBA');fsG.addColorStop(1,'#C44EFF');
    ctx.fillStyle=fsG;ctx.fillText('FOODSPOT',cx-mtw/2,py+ph/2);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText(' MOBILE',cx+ftw/2,py+ph/2);

    ctx.restore();
  }
}

function render(){
  const shakeAmt=deathShake;
  const sx=shakeAmt?(Math.random()-0.5)*shakeAmt:0,sy=shakeAmt?(Math.random()-0.5)*shakeAmt:0;
  ctx.save();if(shakeAmt)ctx.translate(sx,sy);
  ctx.clearRect(-20,-20,C.W+40,C.H+40);
  drawBG();drawBgObjs();drawSpeedLines();drawLanes();
  if(state!==GS.START){
    drawObstacles();drawCoins();drawPowerups();
    drawGhost();drawPlayer();
    drawParticles();drawDeathParticles();drawFlares();drawShockwaves();drawPopups();
    if(state===GS.PLAY)drawTutorial();
  }
  ctx.restore();
  drawHUD();
  switch(state){case GS.START:drawStartScreen();break;case GS.COUNT:drawCountdown();break;case GS.PAUSE:drawPauseScreen();break;case GS.OVER:drawOverScreen();break;}

  if(flashFrames>0&&state!==GS.OVER){ctx.fillStyle=`rgba(255,230,245,${flashFrames/12*0.55})`;ctx.fillRect(0,0,C.W,C.H);}
  if(puFlashFrames>0&&state!==GS.OVER){ctx.save();ctx.globalAlpha=puFlashFrames/10*0.32;ctx.fillStyle=puFlashCol;ctx.fillRect(0,0,C.W,C.H);ctx.restore();}
}

function loop(ts){const dt=Math.min(ts-lastTime,50);lastTime=ts;if(state===GS.PLAY)frameNum++;update(dt);render();requestAnimationFrame(loop);}

resetGame();
loadHiScore().then(()=>{lastTime=performance.now();requestAnimationFrame(loop);if(autoStart){initAudio();startCount();}});
</script>
