<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BRICK BREAKER</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { position: fixed; overflow: hidden; width: 100%; height: 100%; background: #000; font-family: 'Press Start 2P', monospace; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
/* ============================================================
   BRICK BREAKER — Neon Arcade Edition  v3
   + Haptics, fighting-game combo, visual powerups,
     shockwaves, stage anim, bigger particles
   ============================================================ */

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTap = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTap < 300) e.preventDefault(); lastTap = n; }, false);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let DPR = 1;

let needsLayout = true;
function resizeCanvas() {
  const vp = window.visualViewport;
  const W = vp ? vp.width : window.innerWidth;
  const H = vp ? vp.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  needsLayout = true;
}
window.addEventListener('resize', resizeCanvas);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resizeCanvas);
  window.visualViewport.addEventListener('scroll', resizeCanvas);
}
resizeCanvas();

/* ---------- HAPTICS ---------- */
function haptic(type) {
  if (!navigator.vibrate) return;
  switch (type) {
    case 'paddle':  navigator.vibrate(12); break;
    case 'wall':    navigator.vibrate(6);  break;
    case 'brick':   navigator.vibrate(18); break;
    case 'explode': navigator.vibrate([30, 20, 50]); break;
    case 'powerup': navigator.vibrate([15, 20, 15]); break;
    case 'life':    navigator.vibrate([10, 15, 10, 15, 10]); break;
    case 'clear':   navigator.vibrate([20, 30, 20, 30, 60]); break;
    case 'gameover':navigator.vibrate([80, 40, 80, 40, 160]); break;
  }
}

/* ---------- AUDIO ---------- */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

(function() {
  var u = false;
  function unlock() { if (u) return; u = true; ensureAudio(); }
  canvas.addEventListener('touchstart', unlock, { passive: true, once: true });
  canvas.addEventListener('mousedown',  unlock, { once: true });
  canvas.addEventListener('click',      unlock, { once: true });
})();

function playTone(freq, type, duration, vol = 0.08) {
  if (!audioCtx) return;
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function sfx(name) {
  ensureAudio();
  switch (name) {
    case 'paddle':   playTone(440,'square',0.08,0.06); break;
    case 'wall':     playTone(220,'sine',0.1,0.05); break;
    case 'brick':    playTone(660+Math.random()*200,'square',0.12,0.07); break;
    case 'hard':     playTone(330,'sawtooth',0.15,0.06); break;
    case 'explode':  playTone(110,'sawtooth',0.3,0.1); break;
    case 'powerup':  playTone(880,'sine',0.2,0.08); setTimeout(()=>playTone(1100,'sine',0.2,0.08),100); break;
    case 'launch':   playTone(550,'square',0.15,0.06); break;
    case 'life':     playTone(523,'sine',0.3,0.08); setTimeout(()=>playTone(659,'sine',0.3,0.08),150); setTimeout(()=>playTone(784,'sine',0.4,0.08),300); break;
    case 'gameover': playTone(400,'sawtooth',0.4,0.1); setTimeout(()=>playTone(300,'sawtooth',0.4,0.1),200); setTimeout(()=>playTone(200,'sawtooth',0.6,0.1),400); break;
    case 'clear':    playTone(523,'sine',0.15,0.08); setTimeout(()=>playTone(659,'sine',0.15,0.08),150); setTimeout(()=>playTone(784,'sine',0.15,0.08),300); setTimeout(()=>playTone(1047,'sine',0.4,0.08),450); break;
    case 'shoot':    playTone(900,'square',0.08,0.04); break;
    case 'combo':    playTone(800+combo*20,'sine',0.1,0.06); break;
  }
}

/* ---------- BGM ---------- */
const bgm = new Audio('./bgm.mp3');
bgm.loop = true;
bgm.volume = 0.4;
bgm.preload = 'auto';
bgm.load();

function playBGM() { bgm.play().catch(()=>{}); }
function stopBGM() { bgm.pause(); bgm.currentTime = 0; }

/* ---------- VIRTUAL COORDS ---------- */
const VW = 1000;
let VH = 1500, S = 1;
const pf = { x: 20, y: 120, w: 960, h: 1250 };

/* ---------- STATE ---------- */
const STATE = { MENU:0, READY:1, PLAYING:2, PAUSED:3, STAGE_CLEAR:4, GAMEOVER:5 };
let state = STATE.MENU;
let score = 0, hi = 0, stage = 1, lives = 3, combo = 0, maxCombo = 0;
let blink = 0, shake = 0, stageClearT = 0;
let flashT = 0, flashColor = '#ffffff';
let last = null;

/* --- Fighting-game combo display --- */
let comboDisplay = { count: 0, timer: 0, maxTimer: 1.8, scale: 1 };

/* --- Stage clear animation --- */
let stageAnim = { timer: 0 };

const paddle = { cx:500, y:1300, w:180, h:24, baseW:180, sticky:false, laser:false, laserTimer:0 };
const balls=[], particles=[], powerups=[], projectiles=[], floaters=[], shockwaves=[], stars=[];
let bricks=[];

const ROW_COLORS=['#ff3b3b','#ff9b21','#ffe000','#35e85a','#28e0e0','#a371ff','#ff3b9a','#ff6b35','#00ffaa','#ff0055'];
const ROW_DARK  =['#c41e3a','#cc6600','#ccaa00','#228833','#1a8888','#663399','#cc0066','#cc4400','#00aa77','#aa0044'];

const POWERUP_TYPES=[
  {id:'multi', name:'MULTI', color:'#ff9b21',chance:0.03},
  {id:'wide',  name:'WIDE',  color:'#35e85a',chance:0.03},
  {id:'laser', name:'LASER', color:'#ff3b3b',chance:0.02},
  {id:'shield',name:'SHIELD',color:'#a371ff',chance:0.02},
  {id:'fire',  name:'FIRE',  color:'#ff3b9a',chance:0.04},
  {id:'bigball',name:'BIG',  color:'#28e0e0',chance:0.02},
  {id:'life',  name:'+LIFE', color:'#ffe000',chance:0.02},
];

let activePowerups={multi:false,wide:false,laser:false,shield:false,fire:false,bigball:false};
let powerupTimers={wide:0,laser:0,shield:0,fire:0,bigball:0};
let keys={};

/* ---------- COMBO LABEL ---------- */
function comboLabel(n) {
  if (n >= 20) return { text:'GODLIKE!', color:'#a371ff' };
  if (n >= 12) return { text:'INSANE!',  color:'#ff3b3b' };
  if (n >= 8)  return { text:'SICK!',    color:'#ff9b21' };
  if (n >= 5)  return { text:'NICE!',    color:'#ffe000' };
  if (n >= 3)  return { text:'',         color:'#ffffff' };
  return null;
}

/* ---------- INPUT ---------- */
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (['a','d','k',' ','p','arrowleft','arrowright'].includes(key)) e.preventDefault();
  if (key === 'arrowleft')       keys['a'] = true;
  else if (key === 'arrowright') keys['d'] = true;
  else keys[key] = true;
  if (key === 'k' || key === ' ' || key === 'enter') confirmAction();
  if (key === 'p' && (state === STATE.PLAYING || state === STATE.PAUSED)) togglePause();
});
document.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'arrowleft')       keys['a'] = false;
  else if (key === 'arrowright') keys['d'] = false;
  else keys[key] = false;
});

const DPAD_DIAG = {
  'dpad-up-left':    ['dpad-up', 'dpad-left'],
  'dpad-up-right':   ['dpad-up', 'dpad-right'],
  'dpad-down-left':  ['dpad-down', 'dpad-left'],
  'dpad-down-right': ['dpad-down', 'dpad-right'],
};

function handleHikariButton(type, button) {
  if (DPAD_DIAG[button]) { DPAD_DIAG[button].forEach(b => handleHikariButton(type, b)); return; }
  if (type === 'BUTTON_PRESS') {
    if      (button === 'dpad-left'  || button === 'left')  keys['a'] = true;
    else if (button === 'dpad-right' || button === 'right') keys['d'] = true;
    else if (button === 'a' || button === 'b') confirmAction();
    else if (button === 'start') {
      if (state === STATE.PLAYING || state === STATE.PAUSED) togglePause();
      else confirmAction();
    }
    else if (button === 'select') {
      if (state === STATE.PLAYING || state === STATE.PAUSED) togglePause();
    }
  } else if (type === 'BUTTON_RELEASE') {
    if      (button === 'dpad-left'  || button === 'left')  keys['a'] = false;
    else if (button === 'dpad-right' || button === 'right') keys['d'] = false;
  }
}

window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'AUDIO_UNLOCK' || d.type === 'AUDIO_RESUME') ensureAudio();
  const { type, button } = d;
  if (!button) return;
  handleHikariButton(type, button);
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / S;
  if (state === STATE.PLAYING || state === STATE.READY)
    paddle.cx = Math.max(pf.x+paddle.w/2, Math.min(pf.x+pf.w-paddle.w/2, mx));
});
canvas.addEventListener('click', () => confirmAction());
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.touches[0].clientX - rect.left) / S;
  if (state === STATE.PLAYING || state === STATE.READY)
    paddle.cx = Math.max(pf.x+paddle.w/2, Math.min(pf.x+pf.w-paddle.w/2, mx));
}, {passive:false});
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); confirmAction(); }, {passive:false});

/* ---------- LAYOUT ---------- */
function layout() {
  const cssW = parseFloat(canvas.style.width)  || window.innerWidth;
  const cssH = parseFloat(canvas.style.height) || window.innerHeight;
  S  = cssW / VW;
  VH = cssH / S;
  pf.h     = VH - pf.y - 20;
  paddle.y = pf.y + pf.h - 50;
}

/* ---------- GAME LOGIC ---------- */
function confirmAction() {
  ensureAudio();
  if      (state === STATE.MENU)        startGame();
  else if (state === STATE.READY)       launchBall();
  else if (state === STATE.STAGE_CLEAR) { stage++; loadStage(stage); }
  else if (state === STATE.GAMEOVER)    state = STATE.MENU;
}
function togglePause() {
  if      (state === STATE.PLAYING) state = STATE.PAUSED;
  else if (state === STATE.PAUSED)  state = STATE.PLAYING;
}
function startGame() {
  score=0; lives=3; stage=1; combo=0; maxCombo=0;
  hi = parseInt(localStorage.getItem('blocksmash_hi')||'0');
  resetPowerups(); loadStage(1);
  playBGM();
}
function resetPowerups() {
  activePowerups={multi:false,wide:false,laser:false,shield:false,fire:false,bigball:false};
  powerupTimers={wide:0,laser:0,shield:0,fire:0,bigball:0};
  paddle.w=paddle.baseW; paddle.laser=false;
}
function stageBallSpeed(){ return 680 + Math.min(stage-1, 9) * 40; }
function spawnBall(x,y,vx,vy,stuck=false) {
  const r = activePowerups.bigball ? 18 : 10;
  balls.push({x,y,vx,vy,r,speed:stageBallSpeed(),stuck,trail:[]});
}
function launchBall() {
  const b=balls.find(b=>b.stuck); if(!b) return;
  b.stuck=false;
  const ang=(-Math.PI/2)+(Math.random()*0.6-0.3);
  b.vx=Math.cos(ang)*b.speed; b.vy=Math.sin(ang)*b.speed;
  state=STATE.PLAYING; sfx('launch');
}

/* ---------- STAGE BUILDER ---------- */
const STAGE_LAYOUTS=[
  ()=>makeGrid(4,11,1,0,0),
  ()=>{const out=[];for(let r=0;r<7;r++){const cols=11-Math.abs(r-3),offset=(11-cols)*40;for(let c=0;c<cols;c++)out.push(makeBrick(50+offset+c*82,140+r*50,r));}return out;},
  ()=>{const out=[];for(let r=0;r<6;r++)for(let c=0;c<11;c++)if((r+c)%2===0)out.push(makeBrick(50+c*82,140+r*50,r,r<2?2:1));return out;},
  ()=>{const out=[];for(let r=0;r<5;r++)for(let c=0;c<11;c++){const ind=c===0||c===10||r===0;out.push(makeBrick(50+c*82,140+r*50,r,ind?999:1,ind));}return out;},
  ()=>{const out=[],centers=[[500,250],[500,400],[350,325],[650,325],[500,550],[350,475],[650,475]];for(const[cx,cy]of centers)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(Math.abs(dr)+Math.abs(dc)<=1)out.push(makeBrick(cx+dc*82-36,cy+dr*50,(dr+dc+5)%7,1));return out;},
  ()=>{const out=[];for(let r=0;r<8;r++)for(let c=0;c<11;c++)out.push(makeBrick(50+c*82,120+r*44,r,r>=5?2:1));return out;},
  ()=>{const out=[];for(let r=0;r<5;r++)for(let c=0;c<11;c++){const ex=r===2&&c>=4&&c<=6;out.push(makeBrick(50+c*82,140+r*50,r,ex?1:2,false,ex));}return out;},
  ()=>{const out=[];for(let r=0;r<5;r++)for(let c=0;c<11;c++)out.push(makeBrick(50+c*82,140+r*50,r,2,false,false,r===2));return out;},
  ()=>{const out=[];for(let r=0;r<9;r++)for(let c=0;c<12;c++)out.push(makeBrick(40+c*76,110+r*42,r%7,r<3?2:1));return out;},
  ()=>{const out=[];for(let r=0;r<7;r++)for(let c=0;c<11;c++){const center=r>=2&&r<=4&&c>=4&&c<=6,shield=!center&&r>=1&&r<=5&&c>=3&&c<=7;out.push(makeBrick(50+c*82,130+r*48,r,center?5:(shield?999:1),shield,false,false,center));}return out;},
];
function makeBrick(x,y,rowIdx,hp=1,indestruct=false,explosive=false,moving=false,isBoss=false){
  const ci=Math.min(9,rowIdx);
  return{x,y,w:72,h:38,hp,maxHp:hp,ci,alive:true,indestruct,explosive,moving,isBoss,baseX:x,moveDir:1,moveOffset:0,flash:0};
}
function makeGrid(rows,cols,hpBase,hpVar,startRow){
  const out=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
    out.push(makeBrick(50+c*82,140+(startRow+r)*50,startRow+r,hpBase+(Math.random()<hpVar?1:0)));
  return out;
}
function loadStage(n){
  bricks=[];balls.length=0;powerups.length=0;
  projectiles.length=0;particles.length=0;floaters.length=0;shockwaves.length=0;
  resetPowerups();
  const idx=Math.min(n-1,STAGE_LAYOUTS.length-1);
  bricks=STAGE_LAYOUTS[idx](n);
  if(n>STAGE_LAYOUTS.length){bricks=STAGE_LAYOUTS[STAGE_LAYOUTS.length-1](n);for(const b of bricks)if(!b.indestruct&&Math.random()<0.15)b.hp++;}
  state=STATE.READY; stageAnim.timer=0; flashT=0;
  spawnBall(paddle.cx,paddle.y-16,0,0,true); combo=0;
}

/* ---------- PARTICLES / FX ---------- */
const MAX_PARTICLES = 120;
function spawnParticles(x,y,color,count=8){
  const available = MAX_PARTICLES - particles.length;
  const n = Math.min(count, available);
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2;
    const spd=80+Math.random()*260;
    particles.push({
      x,y,
      vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      life:0.3+Math.random()*0.5, maxLife:0.7,
      color:Math.random()>0.3?color:'#ffffff',
      size:2+Math.random()*5,
      circle:Math.random()>0.4,
      rot:0
    });
  }
}
function spawnShockwave(x,y,color){
  shockwaves.push({x,y,r:0,life:1,color});
}
function spawnFloater(x,y,text,color){
  floaters.push({x,y,text,color,life:1.0,vy:-80});
}
function spawnPowerup(x,y){
  const pool=POWERUP_TYPES.filter(p=>Math.random()<p.chance);
  if(!pool.length) return;
  const type=pool[Math.floor(Math.random()*pool.length)];
  powerups.push({x,y,w:52,h:30,vy:110,type,color:type.color,pulse:0,trail:[],spawnT:0});
}

/* ---------- UPDATE ---------- */
function update(dt){
  blink+=dt;
  if(shake>0){shake-=dt*2.5;if(shake<0)shake=0;}
  if(flashT>0){flashT-=dt*3;if(flashT<0)flashT=0;}
  if(state===STATE.STAGE_CLEAR) stageClearT+=dt;

  // Combo display timer
  if(comboDisplay.timer>0){
    comboDisplay.timer-=dt;
    const elapsed=comboDisplay.maxTimer-comboDisplay.timer;
    comboDisplay.scale=elapsed<0.25 ? 1.6-(0.6*(elapsed/0.25)) : 1.0;
    if(comboDisplay.timer<0) comboDisplay.timer=0;
  }

  for(const k of Object.keys(powerupTimers)){
    if(powerupTimers[k]>0){
      powerupTimers[k]-=dt;
      if(powerupTimers[k]<=0){
        activePowerups[k]=false;
        if(k==='wide')   paddle.w=paddle.baseW;
        if(k==='laser')  paddle.laser=false;
        if(k==='bigball') for(const b of balls) b.r=10;
      }
    }
  }

  const paddleSpd=780;
  if(keys['a']) paddle.cx-=paddleSpd*dt;
  if(keys['d']) paddle.cx+=paddleSpd*dt;
  paddle.cx=Math.max(pf.x+paddle.w/2,Math.min(pf.x+pf.w-paddle.w/2,paddle.cx));

  if(state===STATE.READY){const b=balls[0];if(b){b.x=paddle.cx;b.y=paddle.y-b.r-4;}}
  if(state!==STATE.PLAYING) return;

  const timeScale=activePowerups.slow?0.5:1.0;
  const sdt=dt*timeScale;

  for(const b of bricks){
    if(b.moving&&b.alive){b.moveOffset+=b.moveDir*60*sdt;if(Math.abs(b.moveOffset)>60)b.moveDir*=-1;b.x=b.baseX+b.moveOffset;}
    if(b.flash>0) b.flash-=sdt;
  }

  // Shockwaves
  for(let i=shockwaves.length-1;i>=0;i--){
    const sw=shockwaves[i];
    sw.r+=400*sdt; sw.life-=sdt*2;
    if(sw.life<=0) shockwaves.splice(i,1);
  }

  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i];
    if(b.stuck) continue;
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>8) b.trail.shift();
    b.x+=b.vx*sdt; b.y+=b.vy*sdt;

    if(b.x-b.r<pf.x)        {b.x=pf.x+b.r;          b.vx= Math.abs(b.vx); sfx('wall'); haptic('wall'); shake+=0.1; spawnParticles(b.x,b.y,'#28e0e0',4);}
    if(b.x+b.r>pf.x+pf.w)   {b.x=pf.x+pf.w-b.r;     b.vx=-Math.abs(b.vx); sfx('wall'); haptic('wall'); shake+=0.1; spawnParticles(b.x,b.y,'#28e0e0',4);}
    if(b.y-b.r<pf.y)         {b.y=pf.y+b.r;           b.vy= Math.abs(b.vy); sfx('wall'); haptic('wall'); shake+=0.1; spawnParticles(b.x,b.y,'#28e0e0',4);}
    if(b.y-b.r>pf.y+pf.h)   {balls.splice(i,1); continue;}

    const px=paddle.cx-paddle.w/2,py=paddle.y;
    if(b.y+b.r>=py&&b.y-b.r<=py+paddle.h&&b.x>=px&&b.x<=px+paddle.w){
      if(b.vy>0){
        b.y=py-b.r;
        const hitPos=(b.x-paddle.cx)/(paddle.w/2);
        const angle=hitPos*(Math.PI/3);
        const spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        b.vx=Math.sin(angle)*spd; b.vy=-Math.cos(angle)*spd;
        sfx('paddle'); haptic('paddle');
        shake+=0.15; combo=0;
        comboDisplay.timer=0;
        spawnParticles(b.x,py,'#7df0ff',6);
        if(Math.abs(hitPos)<0.08){
          score+=15; spawnFloater(b.x,py-10,'PERFECT!','#ffe000');
          if(score>hi){hi=score;localStorage.setItem('blocksmash_hi',String(hi));}
        }
      }
    }

    for(const br of bricks){
      if(!br.alive) continue;
      if(!circleRect(b.x,b.y,b.r,br.x,br.y,br.w,br.h)) continue;
      if(br.indestruct){
        resolveCircleRect(b,br); sfx('hard'); shake+=0.12; br.flash=0.15;
      } else {
        br.hp--; br.flash=0.15;
        if(br.hp<=0){
          br.alive=false; combo++;
          if(combo>maxCombo) maxCombo=combo;
          const mult=1+Math.floor(combo/3);
          const pts=(br.isBoss?500:10)*mult;
          score+=pts;
          if(score>hi){hi=score;localStorage.setItem('blocksmash_hi',String(hi));}

          // More particles + shockwave
          spawnParticles(br.x+br.w/2,br.y+br.h/2,ROW_COLORS[br.ci],br.explosive?24:12);
          spawnShockwave(br.x+br.w/2,br.y+br.h/2,ROW_COLORS[br.ci]);
          spawnFloater(br.x+br.w/2,br.y,'+'+pts,ROW_COLORS[br.ci]);
          sfx(br.explosive?'explode':'brick');
          if(combo>=3) sfx('combo');
          haptic(br.explosive?'explode':'brick');
          shake+=br.explosive?0.4:0.2;

          // Update fighting-game combo display + milestones
          const milestones=[3,5,8,12,20];
          if(milestones.includes(combo)){
            spawnFloater(VW/2,VH*0.35,['','TRIPLE!','PENTA!','OCTUPLE!','BEAST!','GODLIKE!'][milestones.indexOf(combo)],'#ff9b21');
            shake+=0.3;
          }
          if(combo>=3){
            comboDisplay.count=combo;
            comboDisplay.timer=comboDisplay.maxTimer;
            comboDisplay.scale=1.6;
          }
          if(combo===20){ flashT=0.2; flashColor='#a371ff'; }

          if(br.explosive){
            for(const nb of bricks){
              if(!nb.alive||nb===br) continue;
              const dx=(nb.x+nb.w/2)-(br.x+br.w/2),dy=(nb.y+nb.h/2)-(br.y+br.h/2);
              if(Math.sqrt(dx*dx+dy*dy)<120){
                nb.alive=false;
                spawnParticles(nb.x+nb.w/2,nb.y+nb.h/2,ROW_COLORS[nb.ci],8);
                spawnShockwave(nb.x+nb.w/2,nb.y+nb.h/2,ROW_COLORS[nb.ci]);
                score+=20;
              }
            }
          }
          if(!br.isBoss) spawnPowerup(br.x+br.w/2,br.y+br.h/2);
        } else {
          resolveCircleRect(b,br); sfx('hard');
        }
        if(!activePowerups.fire) resolveCircleRect(b,br);
      }
    }
  }

  const breakable=bricks.filter(b=>b.alive&&!b.indestruct);
  if(breakable.length===0&&state===STATE.PLAYING){
    state=STATE.STAGE_CLEAR; stageClearT=0;
    sfx('clear'); haptic('clear');
    spawnParticles(VW/2,VH/2,'#ffe000',40);
    spawnShockwave(VW/2,VH/2,'#ffe000');
    flashT=0.25; flashColor='#ffe000';
  }
  if(balls.length===0&&state===STATE.PLAYING){
    if(activePowerups.shield){
      activePowerups.shield=false;
      powerupTimers.shield=0;
      spawnParticles(paddle.cx,paddle.y,'#a371ff',20);
      sfx('powerup');haptic('powerup');
      state=STATE.READY;spawnBall(paddle.cx,paddle.y-16,0,0,true);
    } else {
      lives--; combo=0; comboDisplay.timer=0;
      if(lives<=0){state=STATE.GAMEOVER;stopBGM();sfx('gameover');haptic('gameover');spawnParticles(paddle.cx,paddle.y,'#ff3b3b',30);}
      else{state=STATE.READY;spawnBall(paddle.cx,paddle.y-16,0,0,true);resetPowerups();}
    }
  }

  // Powerups — animated trail
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];
    p.pulse+=dt*5;
    p.spawnT=Math.min(0.3,(p.spawnT||0)+dt);
    p.y+=p.vy*sdt;
    // Spawn tiny sparkle trail
    if(Math.random()<0.15&&particles.length<MAX_PARTICLES) particles.push({x:p.x+(Math.random()-0.5)*20,y:p.y-10,vx:(Math.random()-0.5)*40,vy:-20-Math.random()*60,life:0.2+Math.random()*0.2,maxLife:0.3,color:p.color,size:1+Math.random()*2,circle:true,rot:0});
    if(p.y>VH){powerups.splice(i,1);continue;}
    if(rectRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h,paddle.cx-paddle.w/2,paddle.y,paddle.w,paddle.h)){
      applyPowerup(p.type); powerups.splice(i,1); sfx('powerup'); haptic('powerup');
      spawnFloater(p.x,p.y,p.type.name,p.color);
      spawnShockwave(p.x,p.y,p.color);
    }
  }

  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i]; pr.y-=600*sdt;
    if(pr.y<pf.y){projectiles.splice(i,1);continue;}
    let hit=false;
    for(const br of bricks){
      if(!br.alive||br.indestruct) continue;
      if(rectRect(pr.x-2,pr.y-6,4,12,br.x,br.y,br.w,br.h)){
        br.hp--;br.flash=0.15;
        if(br.hp<=0){br.alive=false;score+=10;spawnParticles(br.x+br.w/2,br.y+br.h/2,ROW_COLORS[br.ci],20);spawnShockwave(br.x+br.w/2,br.y+br.h/2,ROW_COLORS[br.ci]);spawnPowerup(br.x+br.w/2,br.y+br.h/2);}
        hit=true;break;
      }
    }
    if(hit){projectiles.splice(i,1);sfx('brick');}
  }

  if(paddle.laser){
    paddle.laserTimer-=dt;
    if(paddle.laserTimer<=0){
      projectiles.push({x:paddle.cx-paddle.w*0.3,y:paddle.y});
      projectiles.push({x:paddle.cx+paddle.w*0.3,y:paddle.y});
      paddle.laserTimer=0.25;sfx('shoot');
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*sdt;p.y+=p.vy*sdt;p.vy+=300*sdt;p.life-=sdt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.y+=f.vy*sdt;f.life-=sdt;
    if(f.life<=0)floaters.splice(i,1);
  }
}

function applyPowerup(type){
  switch(type.id){
    case 'multi':
      activePowerups.multi=true;
      for(let i=0;i<2;i++){const ang=Math.random()*Math.PI*2;spawnBall(paddle.cx,paddle.y-20,Math.cos(ang)*520,Math.sin(ang)*520);}
      setTimeout(()=>activePowerups.multi=false,100); break;
    case 'wide':   activePowerups.wide=true;  paddle.w=paddle.baseW*1.6; powerupTimers.wide=12; break;
    case 'laser':  activePowerups.laser=true; paddle.laser=true; paddle.laserTimer=0; powerupTimers.laser=10; break;
    case 'shield': activePowerups.shield=true; powerupTimers.shield=15; break;
    case 'fire':   activePowerups.fire=true;  powerupTimers.fire=8; break;
    case 'bigball': activePowerups.bigball=true; for(const b of balls) b.r=18; powerupTimers.bigball=10; sfx('powerup'); haptic('powerup'); break;
    case 'life':   lives++; sfx('life'); haptic('life'); break;
  }
}

/* ---------- COLLISION ---------- */
function circleRect(cx,cy,cr,rx,ry,rw,rh){
  const dx=cx-Math.max(rx,Math.min(cx,rx+rw)),dy=cy-Math.max(ry,Math.min(cy,ry+rh));
  return dx*dx+dy*dy<cr*cr;
}
function resolveCircleRect(b,r){
  const cx=Math.max(r.x,Math.min(b.x,r.x+r.w)),cy=Math.max(r.y,Math.min(b.y,r.y+r.h));
  const dx=b.x-cx,dy=b.y-cy;
  if(Math.abs(dx)>Math.abs(dy)){b.vx=-b.vx;b.x+=Math.sign(dx)*2;}
  else                          {b.vy=-b.vy;b.y+=Math.sign(dy)*2;}
}
function rectRect(x1,y1,w1,h1,x2,y2,w2,h2){return x1<x2+w2&&x1+w1>x2&&y1<y2+h2&&y1+h1>y2;}

/* ---------- DRAWING ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawBrick(b){
  if(!b.alive) return;
  const x=b.x*S,y=b.y*S,w=b.w*S,h=b.h*S;
  const col=b.flash>0?'#ffffff':ROW_COLORS[b.ci],dark=ROW_DARK[b.ci];
  ctx.save();
  if(b.indestruct){
    ctx.shadowColor='#888';ctx.shadowBlur=8*S;ctx.fillStyle='#333';rr(x,y,w,h,5*S);ctx.fill();
    ctx.strokeStyle='#666';ctx.lineWidth=2*S;ctx.stroke();
    ctx.fillStyle='#666';ctx.font=`${10*S}px 'Press Start 2P'`;ctx.textAlign='center';ctx.fillText('★',x+w/2,y+h/2+4*S);
  } else if(b.explosive){
    ctx.shadowColor='#ff3b3b';ctx.shadowBlur=10*S;
    const grd=ctx.createLinearGradient(0,y,0,y+h);grd.addColorStop(0,'#ff5555');grd.addColorStop(1,'#aa0000');
    ctx.fillStyle=grd;rr(x,y,w,h,5*S);ctx.fill();
    ctx.fillStyle='#ffaaaa';ctx.font=`${10*S}px 'Press Start 2P'`;ctx.textAlign='center';ctx.fillText('!',x+w/2,y+h/2+4*S);
  } else if(b.isBoss){
    const pulse=0.6+Math.sin(blink*4)*0.4;
    ctx.shadowColor='#ffe000';ctx.shadowBlur=(14+pulse*10)*S;
    const grd=ctx.createLinearGradient(0,y,0,y+h);grd.addColorStop(0,'#ffe066');grd.addColorStop(1,'#cc8800');
    ctx.fillStyle=grd;rr(x,y,w,h,5*S);ctx.fill();
    ctx.restore();
    ctx.strokeStyle='#ffe000';ctx.lineWidth=2*S;rr(x,y,w,h,5*S);ctx.stroke();
    ctx.fillStyle='#000';ctx.font=`${8*S}px 'Press Start 2P'`;ctx.textAlign='center';ctx.fillText(String(b.hp),x+w/2,y+h/2+3*S);
    const bw=w*0.9,bx=x+w*0.05,by=y-8*S;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(bx,by,bw,3*S);
    ctx.fillStyle='#ffe000';ctx.fillRect(bx,by,bw*Math.max(0,b.hp/b.maxHp),3*S);
    return;
  } else {
    const grd=ctx.createLinearGradient(0,y,0,y+h);grd.addColorStop(0,col);grd.addColorStop(1,dark);
    ctx.fillStyle=grd;rr(x,y,w,h,5*S);ctx.fill();
    ctx.restore();
    ctx.strokeStyle=col;ctx.lineWidth=1.5*S;rr(x,y,w,h,5*S);ctx.stroke();
    if(b.hp>1){ctx.fillStyle='#ffffff';ctx.font=`${8*S}px 'Press Start 2P'`;ctx.textAlign='center';ctx.fillText(String(b.hp),x+w/2,y+h/2+3*S);}
    return;
  }
  ctx.restore();
}

function drawPaddle(){
  const x=(paddle.cx-paddle.w/2)*S,y=paddle.y*S,w=paddle.w*S,h=paddle.h*S;
  ctx.save();
  let glow='#28e0e0';
  if(activePowerups.wide) glow='#35e85a';
  else if(activePowerups.laser) glow='#ff3b3b';
  else if(activePowerups.shield) glow='#a371ff';
  ctx.shadowColor=glow;ctx.shadowBlur=16*S;
  const cg=ctx.createLinearGradient(0,y,0,y+h);
  cg.addColorStop(0,paddle.sticky?'#c8a0ff':'#7df0ff');cg.addColorStop(1,paddle.sticky?'#663399':'#16a8c8');
  ctx.fillStyle=cg;rr(x,y,w,h,h/2);ctx.fill();ctx.restore();
  ctx.fillStyle='#ff9b21';rr(x,y,w*0.18,h,h/2);ctx.fill();rr(x+w-w*0.18,y,w*0.18,h,h/2);ctx.fill();
  if(paddle.laser){
    ctx.fillStyle='#ff3b3b';ctx.shadowColor='#ff3b3b';ctx.shadowBlur=10*S;
    ctx.fillRect(x+w*0.12,y-6*S,4*S,8*S);ctx.fillRect(x+w-w*0.12-4*S,y-6*S,4*S,8*S);ctx.shadowBlur=0;
  }
}

function drawBall(b){
  const bx=b.x*S,by=b.y*S,br=b.r*S;
  if(!b.stuck&&b.trail.length>1){
    for(let i=0;i<b.trail.length;i++){
      const t=b.trail[i],alpha=i/b.trail.length;
      ctx.fillStyle=`rgba(255,255,255,${alpha*0.35})`;
      ctx.beginPath();ctx.arc(t.x*S,t.y*S,br*alpha*0.7,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.save();
  ctx.shadowColor=activePowerups.fire?'#ff3b9a':'#ffffff';
  ctx.shadowBlur=activePowerups.fire?28*S:20*S;
  ctx.fillStyle=activePowerups.fire?'#ff3b9a':'#ffffff';
  ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();ctx.restore();
  if(activePowerups.fire){ctx.fillStyle='rgba(255,100,50,0.4)';ctx.beginPath();ctx.arc(bx,by,br*1.9,0,Math.PI*2);ctx.fill();}
}

function drawHUD(){
  const stats=[
    {l:'SCORE',v:String(score).padStart(7,'0'),c:'#ff9b21'},
    {l:'HIGH', v:String(hi).padStart(7,'0'),   c:'#ffe000'},
    {l:'LIVES',v:'♥'.repeat(Math.max(0,lives)),c:'#ff3b3b'},
    {l:'STAGE',v:String(stage).padStart(2,'0'),c:'#35e85a'},
  ];
  ctx.fillStyle='#ffffff';ctx.font=`bold ${16*S}px 'Press Start 2P'`;ctx.textAlign='center';
  const colW=VW/4;
  for(let i=0;i<4;i++){
    const cx=colW*(i+0.5);
    ctx.fillText(stats[i].l,cx*S,36*S);
    ctx.fillStyle=stats[i].c;ctx.font=`bold ${24*S}px 'Press Start 2P'`;
    ctx.fillText(stats[i].v,cx*S,72*S);
    ctx.fillStyle='#ffffff';ctx.font=`bold ${16*S}px 'Press Start 2P'`;
  }
  // HUD separator line
  ctx.strokeStyle='#28e0e0';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(pf.x*S,95*S);ctx.lineTo((pf.x+pf.w)*S,95*S);ctx.stroke();
}

function drawComboDisplay(){
  if(comboDisplay.timer<=0||comboDisplay.count<3) return;
  const info=comboLabel(comboDisplay.count);
  if(!info) return;
  const alpha=Math.min(1,comboDisplay.timer/0.5);
  const sc=comboDisplay.scale;
  const cx=VW/2*S, cy=(pf.y+pf.h*0.38)*S;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.textAlign='center';
  // Big hit number
  ctx.font=`${Math.round(72*sc*S)}px 'Press Start 2P'`;
  ctx.fillStyle=info.color;
  ctx.shadowColor=info.color;
  ctx.shadowBlur=30*S;
  ctx.fillText(comboDisplay.count,cx,cy);
  // HIT label
  ctx.font=`${Math.round(20*S)}px 'Press Start 2P'`;
  ctx.shadowBlur=12*S;
  ctx.fillText('HIT!',cx,cy+36*S);
  // Tier label
  if(info.text){
    ctx.font=`${Math.round(14*S)}px 'Press Start 2P'`;
    ctx.fillText(info.text,cx,cy+60*S);
  }
  ctx.restore();
}

function drawStars(){
  for(const s of stars){
    s.y+=s.spd*0.3;if(s.y>VH)s.y=0;
    const alpha=0.3+Math.sin(blink*s.spd*0.5)*0.2;
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.fillRect(s.x*S,s.y*S,s.size*S,s.size*S);
  }
}

function drawNeonGrid(){
  const rows=10, spacing=pf.h/rows;
  const scroll=(blink*12)%spacing;
  ctx.save();
  ctx.strokeStyle='rgba(40,224,224,0.06)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let r=0;r<=rows;r++){
    const y=(pf.y+r*spacing+scroll)*S;
    ctx.moveTo(pf.x*S,y);ctx.lineTo((pf.x+pf.w)*S,y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawScreenFlash(){
  if(flashT<=0) return;
  ctx.save();
  ctx.globalAlpha=flashT*0.5;
  ctx.fillStyle=flashColor;
  ctx.fillRect(0,0,VW*S,VH*S);
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    const alpha=p.life/p.maxLife;
    const col=p.color+Math.floor(alpha*255).toString(16).padStart(2,'0');
    ctx.fillStyle=col;
    if(p.circle){
      ctx.beginPath();ctx.arc(p.x*S,p.y*S,p.size*S*0.5,0,Math.PI*2);ctx.fill();
    } else {
      const sz=p.size*S*alpha;
      ctx.fillRect(p.x*S-sz/2,p.y*S-sz/2,sz,sz);
    }
  }
}

function drawShockwaves(){
  for(const sw of shockwaves){
    ctx.save();
    ctx.globalAlpha=sw.life*0.5;
    ctx.strokeStyle=sw.color;
    ctx.lineWidth=3*S;
    ctx.shadowColor=sw.color;ctx.shadowBlur=10*S;
    ctx.beginPath();ctx.arc(sw.x*S,sw.y*S,sw.r*S,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
}

function drawFloaters(){
  for(const f of floaters){
    ctx.fillStyle=f.color;ctx.globalAlpha=Math.max(0,f.life);
    ctx.font=`${13*S}px 'Press Start 2P'`;ctx.textAlign='center';
    ctx.fillText(f.text,f.x*S,f.y*S);ctx.globalAlpha=1;
  }
}

function drawPowerups(){
  for(const p of powerups){
    const pop=Math.min(1,(p.spawnT||0)/0.3);
    const scale=pop<1?(1.3-pop*0.3):1;
    const x=p.x*S,y=p.y*S,w=p.w*S,h=p.h*S;
    const glow=8+Math.sin(p.pulse)*5;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.globalAlpha=Math.min(1,pop*1.5);
    // Name ABOVE pill
    ctx.fillStyle=p.color;ctx.font=`bold ${13*S}px 'Press Start 2P'`;ctx.textAlign='center';
    ctx.shadowColor=p.color;ctx.shadowBlur=14*S;
    ctx.fillText(p.type.name,0,-h/2-12*S);
    ctx.shadowBlur=0;
    // Pill
    ctx.save();
    ctx.shadowColor=p.color;ctx.shadowBlur=glow*S*2;
    ctx.fillStyle=p.color;
    rr(-w/2,-h/2,w,h,h/2);ctx.fill();
    ctx.restore();
    // White inner pill shine
    ctx.save();
    ctx.globalAlpha=0.25;ctx.fillStyle='#fff';
    rr(-w/2+3*S,-h/2+3*S,w-6*S,h/2-2*S,h/4);ctx.fill();
    ctx.restore();
    // Down arrow indicator
    ctx.fillStyle=p.color;ctx.globalAlpha=0.6+Math.sin(p.pulse)*0.3;
    ctx.font=`${10*S}px sans-serif`;ctx.textAlign='center';ctx.fillText('▼',0,h/2+14*S);
    ctx.globalAlpha=1;
    ctx.restore();
  }
}

function drawProjectiles(){
  for(const pr of projectiles){
    ctx.fillStyle='#ff3b3b';ctx.shadowColor='#ff3b3b';ctx.shadowBlur=8*S;
    ctx.fillRect((pr.x-2)*S,(pr.y-6)*S,4*S,12*S);ctx.shadowBlur=0;
  }
}

function drawOverlay(){
  const W=VW*S,H=VH*S;

  if(state===STATE.MENU){
    ctx.fillStyle='rgba(5,5,16,0.85)';ctx.fillRect(0,0,W,H);
    // Animated background elements
    for(let i=0;i<4;i++){
      const x=(VW/5)*(i+0.5);const y=VH*0.25;
      const pulse=0.6+Math.sin(blink*2+i)*0.3;
      ctx.fillStyle=`rgba(40,224,224,${pulse*0.15})`;
      ctx.fillRect(x*S-20*S*pulse,y*S-20*S*pulse,40*S*pulse,40*S*pulse);
    }
    for(let i=0;i<3;i++){
      const x=(VW/4)*(i+0.5);const y=VH*0.8;
      const pulse=0.5+Math.sin(blink*1.5+i+2)*0.4;
      ctx.fillStyle=`rgba(255,155,33,${pulse*0.12})`;
      ctx.beginPath();ctx.arc(x*S,y*S,15*S*pulse,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#ffffff';ctx.font=`${52*S}px 'Press Start 2P'`;ctx.textAlign='center';
    ctx.shadowColor='#28e0e0';ctx.shadowBlur=20*S;
    ctx.fillText('BLOCK SMASH',VW/2*S,VH*0.35*S);ctx.shadowBlur=0;
    ctx.font=`${16*S}px 'Press Start 2P'`;ctx.fillStyle='#28e0e0';
    ctx.fillText('NEON ARCADE EDITION',VW/2*S,VH*0.42*S);
    if(Math.sin(blink*3)>-0.3){
      ctx.fillStyle='#ff9b21';ctx.font=`${24*S}px 'Press Start 2P'`;
      ctx.fillText('PRESS START / TAP',VW/2*S,VH*0.6*S);
    }
    ctx.fillStyle='#888';ctx.font=`${14*S}px 'Press Start 2P'`;
    ctx.fillText('← → MOVE    A LAUNCH',VW/2*S,VH*0.72*S);
    ctx.fillText('START / SELECT = PAUSE',VW/2*S,VH*0.76*S);
    if(hi>0){ctx.fillStyle='#ffe000';ctx.font=`${16*S}px 'Press Start 2P'`;ctx.fillText('HIGH SCORE: '+hi,VW/2*S,VH*0.85*S);}
    // FoodSpot branding
    ctx.fillStyle='#28e0e0';ctx.font=`${12*S}px 'Press Start 2P'`;ctx.textAlign='center';ctx.fillText('@foodspotmobile',VW/2*S,VH*0.94*S);
  }

  if(state===STATE.READY){
    if(Math.sin(blink*5)>-0.2){
      ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font=`${24*S}px 'Press Start 2P'`;ctx.textAlign='center';
      ctx.fillText('TAP / A TO LAUNCH',VW/2*S,VH*0.65*S);
    }
  }

  if(state===STATE.PAUSED){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff';ctx.font=`${42*S}px 'Press Start 2P'`;ctx.textAlign='center';
    ctx.shadowColor='#ffffff';ctx.shadowBlur=10*S;
    ctx.fillText('PAUSED',VW/2*S,VH*0.48*S);ctx.shadowBlur=0;
    ctx.font=`${12*S}px 'Press Start 2P'`;ctx.fillStyle='#28e0e0';
    ctx.fillText('START OR SELECT',VW/2*S,VH*0.56*S);
    ctx.fillText('TO RESUME',VW/2*S,VH*0.62*S);
  }

  if(state===STATE.STAGE_CLEAR){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    // Animated stage number zoom-in
    const t=Math.min(stageClearT/0.4,1);
    const sc=1+(1-t)*1.5;
    ctx.save();
    ctx.textAlign='center';
    ctx.globalAlpha=t;
    ctx.font=`${Math.round(48*sc*S)}px 'Press Start 2P'`;
    ctx.fillStyle='#ffe000';ctx.shadowColor='#ffe000';ctx.shadowBlur=24*S;
    ctx.fillText('STAGE CLEAR!',VW/2*S,VH*0.4*S);ctx.shadowBlur=0;
    if(stageClearT>0.5){
      const t2=Math.min((stageClearT-0.5)/0.4,1);
      ctx.globalAlpha=t2;
      ctx.font=`${20*S}px 'Press Start 2P'`;
      ctx.fillStyle='#35e85a';ctx.shadowColor='#35e85a';ctx.shadowBlur=16*S;
      ctx.fillText('STAGE '+(stage+1)+' INCOMING',VW/2*S,VH*0.52*S);ctx.shadowBlur=0;
    }
    if(stageClearT>1.2){
      ctx.globalAlpha=(Math.sin(blink*5)>-0.2)?0.9:0;
      ctx.fillStyle='#ffffff';ctx.font=`${18*S}px 'Press Start 2P'`;
      ctx.fillText('TAP / A FOR NEXT',VW/2*S,VH*0.63*S);
    }
    ctx.restore();
  }

  if(state===STATE.GAMEOVER){
    ctx.fillStyle='rgba(10,0,0,0.8)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff3b3b';ctx.font=`${56*S}px 'Press Start 2P'`;ctx.textAlign='center';
    ctx.shadowColor='#ff3b3b';ctx.shadowBlur=20*S;
    ctx.fillText('GAME OVER',VW/2*S,VH*0.38*S);ctx.shadowBlur=0;
    ctx.fillStyle='#ffffff';ctx.font=`${20*S}px 'Press Start 2P'`;
    ctx.fillText('SCORE: '+score,VW/2*S,VH*0.5*S);
    ctx.fillText('BEST COMBO: '+maxCombo,VW/2*S,VH*0.57*S);
    if(score>=hi&&score>0){ctx.fillStyle='#ffe000';ctx.fillText('NEW HIGH SCORE!',VW/2*S,VH*0.65*S);}
    ctx.fillStyle='#28e0e0';ctx.font=`${18*S}px 'Press Start 2P'`;
    ctx.fillText('TAP / START TO RETRY',VW/2*S,VH*0.76*S);
    // FoodSpot branding
    ctx.fillStyle='#28e0e0';ctx.font=`${12*S}px 'Press Start 2P'`;ctx.textAlign='center';ctx.fillText('@foodspotmobile',VW/2*S,VH*0.94*S);
  }
}

function draw(){
  const W=VW*S,H=VH*S;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  drawStars();

  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*shake*30*S,(Math.random()-0.5)*shake*30*S);}

  ctx.save();
  ctx.beginPath();ctx.rect(pf.x*S,pf.y*S,pf.w*S,pf.h*S);ctx.clip();
  drawNeonGrid();
  for(const b of bricks)  drawBrick(b);
  drawShockwaves();
  for(const b of balls)   drawBall(b);
  drawPaddle();drawProjectiles();drawPowerups();drawParticles();drawFloaters();
  drawComboDisplay();
  ctx.restore();

  ctx.restore();
  drawScreenFlash();
  drawHUD();
  drawOverlay();
}

/* ---------- LOOP ---------- */
function loop(ts){
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  if(dt>1/20) dt=1/20;
  if(needsLayout){ layout(); needsLayout=false; }
  update(dt); draw();
  requestAnimationFrame(loop);
}

/* ---------- INIT ---------- */
for(let i=0;i<80;i++)
  stars.push({x:Math.random()*VW,y:Math.random()*VH,size:1+Math.random()*2,spd:10+Math.random()*30});
hi=parseInt(localStorage.getItem('blocksmash_hi')||'0');
requestAnimationFrame(loop);
window.addEventListener('load',()=>window.parent.postMessage({type:'GAME_LOADED'},'*'));
</script>
