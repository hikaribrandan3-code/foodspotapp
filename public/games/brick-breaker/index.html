<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BRICK BREAKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{
  position:fixed;overflow:hidden;width:100%;height:100%;
  background:#000;display:flex;justify-content:center;align-items:center;
  font-family:'Press Start 2P','Courier New',monospace;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
}
canvas{display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ============ gesture / zoom guards ============ */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('gestureend',e=>e.preventDefault());
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
let lastTap=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<300)e.preventDefault();lastTap=n;},false);

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

/* ============ AUDIO ============ */
var audioCtx=null;var master=null;
function initAudio(){
  if(audioCtx)return;
  try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=0.35;master.connect(audioCtx.destination);}catch(e){}
}
function initAC(){initAudio();}
function resumeAudio(){if(audioCtx&&audioCtx.resume)audioCtx.resume();}
function blip(freq,dur,type,vol){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'square';o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.3,audioCtx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+(dur||0.08));
  o.connect(g);g.connect(master||audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+(dur||0.08)+0.02);
}
const Sound={
  paddle(){blip(420,0.06,'square',0.25);},
  wall(){blip(300,0.04,'square',0.18);},
  brick(combo){blip(500+Math.min(combo,12)*40,0.05,'square',0.22);},
  destroy(combo){blip(660+Math.min(combo,12)*55,0.08,'triangle',0.28);},
  lose(){blip(180,0.4,'sawtooth',0.3);setTimeout(()=>blip(120,0.5,'sawtooth',0.25),120);},
  clear(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.14,'square',0.28),i*90));},
  launch(){blip(700,0.07,'square',0.25);},
  over(){[400,330,260,160].forEach((f,i)=>setTimeout(()=>blip(f,0.22,'sawtooth',0.3),i*140));}
};
// HB unlock
(function(){var u=false;function unlock(){if(u)return;u=true;initAudio();resumeAudio();}
canvas.addEventListener('touchstart',unlock,{passive:true});canvas.addEventListener('mousedown',unlock);canvas.addEventListener('click',unlock);})();

/* ============ SIZING (virtual VW=1000) ============ */
const VW=1000;let VH=1500,S=1,DPR=1;
function resize(){
  const vp=window.visualViewport;
  const W=vp?vp.width:window.innerWidth;
  const H=vp?vp.height:window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S=W/VW;VH=H/S;
  layout();
}
window.addEventListener('resize',resize);
if(window.visualViewport){window.visualViewport.addEventListener('resize',resize);window.visualViewport.addEventListener('scroll',resize);}

/* ============ LAYOUT (virtual units) ============ */
const HUD_H=130, FI=14, SIDE_PAD=14, BRICK_TOP_PAD=78;
const COLS=11, ROWS=8, BGAP=8;
let pf={x:0,y:0,w:0,h:0};       // playfield rect
let brickW=70, brickH=34, brickOX=0, brickOY=0;
function layout(){
  pf.x=FI; pf.y=HUD_H; pf.w=VW-FI*2; pf.h=VH-HUD_H-FI;
  const areaW=pf.w-SIDE_PAD*2;
  brickW=(areaW-(COLS-1)*BGAP)/COLS;
  brickH=Math.min(34, brickW*0.42);
  brickOX=pf.x+SIDE_PAD;
  brickOY=pf.y+BRICK_TOP_PAD;
  // keep paddle anchored to bottom
  paddle.y=pf.y+pf.h-58;
  paddle.cx=Math.max(pf.x+paddle.w/2,Math.min(pf.x+pf.w-paddle.w/2,paddle.cx||(pf.x+pf.w/2)));
}

/* ============ COLORS ============ */
const ROW_COLORS=['#e84cff','#ff3b3b','#ff9b21','#ffe000','#35e85a','#28e0e0','#2b8bff','#9b5bff'];
const ROW_DARK  =['#7a1f88','#8a1f1f','#8a4f10','#8a7800','#1c7a30','#157a7a','#164a8a','#4f2f8a'];
const ROW_POINTS=[80,70,60,50,40,30,20,10];

/* ============ STATE ============ */
let state='start'; // start, ready, playing, life_lost, stage_clear, gameover
let score=0, hi=+(localStorage.getItem('bb_hi')||0), lives=3, stage=1;
let combo=0, maxCombo=0;
let bricks=[]; // {col,row,hp,maxHp,ci,pts,alive}
let move=0; // -1/0/1 dpad
let shake=0, flash=0, stageClearT=0, blink=0;

const paddle={cx:VW/2,y:0,w:150,h:22,speed:980};
const ball={x:VW/2,y:0,r:13,vx:0,vy:0,speed:480,stuck:true};
let trail=[];
let particles=[];
let popups=[];
let stars=[];

function initStars(){
  stars=[];
  for(let i=0;i<60;i++)stars.push({x:Math.random()*VW,y:Math.random()*VH,r:Math.random()*1.6+0.4,tw:Math.random()*Math.PI*2,sp:Math.random()*2+0.5});
}
initStars();

/* ============ STAGE PATTERNS ============ */
function baseSpeed(){return Math.min(480+(stage-1)*35,720);}
function loadStage(n){
  bricks=[];
  const hardChance=Math.min(0.05*(n-1),0.4);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let present=true;
      // pattern variety by stage
      const mod=(n-1)%4;
      if(mod===1){ // checker gaps
        if((r+c)%2===0 && r>1) present=false;
      }else if(mod===2){ // pyramid
        const mid=(COLS-1)/2; if(Math.abs(c-mid)>(ROWS-1-r)) present=false;
      }else if(mod===3){ // columns
        if(c%3===0 && r>0) present=false;
      }
      if(!present)continue;
      let hp=1,maxHp=1;
      if(n>1 && r<3 && Math.random()<hardChance){hp=2;maxHp=2;}
      bricks.push({col:c,row:r,hp:hp,maxHp:maxHp,ci:r,pts:ROW_POINTS[r],alive:true});
    }
  }
  resetBall();
}
function aliveBreakable(){return bricks.some(b=>b.alive);}

/* ============ BALL ============ */
function resetBall(){
  ball.stuck=true;ball.speed=baseSpeed();
  ball.x=paddle.cx;ball.y=paddle.y-ball.r-2;ball.vx=0;ball.vy=0;
  trail=[];combo=0;
  state='ready';
}
function launchBall(){
  if(!ball.stuck)return;
  ball.stuck=false;
  const ang=(-Math.PI/2)+(Math.random()*0.5-0.25);
  ball.vx=Math.cos(ang)*ball.speed;
  ball.vy=Math.sin(ang)*ball.speed;
  state='playing';
  Sound.launch();
}

/* ============ INPUT ============ */
function confirm(){
  initAudio();resumeAudio();
  if(state==='start'){startGame();}
  else if(state==='ready'){launchBall();}
  else if(state==='stage_clear'){stage++;loadStage(stage);}
  else if(state==='gameover'){startGame();}
}
function startGame(){
  score=0;lives=3;stage=1;combo=0;maxCombo=0;
  shake=0;flash=0;
  loadStage(stage);
}
function pointerToVX(clientX){
  const rect=canvas.getBoundingClientRect();
  return ((clientX-rect.left)/rect.width)*VW;
}
canvas.addEventListener('touchstart',e=>{
  initAudio();resumeAudio();
  if(state==='playing'||state==='ready'){
    const vx=pointerToVX(e.touches[0].clientX);
    paddle.cx=Math.max(pf.x+paddle.w/2,Math.min(pf.x+pf.w-paddle.w/2,vx));
  }
  if(state==='ready')launchBall();
  else if(state!=='playing')confirm();
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(state==='playing'||state==='ready'){
    const vx=pointerToVX(e.touches[0].clientX);
    paddle.cx=Math.max(pf.x+paddle.w/2,Math.min(pf.x+pf.w-paddle.w/2,vx));
    if(state==='ready'){ball.x=paddle.cx;}
  }
},{passive:true});
canvas.addEventListener('mousedown',e=>{
  initAudio();resumeAudio();
  if(state==='playing'||state==='ready'){paddle.cx=Math.max(pf.x+paddle.w/2,Math.min(pf.x+pf.w-paddle.w/2,pointerToVX(e.clientX)));}
  if(state==='ready')launchBall();else if(state!=='playing')confirm();
});

window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='AUDIO_UNLOCK'){initAudio();resumeAudio();return;}
  if(d.type==='AUDIO_RESUME'){resumeAudio();return;}
  if(d.type==='BUTTON_PRESS'){
    const b=d.button;
    if(b==='dpad-left'||b==='left')move=-1;
    if(b==='dpad-right'||b==='right')move=1;
    if(b==='a'||b==='A'||b==='start')confirm();
  }
  if(d.type==='BUTTON_RELEASE'){
    const b=d.button;
    if((b==='dpad-left'||b==='left')&&move===-1)move=0;
    if((b==='dpad-right'||b==='right')&&move===1)move=0;
  }
});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')move=-1;
  if(e.key==='ArrowRight')move=1;
  if(e.key===' '||e.key==='z'||e.key==='Z'||e.key==='Enter')confirm();
  if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'&&move===-1)move=0;
  if(e.key==='ArrowRight'&&move===1)move=0;
});

/* ============ FX ============ */
function burst(x,y,color,n){
  for(let i=0;i<(n||10);i++){
    const a=Math.random()*Math.PI*2,sp=Math.random()*260+80;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,size:Math.random()*5+2,color});
  }
  particles.push({ring:true,x,y,r:6,life:1,color});
}
function popup(x,y,text,color){popups.push({x,y,text,color,life:1});}

/* ============ COLLISION ============ */
function brickRect(b){
  return {x:brickOX+b.col*(brickW+BGAP),y:brickOY+b.row*(brickH+BGAP),w:brickW,h:brickH};
}
function hitBrick(b){
  if(b.hp>1){b.hp--;Sound.brick(combo);burst((brickOX+b.col*(brickW+BGAP))+brickW/2,(brickOY+b.row*(brickH+BGAP))+brickH/2,ROW_COLORS[b.ci],5);return;}
  b.alive=false;
  combo++;maxCombo=Math.max(maxCombo,combo);
  const mult=1+Math.floor(combo/4)*0.5;
  const pts=Math.round(b.pts*mult);
  score+=pts;
  const r=brickRect(b);
  burst(r.x+r.w/2,r.y+r.h/2,ROW_COLORS[b.ci],12);
  popup(r.x+r.w/2,r.y+r.h/2,'+'+pts,ROW_COLORS[b.ci]);
  Sound.destroy(combo);
  flash=Math.min(flash+0.15,0.5);
}

function stepBall(dt){
  const dist=ball.speed*dt;
  const steps=Math.max(1,Math.min(8,Math.ceil(dist/(ball.r*0.8))));
  const sdt=dt/steps;
  for(let s=0;s<steps;s++){
    ball.x+=ball.vx*sdt;ball.y+=ball.vy*sdt;
    // walls
    if(ball.x-ball.r<pf.x){ball.x=pf.x+ball.r;ball.vx=Math.abs(ball.vx);Sound.wall();}
    if(ball.x+ball.r>pf.x+pf.w){ball.x=pf.x+pf.w-ball.r;ball.vx=-Math.abs(ball.vx);Sound.wall();}
    if(ball.y-ball.r<pf.y){ball.y=pf.y+ball.r;ball.vy=Math.abs(ball.vy);Sound.wall();}
    // paddle
    if(ball.vy>0 && ball.y+ball.r>=paddle.y && ball.y+ball.r<=paddle.y+paddle.h+18 &&
       ball.x>=paddle.cx-paddle.w/2-ball.r && ball.x<=paddle.cx+paddle.w/2+ball.r){
      const rel=Math.max(-1,Math.min(1,(ball.x-paddle.cx)/(paddle.w/2)));
      const ang=rel*(Math.PI/3); // ±60°
      ball.speed=Math.min(ball.speed+6,baseSpeed()+120);
      ball.vx=Math.sin(ang)*ball.speed;
      ball.vy=-Math.cos(ang)*ball.speed;
      ball.y=paddle.y-ball.r-1;
      combo=0;
      Sound.paddle();
    }
    // bricks
    for(let i=0;i<bricks.length;i++){
      const b=bricks[i];if(!b.alive)continue;
      const r=brickRect(b);
      if(ball.x+ball.r<r.x||ball.x-ball.r>r.x+r.w||ball.y+ball.r<r.y||ball.y-ball.r>r.y+r.h)continue;
      // collided — resolve axis by overlap
      const ox=Math.min(ball.x+ball.r-r.x, r.x+r.w-(ball.x-ball.r));
      const oy=Math.min(ball.y+ball.r-r.y, r.y+r.h-(ball.y-ball.r));
      if(ox<oy){ball.vx=-ball.vx;ball.x+=ball.vx>0?ox:-ox;}
      else{ball.vy=-ball.vy;ball.y+=ball.vy>0?oy:-oy;}
      hitBrick(b);
      break;
    }
    // lost
    if(ball.y-ball.r>pf.y+pf.h){
      loseLife();return;
    }
  }
}
function loseLife(){
  lives--;shake=18;flash=0;combo=0;
  Sound.lose();
  if(lives<=0){
    state='gameover';
    if(score>hi){hi=score;localStorage.setItem('bb_hi',hi);}
    Sound.over();
  }else{
    state='life_lost';flash=0;
    setTimeout(()=>{resetBall();},700);
  }
}

/* ============ UPDATE ============ */
let last=0;
function update(dt){
  blink+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*40);
  if(flash>0)flash=Math.max(0,flash-dt*1.5);
  // stars
  for(const st of stars){st.tw+=dt*st.sp;}
  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    if(p.ring){p.r+=dt*420;p.life-=dt*2.2;if(p.life<=0)particles.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt*1.8;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=popups.length-1;i>=0;i--){const u=popups[i];u.y-=dt*60;u.life-=dt*1.2;if(u.life<=0)popups.splice(i,1);}

  if(state==='playing'||state==='ready'){
    if(move!==0){paddle.cx+=move*paddle.speed*dt;paddle.cx=Math.max(pf.x+paddle.w/2,Math.min(pf.x+pf.w-paddle.w/2,paddle.cx));}
    if(state==='ready'){ball.x=paddle.cx;ball.y=paddle.y-ball.r-2;}
  }
  if(state==='playing'){
    trail.push({x:ball.x,y:ball.y});if(trail.length>10)trail.shift();
    stepBall(dt);
    if(state==='playing'&&!aliveBreakable()){
      state='stage_clear';stageClearT=0;score+=100;Sound.clear();
    }
  }
  if(state==='stage_clear'){stageClearT+=dt;if(stageClearT>2.0){stage++;loadStage(stage);}}
}

/* ============ DRAW ============ */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){
  const W=VW*S,H=VH*S;
  ctx.save();
  // shake
  if(shake>0)ctx.translate((Math.random()-0.5)*shake*S,(Math.random()-0.5)*shake*S);

  // background gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b0b24');g.addColorStop(1,'#05050f');
  ctx.fillStyle=g;ctx.fillRect(-40,-40,W+80,H+80);

  // stars
  for(const st of stars){
    const a=0.4+Math.sin(st.tw)*0.4;
    ctx.globalAlpha=Math.max(0.05,a);
    ctx.fillStyle=Math.random()<0.5?'#ffffff':'#9fd8ff';
    ctx.beginPath();ctx.arc(st.x*S,st.y*S,st.r*S,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  // cyan plus sparkles
  ctx.strokeStyle='rgba(120,220,255,0.35)';ctx.lineWidth=1.5*S;
  for(let i=0;i<4;i++){const sx=(150+i*220)*S,sy=(220+((i*137)%600))*S,ps=6*S;ctx.beginPath();ctx.moveTo(sx-ps,sy);ctx.lineTo(sx+ps,sy);ctx.moveTo(sx,sy-ps);ctx.lineTo(sx,sy+ps);ctx.stroke();}

  drawHUD(W,H);

  // neon frame
  ctx.save();
  ctx.shadowColor='#28e0e0';ctx.shadowBlur=16*S;
  const fg=ctx.createLinearGradient(pf.x*S,0,(pf.x+pf.w)*S,0);
  fg.addColorStop(0,'#c46bff');fg.addColorStop(0.5,'#28e0e0');fg.addColorStop(1,'#c46bff');
  ctx.strokeStyle=fg;ctx.lineWidth=3*S;
  rr(pf.x*S,pf.y*S,pf.w*S,pf.h*S,14*S);ctx.stroke();
  ctx.restore();

  // clip playfield
  ctx.save();
  rr(pf.x*S+2,pf.y*S+2,pf.w*S-4,pf.h*S-4,12*S);ctx.clip();

  // bricks
  for(const b of bricks){if(!b.alive)continue;drawBrick(b);}

  // trail
  for(let i=0;i<trail.length;i++){
    const t=trail[i],a=(i/trail.length)*0.5;
    ctx.globalAlpha=a;ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(t.x*S,t.y*S,ball.r*S*(i/trail.length),0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  // particles
  for(const p of particles){
    if(p.ring){ctx.globalAlpha=Math.max(0,p.life);ctx.strokeStyle=p.color;ctx.lineWidth=3*S;ctx.beginPath();ctx.arc(p.x*S,p.y*S,p.r*S,0,7);ctx.stroke();continue;}
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x*S,p.y*S,p.size*S,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  // ball
  if(state!=='gameover'){
    ctx.save();ctx.shadowColor='#ffffff';ctx.shadowBlur=18*S;
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(ball.x*S,ball.y*S,ball.r*S,0,7);ctx.fill();
    ctx.restore();
  }

  // paddle
  drawPaddle();

  // popups
  for(const u of popups){
    ctx.globalAlpha=Math.max(0,u.life);
    ctx.fillStyle=u.color;ctx.font=`${18*S}px 'Press Start 2P',monospace`;ctx.textAlign='center';
    ctx.fillText(u.text,u.x*S,u.y*S);
  }
  ctx.globalAlpha=1;

  ctx.restore(); // unclip

  // combo indicator
  if(combo>=2&&state==='playing'){
    ctx.fillStyle='#ffe000';ctx.font=`${20*S}px 'Press Start 2P',monospace`;ctx.textAlign='center';
    ctx.save();ctx.shadowColor='#ff9b21';ctx.shadowBlur=10*S;
    ctx.fillText('COMBO x'+combo,(pf.x+pf.w/2)*S,(pf.y+pf.h-90)*S);ctx.restore();
  }

  // white flash on destroy
  if(flash>0){ctx.globalAlpha=flash*0.25;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}

  // overlays
  if(state==='start')drawStart(W,H);
  else if(state==='ready')drawReadyHint(W,H);
  else if(state==='stage_clear')drawStageClear(W,H);
  else if(state==='gameover')drawGameOver(W,H);

  ctx.restore();
}

function txt(s,x,y,size,color,glow){
  ctx.font=`${size*S}px 'Press Start 2P',monospace`;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  if(glow){ctx.save();ctx.shadowColor=glow;ctx.shadowBlur=14*S;}
  ctx.fillStyle=color;ctx.fillText(s,x*S,y*S);
  if(glow)ctx.restore();
}

function drawHUD(W,H){
  const stats=[
    {l:'SCORE',v:String(score).padStart(6,'0'),c:'#ff9b21'},
    {l:'HIGH', v:String(hi).padStart(6,'0'),  c:'#ffe000'},
    {l:'LIVES',v:null,c:'#ff3b3b'},
    {l:'STAGE',v:String(stage).padStart(2,'0'),c:'#35e85a'},
    {l:'LEVEL',v:(1+Math.floor((stage-1)/4))+'-'+(1+((stage-1)%4)),c:'#28e0e0'},
  ];
  const colW=VW/5;
  for(let i=0;i<5;i++){
    const cx=colW*(i+0.5);
    ctx.fillStyle='#ffffff';ctx.font=`${15*S}px 'Press Start 2P',monospace`;ctx.textAlign='center';
    ctx.fillText(stats[i].l,cx*S,42*S);
    if(stats[i].l==='LIVES'){
      const hs=14;const startX=cx-(3*hs+2*4)/2+hs/2;
      for(let h=0;h<3;h++){
        const hx=(startX+h*(hs+4))*S,hy=70*S;
        ctx.fillStyle=h<lives?'#ff3b3b':'#3a1414';
        drawHeart(hx,hy,hs*S);
      }
    }else{
      ctx.fillStyle=stats[i].c;ctx.font=`${20*S}px 'Press Start 2P',monospace`;
      ctx.save();ctx.shadowColor=stats[i].c;ctx.shadowBlur=8*S;
      ctx.fillText(stats[i].v,cx*S,80*S);ctx.restore();
    }
  }
}
function drawHeart(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s/16,s/16);
  ctx.beginPath();ctx.moveTo(0,4);
  ctx.bezierCurveTo(-2,-2,-9,-2,-9,4);ctx.bezierCurveTo(-9,9,-3,12,0,15);
  ctx.bezierCurveTo(3,12,9,9,9,4);ctx.bezierCurveTo(9,-2,2,-2,0,4);
  ctx.closePath();ctx.fill();ctx.restore();
}

function drawBrick(b){
  const r=brickRect(b);
  const x=r.x*S,y=r.y*S,w=r.w*S,h=r.h*S;
  const col=ROW_COLORS[b.ci], dark=ROW_DARK[b.ci];
  ctx.save();
  ctx.shadowColor=col;ctx.shadowBlur=6*S;
  // fill
  const grd=ctx.createLinearGradient(0,y,0,y+h);
  grd.addColorStop(0,col);grd.addColorStop(1,dark);
  ctx.fillStyle=grd;rr(x,y,w,h,5*S);ctx.fill();
  ctx.restore();
  // border
  ctx.strokeStyle=col;ctx.lineWidth=2*S;rr(x,y,w,h,5*S);ctx.stroke();
  // top highlight
  ctx.fillStyle='rgba(255,255,255,0.35)';rr(x+3*S,y+3*S,w-6*S,h*0.28,3*S);ctx.fill();
  // crack on damaged 2-hp
  if(b.maxHp>1&&b.hp<b.maxHp){
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1.5*S;
    ctx.beginPath();ctx.moveTo(x+w*0.3,y);ctx.lineTo(x+w*0.45,y+h*0.5);ctx.lineTo(x+w*0.3,y+h);ctx.stroke();
  }
}

function drawPaddle(){
  const x=(paddle.cx-paddle.w/2)*S,y=paddle.y*S,w=paddle.w*S,h=paddle.h*S,cap=w*0.22;
  ctx.save();ctx.shadowColor='#28e0e0';ctx.shadowBlur=12*S;
  // center cyan
  const cg=ctx.createLinearGradient(0,y,0,y+h);cg.addColorStop(0,'#7df0ff');cg.addColorStop(1,'#16a8c8');
  ctx.fillStyle=cg;rr(x,y,w,h,h/2);ctx.fill();
  ctx.restore();
  // orange caps
  ctx.fillStyle='#ff9b21';rr(x,y,cap,h,h/2);ctx.fill();rr(x+w-cap,y,cap,h,h/2);ctx.fill();
  // highlight
  ctx.fillStyle='rgba(255,255,255,0.4)';rr(x+4*S,y+3*S,w-8*S,h*0.3,h*0.15);ctx.fill();
}

function dim(W,H,a){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);}

function drawStart(W,H){
  dim(W,H,0.55);
  txt('BRICK',VW/2,VH*0.30,58,'#ffffff','#28e0e0');
  txt('BREAKER',VW/2,VH*0.30+78,58,'#ffe000','#ff9b21');
  // rainbow underline bricks
  for(let i=0;i<7;i++){const bw=70,x=VW/2-(7*bw)/2+i*bw;ctx.fillStyle=ROW_COLORS[i];rr((x+4)*S,(VH*0.30+108)*S,(bw-8)*S,14*S,4*S);ctx.fill();}
  if(Math.sin(blink*4)>-0.2)txt('PRESS START',VW/2,VH*0.60,22,'#35e85a','#35e85a');
  txt('TAP / A TO PLAY',VW/2,VH*0.60+44,15,'#9fd8ff');
  txt('DPAD / DRAG TO MOVE',VW/2,VH*0.72,13,'#888');
}
function drawReadyHint(W,H){
  if(Math.sin(blink*5)>-0.2)txt('TAP / A TO LAUNCH',VW/2,VH*0.66,16,'#ffffff','#28e0e0');
}
function drawStageClear(W,H){
  dim(W,H,0.5);
  txt('STAGE CLEAR!',VW/2,VH*0.42,34,'#35e85a','#35e85a');
  txt('+100 BONUS',VW/2,VH*0.42+50,18,'#ffe000');
  txt('NEXT STAGE...',VW/2,VH*0.56,14,'#9fd8ff');
}
function drawGameOver(W,H){
  dim(W,H,0.62);
  txt('GAME OVER',VW/2,VH*0.34,40,'#ff3b3b','#ff3b3b');
  txt('SCORE',VW/2,VH*0.48,16,'#ffffff');
  txt(String(score).padStart(6,'0'),VW/2,VH*0.48+38,26,'#ff9b21','#ff9b21');
  txt('HIGH '+String(hi).padStart(6,'0'),VW/2,VH*0.60,16,'#ffe000');
  if(Math.sin(blink*4)>-0.2)txt('TAP / A TO RETRY',VW/2,VH*0.72,16,'#35e85a','#35e85a');
}

/* ============ LOOP ============ */
function loop(ts){
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>1/30)dt=1/30;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
</script>
