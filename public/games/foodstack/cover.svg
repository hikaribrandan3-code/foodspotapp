<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#132038"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <!-- playfield -->
  <g>
    <rect x="90" y="60" width="220" height="300" fill="rgba(255,255,255,0.03)"/>
    <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
      <line x1="112" y1="60" x2="112" y2="360"/>
      <line x1="134" y1="60" x2="134" y2="360"/>
      <line x1="156" y1="60" x2="156" y2="360"/>
      <line x1="178" y1="60" x2="178" y2="360"/>
      <line x1="200" y1="60" x2="200" y2="360"/>
      <line x1="222" y1="60" x2="222" y2="360"/>
      <line x1="244" y1="60" x2="244" y2="360"/>
      <line x1="266" y1="60" x2="266" y2="360"/>
      <line x1="288" y1="60" x2="288" y2="360"/>
      <line x1="90" y1="140" x2="310" y2="140"/>
      <line x1="90" y1="184" x2="310" y2="184"/>
      <line x1="90" y1="228" x2="310" y2="228"/>
      <line x1="90" y1="272" x2="310" y2="272"/>
      <line x1="90" y1="316" x2="310" y2="316"/>
    </g>

    <!-- stacked blocks bottom -->
    <g stroke="rgba(0,0,0,0.4)" stroke-width="1">
      <rect x="90" y="316" width="22" height="44" fill="#00F0FF"/>
      <rect x="112" y="316" width="22" height="44" fill="#FFD500"/>
      <rect x="134" y="272" width="22" height="88" fill="#7B2FD9"/>
      <rect x="156" y="272" width="22" height="88" fill="#7B2FD9"/>
      <rect x="178" y="316" width="22" height="44" fill="#22C55E"/>
      <rect x="200" y="272" width="22" height="88" fill="#EF4444"/>
      <rect x="222" y="272" width="22" height="88" fill="#3B82F6"/>
      <rect x="244" y="316" width="22" height="44" fill="#3B82F6"/>
      <rect x="266" y="228" width="22" height="132" fill="#FB5607"/>
      <rect x="288" y="316" width="22" height="44" fill="#FFD500"/>
    </g>

    <!-- falling I piece, cyan, glowing -->
    <g filter="url(#glow)">
      <rect x="178" y="76" width="22" height="22" fill="#00F0FF"/>
      <rect x="178" y="98" width="22" height="22" fill="#00F0FF"/>
      <rect x="178" y="120" width="22" height="22" fill="#00F0FF"/>
      <rect x="178" y="142" width="22" height="22" fill="#00F0FF"/>
    </g>
    <!-- ghost -->
    <g opacity="0.22">
      <rect x="178" y="228" width="22" height="22" fill="#00F0FF"/>
      <rect x="178" y="250" width="22" height="22" fill="#00F0FF"/>
    </g>

    <rect x="90" y="60" width="220" height="300" fill="none" stroke="#00F0FF" stroke-width="3">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- sparkles -->
  <g fill="#fff" opacity="0.5">
    <circle cx="55" cy="90" r="2"/>
    <circle cx="345" cy="130" r="1.6"/>
    <circle cx="60" cy="300" r="1.6"/>
    <circle cx="335" cy="300" r="2"/>
  </g>
</svg>
