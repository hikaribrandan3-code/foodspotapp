<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hot Dog Dash</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; }
        #gameCanvas { background: linear-gradient(90deg, #87CEEB 0%, #E0F6FF 100%); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 10px; left: 10px; color: #333; font-weight: bold; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; text-align: center; color: white; display: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div id="ui">SCORE: <span id="score">0</span> | SPEED: <span id="speed">1</span>x</div>
    <div id="gameOver">
        <h2 style="color: #F43F5E;">SPLAT!</h2>
        <button onclick="resetGame()" style="background: #F43F5E; border: none; padding: 10px 20px; color: white; border-radius: 5px; cursor: pointer;">DASH AGAIN</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'playing';
let score = 0;
let speed = 1;
let dog = { x: 50, y: 200, vy: 0, jumping: false };
let obstacles = [];
let condiments = [];

class Obstacle {
    constructor() {
        this.x = 500;
        this.y = 230;
        this.width = 40;
        this.height = 50;
        this.emoji = ['🥫', '🌶️', '🧅'][Math.floor(Math.random() * 3)];
    }
    update() { this.x -= 4 * speed; }
    draw() { ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.fillText(this.emoji, this.x, this.y); }
}

class Condiment {
    constructor() {
        this.x = 500;
        this.y = Math.random() * 150 + 50;
        this.emoji = ['🍅', '🧈', '🥒'][Math.floor(Math.random() * 3)];
        this.collected = false;
    }
    update() { this.x -= 4 * speed; }
    draw() { if (!this.collected) { ctx.font = '30px Arial'; ctx.textAlign = 'center'; ctx.fillText(this.emoji, this.x, this.y); } }
}

function jump() {
    if (!dog.jumping) {
        dog.vy = -12;
        dog.jumping = true;
    }
}

function gameLoop() {
    if (gameState === 'paused') return;
    
    ctx.clearRect(0, 0, 480, 320);
    
    // Ground
    ctx.fillStyle = '#D4A574';
    ctx.fillRect(0, 260, 480, 60);
    ctx.fillStyle = '#8B4513';
    for (let x = 0; x < 480; x += 40) {
        ctx.fillRect(x, 260, 2, 60);
    }
    
    // Dog physics
    dog.vy += 0.6;
    dog.y += dog.vy;
    if (dog.y >= 230) {
        dog.y = 230;
        dog.vy = 0;
        dog.jumping = false;
    }
    
    // Draw dog
    ctx.font = '50px Arial';
    ctx.textAlign = 'center';
    ctx.save();
    ctx.translate(dog.x, dog.y);
    if (dog.jumping) ctx.rotate(-0.3);
    ctx.fillText('🌭', 0, 0);
    ctx.restore();
    
    // Update obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].update();
        obstacles[i].draw();
        
        if (Math.abs(obstacles[i].x - dog.x) < 30 && Math.abs(obstacles[i].y - dog.y) < 30) {
            gameOver();
        }
        
        if (obstacles[i].x < -50) {
            obstacles.splice(i, 1);
            score += 10;
            document.getElementById('score').textContent = score;
            window.parent.postMessage({ type: 'SCORE', score: score }, '*');
        }
    }
    
    // Update condiments
    for (let i = condiments.length - 1; i >= 0; i--) {
        condiments[i].update();
        condiments[i].draw();
        
        if (!condiments[i].collected && Math.abs(condiments[i].x - dog.x) < 30 && Math.abs(condiments[i].y - dog.y) < 30) {
            condiments[i].collected = true;
            score += 50;
        }
        
        if (condiments[i].x < -50) condiments.splice(i, 1);
    }
    
    // Speed up
    speed = 1 + score / 500;
    document.getElementById('speed').textContent = speed.toFixed(1);
    
    requestAnimationFrame(gameLoop);
}

function spawnObstacle() {
    if (gameState !== 'playing') return;
    obstacles.push(new Obstacle());
    setTimeout(spawnObstacle, 1500 + Math.random() * 1000);
}

function spawnCondiment() {
    if (gameState !== 'playing') return;
    condiments.push(new Condiment());
    setTimeout(spawnCondiment, 2000 + Math.random() * 2000);
}

function gameOver() {
    gameState = 'gameover';
    document.getElementById('gameOver').style.display = 'block';
    window.parent.postMessage({ type: 'GAME_OVER', score: score }, '*');
}

function resetGame() {
    score = 0;
    speed = 1;
    obstacles = [];
    condiments = [];
    dog = { x: 50, y: 200, vy: 0, jumping: false };
    gameState = 'playing';
    document.getElementById('gameOver').style.display = 'none';
    document.getElementById('score').textContent = score;
    spawnObstacle();
    spawnCondiment();
}

// Controls
canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
document.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });

// PostMessage API
window.addEventListener('message', (e) => {
    switch(e.data.type) {
        case 'BUTTON_PRESS':
            if (e.data.button === 'a' || e.data.button === 'start') jump();
            if (e.data.button === 'select') window.parent.postMessage({ type: 'GAME_EXIT', gameId: 'hotdog-dash' }, '*');
            break;
        case 'PAUSE': gameState = 'paused'; break;
        case 'RESUME': gameState = 'playing'; gameLoop(); break;
        case 'SAVE_STATE': localStorage.setItem('hotdogDash_state', JSON.stringify({score})); break;
        case 'LOAD_STATE':
            const saved = localStorage.getItem('hotdogDash_state');
            if (saved) { score = JSON.parse(saved).score; }
            break;
    }
});

spawnObstacle();
spawnCondiment();
gameLoop();
</script>
</body>
</html>
