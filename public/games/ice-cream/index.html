<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Cone - Balance & Match-3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 480px;
            height: 320px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 182, 193, 0.5);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        #pauseMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        #pauseMenu.visible {
            display: flex;
        }
        .menuBtn {
            padding: 12px 30px;
            font-size: 18px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            border: 3px solid #ffb6c1;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .menuBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #ff69b4;
        }
        .menuTitle {
            color: #ffb6c1;
            font-size: 32px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
        <div id="pauseMenu">
            <div class="menuTitle">PAUSED</div>
            <button class="menuBtn" id="resumeBtn">RESUME</button>
            <button class="menuBtn" id="muteBtn">MUTE: OFF</button>
            <button class="menuBtn" id="backBtn">BACK TO SELECTOR</button>
        </div>
    </div>

    <script>
        // ============================================
        // ICE CREAM CONE - Balance & Match-3 Game
        // ============================================
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pauseMenu = document.getElementById('pauseMenu');
        
        // Game Constants
        const GAME_WIDTH = 480;
        const GAME_HEIGHT = 320;
        const CONE_WIDTH = 40;
        const CONE_HEIGHT = 60;
        const SCOOP_RADIUS = 18;
        const GRAVITY = 0.3;
        const MAX_TILT = 0.5; // radians (~28 degrees)
        const MATCH_DISTANCE = SCOOP_RADIUS * 2.2;
        
        // Flavor colors
        const FLAVORS = {
            vanilla: { color: '#FFF8DC', outline: '#DEB887', name: 'vanilla' },
            chocolate: { color: '#8B4513', outline: '#5D3A1A', name: 'chocolate' },
            strawberry: { color: '#FFB6C1', outline: '#FF69B4', name: 'strawberry' },
            mint: { color: '#98FB98', outline: '#3CB371', name: 'mint' }
        };
        const FLAVOR_KEYS = Object.keys(FLAVORS);
        
        // Game State
        let gameState = 'playing'; // playing, paused, gameover
        let score = 0;
        let highScore = 0;
        let stackHeight = 0;
        let maxStackHeight = 0;
        
        // Physics
        let cone = {
            x: GAME_WIDTH / 2,
            y: GAME_HEIGHT - 40,
            angle: 0,
            angularVelocity: 0,
            tilt: 0 // -1 to 1 (left to right)
        };
        
        let scoops = [];
        let fallingScoop = null;
        let particles = [];
        let floatingTexts = [];
        
        // Power-ups
        let superCatchActive = false;
        let superCatchTimer = 0;
        let lickCooldown = 0;
        
        // Input
        const inputState = {
            LEFT: false,
            RIGHT: false,
            L: false,
            R: false,
            A: false,
            B: false,
            START: false
        };
        
        // Audio
        let audioMuted = false;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Background music oscillator
        let bgmOscillator = null;
        let bgmGain = null;
        
        // ============================================
        // AUDIO SYSTEM
        // ============================================
        
        function playSound(type) {
            if (audioMuted) return;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            const now = audioContext.currentTime;
            
            switch(type) {
                case 'plop':
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                    
                case 'match':
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.type = 'sine';
                    osc.start(now);
                    osc.stop(now + 0.3);
                    // Harmony
                    const osc2 = audioContext.createOscillator();
                    const gain2 = audioContext.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioContext.destination);
                    osc2.frequency.setValueAtTime(600, now);
                    osc2.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                    gain2.gain.setValueAtTime(0.2, now);
                    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc2.type = 'sine';
                    osc2.start(now);
                    osc2.stop(now + 0.3);
                    break;
                    
                case 'lick':
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(500, now + 0.1);
                    osc.frequency.linearRampToValueAtTime(200, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.type = 'triangle';
                    osc.start(now);
                    osc.stop(now + 0.25);
                    break;
                    
                case 'warning':
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(250, now + 0.1);
                    osc.frequency.linearRampToValueAtTime(300, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.1, now + 0.1);
                    gain.gain.linearRampToValueAtTime(0.2, now + 0.2);
                    osc.type = 'square';
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                    
                case 'gameover':
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 1);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
                    osc.type = 'sawtooth';
                    osc.start(now);
                    osc.stop(now + 1.5);
                    break;
                    
                case 'supercatch':
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1000, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.type = 'sine';
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
            }
        }
        
        function startBGM() {
            if (audioMuted || bgmOscillator) return;
            
            bgmOscillator = audioContext.createOscillator();
            bgmGain = audioContext.createGain();
            bgmOscillator.connect(bgmGain);
            bgmGain.connect(audioContext.destination);
            
            bgmOscillator.type = 'triangle';
            bgmGain.gain.value = 0.05;
            
            // Simple melody
            let noteIndex = 0;
            const notes = [262, 294, 330, 349, 330, 294, 262, 196];
            
            function playNote() {
                if (!bgmOscillator || audioMuted) return;
                const freq = notes[noteIndex % notes.length];
                bgmOscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
                noteIndex++;
                setTimeout(playNote, 250);
            }
            
            bgmOscillator.start();
            playNote();
        }
        
        function stopBGM() {
            if (bgmOscillator) {
                try {
                    bgmOscillator.stop();
                } catch(e) {}
                bgmOscillator = null;
            }
        }
        
        // ============================================
        // GAME OBJECTS
        // ============================================
        
        class Scoop {
            constructor(x, y, flavor, isFalling = false) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = isFalling ? 2 : 0;
                this.flavor = flavor;
                this.radius = SCOOP_RADIUS;
                this.landed = !isFalling;
                this.isFalling = isFalling;
                this.wobble = Math.random() * Math.PI * 2;
            }
            
            update() {
                if (this.isFalling) {
                    this.vy += GRAVITY;
                    this.y += this.vy;
                    this.wobble += 0.1;
                    
                    // Horizontal movement from D-pad
                    if (inputState.LEFT) this.x -= 3;
                    if (inputState.RIGHT) this.x += 3;
                    
                    // Keep in bounds
                    this.x = Math.max(this.radius, Math.min(GAME_WIDTH - this.radius, this.x));
                }
            }
            
            draw(ctx) {
                const flavor = FLAVORS[this.flavor];
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(this.x + 3, this.y + 5, this.radius * 0.8, this.radius * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Scoop body
                ctx.fillStyle = flavor.color;
                ctx.strokeStyle = flavor.outline;
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                // Slightly irregular circle for ice cream look
                for (let i = 0; i <= 20; i++) {
                    const angle = (i / 20) * Math.PI * 2;
                    const r = this.radius + Math.sin(angle * 5 + this.wobble) * 2;
                    const px = this.x + Math.cos(angle) * r;
                    const py = this.y + Math.sin(angle) * r * 0.9;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.ellipse(this.x - 5, this.y - 5, 6, 4, -0.3, 0, Math.PI * 2);
                ctx.fill();
                
                // Sprinkles for variety
                if (this.flavor === 'strawberry' || this.flavor === 'vanilla') {
                    ctx.fillStyle = this.flavor === 'strawberry' ? '#FF1493' : '#FF6347';
                    for (let i = 0; i < 5; i++) {
                        const sx = this.x + Math.cos(i * 1.3) * 8;
                        const sy = this.y + Math.sin(i * 1.7) * 6;
                        ctx.fillRect(sx, sy, 2, 2);
                    }
                }
            }
        }
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6 - 2;
                this.life = 1;
                this.color = color;
                this.size = Math.random() * 6 + 3;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life -= 0.025;
                this.size *= 0.98;
            }
            
            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.life = 1;
                this.vy = -1;
            }
            
            update() {
                this.y += this.vy;
                this.life -= 0.02;
            }
            
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.font = 'bold 20px "Comic Sans MS", cursive';
                ctx.textAlign = 'center';
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1;
            }
        }
        
        // ============================================
        // GAME FUNCTIONS
        // ============================================
        
        function spawnFallingScoop() {
            const flavor = FLAVOR_KEYS[Math.floor(Math.random() * FLAVOR_KEYS.length)];
            fallingScoop = new Scoop(GAME_WIDTH / 2, 30, flavor, true);
        }
        
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        function checkMatches() {
            const toRemove = new Set();
            
            // Check each scoop for matches
            for (let i = 0; i < scoops.length; i++) {
                const scoop1 = scoops[i];
                const matches = [i];
                
                for (let j = i + 1; j < scoops.length; j++) {
                    const scoop2 = scoops[j];
                    const dx = scoop1.x - scoop2.x;
                    const dy = scoop1.y - scoop2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < MATCH_DISTANCE && scoop1.flavor === scoop2.flavor) {
                        matches.push(j);
                    }
                }
                
                if (matches.length >= 3) {
                    matches.forEach(idx => toRemove.add(idx));
                }
            }
            
            if (toRemove.size > 0) {
                // Calculate score
                const matchCount = toRemove.size;
                const points = matchCount * 100 * Math.floor(matchCount / 3);
                score += points;
                reportScore(score);
                
                // Create effects
                const avgX = Array.from(toRemove).reduce((sum, idx) => sum + scoops[idx].x, 0) / matchCount;
                const avgY = Array.from(toRemove).reduce((sum, idx) => sum + scoops[idx].y, 0) / matchCount;
                
                floatingTexts.push(new FloatingText(avgX, avgY - 30, `+${points}`, '#FFD700'));
                
                // Remove matched scoops
                const removedScoops = [];
                for (let i = scoops.length - 1; i >= 0; i--) {
                    if (toRemove.has(i)) {
                        const scoop = scoops.splice(i, 1)[0];
                        removedScoops.push(scoop);
                        createExplosion(scoop.x, scoop.y, FLAVORS[scoop.flavor].color);
                    }
                }
                
                playSound('match');
                
                // Recalculate stack height
                recalculateStackHeight();
            }
        }
        
        function recalculateStackHeight() {
            stackHeight = scoops.length;
            if (stackHeight > maxStackHeight) {
                maxStackHeight = stackHeight;
            }
        }
        
        function landScoop(scoop) {
            scoop.isFalling = false;
            scoop.landed = true;
            scoop.vy = 0;
            
            // Adjust position based on cone tilt
            const tiltOffset = Math.sin(cone.angle) * 30;
            scoop.x = Math.max(scoop.radius, Math.min(GAME_WIDTH - scoop.radius, scoop.x + tiltOffset * 0.3));
            
            scoops.push(scoop);
            stackHeight++;
            if (stackHeight > maxStackHeight) maxStackHeight = stackHeight;
            
            playSound('plop');
            checkMatches();
            
            // Update cone physics based on weight
            updateConePhysics();
            
            // Spawn new falling scoop
            setTimeout(spawnFallingScoop, 500);
        }
        
        function updateConePhysics() {
            // Calculate center of mass
            let totalWeight = 1; // cone itself
            let weightedX = cone.x;
            
            scoops.forEach(scoop => {
                totalWeight += 0.5;
                weightedX += (scoop.x - cone.x) * 0.1;
            });
            
            // Apply tilt force
            const centerOffset = (weightedX - cone.x) / 100;
            cone.angularVelocity += centerOffset * 0.01;
            
            // Apply player tilt
            if (inputState.L) cone.tilt = -1;
            else if (inputState.R) cone.tilt = 1;
            else cone.tilt *= 0.9;
            
            cone.angularVelocity += cone.tilt * 0.002;
            
            // Damping
            cone.angularVelocity *= 0.95;
            
            // Update angle
            cone.angle += cone.angularVelocity;
            
            // Limit angle
            if (cone.angle > MAX_TILT) {
                cone.angle = MAX_TILT;
                cone.angularVelocity = 0;
            } else if (cone.angle < -MAX_TILT) {
                cone.angle = -MAX_TILT;
                cone.angularVelocity = 0;
            }
            
            // Warning sound near limits
            if (Math.abs(cone.angle) > MAX_TILT * 0.7 && Math.random() < 0.05) {
                playSound('warning');
            }
            
            // Game over if too tilted
            if (Math.abs(cone.angle) >= MAX_TILT * 0.95) {
                gameOver();
            }
        }
        
        function useSuperCatch() {
            if (superCatchActive) return;
            
            superCatchActive = true;
            superCatchTimer = 180; // 3 seconds at 60fps
            playSound('supercatch');
            
            floatingTexts.push(new FloatingText(GAME_WIDTH / 2, 80, 'SUPER CATCH!', '#00FF00'));
        }
        
        function useLick() {
            if (lickCooldown > 0 || scoops.length === 0) return;
            
            // Remove top scoop
            const topScoop = scoops.pop();
            createExplosion(topScoop.x, topScoop.y, FLAVORS[topScoop.flavor].color);
            playSound('lick');
            
            floatingTexts.push(new FloatingText(topScoop.x, topScoop.y, 'LICK!', '#FF69B4'));
            
            lickCooldown = 120; // 2 seconds cooldown
            recalculateStackHeight();
            updateConePhysics();
        }
        
        function gameOver() {
            gameState = 'gameover';
            playSound('gameover');
            stopBGM();
            
            if (score > highScore) {
                highScore = score;
            }
            
            saveGameState();
        }
        
        function resetGame() {
            gameState = 'playing';
            score = 0;
            stackHeight = 0;
            maxStackHeight = 0;
            
            cone.angle = 0;
            cone.angularVelocity = 0;
            cone.tilt = 0;
            
            scoops = [];
            particles = [];
            floatingTexts = [];
            
            superCatchActive = false;
            superCatchTimer = 0;
            lickCooldown = 0;
            
            spawnFallingScoop();
            startBGM();
        }
        
        // ============================================
        // RENDERING
        // ============================================
        
        function drawBackground() {
            // Ice cream shop background
            const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            gradient.addColorStop(0, '#FFB6C1');
            gradient.addColorStop(0.5, '#FFC0CB');
            gradient.addColorStop(1, '#FFF0F5');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // Shop stripes
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < GAME_WIDTH; i += 40) {
                ctx.fillRect(i, 0, 20, GAME_HEIGHT);
            }
            
            // Floor
            ctx.fillStyle = '#DEB887';
            ctx.fillRect(0, GAME_HEIGHT - 30, GAME_WIDTH, 30);
            
            // Floor pattern
            ctx.fillStyle = '#D2691E';
            for (let i = 0; i < GAME_WIDTH; i += 30) {
                ctx.fillRect(i, GAME_HEIGHT - 30, 15, 30);
            }
        }
        
        function drawCone() {
            ctx.save();
            ctx.translate(cone.x, cone.y);
            ctx.rotate(cone.angle);
            
            // Cone shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(5, CONE_HEIGHT / 2 + 5, CONE_WIDTH / 2, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Cone body (waffle pattern)
            ctx.fillStyle = '#F4A460';
            ctx.beginPath();
            ctx.moveTo(-CONE_WIDTH / 2, -CONE_HEIGHT / 2);
            ctx.lineTo(CONE_WIDTH / 2, -CONE_HEIGHT / 2);
            ctx.lineTo(0, CONE_HEIGHT / 2);
            ctx.closePath();
            ctx.fill();
            
            // Waffle grid pattern
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 1;
            for (let i = 1; i < 5; i++) {
                const y = -CONE_HEIGHT / 2 + (i * CONE_HEIGHT / 5);
                const widthAtY = CONE_WIDTH * (1 - i / 5);
                ctx.beginPath();
                ctx.moveTo(-widthAtY / 2, y);
                ctx.lineTo(widthAtY / 2, y);
                ctx.stroke();
            }
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 6, -CONE_HEIGHT / 2);
                ctx.lineTo(0, CONE_HEIGHT / 2);
                ctx.stroke();
            }
            
            // Cone outline
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-CONE_WIDTH / 2, -CONE_HEIGHT / 2);
            ctx.lineTo(CONE_WIDTH / 2, -CONE_HEIGHT / 2);
            ctx.lineTo(0, CONE_HEIGHT / 2);
            ctx.closePath();
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawTiltIndicator() {
            const indicatorX = GAME_WIDTH - 50;
            const indicatorY = 50;
            const radius = 25;
            
            // Background
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.arc(indicatorX, indicatorY, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Center line
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(indicatorX, indicatorY - radius);
            ctx.lineTo(indicatorX, indicatorY + radius);
            ctx.stroke();
            
            // Tilt marker
            const tiltAngle = cone.angle / MAX_TILT * (Math.PI / 3);
            const markerX = indicatorX + Math.sin(tiltAngle) * radius * 0.7;
            const markerY = indicatorY + Math.cos(tiltAngle) * radius * 0.7;
            
            const warning = Math.abs(cone.angle) > MAX_TILT * 0.7;
            ctx.fillStyle = warning ? '#FF0000' : '#00FF00';
            ctx.beginPath();
            ctx.arc(markerX, markerY, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Warning glow
            if (warning) {
                ctx.shadowColor = '#FF0000';
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }
        
        function drawHeightMeter() {
            const meterX = 20;
            const meterY = 50;
            const meterWidth = 15;
            const meterHeight = 100;
            
            // Background
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(meterX, meterY, meterWidth, meterHeight);
            
            // Fill
            const fillHeight = (stackHeight / 20) * meterHeight;
            const gradient = ctx.createLinearGradient(0, meterY + meterHeight, 0, meterY);
            gradient.addColorStop(0, '#00FF00');
            gradient.addColorStop(0.5, '#FFFF00');
            gradient.addColorStop(1, '#FF0000');
            ctx.fillStyle = gradient;
            ctx.fillRect(meterX, meterY + meterHeight - fillHeight, meterWidth, fillHeight);
            
            // Border
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.strokeRect(meterX, meterY, meterWidth, meterHeight);
            
            // Label
            ctx.fillStyle = '#FFF';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('H', meterX + meterWidth / 2, meterY - 5);
        }
        
        function drawUI() {
            // Score
            ctx.fillStyle = '#FFF';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.font = 'bold 20px "Comic Sans MS", cursive';
            ctx.textAlign = 'left';
            ctx.strokeText(`Score: ${score}`, 10, 25);
            ctx.fillText(`Score: ${score}`, 10, 25);
            
            // High score
            ctx.font = '12px "Comic Sans MS", cursive';
            ctx.strokeText(`Best: ${highScore}`, 10, 42);
            ctx.fillText(`Best: ${highScore}`, 10, 42);
            
            // Draw indicators
            drawTiltIndicator();
            drawHeightMeter();
            
            // Super catch indicator
            if (superCatchActive) {
                ctx.fillStyle = `rgba(0, 255, 0, ${0.5 + Math.sin(Date.now() / 100) * 0.3})`;
                ctx.font = 'bold 14px "Comic Sans MS", cursive';
                ctx.textAlign = 'center';
                ctx.fillText('SUPER CATCH!', GAME_WIDTH / 2, 100);
            }
            
            // Lick cooldown
            if (lickCooldown > 0) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.fillRect(GAME_WIDTH - 80, 90, 60 * (lickCooldown / 120), 10);
                ctx.strokeStyle = '#FFF';
                ctx.strokeRect(GAME_WIDTH - 80, 90, 60, 10);
            }
            
            // Controls hint
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(5, GAME_HEIGHT - 55, 200, 50);
            ctx.fillStyle = '#FFF';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('D-PAD: Move | L/R: Tilt', 10, GAME_HEIGHT - 42);
            ctx.fillText('A: Super Catch | B: Lick', 10, GAME_HEIGHT - 30);
            ctx.fillText('START: Pause', 10, GAME_HEIGHT - 18);
        }
        
        function drawGameOver() {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            ctx.fillStyle = '#FF6B6B';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.font = 'bold 36px "Comic Sans MS", cursive';
            ctx.textAlign = 'center';
            ctx.strokeText('GAME OVER!', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 30);
            ctx.fillText('GAME OVER!', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 30);
            
            ctx.fillStyle = '#FFF';
            ctx.font = '20px "Comic Sans MS", cursive';
            ctx.strokeText(`Final Score: ${score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10);
            ctx.fillText(`Final Score: ${score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10);
            
            ctx.font = '14px "Comic Sans MS", cursive';
            ctx.fillStyle = '#FFD700';
            ctx.strokeText('Press START to restart', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 40);
            ctx.fillText('Press START to restart', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 40);
        }
        
        // ============================================
        // MAIN GAME LOOP
        // ============================================
        
        function update() {
            if (gameState !== 'playing') return;
            
            // Update falling scoop
            if (fallingScoop) {
                fallingScoop.update();
                
                // Check collision with scoops
                let landed = false;
                
                // Check collision with existing scoops
                for (let scoop of scoops) {
                    const dx = fallingScoop.x - scoop.x;
                    const dy = fallingScoop.y - scoop.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < SCOOP_RADIUS * 2) {
                        fallingScoop.y = scoop.y - SCOOP_RADIUS * 1.8;
                        landScoop(fallingScoop);
                        fallingScoop = null;
                        landed = true;
                        break;
                    }
                }
                
                // Check collision with cone
                if (!landed && fallingScoop) {
                    const coneTop = cone.y - CONE_HEIGHT / 2;
                    const dx = fallingScoop.x - cone.x;
                    const dy = fallingScoop.y - coneTop;
                    const catchWidth = superCatchActive ? CONE_WIDTH * 2 : CONE_WIDTH * 1.2;
                    
                    if (Math.abs(dx) < catchWidth / 2 && fallingScoop.y + SCOOP_RADIUS >= coneTop) {
                        fallingScoop.y = coneTop - SCOOP_RADIUS;
                        landScoop(fallingScoop);
                        fallingScoop = null;
                    }
                }
                
                // Missed - game over if falls off screen
                if (fallingScoop && fallingScoop.y > GAME_HEIGHT) {
                    gameOver();
                }
            }
            
            // Update particles
            particles = particles.filter(p => {
                p.update();
                return p.life > 0;
            });
            
            // Update floating texts
            floatingTexts = floatingTexts.filter(t => {
                t.update();
                return t.life > 0;
            });
            
            // Update timers
            if (superCatchTimer > 0) {
                superCatchTimer--;
                if (superCatchTimer <= 0) superCatchActive = false;
            }
            if (lickCooldown > 0) lickCooldown--;
            
            // Update cone physics
            updateConePhysics();
        }
        
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // Draw background
            drawBackground();
            
            // Draw cone
            drawCone();
            
            // Draw landed scoops
            scoops.forEach(scoop => scoop.draw(ctx));
            
            // Draw falling scoop
            if (fallingScoop) {
                // Super catch effect
                if (superCatchActive) {
                    ctx.strokeStyle = `rgba(0, 255, 0, ${0.3 + Math.sin(Date.now() / 50) * 0.2})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(fallingScoop.x, fallingScoop.y, SCOOP_RADIUS + 8, 0, Math.PI * 2);
                    ctx.stroke();
                }
                fallingScoop.draw(ctx);
            }
            
            // Draw particles
            particles.forEach(p => p.draw(ctx));
            
            // Draw floating texts
            floatingTexts.forEach(t => t.draw(ctx));
            
            // Draw UI
            drawUI();
            
            // Draw game over screen
            if (gameState === 'gameover') {
                drawGameOver();
            }
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // ============================================
        // POSTMESSAGE API
        // ============================================
        
        window.addEventListener('message', (e) => {
            const {type, button, state} = e.data;
            
            if (type === 'button') {
                inputState[button] = state;
                
                // Handle button presses
                if (state) {
                    if (button === 'START') {
                        if (gameState === 'playing') {
                            gameState = 'paused';
                            pauseMenu.classList.add('visible');
                            stopBGM();
                        } else if (gameState === 'paused') {
                            gameState = 'playing';
                            pauseMenu.classList.remove('visible');
                            startBGM();
                        } else if (gameState === 'gameover') {
                            resetGame();
                        }
                    }
                    
                    if (gameState === 'playing') {
                        if (button === 'A') useSuperCatch();
                        if (button === 'B') useLick();
                    }
                }
            }
            
            if (type === 'mute') {
                audioMuted = true;
                stopBGM();
                updateMuteButton();
            }
            
            if (type === 'unmute') {
                audioMuted = false;
                if (gameState === 'playing') startBGM();
                updateMuteButton();
            }
        });
        
        function reportScore(score) {
            parent.postMessage({type: 'score', value: score}, '*');
        }
        
        function saveGameState() {
            const saveData = {
                score: score,
                highScore: highScore,
                maxStackHeight: maxStackHeight,
                timestamp: Date.now()
            };
            localStorage.setItem('munchboy_save_icecreamcone', JSON.stringify(saveData));
        }
        
        function loadGameState() {
            const saved = localStorage.getItem('munchboy_save_icecreamcone');
            if (saved) {
                const data = JSON.parse(saved);
                highScore = data.highScore || 0;
                maxStackHeight = data.maxStackHeight || 0;
            }
        }
        
        // ============================================
        // PAUSE MENU HANDLERS
        // ============================================
        
        function updateMuteButton() {
            document.getElementById('muteBtn').textContent = audioMuted ? 'MUTE: ON' : 'MUTE: OFF';
        }
        
        document.getElementById('resumeBtn').addEventListener('click', () => {
            gameState = 'playing';
            pauseMenu.classList.remove('visible');
            startBGM();
        });
        
        document.getElementById('muteBtn').addEventListener('click', () => {
            audioMuted = !audioMuted;
            updateMuteButton();
            if (audioMuted) {
                stopBGM();
                parent.postMessage({type: 'mute'}, '*');
            } else {
                startBGM();
                parent.postMessage({type: 'unmute'}, '*');
            }
        });
        
        document.getElementById('backBtn').addEventListener('click', () => {
            parent.postMessage({type: 'back'}, '*');
        });
        
        // Keyboard controls for testing
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft': inputState.LEFT = true; break;
                case 'ArrowRight': inputState.RIGHT = true; break;
                case 'q': case 'Q': inputState.L = true; break;
                case 'e': case 'E': inputState.R = true; break;
                case 'a': case 'A': 
                    inputState.A = true;
                    if (gameState === 'playing') useSuperCatch();
                    break;
                case 'b': case 'B':
                    inputState.B = true;
                    if (gameState === 'playing') useLick();
                    break;
                case 'Enter':
                    inputState.START = true;
                    if (gameState === 'playing') {
                        gameState = 'paused';
                        pauseMenu.classList.add('visible');
                        stopBGM();
                    } else if (gameState === 'paused') {
                        gameState = 'playing';
                        pauseMenu.classList.remove('visible');
                        startBGM();
                    } else if (gameState === 'gameover') {
                        resetGame();
                    }
                    break;
            }
        });
        
        window.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowLeft': inputState.LEFT = false; break;
                case 'ArrowRight': inputState.RIGHT = false; break;
                case 'q': case 'Q': inputState.L = false; break;
                case 'e': case 'E': inputState.R = false; break;
                case 'a': case 'A': inputState.A = false; break;
                case 'b': case 'B': inputState.B = false; break;
                case 'Enter': inputState.START = false; break;
            }
        });
        
        // ============================================
        // INITIALIZATION
        // ============================================
        
        function init() {
            loadGameState();
            resetGame();
            gameLoop();
        }
        
        // Start game
        init();
    </script>
</body>
</html>
