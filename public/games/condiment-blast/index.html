<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condiment Blast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
    </div>

    <script>
        // ==================== GAME CONSTANTS ====================
        const CANVAS_WIDTH = 480;
        const CANVAS_HEIGHT = 320;
        const PLAYER_SPEED = 4;
        const BULLET_SPEED = 6;
        const ENEMY_SPEED = 0.5;
        const ENEMY_DROP_SPEED = 15;
        
        // ==================== GAME STATE ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = 'title'; // title, playing, paused, gameover, victory
        let score = 0;
        let lives = 3;
        let wave = 1;
        let weaponMode = 'ketchup'; // ketchup, mustard
        let powerUpActive = null;
        let powerUpTimer = 0;
        let bossActive = false;
        let enemyDirection = 1;
        let enemyMoveTimer = 0;
        let frameCount = 0;
        let audioMuted = false;
        
        // Input state for PostMessage API
        const inputState = {
            UP: false,
            DOWN: false,
            LEFT: false,
            RIGHT: false,
            A: false,
            B: false,
            X: false,
            Y: false,
            L: false,
            R: false,
            START: false,
            SELECT: false
        };
        
        // Previous input state for edge detection
        const prevInputState = {};
        
        // ==================== AUDIO SYSTEM ====================
        const AudioSys = {
            ctx: null,
            init() {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.log('Audio not supported');
                }
            },
            
            playTone(freq, duration, type = 'square', vol = 0.3) {
                if (audioMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            
            playShoot() {
                if (weaponMode === 'ketchup') {
                    this.playTone(600, 0.1, 'square', 0.2);
                } else {
                    this.playTone(500, 0.08, 'square', 0.2);
                    setTimeout(() => this.playTone(550, 0.08, 'square', 0.2), 30);
                    setTimeout(() => this.playTone(600, 0.08, 'square', 0.2), 60);
                }
            },
            
            playExplosion() {
                this.playTone(100, 0.3, 'sawtooth', 0.4);
                setTimeout(() => this.playTone(80, 0.2, 'sawtooth', 0.3), 50);
            },
            
            playPowerUp() {
                this.playTone(400, 0.1, 'sine', 0.3);
                setTimeout(() => this.playTone(600, 0.1, 'sine', 0.3), 100);
                setTimeout(() => this.playTone(800, 0.2, 'sine', 0.3), 200);
            },
            
            playBossHit() {
                this.playTone(150, 0.2, 'sawtooth', 0.5);
            },
            
            playMayoBomb() {
                this.playTone(200, 0.5, 'sawtooth', 0.5);
                setTimeout(() => this.playTone(150, 0.3, 'sawtooth', 0.4), 100);
            }
        };
        
        // ==================== SPRITES ====================
        function drawBottle(ctx, x, y, mode) {
            ctx.save();
            ctx.translate(x, y);
            
            // Bottle body
            ctx.fillStyle = mode === 'ketchup' ? '#c41e3a' : '#e4a010';
            ctx.fillRect(-12, -15, 24, 30);
            
            // Bottle neck
            ctx.fillStyle = mode === 'ketchup' ? '#a01830' : '#c49000';
            ctx.fillRect(-8, -25, 16, 10);
            
            // Cap
            ctx.fillStyle = '#fff';
            ctx.fillRect(-10, -32, 20, 8);
            
            // Label
            ctx.fillStyle = '#fff';
            ctx.font = '8px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(mode === 'ketchup' ? 'K' : 'M', 0, 0);
            
            ctx.restore();
        }
        
        function drawBurger(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            // Top bun
            ctx.fillStyle = '#d4a574';
            ctx.beginPath();
            ctx.arc(0, -8, 12, Math.PI, 0);
            ctx.fill();
            
            // Lettuce
            ctx.fillStyle = '#4a7c2a';
            ctx.fillRect(-12, -2, 24, 4);
            
            // Patty
            ctx.fillStyle = '#5c3a21';
            ctx.fillRect(-11, 2, 22, 6);
            
            // Bottom bun
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(-11, 8, 22, 5);
            
            // Sesame seeds
            ctx.fillStyle = '#f5deb3';
            ctx.fillRect(-5, -12, 2, 2);
            ctx.fillRect(3, -10, 2, 2);
            ctx.fillRect(0, -14, 2, 2);
            
            ctx.restore();
        }
        
        function drawFries(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            // Fries container
            ctx.fillStyle = '#c41e3a';
            ctx.beginPath();
            ctx.moveTo(-10, 5);
            ctx.lineTo(-8, -10);
            ctx.lineTo(8, -10);
            ctx.lineTo(10, 5);
            ctx.fill();
            
            // Fries
            ctx.fillStyle = '#ffd700';
            for (let i = -6; i <= 6; i += 4) {
                ctx.fillRect(i - 1, -18, 2, 10);
            }
            
            ctx.restore();
        }
        
        function drawNugget(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            // Nugget shape
            ctx.fillStyle = '#d4a017';
            ctx.beginPath();
            ctx.moveTo(-8, -5);
            ctx.lineTo(-5, -10);
            ctx.lineTo(5, -10);
            ctx.lineTo(10, -3);
            ctx.lineTo(8, 5);
            ctx.lineTo(0, 8);
            ctx.lineTo(-8, 5);
            ctx.closePath();
            ctx.fill();
            
            // Texture
            ctx.fillStyle = '#b8860b';
            ctx.fillRect(-3, -3, 2, 2);
            ctx.fillRect(2, 0, 2, 2);
            
            ctx.restore();
        }
        
        function drawHotDogBoss(ctx, x, y, health, maxHealth) {
            ctx.save();
            ctx.translate(x, y);
            
            const scale = 2.5;
            ctx.scale(scale, scale);
            
            // Bun
            ctx.fillStyle = '#d4a574';
            ctx.beginPath();
            ctx.ellipse(0, 0, 35, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Hot dog
            ctx.fillStyle = '#c41e3a';
            ctx.fillRect(-30, -6, 60, 12);
            
            // Mustard squiggle
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = -25; i < 25; i += 5) {
                ctx.lineTo(i, Math.sin(i * 0.3) * 3);
            }
            ctx.stroke();
            
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-15, -3, 4, 0, Math.PI * 2);
            ctx.arc(15, -3, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-15, -3, 2, 0, Math.PI * 2);
            ctx.arc(15, -3, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Health bar
            ctx.fillStyle = '#333';
            ctx.fillRect(-25, -25, 50, 5);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(-25, -25, 50 * (health / maxHealth), 5);
            
            ctx.restore();
        }
        
        function drawBullet(ctx, x, y, type) {
            ctx.save();
            ctx.translate(x, y);
            
            if (type === 'ketchup') {
                ctx.fillStyle = '#c41e3a';
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();
            } else if (type === 'mustard') {
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(-3, -6, 6, 12);
            } else if (type === 'relish') {
                ctx.fillStyle = '#4a7c2a';
                ctx.fillRect(-2, -15, 4, 30);
                ctx.shadowColor = '#4a7c2a';
                ctx.shadowBlur = 10;
                ctx.fillRect(-2, -15, 4, 30);
                ctx.shadowBlur = 0;
            }
            
            ctx.restore();
        }
        
        function drawPowerUp(ctx, x, y, type) {
            ctx.save();
            ctx.translate(x, y);
            
            // Glow
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 10;
            
            // Background
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            
            // Icon
            ctx.fillStyle = '#000';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            if (type === 'mayo') {
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.fillText('M', 0, 1);
            } else if (type === 'relish') {
                ctx.fillStyle = '#4a7c2a';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillText('R', 0, 1);
            } else if (type === 'speed') {
                ctx.fillStyle = '#00f';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillText('S', 0, 1);
            } else if (type === 'life') {
                ctx.fillStyle = '#f00';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillText('+', 0, 1);
            }
            
            ctx.restore();
        }
        
        function drawExplosion(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            const colors = ['#ff6b35', '#f7931e', '#ffd700', '#fff'];
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const dist = Math.random() * size;
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.beginPath();
                ctx.arc(
                    Math.cos(angle) * dist,
                    Math.sin(angle) * dist,
                    Math.random() * 4 + 2,
                    0, Math.PI * 2
                );
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        // ==================== GAME OBJECTS ====================
        const player = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT - 40,
            width: 24,
            height: 32,
            speed: PLAYER_SPEED,
            shootCooldown: 0,
            invulnerable: 0
        };
        
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let powerUps = [];
        let particles = [];
        let boss = null;
        
        // ==================== ENEMY SPAWNING ====================
        function spawnWave() {
            enemies = [];
            enemyBullets = [];
            
            const rows = 3 + Math.floor(wave / 2);
            const cols = 6 + Math.floor(wave / 3);
            const startX = (CANVAS_WIDTH - cols * 40) / 2 + 20;
            const startY = 40;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    let type = 'burger';
                    if (row === 0) type = 'fries';
                    else if (row === 1) type = 'nugget';
                    
                    enemies.push({
                        x: startX + col * 40,
                        y: startY + row * 35,
                        type: type,
                        width: 24,
                        height: 24,
                        shootTimer: Math.random() * 200,
                        hp: 1
                    });
                }
            }
        }
        
        function spawnBoss() {
            boss = {
                x: CANVAS_WIDTH / 2,
                y: 80,
                width: 90,
                height: 60,
                hp: 20 + wave * 5,
                maxHp: 20 + wave * 5,
                shootTimer: 0,
                movePhase: 0,
                direction: 1
            };
            bossActive = true;
        }
        
        function spawnPowerUp(x, y) {
            if (Math.random() < 0.15) {
                const types = ['mayo', 'relish', 'speed', 'life'];
                const type = types[Math.floor(Math.random() * types.length)];
                powerUps.push({
                    x: x,
                    y: y,
                    type: type,
                    width: 24,
                    height: 24,
                    vy: 1.5
                });
            }
        }
        
        // ==================== UPDATE FUNCTIONS ====================
        function updatePlayer() {
            // Movement
            if (inputState.LEFT && player.x > player.width) {
                player.x -= player.speed;
            }
            if (inputState.RIGHT && player.x < CANVAS_WIDTH - player.width) {
                player.x += player.speed;
            }
            
            // Weapon switching
            if (inputState.L && !prevInputState.L) {
                weaponMode = 'ketchup';
            }
            if (inputState.R && !prevInputState.R) {
                weaponMode = 'mustard';
            }
            
            // Shooting
            if (player.shootCooldown > 0) player.shootCooldown--;
            
            if ((inputState.A || inputState.B) && player.shootCooldown <= 0) {
                const shootType = inputState.B ? 'mustard' : weaponMode;
                
                if (shootType === 'ketchup' || powerUpActive === 'relish') {
                    bullets.push({
                        x: player.x,
                        y: player.y - 20,
                        type: powerUpActive === 'relish' ? 'relish' : 'ketchup',
                        vy: -BULLET_SPEED,
                        width: 8,
                        height: 12
                    });
                } else if (shootType === 'mustard') {
                    // Spread shot
                    for (let i = -1; i <= 1; i++) {
                        bullets.push({
                            x: player.x,
                            y: player.y - 20,
                            type: 'mustard',
                            vx: i * 1.5,
                            vy: -BULLET_SPEED,
                            width: 6,
                            height: 12
                        });
                    }
                }
                
                AudioSys.playShoot();
                player.shootCooldown = powerUpActive === 'relish' ? 8 : 12;
            }
            
            // Invulnerability
            if (player.invulnerable > 0) player.invulnerable--;
            
            // Power-up timer
            if (powerUpTimer > 0) {
                powerUpTimer--;
                if (powerUpTimer <= 0) {
                    powerUpActive = null;
                }
            }
        }
        
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y += b.vy;
                if (b.vx) b.x += b.vx;
                
                // Remove off-screen bullets
                if (b.y < -20) {
                    bullets.splice(i, 1);
                }
            }
        }
        
        function updateEnemies() {
            enemyMoveTimer++;
            
            // Move enemies
            let shouldDrop = false;
            
            for (const e of enemies) {
                if (enemyMoveTimer % 30 === 0) {
                    e.x += ENEMY_SPEED * enemyDirection * (1 + wave * 0.1);
                }
                
                // Check boundaries
                if (e.x < 20 || e.x > CANVAS_WIDTH - 20) {
                    shouldDrop = true;
                }
                
                // Enemy shooting
                e.shootTimer++;
                if (e.shootTimer > 150 - wave * 5 && Math.random() < 0.02) {
                    enemyBullets.push({
                        x: e.x,
                        y: e.y + 15,
                        vy: 3 + wave * 0.2,
                        width: 6,
                        height: 8
                    });
                    e.shootTimer = 0;
                }
            }
            
            // Drop and reverse direction
            if (shouldDrop && enemyMoveTimer % 30 === 0) {
                enemyDirection *= -1;
                for (const e of enemies) {
                    e.y += ENEMY_DROP_SPEED;
                }
            }
            
            // Check if enemies reached bottom
            for (const e of enemies) {
                if (e.y > CANVAS_HEIGHT - 50) {
                    lives = 0;
                    gameState = 'gameover';
                }
            }
        }
        
        function updateBoss() {
            if (!boss) return;
            
            boss.movePhase += 0.02;
            boss.x = CANVAS_WIDTH / 2 + Math.sin(boss.movePhase) * 120;
            
            boss.shootTimer++;
            if (boss.shootTimer > 40) {
                // Boss shoots in pattern
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI + Math.PI / 2;
                    enemyBullets.push({
                        x: boss.x,
                        y: boss.y + 30,
                        vx: Math.cos(angle) * 3,
                        vy: Math.sin(angle) * 3,
                        width: 8,
                        height: 8
                    });
                }
                boss.shootTimer = 0;
            }
        }
        
        function updateEnemyBullets() {
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.y += b.vy;
                if (b.vx) b.x += b.vx;
                
                if (b.y > CANVAS_HEIGHT + 20 || b.x < -20 || b.x > CANVAS_WIDTH + 20) {
                    enemyBullets.splice(i, 1);
                }
            }
        }
        
        function updatePowerUps() {
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const p = powerUps[i];
                p.y += p.vy;
                
                if (p.y > CANVAS_HEIGHT + 20) {
                    powerUps.splice(i, 1);
                }
            }
        }
        
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        // ==================== COLLISION ====================
        function checkCollision(a, b) {
            return a.x - a.width/2 < b.x + b.width/2 &&
                   a.x + a.width/2 > b.x - b.width/2 &&
                   a.y - a.height/2 < b.y + b.height/2 &&
                   a.y + a.height/2 > b.y - b.height/2;
        }
        
        function checkCollisions() {
            // Bullets vs Enemies
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                let hit = false;
                
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (checkCollision(b, e)) {
                        hit = true;
                        e.hp--;
                        
                        if (e.hp <= 0) {
                            spawnPowerUp(e.x, e.y);
                            createExplosion(e.x, e.y);
                            AudioSys.playExplosion();
                            enemies.splice(j, 1);
                            score += 10 * wave;
                        }
                        
                        if (b.type !== 'relish') break;
                    }
                }
                
                // Bullets vs Boss
                if (boss && checkCollision(b, {x: boss.x, y: boss.y, width: boss.width, height: boss.height})) {
                    hit = true;
                    boss.hp--;
                    AudioSys.playBossHit();
                    
                    if (boss.hp <= 0) {
                        createExplosion(boss.x, boss.y, 3);
                        AudioSys.playExplosion();
                        boss = null;
                        bossActive = false;
                        score += 100 * wave;
                        wave++;
                        if (wave % 3 === 0) {
                            spawnBoss();
                        } else {
                            spawnWave();
                        }
                    }
                    
                    if (b.type !== 'relish') hit = true;
                }
                
                if (hit && b.type !== 'relish') {
                    bullets.splice(i, 1);
                }
            }
            
            // Enemy bullets vs Player
            if (player.invulnerable <= 0) {
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const b = enemyBullets[i];
                    if (checkCollision(b, player)) {
                        enemyBullets.splice(i, 1);
                        playerHit();
                        break;
                    }
                }
                
                // Enemies vs Player
                for (const e of enemies) {
                    if (checkCollision(e, player)) {
                        playerHit();
                        break;
                    }
                }
            }
            
            // Power-ups vs Player
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const p = powerUps[i];
                if (checkCollision(p, player)) {
                    activatePowerUp(p.type);
                    powerUps.splice(i, 1);
                }
            }
        }
        
        function playerHit() {
            lives--;
            player.invulnerable = 120;
            createExplosion(player.x, player.y);
            AudioSys.playExplosion();
            
            if (lives <= 0) {
                gameState = 'gameover';
                saveGameState();
            }
        }
        
        function activatePowerUp(type) {
            AudioSys.playPowerUp();
            
            if (type === 'mayo') {
                // Screen clear
                AudioSys.playMayoBomb();
                for (const e of enemies) {
                    createExplosion(e.x, e.y);
                    score += 10;
                }
                enemies = [];
                enemyBullets = [];
            } else if (type === 'relish') {
                powerUpActive = 'relish';
                powerUpTimer = 600;
            } else if (type === 'speed') {
                player.speed = PLAYER_SPEED * 1.5;
                powerUpTimer = 600;
                setTimeout(() => { player.speed = PLAYER_SPEED; }, 10000);
            } else if (type === 'life') {
                lives = Math.min(lives + 1, 5);
            }
        }
        
        function createExplosion(x, y, scale = 1) {
            for (let i = 0; i < 10 * scale; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 20 + Math.random() * 10,
                    scale: scale
                });
            }
        }
        
        // ==================== DRAW FUNCTIONS ====================
        function drawBackground() {
            // Kitchen tile pattern
            ctx.fillStyle = '#2a2a4a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Tiles
            ctx.strokeStyle = '#3a3a5a';
            ctx.lineWidth = 1;
            for (let x = 0; x < CANVAS_WIDTH; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < CANVAS_HEIGHT; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
            
            // Countertop at bottom
            ctx.fillStyle = '#4a3728';
            ctx.fillRect(0, CANVAS_HEIGHT - 20, CANVAS_WIDTH, 20);
            ctx.fillStyle = '#5a4738';
            ctx.fillRect(0, CANVAS_HEIGHT - 20, CANVAS_WIDTH, 5);
        }
        
        function drawHUD() {
            // Score
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Courier New';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 10, 20);
            
            // Wave
            ctx.textAlign = 'center';
            ctx.fillText(`WAVE ${wave}`, CANVAS_WIDTH / 2, 20);
            
            // Lives
            ctx.textAlign = 'right';
            ctx.fillText(`LIVES: ${lives}`, CANVAS_WIDTH - 10, 20);
            
            // Weapon mode
            ctx.textAlign = 'left';
            ctx.fillStyle = weaponMode === 'ketchup' ? '#c41e3a' : '#e4a010';
            ctx.fillText(`WEAPON: ${weaponMode.toUpperCase()}`, 10, CANVAS_HEIGHT - 5);
            
            // Power-up indicator
            if (powerUpActive) {
                ctx.fillStyle = '#0f0';
                ctx.textAlign = 'right';
                ctx.fillText(`${powerUpActive.toUpperCase()}: ${Math.ceil(powerUpTimer / 60)}s`, CANVAS_WIDTH - 10, CANVAS_HEIGHT - 5);
            }
        }
        
        function drawTitle() {
            drawBackground();
            
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 32px Courier New';
            ctx.fillText('CONDIMENT', CANVAS_WIDTH / 2, 80);
            ctx.fillText('BLAST', CANVAS_WIDTH / 2, 115);
            
            // Animated bottle
            const bounce = Math.sin(frameCount * 0.1) * 5;
            drawBottle(ctx, CANVAS_WIDTH / 2, 160 + bounce, 'ketchup');
            
            ctx.font = '14px Courier New';
            ctx.fillText('Press START to Play', CANVAS_WIDTH / 2, 220);
            
            ctx.font = '10px Courier New';
            ctx.fillText('A: Ketchup Shot  B: Mustard Spread', CANVAS_WIDTH / 2, 250);
            ctx.fillText('L/R: Switch Weapon', CANVAS_WIDTH / 2, 265);
        }
        
        function drawPauseMenu() {
            // Semi-transparent overlay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 24px Courier New';
            ctx.fillText('PAUSED', CANVAS_WIDTH / 2, 100);
            
            ctx.font = '14px Courier New';
            ctx.fillText('START: Resume', CANVAS_WIDTH / 2, 150);
            ctx.fillText(`SELECT: ${audioMuted ? 'Unmute' : 'Mute'}`, CANVAS_WIDTH / 2, 175);
            ctx.fillText('B: Back to Menu', CANVAS_WIDTH / 2, 200);
        }
        
        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            ctx.fillStyle = '#f00';
            ctx.textAlign = 'center';
            ctx.font = 'bold 28px Courier New';
            ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, 100);
            
            ctx.fillStyle = '#fff';
            ctx.font = '18px Courier New';
            ctx.fillText(`Final Score: ${score}`, CANVAS_WIDTH / 2, 140);
            ctx.fillText(`Waves Survived: ${wave}`, CANVAS_WIDTH / 2, 165);
            
            ctx.font = '14px Courier New';
            ctx.fillText('Press START to Retry', CANVAS_WIDTH / 2, 210);
        }
        
        function drawGame() {
            drawBackground();
            
            // Draw player
            if (player.invulnerable === 0 || Math.floor(frameCount / 4) % 2 === 0) {
                drawBottle(ctx, player.x, player.y, weaponMode);
            }
            
            // Draw bullets
            for (const b of bullets) {
                drawBullet(ctx, b.x, b.y, b.type);
            }
            
            // Draw enemies
            for (const e of enemies) {
                if (e.type === 'burger') drawBurger(ctx, e.x, e.y);
                else if (e.type === 'fries') drawFries(ctx, e.x, e.y);
                else if (e.type === 'nugget') drawNugget(ctx, e.x, e.y);
            }
            
            // Draw boss
            if (boss) {
                drawHotDogBoss(ctx, boss.x, boss.y, boss.hp, boss.maxHp);
            }
            
            // Draw enemy bullets
            ctx.fillStyle = '#888';
            for (const b of enemyBullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw power-ups
            for (const p of powerUps) {
                drawPowerUp(ctx, p.x, p.y, p.type);
            }
            
            // Draw particles
            for (const p of particles) {
                drawExplosion(ctx, p.x, p.y, p.scale);
            }
            
            drawHUD();
        }
        
        // ==================== GAME LOOP ====================
        function update() {
            // Store previous input state
            Object.assign(prevInputState, inputState);
            
            // Handle pause
            if (inputState.START && !prevInputState.START) {
                if (gameState === 'playing') {
                    gameState = 'paused';
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                } else if (gameState === 'title' || gameState === 'gameover') {
                    resetGame();
                }
            }
            
            // Handle mute toggle in pause menu
            if (gameState === 'paused' && inputState.SELECT && !prevInputState.SELECT) {
                audioMuted = !audioMuted;
            }
            
            // Handle back to menu
            if (gameState === 'paused' && inputState.B && !prevInputState.B) {
                gameState = 'title';
            }
            
            if (gameState !== 'playing') return;
            
            frameCount++;
            
            updatePlayer();
            updateBullets();
            
            if (bossActive) {
                updateBoss();
            } else {
                updateEnemies();
            }
            
            updateEnemyBullets();
            updatePowerUps();
            updateParticles();
            checkCollisions();
            
            // Check wave completion
            if (!bossActive && enemies.length === 0) {
                wave++;
                if (wave % 3 === 0) {
                    spawnBoss();
                } else {
                    spawnWave();
                }
            }
            
            // Report score periodically
            if (frameCount % 60 === 0) {
                reportScore(score);
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            switch (gameState) {
                case 'title':
                    drawTitle();
                    break;
                case 'playing':
                    drawGame();
                    break;
                case 'paused':
                    drawGame();
                    drawPauseMenu();
                    break;
                case 'gameover':
                    drawGame();
                    drawGameOver();
                    break;
            }
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function resetGame() {
            score = 0;
            lives = 3;
            wave = 1;
            weaponMode = 'ketchup';
            powerUpActive = null;
            powerUpTimer = 0;
            bossActive = false;
            boss = null;
            
            player.x = CANVAS_WIDTH / 2;
            player.invulnerable = 0;
            
            bullets = [];
            enemyBullets = [];
            powerUps = [];
            particles = [];
            
            spawnWave();
            gameState = 'playing';
            
            AudioSys.init();
        }
        
        // ==================== POSTMESSAGE API ====================
        window.addEventListener('message', (e) => {
            const {type, button, state} = e.data;
            if (type === 'button' && button in inputState) {
                inputState[button] = state;
            }
            if (type === 'mute') {
                audioMuted = true;
            }
        });
        
        function reportScore(score) {
            parent.postMessage({type: 'score', value: score}, '*');
        }
        
        function saveGameState() {
            localStorage.setItem('munchboy_save_condimentblast', JSON.stringify({
                score: score,
                wave: wave,
                timestamp: Date.now()
            }));
        }
        
        // ==================== KEYBOARD CONTROLS (for testing) ====================
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft': inputState.LEFT = true; break;
                case 'ArrowRight': inputState.RIGHT = true; break;
                case 'z': case 'Z': inputState.A = true; break;
                case 'x': case 'X': inputState.B = true; break;
                case 'a': case 'A': inputState.L = true; break;
                case 's': case 'S': inputState.R = true; break;
                case 'Enter': inputState.START = true; break;
                case 'Shift': inputState.SELECT = true; break;
            }
        });
        
        window.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowLeft': inputState.LEFT = false; break;
                case 'ArrowRight': inputState.RIGHT = false; break;
                case 'z': case 'Z': inputState.A = false; break;
                case 'x': case 'X': inputState.B = false; break;
                case 'a': case 'A': inputState.L = false; break;
                case 's': case 'S': inputState.R = false; break;
                case 'Enter': inputState.START = false; break;
                case 'Shift': inputState.SELECT = false; break;
            }
        });
        
        // ==================== INITIALIZATION ====================
        gameLoop();
    </script>
</body>
</html>
