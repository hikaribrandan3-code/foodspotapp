<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredient Match - Game 09</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
    </div>

    <script>
        // ==================== GAME CONFIGURATION ====================
        const CANVAS_WIDTH = 480;
        const CANVAS_HEIGHT = 320;
        const GRID_SIZE = 7;
        const TILE_SIZE = 32;
        const GRID_OFFSET_X = 40;
        const GRID_OFFSET_Y = 60;
        const GAME_TIME = 60;
        
        // Ingredient types
        const INGREDIENTS = ['tomato', 'cheese', 'lettuce', 'onion', 'mushroom', 'pepper', 'bacon'];
        const INGREDIENT_COLORS = {
            tomato: '#ff4444',
            cheese: '#ffdd44',
            lettuce: '#44ff44',
            onion: '#cc88ff',
            mushroom: '#ccaa88',
            pepper: '#ff8844',
            bacon: '#ff6688'
        };
        
        // Game states
        const STATE = {
            MENU: 0,
            PLAYING: 1,
            PAUSED: 2,
            GAMEOVER: 3,
            ANIMATING: 4
        };
        
        // ==================== INPUT STATE ====================
        const inputState = {
            UP: false,
            DOWN: false,
            LEFT: false,
            RIGHT: false,
            A: false,
            B: false,
            X: false,
            Y: false,
            L: false,
            R: false,
            START: false,
            SELECT: false
        };
        
        let prevInputState = {};
        let audioMuted = false;
        
        // ==================== AUDIO SYSTEM ====================
        const AudioSys = {
            ctx: null,
            bgmOscillator: null,
            bgmGain: null,
            
            init() {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.log('Audio not supported');
                }
            },
            
            playTone(freq, duration, type = 'sine', vol = 0.3) {
                if (!this.ctx || audioMuted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            
            playSwap() {
                if (!this.ctx || audioMuted) return;
                this.playTone(440, 0.1, 'sine', 0.2);
                setTimeout(() => this.playTone(554, 0.1, 'sine', 0.2), 50);
            },
            
            playMatch() {
                if (!this.ctx || audioMuted) return;
                this.playTone(523, 0.15, 'square', 0.25);
                setTimeout(() => this.playTone(659, 0.15, 'square', 0.25), 80);
                setTimeout(() => this.playTone(784, 0.2, 'square', 0.25), 160);
            },
            
            playChain(combo) {
                if (!this.ctx || audioMuted) return;
                const baseFreq = 440 + (combo * 110);
                this.playTone(baseFreq, 0.2, 'sawtooth', 0.3);
                setTimeout(() => this.playTone(baseFreq * 1.5, 0.3, 'sawtooth', 0.25), 100);
            },
            
            playPowerUp() {
                if (!this.ctx || audioMuted) return;
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => this.playTone(330 + i * 110, 0.15, 'square', 0.3), i * 60);
                }
            },
            
            playFall() {
                if (!this.ctx || audioMuted) return;
                this.playTone(220, 0.08, 'sine', 0.15);
            },
            
            startBGM() {
                if (!this.ctx || audioMuted) return;
                this.stopBGM();
                
                const playNote = (freq, time, duration) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + time);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime + time);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + time + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + time);
                    osc.stop(this.ctx.currentTime + time + duration);
                };
                
                const melody = [
                    [330, 0], [392, 0.25], [494, 0.5], [523, 0.75],
                    [494, 1], [392, 1.25], [330, 1.5], [262, 1.75],
                    [294, 2], [330, 2.25], [349, 2.5], [330, 2.75],
                    [294, 3], [262, 3.25], [247, 3.5], [262, 3.75]
                ];
                
                const loopMelody = () => {
                    if (audioMuted || gameState !== STATE.PLAYING) return;
                    melody.forEach(([freq, time]) => playNote(freq, time, 0.2));
                    setTimeout(loopMelody, 4000);
                };
                
                loopMelody();
            },
            
            stopBGM() {
                // BGM is note-based, no oscillator to stop
            }
        };
        
        // ==================== GAME VARIABLES ====================
        let canvas, ctx;
        let gameState = STATE.MENU;
        let grid = [];
        let cursorX = 3, cursorY = 3;
        let selectedTile = null;
        let score = 0;
        let timeRemaining = GAME_TIME;
        let lastTime = 0;
        let combo = 0;
        let maxCombo = 0;
        let chefSpecialReady = true;
        let chefSpecialCooldown = 0;
        let rapidDrop = false;
        let particles = [];
        let fallingTiles = [];
        let clearingTiles = [];
        let animationTime = 0;
        let menuSelection = 0;
        let gameOverReported = false;
        
        // ==================== INITIALIZATION ====================
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            AudioSys.init();
            
            // Keyboard controls for testing
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            
            // PostMessage API
            window.addEventListener('message', (e) => {
                const {type, button, state} = e.data;
                if (type === 'button') inputState[button] = state;
                if (type === 'mute') audioMuted = true;
            });
            
            loadGameState();
            requestAnimationFrame(gameLoop);
        }
        
        function handleKeyDown(e) {
            const keyMap = {
                'ArrowUp': 'UP', 'ArrowDown': 'DOWN', 'ArrowLeft': 'LEFT', 'ArrowRight': 'RIGHT',
                'z': 'A', 'x': 'B', 'a': 'L', 's': 'R', 'Enter': 'START'
            };
            if (keyMap[e.key]) inputState[keyMap[e.key]] = true;
        }
        
        function handleKeyUp(e) {
            const keyMap = {
                'ArrowUp': 'UP', 'ArrowDown': 'DOWN', 'ArrowLeft': 'LEFT', 'ArrowRight': 'RIGHT',
                'z': 'A', 'x': 'B', 'a': 'L', 's': 'R', 'Enter': 'START'
            };
            if (keyMap[e.key]) inputState[keyMap[e.key]] = false;
        }
        
        // ==================== GRID FUNCTIONS ====================
        function createGrid() {
            grid = [];
            for (let y = 0; y < GRID_SIZE; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    grid[y][x] = {
                        type: INGREDIENTS[Math.floor(Math.random() * INGREDIENTS.length)],
                        x: x,
                        y: y,
                        offsetY: 0,
                        clearing: false,
                        clearProgress: 0
                    };
                }
            }
            // Ensure no initial matches
            while (findMatches().length > 0) {
                removeMatches();
                fillEmptySpaces();
            }
        }
        
        function findMatches() {
            const matches = [];
            const matched = new Set();
            
            // Horizontal matches
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE - 2; x++) {
                    const type = grid[y][x].type;
                    if (type && grid[y][x + 1].type === type && grid[y][x + 2].type === type) {
                        let matchLength = 3;
                        while (x + matchLength < GRID_SIZE && grid[y][x + matchLength].type === type) {
                            matchLength++;
                        }
                        for (let i = 0; i < matchLength; i++) {
                            const key = `${x + i},${y}`;
                            if (!matched.has(key)) {
                                matched.add(key);
                                matches.push({x: x + i, y: y});
                            }
                        }
                    }
                }
            }
            
            // Vertical matches
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE - 2; y++) {
                    const type = grid[y][x].type;
                    if (type && grid[y + 1][x].type === type && grid[y + 2][x].type === type) {
                        let matchLength = 3;
                        while (y + matchLength < GRID_SIZE && grid[y + matchLength][x].type === type) {
                            matchLength++;
                        }
                        for (let i = 0; i < matchLength; i++) {
                            const key = `${x},${y + i}`;
                            if (!matched.has(key)) {
                                matched.add(key);
                                matches.push({x: x, y: y + i});
                            }
                        }
                    }
                }
            }
            
            return matches;
        }
        
        function removeMatches() {
            const matches = findMatches();
            if (matches.length === 0) return false;
            
            // Add to clearing animation
            matches.forEach(({x, y}) => {
                grid[y][x].clearing = true;
                grid[y][x].clearProgress = 0;
                clearingTiles.push({x, y, progress: 0});
                
                // Create particles
                for (let i = 0; i < 4; i++) {
                    particles.push({
                        x: GRID_OFFSET_X + x * TILE_SIZE + TILE_SIZE / 2,
                        y: GRID_OFFSET_Y + y * TILE_SIZE + TILE_SIZE / 2,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        life: 30,
                        color: INGREDIENT_COLORS[grid[y][x].type]
                    });
                }
            });
            
            // Score calculation
            const basePoints = matches.length * 10;
            const comboBonus = combo * 5;
            score += basePoints + comboBonus;
            
            // Play sound
            if (combo > 1) {
                AudioSys.playChain(combo);
            } else {
                AudioSys.playMatch();
            }
            
            // Actually clear tiles after animation
            setTimeout(() => {
                matches.forEach(({x, y}) => {
                    grid[y][x].type = null;
                    grid[y][x].clearing = false;
                });
            }, 200);
            
            return true;
        }
        
        function applyGravity() {
            let moved = false;
            
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = GRID_SIZE - 1; y >= 0; y--) {
                    if (grid[y][x].type === null) {
                        // Find tile above to fall
                        for (let aboveY = y - 1; aboveY >= 0; aboveY--) {
                            if (grid[aboveY][x].type !== null) {
                                grid[y][x].type = grid[aboveY][x].type;
                                grid[y][x].offsetY = -(y - aboveY) * TILE_SIZE;
                                grid[aboveY][x].type = null;
                                
                                fallingTiles.push({
                                    x: x,
                                    y: y,
                                    offsetY: grid[y][x].offsetY,
                                    speed: rapidDrop ? 15 : 3
                                });
                                moved = true;
                                break;
                            }
                        }
                    }
                }
            }
            
            return moved;
        }
        
        function fillEmptySpaces() {
            for (let x = 0; x < GRID_SIZE; x++) {
                let emptyCount = 0;
                for (let y = 0; y < GRID_SIZE; y++) {
                    if (grid[y][x].type === null) {
                        emptyCount++;
                    }
                }
                
                for (let i = 0; i < emptyCount; i++) {
                    const y = emptyCount - 1 - i;
                    grid[y][x].type = INGREDIENTS[Math.floor(Math.random() * INGREDIENTS.length)];
                    grid[y][x].offsetY = -(emptyCount - i) * TILE_SIZE;
                    
                    fallingTiles.push({
                        x: x,
                        y: y,
                        offsetY: grid[y][x].offsetY,
                        speed: rapidDrop ? 15 : 3
                    });
                }
            }
        }
        
        function swapTiles(x1, y1, x2, y2) {
            if (x1 < 0 || x1 >= GRID_SIZE || y1 < 0 || y1 >= GRID_SIZE) return false;
            if (x2 < 0 || x2 >= GRID_SIZE || y2 < 0 || y2 >= GRID_SIZE) return false;
            
            const temp = grid[y1][x1].type;
            grid[y1][x1].type = grid[y2][x2].type;
            grid[y2][x2].type = temp;
            
            AudioSys.playSwap();
            return true;
        }
        
        function canSwap(x1, y1, x2, y2) {
            // Temporarily swap
            const temp = grid[y1][x1].type;
            grid[y1][x1].type = grid[y2][x2].type;
            grid[y2][x2].type = temp;
            
            // Check for matches
            const matches = findMatches();
            
            // Swap back
            grid[y2][x2].type = grid[y1][x1].type;
            grid[y1][x1].type = temp;
            
            return matches.length > 0;
        }
        
        // ==================== CHEF'S SPECIAL ====================
        function useChefSpecial() {
            if (!chefSpecialReady) return;
            
            // Find the most common ingredient
            const counts = {};
            INGREDIENTS.forEach(ing => counts[ing] = 0);
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (grid[y][x].type) {
                        counts[grid[y][x].type]++;
                    }
                }
            }
            
            let maxCount = 0;
            let targetType = INGREDIENTS[0];
            for (const [type, count] of Object.entries(counts)) {
                if (count > maxCount) {
                    maxCount = count;
                    targetType = type;
                }
            }
            
            // Clear all of that type
            let cleared = 0;
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (grid[y][x].type === targetType) {
                        grid[y][x].clearing = true;
                        clearingTiles.push({x, y, progress: 0});
                        cleared++;
                        
                        for (let i = 0; i < 3; i++) {
                            particles.push({
                                x: GRID_OFFSET_X + x * TILE_SIZE + TILE_SIZE / 2,
                                y: GRID_OFFSET_Y + y * TILE_SIZE + TILE_SIZE / 2,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                life: 40,
                                color: INGREDIENT_COLORS[targetType]
                            });
                        }
                    }
                }
            }
            
            score += cleared * 15;
            AudioSys.playPowerUp();
            
            setTimeout(() => {
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (grid[y][x].type === targetType) {
                            grid[y][x].type = null;
                            grid[y][x].clearing = false;
                        }
                    }
                }
            }, 200);
            
            chefSpecialReady = false;
            chefSpecialCooldown = 10000; // 10 seconds
        }
        
        // ==================== UPDATE FUNCTIONS ====================
        function update(dt) {
            animationTime += dt;
            
            // Update particles
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life--;
                return p.life > 0;
            });
            
            // Update falling tiles
            fallingTiles = fallingTiles.filter(tile => {
                tile.offsetY += tile.speed;
                grid[tile.y][tile.x].offsetY = tile.offsetY;
                
                if (tile.offsetY >= 0) {
                    grid[tile.y][tile.x].offsetY = 0;
                    AudioSys.playFall();
                    return false;
                }
                return true;
            });
            
            // Update clearing tiles
            clearingTiles = clearingTiles.filter(tile => {
                tile.progress += 0.1;
                if (grid[tile.y] && grid[tile.y][tile.x]) {
                    grid[tile.y][tile.x].clearProgress = tile.progress;
                }
                return tile.progress < 1;
            });
            
            // Chef special cooldown
            if (!chefSpecialReady) {
                chefSpecialCooldown -= dt * 1000;
                if (chefSpecialCooldown <= 0) {
                    chefSpecialReady = true;
                }
            }
            
            // Rapid drop
            rapidDrop = inputState.L || inputState.R;
            
            switch (gameState) {
                case STATE.MENU:
                    updateMenu();
                    break;
                case STATE.PLAYING:
                    updatePlaying(dt);
                    break;
                case STATE.PAUSED:
                    updatePaused();
                    break;
                case STATE.GAMEOVER:
                    updateGameOver();
                    break;
                case STATE.ANIMATING:
                    updateAnimating();
                    break;
            }
            
            prevInputState = {...inputState};
        }
        
        function updateMenu() {
            if (justPressed('A') || justPressed('START')) {
                startGame();
            }
        }
        
        function updatePlaying(dt) {
            // Timer
            timeRemaining -= dt;
            if (timeRemaining <= 0) {
                timeRemaining = 0;
                gameState = STATE.GAMEOVER;
                return;
            }
            
            // Cursor movement
            if (justPressed('UP') && cursorY > 0) cursorY--;
            if (justPressed('DOWN') && cursorY < GRID_SIZE - 1) cursorY++;
            if (justPressed('LEFT') && cursorX > 0) cursorX--;
            if (justPressed('RIGHT') && cursorX < GRID_SIZE - 1) cursorX++;
            
            // Selection and swapping
            if (justPressed('A')) {
                if (selectedTile === null) {
                    selectedTile = {x: cursorX, y: cursorY};
                } else {
                    const dx = Math.abs(selectedTile.x - cursorX);
                    const dy = Math.abs(selectedTile.y - cursorY);
                    
                    if (dx + dy === 1) {
                        // Adjacent - try to swap
                        if (canSwap(selectedTile.x, selectedTile.y, cursorX, cursorY)) {
                            swapTiles(selectedTile.x, selectedTile.y, cursorX, cursorY);
                            gameState = STATE.ANIMATING;
                            combo = 0;
                        }
                    }
                    selectedTile = null;
                }
            }
            
            // Chef's Special
            if (justPressed('B')) {
                useChefSpecial();
            }
            
            // Pause
            if (justPressed('START')) {
                gameState = STATE.PAUSED;
                menuSelection = 0;
            }
        }
        
        function updatePaused() {
            if (justPressed('UP')) menuSelection = (menuSelection - 1 + 3) % 3;
            if (justPressed('DOWN')) menuSelection = (menuSelection + 1) % 3;
            
            if (justPressed('A')) {
                switch (menuSelection) {
                    case 0: // Resume
                        gameState = STATE.PLAYING;
                        break;
                    case 1: // Mute toggle
                        audioMuted = !audioMuted;
                        break;
                    case 2: // Back to selector
                        parent.postMessage({type: 'back'}, '*');
                        break;
                }
            }
            
            if (justPressed('START')) {
                gameState = STATE.PLAYING;
            }
        }
        
        function updateGameOver() {
            if (!gameOverReported) {
                reportScore(score);
                saveGameState();
                gameOverReported = true;
            }
            
            if (justPressed('A') || justPressed('START')) {
                gameState = STATE.MENU;
            }
        }
        
        function updateAnimating() {
            // Wait for animations to finish
            if (fallingTiles.length > 0 || clearingTiles.length > 0) return;
            
            // Check for matches
            if (findMatches().length > 0) {
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                removeMatches();
                
                setTimeout(() => {
                    applyGravity();
                    fillEmptySpaces();
                }, 250);
            } else {
                combo = 0;
                gameState = STATE.PLAYING;
            }
        }
        
        function justPressed(button) {
            return inputState[button] && !prevInputState[button];
        }
        
        // ==================== RENDER FUNCTIONS ====================
        function render() {
            // Clear canvas
            ctx.fillStyle = '#2d2d44';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Kitchen background pattern
            ctx.fillStyle = '#252538';
            for (let y = 0; y < CANVAS_HEIGHT; y += 40) {
                for (let x = 0; x < CANVAS_WIDTH; x += 40) {
                    if ((x + y) % 80 === 0) {
                        ctx.fillRect(x, y, 40, 40);
                    }
                }
            }
            
            switch (gameState) {
                case STATE.MENU:
                    renderMenu();
                    break;
                case STATE.PLAYING:
                case STATE.ANIMATING:
                    renderGame();
                    break;
                case STATE.PAUSED:
                    renderGame();
                    renderPauseMenu();
                    break;
                case STATE.GAMEOVER:
                    renderGame();
                    renderGameOver();
                    break;
            }
            
            // Render particles on top
            renderParticles();
        }
        
        function renderMenu() {
            // Title
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('INGREDIENT MATCH', CANVAS_WIDTH / 2, 100);
            
            ctx.font = '18px Arial';
            ctx.fillStyle = '#aaa';
            ctx.fillText('Match 3+ ingredients to score!', CANVAS_WIDTH / 2, 140);
            
            // Instructions
            ctx.font = '14px Arial';
            ctx.fillText('D-PAD: Move Cursor  |  A: Select/Swap', CANVAS_WIDTH / 2, 180);
            ctx.fillText('B: Chef\'s Special  |  L/R: Rapid Drop', CANVAS_WIDTH / 2, 200);
            ctx.fillText('START: Pause', CANVAS_WIDTH / 2, 220);
            
            // Press start
            ctx.font = 'bold 20px Arial';
            ctx.fillStyle = Math.floor(animationTime * 4) % 2 === 0 ? '#ffff44' : '#ffaa00';
            ctx.fillText('Press A or START to Play', CANVAS_WIDTH / 2, 270);
        }
        
        function renderGame() {
            // Draw grid background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(GRID_OFFSET_X - 4, GRID_OFFSET_Y - 4, 
                        GRID_SIZE * TILE_SIZE + 8, GRID_SIZE * TILE_SIZE + 8);
            
            // Draw tiles
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = grid[y][x];
                    if (tile.type) {
                        const px = GRID_OFFSET_X + x * TILE_SIZE;
                        const py = GRID_OFFSET_Y + y * TILE_SIZE + tile.offsetY;
                        
                        // Tile shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.fillRect(px + 2, py + 2, TILE_SIZE - 2, TILE_SIZE - 2);
                        
                        // Tile background
                        const color = INGREDIENT_COLORS[tile.type];
                        ctx.fillStyle = color;
                        
                        if (tile.clearing) {
                            const scale = 1 - tile.clearProgress;
                            const size = TILE_SIZE * scale;
                            const offset = (TILE_SIZE - size) / 2;
                            ctx.fillRect(px + offset, py + offset, size, size);
                        } else {
                            ctx.fillRect(px, py, TILE_SIZE - 2, TILE_SIZE - 2);
                            
                            // Ingredient icon
                            ctx.fillStyle = 'rgba(255,255,255,0.3)';
                            ctx.fillRect(px + 4, py + 4, TILE_SIZE - 10, 4);
                            ctx.fillRect(px + 4, py + 10, TILE_SIZE - 14, 4);
                            ctx.fillRect(px + 4, py + 16, TILE_SIZE - 10, 4);
                        }
                    }
                }
            }
            
            // Draw selected tile highlight
            if (selectedTile !== null) {
                const px = GRID_OFFSET_X + selectedTile.x * TILE_SIZE - 2;
                const py = GRID_OFFSET_Y + selectedTile.y * TILE_SIZE - 2;
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 3;
                ctx.strokeRect(px, py, TILE_SIZE + 2, TILE_SIZE + 2);
            }
            
            // Draw cursor
            const cursorPx = GRID_OFFSET_X + cursorX * TILE_SIZE - 2;
            const cursorPy = GRID_OFFSET_Y + cursorY * TILE_SIZE - 2;
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(cursorPx, cursorPy, TILE_SIZE + 2, TILE_SIZE + 2);
            ctx.setLineDash([]);
            
            // UI Panel
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(280, 60, 180, 200);
            
            // Score
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('SCORE', 290, 90);
            ctx.font = '24px Arial';
            ctx.fillStyle = '#ffff44';
            ctx.fillText(score.toString(), 290, 115);
            
            // Timer
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('TIME', 290, 150);
            ctx.font = '24px Arial';
            ctx.fillStyle = timeRemaining < 10 ? '#ff4444' : '#44ff44';
            ctx.fillText(Math.ceil(timeRemaining).toString(), 290, 175);
            
            // Combo
            if (combo > 1) {
                ctx.fillStyle = '#ff8844';
                ctx.font = 'bold 18px Arial';
                ctx.fillText(`${combo}x COMBO!`, 290, 200);
            }
            
            // Chef's Special
            ctx.font = '14px Arial';
            ctx.fillStyle = chefSpecialReady ? '#44ff44' : '#888';
            ctx.fillText('B: Chef\'s Special', 290, 230);
            if (!chefSpecialReady) {
                ctx.fillStyle = '#888';
                ctx.fillText(`(${Math.ceil(chefSpecialCooldown / 1000)}s)`, 290, 245);
            }
            
            // Rapid Drop indicator
            ctx.fillStyle = rapidDrop ? '#ff8844' : '#888';
            ctx.fillText('L/R: Rapid Drop', 290, 260);
        }
        
        function renderPauseMenu() {
            // Darken background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Menu box
            ctx.fillStyle = '#3d3d5c';
            ctx.fillRect(150, 80, 180, 160);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(150, 80, 180, 160);
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('PAUSED', CANVAS_WIDTH / 2, 110);
            
            const options = ['Resume', audioMuted ? 'Unmute' : 'Mute', 'Back to Menu'];
            ctx.font = '18px Arial';
            
            options.forEach((opt, i) => {
                if (i === menuSelection) {
                    ctx.fillStyle = '#ffff44';
                    ctx.fillText('> ' + opt + ' <', CANVAS_WIDTH / 2, 150 + i * 35);
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.fillText(opt, CANVAS_WIDTH / 2, 150 + i * 35);
                }
            });
        }
        
        function renderGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('TIME\'S UP!', CANVAS_WIDTH / 2, 120);
            
            ctx.font = '24px Arial';
            ctx.fillStyle = '#ffff44';
            ctx.fillText(`Final Score: ${score}`, CANVAS_WIDTH / 2, 160);
            
            if (maxCombo > 1) {
                ctx.fillStyle = '#ff8844';
                ctx.font = '18px Arial';
                ctx.fillText(`Max Combo: ${maxCombo}x`, CANVAS_WIDTH / 2, 190);
            }
            
            ctx.fillStyle = '#aaa';
            ctx.font = '16px Arial';
            ctx.fillText('Press A or START', CANVAS_WIDTH / 2, 240);
        }
        
        function renderParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
                ctx.globalAlpha = 1;
            });
        }
        
        // ==================== GAME LOOP ====================
        function gameLoop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            
            update(dt);
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        // ==================== GAME CONTROL ====================
        function startGame() {
            createGrid();
            score = 0;
            timeRemaining = GAME_TIME;
            combo = 0;
            maxCombo = 0;
            cursorX = 3;
            cursorY = 3;
            selectedTile = null;
            chefSpecialReady = true;
            chefSpecialCooldown = 0;
            gameOverReported = false;
            particles = [];
            fallingTiles = [];
            clearingTiles = [];
            gameState = STATE.PLAYING;
            AudioSys.startBGM();
        }
        
        // ==================== REQUIRED FUNCTIONS ====================
        function reportScore(score) {
            parent.postMessage({type: 'score', value: score}, '*');
        }
        
        function saveGameState() {
            const saveData = {
                score: score,
                maxCombo: maxCombo,
                timestamp: Date.now()
            };
            localStorage.setItem('munchboy_save_ingredientmatch', JSON.stringify(saveData));
        }
        
        function loadGameState() {
            const saved = localStorage.getItem('munchboy_save_ingredientmatch');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    console.log('Loaded save:', data);
                } catch(e) {
                    console.log('No valid save found');
                }
            }
        }
        
        // Start the game
        init();
    </script>
</body>
</html>
