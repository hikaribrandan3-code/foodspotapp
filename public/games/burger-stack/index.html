<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Burger Stack</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { 
            background: #1a1a2e; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #gameCanvas { 
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #F4E4C1 50%, #D4A574 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
            display: none;
        }
        #gameOver h2 { color: #F59E0B; margin-bottom: 10px; }
        #gameOver button {
            background: #22C55E;
            border: none;
            padding: 10px 20px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        #exitBtn { display: none !important; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div id="ui">SCORE: <span id="score">0</span> | HIGH: <span id="high">0</span></div>
    <div id="gameOver">
        <h2>BURGER COMPLETE!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">STACK AGAIN</button>
    </div>
    <button id="exitBtn" onclick="exitGame()">✕</button>

<script>
// Exit game function
function exitGame() {
    window.parent.postMessage({ type: 'GAME_EXIT', gameId: 'burger-stack' }, '*');
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game state
let gameState = 'playing'; // playing, paused, gameover
let score = 0;
let highScore = parseInt(localStorage.getItem('burgerStack_high') || '0');
let ingredients = [];
let currentIngredient = null;
let platform = { x: 140, y: 280, width: 200, height: 20 };

// Ingredient types
const TYPES = [
    { name: 'bottom_bun', color: '#D4A574', height: 25, width: 100, score: 10 },
    { name: 'lettuce', color: '#22C55E', height: 8, width: 110, score: 20 },
    { name: 'patty', color: '#7C2D12', height: 20, width: 105, score: 30 },
    { name: 'cheese', color: '#FCD34D', height: 5, width: 115, score: 25 },
    { name: 'tomato', color: '#DC2626', height: 12, width: 100, score: 20 },
    { name: 'onion', color: '#C084FC', height: 6, width: 108, score: 15 },
    { name: 'top_bun', color: '#D4A574', height: 30, width: 100, score: 50 }
];

let currentTypeIndex = 0;

// Physics
const GRAVITY = 0.5;
const BOUNCE = 0.3;

class Ingredient {
    constructor(type, x, y) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.width = type.width;
        this.height = type.height;
        this.vx = 0;
        this.vy = 0;
        this.isDropped = false;
        this.isSettled = false;
        this.swayOffset = Math.random() * Math.PI * 2;
    }

    update() {
        if (!this.isDropped) {
            // Sway animation
            this.swayOffset += 0.03;
            this.x = 240 + Math.sin(this.swayOffset) * 100 - this.width/2;
            return;
        }

        // Gravity
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        // Check collision with platform or other ingredients
        let landed = false;
        
        // Check platform
        if (this.y + this.height >= platform.y && 
            this.x + this.width > platform.x && 
            this.x < platform.x + platform.width &&
            ingredients.length === 0) {
            this.y = platform.y - this.height;
            this.vy = 0;
            this.vx = 0;
            this.isSettled = true;
            landed = true;
        }

        // Check other ingredients
        for (let other of ingredients) {
            if (other !== this && other.isSettled) {
                if (this.y + this.height >= other.y &&
                    this.y < other.y + other.height &&
                    this.x + this.width > other.x &&
                    this.x < other.x + other.width) {
                    
                    this.y = other.y - this.height;
                    this.vy = 0;
                    this.vx *= 0.5; // Friction
                    
                    if (Math.abs(this.vx) < 0.1) {
                        this.vx = 0;
                        this.isSettled = true;
                        landed = true;
                    }
                    break;
                }
            }
        }

        // Wall collision
        if (this.x < 0) { this.x = 0; this.vx *= -BOUNCE; }
        if (this.x + this.width > 480) { this.x = 480 - this.width; this.vx *= -BOUNCE; }

        // Game over if falls off screen
        if (this.y > 320) {
            gameOver();
        }

        // Score on land
        if (landed && !this.scored) {
            this.scored = true;
            score += this.type.score;
            document.getElementById('score').textContent = score;
            
            // Send score to parent
            window.parent.postMessage({ type: 'SCORE', score: score }, '*');
        }
    }

    draw() {
        ctx.fillStyle = this.type.color;
        
        // Draw ingredient with rounded corners
        ctx.beginPath();
        ctx.roundRect(this.x, this.y, this.width, this.height, 5);
        ctx.fill();
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(this.x + 2, this.y + this.height - 3, this.width - 4, 3);
        
        // Detail based on type
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        if (this.type.name === 'patty') {
            // Grill marks
            for (let i = 10; i < this.width - 10; i += 15) {
                ctx.fillRect(this.x + i, this.y + 5, 3, this.height - 10);
            }
        } else if (this.type.name === 'cheese') {
            // Drips
            ctx.beginPath();
            ctx.moveTo(this.x + 10, this.y + this.height);
            ctx.lineTo(this.x + 15, this.y + this.height + 8);
            ctx.lineTo(this.x + 20, this.y + this.height);
            ctx.fill();
        }
    }
}

function spawnIngredient() {
    if (currentTypeIndex >= TYPES.length) {
        // Completed burger!
        gameOver(true);
        return;
    }
    const type = TYPES[currentTypeIndex];
    currentIngredient = new Ingredient(type, 240 - type.width/2, 30);
    currentTypeIndex++;
}

function dropIngredient() {
    if (currentIngredient && !currentIngredient.isDropped) {
        currentIngredient.isDropped = true;
        ingredients.push(currentIngredient);
        
        // Slight random velocity
        currentIngredient.vx = (Math.random() - 0.5) * 2;
        
        setTimeout(spawnIngredient, 1000);
    }
}

function drawPlatform() {
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
    // Wood grain
    ctx.strokeStyle = '#654321';
    for (let i = 0; i < platform.width; i += 20) {
        ctx.beginPath();
        ctx.moveTo(platform.x + i, platform.y);
        ctx.lineTo(platform.x + i + 10, platform.y + platform.height);
        ctx.stroke();
    }
}

function drawGuide() {
    if (currentIngredient && !currentIngredient.isDropped) {
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(currentIngredient.x + currentIngredient.width/2, currentIngredient.y);
        ctx.lineTo(currentIngredient.x + currentIngredient.width/2, 320);
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

function gameLoop() {
    if (gameState === 'paused') return;
    
    // Clear
    ctx.clearRect(0, 0, 480, 320);
    
    // Draw background elements
    drawPlatform();
    drawGuide();
    
    // Update and draw ingredients
    ingredients.forEach(ing => {
        ing.update();
        ing.draw();
    });
    
    // Current ingredient
    if (currentIngredient && !currentIngredient.isDropped) {
        currentIngredient.update();
        currentIngredient.draw();
    }
    
    requestAnimationFrame(gameLoop);
}

function gameOver(completed = false) {
    gameState = 'gameover';
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('burgerStack_high', highScore);
        document.getElementById('high').textContent = highScore;
    }
    
    // Send final score
    window.parent.postMessage({ type: 'GAME_OVER', score: score, completed: completed }, '*');
    
    document.getElementById('finalScore').textContent = score;
    document.getElementById('gameOver').style.display = 'block';
}

function resetGame() {
    ingredients = [];
    currentIngredient = null;
    currentTypeIndex = 0;
    score = 0;
    document.getElementById('score').textContent = score;
    document.getElementById('gameOver').style.display = 'none';
    gameState = 'playing';
    spawnIngredient();
    gameLoop();
}

// Input handling
canvas.addEventListener('click', dropIngredient);
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    dropIngredient();
});

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') dropIngredient();
});

// PostMessage API
window.addEventListener('message', (e) => {
    switch(e.data.type) {
        case 'BUTTON_PRESS':
            if (e.data.button === 'a' || e.data.button === 'start') {
                dropIngredient();
            }
            if (e.data.button === 'select') {
                exitGame();
            }
            break;
        case 'PAUSE':
            gameState = 'paused';
            break;
        case 'RESUME':
            if (gameState === 'paused') {
                gameState = 'playing';
                gameLoop();
            }
            break;
        case 'SAVE_STATE':
            localStorage.setItem('burgerStack_state', JSON.stringify({
                ingredients: ingredients.map(i => ({...i})),
                score: score,
                currentTypeIndex: currentTypeIndex
            }));
            break;
        case 'LOAD_STATE':
            const saved = localStorage.getItem('burgerStack_state');
            if (saved) {
                // Would restore state here
                console.log('Load state not fully implemented');
            }
            break;
    }
});

// Init
document.getElementById('high').textContent = highScore;
spawnIngredient();
gameLoop();
</script>
</body>
</html>
