function initAC(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();}}
function startMusic(bpm=155){
  curBPM=bpm;beatInterval=60/bpm;stopMusic();if(!AC)return;
  const B=60/bpm;mnt=AC.currentTime+.05;bnt=AC.currentTime+.05;mi=0;bi=0;lastBeatTime=AC.currentTime;
  function sch(){
    while(mnt<AC.currentTime+.4){if(!muted&&MEL[mi%MEL.length]){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.value=MEL[mi%MEL.length];g.gain.setValueAtTime(.07,mnt);g.gain.exponentialRampToValueAtTime(.001,mnt+B*.7);o.start(mnt);o.stop(mnt+B);}mi++;mnt+=B;}
    while(bnt<AC.currentTime+.4){if(!muted&&BASS[bi%BASS.length]){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='triangle';o.frequency.value=BASS[bi%BASS.length];g.gain.setValueAtTime(.06,bnt);g.gain.exponentialRampToValueAtTime(.001,bnt+B*1.4);o.start(bnt);o.stop(bnt+B*2);}bi++;bnt+=B;}
    musT=setTimeout(sch,80);
  }sch();
}
function stopMusic(){if(musT)clearTimeout(musT);musT=null;}
function sfx(f,d,tp='square',v=.22,f2=null){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=tp;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}

// ═══ CONDIMENT DRIZZLE ═══
let drizzles=[];
class Drizzle{
  constructor(x,y,w,type){
    this.x=x;this.y=y;this.w=w;this.type=type;
    this.life=1;this.progress=0;
    this.col=type==='ketchup'?'#DD1111':type==='mustard'?'#E6C200':'#F5F5DC';
    this.pts=[];
    const segs=Math.floor(w/18)+2;
    for(let i=0;i<=segs;i++){this.pts.push({x:x+i*(w/segs),y:y+rnd(-5,5)});}
    this.bottleX=x+rnd(w*.1,w*.5);this.bottleY=y-32;this.bottleVy=-4;this.bottleDone=false;
  }
  update(){
    this.progress=Math.min(1,this.progress+.045);
    this.life-=.008;
    if(!this.bottleDone){this.bottleY+=this.bottleVy;this.bottleVy+=.8;if(this.bottleY>=this.y-18){this.bottleVy*=-.55;if(Math.abs(this.bottleVy)<1)this.bottleDone=true;}}
  }
  draw(){
    ctx.save();ctx.globalAlpha=Math.max(0,this.life);
    const totalPts=this.pts.length;const showPts=Math.floor(this.progress*(totalPts-1))+1;
    ctx.strokeStyle=this.col;ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(this.pts[0].x,this.pts[0].y);
    for(let i=1;i<showPts;i++){
      const mx=(this.pts[i-1].x+this.pts[i].x)/2,my=(this.pts[i-1].y+this.pts[i].y)/2;
      ctx.quadraticCurveTo(this.pts[i-1].x,this.pts[i-1].y,mx,my);
    }
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(this.pts[0].x,this.pts[0].y-1);
    for(let i=1;i<showPts;i++){ctx.lineTo(this.pts[i].x,this.pts[i].y-1);}
    ctx.stroke();
    if(!this.bottleDone){
      const bx=this.bottleX,by=this.bottleY;
      const icon=this.type==='ketchup'?'🍅':this.type==='mustard'?'🟡':'🤍';
      ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText(icon,bx,by);
      if(this.progress>.1){ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(bx,by+10,3,0,Math.PI*2);ctx.fill();}
    }
    ctx.restore();
  }
}
function spawnDrizzle(x,y,w,type){drizzles.push(new Drizzle(x,y,w,type));}
