<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Burger Stack</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #1a1a2e; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            font-family: 'Arial Black', Arial, sans-serif;
        }
        #gameCanvas { 
            background: linear-gradient(180deg, #2d1b4e 0%, #1a1a2e 100%);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .score { font-size: 32px; margin-bottom: 5px; }
        .high { font-size: 14px; color: #ffd700; }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="ui">
        <div class="score" id="score">0</div>
        <div class="high">BEST: <span id="high">0</></div>
    </div>
    <div class="controls" id="controls">TAP to stack | START for menu</div>

<script>
// ─── HIKARIBOY SETUP ─────────────────────────────────────────────
const isHikariBoy = window.parent !== window;
const SAFE_H = isHikariBoy ? window.innerHeight * 0.53 : window.innerHeight;

// ─── GAME SETUP ──────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive sizing
let W, H, scale;
function resize() {
    W = Math.min(390, window.innerWidth - 20);
    H = isHikariBoy ? Math.min(447, window.innerHeight * 0.53) : Math.min(844, window.innerHeight - 40);
    canvas.width = W;
    canvas.height = H;
    scale = W / 390;
}
resize();
window.addEventListener('resize', resize);

// ─── GAME STATE ──────────────────────────────────────────────────
let gameState = isHikariBoy ? 'playing' : 'start'; // Auto-start in HikariBoy
let score = 0;
let highScore = parseInt(localStorage.getItem('burgerStack_high')) || 0;
let ingredients = [];
let currentIngredient = null;
let falling = false;
let camera = 0;
let targetCamera = 0;

// Ingredient types
const types = [
    { name: 'bun', color: '#f4a460', height: 30, radius: 80 },
    { name: 'patty', color: '#8b4513', height: 25, radius: 78 },
    { name: 'cheese', color: '#ffd700', height: 8, radius: 82 },
    { name: 'lettuce', color: '#32cd32', height: 12, radius: 85 },
    { name: 'tomato', color: '#ff6347', height: 15, radius: 75 },
    { name: 'onion', color: '#dda0dd', height: 10, radius: 80 },
    { name: 'pickle', color: '#228b22', height: 8, radius: 72 },
    { name: 'bun_top', color: '#f4a460', height: 35, radius: 80 }
];
let currentTypeIndex = 0;

// ─── AUDIO ───────────────────────────────────────────────────────
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, duration, type = 'sine') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
const sounds = {
    drop: () => { playSound(200, 0.1, 'square'); playSound(150, 0.15, 'sawtooth'); },
    perfect: () => { playSound(880, 0.1); playSound(1100, 0.1); playSound(1320, 0.2); },
    slice: () => playSound(300, 0.15, 'sawtooth'),
    gameover: () => { playSound(300, 0.2); setTimeout(() => playSound(200, 0.3), 200); }
};

// ─── HIKARIBOY BUTTON SUPPORT ────────────────────────────────────
window.addEventListener('message', (e) => {
    if (e.data?.type !== 'BUTTON_PRESS') return;
    const btn = e.data.button;
    
    // START - pause/menu
    if (btn === 'start') {
        if (gameState === 'start') {
            startGame();
        } else if (gameState === 'playing') {
            gameState = 'paused';
        } else if (gameState === 'paused') {
            gameState = 'playing';
        } else if (gameState === 'gameover') {
            startGame();
        }
        return;
    }
    
    // A button - drop ingredient
    if (btn === 'a') {
        if (gameState === 'start') startGame();
        else if (gameState === 'playing' && !falling) dropIngredient();
        else if (gameState === 'gameover') startGame();
        return;
    }
    
    // SELECT - exit (HikariBoy only)
    if (btn === 'select' && isHikariBoy) {
        window.parent.postMessage({ type: 'GAME_EXIT', gameId: 'burger-stack' }, '*');
        return;
    }
});

// ─── INPUT ───────────────────────────────────────────────────────
function handleInput(e) {
    e.preventDefault();
    if (gameState === 'start') startGame();
    else if (gameState === 'playing' && !falling) dropIngredient();
    else if (gameState === 'gameover') startGame();
}
canvas.addEventListener('pointerdown', handleInput);
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') handleInput(e);
});

// ─── GAME LOGIC ──────────────────────────────────────────────────
function startGame() {
    score = 0;
    ingredients = [];
    currentIngredient = null;
    falling = false;
    camera = 0;
    targetCamera = 0;
    currentTypeIndex = 0;
    document.getElementById('score').textContent = score;
    document.getElementById('high').textContent = highScore;
    gameState = 'playing';
    
    // Base bun
    ingredients.push({
        x: W/2 - 80,
        y: H - 100,
        width: 160,
        height: 30,
        color: types[0].color,
        type: 0
    });
    
    spawnIngredient();
}

function spawnIngredient() {
    const type = types[currentTypeIndex % types.length];
    const prev = ingredients[ingredients.length - 1];
    currentIngredient = {
        x: Math.random() * (W - type.radius * 2) + type.radius,
        y: 120 + camera,
        targetY: prev ? prev.y - type.height - 5 : H - 100,
        width: prev ? prev.width : type.radius * 2,
        height: type.height,
        color: type.color,
        type: currentTypeIndex % types.length,
        speed: 2 + score * 0.1,
        direction: Math.random() > 0.5 ? 1 : -1
    };
    currentTypeIndex++;
}

function dropIngredient() {
    if (!currentIngredient || falling) return;
    falling = true;
    sounds.drop();
}

function update() {
    // Camera smoothing
    camera += (targetCamera - camera) * 0.1;
    
    if (gameState !== 'playing') return;
    
    // Move current ingredient
    if (currentIngredient && !falling) {
        currentIngredient.x += currentIngredient.speed * currentIngredient.direction;
        if (currentIngredient.x <= 0 || currentIngredient.x + currentIngredient.width >= W) {
            currentIngredient.direction *= -1;
        }
    }
    
    // Falling
    if (falling && currentIngredient) {
        const prev = ingredients[ingredients.length - 1];
        const dropSpeed = 8;
        currentIngredient.y += dropSpeed;
        
        if (currentIngredient.y >= currentIngredient.targetY) {
            // Check alignment
            const overlap = Math.max(0, 
                Math.min(currentIngredient.x + currentIngredient.width, prev.x + prev.width) -
                Math.max(currentIngredient.x, prev.x)
            );
            
            if (overlap < 10) {
                // Missed - game over
                sounds.gameover();
                gameState = 'gameover';
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('burgerStack_high', highScore);
                }
                window.parent.postMessage({ type: 'GAME_OVER', score: score }, '*');
                return;
            }
            
            // Calculate slice
            const leftDiff = currentIngredient.x - prev.x;
            const rightDiff = (currentIngredient.x + currentIngredient.width) - (prev.x + prev.width);
            
            if (Math.abs(leftDiff) > 5 || Math.abs(rightDiff) > 5) {
                sounds.slice();
                // Trim the ingredient
                if (leftDiff < 0) {
                    currentIngredient.width += leftDiff;
                    currentIngredient.x = prev.x;
                }
                if (rightDiff > 0) {
                    currentIngredient.width -= rightDiff;
                }
            } else {
                sounds.perfect();
                currentIngredient.x = prev.x;
                currentIngredient.width = prev.width;
            }
            
            // Lock in place
            currentIngredient.y = currentIngredient.targetY;
            ingredients.push({...currentIngredient});
            score++;
            document.getElementById('score').textContent = score;
            
            // Report score
            window.parent.postMessage({ type: 'SCORE', score: score }, '*');
            
            // Camera follow
            if (ingredients.length > 5) {
                targetCamera += currentIngredient.height + 5;
            }
            
            falling = false;
            spawnIngredient();
        }
    }
}

// ─── RENDER ──────────────────────────────────────────────────────
function draw() {
    // Clear
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#2d1b4e');
    grad.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Draw ingredients (with camera offset)
    ctx.save();
    ctx.translate(0, -camera);
    
    ingredients.forEach((ing, i) => {
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(ing.x + 3, ing.y + 3, ing.width, ing.height);
        
        // Ingredient
        ctx.fillStyle = ing.color;
        ctx.fillRect(ing.x, ing.y, ing.width, ing.height);
        
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(ing.x, ing.y, ing.width, ing.height * 0.3);
        
        // Border
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(ing.x, ing.y, ing.width, ing.height);
    });
    
    // Draw current ingredient
    if (currentIngredient && gameState === 'playing') {
        // Guide line
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(currentIngredient.x + currentIngredient.width/2, currentIngredient.y);
        ctx.lineTo(currentIngredient.x + currentIngredient.width/2, currentIngredient.targetY);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Ingredient
        ctx.fillStyle = currentIngredient.color;
        ctx.fillRect(currentIngredient.x, currentIngredient.y, currentIngredient.width, currentIngredient.height);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(currentIngredient.x, currentIngredient.y, currentIngredient.width, currentIngredient.height * 0.3);
        ctx.strokeStyle = falling ? '#ff0' : '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(currentIngredient.x, currentIngredient.y, currentIngredient.width, currentIngredient.height);
    }
    
    ctx.restore();
    
    // UI overlays
    if (gameState === 'start') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('BURGER STACK', W/2, H/2 - 40);
        ctx.font = '16px Arial';
        ctx.fillText(isHikariBoy ? 'Press START to play' : 'Tap to start', W/2, H/2 + 20);
        ctx.textAlign = 'left';
    } else if (gameState === 'paused') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', W/2, H/2);
        ctx.textAlign = 'left';
    } else if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff3860';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, H/2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '24px Arial';
        ctx.fillText('Score: ' + score, W/2, H/2 + 10);
        if (score === highScore && score > 0) {
            ctx.fillStyle = '#ffd700';
            ctx.font = '18px Arial';
            ctx.fillText('NEW HIGH SCORE!', W/2, H/2 + 40);
        }
        ctx.fillStyle = '#aaa';
        ctx.font = '14px Arial';
        ctx.fillText(isHikariBoy ? 'Press START to restart' : 'Tap to restart', W/2, H/2 + 80);
        ctx.textAlign = 'left';
    }
    
    // Safe zone indicator (HikariBoy only)
    if (isHikariBoy) {
        ctx.fillStyle = 'rgba(0,200,255,0.15)';
        ctx.fillRect(0, H - 5, W, 5);
    }
}

// ─── LOOP ────────────────────────────────────────────────────────
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// ─── INIT ────────────────────────────────────────────────────────
document.getElementById('high').textContent = highScore;
if (isHikariBoy) {
    document.getElementById('controls').textContent = 'A=drop | START=menu | SELECT=exit';
    startGame(); // Auto-start in HikariBoy
} else {
    document.getElementById('controls').textContent = 'TAP to stack | SPACE to pause';
}
loop();
</script>
</body>
</html>
