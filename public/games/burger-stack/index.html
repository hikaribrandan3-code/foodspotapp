function initAC(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();}}
function startMusic(bpm=155){
  curBPM=bpm;beatInterval=60/bpm;stopMusic();if(!AC)return;
  const B=60/bpm;mnt=AC.currentTime+.05;bnt=AC.currentTime+.05;mi=0;bi=0;lastBeatTime=AC.currentTime;
  function sch(){
    while(mnt<AC.currentTime+.4){if(!muted&&MEL[mi%MEL.length]){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.value=MEL[mi%MEL.length];g.gain.setValueAtTime(.07,mnt);g.gain.exponentialRampToValueAtTime(.001,mnt+B*.7);o.start(mnt);o.stop(mnt+B);}mi++;mnt+=B;}
    while(bnt<AC.currentTime+.4){if(!muted&&BASS[bi%BASS.length]){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='triangle';o.frequency.value=BASS[bi%BASS.length];g.gain.setValueAtTime(.06,bnt);g.gain.exponentialRampToValueAtTime(.001,bnt+B*1.4);o.start(bnt);o.stop(bnt+B*2);}bi++;bnt+=B;}
    musT=setTimeout(sch,80);
  }sch();
}

// ═══ CONDIMENT DRIZZLE ═══
let drizzles=[];
class Drizzle{
  constructor(x,y,w,type){
    this.x=x;this.y=y;this.w=w;this.type=type;
    this.life=1;this.progress=0;
    this.col=type==='ketchup'?'#DD1111':type==='mustard'?'#E6C200':'#F5F5DC';
    this.pts=[];
    const segs=Math.floor(w/18)+2;
    for(let i=0;i<=segs;i++){this.pts.push({x:x+i*(w/segs),y:y+rnd(-5,5)});}
    this.bottleX=x+rnd(w*.1,w*.5);this.bottleY=y-32;this.bottleVy=-4;this.bottleDone=false;
  }
  update(){
    this.progress=Math.min(1,this.progress+.045);
    this.life-=.008;
    if(!this.bottleDone){this.bottleY+=this.bottleVy;this.bottleVy+=.8;if(this.bottleY>=this.y-18){this.bottleVy*=-.55;if(Math.abs(this.bottleVy)<1)this.bottleDone=true;}}
  }
  draw(){
    ctx.save();ctx.globalAlpha=Math.max(0,this.life);
    const totalPts=this.pts.length;const showPts=Math.floor(this.progress*(totalPts-1))+1;
    ctx.strokeStyle=this.col;ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(this.pts[0].x,this.pts[0].y);
    for(let i=1;i<showPts;i++){
      const mx=(this.pts[i-1].x+this.pts[i].x)/2,my=(this.pts[i-1].y+this.pts[i].y)/2;
      ctx.quadraticCurveTo(this.pts[i-1].x,this.pts[i-1].y,mx,my);
    }
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(this.pts[0].x,this.pts[0].y-1);
    for(let i=1;i<showPts;i++){ctx.lineTo(this.pts[i].x,this.pts[i].y-1);}
    ctx.stroke();
    if(!this.bottleDone){
      const bx=this.bottleX,by=this.bottleY;
      const icon=this.type==='ketchup'?'🍅':this.type==='mustard'?'🟡':'🤍';
      ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText(icon,bx,by);
      if(this.progress>.1){ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(bx,by+10,3,0,Math.PI*2);ctx.fill();}
    }
    ctx.restore();
  }
}
function spawnDrizzle(x,y,w,type){drizzles.push(new Drizzle(x,y,w,type));}

// ═══ SIDE COMBO COUNTER ═══
let sideCombo={active:false,val:0,timer:0,phase:'in',x:W+60,targetX:W-72,col:'#fff',hue:0,shards:[]};
const COMBO_COLS=['#fff','#FFD700','#FF9A3C','#FF3860','#E040FB','#00E5FF'];
function triggerSideCombo(val){
  const ci=Math.min(val-2,COMBO_COLS.length-1);
  const col=val>=8?`hsl(${feverHue},100%,65%)`:COMBO_COLS[ci];
  sideCombo={active:true,val,timer:90,phase:'in',x:W+60,targetX:W-72,col,hue:feverHue,shards:[]};
}
function updateDrawSideCombo(){
  if(!sideCombo.active)return;
  sideCombo.timer--;
  if(sideCombo.phase==='in'){sideCombo.x+=(sideCombo.targetX-sideCombo.x)*.28;if(Math.abs(sideCombo.x-sideCombo.targetX)<2){sideCombo.x=sideCombo.targetX;sideCombo.phase='hold';}}
  if(sideCombo.phase==='hold'&&sideCombo.timer<22){sideCombo.phase='shatter';
    for(let i=0;i<8;i++)sideCombo.shards.push({x:sideCombo.x,y:SAFE_H*.38,vx:rnd(-6,6),vy:rnd(-8,-2),r:rnd(0,Math.PI*2),life:1,col:sideCombo.col});}
  if(sideCombo.phase==='shatter'){sideCombo.shards.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.4;s.r+=.15;s.life-=.06;});if(sideCombo.shards.every(s=>s.life<=0))sideCombo.active=false;}
  if(sideCombo.timer<=0)sideCombo.active=false;
  const cx=sideCombo.x,cy=SAFE_H*.38;
  if(sideCombo.phase!=='shatter'){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(bgTime*1.2);
    const rays=10,col=sideCombo.val>=8?`hsl(${(sideCombo.hue+bgTime*60)%360},100%,60%)`:sideCombo.col;
    ctx.fillStyle=col;ctx.globalAlpha=.35;
    for(let i=0;i<rays;i++){const a=i/rays*Math.PI*2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*36,Math.sin(a)*36);ctx.lineTo(Math.cos(a+Math.PI/rays)*20,Math.sin(a+Math.PI/rays)*20);ctx.closePath();ctx.fill();}
    ctx.restore();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(-.18);
    ctx.font='900 28px Arial Black';ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=7;ctx.strokeText(`${sideCombo.val}×`,0,8);
    ctx.fillStyle=sideCombo.val>=8?`hsl(${(sideCombo.hue+120)%360},100%,65%)`:sideCombo.col;
    ctx.fillText(`${sideCombo.val}×`,0,8);
    ctx.font='900 10px Arial Black';ctx.strokeText('COMBO',0,22);ctx.fillStyle='#fff';ctx.fillText('COMBO',0,22);
    ctx.restore();
  }
  sideCombo.shards.forEach(s=>{if(s.life<=0)return;ctx.save();ctx.globalAlpha=Math.max(0,s.life);ctx.translate(s.x,s.y);ctx.rotate(s.r);ctx.fillStyle=s.col;ctx.fillRect(-8,-4,16,8);ctx.restore();});
}

function triggerSpeedLines(dur=18){speedLinesActive=dur;speedLinesTimer=dur;}
function drawSpeedLines(){
  if(speedLinesActive<=0)return;
  const prog=speedLinesActive/speedLinesTimer;
  ctx.save();ctx.globalAlpha=prog*.52;
  const cx=W/2,cy=SAFE_H*.42,n=32+Math.min(combo*2,30);
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2,inner=rnd(18,40)*prog,outer=rnd(W*.5,W*.85);
    ctx.strokeStyle=feverMode?`hsl(${(feverHue+i*8)%360},100%,75%)`:'#fff';
    ctx.lineWidth=rnd(.5,2.5)*prog;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*inner,cy+Math.sin(a)*inner);ctx.lineTo(cx+Math.cos(a)*outer,cy+Math.sin(a)*outer);ctx.stroke();
  }
  ctx.restore();speedLinesActive--;
}

const KANJI_FOOD=['食','旨','激','炎','辛','超','爆','熱','神','鬼'];
const ANIME_WORDS=['UMAI!!','SUGOI!','NANI!?','YATTA!','MAJI?!','IKUZO!'];

class FloatKanji{
  constructor(x,y,txt,col,sz,isWord=false){this.x=x;this.y=y;this.txt=txt;this.col=col;this.sz=sz;this.life=1;this.vy=rnd(-1.8,-.8);this.vx=rnd(-1,1);this.rot=rnd(-.3,.3);this.isWord=isWord;}
  update(){this.y+=this.vy;this.x+=this.vx;this.life-=.014;}
  draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot*(1-this.life));ctx.font=`900 ${this.sz}px Arial Black`;ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=this.isWord?6:4;ctx.strokeText(this.txt,0,0);ctx.fillStyle=this.col;ctx.fillText(this.txt,0,0);ctx.restore();}
}
class BgKanji{
  constructor(){this.x=rnd(20,W-20);this.y=rnd(SAFE_H*.6,SAFE_H*.8);this.txt=BG_KANJI[Math.floor(rnd(0,BG_KANJI.length))];this.sz=rnd(14,28);this.alpha=rnd(.04,.12);this.vy=rnd(-.4,-.15);this.life=1;this.col=feverMode?`hsl(${Math.floor(rnd(0,360))},100%,70%)`:'rgba(180,100,20,1)';}
  update(){this.y+=this.vy;this.life-=.004;}
  draw(){ctx.save();ctx.globalAlpha=this.life*this.alpha*(feverMode?2.5:1);ctx.font=`900 ${this.sz}px Arial Black`;ctx.textAlign='center';ctx.fillStyle=this.col;ctx.fillText(this.txt,this.x,this.y);ctx.restore();}
}

function drawHalftone(alpha=0.06,col='#8B4513'){
  halftonePhase+=.012;
  const sp=isHikariBoy?14:16;
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=col;
  for(let row=0;row<Math.ceil(COUNTER_Y/sp);row++){
    for(let c=0;c<Math.ceil(W/sp);c++){
      const ox=(row%2===0)?0:sp/2,pulse=Math.sin(halftonePhase+row*.18+c*.12)*.5+.5;
      ctx.beginPath();ctx.arc(c*sp+ox,row*sp,1.2+pulse*1.8,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

class ScoreTicker{
  constructor(pts,x,y){this.pts=pts;this.x=x;this.y=y;this.life=1;this.w=0;this.vy=-1.2;this.targetW=pts>3?88:64;}
  update(){this.y+=this.vy;this.vy*=.96;this.life-=.022;this.w=Math.min(this.w+8,this.targetW);}
  draw(){
    if(this.life<=0)return;
    ctx.save();ctx.globalAlpha=this.life;
    const col=this.pts>=4?'#FF3860':this.pts>=2?'#FF6B00':'#FFD700';
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x+this.w,this.y);ctx.lineTo(this.x+this.w+8,this.y+12);ctx.lineTo(this.x+this.w,this.y+24);ctx.lineTo(this.x,this.y+24);ctx.lineTo(this.x+8,this.y+12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`900 ${this.pts>=4?18:14}px Arial Black`;ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(`+${this.pts}`,this.x+this.w/2+4,this.y+17);ctx.fillText(`+${this.pts}`,this.x+this.w/2+4,this.y+17);
    ctx.restore();
  }
}

function drawStackAura(){
  if(!stack.length||combo<2)return;
  auraPhase+=.07;
  const top=stack[stack.length-1],bot=stack[0];
  const auraH=bot.y-top.y+BH,auraX=top.x,auraW=top.width;
  const intensity=Math.min(combo/10,1),pulseR=intensity*(12+Math.sin(auraPhase)*5);
  const auraCol=combo>=20?`hsl(${feverHue%360},100%,65%)`:combo>=10?'#FFD700':combo>=5?'#FF6B00':'#00E5FF';
  ctx.save();
  for(let i=3;i>=1;i--){
    ctx.globalAlpha=(intensity*.25/i)*(Math.sin(auraPhase*1.3)+1.2)*.5;
    ctx.strokeStyle=auraCol;ctx.lineWidth=pulseR*i;
    ctx.beginPath();ctx.roundRect(auraX-pulseR*i*.5,top.y-pulseR*i*.5,auraW+pulseR*i,auraH+pulseR*i,8);ctx.stroke();
  }
  if(combo>=10&&Math.random()>.5){
    const px=auraX+rnd(0,auraW);
    parts.push({x:px,y:top.y,vx:rnd(-1.5,1.5),vy:rnd(-5,-2),life:1,col:auraCol,
      update(){this.x+=this.vx;this.y+=this.vy;this.vy*=.92;this.life-=.04;},
      draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life*.6);ctx.fillStyle=this.col;ctx.beginPath();ctx.ellipse(this.x,this.y,3,8,0,0,Math.PI*2);ctx.fill();ctx.restore();}
    });
  }
  ctx.restore();
}

function drawFeverHalftone(){
  if(!feverMode)return;
  halftoneOffset+=2.5;const sp=10;
  ctx.save();ctx.globalAlpha=.18+Math.sin(bgTime*6)*.06;
  for(let row=0;row<Math.ceil(SAFE_H/sp);row++){
    for(let c=0;c<Math.ceil(W/sp);c++){
      const ox=(row%2===0)?0:sp/2,hue=(feverHue+row*4+c*3+halftoneOffset)%360,pulse=Math.sin(halftoneOffset*.08+row*.22+c*.18)*.5+.5;
      ctx.fillStyle=`hsl(${hue},100%,60%)`;ctx.beginPath();ctx.arc(c*sp+ox,row*sp,1+pulse*2.2,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

// ═══ INPUT — TOUCH / MOUSE / KEYBOARD ═══
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=canvas.getBoundingClientRect();handleInput((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));},{passive:false});

document.addEventListener('keydown',e=>{
  if(e.code==='KeyA'||e.code==='Space'){e.preventDefault();handleInput(-1,-1,true);}
  if(e.code==='Enter'){e.preventDefault();initAC();if(gs==='start')startCD();else if(gs==='playing'){gs='paused';stopMusic();}else if(gs==='paused'){gs='playing';startMusic(feverMode?192:curBPM);}else if(gs==='gameover')gs='start';}

});

// ═══ HIKARIBOY BUTTON PROTOCOL ═══
window.addEventListener('message',e=>{
  if(e.data?.type==='BUTTON_PRESS'){
    const btn=e.data.button;
    if(btn==='start'){
      initAC();if(AC&&AC.state==='suspended')AC.resume();
      if(gs==='start'||gs==='countdown')startCD();
      else if(gs==='playing'){gs='paused';stopMusic();}
      else if(gs==='paused'){gs='playing';startMusic(feverMode?192:curBPM);}
      else if(gs==='gameover'){gs='start';}
    }
    if(btn==='a'){
      initAC();if(AC&&AC.state==='suspended')AC.resume();
      if(gs==='start')startCD();
      else if(gs==='playing')dropBlock();
      else if(gs==='gameover'){gs='start';}
    }
    if(btn==='select'&&isHikariBoy){
      window.parent.postMessage({type:'GAME_EXIT',gameId:'burger-stack'},'*');
    }
  }
});

function handleInput(x,y,kb=false){
  initAC();if(AC&&AC.state==='suspended')AC.resume();
  if(!kb){const btnSz=isHikariBoy?64:58;if(x<btnSz&&y<btnSz){muted=!muted;if(!muted&&gs==='playing')startMusic(feverMode?192:curBPM);return;}if(x>W-btnSz&&y<btnSz){if(gs==='playing'){gs='paused';stopMusic();}else if(gs==='paused'){gs='playing';startMusic(feverMode?192:curBPM);}return;}}
  if(gs==='slot')return;
  switch(gs){case'start':startCD();break;case'playing':dropBlock();break;case'paused':gs='playing';startMusic(feverMode?192:curBPM);break;case'gameover':gs='start';break;}
}
function startCD(){
  gs='countdown';cdVal=3;resetGame();sfx(880,.12,'sine',.3);
  if(cdTimer)clearInterval(cdTimer);
  cdTimer=setInterval(()=>{cdVal--;if(cdVal>0)sfx(880,.12,'sine',.3);else{clearInterval(cdTimer);[1047,1319,1568,2093].forEach((f,i)=>setTimeout(()=>sfx(f,.15,'sine',.35),i*80));gs='playing';startMusic();}},1000);
}
function dropBlock(){
  if(!cur||dropping||gs!=='playing')return;
  if(AC){const now=AC.currentTime,bp=((now-lastBeatTime)%beatInterval)/beatInterval;if(bp>0.85){const delay=(1-bp)*beatInterval*1000;setTimeout(()=>{if(cur&&gs==='playing'){dropping={...cur};cur=null;sndDrop();vibe(40);if(dropping.width<INIT_BW*.5)setMascot('scared');}},delay);return;}}
  dropping={...cur};cur=null;sndDrop();vibe(40);if(dropping.width<INIT_BW*.5)setMascot('scared');
}

function update(){
  bgTime+=.004;feverHue=(feverHue+3)%360;
  if(slowMoTimer>0){slowMoTimer--;if(slowMoTimer===0)pendingSlowMo=false;}
  if(punchT>0){punchT--;punchScale+=(1-punchScale)*.35;}else punchScale=1;
  if(burstTimer>0){burstTimer--;if(burstTimer===0)burstMult=1;}
  if(shrinkWarnTimer>0)shrinkWarnTimer--;
  kanjiFloats=kanjiFloats.filter(k=>{k.update();return k.life>0;});
  dmgNumbers=dmgNumbers.filter(d=>{d.update();return d.life>0;});
  scoreTickers=scoreTickers.filter(s=>{s.update();return s.life>0;});
  if(gs==='slot'){slotTimer++;const stops=[38,68,98];for(let i=0;i<3;i++){if(!slotDone[i]){if(slotTimer<stops[i])slotVals[i]=(slotVals[i]+.45)%5;else{slotVals[i]=slotTarget[i];slotDone[i]=true;sndCoin();}}}if(slotDone[2]&&slotTimer>118)applySlotReward();updateParticles();return;}
  if(milestoneActive){milestoneTimer--;if(milestoneTimer<=0)milestoneActive=false;updateParticles();return;}
  if(failPhase>0){const el=Date.now()-failTimer;if(failPhase===1){shakeOff=Math.sin(el*.05)*12*(1-el/300);if(el>300){failPhase=2;shakeOff=0;}}else if(failPhase===2){fallBlocks.forEach(b=>{b.vy+=.65;b.x+=b.vx;b.y+=b.vy;b.r+=b.rs;});if(el>900)failPhase=3;}else if(failPhase===3){if(el>1400){gs='gameover';failPhase=0;fallBlocks=[];}}updateParticles();return;}
  if(comboT>0)comboT--;
  if(gs!=='playing'&&gs!=='countdown'){updateParticles();return;}
  camY+=(tgtCam-camY)*.1;shakeAmt*=.85;shakeOff=shakeAmt>.3?(Math.random()-.5)*shakeAmt*2:0;swayPhase+=.018;
  if(feverMode){feverTimer--;if(feverTimer<=0){feverMode=false;setMascot('happy',60);stopMusic();startMusic(155+(level-1)*10);ftxt(W/2,SAFE_H*.45,'Fever over...','#aaa',18);}if(Math.random()>.75&&cur)parts.push(new Sparkle(cur.x+rnd(0,cur.width),cur.y+rnd(0,cur.height),`hsl(${feverHue},100%,60%)`));}
  for(let i=slices.length-1;i>=0;i--){const s=slices[i];s.vy+=.5;s.x+=s.vx;s.y+=s.vy;s.r+=s.rs;s.alpha-=.024;if(s.alpha<=0)slices.splice(i,1);}
  if(flash>0)flash-=.05;
  updateParticles();
  if(gs!=='playing')return;
  if(cur){
    cur.age=(cur.age||0)+1;if(spawnWobble>0.01)spawnWobble*=.82;else spawnWobble=0;
    if(cur.x<=12||cur.x+cur.width>=W-12)setMascot('scared',18);
    const spd=cur.speed*(burstTimer>0?burstMult:1)*(pendingSlowMo&&slowMoTimer>0?.42:1);
    cur.x+=cur.dir*spd;if(cur.x<=0){cur.x=0;cur.dir=1;}else if(cur.x+cur.width>=W){cur.x=W-cur.width;cur.dir=-1;}
    trailPos.unshift({x:cur.x,y:cur.y});if(trailPos.length>TRAIL_LEN)trailPos.pop();
  }
  if(dropping){const top=stack[stack.length-1];dropping.y+=DROP_SPD;if(dropping.y>=top.y-BH){dropping.y=top.y-BH;placeBlock();}}
}
function updateParticles(){
  drizzles=drizzles.filter(d=>{d.update();return d.life>0;});
  smokeRings=smokeRings.filter(s=>{s.update();s.draw();return s.life>0;});
  parts=parts.filter(p=>{p.update();return p.life>0;});floats=floats.filter(f=>{f.update();return f.life>0;});
  coins=coins.filter(c=>{c.update();return c.life>0;});fworks=fworks.filter(f=>{f.update();return !f.done;});
}

function placeBlock(){
  const top=stack[stack.length-1],d=dropping;
  const ol=Math.max(d.x,top.x),or2=Math.min(d.x+d.width,top.x+top.width),ow=or2-ol;
  if(ow<=0){triggerFail();return;}
  const isPerfect=Math.abs(d.x-top.x)<=PERF&&Math.abs(d.width-top.width)<=PERF;
  const col=ING[d.ii%ING.length].c;
  ticketIngredients.push(d.ii%ING.length);
  for(let i=0;i<5;i++)parts.push(new FoodBit(d.x+rnd(0,d.width),d.y,col));
  if(isPerfect){
    if(ING[d.ii%ING.length].patty){for(let i=0;i<3;i++)setTimeout(()=>smokeRings.push(new SmokeRing(d.x+rnd(d.width*.2,d.width*.8),d.y)),i*120);const bx1=W/2-55,bx2=W/2+55;for(let i=0;i<8;i++){flameLicks.push(new FlameLick(bx1,COUNTER_Y-8));flameLicks.push(new FlameLick(bx2,COUNTER_Y-8));}}
    const drizzleTypes=['ketchup','mustard','mayo'];
    const dt=feverMode?drizzleTypes:drizzleTypes.slice(0,1+(combo>3?1:0)+(combo>6?1:0));
    dt.forEach((t,i)=>setTimeout(()=>spawnDrizzle(d.x,d.y+BH*.3,ow,t),i*140));
    if(combo>=2)triggerSideCombo(combo);
    streak++;combo++;if(combo>maxCombo)maxCombo=combo;
    flash=1;flashCol='255,255,100';sndPerfect();shakeAmt=2;setMascot('star',90);crowdCheer();
    confettiBurst(d.x+d.width/2,d.y,feverMode?90:55);sparkleBurst(d.x+d.width/2,d.y,col,14);coinShower(d.x+d.width/2,d.y,feverMode?14:8);
    ftxt(d.x+d.width/2,d.y-22,'✨ PERFECT!','#FFD700',26);vibe([20,10,50]);burstTimer=18;burstMult=1.35;
    triggerSpeedLines(14);spawnKanji(d.x+d.width/2,d.y-55);spawnAnimeWord(d.x+d.width/2+rnd(-30,30),d.y-80);showReaction('perfect');
    rival.angry=false;
    if(combo===5&&!feverMode)activateFever();
    else if(combo===10){comboCallout='💥 x10 COMBO!';comboT=90;screenPunch();triggerImpactFrame(0);showReaction('combo');triggerSpeedLines(25);}
    else if(combo===20){comboCallout='🌟 x20 INSANE!';comboT=100;screenPunch();triggerImpactFrame(1);showReaction('combo');}
    else if(combo>1)ftxt(d.x+d.width/2,d.y-52,`×${combo}`,'#FF6B00',20);
    rivalSay(R_GOOD);rival.reactT=60;
    stack.push({x:top.x,y:d.y,width:top.width,height:BH,ii:d.ii,glow:feverMode?2:1,squash:.9});
  }else{
    streak=0;combo=0;burstTimer=0;burstMult=1;flash=1;flashCol='255,80,80';
    sndSlice();shakeAmt=5;setMascot('scared',70);crowdBoo();sparkleBurst(d.x+d.width/2,d.y,col,8);rival.angry=true;rivalSay(R_BAD);rival.reactT=60;
    vibe(80);triggerImpactFrame(1);showReaction('miss');spawnKanji(d.x+d.width/2,d.y-40,true);
    stack.push({x:ol,y:d.y,width:ow,height:BH,ii:d.ii,glow:.5,squash:.65});
    if(d.x<top.x)slices.push({x:d.x,y:d.y,width:top.x-d.x,height:BH,col,vx:-2.5,vy:0,r:0,rs:-.12,alpha:1});
    if(d.x+d.width>top.x+top.width)slices.push({x:top.x+top.width,y:d.y,width:(d.x+d.width)-(top.x+top.width),height:BH,col,vx:2.5,vy:0,r:0,rs:.12,alpha:1});
  }
  const pts=1+Math.floor(combo/3);score+=pts;
  scoreTickers.push(new ScoreTicker(pts,d.x+d.width/2-32,d.y-30));
  dmgNumbers.push(new DamageNumber(d.x+d.width/2+rnd(-20,20),d.y-18,pts,pts>=4?'#FF3860':pts>=2?'#FF9A3C':'#FFD700'));
  stackH=stack.length-1;
  const oL=level;if(score>LVL2)level=3;else if(score>LVL1)level=2;
  if(level!==oL){ftxt(W/2,SAFE_H/2-90,'RUSH HOUR! 🍳','#FFD700',30);stopMusic();startMusic(feverMode?192:155+(level-1)*12);triggerSpeedLines(20);}
  curSpd=Math.min(7.5,2.4+(score*.065));
  if(stack[stack.length-1].width<5){triggerFail();return;}
  checkMilestone();
  if(score>=nextSlotScore&&!feverMode){startSlot();return;}
  dropping=null;spawnBlock();
}
function triggerFail(){
  sndOver();failPhase=1;failTimer=Date.now();shakeAmt=15;setMascot('sad',999);stopMusic();feverMode=false;crowdBoo();rivalSay(R_OVER);rival.reactT=999;rival.angry=true;
  vibe([50,30,50,30,100]);triggerImpactFrame(1);showReaction('fail');
  for(let i=0;i<5;i++)setTimeout(()=>spawnKanji(rnd(80,W-80),SAFE_H*.4,true),i*100);
  stack.slice(-5).forEach((b,i)=>fallBlocks.push({...b,vx:(Math.random()-.5)*7,vy:-3.5-i,r:0,rs:(Math.random()-.5)*.32}));dropping=null;cur=null;
  if(score>highScore){highScore=score;localStorage.setItem('bs_hi',highScore);}
}

function drawCRT(){
  for(let y=0;y<H;y+=3){ctx.fillStyle='rgba(0,0,0,.04)';ctx.fillRect(0,y,W,1);}
  const vg=ctx.createRadialGradient(W/2,H/2,H*.22,W/2,H/2,H*.76);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.3)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(feverMode){ctx.fillStyle=`rgba(255,120,0,${.04+.02*Math.sin(bgTime*8)})`;ctx.fillRect(0,0,W,H);}
}

function render(){
  ctx.save();
  if(punchScale!==1){ctx.translate(W/2,SAFE_H/2);ctx.scale(punchScale,punchScale);ctx.translate(-W/2,-SAFE_H/2);}
  if(CAM_SHIFT!==0)ctx.translate(0,CAM_SHIFT);
  drawBG();
  if(flash>0){ctx.fillStyle=`rgba(${flashCol},${flash*.22})`;ctx.fillRect(0,0,W,H);}
  if(feverMode){ctx.fillStyle=`rgba(255,80,0,${.045+.025*Math.sin(feverHue*.1)})`;ctx.fillRect(0,0,W,H);}
  drawFeverHalftone();
  drawDangerVignette();
  ctx.save();ctx.translate(shakeOff,camY);
  drawStackAura();
  const swayMax=Math.min(22,stackH*.28),sway=Math.sin(swayPhase)*swayMax;
  ctx.save();ctx.translate(sway,0);for(const b of stack)drawIng(b);ctx.restore();
  if(dropping)drawIng(dropping);
  if(cur&&gs==='playing'){
    const top=stack[stack.length-1];
    drawLandingGhost();
    ctx.fillStyle='rgba(255,200,100,.1)';ctx.fillRect(cur.x,top.y-BH,cur.width,BH);
    if(feverMode){ctx.strokeStyle=`hsl(${feverHue},100%,60%)`;ctx.lineWidth=3;ctx.shadowColor=`hsl(${feverHue},100%,60%)`;ctx.shadowBlur=16;ctx.strokeRect(cur.x,cur.y,cur.width,cur.height);ctx.shadowBlur=0;}
    drawTrail();
    const wobbleRot=Math.sin(spawnWobble)*spawnWobble*.22;
    drawIng(cur,wobbleRot);
    const arrowCol=shrinkWarnTimer>0?`rgba(255,${Math.sin(Date.now()*.04)*80+80},0,.9)`:'rgba(140,70,0,.7)';
    ctx.fillStyle=arrowCol;ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText('▼',cur.x+cur.width/2,cur.y-cur.height/2-12);ctx.textAlign='left';
  }
  for(const s of slices){ctx.save();ctx.globalAlpha=s.alpha;ctx.translate(s.x+s.width/2,s.y+s.height/2);ctx.rotate(s.r);ctx.fillStyle=s.col;ctx.fillRect(-s.width/2,-s.height/2,s.width,s.height);ctx.restore();}
  for(const b of fallBlocks){ctx.save();ctx.translate(b.x+b.width/2,b.y+b.height/2);ctx.rotate(b.r);ctx.fillStyle=ING[b.ii%ING.length].c;ctx.fillRect(-b.width/2,-b.height/2,b.width,b.height);ctx.restore();}
  ctx.restore();
  drawSpeedLines();
  for(const p of parts)p.draw();for(const f of floats)f.draw();for(const c of coins)c.draw();for(const fw of fworks)fw.draw();
  for(const d of drizzles)d.draw();
  updateDrawSideCombo();
  for(const k of kanjiFloats)k.draw();
  for(const s of scoreTickers)s.draw();for(const d of dmgNumbers)d.draw();
  drawMascot();drawRival();
  drawTVOverlay();drawReactionBox();
  if(feverMode){
    const pct=feverTimer/600;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(10,FEVER_BAR_Y,W-20,10,5);ctx.fill();
    const fg=ctx.createLinearGradient(10,0,W-10,0);fg.addColorStop(0,'#FF3860');fg.addColorStop(.5,'#FF9A3C');fg.addColorStop(1,'#FFD600');
    ctx.fillStyle=fg;ctx.beginPath();ctx.roundRect(10,FEVER_BAR_Y,(W-20)*pct,10,5);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='900 9px Arial Black';ctx.textAlign='center';ctx.fillText('🔥 KITCHEN ON FIRE',W/2,FEVER_BAR_Y+9);ctx.textAlign='left';
  }
  drawUI();
  drawImpactFrame();
  if(gs==='slot')drawSlot();
  if(milestoneActive)drawMileBanner();
  if(failPhase===3)drawGO(true);
  if(gs==='start')drawStart();
  else if(gs==='countdown')drawCD();
  else if(gs==='paused')drawPause();
  else if(gs==='gameover')drawGO(false);
  drawCRT();
  // ── HIKARIBOY SAFE ZONE INDICATOR ──
  if(isHikariBoy){
    ctx.fillStyle='rgba(0,200,255,.18)';
    ctx.beginPath();ctx.roundRect(W/2-38,SAFE_H-14,76,12,4);ctx.fill();
    ctx.fillStyle='rgba(0,200,255,.7)';ctx.font='bold 7px Arial';ctx.textAlign='center';
    ctx.fillText('▲ SAFE ZONE ▲',W/2,SAFE_H-5);
    ctx.textAlign='left';
  }

  ctx.strokeStyle='#2a2a4e';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(cx-5,cy-18,10,24,1);ctx.fill();
  ctx.fillStyle='#FF3860';ctx.beginPath();ctx.moveTo(cx,cy-16);ctx.lineTo(cx-3,cy-4);ctx.lineTo(cx,cy);ctx.lineTo(cx+3,cy-4);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.roundRect(cx-30,cy-16,12,26,6);ctx.fill();ctx.beginPath();ctx.roundRect(cx+18,cy-18,12,26,6);ctx.fill();
  ctx.fillStyle='#fffde0';ctx.beginPath();ctx.roundRect(cx-28,cy-12,22,28,2);ctx.fill();ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.stroke();
  ctx.strokeStyle='#aaa';ctx.lineWidth=.7;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(cx-25,cy-6+i*6);ctx.lineTo(cx-9,cy-6+i*6);ctx.stroke();}
  ctx.fillStyle='#FDBCB4';ctx.beginPath();ctx.roundRect(cx+20,cy-14,8,10,3);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx+22,cy-4);ctx.lineTo(cx+18,cy+10);ctx.stroke();
  ctx.fillStyle='#FDBCB4';ctx.beginPath();ctx.arc(cx,cy-32,16,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.1)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#2a1a0a';ctx.beginPath();ctx.ellipse(cx,cy-44,14,8,0,Math.PI,0);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx-14,cy-36);ctx.quadraticCurveTo(cx-20,cy-42,cx-8,cy-44);ctx.lineTo(cx-10,cy-38);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(cx-6,cy-32,5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(cx+6,cy-32,5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-1,cy-32);ctx.lineTo(cx+1,cy-32);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-11,cy-31);ctx.lineTo(cx-14,cy-30);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+11,cy-31);ctx.lineTo(cx+14,cy-30);ctx.stroke();
  ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(cx-6,cy-32,2,1.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(cx+6,cy-32,2,1.5,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#666';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx-4,cy-25);ctx.quadraticCurveTo(cx+2,cy-23,cx+6,cy-26);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.roundRect(cx-44,cy-76,88,22,6);ctx.fill();ctx.strokeStyle='#1a1a2e';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-6,cy-54);ctx.lineTo(cx,cy-48);ctx.lineTo(cx+6,cy-54);ctx.closePath();ctx.fillStyle='rgba(255,255,255,.92)';ctx.fill();
  ctx.fillStyle='#1a1a2e';ctx.font='900 8px Arial Black';ctx.textAlign='center';ctx.fillText('Hmph... impress me.',cx,cy-61);
  ctx.restore();
}

function drawCD(){overlay(.7);const sc=1+Math.sin(Date.now()/100)*.12;ctx.save();ctx.translate(W/2,SAFE_H/2);ctx.scale(sc,sc);if(cdVal>0){ctx.font='900 100px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#5C2800';ctx.lineWidth=10;ctx.strokeText(`${cdVal}`,0,42);const g=ctx.createLinearGradient(-60,0,60,0);g.addColorStop(0,'#FFD700');g.addColorStop(1,'#FF9A3C');ctx.fillStyle=g;ctx.fillText(`${cdVal}`,0,42);}else{ctx.font='900 56px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#5C2800';ctx.lineWidth=9;ctx.strokeText('ORDER UP!',0,34);ctx.fillStyle='#FFD700';ctx.fillText('ORDER UP!',0,34);}ctx.restore();ctx.textAlign='left';}
function drawPause(){overlay(.84);panel(W/2-120,SAFE_H*.34,240,120,14);bigTxt('PAUSED ⏸',SAFE_H*.42,'#FFD700','#FF9A3C',32);ctx.fillStyle='rgba(255,220,160,.75)';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('Tap to continue',W/2,SAFE_H*.5);ctx.fillText((muted?'🔇 Sound Off':'🔊 Sound On')+' — tap icon',W/2,SAFE_H*.54);ctx.textAlign='left';}
function drawGO(isFail){
  overlay(.9);const goY=SAFE_H*.1;panel(W/2-134,goY,268,270,16);
  ctx.fillStyle='#FFD700';ctx.font='900 22px Arial Black';ctx.textAlign='center';ctx.fillText('ORDER FAILED! 💥',W/2,goY+36);
  ctx.fillStyle='rgba(200,160,100,.6)';ctx.fillRect(W/2-110,goY+48,220,1.5);
  ctx.fillStyle='#fff';ctx.font='bold 24px Arial Black';ctx.fillText(`Score: ${score}`,W/2,goY+78);
  ctx.fillStyle='rgba(255,200,100,.8)';ctx.font='16px Arial';ctx.fillText(`Height: ${stackH} layers`,W/2,goY+100);
  if(maxCombo>1){ctx.fillStyle='#FF9A3C';ctx.fillText(`Best combo: ×${maxCombo}`,W/2,goY+122);}
  if(score>=highScore&&score>0){ctx.fillStyle='#FFD700';ctx.font='bold 14px Arial Black';ctx.fillText('🏆 NEW HIGH SCORE!',W/2,goY+146);}
  else if(highScore>0){ctx.fillStyle='rgba(255,200,100,.7)';ctx.font='13px Arial';ctx.fillText(`Best: ${highScore}`,W/2,goY+146);}
  ctx.fillStyle='rgba(200,160,100,.6)';ctx.fillRect(W/2-110,goY+158,220,1.5);
  const stars=score>=50?5:score>=25?4:score>=10?3:score>=5?2:1;
  ctx.font='22px Arial';for(let i=0;i<5;i++){ctx.fillStyle=i<stars?'#FFD700':'rgba(255,255,255,.25)';ctx.fillText('★',W/2-52+i*22,goY+192);}
  ctx.fillStyle='rgba(255,180,100,.7)';ctx.font='11px Arial';ctx.fillText(stars>=5?'"Michelin Star!" — Judge Yamada':stars>=3?'"Decent effort" — Chef Tanaka':'"Go back to cooking school" — Critic Honda',W/2,goY+212);
  if(!isFail){const p=.45+Math.sin(Date.now()/350)*.45;ctx.fillStyle=`rgba(255,240,160,${p})`;ctx.font='bold 16px Arial Black';ctx.fillText('▶ TAP TO TRY AGAIN',W/2,goY+248);}
  ctx.textAlign='left';
}

function loop(){update();render();requestAnimationFrame(loop);}
loop();
 
// ═══ HIKARIBOY AUTO-START ═══
if(isHikariBoy){
  initAC();
  startCD();
}
