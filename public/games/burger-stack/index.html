const MEL=[784,880,988,1047,880,784,659,784,880,988,1047,1175,1047,880,784,0,659,784,880,988,880,784,659,587,659,784,880,784,659,587,523,0,784,1047,988,880,784,880,1047,988,880,784,659,784,880,784,659,0,523,659,784,880,988,1047,1175,1047,880,988,1047,988,880,784,784,0];

function initAC(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();}}
function startMusic(bpm=155){
  curBPM=bpm;beatInterval=60/bpm;stopMusic();if(!AC)return;
  const B=60/bpm;mnt=AC.currentTime+.05;bnt=AC.currentTime+.05;mi=0;bi=0;lastBeatTime=AC.currentTime;
  function sch(){
    while(mnt<AC.currentTime+.4){if(!muted&&MEL[mi%MEL.length]){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.value=MEL[mi%MEL.length];g.gain.setValueAtTime(.07,mnt);g.gain.exponentialRampToValueAtTime(.001,mnt+B*.7);o.start(mnt);o.stop(mnt+B);}mi++;mnt+=B;}
    while(bnt<AC.currentTime+.4){if(!muted&&BASS[bi%BASS.length]){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='triangle';o.frequency.value=BASS[bi%BASS.length];g.gain.setValueAtTime(.06,bnt);g.gain.exponentialRampToValueAtTime(.001,bnt+B*1.4);o.start(bnt);o.stop(bnt+B*2);}bi++;bnt+=B;}
    musT=setTimeout(sch,80);
  }sch();
}
function stopMusic(){if(musT)clearTimeout(musT);musT=null;}
function sfx(f,d,tp='square',v=.22,f2=null){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=tp;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}
const sndDrop=()=>{sfx(180,.05,'sine',.3);setTimeout(()=>sfx(120,.08,'sine',.2),40);};
const sndPerfect=()=>{sfx(880,.06,'sine',.25);setTimeout(()=>sfx(1100,.06,'sine',.25),60);setTimeout(()=>sfx(1320,.15,'sine',.3),120);};

const sndFever=()=>[880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>sfx(f,.08,'square',.3),i*60));

function rivalSay(arr){rival.speech=arr[Math.floor(Math.random()*arr.length)];rival.speechT=90;}

function getIngredient(){
  if(stackH===0) return ING[0];
  if(score>=nextSlotScore){slotActive=true;return ING[0];}
  const pool=score<LVL1?ING.slice(0,4):score<LVL2?ING.slice(0,6):ING.slice(0,7);
  return pool[Math.floor(Math.random()*pool.length)];
}

function spawnNext(){
  const ing=getIngredient();const w=pendingWideBlock?INIT_BW*1.4:Math.max(40,INIT_BW-score*1.2);
  pendingWideBlock=false;spawnWobble=0;cur={x:W/2-w/2,y:camY-60,w:w,ing:ing,dir:Math.random()>.5?1:-1,spd:curSpd+(score*.04)};
}
function dropBlock(){if(!cur||dropping)return;dropping=cur;cur=null;sndDrop();if(gs==='playing'&&combo>0)trailPos=[];}

function checkPerfect(){
  if(!stack.length)return true;const last=stack[stack.length-1];const diff=Math.abs(dropping.x-last.x);
  if(diff<PERF){
    dropping.x=last.x;combo++;streak++;if(combo>maxCombo)maxCombo=combo;if(combo%5===0){feverMode=true;feverTimer=480;sndFever();rivalSay(R_FEVER);triggerSpeedLines(30);}
    sndPerfect();vibe(combo>10?[10,20,10]:20);ftxt(dropping.x+dropping.w/2,dropping.y,'PERFECT!','#FFD700',28);spawnKanji(dropping.x+dropping.w/2,dropping.y);
    if(combo>=2)triggerSideCombo(combo);scoreTickers.push(new ScoreTicker(5,dropping.x+dropping.w/2,dropping.y));return true;
  }
  return false;
}

function updateStack(){
  if(!dropping)return;dropping.y+=DROP_SPD;const targetY=stack.length?stack[stack.length-1].y-BH:COUNTER_Y-BH;
  if(dropping.y>=targetY){
    dropping.y=targetY;const isPerf=checkPerfect();
    if(!isPerf){
      const last=stack[stack.length-1];const diff=dropping.x-last.x;if(Math.abs(diff)>=dropping.w){failGame();return;}
      const sliceW=Math.abs(diff);const sliceX=diff>0?dropping.x+dropping.w-sliceW:dropping.x;slices.push({x:sliceX,y:dropping.y,w:sliceW,ing:dropping.ing,vx:diff>0?2:-2,vy:-2,r:0,rv:rnd(-.1,.1)});
      dropping.w-=sliceW;if(diff>0)dropping.x=last.x;else dropping.x=last.x;combo=0;streak=0;sndSlice();vibe(10);sparkleBurst(sliceX+sliceW/2,dropping.y,dropping.ing.c,8);scoreTickers.push(new ScoreTicker(1,dropping.x+dropping.w/2,dropping.y));
    }
    stack.push(dropping);stackH++;score++;if(score>=MILESTONES[mIdx]){milestoneActive=true;milestoneTimer=120;sndMile();mIdx++;rivalSay(R_GOOD);showReaction('milestone');}if(score%10===0)level++;if(score%5===0&&!feverMode)rivalSay(R_GOOD);dropping=null;tgtCam=Math.max(0,stack.length*BH-SAFE_H*.4);spawnNext();
  }
}

function failGame(){gs='gameover';stopMusic();sndOver();vibe([100,50,100]);if(score>highScore){highScore=score;localStorage.setItem('bs_hi',highScore);}rivalSay(R_OVER);showReaction('fail');fallBlocks=stack.map(b=>({...b,vx:rnd(-4,4),vy:rnd(-10,-2),rv:rnd(-.1,.1)}));stack=[];failPhase=0;failTimer=120;}

let drizzles=[];
class Drizzle{
  constructor(x,y,w,type){
    this.x=x;this.y=y;this.w=w;this.type=type;this.life=1;this.progress=0;this.col=type==='ketchup'?'#DD1111':type==='mustard'?'#E6C200':'#F5F5DC';
    this.pts=[];const segs=Math.floor(w/18)+2;for(let i=0;i<=segs;i++){this.pts.push({x:x+i*(w/segs),y:y+rnd(-5,5)});}
    this.bottleX=x+rnd(w*.1,w*.5);this.bottleY=y-32;this.bottleVy=-4;this.bottleDone=false;
  }
  update(){this.progress=Math.min(1,this.progress+.045);this.life-=.008;if(!this.bottleDone){this.bottleY+=this.bottleVy;this.bottleVy+=.8;if(this.bottleY>=this.y-18){this.bottleVy*=-.55;if(Math.abs(this.bottleVy)<1)this.bottleDone=true;}}}
  draw(){
    ctx.save();ctx.globalAlpha=Math.max(0,this.life);const totalPts=this.pts.length;const showPts=Math.floor(this.progress*(totalPts-1))+1;ctx.strokeStyle=this.col;ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(this.pts[0].x,this.pts[0].y);
    for(let i=1;i<showPts;i++){const mx=(this.pts[i-1].x+this.pts[i].x)/2,my=(this.pts[i-1].y+this.pts[i].y)/2;ctx.quadraticCurveTo(this.pts[i-1].x,this.pts[i-1].y,mx,my);}
    ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(this.pts[0].x,this.pts[0].y-1);for(let i=1;i<showPts;i++){ctx.lineTo(this.pts[i].x,this.pts[i].y-1);}ctx.stroke();
    if(!this.bottleDone){const bx=this.bottleX,by=this.bottleY;const icon=this.type==='ketchup'?'🍅':this.type==='mustard'?'🟡':'🤍';ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText(icon,bx,by);if(this.progress>.1){ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(bx,by+10,3,0,Math.PI*2);ctx.fill();}}
    ctx.restore();
  }
}
function spawnDrizzle(x,y,w,type){drizzles.push(new Drizzle(x,y,w,type));}

let sideCombo={active:false,val:0,timer:0,phase:'in',x:W+60,targetX:W-72,col:'#fff',hue:0,shards:[]};
const COMBO_COLS=['#fff','#FFD700','#FF9A3C','#FF3860','#E040FB','#00E5FF'];
function triggerSideCombo(val){const ci=Math.min(val-2,COMBO_COLS.length-1);const col=val>=8?`hsl(${feverHue},100%,65%)`:COMBO_COLS[ci];sideCombo={active:true,val,timer:90,phase:'in',x:W+60,targetX:W-72,col,hue:feverHue,shards:[]};}
function updateDrawSideCombo(){
  if(!sideCombo.active)return;sideCombo.timer--;
  if(sideCombo.phase==='in'){sideCombo.x+=(sideCombo.targetX-sideCombo.x)*.28;if(Math.abs(sideCombo.x-sideCombo.targetX)<2){sideCombo.x=sideCombo.targetX;sideCombo.phase='hold';}}
  if(sideCombo.phase==='hold'&&sideCombo.timer<22){sideCombo.phase='shatter';for(let i=0;i<8;i++)sideCombo.shards.push({x:sideCombo.x,y:SAFE_H*.38,vx:rnd(-6,6),vy:rnd(-8,-2),r:rnd(0,Math.PI*2),life:1,col:sideCombo.col});}
  if(sideCombo.phase==='shatter'){sideCombo.shards.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.4;s.r+=.15;s.life-=.06;});if(sideCombo.shards.every(s=>s.life<=0))sideCombo.active=false;}
  if(sideCombo.timer<=0)sideCombo.active=false;
  const cx=sideCombo.x,cy=SAFE_H*.38;
  if(sideCombo.phase!=='shatter'){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(bgTime*1.2);const rays=10,col=sideCombo.val>=8?`hsl(${(sideCombo.hue+bgTime*60)%360},100%,60%)`:sideCombo.col;ctx.fillStyle=col;ctx.globalAlpha=.35;for(let i=0;i<rays;i++){const a=i/rays*Math.PI*2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*36,Math.sin(a)*36);ctx.lineTo(Math.cos(a+Math.PI/rays)*20,Math.sin(a+Math.PI/rays)*20);ctx.closePath();ctx.fill();}
    ctx.restore();ctx.save();ctx.translate(cx,cy);ctx.rotate(-.18);ctx.font='900 28px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=7;ctx.strokeText(`${sideCombo.val}×`,0,8);ctx.fillStyle=sideCombo.val>=8?`hsl(${(sideCombo.hue+120)%360},100%,65%)`:sideCombo.col;ctx.fillText(`${sideCombo.val}×`,0,8);ctx.font='900 10px Arial Black';ctx.strokeText('COMBO',0,22);ctx.fillStyle='#fff';ctx.fillText('COMBO',0,22);ctx.restore();
  }
}

function triggerSpeedLines(dur=18){speedLinesActive=dur;speedLinesTimer=dur;}
function drawSpeedLines(){
  if(speedLinesActive<=0)return;const prog=speedLinesActive/speedLinesTimer;ctx.save();ctx.globalAlpha=prog*.52;const cx=W/2,cy=SAFE_H*.42,n=32+Math.min(combo*2,30);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,inner=rnd(18,40)*prog,outer=rnd(W*.5,W*.85);ctx.strokeStyle=feverMode?`hsl(${(feverHue+i*8)%360},100%,75%)`:'#fff';ctx.lineWidth=rnd(.5,2.5)*prog;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*inner,cy+Math.sin(a)*inner);ctx.lineTo(cx+Math.cos(a)*outer,cy+Math.sin(a)*outer);ctx.stroke();}
  ctx.restore();speedLinesActive--;
}

const KANJI_FOOD=['食','旨','激','炎','辛','超','爆','热','神','鬼'],ANIME_WORDS=['UMAI!!','SUGOI!','NANI!?','YATTA!','MAJI?!','IKUZO!'],KANJI_BAD=['失','痛','终','駄','负'],BG_KANJI=['食','旨','炎','辛','超','爆','热','神'];
class FloatKanji{constructor(x,y,txt,col,sz,isWord=false){this.x=x;this.y=y;this.txt=txt;this.col=col;this.sz=sz;this.life=1;this.vy=rnd(-1.8,-.8);this.vx=rnd(-1,1);this.rot=rnd(-.3,.3);this.isWord=isWord;}update(){this.y+=this.vy;this.x+=this.vx;this.life-=.014;}draw(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot*(1-this.life));ctx.font=`900 ${this.sz}px Arial Black`;ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=this.isWord?6:4;ctx.strokeText(this.txt,0,0);ctx.fillStyle=this.col;ctx.fillText(this.txt,0,0);ctx.restore();}}
class BgKanji{constructor(){this.x=rnd(20,W-20);this.y=rnd(SAFE_H*.6,SAFE_H*.8);this.txt=BG_KANJI[Math.floor(rnd(0,BG_KANJI.length))];this.sz=rnd(14,28);this.alpha=rnd(.04,.12);this.vy=rnd(-.4,-.15);this.life=1;this.col=feverMode?`hsl(${Math.floor(rnd(0,360))},100%,70%)`:'rgba(180,100,20,1)';}update(){this.y+=this.vy;this.life-=.004;}draw(){ctx.save();ctx.globalAlpha=this.life*this.alpha*(feverMode?2.5:1);ctx.font=`900 ${this.sz}px Arial Black`;ctx.textAlign='center';ctx.fillStyle=this.col;ctx.fillText(this.txt,this.x,this.y);ctx.restore();}}
function spawnKanji(x,y,bad=false){const txt=bad?KANJI_BAD[Math.floor(rnd(0,KANJI_BAD.length))]:KANJI_FOOD[Math.floor(rnd(0,KANJI_FOOD.length))];const col=bad?'#FF3860':['#FFD700','#FF6B00','#00E5FF','#FF3860','#39FF14'][Math.floor(rnd(0,5))];kanjiFloats.push(new FloatKanji(x,y,txt,col,rnd(22,38)));}
function spawnAnimeWord(x,y){kanjiFloats.push(new FloatKanji(x,y,ANIME_WORDS[Math.floor(rnd(0,ANIME_WORDS.length))],'#FFD700',28,true));}

function drawHalftone(alpha=0.06,col='#8B4513'){halftonePhase+=.012;const sp=isHikariBoy?14:16;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=col;for(let row=0;row<Math.ceil(COUNTER_Y/sp);row++){for(let c=0;c<Math.ceil(W/sp);c++){const ox=(row%2===0)?0:sp/2,pulse=Math.sin(halftonePhase+row*.18+c*.12)*.5+.5;ctx.beginPath();ctx.arc(c*sp+ox,row*sp,1.2+pulse*1.8,0,Math.PI*2);ctx.fill();}}ctx.restore();}
let recBlink=0;
function drawTVOverlay(){
  recBlink+=.06;ctx.save();ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(W-130,isHikariBoy?22:68,72,18,3);ctx.fill();ctx.fillStyle='#ccc';ctx.font='bold 9px Arial';ctx.textAlign='left';ctx.fillText('CAM 2  LIVE',W-126,isHikariBoy?34:80);if(Math.sin(recBlink)>0){ctx.fillStyle='#FF2020';ctx.beginPath();ctx.arc(W-136,isHikariBoy?30:75,4,0,Math.PI*2);ctx.fill();}const ts=`${String(Math.floor(bgTime/60)|0).padStart(2,'0')}:${String(Math.floor(bgTime)%60).padStart(2,'0')}`;ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(6,SAFE_H-22,90,16,3);ctx.fill();ctx.fillStyle='#ddd';ctx.font='bold 9px Arial';ctx.fillText(`● REC  ${ts}`,10,SAFE_H-10);if(gs==='playing'&&score<3){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,SAFE_H-42,W,20);ctx.fillStyle='#FFD700';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('🍳 BURGER STACK CHAMPIONSHIP — LIVE FROM TOKYO 🍳',W/2,SAFE_H-28);}ctx.textAlign='left';ctx.restore();

  else if(gs==='countdown'){ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 120px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=15;ctx.strokeText(cdVal,W/2,H/2+40);ctx.fillText(cdVal,W/2,H/2+40);}
  else if(gs==='playing'){
    tgtCam=Math.max(0,stack.length*BH-SAFE_H*.4);camY+=(tgtCam-camY)*.1;ctx.save();ctx.translate(0,camY+CAM_SHIFT);
    for(let i=0;i<stack.length;i++){const b=stack[i];ctx.fillStyle=b.ing.c;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,BH,4);ctx.fill();ctx.fillStyle=b.ing.h;ctx.fillRect(b.x,b.y,b.w,BH*.3);ctx.fillStyle=b.ing.s;ctx.fillRect(b.x,b.y+BH*.7,b.w,BH*.3);if(b.ing.seeds){ctx.fillStyle='#F5F5F5';for(let j=0;j<8;j++){ctx.beginPath();ctx.ellipse(b.x+b.w/8+(j*b.w/8),b.y+8,2,4,Math.PI/4,0,Math.PI*2);ctx.fill();}}}
    if(cur){ctx.fillStyle=cur.ing.c;ctx.beginPath();ctx.roundRect(cur.x,cur.y,cur.w,BH,4);ctx.fill();spawnWobble+=.05;cur.x=W/2-cur.w/2+Math.sin(spawnWobble)*55;}
    if(dropping){ctx.fillStyle=dropping.ing.c;ctx.beginPath();ctx.roundRect(dropping.x,dropping.y,dropping.w,BH,4);ctx.fill();updateStack();}
    slices.forEach((s,idx)=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.4;s.r+=s.rv;ctx.save();ctx.translate(s.x+s.w/2,s.y+BH/2);ctx.rotate(s.r);ctx.fillStyle=s.ing.c;ctx.beginPath();ctx.roundRect(-s.w/2,-BH/2,s.w,BH,4);ctx.fill();ctx.restore();if(s.y>H+100)slices.splice(idx,1);});
    ctx.restore();ctx.fillStyle='#fff';ctx.font='900 32px Arial Black';ctx.textAlign='left';ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.strokeText(score,20,50);ctx.fillText(score,20,50);ctx.font='bold 14px Arial';ctx.strokeText(`HI: ${highScore}`,20,75);ctx.fillText(`HI: ${highScore}`,20,75);
    const bw=140,bh=12,bx=W/2-bw/2,by=FEVER_BAR_Y;ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.fill();if(feverMode){const fp=feverTimer/480;ctx.fillStyle=`hsl(${feverHue},100%,60%)`;ctx.beginPath();ctx.roundRect(bx+2,by+2,(bw-4)*fp,bh-4,(bh-4)/2);ctx.fill();}
  }
  else if(gs==='gameover'){ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#FF3860';ctx.font='900 56px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=12;ctx.strokeText('GAME OVER',W/2,H/2-40);ctx.fillText('GAME OVER',W/2,H/2-40);ctx.fillStyle='#fff';ctx.font='32px Arial';ctx.strokeText(`Score: ${score}`,W/2,H/2+40);ctx.fillText(`Score: ${score}`,W/2,H/2+40);ctx.font='20px Arial';ctx.fillText('Press START to Restart',W/2,H/2+90);}
  ctx.restore();parts.forEach((p,idx)=>{p.update();p.draw();if(p.life<=0)parts.splice(idx,1);});floats.forEach((f,idx)=>{f.update();f.draw();if(f.life<=0)floats.splice(idx,1);});coins.forEach((c,idx)=>{c.update();c.draw();if(c.life<=0)coins.splice(idx,1);});fworks.forEach((fw,idx)=>{fw.update();fw.draw();if(fw.done)fworks.splice(idx,1);});kanjiFloats.forEach((kf,idx)=>{kf.update();kf.draw();if(kf.life<=0)kanjiFloats.splice(idx,1);});scoreTickers.forEach((st,idx)=>{st.update();st.draw();if(st.life<=0)scoreTickers.splice(idx,1);});
  drawSpeedLines();drawImpactFrame();drawTVOverlay();drawReactionBox();updateDrawSideCombo();drawFeverHalftone();drawStackAura();requestAnimationFrame(loop);
}

window.addEventListener('message',e=>{if(e.data?.type==='BUTTON_PRESS'){initAC();const b=e.data.button;if(b==='start'){if(gs==='start'||gs==='gameover'){gs='countdown';cdVal=3;score=0;stack=[];mIdx=0;level=1;curSpd=2.4;spawnNext();startCD();}else if(gs==='playing'){gs='paused';stopMusic();}else if(gs==='paused'){gs='playing';startMusic();}}if(b==='a'){if(gs==='playing')dropBlock();}if(b==='select'&&isHikariBoy)window.parent.postMessage({type:'GAME_EXIT',gameId:'burger-stack'},'*');}});
requestAnimationFrame(loop);
</script>
</body>
</html>
