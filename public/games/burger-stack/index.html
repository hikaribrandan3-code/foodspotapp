function initAC(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();}}
function startMusic(bpm){bpm=bpm||155;curBPM=bpm;beatInterval=60/bpm;stopMusic();if(!AC)return;const B=60/bpm;mnt=AC.currentTime+.05;bnt=AC.currentTime+.05;mi=0;bi=0;lastBeatTime=AC.currentTime;function sch(){while(mnt<AC.currentTime+.4){if(!muted&&MEL[mi%MEL.length]){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.value=MEL[mi%MEL.length];g.gain.setValueAtTime(.07,mnt);g.gain.exponentialRampToValueAtTime(.001,mnt+B*.7);o.start(mnt);o.stop(mnt+B);}mi++;mnt+=B;}while(bnt<AC.currentTime+.4){if(!muted&&BASS[bi%BASS.length]){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='triangle';o.frequency.value=BASS[bi%BASS.length];g.gain.setValueAtTime(.06,bnt);g.gain.exponentialRampToValueAtTime(.001,bnt+B*1.4);o.start(bnt);o.stop(bnt+B*2);}bi++;bnt+=B;}musT=setTimeout(sch,80);}sch();}
function stopMusic(){if(musT)clearTimeout(musT);musT=null;}
function sfx(f,d,tp,v,f2){tp=tp||'square';v=v||.22;if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=tp;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}
function sndDrop(){sfx(180,.05,'sine',.3);setTimeout(function(){sfx(120,.08,'sine',.2);},40);}

// ── BG KANJI ──
const BG_KANJI=['食','旨','炎','辛','超','爆','熱','神'];
function BgKanji(){this.x=rnd(20,W-20);this.y=rnd(COUNTER_Y*.6,COUNTER_Y*.9);this.txt=BG_KANJI[Math.floor(rnd(0,BG_KANJI.length))];this.sz=rnd(14,28);this.alpha=rnd(.04,.12);this.vy=rnd(-.4,-.15);this.life=1;this.col=feverMode?'hsl('+Math.floor(rnd(0,360))+',100%,70%)':'rgba(180,100,20,1)';}
BgKanji.prototype.update=function(){this.y+=this.vy;this.life-=.004;};
BgKanji.prototype.draw=function(){ctx.save();ctx.globalAlpha=this.life*this.alpha*(feverMode?2.5:1);ctx.font='900 '+this.sz+'px Arial Black';ctx.textAlign='center';ctx.fillStyle=this.col;ctx.fillText(this.txt,this.x,this.y);ctx.restore();};

// ── KANJI FLOATS ──
const KANJI_FOOD=['食','旨','激','炎','辛','超','爆','熱','神','鬼'];
const ANIME_WORDS=['UMAI!!','SUGOI!','NANI!?','YATTA!','MAJI?!','IKUZO!'];
const KANJI_BAD=['失','痛','終','駄','負'];
function FloatKanji(x,y,txt,col,sz,isWord){this.x=x;this.y=y;this.txt=txt;this.col=col;this.sz=sz;this.life=1;this.vy=rnd(-1.8,-.8);this.vx=rnd(-1,1);this.rot=rnd(-.3,.3);this.isWord=!!isWord;}
FloatKanji.prototype.update=function(){this.y+=this.vy;this.x+=this.vx;this.life-=.014;};
FloatKanji.prototype.draw=function(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot*(1-this.life));ctx.font='900 '+this.sz+'px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=this.isWord?6:4;ctx.strokeText(this.txt,0,0);ctx.fillStyle=this.col;ctx.fillText(this.txt,0,0);ctx.restore();};
function spawnKanji(x,y,bad){var txt=bad?KANJI_BAD[Math.floor(rnd(0,KANJI_BAD.length))]:KANJI_FOOD[Math.floor(rnd(0,KANJI_FOOD.length))];var col=bad?'#FF3860':['#FFD700','#FF6B00','#00E5FF','#FF3860','#39FF14'][Math.floor(rnd(0,5))];kanjiFloats.push(new FloatKanji(x,y,txt,col,rnd(22,38)));}
function spawnAnimeWord(x,y){kanjiFloats.push(new FloatKanji(x,y,ANIME_WORDS[Math.floor(rnd(0,ANIME_WORDS.length))],'#FFD700',28,true));}

// ── DRIZZLE ──
function Drizzle(x,y,w,type){this.x=x;this.y=y;this.w=w;this.type=type;this.life=1;this.progress=0;this.col=type==='ketchup'?'#DD1111':type==='mustard'?'#E6C200':'#F5F5DC';this.pts=[];var segs=Math.floor(w/18)+2;for(var i=0;i<=segs;i++){this.pts.push({x:x+i*(w/segs),y:y+rnd(-5,5)});}this.bottleX=x+rnd(w*.1,w*.5);this.bottleY=y-32;this.bottleVy=-4;this.bottleDone=false;}
Drizzle.prototype.update=function(){this.progress=Math.min(1,this.progress+.045);this.life-=.008;if(!this.bottleDone){this.bottleY+=this.bottleVy;this.bottleVy+=.8;if(this.bottleY>=this.y-18){this.bottleVy*=-.55;if(Math.abs(this.bottleVy)<1)this.bottleDone=true;}}};
Drizzle.prototype.draw=function(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);var totalPts=this.pts.length,showPts=Math.floor(this.progress*(totalPts-1))+1;ctx.strokeStyle=this.col;ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(this.pts[0].x,this.pts[0].y);for(var i=1;i<showPts;i++){var mx=(this.pts[i-1].x+this.pts[i].x)/2,my=(this.pts[i-1].y+this.pts[i].y)/2;ctx.quadraticCurveTo(this.pts[i-1].x,this.pts[i-1].y,mx,my);}ctx.stroke();if(!this.bottleDone){var icon=this.type==='ketchup'?'🍅':this.type==='mustard'?'🟡':'🤍';ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText(icon,this.bottleX,this.bottleY);}ctx.restore();};
function spawnDrizzle(x,y,w,type){drizzles.push(new Drizzle(x,y,w,type));}

// ── SCORE TICKER ──
function ScoreTicker(pts,x,y){this.pts=pts;this.x=x;this.y=y;this.life=1;this.w=0;this.vy=-1.2;this.targetW=pts>3?88:64;}
ScoreTicker.prototype.update=function(){this.y+=this.vy;this.vy*=.96;this.life-=.022;this.w=Math.min(this.w+8,this.targetW);};
ScoreTicker.prototype.draw=function(){if(this.life<=0)return;ctx.save();ctx.globalAlpha=this.life;var col=this.pts>=4?'#FF3860':this.pts>=2?'#FF6B00':'#FFD700';ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x+this.w,this.y);ctx.lineTo(this.x+this.w+8,this.y+12);ctx.lineTo(this.x+this.w,this.y+24);ctx.lineTo(this.x,this.y+24);ctx.lineTo(this.x+8,this.y+12);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.font='900 '+(this.pts>=4?18:14)+'px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText('+'+this.pts,this.x+this.w/2+4,this.y+17);ctx.fillText('+'+this.pts,this.x+this.w/2+4,this.y+17);ctx.restore();};

// ── DAMAGE NUMBER ──
function DamageNumber(x,y,pts,col){this.x=x;this.y=y;this.pts=pts;this.col=col;this.life=1;this.vy=rnd(-4,-2.5);this.vx=rnd(-1.5,1.5);this.rot=rnd(-.35,.35);this.sz=Math.min(48,22+pts*4);}
DamageNumber.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.vy*=.91;this.life-=.026;};
DamageNumber.prototype.draw=function(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot*(1-this.life*.5));ctx.font='900 '+this.sz+'px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=8;ctx.strokeText('+'+this.pts,0,0);var g=ctx.createLinearGradient(0,-this.sz,0,0);g.addColorStop(0,'#fff');g.addColorStop(1,this.col);ctx.fillStyle=g;ctx.fillText('+'+this.pts,0,0);ctx.restore();};

// ── PARTICLES ──
function Confetti(x,y){this.x=x;this.y=y;this.vx=rnd(-12,12);this.vy=rnd(-18,-4);this.w=rnd(6,16);this.h=rnd(4,9);this.r=rnd(0,Math.PI*2);this.spin=rnd(-.4,.4);this.col=['#FF3860','#FFD700','#00E5FF','#39FF14','#FF6B00','#E040FB','#00BFA5','#FF4081','#fff'][Math.floor(Math.random()*9)];this.life=1;this.grav=.55;}
Confetti.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.grav;this.r+=this.spin;this.life-=.015;this.vx*=.97;};
Confetti.prototype.draw=function(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.r);ctx.fillStyle=this.col;ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);ctx.restore();};
function Sparkle(x,y,col){this.x=x;this.y=y;this.col=col;this.vx=rnd(-6,6);this.vy=rnd(-9,-1);this.sz=rnd(5,13);this.life=1;this.r=0;this.spin=rnd(-.3,.3);}
Sparkle.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.vy+=.35;this.life-=.026;this.r+=this.spin;};
Sparkle.prototype.draw=function(){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.r);ctx.beginPath();for(var i=0;i<5;i++){var a=i/5*Math.PI*2-Math.PI/2,b=a+Math.PI/5;ctx.lineTo(Math.cos(a)*this.sz,Math.sin(a)*this.sz);ctx.lineTo(Math.cos(b)*this.sz*.4,Math.sin(b)*this.sz*.4);}ctx.closePath();ctx.fillStyle=this.col;ctx.fill();ctx.restore();};
function Coin(x,y){this.x=x;this.y=y;this.vx=rnd(-7,7);this.vy=rnd(-11,-3);this.life=1;this.fr=0;}
Coin.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.vy+=.42;this.life-=.018;this.vx*=.97;this.fr++;};
Coin.prototype.draw=function(){var sc=Math.abs(Math.cos(this.fr*.15))+.1;ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.fillStyle='#FFD700';ctx.strokeStyle='#B8860B';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,7*sc,7,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();};
function SmokeRing(x,y){this.x=x;this.y=y;this.r=8;this.life=1;this.vy=-1.2;}
SmokeRing.prototype.update=function(){this.r+=1.8;this.y+=this.vy;this.life-=.04;};
SmokeRing.prototype.draw=function(){ctx.save();ctx.globalAlpha=Math.max(0,this.life*.5);ctx.strokeStyle='rgba(220,200,180,1)';ctx.lineWidth=3*(1-this.life*.5);ctx.beginPath();ctx.ellipse(this.x,this.y,this.r,this.r*.35,0,0,Math.PI*2);ctx.stroke();ctx.restore();};
function FlameLick(bx,by){this.x=bx+rnd(-10,10);this.y=by;this.vy=rnd(-3,-1.2);this.life=1;this.sz=rnd(6,14);this.hue=rnd(10,40);}
FlameLick.prototype.update=function(){this.y+=this.vy;this.x+=rnd(-.5,.5);this.life-=.04;this.sz*=.97;};
FlameLick.prototype.draw=function(){ctx.save();ctx.globalAlpha=Math.max(0,this.life*.85);ctx.fillStyle='hsl('+this.hue+',100%,55%)';ctx.beginPath();ctx.ellipse(this.x,this.y,this.sz*.4,this.sz,0,0,Math.PI*2);ctx.fill();ctx.restore();};
function Steam(){this.x=rnd(60,W-60);this.y=COUNTER_Y-10;this.vx=rnd(-.5,.5);this.vy=rnd(-2.5,-.8);this.life=1;this.sz=rnd(4,10);this.alpha=rnd(.15,.35);}
Steam.prototype.update=function(){this.x+=this.vx+Math.sin(Date.now()*.002+this.x)*.3;this.y+=this.vy;this.sz+=.06;this.life-=.012;};
Steam.prototype.draw=function(){ctx.save();ctx.globalAlpha=Math.max(0,this.life*this.alpha);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,this.sz,0,Math.PI*2);ctx.fill();ctx.restore();};
function FoodBit(x,y,col){this.x=x;this.y=y;this.col=col;this.vx=rnd(-5,5);this.vy=rnd(-6,-1);this.sz=rnd(3,7);this.life=1;}

function FText(x,y,t,col,sz){this.x=x;this.y=y;this.t=t;this.col=col;this.sz=sz||24;this.life=1;this.vy=-2.5;}
FText.prototype.update=function(){this.y+=this.vy;this.vy*=.94;this.life-=.018;};
FText.prototype.draw=function(){if(this.life<=0)return;ctx.save();ctx.globalAlpha=this.life;ctx.font='900 '+this.sz+'px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.strokeText(this.t,this.x,this.y);ctx.fillStyle=this.col;ctx.fillText(this.t,this.x,this.y);ctx.textAlign='left';ctx.restore();};

// ── SPEED LINES ──
function triggerSpeedLines(dur){dur=dur||18;speedLinesActive=dur;speedLinesTimer=dur;}
function drawSpeedLines(){
  if(speedLinesActive<=0)return;
  var prog=speedLinesActive/speedLinesTimer;

    if(d.x+d.width>top.x+top.width)slices.push({x:top.x+top.width,y:d.y,width:(d.x+d.width)-(top.x+top.width),height:BH,col:col,vx:2.5,vy:0,r:0,rs:.14,alpha:1,squashT:8});
  }
  var pts=1+Math.floor(combo/3);score+=pts;
  scoreTickers.push(new ScoreTicker(pts,d.x+d.width/2-32,d.y+camOffset-30));
  dmgNumbers.push(new DamageNumber(d.x+d.width/2+rnd(-20,20),d.y+camOffset-18,pts,pts>=4?'#FF3860':pts>=2?'#FF9A3C':'#FFD700'));

}
function drawMiniAnimeBurger(cx,cy){
  var layers=[{col:'#FFBC42',h:16,w:120,bun:true,top:true},{col:'#00D44A',h:8,w:130},{col:'#FF2020',h:10,w:110},{col:'#FFD600',h:7,w:126,che:true},{col:'#8B4513',h:12,w:114,pat:true},{col:'#FF9A3C',h:14,w:120,bun:true}];
  var tH=layers.reduce(function(a,l){return a+l.h;},0),y=cy-tH/2;
  layers.forEach(function(l){
    var lx=cx-l.w/2;
    if(l.bun){ctx.fillStyle=l.top?'#FFBC42':'#FF9A3C';ctx.beginPath();ctx.roundRect(lx,y,l.w,l.h,l.top?[10,10,3,3]:[3,3,10,10]);ctx.fill();ctx.strokeStyle='#A05800';ctx.lineWidth=1.5;ctx.stroke();}
    else if(l.pat){ctx.fillStyle=l.col;ctx.beginPath();ctx.ellipse(cx,y+l.h/2,l.w/2,l.h/2,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3D1A00';ctx.lineWidth=1.5;ctx.stroke();}
    else if(l.che){var g=ctx.createLinearGradient(lx,y,cx,y+l.h);g.addColorStop(0,'#FFF07A');g.addColorStop(1,l.col);ctx.beginPath();ctx.moveTo(lx-4,y+l.h*.3);ctx.quadraticCurveTo(lx-5,y+l.h+3,lx+8,y+l.h);ctx.lineTo(lx+l.w-8,y+l.h);ctx.quadraticCurveTo(lx+l.w+5,y+l.h+3,lx+l.w+4,y+l.h*.3);ctx.lineTo(lx+l.w,y);ctx.lineTo(lx,y);ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#C09000';ctx.lineWidth=1;ctx.stroke();}
    else{ctx.fillStyle=l.col;ctx.beginPath();ctx.ellipse(cx,y+l.h/2,l.w/2,l.h*.6,0,0,Math.PI*2);ctx.fill();}
    y+=l.h;
  });
  var ey=cy+4;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(cx-16,ey,7,9,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(cx+16,ey,7,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#00E5FF';ctx.beginPath();ctx.arc(cx-16,ey,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+16,ey,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx-14,ey,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+18,ey,2.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,ey+8,14,0,Math.PI);ctx.stroke();
}
function drawCD(){
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
  var sc=1+Math.sin(Date.now()/100)*.12;ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);
  if(cdVal>0){ctx.font='900 100px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#5C2800';ctx.lineWidth=10;ctx.strokeText(''+cdVal,0,42);var g=ctx.createLinearGradient(-60,0,60,0);g.addColorStop(0,'#FFD700');g.addColorStop(1,'#FF9A3C');ctx.fillStyle=g;ctx.fillText(''+cdVal,0,42);}
  else{ctx.font='900 56px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#5C2800';ctx.lineWidth=9;ctx.strokeText('ORDER UP!',0,34);ctx.fillStyle='#FFD700';ctx.fillText('ORDER UP!',0,34);}
  ctx.restore();ctx.textAlign='left';
}
function drawPause(){
  ctx.fillStyle='rgba(20,10,0,.84)';ctx.fillRect(0,0,W,H);
  panel(W/2-120,H*.34,240,120,14);
  ctx.font='900 32px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=8;ctx.strokeText('PAUSED ⏸',W/2,H*.42);var g=ctx.createLinearGradient(W/2-90,0,W/2+90,0);g.addColorStop(0,'#FFD700');g.addColorStop(1,'#FF9A3C');ctx.fillStyle=g;ctx.fillText('PAUSED ⏸',W/2,H*.42);
  ctx.fillStyle='rgba(255,220,160,.75)';ctx.font='bold 14px Arial';ctx.fillText('Tap to continue',W/2,H*.5);ctx.textAlign='left';
}

function loop(){update();render();requestAnimationFrame(loop);}
loop();
if(isHikariBoy){initAC();startCD();}
