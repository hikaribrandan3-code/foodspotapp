(function(){

const crtVignette=(function(){var g=offCRT.getContext('2d').createRadialGradient(W/2,H/2,H*.22,W/2,H/2,H*.76);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.3)');return g;})();

// Pre-render halftone pattern once
function rebuildHalftone(){
  const c=offHalftone.getContext('2d');
  c.clearRect(0,0,W,offHalftone.height);
  var sp=16;
  for(var row=0;row<Math.ceil(COUNTER_Y/sp);row++){
    for(var col=0;col<Math.ceil(W/sp);col++){
      var ox=(row%2===0)?0:sp/2;
      c.beginPath();c.arc(col*sp+ox,row*sp,1.5,0,Math.PI*2);c.fill();
    }
  }
}
rebuildHalftone();

const BG_KANJI=['食','旨','炎','辛','超','爆','熱','神'];
function BgKanji(){this.x=rnd(20,W-20);this.y=rnd(COUNTER_Y*.6,COUNTER_Y*.9);this.txt=BG_KANJI[Math.floor(rnd(0,BG_KANJI.length))];this.sz=rnd(14,28);this.alpha=rnd(.04,.12);this.vy=rnd(-.4,-.15);this.life=1;this.col=feverMode?'hsl('+Math.floor(rnd(0,360))+',100%,70%)':'rgba(180,100,20,1)';}

function FloatKanji(x,y,txt,col,sz,isWord){this.x=x;this.y=y;this.txt=txt;this.col=col;this.sz=sz;this.life=1;this.vy=rnd(-1.8,-.8);this.vx=rnd(-1,1);this.rot=rnd(-.3,.3);this.isWord=!!isWord;}
FloatKanji.prototype.update=function(){this.y+=this.vy;this.x+=this.vx;this.life-=.014;};
FloatKanji.prototype.draw=function(){var a=Math.max(0,this.life);if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(this.x,this.y);ctx.rotate(this.rot*(1-this.life));ctx.font='900 '+this.sz+'px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=this.isWord?6:4;ctx.strokeText(this.txt,0,0);ctx.fillStyle=this.col;ctx.fillText(this.txt,0,0);ctx.restore();};
function spawnKanji(x,y,bad){var txt=bad?KANJI_BAD[Math.floor(rnd(0,KANJI_BAD.length))]:KANJI_FOOD[Math.floor(rnd(0,KANJI_FOOD.length))];var col=bad?'#FF3860':['#FFD700','#FF6B00','#00E5FF','#FF3860','#39FF14'][Math.floor(rnd(0,5))];kanjiFloats.push(new FloatKanji(x,y,txt,col,rnd(22,38)));}

function Drizzle(x,y,w,type){this.x=x;this.y=y;this.w=w;this.type=type;this.life=1;this.progress=0;this.col=type==='ketchup'?'#DD1111':type==='mustard'?'#E6C200':'#F5F5DC';this.pts=[];var segs=Math.floor(w/18)+2;for(var i=0;i<=segs;i++){this.pts.push({x:x+i*(w/segs),y:y+rnd(-5,5)});}this.bottleX=x+rnd(w*.1,w*.5);this.bottleY=y-32;this.bottleVy=-4;this.bottleDone=false;}
Drizzle.prototype.update=function(){this.progress=Math.min(1,this.progress+.045);this.life-=.008;if(!this.bottleDone){this.bottleY+=this.bottleVy;this.bottleVy+=.8;if(this.bottleY>=this.y-18){this.bottleVy*=-.55;if(Math.abs(this.bottleVy)<1)this.bottleDone=true;}}};
Drizzle.prototype.draw=function(){var a=Math.max(0,this.life);if(a<=0)return;ctx.save();ctx.globalAlpha=a;var totalPts=this.pts.length,showPts=Math.floor(this.progress*(totalPts-1))+1;ctx.strokeStyle=this.col;ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(this.pts[0].x,this.pts[0].y);for(var i=1;i<showPts;i++){var mx=(this.pts[i-1].x+this.pts[i].x)/2,my=(this.pts[i-1].y+this.pts[i].y)/2;ctx.quadraticCurveTo(this.pts[i-1].x,this.pts[i-1].y,mx,my);}ctx.stroke();if(!this.bottleDone){var icon=this.type==='ketchup'?'🍅':this.type==='mustard'?'🟡':'🤍';ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText(icon,this.bottleX,this.bottleY);}ctx.restore();};
function spawnDrizzle(x,y,w,type){drizzles.push(new Drizzle(x,y,w,type));}

function ScoreTicker(pts,x,y){this.pts=pts;this.x=x;this.y=y;this.life=1;this.w=0;this.vy=-1.2;this.targetW=pts>3?88:64;}
ScoreTicker.prototype.update=function(){this.y+=this.vy;this.vy*=.96;this.life-=.022;this.w=Math.min(this.w+8,this.targetW);};
ScoreTicker.prototype.draw=function(){var a=this.life;if(a<=0)return;ctx.save();ctx.globalAlpha=a;var col=this.pts>=4?'#FF3860':this.pts>=2?'#FF6B00':'#FFD700';ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x+this.w,this.y);ctx.lineTo(this.x+this.w+8,this.y+12);ctx.lineTo(this.x+this.w,this.y+24);ctx.lineTo(this.x,this.y+24);ctx.lineTo(this.x+8,this.y+12);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.font='900 '+(this.pts>=4?18:14)+'px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText('+'+this.pts,this.x+this.w/2+4,this.y+17);ctx.fillText('+'+this.pts,this.x+this.w/2+4,this.y+17);ctx.restore();};

function DamageNumber(x,y,pts,col){this.x=x;this.y=y;this.pts=pts;this.col=col;this.life=1;this.vy=rnd(-4,-2.5);this.vx=rnd(-1.5,1.5);this.rot=rnd(-.35,.35);this.sz=Math.min(48,22+pts*4);}
DamageNumber.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.vy*=.91;this.life-=.026;};
DamageNumber.prototype.draw=function(){var a=Math.max(0,this.life);if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(this.x,this.y);ctx.rotate(this.rot*(1-this.life*.5));ctx.font='900 '+this.sz+'px Arial Black';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=8;ctx.strokeText('+'+this.pts,0,0);var g=ctx.createLinearGradient(0,-this.sz,0,0);g.addColorStop(0,'#fff');g.addColorStop(1,this.col);ctx.fillStyle=g;ctx.fillText('+'+this.pts,0,0);ctx.restore();};

function Confetti(x,y){this.x=x;this.y=y;this.vx=rnd(-12,12);this.vy=rnd(-18,-4);this.w=rnd(6,16);this.h=rnd(4,9);this.r=rnd(0,Math.PI*2);this.spin=rnd(-.4,.4);this.col=['#FF3860','#FFD700','#00E5FF','#39FF14','#FF6B00','#E040FB','#00BFA5','#FF4081','#fff'][Math.floor(Math.random()*9)];this.life=1;this.grav=.55;}
Confetti.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.grav;this.r+=this.spin;this.life-=.015;this.vx*=.97;};
Confetti.prototype.draw=function(){var a=Math.max(0,this.life);if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(this.x,this.y);ctx.rotate(this.r);ctx.fillStyle=this.col;ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);ctx.restore();};
function Sparkle(x,y,col){this.x=x;this.y=y;this.col=col;this.vx=rnd(-6,6);this.vy=rnd(-9,-1);this.sz=rnd(5,13);this.life=1;this.r=0;this.spin=rnd(-.3,.3);}
Sparkle.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.vy+=.35;this.life-=.026;this.r+=this.spin;};
Sparkle.prototype.draw=function(){var a=Math.max(0,this.life);if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(this.x,this.y);ctx.rotate(this.r);ctx.beginPath();for(var i=0;i<5;i++){var a2=i/5*Math.PI*2-Math.PI/2,b2=a2+Math.PI/5;ctx.lineTo(Math.cos(a2)*this.sz,Math.sin(a2)*this.sz);ctx.lineTo(Math.cos(b2)*this.sz*.4,Math.sin(b2)*this.sz*.4);}ctx.closePath();ctx.fillStyle=this.col;ctx.fill();ctx.restore();};
function Coin(x,y){this.x=x;this.y=y;this.vx=rnd(-7,7);this.vy=rnd(-11,-3);this.life=1;this.fr=0;}
Coin.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.vy+=.42;this.life-=.018;this.vx*=.97;this.fr++;};
Coin.prototype.draw=function(){var a=Math.max(0,this.life);if(a<=0)return;var sc=Math.abs(Math.cos(this.fr*.15))+.1;ctx.save();ctx.globalAlpha=a;ctx.translate(this.x,this.y);ctx.fillStyle='#FFD700';ctx.strokeStyle='#B8860B';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,7*sc,7,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();};

function FlameLick(bx,by){this.x=bx+rnd(-10,10);this.y=by;this.vy=rnd(-3,-1.2);this.life=1;this.sz=rnd(6,14);this.hue=rnd(10,40);}

function loop(timestamp){
  // PERFORMANCE: Delta-time cap for consistent 60fps logic
  if(!lastFrameTime)lastFrameTime=timestamp;
  var rawDt=timestamp-lastFrameTime;
  lastFrameTime=timestamp;
  // Clamp dt to prevent spiral of death on lag spikes
  dt=Math.min(rawDt,FRAME_TIME*3);
  now=Date.now();
  acc+=dt;
  while(acc>=FRAME_TIME){
    update();
    acc-=FRAME_TIME;
  }
  render();
  requestAnimationFrame(loop);
}
