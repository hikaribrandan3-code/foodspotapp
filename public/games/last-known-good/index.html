<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Last Known Good</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none}
canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
PRD (VERBATIM)

**PRD — Last Known Good**

### Purpose

Create a one-input arcade engine where the player must decide **when to revert**, knowing that rolling back safety reduces future margin.

Designed to produce:

* Stress from choosing when to undo
* "I reverted too early / too late" failures
* High replay driven by rollback judgment, not reflex

This is **not timing-on-contact**, **not delayed resolution**, and **not cumulative pressure** — it's *strategic rollback with cost*.

---

### Core Gameplay Loop

* A vertical playfield shows a **STATE LINE** representing current system stability.
* The state line degrades continuously over time.
* At any moment, the player may tap **once** to **REVERT TO LAST KNOWN GOOD** state.
* Reverting:

  * Instantly restores stability to a prior safe level.
  * Permanently **reduces the maximum recoverable state** for future reverts.
* The player cannot chain reverts; a new "last known good" is established only after stabilizing briefly.

Failure occurs when:

* Current state degrades to zero before a revert or stabilization.

Each successful cycle:

* Degradation rate increases slightly.
* Revert penalty increases (less future recovery).
* Stabilization window shortens.

The key mechanic:
👉 *Undoing saves you now but weakens you later.*

---

### Inputs

* Single tap / click
* Tap triggers revert
* No movement
* No holds
* No secondary actions

---

### Scoring

* +1 per successful stabilization cycle completed
* Score awarded after stabilizing post-revert or sustained survival

---

### Difficulty Scaling

Progresses linearly by:

* Faster degradation
* Reduced revert restoration amount
* Shorter stabilization windows

Rules:

* Fully deterministic
* No randomness
* Always one viable revert strategy
* Failure driven by poor rollback timing

---

### UI / HUD

* Vertical playfield
* **CURRENT STATE METER** degrading downward
* **LAST KNOWN GOOD MARKER** indicating rollback point
* Clear visual change when revert reduces future ceiling
* Minimal numeric score at top center

Standard loop:

* Start screen
* 3–2–1 countdown
* Gameplay
* Pause
* Game over
* Restart

---

### Visual Rules

* Flat geometric shapes only
* Degradation and rollback clearly visible
* No text labels beyond score
* No characters
* No themes
* No textures or gradients

Game must be readable in < 1 second:

> State degrading → tap reverts → margin shrinks → survive if timed well

---

### Reskin Compatibility Notes

Highly reskinnable as:

* Save-point corruption
* Version rollback
* Checkpoint decay
* Memory erosion
* System restore metaphors

Core logic remains unchanged.

---

### Success Criteria

* Player understands revert has a cost
* First failure teaches rollback timing
* Tension increases with every revert
* Average run time under 30 seconds
* Strong "I used that too early" replay impulse
*/

/*
IMAGE PROMPT (VERBATIM)

Minimalist abstract mobile arcade wireflow.
Portrait 9:16 layout.
Flat colors only. No gradients, textures, realism, or theming.

A full-height vertical playfield fills the screen with a single solid background color.

Centered in the playfield is a **CURRENT STATE METER** — a tall vertical rectangular bar that **degrades downward continuously**.

A distinct horizontal marker on the meter represents the **LAST KNOWN GOOD** state.

Over time:

* The current state level moves downward toward failure.
* The last known good marker remains fixed unless updated.

When the player taps:

* The current state instantly jumps back up to the last known good marker.
* The maximum height of the last known good marker is visibly reduced for future reverts.

After stabilizing briefly:

* A new last known good marker is established at a lower ceiling.

A clearly marked **FAILURE LINE** sits at the bottom of the meter.

A minimal numeric score is displayed at the top center.

Only geometric elements are allowed:

* One vertical state meter
* One last-known-good marker
* One failure threshold line
* Visual indication of reduced recovery ceiling
* Numeric score only

No characters.
No props.
No icons.
No text labels beyond the score.
No decorative UI.

The mechanic must be instantly readable in under one second:

**State degrading → tap reverts → future ceiling shrinks → resolve**
*/

// ============== TUNING VALUES ==============
const GAME_WIDTH = 360;
const GAME_HEIGHT = 640;

// Meter dimensions
const METER_WIDTH = 80;
const METER_HEIGHT = 480;
const METER_X = (GAME_WIDTH - METER_WIDTH) / 2;
const METER_Y = 100;

// Initial values
const INITIAL_STATE = 1.0;
const INITIAL_CEILING = 1.0;
const INITIAL_LKG = 0.85;
const FAILURE_THRESHOLD = 0.0;

// Degradation
const BASE_DEGRADATION_RATE = 0.12;
const DEGRADATION_INCREASE_PER_CYCLE = 0.015;

// Revert mechanics
const BASE_CEILING_PENALTY = 0.08;
const CEILING_PENALTY_INCREASE_PER_CYCLE = 0.01;

// Stabilization
const BASE_STABILIZATION_TIME = 1.2;
const STABILIZATION_TIME_DECREASE_PER_CYCLE = 0.05;
const MIN_STABILIZATION_TIME = 0.4;

// LKG update after stabilization
const LKG_OFFSET_FROM_STATE = 0.15;

// Colors
const COLOR_BG = '#1a1a2e';
const COLOR_METER_BG = '#16213e';
const COLOR_METER_BORDER = '#4a5568';
const COLOR_STATE_FILL = '#06d6a0';
const COLOR_STATE_DANGER = '#ef476f';
const COLOR_LKG_MARKER = '#ffd166';
const COLOR_CEILING_MARKER = '#118ab2';
const COLOR_FAILURE_LINE = '#e63946';
const COLOR_TEXT = '#f8f9fa';
const COLOR_COUNTDOWN = '#ffd166';
const COLOR_START_TEXT = '#06d6a0';
const COLOR_GAMEOVER_TEXT = '#ef476f';

// Game states
const STATE_START = 0;
const STATE_COUNTDOWN = 1;
const STATE_PLAYING = 2;
const STATE_PAUSED = 3;
const STATE_GAMEOVER = 4;

// ============== GAME VARIABLES ==============
let canvas, ctx, dpr;
let gameState = STATE_START;
let score = 0;
let cycle = 0;

let currentState = INITIAL_STATE;
let ceiling = INITIAL_CEILING;
let lastKnownGood = INITIAL_LKG;

let degradationRate = BASE_DEGRADATION_RATE;
let ceilingPenalty = BASE_CEILING_PENALTY;
let stabilizationTime = BASE_STABILIZATION_TIME;

let isStabilizing = false;
let stabilizationTimer = 0;
let canRevert = true;

let countdownValue = 3;
let countdownTimer = 0;

let lastTime = 0;

// ============== INITIALIZATION ==============
function init() {
    canvas = document.getElementById('c');
    ctx = canvas.getContext('2d');
    
    dpr = window.devicePixelRatio || 1;
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    canvas.addEventListener('click', handleInput);
    canvas.addEventListener('touchstart', handleInput, { passive: false });
    document.addEventListener('keydown', handleKeyDown);
    
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
    const windowW = window.innerWidth;
    const windowH = window.innerHeight;
    
    const targetRatio = GAME_WIDTH / GAME_HEIGHT;
    const windowRatio = windowW / windowH;
    
    let renderW, renderH;
    
    if (windowRatio > targetRatio) {
        renderH = windowH;
        renderW = windowH * targetRatio;
    } else {
        renderW = windowW;
        renderH = windowW / targetRatio;
    }
    
    canvas.style.width = renderW + 'px';
    canvas.style.height = renderH + 'px';
    canvas.width = GAME_WIDTH * dpr;
    canvas.height = GAME_HEIGHT * dpr;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ============== INPUT HANDLING ==============
function handleInput(e) {
    e.preventDefault();
    
    switch (gameState) {
        case STATE_START:
            startCountdown();
            break;
        case STATE_COUNTDOWN:
            break;
        case STATE_PLAYING:
            attemptRevert();
            break;
        case STATE_PAUSED:
            resumeGame();
            break;
        case STATE_GAMEOVER:
            restartGame();
            break;
    }
}

function handleKeyDown(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        handleInput(e);
    } else if (e.code === 'Escape' && gameState === STATE_PLAYING) {
        pauseGame();
    } else if (e.code === 'Escape' && gameState === STATE_PAUSED) {
        resumeGame();
    }
}

// ============== GAME STATE FUNCTIONS ==============
function startCountdown() {
    gameState = STATE_COUNTDOWN;
    countdownValue = 3;
    countdownTimer = 0;
}

function startGame() {
    gameState = STATE_PLAYING;
    resetGameState();
}

function resetGameState() {
    score = 0;
    cycle = 0;
    currentState = INITIAL_STATE;
    ceiling = INITIAL_CEILING;
    lastKnownGood = INITIAL_LKG;
    degradationRate = BASE_DEGRADATION_RATE;
    ceilingPenalty = BASE_CEILING_PENALTY;
    stabilizationTime = BASE_STABILIZATION_TIME;
    isStabilizing = false;
    stabilizationTimer = 0;
    canRevert = true;
}

function pauseGame() {
    gameState = STATE_PAUSED;
}

function resumeGame() {
    gameState = STATE_PLAYING;
    lastTime = performance.now();
}

function gameOver() {
    gameState = STATE_GAMEOVER;
}

function restartGame() {
    startCountdown();
}

// ============== GAME MECHANICS ==============
function attemptRevert() {
    if (!canRevert || isStabilizing) return;
    
    currentState = lastKnownGood;
    
    ceiling = Math.max(0.1, ceiling - ceilingPenalty);
    
    lastKnownGood = Math.min(lastKnownGood, ceiling);
    
    isStabilizing = true;
    stabilizationTimer = 0;
    canRevert = false;
}

function completeStabilization() {
    isStabilizing = false;
    canRevert = true;
    
    score++;
    cycle++;
    
    degradationRate = BASE_DEGRADATION_RATE + (cycle * DEGRADATION_INCREASE_PER_CYCLE);
    ceilingPenalty = BASE_CEILING_PENALTY + (cycle * CEILING_PENALTY_INCREASE_PER_CYCLE);
    stabilizationTime = Math.max(MIN_STABILIZATION_TIME, 
        BASE_STABILIZATION_TIME - (cycle * STABILIZATION_TIME_DECREASE_PER_CYCLE));
    
    lastKnownGood = Math.min(ceiling, currentState - LKG_OFFSET_FROM_STATE);
    lastKnownGood = Math.max(0.1, lastKnownGood);
}

// ============== UPDATE ==============
function update(dt) {
    if (gameState === STATE_COUNTDOWN) {
        countdownTimer += dt;
        if (countdownTimer >= 1) {
            countdownTimer = 0;
            countdownValue--;
            if (countdownValue <= 0) {
                startGame();
            }
        }
        return;
    }
    
    if (gameState !== STATE_PLAYING) return;
    
    if (isStabilizing) {
        stabilizationTimer += dt;
        if (stabilizationTimer >= stabilizationTime) {
            completeStabilization();
        }
    } else {
        currentState -= degradationRate * dt;
        
        if (currentState <= FAILURE_THRESHOLD) {
            currentState = FAILURE_THRESHOLD;
            gameOver();
        }
    }
}

// ============== RENDER ==============
function render() {
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    switch (gameState) {
        case STATE_START:
            renderStartScreen();
            break;
        case STATE_COUNTDOWN:
            renderCountdown();
            break;
        case STATE_PLAYING:
            renderGame();
            break;
        case STATE_PAUSED:
            renderGame();
            renderPauseOverlay();
            break;
        case STATE_GAMEOVER:
            renderGame();
            renderGameOverOverlay();
            break;
    }
}

function renderStartScreen() {
    ctx.fillStyle = COLOR_METER_BG;
    ctx.fillRect(METER_X, METER_Y, METER_WIDTH, METER_HEIGHT);
    ctx.strokeStyle = COLOR_METER_BORDER;
    ctx.lineWidth = 2;
    ctx.strokeRect(METER_X, METER_Y, METER_WIDTH, METER_HEIGHT);
    
    const stateHeight = METER_HEIGHT * 0.7;
    ctx.fillStyle = COLOR_STATE_FILL;
    ctx.fillRect(METER_X, METER_Y + METER_HEIGHT - stateHeight, METER_WIDTH, stateHeight);
    
    const lkgY = METER_Y + METER_HEIGHT * (1 - 0.6);
    ctx.fillStyle = COLOR_LKG_MARKER;
    ctx.fillRect(METER_X - 10, lkgY - 3, METER_WIDTH + 20, 6);
    
    ctx.fillStyle = COLOR_FAILURE_LINE;
    ctx.fillRect(METER_X - 15, METER_Y + METER_HEIGHT - 3, METER_WIDTH + 30, 6);
    
    ctx.fillStyle = COLOR_START_TEXT;
    ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('TAP', GAME_WIDTH / 2, GAME_HEIGHT - 80);
}

function renderCountdown() {
    renderMeterPreview();
    
    ctx.fillStyle = COLOR_COUNTDOWN;
    ctx.font = 'bold 120px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(countdownValue.toString(), GAME_WIDTH / 2, GAME_HEIGHT / 2);
}

function renderMeterPreview() {
    ctx.fillStyle = COLOR_METER_BG;
    ctx.fillRect(METER_X, METER_Y, METER_WIDTH, METER_HEIGHT);
    ctx.strokeStyle = COLOR_METER_BORDER;
    ctx.lineWidth = 2;
    ctx.strokeRect(METER_X, METER_Y, METER_WIDTH, METER_HEIGHT);
    
    ctx.fillStyle = COLOR_FAILURE_LINE;
    ctx.fillRect(METER_X - 15, METER_Y + METER_HEIGHT - 3, METER_WIDTH + 30, 6);
}

function renderGame() {
    ctx.fillStyle = COLOR_TEXT;
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(score.toString(), GAME_WIDTH / 2, 30);
    
    ctx.fillStyle = COLOR_METER_BG;
    ctx.fillRect(METER_X, METER_Y, METER_WIDTH, METER_HEIGHT);
    ctx.strokeStyle = COLOR_METER_BORDER;
    ctx.lineWidth = 2;
    ctx.strokeRect(METER_X, METER_Y, METER_WIDTH, METER_HEIGHT);
    
    const ceilingY = METER_Y + METER_HEIGHT * (1 - ceiling);
    ctx.fillStyle = COLOR_CEILING_MARKER;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(METER_X, METER_Y, METER_WIDTH, ceilingY - METER_Y);
    ctx.globalAlpha = 1.0;
    
    ctx.fillStyle = COLOR_CEILING_MARKER;
    ctx.fillRect(METER_X - 5, ceilingY - 2, METER_WIDTH + 10, 4);
    
    const stateHeight = METER_HEIGHT * currentState;
    const stateY = METER_Y + METER_HEIGHT - stateHeight;
    
    const dangerThreshold = 0.3;
    if (currentState < dangerThreshold) {
        const dangerRatio = 1 - (currentState / dangerThreshold);
        ctx.fillStyle = interpolateColor(COLOR_STATE_FILL, COLOR_STATE_DANGER, dangerRatio);
    } else {
        ctx.fillStyle = COLOR_STATE_FILL;
    }
    ctx.fillRect(METER_X, stateY, METER_WIDTH, stateHeight);
    
    const lkgY = METER_Y + METER_HEIGHT * (1 - lastKnownGood);
    ctx.fillStyle = COLOR_LKG_MARKER;
    ctx.fillRect(METER_X - 10, lkgY - 3, METER_WIDTH + 20, 6);
    
    if (isStabilizing) {
        const progress = stabilizationTimer / stabilizationTime;
        ctx.strokeStyle = COLOR_LKG_MARKER;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(GAME_WIDTH / 2, METER_Y + METER_HEIGHT + 40, 20, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
        ctx.stroke();
    }
    
    ctx.fillStyle = COLOR_FAILURE_LINE;
    ctx.fillRect(METER_X - 15, METER_Y + METER_HEIGHT - 3, METER_WIDTH + 30, 6);
}

function renderPauseOverlay() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    ctx.fillStyle = COLOR_TEXT;
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    ctx.fillRect(GAME_WIDTH / 2 - 30, GAME_HEIGHT / 2 - 30, 20, 60);
    ctx.fillRect(GAME_WIDTH / 2 + 10, GAME_HEIGHT / 2 - 30, 20, 60);
}

function renderGameOverOverlay() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    ctx.fillStyle = COLOR_GAMEOVER_TEXT;
    ctx.font = 'bold 64px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(score.toString(), GAME_WIDTH / 2, GAME_HEIGHT / 2 - 40);
    
    ctx.fillStyle = COLOR_TEXT;
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText('TAP', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 40);
}

// ============== UTILITY FUNCTIONS ==============
function interpolateColor(color1, color2, ratio) {
    const r1 = parseInt(color1.slice(1, 3), 16);
    const g1 = parseInt(color1.slice(3, 5), 16);
    const b1 = parseInt(color1.slice(5, 7), 16);
    
    const r2 = parseInt(color2.slice(1, 3), 16);
    const g2 = parseInt(color2.slice(3, 5), 16);
    const b2 = parseInt(color2.slice(5, 7), 16);
    
    const r = Math.round(r1 + (r2 - r1) * ratio);
    const g = Math.round(g1 + (g2 - g1) * ratio);
    const b = Math.round(b1 + (b2 - b1) * ratio);
    
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

// ============== GAME LOOP ==============
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    update(dt);
    render();
    
    requestAnimationFrame(gameLoop);
}

// ============== START ==============
init();
</script>
</body>
</html>
