<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kanzo – The Last Samurai (Base+)</title>

<style>
/* ============================================================
   BASE+ VERSION – ULTRA-STABLE MOBILE-FIRST ENGINE
   Improvements Included:
   - DeltaTime timing system
   - DPR-aware canvas scaling
   - Fixed 360×640 locked game area
   - No CSS scaling blur
   - Optimized draw pipeline
   - Fixed UI layering
   - Clean input/controls
   ============================================================ */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #1a1a1a;
  touch-action: none;
}

#gameContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  touch-action: none;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* DPR-aware pixel-perfect canvas */
#gameCanvas {
  display: block;
  margin: 0;
  padding: 0;
  background: #2d4a3e;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  width: 100%;
  height: auto;
}

/* START SCREEN */
#startScreen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: url("cover.png") center/cover no-repeat;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 50;
  cursor: pointer;
  pointer-events: auto;
  transition: opacity 0.25s ease-out;
}

@media (min-width: 769px) {
  #startScreen {
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #000;
  }
}

#startScreen h1 {
  font-size: 32px;
  margin-bottom: 20px;
  color: #ff4444;
  text-shadow: 2px 2px 4px #000;
}

#startScreen p {
  font-size: 18px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:0.5; }
}

/* HUD */
#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  color: #fff;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  text-shadow: 1px 1px 2px #000;
  font-family: 'Courier New', monospace;
}

.hud-left, .hud-right {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

/* HUD BUTTONS */
.hud-buttons {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  gap: 10px;
  z-index: 25;
}

.hud-btn {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  background: rgba(0,0,0,0.6);
  border: 2px solid rgba(255,255,255,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: #fff;
  user-select: none;
  touch-action: none;
}

.hud-btn:active {
  background: rgba(255,255,255,0.3);
}

/* CONTROLS */
.controls {
  position: absolute;
  z-index: 20;
  user-select: none;
  touch-action: none;
}

/* DPAD - HIDDEN FOR ARCADE WRAPPER */
#dpad {
  display: none !important;
}

.dpad-btn {
  position: absolute;
  width: 45px;
  height: 45px;
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  color: #fff;
  touch-action: none;
}

#btnUp    { top: 0; left: 47px; }
#btnDown  { bottom: 0; left: 47px; }
#btnLeft  { top: 47px; left: 0; }
#btnRight { top: 47px; right: 0; }

/* ATTACK BUTTONS */
#attackBtns {
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.attack-btn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  font-weight: bold;
  touch-action: none;
}

/* MOBILE: Mirror D-Pad layout for attack buttons */
@media (max-width: 768px) {
  #attackBtns {
    bottom: 20px;
    right: 20px;
    width: 161px;
    height: 161px;
    position: absolute;
    display: block;
    gap: 0;
  }

  .attack-btn {
    position: absolute;
    width: 51.75px;
    height: 51.75px;
  }

  #btnLight {
    top: 0;
    left: 54.625px;
  }

  #btnHeavy {
    top: 54.625px;
    left: 0;
  }

  #btnGun {
    top: 54.625px;
    right: 0;
  }

  #btnWhirlwind {
    bottom: 0;
    left: 54.625px;
  }
}

#btnLight     { background: rgba(255,200,100,0.3); }
#btnHeavy     { background: rgba(255,100,100,0.3); }
#btnGun       { background: rgba(100,150,255,0.3); }
#btnWhirlwind { background: rgba(150,100,255,0.3); }

.attack-btn:active { background: rgba(255,255,255,0.4); }

/* Tablet/iPad specific viewport rules */
@media (min-width: 768px) and (orientation: portrait) {
  #gameContainer { 
    width: 100vw;
    height: 100dvh;
  }
  #gameCanvas {
    max-width: none;
    max-height: none;
  }
}

/* ===== FOODSPOT ARCADE WRAPPER ===== */
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;

  margin: 0; padding: 0;

/* Hide original game controls */

}

}

}
/* FoodSpot Arcade Controller - Hidden (use HikariBoy shell instead) */
#fs-controller {

}
/* D-PAD */
#fs-dpad {

}
.fs-dpad-cross-v {

}
.fs-dpad-btn {

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 2;
  width: 44px;
  height: 44px;

}
.fs-dpad-btn:active, .fs-dpad-btn.pressed {

  background: rgba(255,255,255,0.15);
}
#fs-up    { top: 0;       left: 50%; transform: translateX(-50%); border-radius: 6px 6px 0 0; }
#fs-down  { bottom: 0;    left: 50%; transform: translateX(-50%); border-radius: 0 0 6px 6px; }
#fs-left  { top: 50%;     left: 0;   transform: translateY(-50%); border-radius: 6px 0 0 6px; }
#fs-right { top: 50%;     right: 0;  transform: translateY(-50%); border-radius: 0 6px 6px 0; }
/* CENTER LOGO */
#fs-center-logo {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
#fs-center-logo span {
  color: rgba(255,255,255,0.15);
  font-size: 9px;
  font-family: 'Courier New', monospace;
  letter-spacing: 2px;
  text-transform: uppercase;
}
/* TRIGGERS */
#fs-triggers {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
}
.fs-trigger {
  width: 72px;
  height: 34px;
  border-radius: 8px;
  background: #1e1e3a;
  border: 2px solid #2a2a4a;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.6);
  font-size: 11px;
  font-weight: bold;
  font-family: 'Courier New', monospace;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.05s;
}
.fs-trigger:active, .fs-trigger.pressed {
  background: #3a3a6a;
  border-color: #6a6aaa;
  color: white;
  transform: translateY(1px);
}
/* ACTION BUTTONS */
#fs-buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
#fs-buttons-row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.fs-action-btn {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 900;
  font-family: 'Arial Black', Arial, sans-serif;
  cursor: pointer;
  border: none;
  box-shadow: 0 6px 0 rgba(0,0,0,0.4);
  transition: all 0.05s;

}
.fs-action-btn:active, .fs-action-btn.pressed {

}
#fs-btn-a {
  background: #dc2626;
  box-shadow: 0 6px 0 #7f1d1d, 0 8px 20px rgba(220,38,38,0.4);
}
#fs-btn-a:active, #fs-btn-a.pressed {
  box-shadow: 0 2px 0 #7f1d1d, 0 4px 10px rgba(220,38,38,0.3);
}
#fs-btn-b {
  background: #262626;
  box-shadow: 0 6px 0 #111, 0 8px 16px rgba(0,0,0,0.5);

  height: 54px;
  font-size: 18px;
  margin-bottom: -8px;
}
#fs-btn-b:active, #fs-btn-b.pressed {
  box-shadow: 0 2px 0 #111;
}
</style>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

<script>
/* ============================================================
   BASE+ ULTRA ENGINE SCRIPT
   Part 1 – Initialization, Canvas Scaling, Global Systems
   ============================================================ */

/* ---------- DPR + CANVAS SETUP ---------- */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d", { alpha: false });

/* Fixed logical resolution */
const LOGICAL_WIDTH  = 360;
const LOGICAL_HEIGHT = 640;

/* Dynamic physical resolution based on DPR */
let dpr = window.devicePixelRatio || 1;

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;

  canvas.width = LOGICAL_WIDTH * dpr;
  canvas.height = LOGICAL_HEIGHT * dpr;

  canvas.style.width = LOGICAL_WIDTH + "px";
  canvas.style.height = LOGICAL_HEIGHT + "px";

  // Detect iPad (Safari reports desktop-class viewport)
  const isIPad = navigator.userAgent.includes("iPad") || 
                 (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  
  // Detect if screen is tablet-sized and in portrait
  const isTabletPortrait = window.innerWidth >= 768 && window.innerHeight > window.innerWidth;
  
  // Use cover scaling for iPad/tablets (fills screen), contain for phones (fits inside)
  const useFullscreen = isIPad && isTabletPortrait;
  
  const scale = window.innerWidth / LOGICAL_WIDTH;
  
  canvas.style.transform = `scale(${scale}) translateZ(0)`;
  canvas.style.transformOrigin = "top center";

  ctx.scale(dpr, dpr);
  ctx.imageSmoothingEnabled = false;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

/* ---------- GLOBAL GAME STATE ---------- */
let gameState = "playing";
let isPaused = false;

/* Boot directly into gameplay (no start screen) */
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("hud").style.display = "flex";
  document.querySelector(".hud-buttons").style.display = "flex";
  initGame();
});

/* DeltaTime system */
let lastFrameTime = performance.now();
let delta = 1;  // normalized relative to 60fps (1 = perfect frame)

/* ---------- INPUT SYSTEM (Fixed & Stable) ---------- */
const keys = Object.create(null);
const touchState = { up:false, down:false, left:false, right:false };

/* Clean reset for all input */
function resetInput() {
  for (let k in keys) keys[k] = false;
  touchState.up = touchState.down = touchState.left = touchState.right = false;
}

/* Keyboard */
window.addEventListener("blur", resetInput);
window.addEventListener("visibilitychange", () => {
  if (document.hidden) resetInput();
});

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

/* HikariBoy Arcade Controller Integration */
window.addEventListener("message", e => {
  if (e.data.type === "BUTTON_PRESS") {
    const btn = e.data.button;
    if (btn === "dpad-up") keys["w"] = true;
    if (btn === "dpad-down") keys["s"] = true;
    if (btn === "dpad-left") keys["a"] = true;
    if (btn === "dpad-right") keys["d"] = true;
    if (btn === "a") { performLightAttack(); performHeavyAttack(); }
    if (btn === "b") shootGun();
    if (btn === "l") performWhirlwind();
    if (btn === "r") performWhirlwind();
    if (btn === "start" && gameState === "gameover") fullReset();
  }
  if (e.data.type === "BUTTON_RELEASE") {
    const btn = e.data.button;
    if (btn === "dpad-up") keys["w"] = false;
    if (btn === "dpad-down") keys["s"] = false;
    if (btn === "dpad-left") keys["a"] = false;
    if (btn === "dpad-right") keys["d"] = false;
  }
});

/* Mobile touch input – fully upgraded in Base+ */
function bindTouch(btnId, stateKey) {
  const el = document.getElementById(btnId);

  el.addEventListener("touchstart", e => {
    e.preventDefault();
    touchState[stateKey] = true;
  }, { passive:false });

  el.addEventListener("touchend", e => {
    e.preventDefault();
    touchState[stateKey] = false;
  }, { passive:false });

  el.addEventListener("touchcancel", () => {
    touchState[stateKey] = false;
  });
}

bindTouch("btnUp",    "up");
bindTouch("btnDown",  "down");
bindTouch("btnLeft",  "left");
bindTouch("btnRight", "right");

/* ---------- PLAYER OBJECT (Base+) ---------- */
const player = {
  x: LOGICAL_WIDTH/2 - 25,
  y: LOGICAL_HEIGHT/2 - 25,
  width: 50,
  height: 50,
  speed: 240,    // pixels per second (converted via delta)
  hp: 100,
  maxHp: 100,
  facingRight: true,

  /* Combat */
  ammo: 30,
  maxAmmo: 30,
  reloadTime: 0,     // seconds, not frames
  heavyCooldown: 0,
  whirlCooldown: 0,
  lightCombo: 0,
  lastLightTime: 0,

  /* Animation */
  animState: "idle",
  animFrame: 0,
  animTimer: 0
};

/* ---------- ENEMY / BULLET POOLS (Base+) ---------- */
const enemies = [];
const bullets = [];

/* Enemy types (unchanged gameplay stats) */
const ENEMY_TYPES = {
  zombie: { hp:21, speed:40, damage:2.5 },
  ghost:  { hp:14, speed:55, damage:2.0 },
  gorilla: { hp:425, speed:50, damage:25 }
};

/* ---------- ATTACK HITBOXES ---------- */
let lightAttack = null;
let heavyAttack = null;
let whirlAttack = null;

/* Unique ID generator for safe hit tracking */
let UID = 1;
function newID() { return UID++; }

/* ---------- WAVE MANAGEMENT ---------- */
let wave = 1;
let score = 0;

/* Spawn queue system for staggered enemy spawning */
let spawnQueue = [];
let spawnTimerGlobal = 0;
let waveEnemyCount = 0;

/* ---------- CHEST REWARD SYSTEM ---------- */
let chestActive = false;
let chest = null;

/* Shotgun mode */
let shotgunMode = false;
let shotgunRoundsLeft = 0;

/* Muzzle flash effect */
let muzzleFlash = {
  active: false,
  x: 0,
  y: 0,
  timer: 0,
  duration: 0.08
};

/* Spirit Slash buff */
let spiritSlashActive = false;
let spiritSlashTimer = 0;
const spiritSlashProjectiles = [];

/* Boss intro flags */
let bossIntroActive = false;
let bossIntroTimer = 0;

/* Gorilla spawn counter for scaling */
let gorillaSpawnCount = 0;



/* Spawn enemies with ID (fixes splice/hit issues) */
function spawnWave() {
  if (typeof fxBanner === 'function') fxBanner('WAVE ' + wave);
  // OPTION A: Legit Hard difficulty curve
  const count = (() => {
    if (wave < 5) return 5;                                 // early warm-up
    if (wave < 10) return 8;                                // wave 5 → ~8 enemies
    if (wave < 15) return 12;                               // wave 10 → ~12 enemies
    if (wave < 20) return 16;                               // wave 15 → ~16 enemies
    return 20;                                              // wave 20+ → ~20 enemies
  })();
  
  spawnQueue = [];
  
  // normal enemy spawns
  for (let i = 0; i < count; i++) {
    spawnQueue.push("normal");
  }
  
  // gorilla spawn rule remains untouched
  if (wave % 7 === 0) {
    spawnQueue.push("gorilla");
  }
  
  waveEnemyCount = spawnQueue.length;
  spawnTimerGlobal = 0;
}

/* Spawn individual enemies from queue */
function spawnEnemy(type) {
  let x, y;
  const side = Math.floor(Math.random() * 4);
  if (side === 0) { x = Math.random() * LOGICAL_WIDTH; y = -30; }
  if (side === 1) { x = LOGICAL_WIDTH + 30; y = Math.random() * LOGICAL_HEIGHT; }
  if (side === 2) { x = Math.random() * LOGICAL_WIDTH; y = LOGICAL_HEIGHT + 30; }
  if (side === 3) { x = -30; y = Math.random() * LOGICAL_HEIGHT; }
  
  if (type === "gorilla") {
    console.log("GORILLA SPAWN - Wave:", wave, "Count:", gorillaSpawnCount);
    const tmpl = ENEMY_TYPES.gorilla;
    
    /* Balance patch: 20% damage nerf */
    const balancedDamage = tmpl.damage * 0.8;
    
    /* Balance patch: 10% HP growth per appearance */
    const balancedHP = tmpl.hp * (1 + (gorillaSpawnCount * 0.10));
    
    // Spawn at further distance for gorilla
    if (side === 0) y = -70;
    if (side === 1) x = LOGICAL_WIDTH + 70;
    if (side === 2) y = LOGICAL_HEIGHT + 70;
    if (side === 3) x = -70;
    
    enemies.push({
      id: newID(),
      type,
      x, y,
      width: 70,
      height: 60,
      hp: balancedHP,
      maxHp: balancedHP,
      speed: tmpl.speed,  // Keep speed unchanged
      damage: balancedDamage,
      attackCooldown: 0,
      spawnTimer: 0.4,
      animFrame: 0,
      animTimer: 0,
      gorillaState: 'walk',
      slamCooldown: 4.0,
      prepTimer: 0,
      windedTimer: 0,
      slamActive: false,
      slamTimer: 0
    });
    
    /* Increment spawn counter for scaling */
    gorillaSpawnCount++;
    
    bossIntroActive = true;
    bossIntroTimer = 1.6;
    isPaused = true;
    
    console.log("Gorilla spawned! Total enemies:", enemies.length);
  } else {
    const speedMul = 1 + (wave - 1) * 0.05;
    const tmpl = ENEMY_TYPES[type];
    
    enemies.push({
      id: newID(),
      type,
      x, y,
      width: 35,
      height: 35,
      hp: tmpl.hp,
      maxHp: tmpl.hp,
      speed: tmpl.speed * speedMul,
      damage: tmpl.damage,
      attackCooldown: 0,
      spawnTimer: 0.4,
      animFrame: 0,
      animTimer: 0
    });
  }
}

/* ---------- HUD UPDATE (Base+) ---------- */
function updateHUD() {
  document.getElementById("waveDisplay").textContent = wave;
  document.getElementById("scoreDisplay").textContent = score;
  document.getElementById("hpDisplay").textContent = Math.max(0, Math.floor(player.hp));
  document.getElementById("ammoDisplay").textContent = player.ammo;
}

/* ============================================================
   PLAYER INPUT → MOVEMENT
   (deltaTime normalized, diagonal corrected, no jitter)
   ============================================================ */
function updatePlayerMovement(dt) {
  let dx = 0, dy = 0;

  if (keys["w"] || touchState.up) { dy -= 1; player.lastDir = "up"; }
  if (keys["s"] || touchState.down) { dy += 1; player.lastDir = "down"; }
  if (keys["a"] || touchState.left)  { dx -= 1; player.facingRight = false; player.lastDir = "left"; }
  if (keys["d"] || touchState.right) { dx += 1; player.facingRight = true; player.lastDir = "right"; }

  if (dx !== 0 || dy !== 0) {
    const mag = Math.hypot(dx, dy);
    dx /= mag; dy /= mag;

    player.x += dx * player.speed * dt;
    player.y += dy * player.speed * dt;
  }

  /* Clamp to game area */
  player.x = Math.max(0, Math.min(LOGICAL_WIDTH - player.width, player.x));
  player.y = Math.max(0, Math.min(LOGICAL_HEIGHT - player.height, player.y));
}

/* ============================================================
   COMBAT LOGIC (Base+ stable hitboxes + cooldowns)
   ============================================================ */

function performLightAttack() {
  // Check for Spirit Slash buff
  if (spiritSlashActive) {
    fireSpiritSlashProjectile();
    
    player.animState = "light";
    player.animFrame = 0;
    player.animTimer = 0;
    return;
  }
  
  const now = performance.now();

  /* reset combo after delay */
  if (now - player.lastLightTime > 450) player.lightCombo = 0;

  player.lightCombo++;
  if (player.lightCombo > 3) player.lightCombo = 1;

  player.lastLightTime = now;

  player.animState = "light";
  player.animFrame = 0;
  player.animTimer = 0;

  const dir = player.lastDir || (player.facingRight ? "right" : "left");
  const isVert = dir === "up" || dir === "down";

  lightAttack = {
    id: newID(),
    x: dir === "right" ? player.x + player.width :
       dir === "left"  ? player.x - 50 :
       player.x + player.width/2 - 15,
    y: dir === "down"  ? player.y + player.height :
       dir === "up"    ? player.y - 30 :
       player.y + player.height/2 - 15,
    width:  isVert ? 30 : 50,
    height: isVert ? 30 : 30,
    damage: 8 + player.lightCombo * 2,
    timeLeft: 0.12,
    hit: new Set()
  };
  fxSlashArc(dir === 'right' ? 0 : dir === 'left' ? Math.PI : dir === 'down' ? Math.PI / 2 : -Math.PI / 2, false);
}

function performHeavyAttack() {
  if (player.heavyCooldown > 0) return;

  player.heavyCooldown = 1.0;
  player.animState = "heavy";
  player.animFrame = 0;
  player.animTimer = 0;

  const dir = player.lastDir || (player.facingRight ? "right" : "left");
  const isVert = dir === "up" || dir === "down";

  heavyAttack = {
    id: newID(),
    x: dir === "right" ? player.x + player.width :
       dir === "left"  ? player.x - 80 :
       player.x + player.width/2 - 20,
    y: dir === "down"  ? player.y + player.height :
       dir === "up"    ? player.y - 40 :
       player.y + player.height/2 - 20,
    width:  isVert ? 40 : 80,
    height: isVert ? 40 : 40,
    damage: 18,
    knock: 15,
    timeLeft: 0.22,
    hit: new Set()
  };
  fxSlashArc(dir === 'right' ? 0 : dir === 'left' ? Math.PI : dir === 'down' ? Math.PI / 2 : -Math.PI / 2, true);
  fxShake(4);
}

function shootGun() {
  if (player.ammo <= 0 || player.reloadTime > 0) return;
  
  player.ammo--;
  
  if (shotgunMode && shotgunRoundsLeft > 0) {
    // SHOTGUN MODE: 3-pellet spread in last direction
    const sdir = player.lastDir || (player.facingRight ? "right" : "left");
    const baseVX = sdir === "right" ? 400 : sdir === "left" ? -400 : 0;
    const baseVY = sdir === "down"  ? 400 : sdir === "up"   ? -400 : 0;
    const centerX = player.x + player.width / 2;
    const centerY = player.y + player.height / 2;
    
    // Create 3 pellets with spread
    const baseSpd = Math.max(Math.abs(baseVX), Math.abs(baseVY));
    for (let i = 0; i < 3; i++) {
      const spreadAngle = (i - 1) * 0.15;
      const angle = Math.atan2(baseVY, baseVX) + spreadAngle;
      const vx = Math.cos(angle) * baseSpd;
      const vy = Math.sin(angle) * baseSpd;
      
      bullets.push({
        id: newID(),
        x: centerX,
        y: centerY,
        vx: vx,
        vy: vy,
        size: 6,
        damage: 10
      });
    }
    
    shotgunRoundsLeft--;
    
    // Deactivate shotgun mode when rounds depleted
    if (shotgunRoundsLeft <= 0) {
      shotgunMode = false;
    }
    
    // Trigger muzzle flash
    triggerMuzzleFlash();
    
  } else {
    // NORMAL MODE: single bullet — fires in last movement direction
    const dir = player.lastDir || (player.facingRight ? "right" : "left");
    const spd = 400;
    const bvx = dir === "right" ? spd : dir === "left" ? -spd : 0;
    const bvy = dir === "down"  ? spd : dir === "up"   ? -spd : 0;
    bullets.push({
      id: newID(),
      x: player.x + player.width / 2,
      y: player.y + player.height / 2,
      vx: bvx,
      vy: bvy,
      size: 6,
      damage: 10
    });
  }
  
  if (player.ammo === 0) startReload();
}

function startReload() {
  if (player.reloadTime > 0 || player.ammo === player.maxAmmo) return;
  player.reloadTime = 2.0; // seconds
}

function performWhirlwind() {
  if (player.whirlCooldown > 0) return;
  player.whirlCooldown = 4.5;

  player.animState = "whirl";
  player.animFrame = 0;
  player.animTimer = 0;

  whirlAttack = {
    id: newID(),
    x: player.x - 50,
    y: player.y - 50,
    width: 150,
    height: 150,
    timeLeft: 0.30,
    damage: 30,
    rotation: 0,
    hit: new Set()
  };
}

/* ============================================================
   BULLET UPDATES (No tunneling, delta-based)
   ============================================================ */
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    /* remove offscreen */
    if (
      b.x < -30 || b.x > LOGICAL_WIDTH+30 ||
      b.y < -30 || b.y > LOGICAL_HEIGHT+30
    ) {
      bullets.splice(i, 1);
    }
  }
}

/* ============================================================
   ENEMY LOGIC (Movement + Cooldowns + DeltaTime)
   ============================================================ */
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    /* spawn delay */
    if (e.spawnTimer > 0) {
      e.spawnTimer -= dt;
      continue;
    }

    /* animate */
    e.animTimer += dt;
    if (e.animTimer > 0.17) {
      e.animTimer = 0;
      e.animFrame = (e.animFrame + 1) % 2;
    }

    /* GORILLA BEHAVIOR */
    if (e.type === 'gorilla') {
      if (e.gorillaState === 'walk') {
        /* Walk toward player */
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 0) {
          e.x += (dx / dist) * e.speed * dt;
          e.y += (dy / dist) * e.speed * dt;
        }

        /* Countdown slam cooldown */
        e.slamCooldown -= dt;
        if (e.slamCooldown <= 0) {
          e.gorillaState = 'slamPrep';
          e.prepTimer = 0.35;
        }

        /* Normal contact damage */
        if (e.attackCooldown <= 0 && aabb(e, player)) {
          e.attackCooldown = 1.0;
          applyPlayerDamage(e.damage);
        }
      } else if (e.gorillaState === 'slamPrep') {
        /* Stop moving, flash red */
        e.prepTimer -= dt;
        if (e.prepTimer <= 0) {
          e.gorillaState = 'slam';
          e.slamActive = true;
          e.slamTimer = 0.15;
          
          /* Execute slam damage */
          const gorillaCenter = {
            x: e.x + e.width / 2,
            y: e.y + e.height / 2
          };
          const playerCenter = {
            x: player.x + player.width / 2,
            y: player.y + player.height / 2
          };
          
          /* Check player distance */
          const playerDist = Math.hypot(
            gorillaCenter.x - playerCenter.x,
            gorillaCenter.y - playerCenter.y
          );
          
          if (playerDist <= 75) {
            applyPlayerDamage(50);
          }
          
          /* Damage other enemies in radius */
          for (let j = enemies.length - 1; j >= 0; j--) {
            const other = enemies[j];
            if (other.id === e.id) continue;
            
            const otherCenter = {
              x: other.x + other.width / 2,
              y: other.y + other.height / 2
            };
            
            const otherDist = Math.hypot(
              gorillaCenter.x - otherCenter.x,
              gorillaCenter.y - otherCenter.y
            );
            
            if (otherDist <= 75) {
              other.hp -= 25;
              if (other.hp <= 0) {
                enemies.splice(j, 1);
                score++;
                if (j < i) i--;
              }
            }
          }
          
          e.windedTimer = 0.6;
        }
      } else if (e.gorillaState === 'slam') {
        /* Slam animation */
        e.slamTimer -= dt;
        if (e.slamTimer <= 0) {
          e.slamActive = false;
        }
        
        /* Winded period */
        e.windedTimer -= dt;
        if (e.windedTimer <= 0) {
          e.gorillaState = 'walk';
          e.slamCooldown = 4.0;
        }
      }
      
      if (e.attackCooldown > 0) e.attackCooldown -= dt;
      continue;
    }

    /* NORMAL ENEMY BEHAVIOR (zombie/ghost) */
    /* move toward player */
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 0) {
      e.x += (dx / dist) * e.speed * dt;
      e.y += (dy / dist) * e.speed * dt;
    }

    /* collisions with player */
    if (e.attackCooldown <= 0 && aabb(e, player)) {
      e.attackCooldown = 1.0; // seconds
      applyPlayerDamage(e.damage);
    }

    if (e.attackCooldown > 0) e.attackCooldown -= dt;
  }
}

/* ============================================================
   HITBOX COLLISION SYSTEM (Base+)
   ============================================================ */

function aabb(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

/* Attack collision handler */
/* ============================================================
   FX ENGINE — pure visual juice layer. Zero gameplay impact:
   particles, slash arcs, damage popups, screen shake, combos,
   wave banners, ambient dust, CRT overlay. Called from hit /
   death / spawn sites; render() draws it all.
   ============================================================ */
const FX = { parts: [], texts: [], arcs: [], shake: 0, combo: 0, comboT: 0, banner: '', bannerT: 0, dust: [] };
for (let i = 0; i < 26; i++) FX.dust.push({ x: Math.random() * 360, y: Math.random() * 640, s: 0.5 + Math.random() * 1.4, v: 6 + Math.random() * 14 });
function fxShake(n) { FX.shake = Math.max(FX.shake, n); }
function fxText(x, y, txt, col, size) { FX.texts.push({ x, y, txt, col, size: size || 13, life: 0.8, vy: -46 }); }
function fxBurst(x, y, col, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (spd || 90) * (0.4 + Math.random() * 0.9);
    FX.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: 0.35 + Math.random() * 0.35, col, sz: 2 + Math.random() * 3 });
  }
}
function fxHit(e, dmg, col) {
  const cx = e.x + e.width / 2, cy = e.y + e.height / 2;
  fxBurst(cx, cy, col || '#ffd843', 8, 110);
  fxBurst(cx, cy, '#fff', 4, 60);
  fxText(cx, cy - 14, '-' + dmg, '#fff');
  e.flashT = 0.12;
  FX.combo++; FX.comboT = 2.0;
  if (FX.combo > 0 && FX.combo % 5 === 0) fxText(player.x + 25, player.y - 20, 'COMBO x' + FX.combo + '!', '#ffd843', 17);
  fxShake(3);
}
function fxDeath(e) {
  const cx = e.x + e.width / 2, cy = e.y + e.height / 2;
  fxBurst(cx, cy, '#ff5b4d', 16, 150); fxBurst(cx, cy, '#ffb347', 10, 90);
  // derez ring
  FX.arcs.push({ x: cx, y: cy, r: 6, vr: 190, life: 0.35, col: 'rgba(255,220,120,', ring: true });
  fxText(cx, cy - 20, '+1', '#7dff8a', 15);
  fxShake(6);
}
function fxSlashArc(dir, heavy) {
  // crescent slash trail in front of the player
  const cx = player.x + 25, cy = player.y + 25;
  FX.arcs.push({ x: cx, y: cy, r: heavy ? 58 : 44, vr: 0, life: heavy ? 0.22 : 0.16,
                 a0: dir - 1.1, a1: dir + 1.1, col: heavy ? 'rgba(255,120,80,' : 'rgba(255,240,190,', ring: false });
}
function fxBanner(t) { FX.banner = t; FX.bannerT = 1.8; }
function updateFX(dt) {
  if (FX.shake > 0) FX.shake = Math.max(0, FX.shake - 32 * dt);
  if (FX.comboT > 0) { FX.comboT -= dt; if (FX.comboT <= 0) FX.combo = 0; }
  if (FX.bannerT > 0) FX.bannerT -= dt;
  for (let i = FX.parts.length - 1; i >= 0; i--) {
    const p = FX.parts[i]; p.life -= dt;
    if (p.life <= 0) { FX.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
  }
  for (let i = FX.texts.length - 1; i >= 0; i--) {
    const t = FX.texts[i]; t.life -= dt;
    if (t.life <= 0) { FX.texts.splice(i, 1); continue; }
    t.y += t.vy * dt; t.vy *= 0.93;
  }
  for (let i = FX.arcs.length - 1; i >= 0; i--) {
    const a = FX.arcs[i]; a.life -= dt; a.r += (a.vr || 0) * dt;
    if (a.life <= 0) FX.arcs.splice(i, 1);
  }
  for (const d of FX.dust) { d.y -= d.v * dt; d.x += Math.sin(d.y * 0.02) * 8 * dt; if (d.y < -4) { d.y = 644; d.x = Math.random() * 360; } }
}
function drawFX() {
  for (const a of FX.arcs) {
    const al = Math.max(0, a.life * (a.ring ? 2.8 : 6));
    ctx.strokeStyle = a.col + al + ')'; ctx.lineWidth = a.ring ? 3 : 7; ctx.lineCap = 'round';
    ctx.beginPath();
    if (a.ring) ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
    else ctx.arc(a.x, a.y, a.r, a.a0, a.a1);
    ctx.stroke();
    if (!a.ring) { ctx.strokeStyle = 'rgba(255,255,255,' + al * 0.7 + ')'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(a.x, a.y, a.r - 5, a.a0 + 0.15, a.a1 - 0.15); ctx.stroke(); }
  }
  for (const p of FX.parts) {
    ctx.globalAlpha = Math.min(1, p.life * 3);
    ctx.fillStyle = p.col; ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of FX.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2.2);
    ctx.font = 'bold ' + t.size + 'px Courier New';
    ctx.fillStyle = '#000'; ctx.fillText(t.txt, t.x + 1.5, t.y + 1.5);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function handleAttackHitbox(box, dt) {
  if (!box) return null;

  box.timeLeft -= dt;
  if (box.timeLeft <= 0) return null;

  /* track box to player for WHIRLWIND */
  if (box === whirlAttack) {
    whirlAttack.x = player.x - 50;
    whirlAttack.y = player.y - 50;
    whirlAttack.rotation += 420 * dt; // consistent spinning
  }

  /* check collision vs enemies */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    if (box.hit.has(e.id)) continue;

    if (aabb(e, box)) {
      e.hp -= box.damage;
      box.hit.add(e.id);
      fxHit(e, box.damage, box === heavyAttack ? '#ff8a5b' : box === whirlAttack ? '#b89bff' : '#ffe9a8');
      if (box === heavyAttack) fxShake(7);

      /* knockback for heavy / whirl */
      if (box.knock || box === whirlAttack) {
        const dx = e.x - player.x;
        const dy = e.y - player.y;
        const dist = Math.hypot(dx, dy) || 1;
        const force = box.knock || 25;

        e.x += (dx / dist) * force;
        e.y += (dy / dist) * force;
      }

      if (e.hp <= 0) {
        fxDeath(e);
        enemies.splice(i, 1);
        score++;
      }
    }
  }

  return box;
}

/* ============================================================
   PART 3 – Bullet → Enemy Collisions, Rendering System,
   Game Loop, Audio, Game State, Full Reset
   ============================================================ */

/* ============================================================
   BULLET COLLISIONS (DeltaTime + Safe ID Tracking)
   ============================================================ */
   function handleBulletCollisions() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    /* Check vs enemies */
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];

      if (
        b.x > e.x && b.x < e.x + e.width &&
        b.y > e.y && b.y < e.y + e.height
      ) {
        e.hp -= b.damage;
        fxHit(e, b.damage, '#ffe36b');

        /* Remove bullet */
        bullets.splice(i, 1);

        if (e.hp <= 0) {
          fxDeath(e);
          enemies.splice(j, 1);
          score++;
        }

        break;
      }
    }
  }
}

/* ============================================================
   CHEST REWARD SYSTEM
   ============================================================ */

function spawnChest() {
  const margin = 40;
  const x = margin + Math.random() * (LOGICAL_WIDTH - margin * 2);
  const y = margin + Math.random() * (LOGICAL_HEIGHT - margin * 2);
  
  chest = {
    x: x,
    y: y,
    width: 30,
    height: 25,
    timer: 10.0,
    bobTimer: 0,
    bobFrame: 0
  };
  
  chestActive = true;
}

function updateChest(dt) {
  if (!chest) return;
  
  chest.timer -= dt;
  
  if (chest.timer <= 0) {
    chestActive = false;
    chest = null;
    return;
  }
  
  chest.bobTimer += dt;
  if (chest.bobTimer > 0.3) {
    chest.bobTimer = 0;
    chest.bobFrame = (chest.bobFrame + 1) % 2;
  }
  
  if (aabb(chest, player)) {
    giveReward();
    chestActive = false;
    chest = null;
  }
}

function giveReward() {
  const rewards = ['heal', 'shotgun', 'spiritSlash'];
  const reward = rewards[Math.floor(Math.random() * rewards.length)];
  
  if (reward === 'heal') {
    player.hp = Math.min(player.maxHp, player.hp + 25);
  } else if (reward === 'shotgun') {
    shotgunMode = true;
    shotgunRoundsLeft = 5;
  } else if (reward === 'spiritSlash') {
    spiritSlashActive = true;
    spiritSlashTimer = 10.0;
  }
  
  updateHUD();
}

function drawChest() {
  if (!chest) return;
  
  const x = chest.x;
  const y = chest.y;
  const bob = chest.bobFrame === 0 ? 0 : -2;
  
  ctx.fillStyle = "#8b6914";
  ctx.fillRect(x, y + 10 + bob, 30, 15);
  
  ctx.fillStyle = "#b8860b";
  ctx.fillRect(x, y + 5 + bob, 30, 8);
  
  ctx.fillStyle = "#ffd700";
  ctx.fillRect(x + 12, y + 12 + bob, 6, 6);
  
  ctx.fillStyle = "#daa520";
  ctx.fillRect(x + 2, y + 7 + bob, 26, 3);
  
  const timePercent = chest.timer / 10.0;
  const barWidth = 30;
  const barColor = timePercent > 0.3 ? "#4ecf4e" : "#ff4444";
  
  ctx.fillStyle = "#000";
  ctx.fillRect(x, y - 6, barWidth, 4);
  ctx.fillStyle = barColor;
  ctx.fillRect(x, y - 6, barWidth * timePercent, 4);
  
  if (timePercent <= 0.3 && Math.floor(chest.timer * 4) % 2 === 0) {
    ctx.fillStyle = "rgba(255, 68, 68, 0.3)";
    ctx.fillRect(x - 5, y - 5 + bob, 40, 35);
  }
}

/* ============================================================
   MUZZLE FLASH SYSTEM
   ============================================================ */

function triggerMuzzleFlash() {
  const offsetX = player.facingRight ? player.width + 10 : -20;
  
  muzzleFlash.active = true;
  muzzleFlash.x = player.x + offsetX;
  muzzleFlash.y = player.y + player.height / 2;
  muzzleFlash.timer = muzzleFlash.duration;
}

function updateMuzzleFlash(dt) {
  if (!muzzleFlash.active) return;
  
  muzzleFlash.timer -= dt;
  
  if (muzzleFlash.timer <= 0) {
    muzzleFlash.active = false;
  }
}

function drawMuzzleFlash() {
  if (!muzzleFlash.active) return;
  
  const x = muzzleFlash.x;
  const y = muzzleFlash.y;
  const alpha = muzzleFlash.timer / muzzleFlash.duration;
  
  ctx.fillStyle = `rgba(255, 255, 200, ${alpha})`;
  ctx.fillRect(x - 6, y - 6, 12, 12);
  
  ctx.fillStyle = `rgba(255, 200, 100, ${alpha * 0.6})`;
  ctx.fillRect(x - 10, y - 10, 20, 20);
  
  ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
  ctx.fillRect(x + 8, y - 2, 4, 4);
  ctx.fillRect(x - 12, y + 3, 3, 3);
  ctx.fillRect(x + 6, y + 6, 3, 3);
}

/* ============================================================
   SPIRIT SLASH SYSTEM
   ============================================================ */

function updateSpiritSlash(dt) {
  if (!spiritSlashActive) return;
  
  spiritSlashTimer -= dt;
  
  if (spiritSlashTimer <= 0) {
    spiritSlashActive = false;
    spiritSlashTimer = 0;
  }
}

function fireSpiritSlashProjectile() {
  const direction = player.facingRight ? 1 : -1;
  
  spiritSlashProjectiles.push({
    id: newID(),
    x: player.x + player.width / 2,
    y: player.y + player.height / 2,
    vx: direction * 350,
    vy: 0,
    size: 40,
    damage: 45,
    rotation: 0,
    hit: new Set()
  });
  
  // Deactivate Spirit Slash after firing
  spiritSlashActive = false;
  spiritSlashTimer = 0;
}

function updateSpiritSlashProjectiles(dt) {
  for (let i = spiritSlashProjectiles.length - 1; i >= 0; i--) {
    const proj = spiritSlashProjectiles[i];
    
    proj.x += proj.vx * dt;
    proj.y += proj.vy * dt;
    proj.rotation += 10 * dt;
    
    // Remove offscreen
    if (
      proj.x < -50 || proj.x > LOGICAL_WIDTH + 50 ||
      proj.y < -50 || proj.y > LOGICAL_HEIGHT + 50
    ) {
      spiritSlashProjectiles.splice(i, 1);
      continue;
    }
    
    // Check collision with enemies
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      
      if (proj.hit.has(e.id)) continue;
      
      const dx = proj.x - (e.x + e.width / 2);
      const dy = proj.y - (e.y + e.height / 2);
      const dist = Math.hypot(dx, dy);
      
      if (dist < proj.size / 2 + e.width / 2) {
        e.hp -= proj.damage;
        proj.hit.add(e.id);
        
        if (e.hp <= 0) {
          enemies.splice(j, 1);
          score++;
        }
      }
    }
  }
}

function drawSpiritSlashProjectiles() {
  for (const proj of spiritSlashProjectiles) {
    ctx.save();
    ctx.translate(proj.x, proj.y);
    ctx.rotate(proj.rotation);
    
    // Outer glow
    ctx.fillStyle = "rgba(100, 200, 255, 0.4)";
    ctx.fillRect(-proj.size / 2 - 4, -proj.size / 2 - 4, proj.size + 8, proj.size + 8);
    
    // Main energy blade
    ctx.fillStyle = "rgba(150, 220, 255, 0.9)";
    ctx.fillRect(-proj.size / 2, -proj.size / 2, proj.size, proj.size);
    
    // Core
    ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    ctx.fillRect(-proj.size / 4, -proj.size / 4, proj.size / 2, proj.size / 2);
    
    // Edge highlights
    ctx.fillStyle = "rgba(200, 240, 255, 0.7)";
    ctx.fillRect(-proj.size / 2, -proj.size / 2, proj.size, 4);
    ctx.fillRect(-proj.size / 2, -proj.size / 2, 4, proj.size);
    
    ctx.restore();
  }
}

/* ---------- DRAW GHOST - ETHEREAL SPIRIT ---------- */
function drawGhost(e) {
  const x = e.x;
  const y = e.y;
  const float = e.animFrame === 0 ? -2 : 0;
  
  ctx.globalAlpha = 0.85;
  
  /* === OUTER GLOW === */
  ctx.fillStyle = "#8b6fd9";
  ctx.globalAlpha = 0.3;
  ctx.fillRect(x + 6, y + 6 + float, 24, 28);
  
  ctx.globalAlpha = 0.85;
  
  /* === MAIN BODY - ROUNDED TOP === */
  /* Head/body top - lighter purple */
  ctx.fillStyle = "#b89fea";
  ctx.fillRect(x + 12, y + 6 + float, 12, 4);
  ctx.fillRect(x + 10, y + 8 + float, 16, 4);
  ctx.fillRect(x + 9, y + 10 + float, 18, 2);
  
  /* Main body - mid purple */
  ctx.fillStyle = "#9d7ee0";
  ctx.fillRect(x + 9, y + 12 + float, 18, 12);
  
  /* Inner glow - pale blue-purple */
  ctx.fillStyle = "#c7b4f5";
  ctx.fillRect(x + 12, y + 14 + float, 12, 8);
  
  /* Core glow */
  ctx.fillStyle = "#e0d4ff";
  ctx.globalAlpha = 0.7;
  ctx.fillRect(x + 15, y + 16 + float, 6, 4);
  ctx.globalAlpha = 0.85;
  
  /* === FLOWING TAIL === */
  /* Tail base */
  ctx.fillStyle = "#9d7ee0";
  ctx.fillRect(x + 10, y + 24 + float, 16, 4);
  
  /* Tail wisps - tapered */
  const tailWiggle = e.animFrame === 0 ? 0 : 1;
  
  ctx.fillStyle = "#8b6fd9";
  ctx.fillRect(x + 11 + tailWiggle, y + 28 + float, 5, 3);
  ctx.fillRect(x + 18 - tailWiggle, y + 28 + float, 5, 3);
  ctx.fillRect(x + 14, y + 30 + float, 8, 2);
  
  /* Wisp tips */
  ctx.fillStyle = "#7a5ec8";
  ctx.fillRect(x + 12 + tailWiggle, y + 31 + float, 4, 2);
  ctx.fillRect(x + 19 - tailWiggle, y + 31 + float, 4, 2);
  
  /* Fade tips */
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = "#6948b0";
  ctx.fillRect(x + 13 + tailWiggle, y + 33 + float, 3, 1);
  ctx.fillRect(x + 20 - tailWiggle, y + 33 + float, 3, 1);
  
  ctx.globalAlpha = 0.85;
  
  /* === FACE === */
  /* Eye sockets - darker purple */
  ctx.fillStyle = "#5a3a8a";
  ctx.fillRect(x + 13, y + 12 + float, 3, 4);
  ctx.fillRect(x + 20, y + 12 + float, 3, 4);
  
  /* Eyes - glowing cyan */
  ctx.fillStyle = "#40e8ff";
  ctx.fillRect(x + 14, y + 13 + float, 2, 3);
  ctx.fillRect(x + 21, y + 13 + float, 2, 3);
  
  /* Eye highlights */
  ctx.fillStyle = "#c0f8ff";
  ctx.fillRect(x + 14, y + 13 + float, 1, 1);
  ctx.fillRect(x + 21, y + 13 + float, 1, 1);
  
  /* Mouth - sad/hollow */
  ctx.fillStyle = "#5a3a8a";
  ctx.fillRect(x + 16, y + 19 + float, 4, 2);
  ctx.fillRect(x + 15, y + 20 + float, 6, 2);
  
  /* === SPECTRAL PARTICLES === */
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = "#b89fea";
  ctx.fillRect(x + 7, y + 10 + float + (e.animFrame * 2), 2, 2);
  ctx.fillRect(x + 27, y + 15 + float - (e.animFrame * 2), 2, 2);
  ctx.fillRect(x + 8, y + 22 + float + (e.animFrame * 1), 1, 1);
  ctx.fillRect(x + 28, y + 20 + float - (e.animFrame * 1), 1, 1);
  
  ctx.globalAlpha = 1.0;
}

/* ---------- DRAW GORILLA BOSS - REALISTIC APE ---------- */
function drawGorilla(e) {
  const x = e.x;
  const y = e.y;
  const bob = e.animFrame === 0 ? 0 : 2;
  
  /* Shadow */
  ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
  ctx.fillRect(x + 5, y + 58 + bob, 60, 6);
  
  /* === RAGE MODE GLOW === */
  if (e.gorillaState === 'slamPrep') {
    const pulseAlpha = 0.45 + Math.sin(Date.now() / 50) * 0.25;
    ctx.fillStyle = `rgba(255, 50, 50, ${pulseAlpha})`;
    ctx.fillRect(x - 5, y - 5, 80, 70);
    
    ctx.strokeStyle = `rgba(255, 255, 255, ${pulseAlpha * 0.9})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 2, y - 2, 74, 64);
  }
  
  /* === SLAM SHOCKWAVE === */
  if (e.slamActive) {
    const centerX = x + e.width / 2;
    const centerY = y + e.height / 2;

    ctx.strokeStyle = `rgba(180, 180, 180, ${alpha * 0.4})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 78, 0, Math.PI * 2);

    ctx.beginPath();
    ctx.arc(centerX, centerY, 75, 0, Math.PI * 2);

/* ---------- UNIFIED DRAW ENEMY ---------- */
function drawEnemy(e) {
  if (e.type === "zombie") {
    drawZombie(e);
  } else if (e.type === "ghost") {
    drawGhost(e);
  } else if (e.type === "gorilla") {
    drawGorilla(e);
  }
  
  /* HP Bar for normal enemies */
  if (e.type !== "gorilla") {
    const hpPerc = e.hp / e.maxHp;
    ctx.fillStyle = "#000";
    ctx.fillRect(e.x, e.y - 8, e.width, 4);
    ctx.fillStyle = "#4ecf4e";
    ctx.fillRect(e.x, e.y - 8, e.width * hpPerc, 4);
  }
}

/* ---------- DRAW EVERYTHING ---------- */
function render() {
  ctx.save();
  if (FX.shake > 0.3) ctx.translate((Math.random() - 0.5) * FX.shake, (Math.random() - 0.5) * FX.shake);

  /* Background */
  if (bgReady) ctx.drawImage(gameplayMap, 0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
  else {
    ctx.fillStyle = "#2d4a3e";
    ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
  }
  /* dusk mood tint deepens with waves */
  const duskA = Math.min(0.32, 0.06 + (wave - 1) * 0.02);
  ctx.fillStyle = 'rgba(30,18,60,' + duskA + ')';
  ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
  /* drifting ember/dust motes */
  ctx.fillStyle = 'rgba(255,220,170,.35)';
  for (const d of FX.dust) ctx.fillRect(d.x, d.y, d.s, d.s);

  /* Player */
  drawPlayer();

  /* Attack hitboxes — soft radial pulses instead of flat rects */
  if (lightAttack) {
    const lx = lightAttack.x + lightAttack.width / 2, ly = lightAttack.y + lightAttack.height / 2;
    const lr = Math.max(lightAttack.width, lightAttack.height) * 0.75;
    const lg = ctx.createRadialGradient(lx, ly, 2, lx, ly, lr);
    lg.addColorStop(0, 'rgba(255,240,200,.5)'); lg.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.fill();
  }
  if (heavyAttack) {
    const hx2 = heavyAttack.x + heavyAttack.width / 2, hy2 = heavyAttack.y + heavyAttack.height / 2;
    const hr = Math.max(heavyAttack.width, heavyAttack.height) * 0.8;
    const hg2 = ctx.createRadialGradient(hx2, hy2, 2, hx2, hy2, hr);
    hg2.addColorStop(0, 'rgba(255,150,90,.55)'); hg2.addColorStop(1, 'rgba(255,80,60,0)');
    ctx.fillStyle = hg2; ctx.beginPath(); ctx.arc(hx2, hy2, hr, 0, Math.PI * 2); ctx.fill();
  }

  if (whirlAttack) {
    const cx = whirlAttack.x + whirlAttack.width/2;
    const cy = whirlAttack.y + whirlAttack.height/2;

    for (let i = 0; i < 8; i++) {
      const ang = (whirlAttack.rotation + i * 45) * Math.PI/180;
      const x1 = cx + Math.cos(ang) * 10;
      const y1 = cy + Math.sin(ang) * 10;
      const x2 = cx + Math.cos(ang) * 60;
      const y2 = cy + Math.sin(ang) * 60;

      ctx.strokeStyle = (i % 2 === 0)
        ? "rgba(200,200,255,0.7)"
        : "rgba(255,255,255,0.6)";

      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    ctx.fillStyle = "rgba(150,100,255,0.5)";
    ctx.beginPath();
    ctx.arc(cx, cy, 30, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.beginPath();
    ctx.arc(cx, cy, 15, 0, Math.PI*2);
    ctx.fill();
  }

  /* Bullets — glowing tracers with trails */
  for (const b of bullets) {
    ctx.strokeStyle = 'rgba(255,230,90,.45)'; ctx.lineWidth = b.size * 0.9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x - (b.vx || 0) * 0.035, b.y - (b.vy || 0) * 0.035); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,240,150,.35)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size * 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff8c8';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size * 0.55, 0, Math.PI * 2); ctx.fill();
  }

  /* Enemies (+ hit flash overlay from the FX layer) */
  for (const e of enemies) {
    drawEnemy(e);
    if (e.flashT > 0) {
      e.flashT -= 0.016;
      ctx.globalAlpha = Math.min(0.7, e.flashT * 6); ctx.fillStyle = '#fff';
      ctx.fillRect(e.x, e.y, e.width, e.height); ctx.globalAlpha = 1;
    }
  }

  /* Chest */
  if (chestActive) drawChest();

  /* Muzzle flash */
  if (muzzleFlash.active) drawMuzzleFlash();
  
  /* Spirit Slash projectiles */
  drawSpiritSlashProjectiles();

  if (bossIntroActive) {
    const t = bossIntroTimer;
    const alpha = t > 1.2 ? (1.6 - t) * 2.5 : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, LOGICAL_HEIGHT/2 - 40, LOGICAL_WIDTH, 80);
    ctx.fillStyle = "#ff4444";
    ctx.font = "28px Courier New";
    ctx.textAlign = "center";
    ctx.fillText("STONE GORILLA", LOGICAL_WIDTH/2, LOGICAL_HEIGHT/2 + 10);
    ctx.globalAlpha = 1;
  }

  /* Reload bar */
  if (player.reloadTime > 0) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(LOGICAL_WIDTH/2 - 60, LOGICAL_HEIGHT - 40, 120, 20);

    ctx.fillStyle = "#4ecf4e";
    const p = 1 - (player.reloadTime / 2.0);
    ctx.fillRect(
      LOGICAL_WIDTH/2 - 58,
      LOGICAL_HEIGHT - 38,
      116 * p,
      16
    );
  }

  /* FX layer: slash arcs, particles, damage popups */
  drawFX();
  ctx.restore(); // end screen shake

  /* combo counter */
  if (FX.combo >= 3) {
    ctx.textAlign = 'center'; ctx.font = 'bold 20px Courier New';
    const pulse = 1 + Math.sin(performance.now() * 0.02) * 0.06;
    ctx.save(); ctx.translate(LOGICAL_WIDTH / 2, 46); ctx.scale(pulse, pulse);
    ctx.fillStyle = '#000'; ctx.fillText(FX.combo + ' HITS', 2, 2);
    ctx.fillStyle = FX.combo >= 10 ? '#ff5b4d' : '#ffd843'; ctx.fillText(FX.combo + ' HITS', 0, 0);
    ctx.restore();
  }
  /* wave banner */
  if (FX.bannerT > 0) {
    const a = Math.min(1, FX.bannerT * 2) * Math.min(1, (1.8 - FX.bannerT) * 4);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, LOGICAL_HEIGHT / 2 - 44, LOGICAL_WIDTH, 88);
    ctx.fillStyle = '#e5484d'; ctx.fillRect(0, LOGICAL_HEIGHT / 2 - 44, LOGICAL_WIDTH, 3);
    ctx.fillRect(0, LOGICAL_HEIGHT / 2 + 41, LOGICAL_WIDTH, 3);
    ctx.textAlign = 'center'; ctx.font = 'bold 34px Courier New';
    ctx.fillStyle = '#000'; ctx.fillText(FX.banner, LOGICAL_WIDTH / 2 + 2, LOGICAL_HEIGHT / 2 + 13);
    ctx.fillStyle = '#ffd843'; ctx.fillText(FX.banner, LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2 + 11);
    ctx.globalAlpha = 1;
  }
  /* vignette */
  const vg = ctx.createRadialGradient(LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2, LOGICAL_HEIGHT * 0.35, LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2, LOGICAL_HEIGHT * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
  /* low-hp danger pulse */
  if (player.hp / player.maxHp < 0.3) {
    ctx.fillStyle = 'rgba(200,30,30,' + (0.10 + Math.sin(performance.now() * 0.008) * 0.07) + ')';
    ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
  }
}

/* ============================================================
   REAL MUSIC PLAYER
   ============================================================ */
let bgm = null;
let muted = false;
let musicStarted = false;

function initAudio() {
  if (!bgm) {
    bgm = new Audio("audio/bgm.mp3");
    bgm.loop = true;
    bgm.volume = muted ? 0 : 0.35;
  }
}

function startMusic() {
  if (!musicStarted) {
  initAudio();
    if (!muted) {
      bgm.play().catch(()=>{});
    }
    musicStarted = true;
  }
}

function stopMusic() {
  if (bgm) {
    bgm.pause();
    bgm.currentTime = 0;
  }
  musicStarted = false;
  document.addEventListener("click", handleFirstTap, { once: true });
  document.addEventListener("touchstart", handleFirstTap, { once: true, passive: false });
}

/* ============================================================
   GAME OVER + RESET (Clean Base+ state)
   ============================================================ */
function gameOver() {
  gameState = "gameover";
  isPaused = true;
  document.getElementById("hud").style.display = "none";
  document.querySelector(".hud-buttons").style.display = "none";
  document.getElementById("finalScore").textContent = "Final Score: " + score;
  const over = document.getElementById("gameOverScreen");
  over.style.display = "flex";
  resetInput();
}

/* ============================================================
   FULL CLEAN RESET
   ============================================================ */
function initGame() {
  /* Player */
  player.x = LOGICAL_WIDTH/2 - 25;
  player.y = LOGICAL_HEIGHT/2 - 25;
  player.hp = player.maxHp;
  player.ammo = player.maxAmmo;
  player.reloadTime = 0;
  player.heavyCooldown = 0;
  player.whirlCooldown = 0;

  /* Animation */
  player.animState = "idle";
  player.animFrame = 0;
  player.animTimer = 0;

  /* World */
  enemies.length = 0;
  bullets.length = 0;

  lightAttack = null;
  heavyAttack = null;
  whirlAttack = null;
  
  /* Reset chest and buffs */
  chestActive = false;
  chest = null;
  shotgunMode = false;
  shotgunRoundsLeft = 0;
  spiritSlashActive = false;
  spiritSlashTimer = 0;
  spiritSlashProjectiles.length = 0;

  wave = 1;
  score = 0;
  gorillaSpawnCount = 0;
  
  /* Reset spawn queue */
  spawnQueue = [];
  spawnTimerGlobal = 0;
  waveEnemyCount = 0;

  spawnWave();
  updateHUD();

  resetInput();
}

/* ============================================================
   FULL RESET FUNCTION
   ============================================================ */
function fullReset() {
  wave = 1;
  score = 0;
  gorillaSpawnCount = 0;
  
  /* Reset spawn queue */
  spawnQueue = [];
  spawnTimerGlobal = 0;
  waveEnemyCount = 0;
  
  player.x = LOGICAL_WIDTH/2 - 25;
  player.y = LOGICAL_HEIGHT/2 - 25;
  player.hp = player.maxHp;
  player.ammo = player.maxAmmo;
  player.reloadTime = 0;
  enemies.length = 0;
  bullets.length = 0;
  lightAttack = null;
  heavyAttack = null;
  whirlAttack = null;
  shotgunMode = false;
  shotgunRoundsLeft = 0;
  spiritSlashActive = false;
  spiritSlashProjectiles.length = 0;
  chestActive = false;
  chest = null;
  isPaused = false;
  gameState = "playing";
  document.getElementById("gameOverScreen").style.display = "none";
  document.getElementById("hud").style.display = "flex";
  document.querySelector(".hud-buttons").style.display = "flex";
  updateHUD();
  spawnWave();
}

/* ============================================================
   MAIN UPDATE (DeltaTime engine)
   ============================================================ */
function update(dt) {
  updateFX(dt);
  if (bossIntroActive) {
    bossIntroTimer -= dt;
    if (bossIntroTimer <= 0) {
        bossIntroActive = false;
        isPaused = false;
    }
  }

  if (gameState !== "playing" || isPaused) return;

  /* player movement */
  updatePlayerMovement(dt);

  /* cooldowns */
  if (player.heavyCooldown > 0) player.heavyCooldown -= dt;
  if (player.whirlCooldown > 0) player.whirlCooldown -= dt;

  /* animation updates */
  player.animTimer += dt;
  if (player.animState === "idle") {
    if (player.animTimer > 0.33) {
      player.animTimer = 0;
      player.animFrame = (player.animFrame + 1) % 3;
    }
  } else if (player.animState === "light") {
    if (player.animTimer > 0.067) {
      player.animTimer = 0;
      player.animFrame++;
      if (player.animFrame >= 3) {
        player.animState = "idle";
        player.animFrame = 0;
      }
    }
  } else if (player.animState === "heavy") {
    if (player.animTimer > 0.1) {
      player.animTimer = 0;
      player.animFrame++;
      if (player.animFrame >= 4) {
        player.animState = "idle";
        player.animFrame = 0;
      }
    }
  } else if (player.animState === "whirl") {
    if (player.animTimer > 0.033) {
      player.animTimer = 0;
      player.animFrame++;
      if (player.animFrame >= 15) {
        player.animState = "idle";
        player.animFrame = 0;
      }
    }
  }

  /* reload */
  if (player.reloadTime > 0) {
    player.reloadTime -= dt;
    if (player.reloadTime <= 0) {
      player.reloadTime = 0;
      player.ammo = player.maxAmmo;
    }
  }

  /* bullets */
  updateBullets(dt);

  /* enemies */
  updateEnemies(dt);

  /* attack hitboxes */
  lightAttack  = handleAttackHitbox(lightAttack,  dt);
  heavyAttack  = handleAttackHitbox(heavyAttack,  dt);
  whirlAttack  = handleAttackHitbox(whirlAttack,  dt);

  /* bullet collisions */
  handleBulletCollisions();

  /* Process spawn queue (staggered enemy spawning) */
  spawnTimerGlobal -= dt;
  if (spawnQueue.length > 0 && spawnTimerGlobal <= 0) {
    const type = spawnQueue.shift();
    spawnTimerGlobal = 0.25;    // 250ms stagger spawn
    if (type === "normal") {
      const t = Math.random() > 0.5 ? "zombie" : "ghost";
      spawnEnemy(t);
    } else if (type === "gorilla") {
      spawnEnemy("gorilla");
    }
  }

  /* wave clear */
  if (enemies.length === 0 && spawnQueue.length === 0) {
    wave++;
    
    /* Spawn chest every 3 waves */
    if (wave % 3 === 0 && !chestActive) {
      spawnChest();
    }
    
    spawnWave();
  }

  /* Update chest and muzzle flash */
  if (chestActive) updateChest(dt);
  updateMuzzleFlash(dt);
  
  /* Update Spirit Slash */
  updateSpiritSlash(dt);
  updateSpiritSlashProjectiles(dt);

  updateHUD();
}

/* ============================================================
   GAME LOOP (DeltaTime)
   ============================================================ */
function gameLoop(now) {
  delta = (now - lastFrameTime) / 1000;
  lastFrameTime = now;

  const dt = Math.min(delta, 0.0333);

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

/* ============================================================
   INPUT BINDINGS – ATTACK BUTTONS
   ============================================================ */

document.addEventListener("keydown", e => {
  if (gameState === "playing" && !isPaused) {
    const k = e.key.toLowerCase();

    if (k === "j") performLightAttack();
    if (k === "k") performHeavyAttack();
    if (k === "l") shootGun();
    if (k === "r") startReload();
    if (e.code === "Space") performWhirlwind();
  }
});

document.getElementById("btnLight").addEventListener("touchstart", e => { e.preventDefault(); if(gameState==="playing" && !isPaused) performLightAttack(); });
document.getElementById("btnHeavy").addEventListener("touchstart", e => { e.preventDefault(); if(gameState==="playing" && !isPaused) performHeavyAttack(); });
document.getElementById("btnGun").addEventListener("touchstart", e => { e.preventDefault(); if(gameState==="playing" && !isPaused) shootGun(); });
document.getElementById("btnWhirlwind").addEventListener("touchstart", e => { e.preventDefault(); if(gameState==="playing" && !isPaused) performWhirlwind(); });

/* ============================================================
   STATE BUTTONS
   ============================================================ */
document.getElementById("pauseBtn").addEventListener("click", () => {
  if (gameState === "playing") {
    isPaused = !isPaused;
    document.getElementById("pauseBtn").textContent = isPaused ? "▶" : "⸠";
  }
});

document.getElementById("muteBtn").addEventListener("click", () => {
  muted = !muted;
  if (bgm) {
    bgm.muted = muted;
    bgm.volume = muted ? 0 : 0.35;
  }
  document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (gameState === "playing") {
    stopMusic();
    initGame();
  }
});

document.getElementById("restartBtn").addEventListener("click", fullReset);

/* ============================================================
   START GAME
   ============================================================ */
function startGame() {
  if (gameState !== "start") return;

  const startScreen = document.getElementById("startScreen");
  startScreen.style.opacity = "0";
  startScreen.style.pointerEvents = "none";
  setTimeout(() => { startScreen.style.display = "none"; }, 250);

  document.getElementById("hud").style.display = "flex";
  document.querySelector(".hud-buttons").style.display = "flex";

  gameState = "playing";
  initGame();
}

function handleFirstTap() {
  if (!musicStarted) {
  startMusic();
  }
}

document.addEventListener("click", handleFirstTap, { once: true });
document.addEventListener("touchstart", handleFirstTap, { once: true, passive: false });

document.getElementById("startScreen").addEventListener("click", () => {
  startGame();
});

document.getElementById("startScreen").addEventListener("touchstart", e => {
  e.preventDefault();
  startGame();
});

/* ============================================================
   MOBILE ZOOM SUPPRESSION
   ============================================================ */

function preventPinchZoom(e) {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}

const gameContainer = document.getElementById("gameContainer");
const gameCanvas = document.getElementById("gameCanvas");

gameContainer.addEventListener("touchmove", preventPinchZoom, { passive: false });
gameCanvas.addEventListener("touchmove", preventPinchZoom, { passive: false });

document.addEventListener("touchmove", function(e) {
  if (e.touches.length > 1 && !e.target.closest('.hud-btn, .attack-btn, .dpad-btn')) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener("touchend", function(e) {
  const now = Date.now();
  if (window.__lastTap && now - window.__lastTap < 300) {
    e.preventDefault();
  }
  window.__lastTap = now;
}, { passive: false });
</script>

<script>
/* ===== FOODSPOT ARCADE CONTROLLER WIRING ===== */
(function() {
  function wire(id, onDown, onUp) {
    const el = document.getElementById(id);
    if (!el) return;
    const down = (e) => { e.preventDefault(); if(onDown) onDown(); el.classList.add('pressed'); };
    const up   = (e) => { e.preventDefault(); if(onUp) onUp(); el.classList.remove('pressed'); };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
  }

  // D-PAD → touchState
  wire('fs-up',    () => { touchState.up = true; },    () => { touchState.up = false; });
  wire('fs-down',  () => { touchState.down = true; },  () => { touchState.down = false; });
  wire('fs-left',  () => { touchState.left = true; },  () => { touchState.left = false; });
  wire('fs-right', () => { touchState.right = true; }, () => { touchState.right = false; });

  // A → LIGHT attack
  wire('fs-btn-a', () => { if(typeof performLightAttack === 'function') performLightAttack(); }, null);

  // B → HEAVY attack
  wire('fs-btn-b', () => { if(typeof performHeavyAttack === 'function') performHeavyAttack(); }, null);

  // LT → GUN
  wire('fs-lt', () => { if(typeof shootGun === 'function') shootGun(); }, null);

  // RT → SPIN/WHIRLWIND
  wire('fs-rt', () => { if(typeof performWhirlwind === 'function') performWhirlwind(); }, null);

  // Also fire on start screen tap
  document.getElementById('fs-controller').addEventListener('touchstart', function() {
    if (typeof startGame === 'function' && typeof gameState !== 'undefined' && gameState === 'start') {
      startGame();
    }
  }, { passive: true });
})();
</script>
