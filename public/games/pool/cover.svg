<svg xmlns="http://www.w3.org/2000/svg" width="390" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d0a4a"/>
      <stop offset="100%" stop-color="#1a0030"/>
    </linearGradient>
    <radialGradient id="ball1" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#FFB3D9"/>
      <stop offset="50%" stop-color="#FF6EB4"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </radialGradient>
    <radialGradient id="ball8" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="50%" stop-color="#111"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background (Bubble Tea purple) -->
  <rect width="390" height="260" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="40" r="60" fill="#FF6EB4" opacity="0.08"/>
  <circle cx="340" cy="220" r="80" fill="#29B6F6" opacity="0.08"/>
  <circle cx="200" cy="130" r="100" fill="#22c55e" opacity="0.05"/>
  
  <!-- Large 8-ball -->
  <circle cx="195" cy="130" r="70" fill="url(#ball8)" filter="url(#glow)"/>
  <circle cx="170" cy="105" r="15" fill="rgba(255,255,255,0.3)"/>
  
  <!-- White circle with 8 -->
  <circle cx="195" cy="130" r="28" fill="#fff"/>
  <text x="195" y="138" font-size="32" font-weight="bold" fill="#000" text-anchor="middle">8</text>
  
  <!-- Small decorative balls -->
  <circle cx="80" cy="180" r="22" fill="url(#ball1)"/>
  <circle cx="72" cy="172" r="6" fill="rgba(255,255,255,0.4)"/>
  
  <circle cx="310" cy="80" r="18" fill="#3b82f6"/>
  <circle cx="304" cy="74" r="5" fill="rgba(255,255,255,0.4)"/>
  <!-- White stripe for stripe ball look -->
  <circle cx="310" cy="80" r="10" fill="#fff" opacity="0.9"/>
  <circle cx="310" cy="80" r="6" fill="#3b82f6"/>
  
  <!-- Title -->
  <text x="195" y="235" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle" filter="url(#glow)">8-BALL POOL</text>
  
  <!-- Small accent balls at bottom -->
  <circle cx="130" cy="245" r="8" fill="#dc2626"/>
  <circle cx="150" cy="248" r="6" fill="#f97316"/>
  <circle cx="240" cy="248" r="6" fill="#22c55e"/>
  <circle cx="260" cy="245" r="8" fill="#8b5cf6"/>
</svg>
