<svg xmlns="http://www.w3.org/2000/svg" width="390" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a5c3a"/>
      <stop offset="100%" stop-color="#0d3d26"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="390" height="260" fill="url(#bg)"/>
  
  <!-- Wood border -->
  <rect x="10" y="10" width="370" height="240" fill="none" stroke="#8b4513" stroke-width="12" rx="4"/>
  
  <!-- Pockets -->
  <circle cx="25" cy="25" r="16" fill="#0a0a0a"/>
  <circle cx="195" cy="20" r="16" fill="#0a0a0a"/>
  <circle cx="365" cy="25" r="16" fill="#0a0a0a"/>
  <circle cx="25" cy="235" r="16" fill="#0a0a0a"/>
  <circle cx="195" cy="240" r="16" fill="#0a0a0a"/>
  <circle cx="365" cy="235" r="16" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="195" y="105" font-size="42" font-weight="bold" fill="#fff" text-anchor="middle" filter="url(#shadow)">🎱 8-BALL</text>
  <text x="195" y="145" font-size="28" fill="#4ade80" text-anchor="middle" font-weight="bold" filter="url(#shadow)">POOL</text>
  
  <!-- Decorative balls -->
  <circle cx="60" cy="200" r="18" fill="#fbbf24"/>
  <circle cx="55" cy="192" r="5" fill="rgba(255,255,255,0.4)"/>
  
  <circle cx="130" cy="200" r="18" fill="#3b82f6"/>
  <circle cx="125" cy="192" r="5" fill="rgba(255,255,255,0.4)"/>
  
  <circle cx="200" cy="200" r="18" fill="#ef4444"/>
  <circle cx="195" cy="192" r="5" fill="rgba(255,255,255,0.4)"/>
  
  <circle cx="270" cy="200" r="18" fill="#8b5cf6"/>
  <circle cx="265" cy="192" r="5" fill="rgba(255,255,255,0.4)"/>
  
  <circle cx="340" cy="200" r="18" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="335" cy="192" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="340" cy="200" r="10" fill="#fff"/>
  <text x="340" y="204" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">8</text>
</svg>
