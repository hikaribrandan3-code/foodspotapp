  else if(bt===1){pianoNote(bar.c[2],t+BEAT*0.62,0.038);}
  else if(bt===2){pianoNote(bar.c[0],t,0.048);pianoNote(bar.c[2],t+0.018,0.044);pianoNote(bar.c[3],t+0.030,0.038);}
  else{pianoNote(bar.c[3],t,0.032);}
  hihat(t,0.55,bt===1||bt===3);hihat(t+BEAT*0.63,0.30,false);
  if(bt===0) kick(t,0.55);if(bt===2) kick(t,0.20);
  if(bt===1||bt===3) brush(t);

}
function bassNote(freq,t){
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  o.type='triangle';o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(0.20,t+0.018);
  g.gain.exponentialRampToValueAtTime(0.09,t+BEAT*0.55);g.gain.exponentialRampToValueAtTime(0.001,t+BEAT*0.82);
  o.start(t);o.stop(t+BEAT*0.88);
}
function pianoNote(freq,t,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(vol,t+0.016);
  g.gain.exponentialRampToValueAtTime(vol*0.45,t+0.10);g.gain.exponentialRampToValueAtTime(0.001,t+BEAT*1.7);
  o.start(t);o.stop(t+BEAT*1.8);
}
function hihat(t,vol,accent){
  const sr=AC.sampleRate,dur=accent?0.058:0.030,frames=Math.floor(sr*dur);
  const buf=AC.createBuffer(1,frames,sr),d=buf.getChannelData(0);
  for(let i=0;i<frames;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/frames,1.6);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();
  s.buffer=buf;f.type='highpass';f.frequency.value=9000;
  s.connect(f);f.connect(gg);gg.connect(AC.destination);gg.gain.value=(accent?0.10:0.056)*vol;s.start(t);
}
function kick(t,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';
  o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(38,t+0.09);
  g.gain.setValueAtTime(vol*0.55,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.20);o.start(t);o.stop(t+0.22);
}
function brush(t){
  const sr=AC.sampleRate,frames=Math.floor(sr*0.14),buf=AC.createBuffer(1,frames,sr),d=buf.getChannelData(0);
  for(let i=0;i<frames;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/frames)*Math.pow(1-i/frames,0.6);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();
  s.buffer=buf;f.type='bandpass';f.frequency.value=3200;f.Q.value=0.7;
  s.connect(f);f.connect(gg);gg.connect(AC.destination);gg.gain.value=0.065;s.start(t);
}
function ride(t){
  const sr=AC.sampleRate,frames=Math.floor(sr*0.30),buf=AC.createBuffer(1,frames,sr),d=buf.getChannelData(0);
  for(let i=0;i<frames;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/frames,2.2);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();
  s.buffer=buf;f.type='highpass';f.frequency.value=5800;
  s.connect(f);f.connect(gg);gg.connect(AC.destination);gg.gain.value=0.018;s.start(t);
}
function sndHit(v){
  if(!AC||v<0.8) return;
  const t=AC.currentTime,vol=Math.min(0.5,v*0.062);
  const o1=AC.createOscillator(),g1=AC.createGain();o1.connect(g1);g1.connect(AC.destination);o1.type='sine';
  o1.frequency.setValueAtTime(1800+v*120,t);o1.frequency.exponentialRampToValueAtTime(320,t+0.035);
  g1.gain.setValueAtTime(vol,t);g1.gain.exponentialRampToValueAtTime(0.001,t+0.055);o1.start(t);o1.stop(t+0.06);
  const o2=AC.createOscillator(),g2=AC.createGain();o2.connect(g2);g2.connect(AC.destination);o2.type='triangle';
  o2.frequency.setValueAtTime(520+v*60,t);o2.frequency.exponentialRampToValueAtTime(110,t+0.08);
  g2.gain.setValueAtTime(vol*0.7,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.1);o2.start(t);o2.stop(t+0.11);
}
function sndPocket(){
  if(!AC) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type='sine';
  o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(55,t+0.3);
  g.gain.setValueAtTime(0.26,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.38);o.start(t);o.stop(t+0.42);
}

function menuFadeTransition(cb){

function menuSelect(){

function hl(h,a=70){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.min(255,r+a)},${Math.min(255,g+a)},${Math.min(255,b+a)})`;}
function dk(h,a=60){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.max(0,r-a)},${Math.max(0,g-a)},${Math.max(0,b-a)})`;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

// ── PHYSICS ───────────────────────────────────────────────
const getCue=()=>G.balls&&G.balls.find(b=>b.id===0&&!b.pocketed);
const allStop=()=>G.balls.every(b=>b.pocketed||Math.hypot(b.vx,b.vy)<0.07);

function physStep(){
  const act=G.balls.filter(b=>!b.pocketed);
  for(const b of act){
    b.vx*=0.978;b.vy*=0.978;
    if(Math.abs(b.vx)<0.06) b.vx=0;if(Math.abs(b.vy)<0.06) b.vy=0;
    b.x+=b.vx;b.y+=b.vy;
    const spd=Math.hypot(b.vx,b.vy);if(spd>0.06) b.angle+=spd/BR;
    pocketCheck(b);if(!b.pocketed) wallBounce(b);
  }
  for(let p=0;p<2;p++) for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++)
    if(!act[i].pocketed&&!act[j].pocketed) ballCollide(act[i],act[j]);
}
function wallBounce(b){
  if(PKS.some(p=>Math.hypot(b.x-p.x,b.y-p.y)<PR+BR+2)) return;
  const e=0.76;
  if(b.x-BR<FX&&b.vx<0){b.x=FX+BR;b.vx*=-e;doShake(Math.abs(b.vx));}
  if(b.x+BR>FR&&b.vx>0){b.x=FR-BR;b.vx*=-e;doShake(Math.abs(b.vx));}
  if(b.y-BR<FY&&b.vy<0){b.y=FY+BR;b.vy*=-e;doShake(Math.abs(b.vy));}
  if(b.y+BR>FB&&b.vy>0){b.y=FB-BR;b.vy*=-e;doShake(Math.abs(b.vy));}
}
function ballCollide(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,mn=BR*2;
  if(d2>=mn*mn||d2<0.01) return;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
  const dv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(dv<=0) return;
  a.vx-=dv*nx;a.vy-=dv*ny;b.vx+=dv*nx;b.vy+=dv*ny;
  const ov=(mn-d)*0.5+0.1;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
  sndHit(Math.abs(dv));doShake(Math.abs(dv)*0.38);
}
function pocketCheck(b){
  if(b.pocketed) return;
  for(const p of PKS){
    if((b.x-p.x)**2+(b.y-p.y)**2<PR*PR){
      b.pocketed=true;b.vx=0;b.vy=0;spawnParts(b.x,b.y,CLR[b.id]);sndPocket();
      G.pocketGlows.push({x:p.x,y:p.y,r:PR,life:1});
      G.potted.push(b.id);
      if(b.id===0) G.foul=true;
      else G.floats.push({x:b.x,y:b.y-10,text:CMTS[Math.floor(Math.random()*CMTS.length)],life:1});
      return;
    }
  }
}
function doShake(v){if(v>2){G.sx=(Math.random()-.5)*Math.min(v*.5,3.5);G.sy=(Math.random()-.5)*Math.min(v*.5,3.5);G.st=4;}}
function spawnParts(x,y,c){
  for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2,s=Math.random()*6+1;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c,r:Math.random()*3+.8,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*0.4});}
}

// ── AI ────────────────────────────────────────────────────
function computeAI(){
  const cue=getCue();if(!cue) return;
  const mg=G.grp[1];
  let tgts=G.balls.filter(b=>!b.pocketed&&b.id!==0&&b.id!==8);
  if(mg==='solid') tgts=tgts.filter(b=>b.id>=1&&b.id<=7);
  else if(mg==='stripe') tgts=tgts.filter(b=>b.id>=9&&b.id<=15);
  if(mg&&!tgts.length){const b8=G.balls.find(b=>b.id===8&&!b.pocketed);if(b8) tgts=[b8];}
  if(!tgts.length) tgts=G.balls.filter(b=>!b.pocketed&&b.id!==0);
  if(!tgts.length) return;
  let best=null,bs=-Infinity;
  for(const ball of tgts) for(const pkt of PKS){
    const dx=pkt.x-ball.x,dy=pkt.y-ball.y,dist=Math.hypot(dx,dy);if(dist<1) continue;
    const nx=dx/dist,ny=dy/dist,gx=ball.x-nx*BR*2,gy=ball.y-ny*BR*2;
    const cd=Math.hypot(gx-cue.x,gy-cue.y),score=600/(cd+dist+80);
    if(score>bs){bs=score;best={ang:Math.atan2(gy-cue.y,gx-cue.x)};}
  }
  if(!best) return;
  // Difficulty affects accuracy
  const err=G.gameMode==='1p-easy'?0.45:G.gameMode==='1p-medium'?0.22:0.06;
  const pwrMin=G.gameMode==='1p-easy'?0.3:0.42;
  G.ang=best.ang+(Math.random()-.5)*err;G.pwr=pwrMin+Math.random()*0.5;shoot();
}

// ── RULES ─────────────────────────────────────────────────
function shoot(){
  const cue=getCue();if(!cue) return;
  cue.vx=Math.cos(G.ang)*G.pwr*21;
  cue.vy=Math.sin(G.ang)*G.pwr*21;
  // Apply spin as perpendicular English offset
  const perp=Math.PI/2;
  cue.vx+=Math.cos(G.ang+perp)*spinY*G.pwr*4.5;
  cue.vy+=Math.sin(G.ang+perp)*spinY*G.pwr*4.5;
  spinY=0;
  G.pwr=0;G.charge=false;G.potted=[];G.foul=false;G.state='roll';
}
function endTurn(){
  const pot=G.potted,p8=pot.includes(8),pCue=pot.includes(0)||G.foul;
  const pNum=pot.filter(id=>id!==0&&id!==8);
  if(!G.grp[0]&&pNum.length&&!p8){
    const sol=pNum.some(id=>id>=1&&id<=7),str=pNum.some(id=>id>=9&&id<=15);
    if(sol&&!str){G.grp[G.turn]='solid';G.grp[1-G.turn]='stripe';showMsg(G.turn,'SOLIDS 🟡');}
    else if(str&&!sol){G.grp[G.turn]='stripe';G.grp[1-G.turn]='solid';showMsg(G.turn,'STRIPES 🔵');}
  }
  if(p8){
    const mg=G.grp[G.turn];
    const myIds=mg==='solid'?[1,2,3,4,5,6,7]:mg==='stripe'?[9,10,11,12,13,14,15]:[];
    const cleared=mg&&myIds.every(id=>G.balls.find(b=>b.id===id)?.pocketed);
    G.winner=(!pCue&&cleared&&mg)?G.turn:1-G.turn;
    G.wMsg=G.winner===0?'P1 Wins! 🎱':(G.gameMode==='2p'?'P2 Wins! 🎱':'CPU Wins! 🤖');
    G.state='over';return;
  }
  if(pCue){
    G.turn=1-G.turn;showMsg(G.turn,'SCRATCH! Ball in hand');
    G.hand=true;G.handX=FX+FW/2;G.handY=FY+FH*.73;
    G.state='hand';if(G.turn===1&&G.gameMode!=='2p') G.aiDelay=80;return;
  }
  const mg=G.grp[G.turn];

function getGhost(){
  const cue=getCue();if(!cue) return null;
  const dx=Math.cos(G.ang),dy=Math.sin(G.ang);
  let minT=Infinity,hit=null;
  for(const b of G.balls){
    if(b.pocketed||b.id===0) continue;
    const ex=cue.x-b.x,ey=cue.y-b.y,bq=2*(ex*dx+ey*dy),cq=ex*ex+ey*ey-(BR*2)**2;
    const disc=bq*bq-4*cq;if(disc<0) continue;
    const t=(-bq-Math.sqrt(disc))/2;if(t>0.5&&t<minT){minT=t;hit=b;}
  }
  return hit?{gx:cue.x+dx*minT,gy:cue.y+dy*minT,ball:hit}:null;
}

// ── KEYS ──────────────────────────────────────────────────
const keys={left:false,right:false,up:false,down:false,a:false};
let aPrev=false;
function onKey(e,down){
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();
  if(k==='ArrowLeft'||k==='Left') keys.left=down;
  if(k==='ArrowRight'||k==='Right') keys.right=down;
  if(k==='ArrowUp'||k==='Up') keys.up=down;
  if(k==='ArrowDown'||k==='Down') keys.down=down;
  if(k==='a'||k==='A') keys.a=down;
  if(!down) return;
  // Over screen → back to menu
  if(G.state==='over'&&(k==='Enter'||k==='a'||k==='A'||k===' ')){
    confetti=[];G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;return;
  }
  // Menu navigation
  if(G.state==='menu'){
    if(menuFadeDir===-1) return; // ignore taps during transition
    const maxSel=MENU_BTNS[menuState].length-1;
    if(k==='ArrowRight'||k==='ArrowDown'){menuSel=menuSel+1;if(menuSel>maxSel) menuSel=0;}
    if(k==='ArrowLeft'||k==='ArrowUp'){menuSel=menuSel-1;if(menuSel<0) menuSel=maxSel;}
    if(k==='Enter'||k==='a'||k==='A') menuSelect();
    if(k==='b'||k==='B'||k==='Escape') menuBack();
  }
}
[window,document,cvs].forEach(el=>{el.addEventListener('keydown',e=>onKey(e,true));el.addEventListener('keyup',e=>onKey(e,false));});

// ── MAIN LOOP ─────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  frameCount++;
  G.frame=(G.frame||0)+1;

  // Menu
  if(G.state==='menu'){
    menuFade=Math.max(0,Math.min(1,menuFade+menuFadeDir*0.07));
    if(menuFadeDir===-1&&menuFade<=0&&menuFadeCb){const cb=menuFadeCb;menuFadeCb=null;cb();}
    drawMenu();return;
  }

  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);

  if(G.state==='aim'&&isHuman){
    if(keys.left)  G.ang-=0.008;
    if(keys.right) G.ang+=0.008;
    if(!G.charge){
      if(keys.up)   spinY=Math.min(1,spinY+0.06);
      if(keys.down) spinY=Math.max(-1,spinY-0.06);
    }
    if(keys.a&&!G.charge){G.charge=true;G.pwr=0;}
    if(keys.a&&G.charge) G.pwr=Math.min(1,G.pwr+0.012);
    if(!keys.a&&aPrev&&G.charge){if(G.pwr>0.04) shoot();else{G.charge=false;G.pwr=0;}}
  }
  if(G.state==='hand'&&isHuman){
    const spd=2.5;
    if(keys.left)  G.handX=Math.max(FX+BR+1,G.handX-spd);
    if(keys.right) G.handX=Math.min(FR-BR-1,G.handX+spd);
    if(keys.up)    G.handY=Math.max(FY+BR+1,G.handY-spd);
    if(keys.down)  G.handY=Math.min(FB-BR-1,G.handY+spd);
    if(keys.a&&!aPrev){
      const cb=G.balls.find(b=>b.id===0);cb.pocketed=false;cb.vx=0;cb.vy=0;cb.x=G.handX;cb.y=G.handY;
      G.state='aim';G.potted=[];G.foul=false;
    }
  }
  aPrev=keys.a;

  if(G.state==='roll'){for(let i=0;i<4;i++) physStep();if(allStop()) endTurn();}
  if(G.state==='aim'&&G.turn===1&&G.gameMode!=='2p'){G.aiDelay--;if(G.aiDelay<=0){computeAI();G.aiDelay=9999;}}
  if(G.state==='hand'&&G.turn===1&&G.gameMode!=='2p'){
    G.aiDelay--;if(G.aiDelay<=0){
      const cb=G.balls.find(b=>b.id===0);cb.pocketed=false;cb.vx=0;cb.vy=0;
      cb.x=FX+FW*.28+Math.random()*FW*.44;cb.y=FY+FH*.7;
      G.state='aim';G.potted=[];G.foul=false;G.aiDelay=88;
    }
  }

  // Render
  ctx.clearRect(0,0,W,H);
  drawBg();
  let shook=false;
  if(G.st>0){ctx.save();ctx.translate(G.sx,G.sy);G.sx*=.6;G.sy*=.6;G.st--;shook=true;}
  drawTable();drawTurnSpotlight();drawParts();drawPocketGlows();
  if(G.state==='hand'&&isHuman) drawHandMode();
  if(G.state==='aim'&&isHuman) drawRealisticCue();
  G.balls.forEach(drawBallEnhanced);
  if(shook) ctx.restore();
  drawBallTray();drawHUD();drawPower();
  if(G.state==='aim'&&isHuman) drawCueBallHitSpot();
  drawFloats();
  if(G.state==='over') drawOver();
}
requestAnimationFrame(loop);

// ── TOUCH / MOUSE ─────────────────────────────────────────
let pdn=false;
function getP(e){const r=cvs.getBoundingClientRect();const s=e.changedTouches?.[0]||e.touches?.[0]||e;return{x:(s.clientX-r.left)/scale,y:(s.clientY-r.top)/scale};}
function aimTo(p){const cue=getCue();if(!cue) return;const dx=p.x-cue.x,dy=p.y-cue.y;if(dx*dx+dy*dy>64) G.ang=Math.atan2(dy,dx);}

function onDown(e){
  e.preventDefault();initAudio();
  const p=getP(e);
  if(G.state==='over'){G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;return;}
  if(G.state==='menu'){
    const btns=MENU_BTNS[menuState];
    if(menuState==='player'){
      const bw=148,bh=52,gap=18,by=H-165,sx=(W-(bw*2+gap))/2;
      btns.forEach((btn,i)=>{const bx=sx+i*(bw+gap);if(p.x>=bx&&p.x<=bx+bw&&p.y>=by&&p.y<=by+bh){menuSel=i;menuSelect();}});
    } else {
      const bw=100,bh=48,gap=10,by=H-158,sx=(W-(bw*3+gap*2))/2;
      btns.forEach((btn,i)=>{const bx=sx+i*(bw+gap);if(p.x>=bx&&p.x<=bx+bw&&p.y>=by&&p.y<=by+bh){menuSel=i;menuSelect();}});
      if(p.y<H-180) menuBack();
    }
    return;
  }
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));return;}
  if(G.state!=='aim'||!isHuman) return;
  pdn=true;G.charge=true;G.pwr=0;aimTo(p);
}
function onMove(e){
  e.preventDefault();const p=getP(e);
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));return;}
  if(!pdn||G.state!=='aim'||!isHuman) return;
  aimTo(p);
}
function onUp(e){
  e.preventDefault();const p=getP(e);
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){
    G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));
    const cb=G.balls.find(b=>b.id===0);cb.pocketed=false;cb.vx=0;cb.vy=0;cb.x=G.handX;cb.y=G.handY;
    G.state='aim';G.potted=[];G.foul=false;return;
  }
  if(!pdn) return;pdn=false;
  if(G.state==='aim'&&isHuman&&G.charge){if(G.pwr>0.04) shoot();else{G.charge=false;G.pwr=0;}}
}
cvs.addEventListener('mousedown',onDown);
cvs.addEventListener('mousemove',onMove);
cvs.addEventListener('mouseup',onUp);
cvs.addEventListener('touchstart',onDown,{passive:false});
cvs.addEventListener('touchmove',onMove,{passive:false});
cvs.addEventListener('touchend',onUp,{passive:false});
</script>
