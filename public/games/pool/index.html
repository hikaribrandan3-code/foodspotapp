];
const BPM=82, BEAT=60/BPM;
let jBar=0, jBt=0, jNext=0;

function initAudio(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();jNext=AC.currentTime+0.08;schedJazz();}catch(e){}
}
function schedJazz(){
  if(!AC)return;
  while(jNext<AC.currentTime+0.55){
    playJazzBeat(PROG[jBar%PROG.length],jBt,jNext);
    jNext+=BEAT; jBt++;
    if(jBt>=4){jBt=0;jBar=(jBar+1)%PROG.length;}
  }
  setTimeout(schedJazz,160);
}
function playJazzBeat(bar,bt,t){
  bassNote(bt===3?bar.b[bt]*Math.pow(2,1/12):bar.b[bt],t);
  if(bt===0){pianoNote(bar.c[1],t,0.055);pianoNote(bar.c[3],t+0.012,0.042);}
  else if(bt===1){pianoNote(bar.c[2],t+BEAT*0.62,0.038);}
  else if(bt===2){pianoNote(bar.c[0],t,0.048);pianoNote(bar.c[2],t+0.018,0.044);pianoNote(bar.c[3],t+0.030,0.038);}
  else{pianoNote(bar.c[3],t,0.032);}
  hihat(t,0.55,bt===1||bt===3); hihat(t+BEAT*0.63,0.30,false);
  if(bt===0)kick(t,0.55); if(bt===2)kick(t,0.20);
  if(bt===1||bt===3)brush(t);
  ride(t);
  if(bt===0&&jBar%8===4)saxNote(bar.c[2]/2,t,0.038);
  if(bt===2&&jBar%8===4)saxNote(bar.c[3]/2,t+BEAT*.3,0.028);
  if(jBar>=8&&jBar<=15&&(bt===1||bt===3))trumpetNote(bar.b[bt],t+BEAT*.08,0.028);
}
function bassNote(freq,t){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type='triangle';o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(0.20,t+0.018);
  g.gain.exponentialRampToValueAtTime(0.09,t+BEAT*0.55);g.gain.exponentialRampToValueAtTime(0.001,t+BEAT*0.82);
  o.start(t);o.stop(t+BEAT*0.88);
}
function pianoNote(freq,t,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(vol,t+0.016);
  g.gain.exponentialRampToValueAtTime(vol*0.45,t+0.10);g.gain.exponentialRampToValueAtTime(0.001,t+BEAT*1.7);
  o.start(t);o.stop(t+BEAT*1.8);
}
function hihat(t,vol,accent){
  const sr=AC.sampleRate,dur=accent?0.058:0.030,frames=Math.floor(sr*dur);
  const buf=AC.createBuffer(1,frames,sr),d=buf.getChannelData(0);
  for(let i=0;i<frames;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/frames,1.6);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();
  s.buffer=buf;f.type='highpass';f.frequency.value=9000;
  s.connect(f);f.connect(gg);gg.connect(AC.destination);gg.gain.value=(accent?0.10:0.056)*vol;s.start(t);
}
function kick(t,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type='sine';
  o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(38,t+0.09);
  g.gain.setValueAtTime(vol*0.55,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.20);o.start(t);o.stop(t+0.22);
}
function brush(t){
  const sr=AC.sampleRate,frames=Math.floor(sr*0.14),buf=AC.createBuffer(1,frames,sr),d=buf.getChannelData(0);
  for(let i=0;i<frames;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/frames)*Math.pow(1-i/frames,0.6);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();
  s.buffer=buf;f.type='bandpass';f.frequency.value=3200;f.Q.value=0.7;
  s.connect(f);f.connect(gg);gg.connect(AC.destination);gg.gain.value=0.065;s.start(t);
}
function ride(t){
  const sr=AC.sampleRate,frames=Math.floor(sr*0.30),buf=AC.createBuffer(1,frames,sr),d=buf.getChannelData(0);
  for(let i=0;i<frames;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/frames,2.2);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();
  s.buffer=buf;f.type='highpass';f.frequency.value=5800;
  s.connect(f);f.connect(gg);gg.connect(AC.destination);gg.gain.value=0.018;s.start(t);
}
function saxNote(freq,t,vol){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  const lfo=AC.createOscillator(),lg=AC.createGain();
  lfo.frequency.value=5.2;lfo.type='sine';lg.gain.value=4;
  lfo.connect(lg);lg.connect(o.frequency);
  o.type='sawtooth';o.frequency.value=freq;
  f.type='bandpass';f.frequency.value=1200;f.Q.value=1.8;
  o.connect(f);f.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(vol,t+0.06);
  g.gain.exponentialRampToValueAtTime(vol*.6,t+0.18);g.gain.exponentialRampToValueAtTime(0.001,t+BEAT*1.6);
  lfo.start(t);lfo.stop(t+BEAT*1.7);o.start(t);o.stop(t+BEAT*1.7);
}
function trumpetNote(freq,t,vol){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type='square';o.frequency.value=freq;
  f.type='highpass';f.frequency.value=600;
  o.connect(f);f.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(vol,t+0.018);
  g.gain.exponentialRampToValueAtTime(vol*.4,t+0.08);g.gain.exponentialRampToValueAtTime(0.001,t+BEAT*.55);
  o.start(t);o.stop(t+BEAT*.6);
}
function sndHit(v){
  if(!AC||v<0.8)return;
  const t=AC.currentTime,vol=Math.min(0.5,v*0.062);
  const o1=AC.createOscillator(),g1=AC.createGain();
  o1.connect(g1);g1.connect(AC.destination);o1.type='sine';
  o1.frequency.setValueAtTime(1800+v*120,t);o1.frequency.exponentialRampToValueAtTime(320,t+0.035);
  g1.gain.setValueAtTime(vol,t);g1.gain.exponentialRampToValueAtTime(0.001,t+0.055);o1.start(t);o1.stop(t+0.06);
  const o2=AC.createOscillator(),g2=AC.createGain();
  o2.connect(g2);g2.connect(AC.destination);o2.type='triangle';
  o2.frequency.setValueAtTime(520+v*60,t);o2.frequency.exponentialRampToValueAtTime(110,t+0.08);
  g2.gain.setValueAtTime(vol*0.7,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.1);o2.start(t);o2.stop(t+0.11);
}
function sndPocket(){
  if(!AC)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type='sine';
  o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(55,t+0.3);
  g.gain.setValueAtTime(0.26,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.38);o.start(t);o.stop(t+0.42);
}

function newGame(){

  const cx=FX+FW/2,cy=FY+FH*.27,d=BR*2+1.3; let ri=0;
  for(let r=0;r<5;r++)for(let c=0;c<=r;c++)
    balls.push({id:RACK[ri++],x:cx+(c-r/2)*d,y:cy+r*d*0.866,vx:0,vy:0,angle:0,pocketed:false});
  G={
    state:'aim',balls,floats:[],parts:[],pocketGlows:[],
    ang:Math.PI,pwr:0,charge:false,
    turn:0,grp:[null,null],potted:[],foul:false,
    hand:false,handX:FX+FW/2,handY:FY+FH*.55,
    winner:-1,wMsg:'',sx:0,sy:0,st:0,
    msg:'',msgT:0,aiDelay:9999,frame:0,gameMode,
    turnCount:0,foulFlash:0,isBreak:true

function dk(h,a=60){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.max(0,r-a)},${Math.max(0,g-a)},${Math.max(0,b-a)})`;}

// ── PHYSICS ───────────────────────────────────────────────
const getCue=function(){return G.balls&&G.balls.find(function(b){return b.id===0&&!b.pocketed;});};
const allStop=function(){return G.balls.every(function(b){return b.pocketed||Math.hypot(b.vx,b.vy)<0.07;});};
function physStep(){
  const act=G.balls.filter(function(b){return !b.pocketed;});
  for(const b of act){
    b.vx*=0.978;b.vy*=0.978;
    if(Math.abs(b.vx)<0.06)b.vx=0;if(Math.abs(b.vy)<0.06)b.vy=0;
    b.x+=b.vx;b.y+=b.vy;
    const spd=Math.hypot(b.vx,b.vy);if(spd>0.06)b.angle+=spd/BR;
    pocketCheck(b);if(!b.pocketed)wallBounce(b);
  }
  for(let p=0;p<2;p++)for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++)
    if(!act[i].pocketed&&!act[j].pocketed)ballCollide(act[i],act[j]);
}
function wallBounce(b){
  if(PKS.some(function(p){return Math.hypot(b.x-p.x,b.y-p.y)<PR+BR+2;}))return;
  const e=0.76;
  if(b.x-BR<FX&&b.vx<0){b.x=FX+BR;b.vx*=-e;doShake(Math.abs(b.vx));}
  if(b.x+BR>FR&&b.vx>0){b.x=FR-BR;b.vx*=-e;doShake(Math.abs(b.vx));}
  if(b.y-BR<FY&&b.vy<0){b.y=FY+BR;b.vy*=-e;doShake(Math.abs(b.vy));}
  if(b.y+BR>FB&&b.vy>0){b.y=FB-BR;b.vy*=-e;doShake(Math.abs(b.vy));}
}
function ballCollide(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,mn=BR*2;
  if(d2>=mn*mn||d2<0.01)return;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
  const dv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(dv<=0)return;
  a.vx-=dv*nx;a.vy-=dv*ny;b.vx+=dv*nx;b.vy+=dv*ny;
  const ov=(mn-d)*0.5+0.1;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
  const shakeAmt=G.isBreak?Math.abs(dv)*1.8:Math.abs(dv)*0.38;
  sndHit(Math.abs(dv));doShake(shakeAmt);
  if(G.isBreak){G.isBreak=false;}
}
function pocketCheck(b){
  if(b.pocketed)return;
  for(const p of PKS){
    if((b.x-p.x)**2+(b.y-p.y)**2<PR*PR){
      b.pocketed=true;b.vx=0;b.vy=0;
      spawnParts(b.x,b.y,CLR[b.id]);sndPocket();
      G.pocketGlows.push({x:p.x,y:p.y,life:1});
      G.potted.push(b.id);
      if(b.id===0){G.foul=true;G.foulFlash=1;}
      else G.floats.push({x:b.x,y:b.y-10,text:CMTS[Math.floor(Math.random()*CMTS.length)],life:1});
      return;
    }
  }
}
function doShake(v){
  if(v>2){G.sx=(Math.random()-.5)*Math.min(v*.5,4.5);G.sy=(Math.random()-.5)*Math.min(v*.5,4.5);G.st=5;}
}
function spawnParts(x,y,c){
  for(let i=0;i<28;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*6+1;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c,r:Math.random()*3+.8,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*0.4});
  }
}

// ── AI ────────────────────────────────────────────────────
function computeAI(){
  const cue=getCue();if(!cue)return;
  const mg=G.grp[1];
  let tgts=G.balls.filter(function(b){return !b.pocketed&&b.id!==0&&b.id!==8;});
  if(mg==='solid')tgts=tgts.filter(function(b){return b.id>=1&&b.id<=7;});
  else if(mg==='stripe')tgts=tgts.filter(function(b){return b.id>=9&&b.id<=15;});
  if(mg&&!tgts.length){const b8=G.balls.find(function(b){return b.id===8&&!b.pocketed;});if(b8)tgts=[b8];}
  if(!tgts.length)tgts=G.balls.filter(function(b){return !b.pocketed&&b.id!==0;});
  if(!tgts.length)return;
  let best=null,bs=-Infinity;
  for(const ball of tgts)for(const pkt of PKS){
    const dx=pkt.x-ball.x,dy=pkt.y-ball.y,dist=Math.hypot(dx,dy);if(dist<1)continue;
    const nx=dx/dist,ny=dy/dist,gx=ball.x-nx*BR*2,gy=ball.y-ny*BR*2;
    const cd=Math.hypot(gx-cue.x,gy-cue.y),score=600/(cd+dist+80);
    if(score>bs){bs=score;best={ang:Math.atan2(gy-cue.y,gx-cue.x)};}
  }
  if(!best)return;
  const err=G.gameMode==='1p-easy'?0.45:G.gameMode==='1p-medium'?0.22:0.06;
  G.ang=best.ang+(Math.random()-.5)*err;
  G.pwr=(G.gameMode==='1p-easy'?0.3:0.42)+Math.random()*0.5;
  shoot();
}

// ── RULES ─────────────────────────────────────────────────
function shoot(){
  const cue=getCue();if(!cue)return;
  cue.vx=Math.cos(G.ang)*G.pwr*21;
  cue.vy=Math.sin(G.ang)*G.pwr*21;
  cue.vx+=Math.cos(G.ang+Math.PI/2)*spinY*G.pwr*4.5;
  cue.vy+=Math.sin(G.ang+Math.PI/2)*spinY*G.pwr*4.5;
  spinY=0;G.pwr=0;G.charge=false;G.potted=[];G.foul=false;G.state='roll';
}
function endTurn(){
  G.turnCount++;
  const pot=G.potted,p8=pot.includes(8),pCue=pot.includes(0)||G.foul;
  const pNum=pot.filter(function(id){return id!==0&&id!==8;});
  if(!G.grp[0]&&pNum.length&&!p8){
    const sol=pNum.some(function(id){return id>=1&&id<=7;}),str=pNum.some(function(id){return id>=9&&id<=15;});
    if(sol&&!str){G.grp[G.turn]='solid';G.grp[1-G.turn]='stripe';showMsg(G.turn,'SOLIDS 🟡');}
    else if(str&&!sol){G.grp[G.turn]='stripe';G.grp[1-G.turn]='solid';showMsg(G.turn,'STRIPES 🔵');}
  }
  if(p8){
    const mg=G.grp[G.turn];
    const myIds=mg==='solid'?[1,2,3,4,5,6,7]:mg==='stripe'?[9,10,11,12,13,14,15]:[];
    const cleared=mg&&myIds.every(function(id){return G.balls.find(function(b){return b.id===id;})?.pocketed;});
    G.winner=(!pCue&&cleared&&mg)?G.turn:1-G.turn;
    G.wMsg=G.winner===0?'P1 Wins! 🎱':(G.gameMode==='2p'?'P2 Wins! 🎱':'CPU Wins! 🤖');
    G.state='over';return;
  }
  if(pCue){
    G.foulFlash=1;
    G.turn=1-G.turn;showMsg(G.turn,'SCRATCH! Ball in hand');
    G.hand=true;G.handX=FX+FW/2;G.handY=FY+FH*.55;
    G.state='hand';if(G.turn===1&&G.gameMode!=='2p')G.aiDelay=80;return;
  }
  const mg=G.grp[G.turn];
  const own=pNum.length&&(!mg||pNum.some(function(id){return mg==='solid'?id>=1&&id<=7:id>=9&&id<=15;}));
  if(!own)G.turn=1-G.turn;
  G.potted=[];G.foul=false;G.state='aim';
  if(G.turn===1&&G.gameMode!=='2p')G.aiDelay=85;
}
function showMsg(p,txt){G.msg='P'+(p+1)+': '+txt;G.msgT=140;}
function getGhost(){
  const cue=getCue();if(!cue)return null;
  const dx=Math.cos(G.ang),dy=Math.sin(G.ang);
  let minT=Infinity,hit=null;
  for(const b of G.balls){
    if(b.pocketed||b.id===0)continue;
    const ex=cue.x-b.x,ey=cue.y-b.y,bq=2*(ex*dx+ey*dy),cq=ex*ex+ey*ey-(BR*2)**2;
    const disc=bq*bq-4*cq;if(disc<0)continue;
    const t=(-bq-Math.sqrt(disc))/2;if(t>0.5&&t<minT){minT=t;hit=b;}
  }
  return hit?{gx:cue.x+dx*minT,gy:cue.y+dy*minT,ball:hit}:null;
}

  ctx.beginPath();ctx.arc(mx,my,r+10,0,Math.PI*2);

  outerBg.addColorStop(0,'#1a1208');outerBg.addColorStop(.5,'#0e0a04');outerBg.addColorStop(1,'#060402');
  ctx.fillStyle=outerBg;ctx.fill();ctx.shadowBlur=0;
  const ring=ctx.createLinearGradient(mx-r-10,my-r-10,mx+r+10,my+r+10);
  ring.addColorStop(0,'#8a6a10');ring.addColorStop(.3,'#d4a820');ring.addColorStop(.5,'#ffd700');ring.addColorStop(.7,'#c8960a');ring.addColorStop(1,'#6a4e08');
  ctx.beginPath();ctx.arc(mx,my,r+10,0,Math.PI*2);ctx.strokeStyle=ring;ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(mx,my,r+6,0,Math.PI*2);ctx.strokeStyle='rgba(212,175,55,0.3)';ctx.lineWidth=1;ctx.stroke();

  ctx.beginPath();ctx.arc(mx,my,r+4,0,Math.PI*2);ctx.fillStyle=velvet;ctx.fill();
  ctx.strokeStyle='rgba(212,175,55,0.45)';ctx.lineWidth=0.8;ctx.setLineDash([2,3]);
  ctx.beginPath();ctx.moveTo(mx-r,my);ctx.lineTo(mx+r,my);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mx,my-r);ctx.lineTo(mx,my+r);ctx.stroke();
  ctx.setLineDash([]);
  const bg=ctx.createRadialGradient(mx-5,my-5,1,mx,my,r);
  bg.addColorStop(0,'rgba(255,255,255,0.9)');bg.addColorStop(.5,'rgba(220,220,235,0.7)');bg.addColorStop(1,'rgba(140,140,160,0.5)');
  ctx.beginPath();ctx.arc(mx,my,r*.7,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();

  ctx.save();ctx.shadowColor=dotColor;ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(mx,dotY,5,0,Math.PI*2);ctx.fillStyle=dotColor;ctx.fill();

  ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText('E N G L I S H',mx,my-r-14);

  rl.addColorStop(0,'transparent');rl.addColorStop(.5,'rgba(212,175,55,0.5)');rl.addColorStop(1,'transparent');
  ctx.fillStyle=rl;ctx.fillRect(mx-22,my-r-11,44,0.8);

}

function drawRealisticCue(){
  const cue=getCue();if(!cue)return;
  const ang=G.ang,pb=G.charge?G.pwr*32+6:5,gh=getGhost();
  const pulse=0.55+Math.sin(G.frame*0.18)*0.35,dashOff=(G.frame*.8)%14;
  drawAimPulse();
  ctx.save();
  if(gh){
    ctx.setLineDash([6,5]);ctx.lineDashOffset=-dashOff;
    ctx.strokeStyle=CY2+(0.14+pulse*0.14)+')';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cue.x+Math.cos(ang)*(BR+1),cue.y+Math.sin(ang)*(BR+1));ctx.lineTo(gh.gx,gh.gy);ctx.stroke();
    ctx.setLineDash([]);ctx.strokeStyle=CY2+(0.06+pulse*0.1)+')';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(cue.x+Math.cos(ang)*(BR+1),cue.y+Math.sin(ang)*(BR+1));ctx.lineTo(gh.gx,gh.gy);ctx.stroke();
    ctx.beginPath();ctx.arc(gh.gx,gh.gy,BR,0,Math.PI*2);
    ctx.strokeStyle=CY2+(0.28+pulse*0.32)+')';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='rgba(34,211,238,0.07)';ctx.fill();
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.65)';
    ctx.beginPath();ctx.arc(gh.ball.x,gh.ball.y-BR-10,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,215,0,0.9)';ctx.font='bold 8px Georgia,serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(gh.ball.id,gh.ball.x,gh.ball.y-BR-10);
    ctx.restore();
    const tnx=(gh.ball.x-gh.gx)/(BR*2),tny=(gh.ball.y-gh.gy)/(BR*2);
    ctx.setLineDash([4,4]);ctx.lineDashOffset=-dashOff;
    ctx.beginPath();ctx.moveTo(gh.ball.x,gh.ball.y);ctx.lineTo(gh.ball.x+tnx*52,gh.ball.y+tny*52);
    ctx.strokeStyle='rgba(250,204,21,'+(0.35+pulse*0.28)+')';ctx.lineWidth=1.6;ctx.stroke();
  }else{
    ctx.setLineDash([6,5]);ctx.lineDashOffset=-dashOff;
    ctx.strokeStyle=CY2+(0.10+pulse*0.1)+')';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cue.x+Math.cos(ang)*(BR+1),cue.y+Math.sin(ang)*(BR+1));ctx.lineTo(cue.x+Math.cos(ang)*145,cue.y+Math.sin(ang)*145);ctx.stroke();
    ctx.setLineDash([]);ctx.strokeStyle=CY2+(0.04+pulse*0.07)+')';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(cue.x+Math.cos(ang)*(BR+1),cue.y+Math.sin(ang)*(BR+1));ctx.lineTo(cue.x+Math.cos(ang)*145,cue.y+Math.sin(ang)*145);ctx.stroke();
  }
  ctx.setLineDash([]);ctx.restore();
  const tx=cue.x-Math.cos(ang)*(BR+pb),ty2=cue.y-Math.sin(ang)*(BR+pb);
  ctx.save();ctx.translate(tx,ty2);ctx.rotate(ang+Math.PI);
  ctx.beginPath();ctx.moveTo(0,-2.2);ctx.lineTo(135,-5.8);ctx.lineTo(135,5.8);ctx.lineTo(0,2.2);ctx.closePath();
  const sg=ctx.createLinearGradient(0,-3,0,3);
  sg.addColorStop(0,'#f0e0a8');sg.addColorStop(.25,'#d4a84b');sg.addColorStop(.5,'#c8922a');sg.addColorStop(.75,'#b87820');sg.addColorStop(1,'#8a5010');
  ctx.fillStyle=sg;ctx.fill();
  ctx.strokeStyle='rgba(100,60,10,0.18)';ctx.lineWidth=0.5;
  [0.3,0.55,0.72].forEach(function(t){ctx.beginPath();ctx.moveTo(10,(-2.2+(4.4*t)));ctx.lineTo(100,(-5.8+(11.6*t)));ctx.stroke();});
  ctx.strokeStyle='rgba(60,30,5,0.6)';ctx.lineWidth=1.5;
  [25,48,68].forEach(function(lx){ctx.beginPath();ctx.moveTo(lx,-5.8*(lx/135));ctx.lineTo(lx,5.8*(lx/135));ctx.stroke();});
  ctx.beginPath();ctx.moveTo(88,-5.2);ctx.lineTo(135,-5.8);ctx.lineTo(135,5.8);ctx.lineTo(88,5.2);ctx.closePath();
  const bg2=ctx.createLinearGradient(0,-5,0,5);
  bg2.addColorStop(0,'#5a2808');bg2.addColorStop(.5,'#3a1604');bg2.addColorStop(1,'#2a0c04');
  ctx.fillStyle=bg2;ctx.fill();
  ctx.beginPath();ctx.moveTo(-1,-2.2);ctx.lineTo(6,-2.8);ctx.lineTo(6,2.8);ctx.lineTo(-1,2.2);ctx.closePath();
  ctx.fillStyle='#3b7fd4';ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(tx,ty2,2.5,0,Math.PI*2);ctx.fillStyle='#3b7fd4';ctx.fill();
}
function drawPower(){
  if(!G.charge&&G.pwr<0.01)return;
  const p=G.pwr;
  if(p>0.6){const a=(p-0.6)/0.4*0.16;ctx.fillStyle=p>0.85?'rgba(239,68,68,'+a+')':'rgba(34,211,238,'+a+')';ctx.fillRect(W-7,TY,7,TH);}
  const bx=W-13,by=TY+10,bw=9,bh=TH-20;
  ctx.fillStyle='rgba(0,0,0,0.55)';rr(bx,by,bw,bh,4);ctx.fill();
  ctx.strokeStyle='rgba(34,211,238,0.18)';ctx.lineWidth=1;rr(bx,by,bw,bh,4);ctx.stroke();
  if(p>0.01){
    const fh=bh*p;
    const pg=ctx.createLinearGradient(0,by+bh,0,by+bh-fh);
    pg.addColorStop(0,p<0.5?CY:p<0.8?'#f59e0b':'#ef4444');pg.addColorStop(1,p<0.5?'#0891b2':p<0.8?'#fbbf24':'#f87171');
    rr(bx,by+bh-fh,bw,fh,4);ctx.fillStyle=pg;ctx.fill();
    if(p>0.5){ctx.save();ctx.shadowColor=p>0.8?'#ef4444':'#f59e0b';ctx.shadowBlur=7+p*9;rr(bx,by+bh-fh,bw,fh,4);ctx.strokeStyle='transparent';ctx.stroke();ctx.restore();}
  }
  ctx.strokeStyle='rgba(34,211,238,0.3)';ctx.lineWidth=1;
  [.25,.5,.75].forEach(function(frac){ctx.beginPath();ctx.moveTo(bx-3,by+bh*(1-frac));ctx.lineTo(bx,by+bh*(1-frac));ctx.stroke();});
  ctx.fillStyle='rgba(34,211,238,0.6)';ctx.font='bold 6px Arial';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('PWR',bx+bw/2,by+bh+4);
  ctx.fillStyle=p>0.8?'#ef4444':p>0.5?'#f59e0b':CY;ctx.font='bold 7px Arial';ctx.fillText(Math.round(p*100)+'%',bx+bw/2,by+bh+12);
}
function drawBallTray(){
  const ty=FB+20,sr=6.5,gap=14.5,trayH=sr*2+36,cx8=FX+FW/2;
  [0,1].forEach(function(pl){
    if(!G.grp[pl])return;
    const isSolid=G.grp[pl]==='solid',pc=isSolid?'34,197,94':'59,130,246';
    const px=pl===0?FX:FR-52;
    ctx.save();rr(px,ty-28,52,13,6);
    ctx.fillStyle='rgba('+pc+',0.18)';ctx.fill();
    ctx.strokeStyle='rgba('+pc+',0.5)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='rgba('+pc+',0.9)';ctx.font='bold 7px Georgia,serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(isSolid?'SOLIDS':'STRIPES',px+26,ty-22);ctx.restore();
  });
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;
  rr(FX,ty-4,FW,trayH,8);ctx.fillStyle='#0a0700';ctx.fill();ctx.restore();
  const velvet=ctx.createLinearGradient(FX,ty-4,FX,ty+trayH);
  velvet.addColorStop(0,'#120d02');velvet.addColorStop(.5,'#0e0a01');velvet.addColorStop(1,'#080600');
  rr(FX,ty-4,FW,trayH,8);ctx.fillStyle=velvet;ctx.fill();
  const ropeG=ctx.createLinearGradient(FX,0,FR,0);
  ropeG.addColorStop(0,'transparent');ropeG.addColorStop(.08,'rgba(212,175,55,0.9)');
  ropeG.addColorStop(.5,'rgba(255,220,80,1)');ropeG.addColorStop(.92,'rgba(212,175,55,0.9)');ropeG.addColorStop(1,'transparent');
  ctx.fillStyle=ropeG;ctx.fillRect(FX,ty-4,FW,1.5);
  ctx.fillStyle=ropeG;ctx.fillRect(FX,ty+trayH-5,FW,1.5);
  ctx.strokeStyle='rgba(212,175,55,0.25)';ctx.lineWidth=1;rr(FX,ty-4,FW,trayH,8);ctx.stroke();
  ctx.strokeStyle='rgba(212,175,55,0.18)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx8-18,ty);ctx.lineTo(cx8-18,ty+trayH-8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx8+18,ty);ctx.lineTo(cx8+18,ty+trayH-8);ctx.stroke();
  function drawTrayBall(bx,by,id,isStripe){
    const poc=G.balls.find(function(b){return b.id===id;})?.pocketed;
    const slot=ctx.createRadialGradient(bx,by+1,0,bx,by,sr+2);
    slot.addColorStop(0,'rgba(0,0,0,0.7)');slot.addColorStop(1,'rgba(0,0,0,0.2)');
    ctx.beginPath();ctx.arc(bx,by,sr+2,0,Math.PI*2);ctx.fillStyle=slot;ctx.fill();
    if(poc){
      const ig=ctx.createRadialGradient(bx,by+1,0,bx,by,sr);
      ig.addColorStop(0,'rgba(0,0,0,0.8)');ig.addColorStop(.6,'rgba(0,0,0,0.5)');ig.addColorStop(1,'rgba(20,15,2,0.3)');
      ctx.beginPath();ctx.arc(bx,by,sr,0,Math.PI*2);ctx.fillStyle=ig;ctx.fill();
      ctx.strokeStyle='rgba(212,175,55,0.1)';ctx.lineWidth=1;ctx.stroke();
    }else{
      if(isStripe){
        ctx.save();ctx.beginPath();ctx.arc(bx,by,sr,0,Math.PI*2);ctx.clip();
        ctx.fillStyle='#d8e0e8';ctx.fillRect(bx-sr,by-sr,sr*2,sr*2);
        ctx.fillStyle=CLR[id];ctx.fillRect(bx-sr,by-sr*.45,sr*2,sr*.9);ctx.restore();
      }else{ctx.beginPath();ctx.arc(bx,by,sr,0,Math.PI*2);ctx.fillStyle=CLR[id];ctx.fill();}
      const owned=(isStripe&&(G.grp[0]==='stripe'||G.grp[1]==='stripe'))||(!isStripe&&(G.grp[0]==='solid'||G.grp[1]==='solid'));
      ctx.beginPath();ctx.arc(bx,by,sr,0,Math.PI*2);
      ctx.strokeStyle=owned?'rgba(212,175,55,0.7)':'rgba(255,255,255,0.12)';ctx.lineWidth=owned?1.6:.7;ctx.stroke();
      ctx.beginPath();ctx.arc(bx-2,by-2,sr*.3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fill();
    }
  }
  const solids=[1,2,3,4,5,6,7],stripes=[9,10,11,12,13,14,15];
  solids.forEach(function(id,i){drawTrayBall(FX+sr+i*gap+4,ty+sr+4,id,false);});
  stripes.forEach(function(id,i){drawTrayBall(FR-sr-i*gap-4,ty+sr+4,id,true);});
  const c8y=ty+sr+4,b8=G.balls.find(function(b){return b.id===8;});
  const slot8=ctx.createRadialGradient(cx8,c8y+1,0,cx8,c8y,sr+3);
  slot8.addColorStop(0,'rgba(0,0,0,0.7)');slot8.addColorStop(1,'rgba(0,0,0,0.2)');
  ctx.beginPath();ctx.arc(cx8,c8y,sr+3,0,Math.PI*2);ctx.fillStyle=slot8;ctx.fill();
  ctx.beginPath();ctx.arc(cx8,c8y,sr+2,0,Math.PI*2);
  const b8g=ctx.createRadialGradient(cx8-3,c8y-3,1,cx8,c8y,sr+2);
  b8g.addColorStop(0,b8?.pocketed?'#1a1a1a':'#4a4060');b8g.addColorStop(1,b8?.pocketed?'#0a0a0a':'#080610');
  ctx.fillStyle=b8g;ctx.fill();
  ctx.strokeStyle=b8?.pocketed?'rgba(212,175,55,0.08)':'rgba(212,175,55,0.7)';ctx.lineWidth=1.8;ctx.stroke();
  if(!b8?.pocketed){ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 7px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('8',cx8,c8y+.5);}
  const ly=ty+sr*2+18;
  const p0act=G.turn===0&&G.state!=='over',p1act=G.turn===1&&G.state!=='over';
  ctx.font='9px Arial';ctx.textBaseline='top';
  ctx.fillStyle=p0act?'rgba(255,215,0,0.9)':'rgba(180,140,30,0.35)';
  ctx.textAlign='left';ctx.fillText('♔',FX+4,ly);
  ctx.font='bold 8px Georgia,serif';ctx.fillText(' P1',FX+14,ly+1);
  ctx.fillStyle=p1act?'rgba(255,215,0,0.9)':'rgba(180,140,30,0.35)';
  ctx.textAlign='right';ctx.font='bold 8px Georgia,serif';ctx.fillText((G.gameMode==='2p'?'P2':'CPU')+' ',FR-14,ly+1);
  ctx.font='9px Arial';ctx.fillText('♔',FR-6,ly);
  ctx.fillStyle='rgba(212,175,55,0.28)';ctx.font='7px Georgia,serif';
  ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('TURN '+G.turnCount,cx8,ly+1);
}

  [[W-30,cy-6],[W-28,cy+8],[W-42,cy-16]].forEach(function(pt){ctx.save();ctx.translate(pt[0],pt[1]);ctx.rotate(Math.PI/4);ctx.fillRect(-2.5,-2.5,5,5);ctx.restore();});
  const tr=ctx.createLinearGradient(60,0,W-60,0);
  tr.addColorStop(0,'transparent');tr.addColorStop(.5,'rgba(212,175,55,0.4)');tr.addColorStop(1,'transparent');
  ctx.fillStyle=tr;ctx.fillRect(60,10,W-120,0.8);
  ctx.fillStyle=tr;ctx.fillRect(60,TY-10,W-120,0.8);
  ctx.save();ctx.translate(W/2,11);ctx.rotate(Math.PI/4);ctx.fillStyle='rgba(212,175,55,0.6)';ctx.fillRect(-2,-2,4,4);ctx.restore();
  ctx.save();ctx.translate(W/2,TY-10);ctx.rotate(Math.PI/4);ctx.fillStyle='rgba(212,175,55,0.6)';ctx.fillRect(-2,-2,4,4);ctx.restore();
  ctx.restore();
  ctx.save();
  const tg=ctx.createLinearGradient(W/2-90,0,W/2+90,0);
  tg.addColorStop(0,'#fff8dc');tg.addColorStop(.4,'#ffd700');tg.addColorStop(1,'#c8960a');
  ctx.shadowColor='rgba(212,175,55,0.85)';ctx.shadowBlur=20;
  ctx.fillStyle=tg;ctx.font='bold 22px Georgia,serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText("HIKARI'S BILLIARDS",W/2,TY/2);
  ctx.restore();
  [0,1].forEach(function(p){
    const px=p===0?30:W-30,act=G.turn===p&&G.state!=='over';
    if(act){
      ctx.save();ctx.shadowColor='rgba(212,175,55,0.9)';ctx.shadowBlur=14;
      ctx.beginPath();ctx.arc(px,TY/2,19,0,Math.PI*2);
      ctx.strokeStyle='rgba(212,175,55,1)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
    }
    ctx.beginPath();ctx.arc(px,TY/2,15,0,Math.PI*2);
    const ag=ctx.createRadialGradient(px-4,TY/2-4,2,px,TY/2,15);
    ag.addColorStop(0,act?'rgba(80,60,10,0.95)':'rgba(25,18,4,0.95)');ag.addColorStop(1,'rgba(5,3,1,0.98)');
    ctx.fillStyle=ag;ctx.fill();
    ctx.strokeStyle=act?'rgba(212,175,55,0.8)':'rgba(140,105,20,0.4)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle=act?'#ffd700':'rgba(180,140,30,0.55)';
    ctx.font='bold '+(act?'8.5':'8')+'px Georgia,serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p===0?'P1':(G.gameMode==='2p'?'P2':'CPU'),px,TY/2+3);
    if(act){
      const dir=p===0?1:-1;
      ctx.save();ctx.shadowColor='rgba(212,175,55,0.9)';ctx.shadowBlur=8;
      ctx.fillStyle='rgba(212,175,55,0.95)';
      ctx.beginPath();ctx.moveTo(px+dir*22,TY/2);ctx.lineTo(px+dir*28,TY/2-3);ctx.lineTo(px+dir*28,TY/2+3);ctx.closePath();ctx.fill();
      ctx.restore();
    }
  });
  if(G.msgT>0){
    G.msgT--;
    ctx.fillStyle='rgba(255,215,0,'+(Math.min(1,G.msgT/28))+')';
    ctx.font='bold 11px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillText(G.msg,W/2,TY-4);
  }
}
function drawHandMode(){
  const hx=G.handX,hy=G.handY,t=G.frame*.05;
  ctx.strokeStyle=CY2+(0.42+Math.sin(t)*0.24)+')';ctx.lineWidth=1.2;
  ctx.setLineDash([4,6]);ctx.beginPath();ctx.rect(FX+BR,FY+BR,FW-BR*2,FH-BR*2);ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(hx,hy,BR+3+Math.sin(t*3)*1.5,0,Math.PI*2);
  ctx.strokeStyle=CY2+(0.5+Math.sin(t*3)*0.25)+')';ctx.lineWidth=1.5;ctx.stroke();
  const gg=ctx.createRadialGradient(hx-BR*.38,hy-BR*.4,BR*.04,hx+BR*.15,hy+BR*.15,BR*1.05);
  gg.addColorStop(0,'rgba(255,255,255,0.8)');gg.addColorStop(1,'rgba(180,180,210,0.45)');
  ctx.beginPath();ctx.arc(hx,hy,BR,0,Math.PI*2);ctx.fillStyle=gg;ctx.fill();
  ctx.fillStyle=CY;ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.fillText('[A] to place',hx,hy-BR-8);
}
function drawParts(){
  G.parts=G.parts.filter(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vx*=.88;p.vy*=.88;p.l-=0.025;p.rot+=p.rv;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.l;ctx.fillStyle=p.c;
    ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);ctx.globalAlpha=1;ctx.restore();
    return p.l>0;
  });
}
function drawFloats(){
  G.floats=G.floats.filter(function(f){
    f.y-=0.8;f.life-=0.015;if(f.life<=0)return false;
    ctx.globalAlpha=f.life;
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.text,f.x+1,f.y+1);
    ctx.fillStyle=CY;ctx.fillText(f.text,f.x,f.y);ctx.globalAlpha=1;return true;
  });
}
function drawOver(){
  if(confetti.length===0)spawnConfetti();
  confetti=confetti.filter(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.vx*=0.98;p.l-=0.008;p.rot+=p.rv;
    if(p.l<=0)return false;
    ctx.save();ctx.globalAlpha=p.l;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();return true;
  });
  rr(FX+16,FY+FH*.14,FW-32,FH*.56,13);
  const mg=ctx.createLinearGradient(FX+16,FY+FH*.14,FX+16,FY+FH*.7);
  mg.addColorStop(0,'rgba(8,5,1,0.97)');mg.addColorStop(1,'rgba(18,12,3,0.97)');
  ctx.fillStyle=mg;ctx.fill();
  const bc=G.winner===0?'rgba(212,175,55,0.9)':'rgba(249,115,22,0.9)';
  ctx.save();ctx.shadowColor=bc;ctx.shadowBlur=22;ctx.strokeStyle=bc;ctx.lineWidth=1.8;
  rr(FX+16,FY+FH*.14,FW-32,FH*.56,13);ctx.stroke();ctx.restore();
  ctx.font='32px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(G.winner===0?'🏆':'🎱',W/2,FY+FH*.28);
  ctx.save();
  const tg=ctx.createLinearGradient(W/2-60,0,W/2+60,0);
  tg.addColorStop(0,'#fff8dc');tg.addColorStop(.4,'#ffd700');tg.addColorStop(1,'#c8960a');
  ctx.shadowColor='rgba(212,175,55,0.8)';ctx.shadowBlur=18;
  ctx.fillStyle=tg;ctx.font='bold 28px Georgia,serif';ctx.textBaseline='middle';
  ctx.fillText(G.wMsg,W/2,FY+FH*.42);ctx.restore();
  const rl=ctx.createLinearGradient(FX+40,0,FR-40,0);
  rl.addColorStop(0,'transparent');rl.addColorStop(.5,'rgba(212,175,55,0.5)');rl.addColorStop(1,'transparent');
  ctx.fillStyle=rl;ctx.fillRect(FX+40,FY+FH*.5,FW-80,1);
  
  // Gold "Try Again" button
  const btnW=140,btnH=42,btnX=W/2-btnW/2,btnY=FY+FH*.56;
  const btnG=ctx.createLinearGradient(btnX,btnY,btnX,btnY+btnH);
  btnG.addColorStop(0,'rgba(212,175,55,0.9)');btnG.addColorStop(.5,'rgba(255,215,0,0.95)');btnG.addColorStop(1,'rgba(180,140,30,0.9)');
  ctx.save();ctx.shadowColor='rgba(255,215,0,0.8)';ctx.shadowBlur=15;
  rr(btnX,btnY,btnW,btnH,8);ctx.fillStyle=btnG;ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(255,240,180,0.9)';ctx.lineWidth=2;
  rr(btnX,btnY,btnW,btnH,8);ctx.stroke();
  ctx.fillStyle='#1a1205';ctx.font='bold 16px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('TRY AGAIN',W/2,btnY+btnH/2+1);
  
  ctx.fillStyle='rgba(212,175,55,0.5)';ctx.font='9px Georgia,serif';ctx.textBaseline='middle';
  ctx.fillText('Press [A] or [START]',W/2,btnY+btnH+18);
}

// ── KEYS ──────────────────────────────────────────────────
const keys={left:false,right:false,up:false,down:false,a:false};
let aPrev=false;
function onKey(e,down){
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(k==='ArrowLeft'||k==='Left')keys.left=down;
  if(k==='ArrowRight'||k==='Right')keys.right=down;
  if(k==='ArrowUp'||k==='Up')keys.up=down;
  if(k==='ArrowDown'||k==='Down')keys.down=down;
  if(k==='a'||k==='A')keys.a=down;
  if(!down)return;
  if(G.state==='over'&&(k==='Enter'||k==='a'||k==='A'||k===' ')){
    confetti=[];G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;return;
  }
  if(G.state==='menu'){
    const maxSel=MENU_BTNS[menuState].length-1;
    if(k==='ArrowRight'||k==='ArrowDown'){menuSel++;if(menuSel>maxSel)menuSel=0;}
    if(k==='ArrowLeft'||k==='ArrowUp'){menuSel--;if(menuSel<0)menuSel=maxSel;}
    if(k==='Enter'||k==='a'||k==='A')menuSelect();
    if(k==='b'||k==='B'||k==='Escape')menuBack();
  }
}
if(!isHB){
  [window,document,cvs].forEach(function(el){
    el.addEventListener('keydown',function(e){onKey(e,true);});
    el.addEventListener('keyup',function(e){onKey(e,false);});
  });
}

// ── MAIN LOOP ─────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  frameCount++;
  G.frame=(G.frame||0)+1;
  if(G.state==='menu'){
    menuFade=Math.max(0,Math.min(1,menuFade+menuFadeDir*0.07));
    if(menuFadeDir===-1&&menuFade<=0&&menuFadeCb){const cb=menuFadeCb;menuFadeCb=null;cb();}
    drawMenu();
    return;
  }
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='aim'&&isHuman){
    if(keys.left){G.ang-=0.012;lastDpadFrame=frameCount;}
    if(keys.right){G.ang+=0.012;lastDpadFrame=frameCount;}
    if(!G.charge){
      if(keys.up)spinY=Math.min(1,spinY+0.06);
      if(keys.down)spinY=Math.max(-1,spinY-0.06);
    }
    if(keys.a&&!G.charge){G.charge=true;G.pwr=0;}
    if(keys.a&&G.charge)G.pwr=Math.min(1,G.pwr+0.012);
    if(!keys.a&&aPrev&&G.charge){if(G.pwr>0.04)shoot();else{G.charge=false;G.pwr=0;}}
  }
  if(G.state==='hand'&&isHuman){
    const spd=2.5;
    if(keys.left)G.handX=Math.max(FX+BR+1,G.handX-spd);
    if(keys.right)G.handX=Math.min(FR-BR-1,G.handX+spd);
    if(keys.up)G.handY=Math.max(FY+BR+1,G.handY-spd);
    if(keys.down)G.handY=Math.min(FB-BR-1,G.handY+spd);
    if(keys.a&&!aPrev){
      const cb=G.balls.find(function(b){return b.id===0;});
      cb.pocketed=false;cb.vx=0;cb.vy=0;cb.x=G.handX;cb.y=G.handY;
      G.state='aim';G.potted=[];G.foul=false;
    }
  }
  aPrev=keys.a;
  // Removed 15-frame auto-reset timeout - was causing choppy input
  // Keys now only reset on BUTTON_RELEASE from HikariBoy
  if(G.state==='roll'){for(let i=0;i<4;i++)physStep();if(allStop())endTurn();}
  if(G.state==='aim'&&G.turn===1&&G.gameMode!=='2p'){G.aiDelay--;if(G.aiDelay<=0){computeAI();G.aiDelay=9999;}}
  if(G.state==='hand'&&G.turn===1&&G.gameMode!=='2p'){
    G.aiDelay--;
    if(G.aiDelay<=0){
      const cb=G.balls.find(function(b){return b.id===0;});
      cb.pocketed=false;cb.vx=0;cb.vy=0;
      cb.x=FX+FW*.28+Math.random()*FW*.44;cb.y=FY+FH*.55;
      G.state='aim';G.potted=[];G.foul=false;G.aiDelay=88;
    }
  }
  if(G.foulFlash>0)G.foulFlash=Math.max(0,G.foulFlash-0.04);
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(GX_OFF,Y_OFF);
  drawBg();
  let shook=false;
  if(G.st>0){ctx.save();ctx.translate(G.sx,G.sy);G.sx*=.6;G.sy*=.6;G.st--;shook=true;}
  drawTable();drawTurnSpotlight();drawParts();drawPocketGlows();
  if(G.state==='hand'&&isHuman)drawHandMode();
  if(G.state==='aim'&&isHuman)drawRealisticCue();
  G.balls.forEach(drawBallEnhanced);
  if(shook)ctx.restore();
  drawBallTray();drawHUD();drawPower();
  if(G.state==='aim'&&isHuman)drawCueBallHitSpot();
  drawFloats();
  if(G.foulFlash>0){
    ctx.fillStyle='rgba(220,30,30,'+(G.foulFlash*0.28)+')';
    ctx.fillRect(0,0,W,H);
    if(G.foulFlash>0.7){
      ctx.fillStyle='rgba(255,60,60,'+(G.foulFlash*0.9)+')';
      ctx.font='bold 28px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('SCRATCH!',W/2,H/2);
    }
  }
  if(G.state==='over')drawOver();
  ctx.restore();
}
requestAnimationFrame(loop);

// ── TOUCH / MOUSE ─────────────────────────────────────────
let pdn=false;
function getP(e){
  const r=cvs.getBoundingClientRect();
  const s=e.changedTouches?.[0]||e.touches?.[0]||e;
  return{x:(s.clientX-r.left)/scale,y:(s.clientY-r.top)/scale};
}
function aimTo(p){
  const cue=getCue();if(!cue)return;
  const dx=p.x-cue.x,dy=p.y-cue.y;
  if(dx*dx+dy*dy>64)G.ang=Math.atan2(dy,dx);
}
function onDown(e){
  e.preventDefault();initAudio();
  const p=getP(e);
  if(G.state==='over'){confetti=[];G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;return;}
  if(G.state==='menu'){
    if(menuFadeDir===-1)return;
    const mx=p.x,my=p.y-40;
    const btns=MENU_BTNS[menuState];
    if(menuState==='player'){
      const bw=160,bh=56,gap=20,by=H-180,sx=(W-(bw*2+gap))/2;
      btns.forEach(function(btn,i){const bx=sx+i*(bw+gap);if(mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh){menuSel=i;menuSelect();}});
    }else{
      const bw=130,bh=65,gap=15,by=H-180,sx=(W-(bw*3+gap*2))/2;
      btns.forEach(function(btn,i){const bx=sx+i*(bw+gap);if(mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh){menuSel=i;menuSelect();}});
    }
    return;
  }
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));return;}
  if(G.state!=='aim'||!isHuman)return;
  pdn=true;G.charge=true;G.pwr=0;aimTo(p);
}
function onMove(e){
  e.preventDefault();const p=getP(e);
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));return;}
  if(!pdn||G.state!=='aim'||!isHuman)return;
  aimTo(p);
}
function onUp(e){
  e.preventDefault();const p=getP(e);
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){
    G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));
    const cb=G.balls.find(function(b){return b.id===0;});
    cb.pocketed=false;cb.vx=0;cb.vy=0;cb.x=G.handX;cb.y=G.handY;
    G.state='aim';G.potted=[];G.foul=false;return;
  }
  if(!pdn)return;pdn=false;
  if(G.state==='aim'&&isHuman&&G.charge){if(G.pwr>0.04)shoot();else{G.charge=false;G.pwr=0;}}
}
cvs.addEventListener('mousedown',onDown);
cvs.addEventListener('mousemove',onMove);
cvs.addEventListener('mouseup',onUp);
cvs.addEventListener('touchstart',onDown,{passive:false});
cvs.addEventListener('touchmove',onMove,{passive:false});
cvs.addEventListener('touchend',onUp,{passive:false});
</script>
