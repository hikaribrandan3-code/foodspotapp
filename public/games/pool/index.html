(function buildCover(){
  const oc=document.createElement('canvas');oc.width=390;oc.height=520;
  const ox=oc.getContext('2d');

  // ── BG: deep navy-black ──
  const bg=ox.createLinearGradient(0,0,0,520);

  // Subtle ambient glow center
  const amb=ox.createRadialGradient(195,240,20,195,240,260);
  amb.addColorStop(0,'rgba(60,20,120,0.35)');amb.addColorStop(1,'transparent');
  ox.fillStyle=amb;ox.fillRect(0,0,390,520);

  // ── Overhead spotlight beam ──
  const spot=ox.createRadialGradient(195,80,5,195,240,280);
  spot.addColorStop(0,'rgba(255,240,180,0.18)');
  spot.addColorStop(.4,'rgba(200,160,80,0.06)');
  spot.addColorStop(1,'transparent');
  ox.fillStyle=spot;ox.fillRect(0,0,390,520);

  // ── TABLE (centered, top-down, pushed down to make room for title) ──
  // Table outer shadow
  ox.save();ox.shadowColor='rgba(0,0,0,0.8)';ox.shadowBlur=40;ox.shadowOffsetY=12;
  ox.fillStyle='#3a1a06';
  ox.beginPath();ox.roundRect(30,118,330,255,10);ox.fill();
  ox.restore();

  // Rail — rich walnut gradient
  const rail=ox.createLinearGradient(30,118,30,373);
  rail.addColorStop(0,'#7a3810');rail.addColorStop(.3,'#5a2808');rail.addColorStop(.7,'#4a2006');rail.addColorStop(1,'#3a1604');
  ox.fillStyle=rail;
  ox.beginPath();ox.roundRect(30,118,330,255,10);ox.fill();
  ox.fillStyle='rgba(255,200,100,0.12)';
  ox.beginPath();ox.roundRect(30,118,330,18,{upperLeft:10,upperRight:10,lowerLeft:0,lowerRight:0});ox.fill();
  ox.strokeStyle='rgba(0,0,0,0.5)';ox.lineWidth=3;
  ox.beginPath();ox.roundRect(52,136,286,219,4);ox.stroke();

  // Felt surface
  const felt=ox.createRadialGradient(195,244,10,195,244,180);
  felt.addColorStop(0,'#2a9455');felt.addColorStop(.5,'#1d7040');felt.addColorStop(1,'#0e3d20');
  ox.fillStyle=felt;ox.beginPath();ox.roundRect(52,136,286,219,4);ox.fill();

  // Felt cloth lines
  ox.save();ox.beginPath();ox.roundRect(52,136,286,219,4);ox.clip();
  ox.strokeStyle='rgba(255,255,255,0.018)';ox.lineWidth=1;
  for(let x=52;x<338;x+=12){ox.beginPath();ox.moveTo(x,136);ox.lineTo(x,355);ox.stroke();}
  for(let y=136;y<355;y+=12){ox.beginPath();ox.moveTo(52,y);ox.lineTo(338,y);ox.stroke();}
  ox.restore();

  // Center spot
  ox.beginPath();ox.arc(195,246,3,0,Math.PI*2);
  ox.fillStyle='rgba(255,255,255,0.15)';ox.fill();
  ox.strokeStyle='rgba(255,255,255,0.2)';ox.lineWidth=1;ox.stroke();

  // Head string line
  ox.strokeStyle='rgba(255,255,255,0.06)';ox.lineWidth=1;ox.setLineDash([4,6]);
  ox.beginPath();ox.moveTo(52,296);ox.lineTo(338,296);ox.stroke();ox.setLineDash([]);

  // Diamond markers
  ox.fillStyle='rgba(255,220,120,0.7)';
  [[195,130],[195,358],[42,246],[348,246],
   [122,130],[268,130],[122,358],[268,358],
   [42,193],[42,299],[348,193],[348,299]].forEach(([dx,dy])=>{
    ox.save();ox.translate(dx,dy);ox.rotate(Math.PI/4);ox.fillRect(-3,-3,6,6);ox.restore();
  });

  // Pockets
  [[52,136],[195,130],[338,136],[52,355],[195,361],[338,355]].forEach(([px,py])=>{
    const ps=ox.createRadialGradient(px,py,4,px,py,20);
    ps.addColorStop(0,'rgba(0,0,0,0.9)');ps.addColorStop(1,'transparent');
    ox.beginPath();ox.arc(px,py,20,0,Math.PI*2);ox.fillStyle=ps;ox.fill();
    ox.beginPath();ox.arc(px,py,14,0,Math.PI*2);ox.fillStyle='#050208';ox.fill();
    ox.strokeStyle='rgba(100,50,10,0.9)';ox.lineWidth=2.5;ox.stroke();
    ox.beginPath();ox.arc(px,py,8,0,Math.PI*2);ox.fillStyle='#000';ox.fill();
  });

  // ── Balls on felt (scattered, mid-game) ──
  function drawBall(ox,bx,by,bc,id,stripe){
    ox.beginPath();ox.arc(bx+2,by+3,10,0,Math.PI*2);ox.fillStyle='rgba(0,0,0,0.45)';ox.fill();
    ox.beginPath();ox.arc(bx,by,10,0,Math.PI*2);
    if(stripe){
      ox.fillStyle='#e8e8e8';ox.fill();
      ox.save();ox.beginPath();ox.arc(bx,by,10,0,Math.PI*2);ox.clip();
      ox.fillStyle=bc;ox.fillRect(bx-10,by-4.5,20,9);ox.restore();
    } else if(id===8){
      const g8=ox.createRadialGradient(bx-3,by-3,1,bx,by,10);
      g8.addColorStop(0,'#3a3050');g8.addColorStop(1,'#050208');ox.fillStyle=g8;ox.fill();
    } else {
      const gb=ox.createRadialGradient(bx-3,by-3,1,bx+2,by+2,10);
      gb.addColorStop(0,'rgba(255,255,255,0.35)');gb.addColorStop(.4,bc);gb.addColorStop(1,'rgba(0,0,0,0.45)');
      ox.fillStyle=gb;ox.fill();
    }
    // Number
    ox.beginPath();ox.arc(bx,by,4.5,0,Math.PI*2);ox.fillStyle='rgba(255,255,255,0.95)';ox.fill();
    ox.fillStyle='#111';ox.font=`bold ${id>9?'4.5':'5.5'}px Arial`;ox.textAlign='center';ox.textBaseline='middle';ox.fillText(id,bx,by+.5);
    // Specular
    ox.beginPath();ox.arc(bx-3,by-3,2.5,0,Math.PI*2);ox.fillStyle='rgba(255,255,255,0.55)';ox.fill();
  }
  const balls=[
    [155,198,'#f59e0b',1,false],[175,183,'#2563eb',2,false],[200,175,'#dc2626',3,false],
    [225,183,'#7c3aed',4,false],[245,198,'#ea580c',5,false],
    [195,295,'#111111',8,false],
    [145,268,'#f59e0b',9,true],[170,253,'#2563eb',10,true],
    [248,231,'#dc2626',11,true],[265,253,'#7c3aed',12,true],
    [240,273,'#ea580c',13,true],[115,231,'#16a34a',6,false],
    [280,213,'#db2877',7,false],
  ];
  balls.forEach(([bx,by,bc,id,s])=>drawBall(ox,bx,by,bc,id,s));

  // Cue stick
  ox.save();ox.translate(320,375);ox.rotate(-0.55);
  const cs=ox.createLinearGradient(-10,0,220,0);
  cs.addColorStop(0,'#f0d080');cs.addColorStop(.4,'#c08040');cs.addColorStop(.75,'#6a3018');cs.addColorStop(1,'#2a0c04');
  ox.fillStyle=cs;ox.beginPath();ox.moveTo(-10,-3.5);ox.lineTo(220,-2);ox.lineTo(220,2);ox.lineTo(-10,3.5);ox.closePath();ox.fill();
  ox.strokeStyle='rgba(0,0,0,0.2)';ox.lineWidth=0.8;ox.stroke();ox.restore();

  // ── Title: HIKARI BILLIARDS — top, large, gold casino ──
  // Top title bg
  ox.fillStyle='rgba(0,0,0,0.38)';
  ox.beginPath();ox.roundRect(20,10,350,90,10);ox.fill();

  // Ornamental thin rule top
  const ruleG=ox.createLinearGradient(60,18,330,18);
  ruleG.addColorStop(0,'transparent');ruleG.addColorStop(.2,'rgba(212,175,55,0.5)');
  ruleG.addColorStop(.5,'rgba(255,220,80,0.9)');ruleG.addColorStop(.8,'rgba(212,175,55,0.5)');ruleG.addColorStop(1,'transparent');
  ox.fillStyle=ruleG;ox.fillRect(60,20,270,1);

  // HIKARI — gold gradient, large serif
  ox.save();
  const tg1=ox.createLinearGradient(195,24,195,68);
  tg1.addColorStop(0,'#fff8dc');tg1.addColorStop(.3,'#ffd700');tg1.addColorStop(.6,'#d4a017');tg1.addColorStop(1,'#b8860b');
  ox.shadowColor='rgba(212,175,55,0.9)';ox.shadowBlur=28;
  ox.fillStyle=tg1;ox.font='bold 52px Georgia,serif';ox.textAlign='center';ox.textBaseline='alphabetic';
  ox.fillText("HIKARI'S",195,72);ox.restore();

  // BILLIARDS — spaced, smaller gold
  ox.save();
  const tg2=ox.createLinearGradient(195,75,195,94);
  tg2.addColorStop(0,'#ffe97d');tg2.addColorStop(.5,'#c8a020');tg2.addColorStop(1,'#8a6800');
  ox.shadowColor='rgba(200,160,20,0.7)';ox.shadowBlur=12;
  ox.fillStyle=tg2;ox.font='500 15px Georgia,serif';ox.textAlign='center';ox.textBaseline='alphabetic';
  ox.letterSpacing='7px';ox.fillText('BILLIARDS',195,92);ox.restore();

  // Ornamental thin rule bottom
  ox.fillStyle=ruleG;ox.fillRect(60,96,270,1);

  // Diamond ornament center bottom of title
  ox.save();ox.translate(195,103);ox.rotate(Math.PI/4);
  ox.fillStyle='rgba(212,175,55,0.7)';ox.fillRect(-4,-4,8,8);ox.restore();

  // Scanlines
  ox.fillStyle='rgba(0,0,0,0.09)';for(let y=0;y<520;y+=2) ox.fillRect(0,y,390,1);
  // Vignette
  const vig=ox.createRadialGradient(195,260,120,195,260,280);
  vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,0.6)');
  ox.fillStyle=vig;ox.fillRect(0,0,390,520);

  coverImg.src=oc.toDataURL();
})();

// ── AUDIO ─────────────────────────────────────────────────
let AC=null;
const PROG=[
  {b:[130.81,164.81,196.00,174.61],c:[329.63,392.00,493.88,440.00]},
  {b:[110.00,138.59,164.81,155.56],c:[261.63,329.63,392.00,369.99]},
  {b:[146.83,174.61,220.00,196.00],c:[293.66,369.99,440.00,415.30]},
  {b:[98.00,123.47,146.83,130.81], c:[246.94,311.13,369.99,349.23]},
  {b:[130.81,155.56,196.00,185.00],c:[329.63,415.30,493.88,466.16]},
  {b:[110.00,130.81,164.81,155.56],c:[261.63,349.23,392.00,440.00]},
  {b:[73.42,92.50,110.00,123.47],  c:[293.66,369.99,440.00,392.00]},
  {b:[98.00,116.54,130.81,146.83], c:[246.94,293.66,349.23,392.00]},
  {b:[164.81,185.00,220.00,207.65],c:[311.13,392.00,493.88,440.00]},
  {b:[110.00,138.59,164.81,155.56],c:[277.18,349.23,440.00,415.30]},
  {b:[146.83,164.81,196.00,220.00],c:[293.66,369.99,440.00,392.00]},
  {b:[98.00,116.54,138.59,155.56], c:[246.94,311.13,369.99,349.23]},
  {b:[123.47,138.59,155.56,146.83],c:[311.13,369.99,466.16,440.00]},
  {b:[116.54,130.81,164.81,155.56],c:[277.18,329.63,415.30,466.16]},
  {b:[110.00,130.81,164.81,138.59],c:[261.63,329.63,415.30,392.00]},
  {b:[98.00,110.00,130.81,123.47], c:[246.94,293.66,369.99,415.30]},
];
const BPM=82,BEAT=60/BPM;
let jBar=0,jBt=0,jNext=0;
function initAudio(){
  if(AC) return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();jNext=AC.currentTime+0.08;schedJazz();}catch(e){}
}
function schedJazz(){
  if(!AC) return;
  while(jNext<AC.currentTime+0.55){
    const bar=PROG[jBar%PROG.length];
    playJazzBeat(bar,jBt,jNext);
    jNext+=BEAT;jBt++;
    if(jBt>=4){jBt=0;jBar=(jBar+1)%PROG.length;}
  }
  setTimeout(schedJazz,160);
}
function playJazzBeat(bar,bt,t){
  bassNote(bt===3?bar.b[bt]*Math.pow(2,1/12):bar.b[bt],t);
  if(bt===0){pianoNote(bar.c[1],t,0.055);pianoNote(bar.c[3],t+0.012,0.042);}
  else if(bt===1){pianoNote(bar.c[2],t+BEAT*0.62,0.038);}
  else if(bt===2){pianoNote(bar.c[0],t,0.048);pianoNote(bar.c[2],t+0.018,0.044);pianoNote(bar.c[3],t+0.030,0.038);}
  else{pianoNote(bar.c[3],t,0.032);}
  hihat(t,0.55,bt===1||bt===3);hihat(t+BEAT*0.63,0.30,false);
  if(bt===0) kick(t,0.55);if(bt===2) kick(t,0.20);
  if(bt===1||bt===3) brush(t);
  ride(t);
}
function bassNote(freq,t){
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  o.type='triangle';o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(0.20,t+0.018);
  g.gain.exponentialRampToValueAtTime(0.09,t+BEAT*0.55);g.gain.exponentialRampToValueAtTime(0.001,t+BEAT*0.82);
  o.start(t);o.stop(t+BEAT*0.88);
}
function pianoNote(freq,t,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(vol,t+0.016);
  g.gain.exponentialRampToValueAtTime(vol*0.45,t+0.10);g.gain.exponentialRampToValueAtTime(0.001,t+BEAT*1.7);
  o.start(t);o.stop(t+BEAT*1.8);
}
function hihat(t,vol,accent){
  const sr=AC.sampleRate,dur=accent?0.058:0.030,frames=Math.floor(sr*dur);
  const buf=AC.createBuffer(1,frames,sr),d=buf.getChannelData(0);
  for(let i=0;i<frames;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/frames,1.6);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();
  s.buffer=buf;f.type='highpass';f.frequency.value=9000;
  s.connect(f);f.connect(gg);gg.connect(AC.destination);gg.gain.value=(accent?0.10:0.056)*vol;s.start(t);
}
function kick(t,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';
  o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(38,t+0.09);
  g.gain.setValueAtTime(vol*0.55,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.20);o.start(t);o.stop(t+0.22);
}
function brush(t){
  const sr=AC.sampleRate,frames=Math.floor(sr*0.14),buf=AC.createBuffer(1,frames,sr),d=buf.getChannelData(0);
  for(let i=0;i<frames;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/frames)*Math.pow(1-i/frames,0.6);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();
  s.buffer=buf;f.type='bandpass';f.frequency.value=3200;f.Q.value=0.7;
  s.connect(f);f.connect(gg);gg.connect(AC.destination);gg.gain.value=0.065;s.start(t);
}
function ride(t){
  const sr=AC.sampleRate,frames=Math.floor(sr*0.30),buf=AC.createBuffer(1,frames,sr),d=buf.getChannelData(0);
  for(let i=0;i<frames;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/frames,2.2);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();
  s.buffer=buf;f.type='highpass';f.frequency.value=5800;
  s.connect(f);f.connect(gg);gg.connect(AC.destination);gg.gain.value=0.018;s.start(t);
}
function sndHit(v){
  if(!AC||v<0.8) return;
  const t=AC.currentTime,vol=Math.min(0.5,v*0.062);
  const o1=AC.createOscillator(),g1=AC.createGain();o1.connect(g1);g1.connect(AC.destination);o1.type='sine';
  o1.frequency.setValueAtTime(1800+v*120,t);o1.frequency.exponentialRampToValueAtTime(320,t+0.035);
  g1.gain.setValueAtTime(vol,t);g1.gain.exponentialRampToValueAtTime(0.001,t+0.055);o1.start(t);o1.stop(t+0.06);
  const o2=AC.createOscillator(),g2=AC.createGain();o2.connect(g2);g2.connect(AC.destination);o2.type='triangle';
  o2.frequency.setValueAtTime(520+v*60,t);o2.frequency.exponentialRampToValueAtTime(110,t+0.08);
  g2.gain.setValueAtTime(vol*0.7,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.1);o2.start(t);o2.stop(t+0.11);
}
function sndPocket(){
  if(!AC) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type='sine';
  o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(55,t+0.3);
  g.gain.setValueAtTime(0.26,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.38);o.start(t);o.stop(t+0.42);
}

// ── GAME STATE ────────────────────────────────────────────
let G={state:'menu',frame:0};
function newGame(){
  const balls=[{id:0,x:FX+FW/2,y:FY+FH*.73,vx:0,vy:0,angle:0,pocketed:false}];
  const cx=FX+FW/2,cy=FY+FH*.27,d=BR*2+1.3;let ri=0;
  for(let r=0;r<5;r++) for(let c=0;c<=r;c++)
    balls.push({id:RACK[ri++],x:cx+(c-r/2)*d,y:cy+r*d*0.866,vx:0,vy:0,angle:0,pocketed:false});
  G={state:'aim',balls,floats:[],parts:[],pocketGlows:[],
     ang:Math.PI,pwr:0,charge:false,
     turn:0,grp:[null,null],potted:[],foul:false,
     hand:false,handX:FX+FW/2,handY:FY+FH*.73,
     winner:-1,wMsg:'',sx:0,sy:0,st:0,
     msg:'',msgT:0,aiDelay:9999,frame:0,gameMode};
}

// ── HIKARIBEOY ────────────────────────────────────────────
const isHB=window.parent!==window;
if(isHB) setTimeout(()=>{menuState='player';menuSel=0;},300);
function exitGame(){window.parent.postMessage({type:'GAME_EXIT',gameId:'pool'},'*');}
window.addEventListener('message',ev=>{
  if(ev.data?.type!=='BUTTON_PRESS') return;
  const b=ev.data.button;
  if(b==='select') exitGame();
  if(b==='start'){if(G.state==='menu') menuSelect(); else startGame();}
  if(b==='dpad-left'||b==='dpad-up'){
    if(G.state==='menu'&&menuFadeDir!==-1){menuSel--;if(menuSel<0) menuSel=MENU_BTNS[menuState].length-1;}
    else if(b==='dpad-left'){keys.left=true;setTimeout(()=>keys.left=false,80);}
    else{keys.up=true;setTimeout(()=>keys.up=false,80);}
  }
  if(b==='dpad-right'||b==='dpad-down'){
    if(G.state==='menu'&&menuFadeDir!==-1){menuSel++;if(menuSel>MENU_BTNS[menuState].length-1) menuSel=0;}
    else if(b==='dpad-right'){keys.right=true;setTimeout(()=>keys.right=false,80);}
    else{keys.down=true;setTimeout(()=>keys.down=false,80);}
  }
  if(b==='a'){
    if(G.state==='menu') menuSelect();
    else{keys.a=true;setTimeout(()=>{keys.a=false;},120);}
  }
});

function startGame(){newGame();initAudio();}

// ── MENU HELPERS ──────────────────────────────────────────
function menuFadeTransition(cb){
  menuFadeDir=-1;
  menuFadeCb=()=>{menuFade=0;menuFadeDir=1;if(cb) cb();};
}
function menuSelect(){
  if(menuFadeDir===-1) return; // already transitioning
  initAudio();
  if(menuState==='player'){
    if(menuSel===1){gameMode='2p';menuFadeTransition(startGame);}
    else{menuFadeTransition(()=>{menuState='difficulty';menuSel=0;});}
  } else {
    gameMode=['1p-easy','1p-medium','1p-hard'][menuSel];
    menuFadeTransition(startGame);
  }
}
function menuBack(){
  if(menuState==='difficulty') menuFadeTransition(()=>{menuState='player';menuSel=0;});
}

function dk(h,a=60){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.max(0,r-a)},${Math.max(0,g-a)},${Math.max(0,b-a)})`;}

// ── PHYSICS ───────────────────────────────────────────────
const getCue=()=>G.balls&&G.balls.find(b=>b.id===0&&!b.pocketed);
const allStop=()=>G.balls.every(b=>b.pocketed||Math.hypot(b.vx,b.vy)<0.07);

function physStep(){
  const act=G.balls.filter(b=>!b.pocketed);
  for(const b of act){
    b.vx*=0.978;b.vy*=0.978;
    if(Math.abs(b.vx)<0.06) b.vx=0;if(Math.abs(b.vy)<0.06) b.vy=0;
    b.x+=b.vx;b.y+=b.vy;
    const spd=Math.hypot(b.vx,b.vy);if(spd>0.06) b.angle+=spd/BR;
    pocketCheck(b);if(!b.pocketed) wallBounce(b);
  }
  for(let p=0;p<2;p++) for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++)
    if(!act[i].pocketed&&!act[j].pocketed) ballCollide(act[i],act[j]);
}
function wallBounce(b){
  if(PKS.some(p=>Math.hypot(b.x-p.x,b.y-p.y)<PR+BR+2)) return;
  const e=0.76;
  if(b.x-BR<FX&&b.vx<0){b.x=FX+BR;b.vx*=-e;doShake(Math.abs(b.vx));}
  if(b.x+BR>FR&&b.vx>0){b.x=FR-BR;b.vx*=-e;doShake(Math.abs(b.vx));}
  if(b.y-BR<FY&&b.vy<0){b.y=FY+BR;b.vy*=-e;doShake(Math.abs(b.vy));}
  if(b.y+BR>FB&&b.vy>0){b.y=FB-BR;b.vy*=-e;doShake(Math.abs(b.vy));}
}
function ballCollide(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,mn=BR*2;
  if(d2>=mn*mn||d2<0.01) return;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
  const dv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(dv<=0) return;
  a.vx-=dv*nx;a.vy-=dv*ny;b.vx+=dv*nx;b.vy+=dv*ny;
  const ov=(mn-d)*0.5+0.1;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
  sndHit(Math.abs(dv));doShake(Math.abs(dv)*0.38);
}
function pocketCheck(b){
  if(b.pocketed) return;
  for(const p of PKS){
    if((b.x-p.x)**2+(b.y-p.y)**2<PR*PR){
      b.pocketed=true;b.vx=0;b.vy=0;spawnParts(b.x,b.y,CLR[b.id]);sndPocket();
      G.pocketGlows.push({x:p.x,y:p.y,r:PR,life:1});
      G.potted.push(b.id);
      if(b.id===0) G.foul=true;
      else G.floats.push({x:b.x,y:b.y-10,text:CMTS[Math.floor(Math.random()*CMTS.length)],life:1});
      return;
    }
  }
}
function doShake(v){if(v>2){G.sx=(Math.random()-.5)*Math.min(v*.5,3.5);G.sy=(Math.random()-.5)*Math.min(v*.5,3.5);G.st=4;}}
function spawnParts(x,y,c){
  for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2,s=Math.random()*6+1;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c,r:Math.random()*3+.8,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*0.4});}
}

// ── AI ────────────────────────────────────────────────────
function computeAI(){
  const cue=getCue();if(!cue) return;
  const mg=G.grp[1];
  let tgts=G.balls.filter(b=>!b.pocketed&&b.id!==0&&b.id!==8);
  if(mg==='solid') tgts=tgts.filter(b=>b.id>=1&&b.id<=7);
  else if(mg==='stripe') tgts=tgts.filter(b=>b.id>=9&&b.id<=15);
  if(mg&&!tgts.length){const b8=G.balls.find(b=>b.id===8&&!b.pocketed);if(b8) tgts=[b8];}
  if(!tgts.length) tgts=G.balls.filter(b=>!b.pocketed&&b.id!==0);
  if(!tgts.length) return;
  let best=null,bs=-Infinity;
  for(const ball of tgts) for(const pkt of PKS){
    const dx=pkt.x-ball.x,dy=pkt.y-ball.y,dist=Math.hypot(dx,dy);if(dist<1) continue;
    const nx=dx/dist,ny=dy/dist,gx=ball.x-nx*BR*2,gy=ball.y-ny*BR*2;
    const cd=Math.hypot(gx-cue.x,gy-cue.y),score=600/(cd+dist+80);
    if(score>bs){bs=score;best={ang:Math.atan2(gy-cue.y,gx-cue.x)};}
  }
  if(!best) return;
  // Difficulty affects accuracy
  const err=G.gameMode==='1p-easy'?0.45:G.gameMode==='1p-medium'?0.22:0.06;
  const pwrMin=G.gameMode==='1p-easy'?0.3:0.42;
  G.ang=best.ang+(Math.random()-.5)*err;G.pwr=pwrMin+Math.random()*0.5;shoot();
}

// ── RULES ─────────────────────────────────────────────────
function shoot(){
  const cue=getCue();if(!cue) return;
  cue.vx=Math.cos(G.ang)*G.pwr*21;
  cue.vy=Math.sin(G.ang)*G.pwr*21;
  // Apply spin as perpendicular English offset
  const perp=Math.PI/2;
  cue.vx+=Math.cos(G.ang+perp)*spinY*G.pwr*4.5;
  cue.vy+=Math.sin(G.ang+perp)*spinY*G.pwr*4.5;
  spinY=0;
  G.pwr=0;G.charge=false;G.potted=[];G.foul=false;G.state='roll';
}
function endTurn(){
  const pot=G.potted,p8=pot.includes(8),pCue=pot.includes(0)||G.foul;
  const pNum=pot.filter(id=>id!==0&&id!==8);
  if(!G.grp[0]&&pNum.length&&!p8){
    const sol=pNum.some(id=>id>=1&&id<=7),str=pNum.some(id=>id>=9&&id<=15);
    if(sol&&!str){G.grp[G.turn]='solid';G.grp[1-G.turn]='stripe';showMsg(G.turn,'SOLIDS 🟡');}
    else if(str&&!sol){G.grp[G.turn]='stripe';G.grp[1-G.turn]='solid';showMsg(G.turn,'STRIPES 🔵');}
  }
  if(p8){
    const mg=G.grp[G.turn];
    const myIds=mg==='solid'?[1,2,3,4,5,6,7]:mg==='stripe'?[9,10,11,12,13,14,15]:[];
    const cleared=mg&&myIds.every(id=>G.balls.find(b=>b.id===id)?.pocketed);
    G.winner=(!pCue&&cleared&&mg)?G.turn:1-G.turn;
    G.wMsg=G.winner===0?'P1 Wins! 🎱':(G.gameMode==='2p'?'P2 Wins! 🎱':'CPU Wins! 🤖');
    G.state='over';return;
  }
  if(pCue){
    G.turn=1-G.turn;showMsg(G.turn,'SCRATCH! Ball in hand');
    G.hand=true;G.handX=FX+FW/2;G.handY=FY+FH*.73;
    G.state='hand';if(G.turn===1&&G.gameMode!=='2p') G.aiDelay=80;return;
  }
  const mg=G.grp[G.turn];
  const own=pNum.length&&(!mg||pNum.some(id=>mg==='solid'?id>=1&&id<=7:id>=9&&id<=15));
  if(!own) G.turn=1-G.turn;
  G.potted=[];G.foul=false;G.state='aim';
  if(G.turn===1&&G.gameMode!=='2p') G.aiDelay=85;
}
function showMsg(p,txt){G.msg=`P${p+1}: ${txt}`;G.msgT=140;}

function getGhost(){
  const cue=getCue();if(!cue) return null;
  const dx=Math.cos(G.ang),dy=Math.sin(G.ang);
  let minT=Infinity,hit=null;
  for(const b of G.balls){
    if(b.pocketed||b.id===0) continue;
    const ex=cue.x-b.x,ey=cue.y-b.y,bq=2*(ex*dx+ey*dy),cq=ex*ex+ey*ey-(BR*2)**2;
    const disc=bq*bq-4*cq;if(disc<0) continue;
    const t=(-bq-Math.sqrt(disc))/2;if(t>0.5&&t<minT){minT=t;hit=b;}
  }
  return hit?{gx:cue.x+dx*minT,gy:cue.y+dy*minT,ball:hit}:null;
}

function drawBallEnhanced(b){

  // Base

  else{gr.addColorStop(0,hl(c,80));gr.addColorStop(.45,c);gr.addColorStop(1,dk(c,65));}
  ctx.fillStyle=gr;ctx.fillRect(x-BR,y-BR,BR*2,BR*2);

    ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(-BR,-BR,BR*2,BR*.5);
    ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(-BR,BR*.5,BR*2,BR*.5);

  // Overlay shading

  shg.addColorStop(0,'rgba(255,255,255,0.92)');shg.addColorStop(.5,'rgba(255,255,255,0.28)');shg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(x-BR*.3,y-BR*.35,BR*.28,0,Math.PI*2);ctx.fillStyle=shg;ctx.fill();
  // Rim light (bottom-right)

function drawCueBallHitSpot(){

  ctx.fillText('ENGLISH',mx,my-r-5);

      ctx.beginPath();ctx.moveTo(bx+2.5,by-2.5);ctx.lineTo(bx-2.5,by+2.5);ctx.stroke();
    } else {
      ctx.save();ctx.beginPath();ctx.arc(bx,by,sr,0,Math.PI*2);ctx.clip();
      ctx.fillStyle='#d8e0e8';ctx.fillRect(bx-sr,by-sr,sr*2,sr*2);ctx.fillStyle=CLR[id];ctx.fillRect(bx-sr,by-sr*.45,sr*2,sr*.9);ctx.restore();
      ctx.beginPath();ctx.arc(bx,by,sr,0,Math.PI*2);
      const hl2=G.grp[1]==='stripe';ctx.strokeStyle=hl2?CY2+'0.65)':'rgba(255,255,255,0.1)';ctx.lineWidth=hl2?1.8:.7;ctx.stroke();
    }
  });
  const ly=ty+sr*2+10;
  ctx.font='bold 8px Arial';ctx.textBaseline='top';
  const p0act=G.turn===0&&G.state!=='over',p1act=G.turn===1&&G.state!=='over';
  ctx.fillStyle=p0act?CY:'rgba(255,255,255,0.28)';ctx.textAlign='left';ctx.fillText('P1',FX+4,ly);
  if(G.grp[0]){ctx.fillStyle=CY2+'0.4)';ctx.font='7px Arial';ctx.fillText(G.grp[0].toUpperCase(),FX+20,ly);}
  ctx.font='bold 8px Arial';
  ctx.fillStyle=p1act?OR:'rgba(255,255,255,0.28)';ctx.textAlign='right';ctx.fillText(G.gameMode==='2p'?'P2':'CPU',FR-4,ly);
  if(G.grp[1]){ctx.fillStyle='rgba(249,115,22,0.4)';ctx.font='7px Arial';ctx.textAlign='right';ctx.fillText(G.grp[1].toUpperCase(),FR-20,ly);}
}
function drawHUD(){
  // ── Top bar — casino dark with gold accents ──
  const hg=ctx.createLinearGradient(0,0,0,62);
  hg.addColorStop(0,'rgba(8,5,2,0.99)');hg.addColorStop(.6,'rgba(18,12,4,0.97)');hg.addColorStop(1,'rgba(25,18,6,0.95)');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,62);

  // Subtle gold side borders
  ctx.fillStyle='rgba(212,175,55,0.18)';ctx.fillRect(0,0,2,62);ctx.fillRect(W-2,0,2,62);

  // Gold separator line
  const sep=ctx.createLinearGradient(0,0,W,0);
  sep.addColorStop(0,'transparent');sep.addColorStop(.15,'rgba(212,175,55,0.2)');
  sep.addColorStop(.5,'rgba(212,175,55,0.75)');sep.addColorStop(.85,'rgba(212,175,55,0.2)');sep.addColorStop(1,'transparent');
  ctx.fillStyle=sep;ctx.fillRect(0,61,W,1.2);

  // HIKARI POOL title — gold serif
  ctx.textAlign='center';
  ctx.save();
  const tg=ctx.createLinearGradient(W/2-50,4,W/2+50,22);
  tg.addColorStop(0,'#fff8dc');tg.addColorStop(.4,'#ffd700');tg.addColorStop(1,'#c8960a');
  ctx.shadowColor='rgba(212,175,55,0.7)';ctx.shadowBlur=14;
  ctx.fillStyle=tg;ctx.font='bold 15px Georgia,serif';ctx.textBaseline='alphabetic';
  ctx.fillText("HIKARI'S BILLIARDS",W/2,19);ctx.restore();

  // Subtitle
  ctx.fillStyle='rgba(212,175,55,0.38)';ctx.font='7px Georgia,serif';ctx.letterSpacing='3px';
  ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText('8 · B A L L',W/2,30);

  // Player avatars
  [0,1].forEach(p=>{
    const px=p===0?30:W-30,act=G.turn===p&&G.state!=='over';
    const pc=p===0?'#c084fc':'#f97316';
    const goldC='rgba(212,175,55,0.9)';
    // Active ring — gold
    if(act){
      ctx.save();ctx.shadowColor='rgba(212,175,55,0.7)';ctx.shadowBlur=12;
      ctx.beginPath();ctx.arc(px,37,19,0,Math.PI*2);
      ctx.strokeStyle=goldC;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    }
    // Avatar bg
    ctx.beginPath();ctx.arc(px,37,15,0,Math.PI*2);
    const ag=ctx.createRadialGradient(px-4,33,2,px,37,15);
    ag.addColorStop(0,act?'rgba(60,45,10,0.9)':'rgba(15,10,3,0.9)');
    ag.addColorStop(1,'rgba(5,3,1,0.95)');
    ctx.fillStyle=ag;ctx.fill();
    // Avatar border
    ctx.strokeStyle=act?'rgba(212,175,55,0.6)':'rgba(100,80,20,0.3)';ctx.lineWidth=1;ctx.stroke();
    // Label
    ctx.fillStyle=act?'#ffd700':'rgba(180,140,30,0.5)';
    ctx.font=`bold ${act?'8':'7.5'}px Georgia,serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p===0?'P1':(G.gameMode==='2p'?'P2':'CPU'),px,40);
    // Arrow indicator
    if(act){
      const dir=p===0?1:-1;
      ctx.save();ctx.shadowColor='rgba(212,175,55,0.8)';ctx.shadowBlur=6;
      ctx.fillStyle='rgba(212,175,55,0.85)';
      ctx.beginPath();ctx.moveTo(px+dir*22,37);ctx.lineTo(px+dir*27,34);ctx.lineTo(px+dir*27,40);ctx.closePath();ctx.fill();
      ctx.restore();
    }
  });

  const dots='.'.repeat(1+Math.floor(Date.now()/400)%3);
  let stat='';
  if(G.state==='aim'){const isH=G.turn===0||(G.gameMode==='2p'&&G.turn===1);stat=isH?'← → AIM  |  Hold [A] to charge':`CPU thinking${dots}`;}
  else if(G.state==='hand'){const isH=G.turn===0||(G.gameMode==='2p'&&G.turn===1);stat=isH?'D-Pad move  |  [A] place ball':`CPU placing${dots}`;}
  if(stat){ctx.fillStyle='rgba(212,175,55,0.32)';ctx.font='8px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(stat,W/2,56);}
  if(G.msgT>0){G.msgT--;ctx.fillStyle=`rgba(255,215,0,${Math.min(1,G.msgT/28)})`;ctx.font='bold 9px Georgia,serif';ctx.textAlign='center';ctx.fillText(G.msg,W/2,56);}
}
function drawHandMode(){
  const{handX:hx,handY:hy}=G,t=G.frame*.05;
  ctx.strokeStyle=CY2+(0.42+Math.sin(t)*0.24)+')';ctx.lineWidth=1.2;
  ctx.setLineDash([4,6]);ctx.beginPath();ctx.rect(FX+BR,FY+BR,FW-BR*2,FH-BR*2);ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(hx,hy,BR+3+Math.sin(t*3)*1.5,0,Math.PI*2);ctx.strokeStyle=CY2+(0.5+Math.sin(t*3)*0.25)+')';ctx.lineWidth=1.5;ctx.stroke();
  const gg=ctx.createRadialGradient(hx-BR*.38,hy-BR*.4,BR*.04,hx+BR*.15,hy+BR*.15,BR*1.05);
  gg.addColorStop(0,'rgba(255,255,255,0.8)');gg.addColorStop(1,'rgba(180,180,210,0.45)');
  ctx.beginPath();ctx.arc(hx,hy,BR,0,Math.PI*2);ctx.fillStyle=gg;ctx.fill();
  ctx.fillStyle=CY;ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.fillText('[A] to place',hx,hy-BR-8);
}
function drawParts(){
  G.parts=G.parts.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vx*=.88;p.vy*=.88;p.l-=0.025;p.rot+=p.rv;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);ctx.globalAlpha=1;ctx.restore();
    return p.l>0;
  });
}
function drawFloats(){
  G.floats=G.floats.filter(f=>{
    f.y-=0.8;f.life-=0.015;if(f.life<=0) return false;
    ctx.globalAlpha=f.life;ctx.fillStyle='rgba(0,0,0,0.55)';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.text,f.x+1,f.y+1);
    ctx.fillStyle=CY;ctx.fillText(f.text,f.x,f.y);ctx.globalAlpha=1;return true;
  });
}
function drawOver(){
  rr(FX+16,FY+FH*.17,FW-32,FH*.52,13);ctx.fillStyle='rgba(3,6,16,0.96)';ctx.fill();
  const bc=G.winner===0?CY:OR;
  ctx.save();ctx.shadowColor=bc;ctx.shadowBlur=18;ctx.strokeStyle=bc+'bb';ctx.lineWidth=2;rr(FX+16,FY+FH*.17,FW-32,FH*.52,13);ctx.stroke();ctx.restore();
  ctx.fillStyle=bc;ctx.font='bold 29px Arial';ctx.textAlign='center';ctx.fillText(G.wMsg,W/2,FY+FH*.38);
  ctx.fillStyle='rgba(255,255,255,0.42)';ctx.font='10px Arial';ctx.fillText('Tap or press [A] to continue',W/2,FY+FH*.53);
}

// ── KEYS ──────────────────────────────────────────────────
const keys={left:false,right:false,up:false,down:false,a:false};
let aPrev=false;
function onKey(e,down){
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();
  if(k==='ArrowLeft'||k==='Left') keys.left=down;
  if(k==='ArrowRight'||k==='Right') keys.right=down;
  if(k==='ArrowUp'||k==='Up') keys.up=down;
  if(k==='ArrowDown'||k==='Down') keys.down=down;
  if(k==='a'||k==='A') keys.a=down;
  if(!down) return;
  // Over screen → back to menu
  if(G.state==='over'&&(k==='Enter'||k==='a'||k==='A'||k===' ')){
    confetti=[];G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;return;
  }
  // Menu navigation
  if(G.state==='menu'){
    if(menuFadeDir===-1) return; // ignore taps during transition
    const maxSel=MENU_BTNS[menuState].length-1;
    if(k==='ArrowRight'||k==='ArrowDown'){menuSel=menuSel+1;if(menuSel>maxSel) menuSel=0;}
    if(k==='ArrowLeft'||k==='ArrowUp'){menuSel=menuSel-1;if(menuSel<0) menuSel=maxSel;}
    if(k==='Enter'||k==='a'||k==='A') menuSelect();
    if(k==='b'||k==='B'||k==='Escape') menuBack();
  }
}
[window,document,cvs].forEach(el=>{el.addEventListener('keydown',e=>onKey(e,true));el.addEventListener('keyup',e=>onKey(e,false));});

// ── MAIN LOOP ─────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  frameCount++;
  G.frame=(G.frame||0)+1;

  // Menu
  if(G.state==='menu'){
    menuFade=Math.max(0,Math.min(1,menuFade+menuFadeDir*0.07));
    if(menuFadeDir===-1&&menuFade<=0&&menuFadeCb){const cb=menuFadeCb;menuFadeCb=null;cb();}
    drawMenu();return;
  }

  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);

  if(G.state==='aim'&&isHuman){
    if(keys.left)  G.ang-=0.008;
    if(keys.right) G.ang+=0.008;
    if(!G.charge){
      if(keys.up)   spinY=Math.min(1,spinY+0.06);
      if(keys.down) spinY=Math.max(-1,spinY-0.06);
    }
    if(keys.a&&!G.charge){G.charge=true;G.pwr=0;}
    if(keys.a&&G.charge) G.pwr=Math.min(1,G.pwr+0.012);
    if(!keys.a&&aPrev&&G.charge){if(G.pwr>0.04) shoot();else{G.charge=false;G.pwr=0;}}
  }
  if(G.state==='hand'&&isHuman){
    const spd=2.5;
    if(keys.left)  G.handX=Math.max(FX+BR+1,G.handX-spd);
    if(keys.right) G.handX=Math.min(FR-BR-1,G.handX+spd);
    if(keys.up)    G.handY=Math.max(FY+BR+1,G.handY-spd);
    if(keys.down)  G.handY=Math.min(FB-BR-1,G.handY+spd);
    if(keys.a&&!aPrev){
      const cb=G.balls.find(b=>b.id===0);cb.pocketed=false;cb.vx=0;cb.vy=0;cb.x=G.handX;cb.y=G.handY;
      G.state='aim';G.potted=[];G.foul=false;
    }
  }
  aPrev=keys.a;

  if(G.state==='roll'){for(let i=0;i<4;i++) physStep();if(allStop()) endTurn();}
  if(G.state==='aim'&&G.turn===1&&G.gameMode!=='2p'){G.aiDelay--;if(G.aiDelay<=0){computeAI();G.aiDelay=9999;}}
  if(G.state==='hand'&&G.turn===1&&G.gameMode!=='2p'){
    G.aiDelay--;if(G.aiDelay<=0){
      const cb=G.balls.find(b=>b.id===0);cb.pocketed=false;cb.vx=0;cb.vy=0;
      cb.x=FX+FW*.28+Math.random()*FW*.44;cb.y=FY+FH*.7;
      G.state='aim';G.potted=[];G.foul=false;G.aiDelay=88;
    }
  }

  // Render
  ctx.clearRect(0,0,W,H);
  drawBg();
  let shook=false;
  if(G.st>0){ctx.save();ctx.translate(G.sx,G.sy);G.sx*=.6;G.sy*=.6;G.st--;shook=true;}
  drawTable();drawTurnSpotlight();drawParts();drawPocketGlows();
  if(G.state==='hand'&&isHuman) drawHandMode();
  if(G.state==='aim'&&isHuman) drawRealisticCue();
  G.balls.forEach(drawBallEnhanced);
  if(shook) ctx.restore();
  drawBallTray();drawHUD();drawPower();
  if(G.state==='aim'&&isHuman) drawCueBallHitSpot();
  drawFloats();
  if(G.state==='over') drawOver();
}
requestAnimationFrame(loop);

// ── TOUCH / MOUSE ─────────────────────────────────────────
let pdn=false;
function getP(e){const r=cvs.getBoundingClientRect();const s=e.changedTouches?.[0]||e.touches?.[0]||e;return{x:(s.clientX-r.left)/scale,y:(s.clientY-r.top)/scale};}
function aimTo(p){const cue=getCue();if(!cue) return;const dx=p.x-cue.x,dy=p.y-cue.y;if(dx*dx+dy*dy>64) G.ang=Math.atan2(dy,dx);}

function onDown(e){
  e.preventDefault();initAudio();
  const p=getP(e);
  if(G.state==='over'){G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;return;}
  if(G.state==='menu'){
    const btns=MENU_BTNS[menuState];
    if(menuState==='player'){
      const bw=148,bh=52,gap=18,by=H-165,sx=(W-(bw*2+gap))/2;
      btns.forEach((btn,i)=>{const bx=sx+i*(bw+gap);if(p.x>=bx&&p.x<=bx+bw&&p.y>=by&&p.y<=by+bh){menuSel=i;menuSelect();}});
    } else {
      const bw=100,bh=48,gap=10,by=H-158,sx=(W-(bw*3+gap*2))/2;
      btns.forEach((btn,i)=>{const bx=sx+i*(bw+gap);if(p.x>=bx&&p.x<=bx+bw&&p.y>=by&&p.y<=by+bh){menuSel=i;menuSelect();}});
      if(p.y<H-180) menuBack();
    }
    return;
  }
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));return;}
  if(G.state!=='aim'||!isHuman) return;
  pdn=true;G.charge=true;G.pwr=0;aimTo(p);
}
function onMove(e){
  e.preventDefault();const p=getP(e);
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));return;}
  if(!pdn||G.state!=='aim'||!isHuman) return;
  aimTo(p);
}
function onUp(e){
  e.preventDefault();const p=getP(e);
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){
    G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));
    const cb=G.balls.find(b=>b.id===0);cb.pocketed=false;cb.vx=0;cb.vy=0;cb.x=G.handX;cb.y=G.handY;
    G.state='aim';G.potted=[];G.foul=false;return;
  }
  if(!pdn) return;pdn=false;
  if(G.state==='aim'&&isHuman&&G.charge){if(G.pwr>0.04) shoot();else{G.charge=false;G.pwr=0;}}
}
cvs.addEventListener('mousedown',onDown);
cvs.addEventListener('mousemove',onMove);
cvs.addEventListener('mouseup',onUp);
cvs.addEventListener('touchstart',onDown,{passive:false});
cvs.addEventListener('touchmove',onMove,{passive:false});
cvs.addEventListener('touchend',onUp,{passive:false});
</script>
