  {x:FX+2,y:FY+2},{x:FX+FW/2,y:FY-1},{x:FR-2,y:FY+2},
  {x:FX+2,y:FB-2},{x:FX+FW/2,y:FB+1},{x:FR-2,y:FB-2}
];

// ── AUDIO STUBS ──────────────────────────────────────────
function initAudio(){}
function sndHit(impact){}
function sndPocket(){}
function sndScratch(){}

// ── MUSIC (MP3) ──
const bgMusic=new Audio('music.mp3');
bgMusic.loop=true; bgMusic.volume=0.55;
function updateMusic(){
  if(G.state==='menu'||G.state==='over'){
    if(!bgMusic.paused){bgMusic.pause();}
  }else{
    if(bgMusic.paused){bgMusic.play().catch(function(){});}
  }
}

// ── HAPTICS ──
const Haptics={
  lastFrame:0,minGap:4,
  _now(){return typeof frameCount!=='undefined'?frameCount:0;},
  canFire(){return this._now()-this.lastFrame>=this.minGap;},
  fire(pat,force){
    if(!navigator.vibrate)return;
    if(!force&&!this.canFire())return;
    this.lastFrame=this._now();
    try{navigator.vibrate(pat);}catch(e){}
  },
  shot:20,pocket:25,scratch:40,turnFoul:25,menu:15,
  win:[30,15,30,15,60],loss:[50,30,50,30,100],
  collision(impact){return Math.min(30,Math.max(8,Math.round(impact*1.8)));},
  rail(vel){return Math.min(15,Math.max(8,Math.round(vel*2)));}
};

// ── FELT TEXTURE ──────────────────────────────────────────
const feltPC=document.createElement('canvas');
feltPC.width=8; feltPC.height=8;
(()=>{
  const fx=feltPC.getContext('2d');

let feltPattern=null;

let menuState='player', menuSel=0, menuFade=1, menuFadeDir=1, menuFadeCb=null;

const coverImg=new Image();

  [[195,160],[195,388],[42,276],[348,276],[122,160],[268,160],[122,388],[268,388],[42,223],[42,329],[348,223],[348,329]].forEach(([dx,dy])=>{
    ox.save();ox.translate(dx,dy);ox.rotate(Math.PI/4);ox.fillRect(-3,-3,6,6);ox.restore();

    const ps=ox.createRadialGradient(px,py,4,px,py,20);

    else{const gb=ox.createRadialGradient(bx-3,by-3,1,bx+2,by+2,10);gb.addColorStop(0,'rgba(255,255,255,0.35)');gb.addColorStop(.4,bc);gb.addColorStop(1,'rgba(0,0,0,0.45)');ox.fillStyle=gb;ox.fill();}
    ox.beginPath();ox.arc(bx,by,4.5,0,Math.PI*2);ox.fillStyle='rgba(255,255,255,0.95)';ox.fill();
    ox.fillStyle='#111';ox.font=`bold ${id>9?'4.5':'5.5'}px Arial`;ox.textAlign='center';ox.textBaseline='middle';ox.fillText(id,bx,by+.5);
    ox.beginPath();ox.arc(bx-3,by-3,2.5,0,Math.PI*2);ox.fillStyle='rgba(255,255,255,0.55)';ox.fill();
  }
  [[155,228,'#f59e0b',1,false],[175,213,'#2563eb',2,false],[200,205,'#dc2626',3,false],
   [225,213,'#7c3aed',4,false],[245,228,'#ea580c',5,false],[195,325,'#111111',8,false],
   [145,298,'#f59e0b',9,true],[170,283,'#2563eb',10,true],[248,261,'#dc2626',11,true],
   [265,283,'#7c3aed',12,true],[240,303,'#ea580c',13,true],[115,261,'#16a34a',6,false],[280,243,'#db2877',7,false]
  ].forEach(([bx,by,bc,id,s])=>cvBall(ox,bx,by,bc,id,s));
  ox.save();ox.translate(320,405);ox.rotate(-0.55);
  const cs=ox.createLinearGradient(-10,0,220,0);
  cs.addColorStop(0,'#f0d080');cs.addColorStop(.4,'#c08040');cs.addColorStop(.75,'#6a3018');cs.addColorStop(1,'#2a0c04');
  ox.fillStyle=cs;ox.beginPath();ox.moveTo(-10,-3.5);ox.lineTo(220,-2);ox.lineTo(220,2);ox.lineTo(-10,3.5);ox.closePath();ox.fill();
  ox.restore();
  ox.fillStyle='rgba(0,0,0,0.42)'; ox.beginPath(); ox.roundRect(20,14,350,90,10); ox.fill();
  const rg=ox.createLinearGradient(60,22,330,22);
  rg.addColorStop(0,'transparent');rg.addColorStop(.2,'rgba(212,175,55,0.5)');rg.addColorStop(.5,'rgba(255,220,80,0.9)');rg.addColorStop(.8,'rgba(212,175,55,0.5)');rg.addColorStop(1,'transparent');
  ox.fillStyle=rg; ox.fillRect(60,24,270,1);
  ox.save();
  const tg1=ox.createLinearGradient(195,28,195,72);
  tg1.addColorStop(0,'#fff8dc');tg1.addColorStop(.3,'#ffd700');tg1.addColorStop(.6,'#d4a017');tg1.addColorStop(1,'#b8860b');
  ox.shadowColor='rgba(212,175,55,0.95)';ox.shadowBlur=42;
  ox.fillStyle=tg1;ox.font='bold 52px Georgia,serif';ox.textAlign='center';ox.textBaseline='alphabetic';
  ox.fillText("HIKARI'S",195,76);ox.restore();
  ox.save();
  const tg2=ox.createLinearGradient(195,79,195,96);
  tg2.addColorStop(0,'#ffe97d');tg2.addColorStop(.5,'#c8a020');tg2.addColorStop(1,'#8a6800');
  ox.shadowColor='rgba(200,160,20,0.85)';ox.shadowBlur=22;
  ox.fillStyle=tg2;ox.font='500 15px Georgia,serif';ox.textAlign='center';ox.textBaseline='alphabetic';
  ox.fillText('BILLIARDS',195,96);ox.restore();
  ox.fillStyle=rg; ox.fillRect(60,100,270,1);
  ox.save();ox.translate(195,107);ox.rotate(Math.PI/4);ox.fillStyle='rgba(212,175,55,0.7)';ox.fillRect(-4,-4,8,8);ox.restore();
  ox.fillStyle='rgba(0,0,0,0.09)'; for(let y=0;y<560;y+=2)ox.fillRect(0,y,390,1);
  const vig=ox.createRadialGradient(195,280,130,195,280,290);

  coverImg.src=oc.toDataURL();

// ── SPIN ──────────────────────────────────────────────────
let spinY=0,lastLoopTime=0;

// ── STATS ─────────────────────────────────────────────────
let poolWins=0,poolLosses=0,poolGames=0;
async function loadStats(){
  try{
    const w=await window.storage.get('pool_wins');
    const l=await window.storage.get('pool_losses');
    const g=await window.storage.get('pool_games');
    if(w)poolWins=parseInt(w.value)||0;
    if(l)poolLosses=parseInt(l.value)||0;
    if(g)poolGames=parseInt(g.value)||0;
  }catch(e){}
}
async function saveStats(){
  try{
    await window.storage.set('pool_wins',String(poolWins));
    await window.storage.set('pool_losses',String(poolLosses));
    await window.storage.set('pool_games',String(poolGames));
  }catch(e){}
}
loadStats();

// ── GAME STATE ────────────────────────────────────────────
let G={state:'menu',frame:0};
function newGame(){
  // SLIDING vs ROLLING: balls start in rolling state (at rest on table)
  const balls=[{id:0,x:FX+FW/2,y:FY+FH*.68,vx:0,vy:0,angle:0,pocketed:false,rollState:'rolling',slideTimer:0}];
  const cx=FX+FW/2,cy=FY+FH*.27,d=BR*2+1.3;let ri=0;
  for(let r=0;r<5;r++)for(let c=0;c<=r;c++)
    balls.push({id:RACK[ri++],x:cx+(c-r/2)*d,y:cy+r*d*0.866,vx:0,vy:0,angle:0,pocketed:false,rollState:'rolling',slideTimer:0});
  G={
    state:'aim',balls,floats:[],parts:[],pocketGlows:[],
    ang:Math.PI,pwr:0,charge:false,
    turn:0,grp:[null,null],potted:[],foul:false,
    hand:false,handX:FX+FW/2,handY:FY+FH*.55,
    winner:-1,wMsg:'',sx:0,sy:0,st:0,
    msg:'',msgT:0,aiDelay:9999,frame:0,gameMode,
    turnCount:0,foulFlash:0,isBreak:true,
    // shot preview state
    shotPreview:null,
    pocketAlert:null, // {pktIdx, alpha} — highlighted pocket
  };
}

// ── HIKARIBEOY ────────────────────────────────────────────
const isHB=window.parent!==window;
if(isHB)setTimeout(()=>{menuState='player';menuSel=0;},300);
function exitGame(){window.parent.postMessage({type:'GAME_EXIT',gameId:'pool'},'*');}
let lastDpadFrame=0;
let pausePrevState='';
window.addEventListener('message',ev=>{
  const b=ev.data?.button,t=ev.data?.type;
  if(t==='AUDIO_UNLOCK'){initAudio();updateMusic();return;}
  if(t==='AUDIO_RESUME'){initAudio();updateMusic();if(AC&&AC.state==='suspended')AC.resume();return;}
  if(t==='BUTTON_PRESS'){
    lastDpadFrame=frameCount;
    if(b==='select'){
      if(G.state==='paused'){G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;bgMusic.pause();return;}
      exitGame();
    }
    if(b==='start'){
      if(G.state==='over'){confetti=[];G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;}
      else if(G.state==='menu')menuSelect();
      else if(G.state==='paused'){G.state=pausePrevState;pausePrevState='';updateMusic();}
      else{pausePrevState=G.state;G.state='paused';bgMusic.pause();}
    }
    if(b==='dpad-left'){keys.left=true;if(G.state==='menu'&&menuFadeDir!==-1){menuSel--;if(menuSel<0)menuSel=MENU_BTNS[menuState].length-1;}}
    if(b==='dpad-right'){keys.right=true;if(G.state==='menu'&&menuFadeDir!==-1){menuSel++;if(menuSel>MENU_BTNS[menuState].length-1)menuSel=0;}}
    if(b==='dpad-up')keys.up=true;
    if(b==='dpad-down')keys.down=true;
    if(b==='a'){
      if(G.state==='over'){confetti=[];G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;}
      else if(G.state==='menu')menuSelect();
      else if(G.state==='paused'){G.state=pausePrevState;pausePrevState='';updateMusic();}
      else keys.a=true;
    }
  }else if(t==='BUTTON_RELEASE'){
    lastDpadFrame=frameCount;
    if(b==='dpad-left')keys.left=false;
    if(b==='dpad-right')keys.right=false;
    if(b==='dpad-up')keys.up=false;
    if(b==='dpad-down')keys.down=false;
    if(b==='a')keys.a=false;
  }
});
function startGame(){newGame();initAudio();updateMusic();}

// ── MENU HELPERS ──────────────────────────────────────────
function menuFadeTransition(cb){menuFadeDir=-1;menuFadeCb=function(){menuFade=0;menuFadeDir=1;if(cb)cb();};}
function menuSelect(){
  if(menuFadeDir===-1)return;
  initAudio();Haptics.fire(Haptics.menu);
  if(menuState==='player'){
    if(menuSel===1){gameMode='2p';menuFadeTransition(startGame);}
    else{gameMode='1p-medium';menuFadeTransition(startGame);}
  }else{
    gameMode=['1p-easy','1p-medium','1p-hard'][menuSel];
    menuFadeTransition(startGame);
  }
}
function menuBack(){if(menuState==='difficulty')menuFadeTransition(function(){menuState='player';menuSel=0;});}

// ── DRAW HELPERS ──────────────────────────────────────────
function hl(h,a=70){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.min(255,r+a)},${Math.min(255,g+a)},${Math.min(255,b+a)})`;}
function dk(h,a=60){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.max(0,r-a)},${Math.max(0,g-a)},${Math.max(0,b-a)})`;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

// ── MENU DRAW ─────────────────────────────────────────────
function drawNeonBtn(x,y,w,h,label,color,glow,active,fs){
  ctx.save();ctx.globalAlpha=active?1.0:0.38;
  const fg=ctx.createLinearGradient(x,y,x,y+h);fg.addColorStop(0,'rgba(10,7,2,0.97)');fg.addColorStop(1,'rgba(5,3,1,0.97)');
  rr(x,y,w,h,8);ctx.fillStyle=fg;ctx.fill();
  ctx.shadowColor=active?glow:'transparent';ctx.shadowBlur=active?20:0;
  ctx.strokeStyle=active?color:'rgba(140,110,20,0.35)';ctx.lineWidth=active?2.5:1;
  rr(x,y,w,h,8);ctx.stroke();
  if(active){ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1;rr(x-2,y-2,w+4,h+4,10);ctx.stroke();}
  ctx.shadowColor=active?glow:'transparent';ctx.shadowBlur=active?12:0;
  ctx.fillStyle=active?'#ffffff':'rgba(180,140,30,0.6)';ctx.font='bold '+(fs||13)+'px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+w/2,y+h/2);
  ctx.shadowBlur=0;ctx.restore();
}
function drawMenu(){
  ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(0,40);
  ctx.drawImage(coverImg,0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.10)';for(let y=0;y<H;y+=2)ctx.fillRect(0,y,W,1);
  const ov=ctx.createLinearGradient(0,H-230,0,H);ov.addColorStop(0,'rgba(0,0,0,0)');ov.addColorStop(.25,'rgba(0,0,0,0.6)');ov.addColorStop(1,'rgba(2,1,6,0.94)');
  ctx.fillStyle=ov;ctx.fillRect(0,H-230,W,230);
  ctx.globalAlpha=menuFade;
  const btns=MENU_BTNS[menuState];
  const goldRule=function(y2){const rg=ctx.createLinearGradient(100,y2,W-100,y2);rg.addColorStop(0,'transparent');rg.addColorStop(.5,'rgba(212,175,55,0.55)');rg.addColorStop(1,'transparent');ctx.fillStyle=rg;ctx.fillRect(100,y2,W-200,1);};
  if(menuState==='player'){
    goldRule(H-208);ctx.fillStyle='rgba(212,175,55,0.65)';ctx.font='11px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText('SELECT MODE',W/2,H-194);goldRule(H-190);
    const bw=160,bh=56,gap=20,by=H-180,sx=(W-(bw*2+gap))/2;btns.forEach(function(btn,i){drawNeonBtn(sx+i*(bw+gap),by,bw,bh,btn.label,btn.color,btn.glow,i===menuSel);});

// ── PHYSICS ───────────────────────────────────────────────
const getCue=function(){return G.balls&&G.balls.find(function(b){return b.id===0&&!b.pocketed;});};
const allStop=function(){return G.balls.every(function(b){return b.pocketed||Math.hypot(b.vx,b.vy)<0.035;});};
function physStep(subDt){
  const scale=subDt/4.167;
  const act=G.balls.filter(function(b){return !b.pocketed;});
  for(const b of act){
    const spd=Math.hypot(b.vx,b.vy);
    if(b.rollState==='sliding'){
      b.vx*=Math.pow(0.965,scale);b.vy*=Math.pow(0.965,scale);
      b.slideTimer-=scale;
      if(b.slideTimer<=0||spd<0.5){
        b.rollState='rolling';
        b.slideTimer=0;
      }
    }else{
      b.vx*=Math.pow(0.985,scale);b.vy*=Math.pow(0.985,scale);
    }
    if(Math.abs(b.vx)<0.025)b.vx=0;if(Math.abs(b.vy)<0.025)b.vy=0;
    b.x+=b.vx*scale;b.y+=b.vy*scale;
    if(spd>0.025)b.angle+=spd/BR*scale;
    pocketCheck(b);if(!b.pocketed)wallBounce(b);
  }
  for(let p=0;p<2;p++)for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++)
    if(!act[i].pocketed&&!act[j].pocketed)ballCollide(act[i],act[j]);
}
function wallBounce(b){
  if(PKS.some(function(p){return Math.hypot(b.x-p.x,b.y-p.y)<PR+BR+2;}))return;
  // ANGLE-DEPENDENT RAIL BOUNCE: cushions behave differently based on impact angle
  // Research: perpendicular hits dig in (more dampened), glancing hits skim (more bouncy)
  // Perpendicular: e ≈ 0.75-0.82 | Glancing (shallow angle): e ≈ 0.88
  function getRailRestitution(vx,vy,isVertical){
    // Calculate approach angle relative to rail normal
    // isVertical = left/right rails (bounce affects vx)
    // !isVertical = top/bottom rails (bounce affects vy)
    const approachAngle=isVertical?Math.abs(Math.atan2(vy,vx)):Math.abs(Math.atan2(vx,vy));
    // approachAngle = 0 = perpendicular (head-on into rail)
    // approachAngle ≈ 1.57 (90°) = parallel to rail (glancing)
    // Map: shallow angle (glancing) → high restitution (0.88)
    //      perpendicular → lower restitution (0.78)
    const t=Math.min(approachAngle/1.2,1); // Normalize, cap at 1
    return 0.78+t*0.10; // Range: 0.78 to 0.88
  }
  if(b.x-BR<FX&&b.vx<0){
    const e=getRailRestitution(b.vx,b.vy,true);
    b.x=FX+BR;b.vx*=-e;doShake(Math.abs(b.vx)*0.7);Haptics.fire(Haptics.rail(Math.abs(b.vx)));
  }
  if(b.x+BR>FR&&b.vx>0){
    const e=getRailRestitution(b.vx,b.vy,true);
    b.x=FR-BR;b.vx*=-e;doShake(Math.abs(b.vx)*0.7);Haptics.fire(Haptics.rail(Math.abs(b.vx)));
  }
  if(b.y-BR<FY&&b.vy<0){
    const e=getRailRestitution(b.vx,b.vy,false);
    b.y=FY+BR;b.vy*=-e;doShake(Math.abs(b.vy)*0.7);Haptics.fire(Haptics.rail(Math.abs(b.vy)));
  }
  if(b.y+BR>FB&&b.vy>0){
    const e=getRailRestitution(b.vx,b.vy,false);
    b.y=FB-BR;b.vy*=-e;doShake(Math.abs(b.vy)*0.7);Haptics.fire(Haptics.rail(Math.abs(b.vy)));
  }
}
function ballCollide(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,mn=BR*2;
  if(d2>=mn*mn||d2<0.01)return;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
  const dv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(dv<=0)return;
  // WEIGHTY COLLISION: add "mass" feel with slight velocity damping
  // Real balls lose ~5-10% energy on collision due to sound/heat/deformation
  const restitution=0.92; // Not perfectly elastic - balls feel solid
  const impulse=dv*restitution;
  a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;
  // BALL-BALL FRICTION: tangential impulse transfers spin between balls
  // Research: μ_bb = 0.05-0.06 for well-polished phenolic balls
  // This makes cue ball stop on head-on breaks (90° separation)
  const tx=-ny,ty=nx; // Tangent vector (perpendicular to normal)
  const dvt=(a.vx-b.vx)*tx+(a.vy-b.vy)*ty; // Relative velocity along tangent
  // Coulomb friction: tangential impulse limited by normal impulse
  const frictionCoef=0.055; // 0.055 = realistic ball-ball friction
  const maxFriction=impulse*frictionCoef;
  const frictionImpulse=Math.max(-maxFriction,Math.min(maxFriction,dvt));
  // Apply tangential friction (creates "english" transfer between balls)
  a.vx-=frictionImpulse*tx;a.vy-=frictionImpulse*ty;
  b.vx+=frictionImpulse*tx;b.vy+=frictionImpulse*ty;
  // SLIDING: balls enter slide phase on collision (transfer + fresh impact)
  // Research: collisions induce sliding that lasts ~0.5-1s
  a.rollState='sliding';a.slideTimer=35; // ~0.6s sliding
  b.rollState='sliding';b.slideTimer=35;
  // Stronger position correction to prevent sinking
  const ov=(mn-d)*0.55+0.15;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
  // Audio/visual feedback scaled by impact intensity
  const impact=Math.abs(dv);
  const shakeAmt=G.isBreak?impact*2.2:impact*0.55;
  sndHit(impact);doShake(shakeAmt);Haptics.fire(Haptics.collision(impact));
  if(G.isBreak)G.isBreak=false;
}
function pocketCheck(b){
  if(b.pocketed)return;
  for(const p of PKS){
    if((b.x-p.x)**2+(b.y-p.y)**2<PR*PR){
      b.pocketed=true;b.vx=0;b.vy=0;
      spawnParts(b.x,b.y,CLR[b.id]);sndPocket();Haptics.fire(Haptics.pocket);
      G.pocketGlows.push({x:p.x,y:p.y,life:1});
      G.potted.push(b.id);
      if(b.id===0){G.foul=true;G.foulFlash=1;sndScratch();Haptics.fire(Haptics.scratch,true);}
      else G.floats.push({x:b.x,y:b.y-10,text:CMTS[Math.floor(Math.random()*CMTS.length)],life:1});
      return;
    }
  }
}
function doShake(v){if(v>2){G.sx=(Math.random()-.5)*Math.min(v*.5,4.5);G.sy=(Math.random()-.5)*Math.min(v*.5,4.5);G.st=5;}}
function spawnParts(x,y,c){for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2,s=Math.random()*6+1;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c,r:Math.random()*3+.8,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*0.4});}}

// ── AI ────────────────────────────────────────────────────
function computeAI(){
  const cue=getCue();if(!cue)return;
  const mg=G.grp[1];
  let tgts=G.balls.filter(function(b){return !b.pocketed&&b.id!==0&&b.id!==8;});
  if(mg==='solid')tgts=tgts.filter(function(b){return b.id>=1&&b.id<=7;});
  else if(mg==='stripe')tgts=tgts.filter(function(b){return b.id>=9&&b.id<=15;});
  if(mg&&!tgts.length){const b8=G.balls.find(function(b){return b.id===8&&!b.pocketed;});if(b8)tgts=[b8];}
  if(!tgts.length)tgts=G.balls.filter(function(b){return !b.pocketed&&b.id!==0;});
  if(!tgts.length)return;
  let best=null,bs=-Infinity;
  for(const ball of tgts)for(const pkt of PKS){
    const dx=pkt.x-ball.x,dy=pkt.y-ball.y,dist=Math.hypot(dx,dy);if(dist<1)continue;
    const nx=dx/dist,ny=dy/dist,gx=ball.x-nx*BR*2,gy=ball.y-ny*BR*2;
    const cd=Math.hypot(gx-cue.x,gy-cue.y),score=600/(cd+dist+80);
    if(score>bs){bs=score;best={ang:Math.atan2(gy-cue.y,gx-cue.x)};}
  }
  if(!best)return;
  const err=G.gameMode==='1p-easy'?0.45:G.gameMode==='1p-medium'?0.22:0.06;
  G.ang=best.ang+(Math.random()-.5)*err;
  G.pwr=(G.gameMode==='1p-easy'?0.3:0.42)+Math.random()*0.5;
  shoot();
}

// ── RULES ─────────────────────────────────────────────────
function shoot(){
  const cue=getCue();if(!cue)return;
  Haptics.fire(Haptics.shot);cue.vx=Math.cos(G.ang)*G.pwr*24;
  cue.vy=Math.sin(G.ang)*G.pwr*24;
  cue.vx+=Math.cos(G.ang+Math.PI/2)*spinY*G.pwr*4.5;
  cue.vy+=Math.sin(G.ang+Math.PI/2)*spinY*G.pwr*4.5;
  // SLIDING: cue ball starts sliding when struck
  cue.rollState='sliding';cue.slideTimer=45; // ~0.75s of sliding at 60fps
  spinY=0;G.pwr=0;G.charge=false;G.potted=[];G.foul=false;G.state='roll';
  G.shotPreview=null;G.pocketAlert=null;
}
function endTurn(){
  G.turnCount++;
  const pot=G.potted,p8=pot.includes(8),pCue=pot.includes(0)||G.foul;
  const pNum=pot.filter(function(id){return id!==0&&id!==8;});
  if(!G.grp[0]&&pNum.length&&!p8){
    const sol=pNum.some(function(id){return id>=1&&id<=7;}),str=pNum.some(function(id){return id>=9&&id<=15;});
    if(sol&&!str){G.grp[G.turn]='solid';G.grp[1-G.turn]='stripe';showMsg(G.turn,'SOLIDS 🟡');}
    else if(str&&!sol){G.grp[G.turn]='stripe';G.grp[1-G.turn]='solid';showMsg(G.turn,'STRIPES 🔵');}
  }
  if(p8){
    const mg=G.grp[G.turn];
    const myIds=mg==='solid'?[1,2,3,4,5,6,7]:mg==='stripe'?[9,10,11,12,13,14,15]:[];
    const cleared=mg&&myIds.every(function(id){return G.balls.find(function(b){return b.id===id;})?.pocketed;});
    G.winner=(!pCue&&cleared&&mg)?G.turn:1-G.turn;
    G.wMsg=G.winner===0?'P1 Wins! 🎱':(G.gameMode==='2p'?'P2 Wins! 🎱':'CPU Wins! 🤖');
    G.state='over';poolGames++;
    if(G.winner===0)poolWins++;else poolLosses++;
    saveStats();Haptics.fire(G.winner===0?Haptics.win:Haptics.loss,true);return;
  }
  if(pCue){
    G.foulFlash=1;G.turn=1-G.turn;showMsg(G.turn,'SCRATCH! Ball in hand');Haptics.fire(Haptics.turnFoul);
    G.hand=true;G.handX=FX+FW/2;G.handY=FY+FH*.55;
    G.state='hand';if(G.turn===1&&G.gameMode!=='2p')G.aiDelay=80;return;
  }
  const mg=G.grp[G.turn];
  const own=pNum.length&&(!mg||pNum.some(function(id){return mg==='solid'?id>=1&&id<=7:id>=9&&id<=15;}));
  if(!own)G.turn=1-G.turn;
  G.potted=[];G.foul=false;G.state='aim';
  if(G.turn===1&&G.gameMode!=='2p')G.aiDelay=85;
}
function showMsg(p,txt){G.msg='P'+(p+1)+': '+txt;G.msgT=140;}

// ── SHOT PREVIEW COMPUTATION ──────────────────────────────
// Returns {cueEnd, ghostX, ghostY, hitBall, deflectX, deflectY, reflectX, reflectY, pocketIdx}
function computeShotPreview(){
  const cue=getCue();if(!cue)return null;
  const dx=Math.cos(G.ang),dy=Math.sin(G.ang);
  // Ray cast from cue ball to find first hit ball
  let minT=Infinity,hitBall=null;
  for(const b of G.balls){
    if(b.pocketed||b.id===0)continue;
    const ex=cue.x-b.x,ey=cue.y-b.y;
    const bq=2*(ex*dx+ey*dy),cq=ex*ex+ey*ey-(BR*2)**2;
    const disc=bq*bq-4*cq;if(disc<0)continue;
    const t=(-bq-Math.sqrt(disc))/2;if(t>0.5&&t<minT){minT=t;hitBall=b;}
  }
  // Ray-vs-wall for cue ball path
  function rayWall(ox,oy,vx,vy,maxT){
    let t=maxT;
    if(vx<0){const tt=(FX+BR-ox)/vx;if(tt>0.5&&tt<t)t=tt;}
    if(vx>0){const tt=(FR-BR-ox)/vx;if(tt>0.5&&tt<t)t=tt;}
    if(vy<0){const tt=(FY+BR-oy)/vy;if(tt>0.5&&tt<t)t=tt;}
    if(vy>0){const tt=(FB-BR-oy)/vy;if(tt>0.5&&tt<t)t=tt;}
    return t;
  }
  const wallT=rayWall(cue.x,cue.y,dx,dy,300);
  const cueSegEnd=hitBall?minT:wallT;
  const cueEndX=cue.x+dx*cueSegEnd;
  const cueEndY=cue.y+dy*cueSegEnd;

  let ghostX=null,ghostY=null,deflectX=null,deflectY=null;
  let reflectX=null,reflectY=null,pocketIdx=-1;

  if(hitBall){
    ghostX=cue.x+dx*minT;ghostY=cue.y+dy*minT;
    // Direction from ghost to hitBall center = object ball roll direction
    const nx2=(hitBall.x-ghostX)/(BR*2),ny2=(hitBall.y-ghostY)/(BR*2);
    // Cue ball deflects perpendicular (approximation)
    // Perpendicular to the hit normal, in same general forward direction
    const perpX=-ny2,perpY=nx2;
    const side=(dx*perpX+dy*perpY)>=0?1:-1;
    const defDx=perpX*side,defDy=perpY*side;
    const defT=rayWall(ghostX,ghostY,defDx,defDy,80);
    deflectX=ghostX+defDx*defT;deflectY=ghostY+defDy*defT;
    // Object ball path → check pocket alignment
    let bestPkt=-1,bestPktScore=Infinity;
    for(let pi=0;pi<PKS.length;pi++){
      const p=PKS[pi];
      const odx=p.x-hitBall.x,ody=p.y-hitBall.y,od=Math.hypot(odx,ody);
      if(od<2)continue;
      const onx=odx/od,ony=ody/od;
      // Cross product with nx2,ny2 — how aligned is the object ball's path with this pocket?
      const cross=Math.abs(nx2*ony-ny2*onx);
      const dot=nx2*onx+ny2*ony;
      if(dot>0.82&&cross<bestPktScore){bestPktScore=cross;bestPkt=pi;}
    }
    pocketIdx=bestPkt;
    // Object ball path
    const objT=rayWall(hitBall.x,hitBall.y,nx2,ny2,240);
    reflectX=hitBall.x+nx2*(pocketIdx>=0?Math.hypot(PKS[pocketIdx].x-hitBall.x,PKS[pocketIdx].y-hitBall.y):objT);
    reflectY=hitBall.y+ny2*(pocketIdx>=0?Math.hypot(PKS[pocketIdx].x-hitBall.x,PKS[pocketIdx].y-hitBall.y):objT);
  }
  return{cueEndX,cueEndY,hitBall,ghostX,ghostY,deflectX,deflectY,reflectX,reflectY,pocketIdx};
}

// ── GHOST BALL OUTLINE ────────────────────────────────────
function drawGhostBall(x,y,alpha){
  ctx.save();
  // Shadow
  ctx.beginPath();ctx.ellipse(x+1,y+BR-1,BR*.85,BR*.28,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,'+(alpha*0.25)+')';ctx.fill();

// ── AIM PULSE ────────────────────────────────────────────
function drawAimPulse(){
  const cue=getCue();if(!cue)return;
  for(let i=0;i<2;i++){
    const phase=(G.frame*.06+i*.5)%(Math.PI*2);
    const r=BR+4+Math.sin(phase)*5,a=0.22-Math.sin(phase)*0.15;
    ctx.beginPath();ctx.arc(cue.x,cue.y,r,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,215,0,'+a+')';ctx.lineWidth=1.5;ctx.stroke();
  }
}

// ── ENHANCED CUE + FULL SHOT PREVIEW ─────────────────────
function drawRealisticCue(){
  const cue=getCue();if(!cue)return;
  const ang=G.ang,pb=G.charge?G.pwr*32+6:5;
  const pulse=0.55+Math.sin(G.frame*0.18)*0.35;
  const dashOff=(G.frame*.8)%14;

  // Recompute preview every frame so it's always live
  const prev=computeShotPreview();
  G.shotPreview=prev;

  drawAimPulse();
  ctx.save();

  if(prev){
    const{cueEndX,cueEndY,hitBall,ghostX,ghostY,deflectX,deflectY,reflectX,reflectY,pocketIdx}=prev;

    // ── 1. CUE BALL PATH LINE ─────────────────────────────
    // Multi-layer: gold glow + white dashed
    ctx.setLineDash([7,5]);ctx.lineDashOffset=-dashOff;
    // Glow layer
    ctx.strokeStyle='rgba(255,210,0,'+(0.18+pulse*0.1)+')';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(cue.x+Math.cos(ang)*(BR+2),cue.y+Math.sin(ang)*(BR+2));ctx.lineTo(cueEndX,cueEndY);ctx.stroke();
    // White dash
    ctx.strokeStyle='rgba(255,255,255,'+(0.7+pulse*0.2)+')';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(cue.x+Math.cos(ang)*(BR+2),cue.y+Math.sin(ang)*(BR+2));ctx.lineTo(cueEndX,cueEndY);ctx.stroke();
    ctx.setLineDash([]);

    if(hitBall){
      // ── 2. GHOST BALL at contact point ───────────────────
      drawGhostBall(ghostX,ghostY,0.55+pulse*0.25);

      // Target ball ID badge
      ctx.save();
      ctx.beginPath();ctx.arc(hitBall.x,hitBall.y-BR-11,9,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fill();
      ctx.strokeStyle='rgba(255,215,0,0.8)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='rgba(255,215,0,0.95)';ctx.font='bold 8px Georgia,serif';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(hitBall.id,hitBall.x,hitBall.y-BR-11);
      ctx.restore();

      // ── 3. OBJECT BALL PATH ───────────────────────────────
      // Cyan/teal dashes
      ctx.setLineDash([5,5]);ctx.lineDashOffset=-dashOff*0.7;
      ctx.strokeStyle='rgba(34,211,238,'+(0.55+pulse*0.2)+')';ctx.lineWidth=1.8;
      ctx.beginPath();ctx.moveTo(hitBall.x,hitBall.y);ctx.lineTo(reflectX,reflectY);ctx.stroke();
      ctx.setLineDash([]);

      // Endpoint dot on object path (pocket-aimed = gold, else dim)
      const epAlpha=pocketIdx>=0?(0.8+pulse*0.15):0.3;
      ctx.beginPath();ctx.arc(reflectX,reflectY,3.5,0,Math.PI*2);
      ctx.fillStyle=pocketIdx>=0?'rgba(255,220,60,'+epAlpha+')':'rgba(34,211,238,'+epAlpha+')';ctx.fill();

      // ── 4. CUE BALL DEFLECT PATH ─────────────────────────
      // Only show after hitting a ball (cue ball deflect)
      if(deflectX!==null){
        ctx.setLineDash([3,6]);ctx.lineDashOffset=-dashOff*0.5;
        ctx.strokeStyle='rgba(255,255,255,'+(0.25+pulse*0.1)+')';ctx.lineWidth=1.2;
        ctx.beginPath();ctx.moveTo(ghostX,ghostY);ctx.lineTo(deflectX,deflectY);ctx.stroke();
        ctx.setLineDash([]);
      }

      // ── 5. POCKET HIGHLIGHT ───────────────────────────────
      if(pocketIdx>=0){
        drawPocketAimHighlight(pocketIdx,0.85+pulse*0.15);
      }
    }else{
      // No ball hit – just endpoint dot on cue ball path
      ctx.beginPath();ctx.arc(cueEndX,cueEndY,3,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fill();
    }
  }

  ctx.setLineDash([]);ctx.restore();

  // Draw cue stick
  const tx=cue.x-Math.cos(ang)*(BR+pb),ty2=cue.y-Math.sin(ang)*(BR+pb);
  ctx.save();ctx.translate(tx,ty2);ctx.rotate(ang+Math.PI);
  ctx.beginPath();ctx.moveTo(0,-2.5);ctx.lineTo(140,-5.5);ctx.lineTo(140,5.5);ctx.lineTo(0,2.5);ctx.closePath();
  const shaftGrad=ctx.createLinearGradient(0,-3,0,3);
  shaftGrad.addColorStop(0,'#2a2a2a');shaftGrad.addColorStop(.5,'#1a1a1a');shaftGrad.addColorStop(1,'#0a0a0a');
  ctx.fillStyle=shaftGrad;ctx.fill();
  ctx.strokeStyle='rgba(212,175,55,0.9)';ctx.lineWidth=1.5;
  [30,60,90].forEach(function(lx){ctx.beginPath();ctx.moveTo(lx,-5.5*(lx/140));ctx.lineTo(lx,5.5*(lx/140));ctx.stroke();});
  ctx.beginPath();ctx.moveTo(100,-4.8);ctx.lineTo(140,-5.5);ctx.lineTo(140,5.5);ctx.lineTo(100,4.8);ctx.closePath();
  const buttGrad=ctx.createLinearGradient(0,-5,0,5);buttGrad.addColorStop(0,'#5d3018');buttGrad.addColorStop(.5,'#3d1e0c');buttGrad.addColorStop(1,'#2a1508');
  ctx.fillStyle=buttGrad;ctx.fill();
  ctx.beginPath();ctx.moveTo(138,-5.3);ctx.lineTo(140,-5.5);ctx.lineTo(140,5.5);ctx.lineTo(138,5.3);ctx.closePath();
  ctx.fillStyle='rgba(212,175,55,0.95)';ctx.fill();
  ctx.beginPath();ctx.moveTo(-1,-2.5);ctx.lineTo(4,-2.8);ctx.lineTo(4,2.8);ctx.lineTo(-1,2.5);ctx.closePath();
  ctx.fillStyle='#3b82f6';ctx.fill();
  ctx.restore();
  ctx.beginPath();ctx.arc(tx,ty2,2.5,0,Math.PI*2);ctx.fillStyle='#60a5fa';ctx.fill();
}

// ── POWER METER — enhanced with sweet spot ────────────────
function drawPower(){
  const p=G.pwr;
  // Background screen flash at high power
  if(p>0.6){const a=(p-0.6)/0.4*0.16;ctx.fillStyle=p>0.85?'rgba(239,68,68,'+a+')':'rgba(34,211,238,'+a+')';ctx.fillRect(W-34,TY,7,TH);}

  const bx=W-40,by=TY+10,bw=9,bh=TH-20;
  ctx.fillStyle='rgba(0,0,0,0.55)';rr(bx,by,bw,bh,4);ctx.fill();
  ctx.strokeStyle='rgba(34,211,238,0.18)';ctx.lineWidth=1;rr(bx,by,bw,bh,4);ctx.stroke();

  if(p>0.01){
    const fh=bh*p;
    // Colour zones: cyan→amber→red
    const pg=ctx.createLinearGradient(0,by+bh,0,by+bh-fh);
    pg.addColorStop(0,p<0.5?CY:p<0.8?'#f59e0b':'#ef4444');
    pg.addColorStop(1,p<0.5?'#0891b2':p<0.8?'#fbbf24':'#f87171');
    rr(bx,by+bh-fh,bw,fh,4);ctx.fillStyle=pg;ctx.fill();
    if(p>0.5){ctx.save();ctx.shadowColor=p>0.8?'#ef4444':'#f59e0b';ctx.shadowBlur=7+p*9;rr(bx,by+bh-fh,bw,fh,4);ctx.strokeStyle='transparent';ctx.stroke();ctx.restore();}
  }

  // Tick marks
  ctx.strokeStyle='rgba(34,211,238,0.3)';ctx.lineWidth=1;
  [.25,.5,.75].forEach(function(frac){ctx.beginPath();ctx.moveTo(bx-3,by+bh*(1-frac));ctx.lineTo(bx,by+bh*(1-frac));ctx.stroke();});

  // ── SWEET SPOT indicator (0.55–0.72 power band) ──────────
  // Draw a golden bracket on the meter showing the ideal power range
  const ssLo=0.55,ssHi=0.72;
  const ssY1=by+bh*(1-ssHi),ssY2=by+bh*(1-ssLo);
  const ssPulse=0.6+Math.sin(G.frame*0.12)*0.35;
  const ssAlpha=G.charge?ssPulse:0.45;
  ctx.save();
  ctx.strokeStyle='rgba(255,215,0,'+ssAlpha+')';ctx.lineWidth=1.5;
  // Left bracket lines
  ctx.beginPath();ctx.moveTo(bx-5,ssY1);ctx.lineTo(bx-2,ssY1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx-5,ssY2);ctx.lineTo(bx-2,ssY2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx-5,ssY1);ctx.lineTo(bx-5,ssY2);ctx.stroke();
  // Star/dot marker on right side at midpoint
  const ssMid=(ssY1+ssY2)/2;
  ctx.fillStyle='rgba(255,215,0,'+ssAlpha+')';
  ctx.font='bold 8px Arial';ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.fillText('★',bx-7,ssMid);
  // Highlight the sweet spot zone within the bar
  if(p>=ssLo&&p<=ssHi){
    ctx.shadowColor='rgba(255,215,0,0.9)';ctx.shadowBlur=8;
    ctx.strokeStyle='rgba(255,215,0,0.8)';ctx.lineWidth=2.5;
    rr(bx,by+bh-p*bh,bw,p*bh,4);ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle='rgba(34,211,238,0.6)';ctx.font='bold 6px Arial';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('PWR',bx+bw/2,by+bh+4);
  // Responsive % — larger when charging
  const pctSize=G.charge?8:7;
  ctx.fillStyle=p>0.8?'#ef4444':p>0.5?'#f59e0b':(p>=ssLo&&p<=ssHi?'#ffd700':CY);
  ctx.font='bold '+pctSize+'px Arial';ctx.textBaseline='top';
  ctx.fillText(Math.round(p*100)+'%',bx+bw/2,by+bh+12);
}

// ── KEYS ──────────────────────────────────────────────────
const keys={left:false,right:false,up:false,down:false,a:false};
let aPrev=false,aHeldFrames=0;
function onKey(e,down){
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(k==='ArrowLeft'||k==='Left')keys.left=down;
  if(k==='ArrowRight'||k==='Right')keys.right=down;
  if(k==='ArrowUp'||k==='Up')keys.up=down;
  if(k==='ArrowDown'||k==='Down')keys.down=down;
  if(k==='a'||k==='A')keys.a=down;
  if(!down)return;
  if(G.state==='over'&&(k==='Enter'||k==='a'||k==='A'||k===' ')){confetti=[];G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;return;}
  if(G.state==='menu'){
    const maxSel=MENU_BTNS[menuState].length-1;
    if(k==='ArrowRight'||k==='ArrowDown'){menuSel++;if(menuSel>maxSel)menuSel=0;}
    if(k==='ArrowLeft'||k==='ArrowUp'){menuSel--;if(menuSel<0)menuSel=maxSel;}
    if(k==='Enter'||k==='a'||k==='A')menuSelect();
    if(k==='b'||k==='B'||k==='Escape')menuBack();
  }
}
// Use ONLY window event listeners to avoid duplicate events
window.addEventListener('keydown',function(e){onKey(e,true);});
window.addEventListener('keyup',function(e){onKey(e,false);});

// ── MAIN LOOP ─────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  updateMusic();
  const dt=lastLoopTime?Math.min(ts-lastLoopTime,33.33):16.67;
  lastLoopTime=ts;
  frameCount++;G.frame=(G.frame||0)+1;
  if(G.state==='menu'){
    menuFade=Math.max(0,Math.min(1,menuFade+menuFadeDir*0.07));
    if(menuFadeDir===-1&&menuFade<=0&&menuFadeCb){const cb=menuFadeCb;menuFadeCb=null;cb();}
    drawMenu();return;
  }
  if(G.state==='paused'){drawPaused();ctx.restore();return;}
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='aim'&&isHuman){
    const prev=G.shotPreview;let distanceScale=1;
    if(prev){const previewDist=Math.hypot(prev.cueEndX-getCue().x,prev.cueEndY-getCue().y);const refDist=120;distanceScale=Math.min(1,refDist/Math.max(previewDist,refDist));}
    if(keys.left){G.ang-=0.0084*distanceScale;lastDpadFrame=frameCount;}
    if(keys.right){G.ang+=0.0084*distanceScale;lastDpadFrame=frameCount;}
    if(!G.charge){
      if(keys.up)spinY=Math.min(1,spinY+0.06);
      if(keys.down)spinY=Math.max(-1,spinY-0.06);
    }
    // CHARGE LOGIC: start charge on first press, build while held, fire on release
    if(keys.a){
      aHeldFrames++;
      if(!G.charge){G.charge=true;G.pwr=0;aHeldFrames=0;}
      // Charge rate: 1.4 seconds to full at 60fps = ~0.012 per frame
      G.pwr=Math.min(1,G.pwr+0.012);
    }else{
      // Button released - fire if we were charging
      if(G.charge&&aHeldFrames>0){if(G.pwr>0.04)shoot();else{G.charge=false;G.pwr=0;}}
      aHeldFrames=0;
    }
  }
  if(G.state==='hand'&&isHuman){
    const spd=2.5;
    if(keys.left)G.handX=Math.max(FX+BR+1,G.handX-spd);
    if(keys.right)G.handX=Math.min(FR-BR-1,G.handX+spd);
    if(keys.up)G.handY=Math.max(FY+BR+1,G.handY-spd);
    if(keys.down)G.handY=Math.min(FB-BR-1,G.handY+spd);
    if(keys.a){const cb=G.balls.find(function(b){return b.id===0;});cb.pocketed=false;cb.vx=0;cb.vy=0;cb.x=G.handX;cb.y=G.handY;G.state='aim';G.potted=[];G.foul=false;}
  }
  // aPrev tracking removed - using aHeldFrames instead
  if(G.state==='roll'){for(let i=0;i<4;i++)physStep(dt/4);if(allStop())endTurn();}
  if(G.state==='aim'&&G.turn===1&&G.gameMode!=='2p'){G.aiDelay--;if(G.aiDelay<=0){computeAI();G.aiDelay=9999;}}
  if(G.state==='hand'&&G.turn===1&&G.gameMode!=='2p'){
    G.aiDelay--;
    if(G.aiDelay<=0){
      const cb=G.balls.find(function(b){return b.id===0;});
      cb.pocketed=false;cb.vx=0;cb.vy=0;cb.x=FX+FW*.28+Math.random()*FW*.44;cb.y=FY+FH*.55;
      cb.rollState='rolling';cb.slideTimer=0; // AI places ball at rest
      G.state='aim';G.potted=[];G.foul=false;G.aiDelay=88;
    }
  }
  if(G.foulFlash>0)G.foulFlash=Math.max(0,G.foulFlash-0.04);
  ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(GX_OFF,Y_OFF);
  drawBg();
  let shook=false;
  if(G.st>0){ctx.save();ctx.translate(G.sx,G.sy);G.sx*=.6;G.sy*=.6;G.st--;shook=true;}
  drawTable();drawTurnSpotlight();drawParts();drawPocketGlows();
  if(G.state==='hand'&&isHuman)drawHandMode();
  if(G.state==='aim'&&isHuman)drawRealisticCue();
  G.balls.forEach(drawBallEnhanced);
  if(shook)ctx.restore();
  drawBallTray();drawHUD();
  if(G.state==='aim'&&isHuman){drawPower();drawCueBallHitSpot();}
  drawFloats();
  if(G.foulFlash>0){
    ctx.fillStyle='rgba(220,30,30,'+(G.foulFlash*0.28)+')';ctx.fillRect(0,0,W,H);
    if(G.foulFlash>0.7){ctx.fillStyle='rgba(255,60,60,'+(G.foulFlash*0.9)+')';ctx.font='bold 28px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SCRATCH!',W/2,H/2);}
  }
  if(G.state==='over')drawOver();
  if(G.state==='paused')drawPaused();
  ctx.restore();
}
function drawPaused(){
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.shadowColor='rgba(212,175,55,0.8)';ctx.shadowBlur=22;
  ctx.fillStyle='#ffd700';ctx.font='bold 32px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('PAUSED',W/2,H/2-40);ctx.restore();
  const bw=140,bh=42,bx=W/2-bw/2,by1=H/2+10,by2=H/2+64;
  const bg1=ctx.createLinearGradient(bx,by1,bx,by1+bh);bg1.addColorStop(0,'rgba(212,175,55,0.9)');bg1.addColorStop(.5,'rgba(255,215,0,0.95)');bg1.addColorStop(1,'rgba(180,140,30,0.9)');
  ctx.save();ctx.shadowColor='rgba(255,215,0,0.6)';ctx.shadowBlur=12;rr(bx,by1,bw,bh,8);ctx.fillStyle=bg1;ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(255,240,180,0.9)';ctx.lineWidth=2;rr(bx,by1,bw,bh,8);ctx.stroke();
  ctx.fillStyle='#1a1205';ctx.font='bold 16px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('▶ RESUME',W/2,by1+bh/2+1);
  const bg2=ctx.createLinearGradient(bx,by2,bx,by2+bh);bg2.addColorStop(0,'rgba(100,100,100,0.8)');bg2.addColorStop(.5,'rgba(140,140,140,0.9)');bg2.addColorStop(1,'rgba(80,80,80,0.8)');
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=8;rr(bx,by2,bw,bh,8);ctx.fillStyle=bg2;ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(200,200,200,0.6)';ctx.lineWidth=2;rr(bx,by2,bw,bh,8);ctx.stroke();
  ctx.fillStyle='#f0f0f0';ctx.font='bold 16px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('↺ QUIT',W/2,by2+bh/2+1);
  ctx.fillStyle='rgba(212,175,55,0.5)';ctx.font='9px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('START / A to resume  ·  SELECT to quit',W/2,H-30);
}
requestAnimationFrame(loop);

// ── TOUCH / MOUSE ─────────────────────────────────────────
let pdn=false;
function getP(e){
  const r=cvs.getBoundingClientRect();const s=e.changedTouches?.[0]||e.touches?.[0]||e;
  return{x:(s.clientX-r.left)/scale,y:(s.clientY-r.top)/scale};
}
function aimTo(p){
  const cue=getCue();if(!cue)return;
  const dx=p.x-cue.x,dy=p.y-cue.y;if(dx*dx+dy*dy>64)G.ang=Math.atan2(dy,dx);
}
function onDown(e){
  e.preventDefault();initAudio();
  const p=getP(e);
  if(G.state==='over'){confetti=[];G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;return;}
  if(G.state==='paused'){
    const mx=p.x,my=p.y;
    const bw=140,bh=42,bx=W/2-bw/2,by1=H/2+10,by2=H/2+64;
    if(mx>=bx&&mx<=bx+bw&&my>=by1&&my<=by1+bh){G.state=pausePrevState;pausePrevState='';updateMusic();}
    else if(mx>=bx&&mx<=bx+bw&&my>=by2&&my<=by2+bh){G.state='menu';menuState='player';menuSel=0;menuFade=1;menuFadeDir=1;bgMusic.pause();}
    return;
  }
  if(G.state==='menu'){
    if(menuFadeDir===-1)return;
    const mx=p.x,my=p.y-40;const btns=MENU_BTNS[menuState];
    if(menuState==='player'){const bw=160,bh=56,gap=20,by=H-180,sx=(W-(bw*2+gap))/2;btns.forEach(function(btn,i){const bx=sx+i*(bw+gap);if(mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh){menuSel=i;menuSelect();}});}
    else{const bw=130,bh=65,gap=15,by=H-180,sx=(W-(bw*3+gap*2))/2;btns.forEach(function(btn,i){const bx=sx+i*(bw+gap);if(mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh){menuSel=i;menuSelect();}});}
    return;
  }
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));return;}
  if(G.state!=='aim'||!isHuman)return;
  pdn=true;G.charge=true;G.pwr=0;aimTo(p);
}
function onMove(e){
  e.preventDefault();const p=getP(e);
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));return;}
  if(!pdn||G.state!=='aim'||!isHuman)return;aimTo(p);
}
function onUp(e){
  e.preventDefault();const p=getP(e);
  const isHuman=G.turn===0||(G.gameMode==='2p'&&G.turn===1);
  if(G.state==='hand'&&isHuman){
    G.handX=Math.max(FX+BR,Math.min(FR-BR,p.x));G.handY=Math.max(FY+BR,Math.min(FB-BR,p.y));
    const cb=G.balls.find(function(b){return b.id===0;});cb.pocketed=false;cb.vx=0;cb.vy=0;cb.x=G.handX;cb.y=G.handY;
    G.state='aim';G.potted=[];G.foul=false;return;
  }
  if(!pdn)return;pdn=false;
  if(G.state==='aim'&&isHuman&&G.charge){if(G.pwr>0.04)shoot();else{G.charge=false;G.pwr=0;}}
}
cvs.addEventListener('mousedown',onDown);
cvs.addEventListener('mousemove',onMove);
cvs.addEventListener('mouseup',onUp);
cvs.addEventListener('touchstart',onDown,{passive:false});
cvs.addEventListener('touchmove',onMove,{passive:false});
cvs.addEventListener('touchend',onUp,{passive:false});
</script>
