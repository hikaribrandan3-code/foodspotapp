<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Steak - Cooking Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(255, 100, 50, 0.3);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        #controls {
            position: absolute;
            bottom: -40px;
            left: 0;
            right: 0;
            text-align: center;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
        <div id="controls">A:Serve | B:Flip | L:Salt | R:Pepper | START:Pause</div>
    </div>

    <script>
        // ============================================
        // PERFECT STEAK - Timing-based Cooking Game
        // ============================================
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game Constants
        const WIDTH = 480;
        const HEIGHT = 320;
        
        // Doneness levels with color and temperature ranges
        const DONENESS_LEVELS = [
            { name: 'BLUE', color: '#4a0080', tempMin: 0, tempMax: 15, score: 0 },
            { name: 'RARE', color: '#8B0000', tempMin: 15, tempMax: 35, score: 100 },
            { name: 'MEDIUM-RARE', color: '#CD5C5C', tempMin: 35, tempMax: 55, score: 150 },
            { name: 'MEDIUM', color: '#D2691E', tempMin: 55, tempMax: 75, score: 200 },
            { name: 'MEDIUM-WELL', color: '#CD853F', tempMin: 75, tempMax: 90, score: 150 },
            { name: 'WELL', color: '#8B4513', tempMin: 90, tempMax: 100, score: 100 },
            { name: 'BURNT', color: '#2F1810', tempMin: 100, tempMax: 120, score: 0 }
        ];
        
        // Game States
        const STATE = {
            MENU: 0,
            PLAYING: 1,
            PAUSED: 2,
            ROUND_END: 3,
            GAME_OVER: 4
        };
        
        // Input State
        const inputState = {
            A: false,
            B: false,
            X: false,
            Y: false,
            L: false,
            R: false,
            START: false,
            SELECT: false,
            UP: false,
            DOWN: false,
            LEFT: false,
            RIGHT: false
        };
        
        // Audio Context
        let audioCtx = null;
        let audioMuted = false;
        
        // Game Variables
        let gameState = STATE.MENU;
        let score = 0;
        let round = 1;
        let strikes = 0;
        let maxStrikes = 3;
        let cookingSpeed = 0.3;
        
        // Steak Properties
        let steak = {
            temp: 0,
            sideACooked: 0,
            sideBCooked: 0,
            currentSide: 'A',
            flipped: false,
            salted: false,
            peppered: false,
            x: 240,
            y: 160,
            width: 100,
            height: 70,
            sizzleOffset: 0
        };
        
        // Customer Order
        let targetDoneness = null;
        let orderDisplayTime = 0;
        
        // Particles
        let particles = [];
        let sizzleParticles = [];
        
        // Menu Selection
        let menuSelection = 0;
        const menuOptions = ['Resume', 'Mute Audio', 'Back to Selector'];
        
        // ============================================
        // AUDIO SYSTEM
        // ============================================
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playSound(type) {
            if (audioMuted || !audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            switch(type) {
                case 'sizzle':
                    // White noise for sizzle
                    const bufferSize = audioCtx.sampleRate * 0.1;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const noiseGain = audioCtx.createGain();
                    noiseGain.gain.setValueAtTime(0.05, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    noise.connect(noiseGain);
                    noiseGain.connect(audioCtx.destination);
                    noise.start(now);
                    noise.stop(now + 0.1);
                    break;
                    
                case 'flip':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                    
                case 'serve':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554, now + 0.1);
                    osc.frequency.setValueAtTime(659, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
                    
                case 'success':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.1);
                    osc.frequency.setValueAtTime(784, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                    
                case 'fail':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                    
                case 'salt':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                    
                case 'pepper':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                    
                case 'select':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
            }
        }
        
        // ============================================
        // GAME FUNCTIONS
        // ============================================
        
        function initGame() {
            score = 0;
            round = 1;
            strikes = 0;
            cookingSpeed = 0.3;
            resetSteak();
            generateOrder();
            gameState = STATE.PLAYING;
        }
        
        function resetSteak() {
            steak.temp = 0;
            steak.sideACooked = 0;
            steak.sideBCooked = 0;
            steak.currentSide = 'A';
            steak.flipped = false;
            steak.salted = false;
            steak.peppered = false;
            particles = [];
        }
        
        function generateOrder() {
            // Generate random target doneness (excluding BLUE and BURNT)
            const validTargets = DONENESS_LEVELS.slice(1, -1);
            targetDoneness = validTargets[Math.floor(Math.random() * validTargets.length)];
            orderDisplayTime = 120; // frames to show order
        }
        
        function getCurrentDoneness() {
            const currentTemp = steak.currentSide === 'A' ? steak.sideACooked : steak.sideBCooked;
            for (let level of DONENESS_LEVELS) {
                if (currentTemp >= level.tempMin && currentTemp < level.tempMax) {
                    return level;
                }
            }
            return DONENESS_LEVELS[DONENESS_LEVELS.length - 1];
        }
        
        function getSteakColor() {
            const currentTemp = steak.currentSide === 'A' ? steak.sideACooked : steak.sideBCooked;
            for (let level of DONENESS_LEVELS) {
                if (currentTemp >= level.tempMin && currentTemp < level.tempMax) {
                    return level.color;
                }
            }
            return '#2F1810';
        }
        
        function flipSteak() {
            if (gameState !== STATE.PLAYING) return;
            
            initAudio();
            playSound('flip');
            
            steak.flipped = !steak.flipped;
            steak.currentSide = steak.flipped ? 'B' : 'A';
            
            // Create flip particles
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: steak.x + Math.random() * steak.width - steak.width/2,
                    y: steak.y + Math.random() * steak.height - steak.height/2,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4 - 2,
                    life: 30,
                    color: '#FF6B35',
                    size: Math.random() * 4 + 2
                });
            }
        }
        
        function addSalt() {
            if (gameState !== STATE.PLAYING || steak.salted) return;
            
            initAudio();
            playSound('salt');
            steak.salted = true;
            
            // Create salt particles
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: steak.x + Math.random() * steak.width - steak.width/2,
                    y: steak.y - 50 + Math.random() * 30,
                    vx: (Math.random() - 0.5) * 2,
                    vy: Math.random() * 3 + 2,
                    life: 40,
                    color: '#FFFFFF',
                    size: Math.random() * 2 + 1
                });
            }
        }
        
        function addPepper() {
            if (gameState !== STATE.PLAYING || steak.peppered) return;
            
            initAudio();
            playSound('pepper');
            steak.peppered = true;
            
            // Create pepper particles
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: steak.x + Math.random() * steak.width - steak.width/2,
                    y: steak.y - 50 + Math.random() * 30,
                    vx: (Math.random() - 0.5) * 2,
                    vy: Math.random() * 3 + 2,
                    life: 40,
                    color: '#333333',
                    size: Math.random() * 2 + 1
                });
            }
        }
        
        function serveSteak() {
            if (gameState !== STATE.PLAYING) return;
            
            initAudio();
            playSound('serve');
            
            const currentDoneness = getCurrentDoneness();
            const isCorrect = currentDoneness.name === targetDoneness.name;
            
            if (isCorrect) {
                // Calculate score
                let roundScore = currentDoneness.score;
                if (steak.salted) roundScore += 50;
                if (steak.peppered) roundScore *= 2;
                
                score += roundScore;
                playSound('success');
                
                // Create success particles
                for (let i = 0; i < 20; i++) {
                    particles.push({
                        x: steak.x,
                        y: steak.y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        life: 60,
                        color: '#00FF00',
                        size: Math.random() * 5 + 3
                    });
                }
                
                // Next round
                round++;
                cookingSpeed = Math.min(0.8, cookingSpeed + 0.05);
                resetSteak();
                generateOrder();
            } else {
                strikes++;
                playSound('fail');
                
                // Create fail particles
                for (let i = 0; i < 20; i++) {
                    particles.push({
                        x: steak.x,
                        y: steak.y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        life: 60,
                        color: '#FF0000',
                        size: Math.random() * 5 + 3
                    });
                }
                
                if (strikes >= maxStrikes) {
                    gameState = STATE.GAME_OVER;
                    reportScore(score);
                    saveGameState();
                } else {
                    resetSteak();
                    generateOrder();
                }
            }
        }
        
        function togglePause() {
            if (gameState === STATE.PLAYING) {
                gameState = STATE.PAUSED;
                menuSelection = 0;
            } else if (gameState === STATE.PAUSED) {
                gameState = STATE.PLAYING;
            }
        }
        
        // ============================================
        // UPDATE FUNCTIONS
        // ============================================
        
        function update() {
            // Handle input
            handleInput();
            
            if (gameState === STATE.PLAYING) {
                updateGame();
            }
            
            // Update particles
            updateParticles();
            
            // Update sizzle particles
            updateSizzleParticles();
        }
        
        function handleInput() {
            // A button - Serve
            if (inputState.A) {
                inputState.A = false;
                if (gameState === STATE.PLAYING) {
                    serveSteak();
                } else if (gameState === STATE.PAUSED) {
                    selectMenuOption();
                } else if (gameState === STATE.MENU || gameState === STATE.GAME_OVER) {
                    initGame();
                }
            }
            
            // B button - Flip
            if (inputState.B) {
                inputState.B = false;
                if (gameState === STATE.PLAYING) {
                    flipSteak();
                }
            }
            
            // L button - Salt
            if (inputState.L) {
                inputState.L = false;
                if (gameState === STATE.PLAYING) {
                    addSalt();
                }
            }
            
            // R button - Pepper
            if (inputState.R) {
                inputState.R = false;
                if (gameState === STATE.PLAYING) {
                    addPepper();
                }
            }
            
            // START button - Pause
            if (inputState.START) {
                inputState.START = false;
                if (gameState === STATE.PLAYING || gameState === STATE.PAUSED) {
                    togglePause();
                }
            }
            
            // Menu navigation
            if (gameState === STATE.PAUSED) {
                if (inputState.UP) {
                    inputState.UP = false;
                    menuSelection = (menuSelection - 1 + menuOptions.length) % menuOptions.length;
                    playSound('select');
                }
                if (inputState.DOWN) {
                    inputState.DOWN = false;
                    menuSelection = (menuSelection + 1) % menuOptions.length;
                    playSound('select');
                }
            }
        }
        
        function selectMenuOption() {
            playSound('select');
            switch(menuSelection) {
                case 0: // Resume
                    gameState = STATE.PLAYING;
                    break;
                case 1: // Mute toggle
                    audioMuted = !audioMuted;
                    menuOptions[1] = audioMuted ? 'Unmute Audio' : 'Mute Audio';
                    break;
                case 2: // Back to selector
                    parent.postMessage({type: 'navigate', destination: 'selector'}, '*');
                    break;
            }
        }
        
        function updateGame() {
            // Update steak temperature
            if (steak.currentSide === 'A') {
                steak.sideACooked += cookingSpeed;
                steak.temp = steak.sideACooked;
            } else {
                steak.sideBCooked += cookingSpeed;
                steak.temp = steak.sideBCooked;
            }
            
            // Clamp temperature
            steak.temp = Math.min(120, steak.temp);
            
            // Create sizzle particles
            if (Math.random() < 0.3) {
                sizzleParticles.push({
                    x: steak.x + Math.random() * steak.width - steak.width/2,
                    y: steak.y + Math.random() * steak.height - steak.height/2,
                    vy: -Math.random() * 2 - 0.5,
                    life: 20 + Math.random() * 20,
                    size: Math.random() * 3 + 1
                });
            }
            
            // Play sizzle sound occasionally
            if (Math.random() < 0.05) {
                playSound('sizzle');
            }
            
            // Decrease order display time
            if (orderDisplayTime > 0) {
                orderDisplayTime--;
            }
            
            // Check for burnt
            if (steak.temp >= 115) {
                // Visual warning - steak is about to burn
            }
        }
        
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // gravity
                p.life--;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        function updateSizzleParticles() {
            for (let i = sizzleParticles.length - 1; i >= 0; i--) {
                const p = sizzleParticles[i];
                p.y += p.vy;
                p.life--;
                
                if (p.life <= 0) {
                    sizzleParticles.splice(i, 1);
                }
            }
        }
        
        // ============================================
        // RENDER FUNCTIONS
        // ============================================
        
        function render() {
            // Clear canvas
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            // Draw grill background
            drawGrill();
            
            switch(gameState) {
                case STATE.MENU:
                    renderMenu();
                    break;
                case STATE.PLAYING:
                    renderGame();
                    break;
                case STATE.PAUSED:
                    renderGame();
                    renderPauseMenu();
                    break;
                case STATE.GAME_OVER:
                    renderGame();
                    renderGameOver();
                    break;
            }
        }
        
        function drawGrill() {
            // Grill bars
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 3;
            for (let i = 0; i < HEIGHT; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(WIDTH, i);
                ctx.stroke();
            }
            
            // Grill glow underneath
            const gradient = ctx.createRadialGradient(240, 160, 0, 240, 160, 200);
            gradient.addColorStop(0, 'rgba(255, 100, 50, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 100, 50, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }
        
        function renderMenu() {
            // Title
            ctx.fillStyle = '#FF6B35';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('PERFECT STEAK', WIDTH/2, 100);
            
            // Subtitle
            ctx.fillStyle = '#FFF';
            ctx.font = '18px Arial';
            ctx.fillText('Timing-based Cooking Game', WIDTH/2, 140);
            
            // Instructions
            ctx.font = '14px Arial';
            ctx.fillStyle = '#AAA';
            ctx.fillText('Cook the steak to customer order', WIDTH/2, 180);
            ctx.fillText('A: Serve | B: Flip | L: Salt | R: Pepper', WIDTH/2, 200);
            
            // Press to start
            ctx.fillStyle = '#FF6B35';
            ctx.font = 'bold 20px Arial';
            const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillText('Press A to Start', WIDTH/2, 260);
            ctx.globalAlpha = 1;
        }
        
        function renderGame() {
            // Draw steak
            drawSteak();
            
            // Draw particles
            drawParticles();
            
            // Draw sizzle particles
            drawSizzleParticles();
            
            // Draw UI
            drawUI();
            
            // Draw color meter
            drawColorMeter();
            
            // Draw order
            if (orderDisplayTime > 0) {
                drawOrder();
            }
        }
        
        function drawSteak() {
            const steakColor = getSteakColor();
            
            ctx.save();
            ctx.translate(steak.x, steak.y);
            
            // Steak shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(5, 5, steak.width/2, steak.height/2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Steak body
            ctx.fillStyle = steakColor;
            ctx.beginPath();
            ctx.ellipse(0, 0, steak.width/2, steak.height/2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Steak border
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Grill marks
            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.lineWidth = 3;
            for (let i = -30; i < 30; i += 15) {
                ctx.beginPath();
                ctx.moveTo(i, -25);
                ctx.lineTo(i + 10, 25);
                ctx.stroke();
            }
            
            // Salt particles
            if (steak.salted) {
                ctx.fillStyle = '#FFF';
                for (let i = 0; i < 8; i++) {
                    const sx = (Math.sin(i * 1.5) * 30);
                    const sy = (Math.cos(i * 2) * 20);
                    ctx.fillRect(sx, sy, 3, 3);
                }
            }
            
            // Pepper particles
            if (steak.peppered) {
                ctx.fillStyle = '#333';
                for (let i = 0; i < 8; i++) {
                    const px = (Math.cos(i * 1.3) * 28);
                    const py = (Math.sin(i * 1.7) * 18);
                    ctx.fillRect(px, py, 3, 3);
                }
            }
            
            // Flip indicator
            if (steak.flipped) {
                ctx.fillStyle = '#FF6B35';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('SIDE B', 0, -50);
            }
            
            ctx.restore();
        }
        
        function drawParticles() {
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 60;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        
        function drawSizzleParticles() {
            for (let p of sizzleParticles) {
                ctx.fillStyle = `rgba(255, 200, 100, ${p.life / 40})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawUI() {
            // Score
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Score: ${score}`, 10, 30);
            
            // Round
            ctx.fillText(`Round: ${round}`, 10, 55);
            
            // Strikes
            ctx.fillStyle = '#FF4444';
            ctx.textAlign = 'right';
            let strikesText = 'Strikes: ';
            for (let i = 0; i < maxStrikes; i++) {
                strikesText += i < strikes ? 'X ' : 'O ';
            }
            ctx.fillText(strikesText, WIDTH - 10, 30);
            
            // Seasoning indicators
            ctx.textAlign = 'left';
            ctx.font = '14px Arial';
            ctx.fillStyle = steak.salted ? '#00FF00' : '#666';
            ctx.fillText('SALT [L]', 10, HEIGHT - 40);
            ctx.fillStyle = steak.peppered ? '#00FF00' : '#666';
            ctx.fillText('PEPPER [R]', 10, HEIGHT - 20);
        }
        
        function drawColorMeter() {
            const meterX = 280;
            const meterY = 20;
            const meterWidth = 180;
            const meterHeight = 25;
            
            // Meter background
            ctx.fillStyle = '#333';
            ctx.fillRect(meterX, meterY, meterWidth, meterHeight);
            
            // Draw doneness zones
            let currentX = meterX;
            for (let level of DONENESS_LEVELS) {
                const zoneWidth = (level.tempMax - level.tempMin) / 120 * meterWidth;
                ctx.fillStyle = level.color;
                ctx.fillRect(currentX, meterY, zoneWidth, meterHeight);
                currentX += zoneWidth;
            }
            
            // Meter border
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.strokeRect(meterX, meterY, meterWidth, meterHeight);
            
            // Target indicator
            if (targetDoneness) {
                const targetX = meterX + (targetDoneness.tempMin + (targetDoneness.tempMax - targetDoneness.tempMin) / 2) / 120 * meterWidth;
                ctx.fillStyle = '#00FF00';
                ctx.beginPath();
                ctx.moveTo(targetX, meterY - 8);
                ctx.lineTo(targetX - 6, meterY - 15);
                ctx.lineTo(targetX + 6, meterY - 15);
                ctx.closePath();
                ctx.fill();
            }
            
            // Current temperature indicator
            const currentTemp = steak.currentSide === 'A' ? steak.sideACooked : steak.sideBCooked;
            const indicatorX = meterX + (currentTemp / 120) * meterWidth;
            ctx.fillStyle = '#FFF';
            ctx.fillRect(indicatorX - 2, meterY - 3, 4, meterHeight + 6);
            
            // Current doneness label
            const currentDoneness = getCurrentDoneness();
            ctx.fillStyle = '#FFF';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(currentDoneness.name, meterX + meterWidth/2, meterY + meterHeight + 15);
        }
        
        function drawOrder() {
            const alpha = Math.min(1, orderDisplayTime / 30);
            ctx.save();
            ctx.globalAlpha = alpha;
            
            // Order box
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(WIDTH/2 - 120, HEIGHT/2 - 40, 240, 80);
            ctx.strokeStyle = '#FF6B35';
            ctx.lineWidth = 3;
            ctx.strokeRect(WIDTH/2 - 120, HEIGHT/2 - 40, 240, 80);
            
            // Order text
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('CUSTOMER ORDER:', WIDTH/2, HEIGHT/2 - 15);
            
            ctx.fillStyle = targetDoneness.color;
            ctx.font = 'bold 28px Arial';
            ctx.fillText(targetDoneness.name, WIDTH/2, HEIGHT/2 + 20);
            
            ctx.restore();
        }
        
        function renderPauseMenu() {
            // Darken background
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            // Menu box
            ctx.fillStyle = '#222';
            ctx.fillRect(WIDTH/2 - 100, HEIGHT/2 - 80, 200, 160);
            ctx.strokeStyle = '#FF6B35';
            ctx.lineWidth = 3;
            ctx.strokeRect(WIDTH/2 - 100, HEIGHT/2 - 80, 200, 160);
            
            // Menu title
            ctx.fillStyle = '#FF6B35';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('PAUSED', WIDTH/2, HEIGHT/2 - 50);
            
            // Menu options
            ctx.font = '16px Arial';
            for (let i = 0; i < menuOptions.length; i++) {
                if (i === menuSelection) {
                    ctx.fillStyle = '#FF6B35';
                    ctx.fillText('> ' + menuOptions[i] + ' <', WIDTH/2, HEIGHT/2 - 15 + i * 30);
                } else {
                    ctx.fillStyle = '#FFF';
                    ctx.fillText(menuOptions[i], WIDTH/2, HEIGHT/2 - 15 + i * 30);
                }
            }
        }
        
        function renderGameOver() {
            // Darken background
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            // Game Over box
            ctx.fillStyle = '#222';
            ctx.fillRect(WIDTH/2 - 130, HEIGHT/2 - 100, 260, 200);
            ctx.strokeStyle = '#FF4444';
            ctx.lineWidth = 3;
            ctx.strokeRect(WIDTH/2 - 130, HEIGHT/2 - 100, 260, 200);
            
            // Game Over text
            ctx.fillStyle = '#FF4444';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', WIDTH/2, HEIGHT/2 - 50);
            
            // Final score
            ctx.fillStyle = '#FFF';
            ctx.font = '20px Arial';
            ctx.fillText(`Final Score: ${score}`, WIDTH/2, HEIGHT/2 - 10);
            ctx.fillText(`Rounds Completed: ${round - 1}`, WIDTH/2, HEIGHT/2 + 20);
            
            // Press to restart
            ctx.fillStyle = '#FF6B35';
            ctx.font = 'bold 16px Arial';
            const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillText('Press A to Play Again', WIDTH/2, HEIGHT/2 + 70);
            ctx.globalAlpha = 1;
        }
        
        // ============================================
        // MAIN LOOP
        // ============================================
        
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }
        
        // ============================================
        // POSTMESSAGE API
        // ============================================
        
        window.addEventListener('message', (e) => {
            const {type, button, state} = e.data;
            if (type === 'button' && button in inputState) {
                inputState[button] = state;
            }
            if (type === 'mute') {
                audioMuted = true;
            }
            if (type === 'unmute') {
                audioMuted = false;
            }
        });
        
        function reportScore(score) {
            parent.postMessage({type: 'score', value: score}, '*');
        }
        
        function saveGameState() {
            localStorage.setItem('munchboy_save_perfectsteak', JSON.stringify({
                score: score,
                round: round,
                timestamp: Date.now()
            }));
        }
        
        function loadGameState() {
            const saved = localStorage.getItem('munchboy_save_perfectsteak');
            if (saved) {
                return JSON.parse(saved);
            }
            return null;
        }
        
        // ============================================
        // KEYBOARD CONTROLS (for testing)
        // ============================================
        
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'z':
                case 'a':
                    inputState.A = true;
                    break;
                case 'x':
                case 'b':
                    inputState.B = true;
                    break;
                case 'q':
                case 'l':
                    inputState.L = true;
                    break;
                case 'w':
                case 'r':
                    inputState.R = true;
                    break;
                case 'Enter':
                    inputState.START = true;
                    break;
                case 'ArrowUp':
                    inputState.UP = true;
                    break;
                case 'ArrowDown':
                    inputState.DOWN = true;
                    break;
            }
        });
        
        window.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'z':
                case 'a':
                    inputState.A = false;
                    break;
                case 'x':
                case 'b':
                    inputState.B = false;
                    break;
                case 'q':
                case 'l':
                    inputState.L = false;
                    break;
                case 'w':
                case 'r':
                    inputState.R = false;
                    break;
                case 'Enter':
                    inputState.START = false;
                    break;
                case 'ArrowUp':
                    inputState.UP = false;
                    break;
                case 'ArrowDown':
                    inputState.DOWN = false;
                    break;
            }
        });
        
        // ============================================
        // START GAME
        // ============================================
        
        // Check for saved game
        const savedGame = loadGameState();
        if (savedGame) {
            console.log('Saved game found:', savedGame);
        }
        
        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
