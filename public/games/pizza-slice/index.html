<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pizza Slice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { 
            background: #1a1a2e; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #gameCanvas { 
            background: linear-gradient(180deg, #87CEEB 0%, #F4E4C1 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: #333;
            font-weight: bold;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div id="ui">SCORE: <span id="score">0</span> | STREAK: <span id="streak">0</span></div>
    <div id="gameOver">
        <h2>PIZZA TIME!</h2>
        <p>Score: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">SLICE AGAIN</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'playing';
let score = 0;
let streak = 0;
let pizzas = [];
let slices = [];

class Pizza {
    constructor() {
        this.x = 240;
        this.y = 160;
        this.radius = 80;
        this.rotation = 0;
        this.targetRotation = Math.random() * Math.PI * 2;
        this.isSpinning = true;
        this.toppings = this.generateToppings();
    }

    generateToppings() {
        const toppings = [];
        for (let i = 0; i < 8; i++) {
            const angle = (Math.PI * 2 / 8) * i + Math.random() * 0.5;
            const dist = Math.random() * 50 + 10;
            toppings.push({
                x: Math.cos(angle) * dist,
                y: Math.sin(angle) * dist,
                type: ['🍄', '🍖', '🫑', '🍅'][Math.floor(Math.random() * 4)]
            });
        }
        return toppings;
    }

    update() {
        if (this.isSpinning) {
            this.rotation += 0.02 + (streak * 0.005);
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Pizza base
        ctx.fillStyle = '#F4A460';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#D2691E';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Cheese
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius - 5, 0, Math.PI * 2);
        ctx.fill();

        // Sauce
        ctx.fillStyle = '#DC2626';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius - 10, 0, Math.PI * 2);
        ctx.fill();

        // Toppings
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        this.toppings.forEach(t => {
            ctx.fillText(t.type, t.x, t.y);
        });

        // Slice lines
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 2;
        for (let i = 0; i < 8; i++) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(i * Math.PI / 4) * this.radius, Math.sin(i * Math.PI / 4) * this.radius);
            ctx.stroke();
        }

        ctx.restore();

        // Target indicator
        ctx.strokeStyle = 'rgba(255,0,0,0.5)';
        ctx.lineWidth = 4;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + 10, this.targetRotation, this.targetRotation + Math.PI / 4);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    slice() {
        this.isSpinning = false;
        const diff = Math.abs(this.rotation % (Math.PI * 2) - this.targetRotation);
        const accuracy = Math.min(diff, Math.PI * 2 - diff);
        
        if (accuracy < 0.3) {
            // Perfect slice
            score += 100 + (streak * 20);
            streak++;
            return 'perfect';
        } else if (accuracy < 0.6) {
            // Good slice
            score += 50;
            streak = Math.max(0, streak - 1);
            return 'good';
        } else {
            // Miss
            streak = 0;
            return 'miss';
        }
    }
}

let currentPizza = new Pizza();

function gameLoop() {
    if (gameState === 'paused') return;
    
    ctx.clearRect(0, 0, 480, 320);
    
    // Background table
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, 200, 480, 120);
    
    currentPizza.update();
    currentPizza.draw();
    
    document.getElementById('score').textContent = score;
    document.getElementById('streak').textContent = streak;
    
    requestAnimationFrame(gameLoop);
}

function handleInput() {
    if (gameState !== 'playing') return;
    
    const result = currentPizza.slice();
    
    if (result === 'miss' && streak === 0) {
        // Game over on miss with no streak
        gameOver();
        return;
    }
    
    window.parent.postMessage({ type: 'SCORE', score: score }, '*');
    
    // New pizza after delay
    setTimeout(() => {
        currentPizza = new Pizza();
    }, 500);
}

function gameOver() {
    gameState = 'gameover';
    document.getElementById('finalScore').textContent = score;
    document.getElementById('gameOver').style.display = 'block';
    window.parent.postMessage({ type: 'GAME_OVER', score: score }, '*');
}

function resetGame() {
    score = 0;
    streak = 0;
    currentPizza = new Pizza();
    gameState = 'playing';
    document.getElementById('gameOver').style.display = 'none';
}

// Controls
canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInput();
});
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') handleInput();
});

// PostMessage API
window.addEventListener('message', (e) => {
    switch(e.data.type) {
        case 'PAUSE': gameState = 'paused'; break;
        case 'RESUME': gameState = 'playing'; gameLoop(); break;
        case 'SAVE_STATE': localStorage.setItem('pizzaSlice_state', JSON.stringify({score, streak})); break;
        case 'LOAD_STATE':
            const saved = localStorage.getItem('pizzaSlice_state');
            if (saved) { const data = JSON.parse(saved); score = data.score; streak = data.streak; }
            break;
    }
});

gameLoop();
</script>
</body>
</html>
