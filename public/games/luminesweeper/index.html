<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Luminesweeper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { 
            background: #0a0a0a; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #gameCanvas { 
            image-rendering: pixelated;
            box-shadow: 0 0 30px rgba(0,255,255,0.3);
            max-width: 100%;
            max-height: 70vh;
        }
        #demoScreen {
            position: absolute;
            width: 480px;
            height: 320px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ffff;
            text-align: center;
        }
        #demoScreen h1 {
            font-size: 32px;
            text-shadow: 0 0 20px rgba(0,255,255,0.8);
            margin-bottom: 20px;
        }
        #demoScreen .grid {
            display: grid;
            grid-template-columns: repeat(4, 40px);
            gap: 5px;
            margin: 20px 0;
        }
        #demoScreen .cell {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            opacity: 0.8;
            animation: pulse 2s infinite;
        }
        #demoScreen .cell:nth-child(2) { animation-delay: 0.2s; }
        #demoScreen .cell:nth-child(3) { animation-delay: 0.4s; }
        #demoScreen .cell:nth-child(4) { animation-delay: 0.6s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        #demoScreen .info {
            font-size: 12px;
            color: #888;
            margin-top: 20px;
        }
        #demoScreen .controls {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ffff;
            font-size: 12px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: none;
        }
        #instructions {
            color: #666;
            font-size: 11px;
            margin-top: 10px;
            text-align: center;
        }
        #loading {
            position: absolute;
            color: #00ffff;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="demoScreen">
        <h1>LUMINESWEEPER</h1>
        <div class="grid">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="info">128KB • XM/MOD Music • Puzzle</div>
        <div class="controls">A=PLACE • B=FLAG • SELECT=EXIT</div>
    </div>
    
    <div id="loading">LOADING...</div>
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="instructions">A=PLACE • B=FLAG • SELECT=EXIT</div>

<script type="module">
import mGBA from 'https://cdn.jsdelivr.net/npm/@thenick775/mgba-wasm@2.4.1/dist/mgba-wasm.min.js';

const canvas = document.getElementById('gameCanvas');
const demoScreen = document.getElementById('demoScreen');
const loading = document.getElementById('loading');
const ui = document.getElementById('ui');
let score = 0;
let emulator = null;
let hasROM = false;

async function checkROM() {
    try {
        const response = await fetch('luminesweeper.gba', { method: 'HEAD' });
        if (response.ok) {
            hasROM = true;
            demoScreen.style.display = 'none';
            loading.style.display = 'block';
            initEmulator();
        }
    } catch (e) {
        // No ROM - stay in demo mode
        console.log('Demo mode: luminesweeper.gba not found');
    }
}

async function initEmulator() {
    try {
        const Module = await mGBA({ canvas });
        await Module.FSInit();
        
        const romData = await fetch('luminesweeper.gba').then(r => r.arrayBuffer());
        Module.FS.writeFile('/luminesweeper.gba', new Uint8Array(romData));
        
        Module.loadGame('/luminesweeper.gba');
        Module.run();
        
        emulator = Module;
        loading.style.display = 'none';
        ui.style.display = 'block';
        
    } catch (err) {
        loading.innerHTML = `<div style="color: #ff6666;">ERROR: ${err.message}</div>`;
    }
}

function exitGame() {
    if (emulator) emulator.pause();
    window.parent.postMessage({ type: 'GAME_EXIT', gameId: 'luminesweeper' }, '*');
}

// PostMessage API - works in demo mode too
window.addEventListener('message', (e) => {
    switch(e.data.type) {
        case 'BUTTON_PRESS':
            if (e.data.button === 'select') {
                exitGame();
                return;
            }
            if (!emulator) return;
            
            switch(e.data.button) {
                case 'dpad-up': emulator.buttonPress(6); break;
                case 'dpad-down': emulator.buttonPress(7); break;
                case 'dpad-left': emulator.buttonPress(5); break;
                case 'dpad-right': emulator.buttonPress(4); break;
                case 'a': emulator.buttonPress(0); break;
                case 'b': emulator.buttonPress(1); break;
                case 'start': emulator.buttonPress(3); break;
            }
            break;
        case 'PAUSE':
            if (emulator) emulator.pause();
            break;
        case 'RESUME':
            if (emulator) emulator.resume();
            break;
    }
});

checkROM();
</script>
</body>
</html>
