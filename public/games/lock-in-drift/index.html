<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lock-In Drift</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0a0f;
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
canvas {
  display: block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════
// TUNING VALUES
// ═══════════════════════════════════════════════════════════════
const CANVAS_W = 360;
const CANVAS_H = 640;

// Lock bar
const LOCK_BAR_WIDTH = 40;
const LOCK_BAR_HEIGHT = 12;
const LOCK_BAR_Y = 100;
const LOCK_BAR_MIN_X = 40;
const LOCK_BAR_MAX_X = CANVAS_W - 40;
const LOCK_BAR_BASE_SPEED = 180; // pixels per second

// Safe column
const SAFE_COLUMN_BASE_WIDTH = 60;
const SAFE_COLUMN_MIN_WIDTH = 20;
const SAFE_COLUMN_WIDTH_DECREASE = 3; // per success
const SAFE_COLUMN_HEIGHT = 400;
const SAFE_COLUMN_Y = 120;

// Jitter (before lock only)
const SAFE_COLUMN_BASE_JITTER = 0;
const SAFE_COLUMN_JITTER_INCREASE = 0.3; // per success
const SAFE_COLUMN_MAX_JITTER = 25;
const JITTER_SPEED = 4; // oscillation speed

// Drift
const DRIFT_BASE_SPEED = 100; // pixels per second
const DRIFT_SPEED_INCREASE = 8; // per success
const DRIFT_MAX_SPEED = 400;

// Fail line
const FAIL_LINE_Y = 540;
const FAIL_LINE_HEIGHT = 6;

// Round timing
const ROUND_BASE_DELAY = 800; // ms between rounds
const ROUND_DELAY_DECREASE = 30; // ms per success
const ROUND_MIN_DELAY = 200;

// Visual motion cues
const ARROW_COUNT = 5;
const ARROW_SPACING = 80;

// Colors
const COLOR_BG = '#0d1117';
const COLOR_LOCK_BAR = '#58a6ff';
const COLOR_LOCK_BAR_LOCKED = '#f0883e';
const COLOR_SAFE_COLUMN = '#238636';
const COLOR_FAIL_LINE = '#f85149';
const COLOR_ARROW = '#21262d';
const COLOR_SCORE = '#c9d1d9';

// ═══════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════
let canvas, ctx, dpr;
let score = 0;
let locked = false;
let lockBarX = CANVAS_W / 2;
let lockBarDir = 1;
let driftY = 0;
let safeColumnX = CANVAS_W / 2;
let safeColumnWidth = SAFE_COLUMN_BASE_WIDTH;
let driftSpeed = DRIFT_BASE_SPEED;
let jitterAmount = SAFE_COLUMN_BASE_JITTER;
let roundDelay = ROUND_BASE_DELAY;
let jitterPhase = 0;
let arrowOffset = 0;
let gameState = 'playing'; // 'playing', 'resolving', 'waiting'
let lastTime = 0;

// ═══════════════════════════════════════════════════════════════
// INITIALIZATION
// ═══════════════════════════════════════════════════════════════
function init() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  
  dpr = window.devicePixelRatio || 1;
  canvas.width = CANVAS_W * dpr;
  canvas.height = CANVAS_H * dpr;
  canvas.style.width = CANVAS_W + 'px';
  canvas.style.height = CANVAS_H + 'px';
  ctx.scale(dpr, dpr);
  
  resetRound();
  
  canvas.addEventListener('pointerdown', onTap);
  document.addEventListener('keydown', onKey);
  
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function resetRound() {
  locked = false;
  driftY = 0;
  lockBarX = CANVAS_W / 2;
  lockBarDir = Math.random() < 0.5 ? 1 : -1;
  
  // Calculate current difficulty
  safeColumnWidth = Math.max(SAFE_COLUMN_MIN_WIDTH, SAFE_COLUMN_BASE_WIDTH - score * SAFE_COLUMN_WIDTH_DECREASE);
  driftSpeed = Math.min(DRIFT_MAX_SPEED, DRIFT_BASE_SPEED + score * DRIFT_SPEED_INCREASE);
  jitterAmount = Math.min(SAFE_COLUMN_MAX_JITTER, SAFE_COLUMN_BASE_JITTER + score * SAFE_COLUMN_JITTER_INCREASE);
  roundDelay = Math.max(ROUND_MIN_DELAY, ROUND_BASE_DELAY - score * ROUND_DELAY_DECREASE);
  
  // Center safe column with bounds check
  const minX = safeColumnWidth / 2 + jitterAmount + 20;
  const maxX = CANVAS_W - safeColumnWidth / 2 - jitterAmount - 20;
  safeColumnX = minX + (maxX - minX) * (0.3 + Math.random() * 0.4);
  
  jitterPhase = Math.random() * Math.PI * 2;
  gameState = 'playing';
}

function fullReset() {
  score = 0;
  resetRound();
}

// ═══════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════
function onTap(e) {
  e.preventDefault();
  handleInput();
}

function onKey(e) {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    handleInput();
  }
}

function handleInput() {
  if (gameState === 'playing' && !locked) {
    locked = true;
  } else if (gameState === 'waiting') {
    if (score === 0) {
      // Failed, restart
      fullReset();
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════════
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  
  update(dt);
  render();
  
  requestAnimationFrame(loop);
}

function update(dt) {
  // Update arrow animation
  arrowOffset = (arrowOffset + driftSpeed * dt * 0.5) % ARROW_SPACING;
  
  if (gameState === 'playing') {
    // Update jitter phase
    jitterPhase += JITTER_SPEED * dt;
    
    if (!locked) {
      // Move lock bar horizontally
      lockBarX += lockBarDir * LOCK_BAR_BASE_SPEED * dt;
      
      // Bounce off bounds
      if (lockBarX >= LOCK_BAR_MAX_X) {
        lockBarX = LOCK_BAR_MAX_X;
        lockBarDir = -1;
      } else if (lockBarX <= LOCK_BAR_MIN_X) {
        lockBarX = LOCK_BAR_MIN_X;
        lockBarDir = 1;
      }
    } else {
      // Locked: drift downward
      driftY += driftSpeed * dt;
      
      // Check resolution
      if (driftY >= FAIL_LINE_Y - LOCK_BAR_Y) {
        resolve();
      }
    }
  }
}

function resolve() {
  gameState = 'resolving';
  
  // Get safe column position at resolution (no jitter after lock)
  const columnLeft = safeColumnX - safeColumnWidth / 2;
  const columnRight = safeColumnX + safeColumnWidth / 2;
  const barLeft = lockBarX - LOCK_BAR_WIDTH / 2;
  const barRight = lockBarX + LOCK_BAR_WIDTH / 2;
  
  // Check overlap
  const overlaps = barRight > columnLeft && barLeft < columnRight;
  
  if (overlaps) {
    // Success
    score++;
    setTimeout(() => {
      resetRound();
    }, roundDelay);
  } else {
    // Failure
    score = 0;
    gameState = 'waiting';
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════════════
function render() {
  // Clear
  ctx.fillStyle = COLOR_BG;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  
  // Draw drift arrows (motion cues)
  drawArrows();
  
  // Calculate safe column jitter (only when not locked)
  let displayColumnX = safeColumnX;
  if (!locked && jitterAmount > 0) {
    displayColumnX = safeColumnX + Math.sin(jitterPhase) * jitterAmount;
  }
  
  // Draw safe column
  ctx.fillStyle = COLOR_SAFE_COLUMN;
  ctx.fillRect(
    displayColumnX - safeColumnWidth / 2,
    SAFE_COLUMN_Y,
    safeColumnWidth,
    SAFE_COLUMN_HEIGHT
  );
  
  // Draw fail line
  ctx.fillStyle = COLOR_FAIL_LINE;
  ctx.fillRect(0, FAIL_LINE_Y, CANVAS_W, FAIL_LINE_HEIGHT);
  
  // Draw lock bar
  const barY = LOCK_BAR_Y + driftY;
  ctx.fillStyle = locked ? COLOR_LOCK_BAR_LOCKED : COLOR_LOCK_BAR;
  ctx.fillRect(
    lockBarX - LOCK_BAR_WIDTH / 2,
    barY - LOCK_BAR_HEIGHT / 2,
    LOCK_BAR_WIDTH,
    LOCK_BAR_HEIGHT
  );
  
  // Draw score
  ctx.fillStyle = COLOR_SCORE;
  ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(score.toString(), CANVAS_W / 2, 30);
}

function drawArrows() {
  ctx.fillStyle = COLOR_ARROW;
  
  const arrowWidth = 20;
  const arrowHeight = 12;
  const centerX = CANVAS_W / 2;
  
  for (let i = 0; i < ARROW_COUNT; i++) {
    const baseY = 150 + i * ARROW_SPACING + arrowOffset;
    if (baseY < FAIL_LINE_Y - 20 && baseY > 130) {
      // Draw downward arrow
      ctx.beginPath();
      ctx.moveTo(centerX, baseY + arrowHeight);
      ctx.lineTo(centerX - arrowWidth / 2, baseY);
      ctx.lineTo(centerX + arrowWidth / 2, baseY);
      ctx.closePath();
      ctx.fill();
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════════════
init();
</script>
</body>
</html>
