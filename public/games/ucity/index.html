<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>μCity</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { 
            background: #0a1a0a; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #gameCanvas { 
            image-rendering: pixelated;
            box-shadow: 0 0 30px rgba(0,255,128,0.3);
            max-width: 100%;
            max-height: 70vh;
        }
        #demoScreen {
            position: absolute;
            width: 480px;
            height: 320px;
            background: #0a1a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ff80;
            text-align: center;
        }
        #demoScreen h1 {
            font-size: 42px;
            text-shadow: 0 0 15px rgba(0,255,128,0.8);
            margin-bottom: 20px;
        }
        #demoScreen .city {
            display: grid;
            grid-template-columns: repeat(5, 25px);
            gap: 2px;
            margin: 20px 0;
        }
        #demoScreen .tile {
            width: 25px;
            height: 25px;
            background: #1a3a1a;
            border: 1px solid #00ff8044;
        }
        #demoScreen .tile.r { background: #00ff80; }
        #demoScreen .tile.c { background: #ff0; }
        #demoScreen .tile.i { background: #444; }
        #demoScreen .info {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }
        #demoScreen .controls {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
        }
        #ui, #loading { display: none; }
    </style>
</head>
<body>
    <div id="demoScreen">
        <h1>μCITY</h1>
        <div class="city">
            <div class="tile r"></div><div class="tile"></div><div class="tile c"></div><div class="tile"></div><div class="tile r"></div>
            <div class="tile"></div><div class="tile i"></div><div class="tile"></div><div class="tile c"></div><div class="tile"></div>
            <div class="tile c"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile i"></div>
            <div class="tile"></div><div class="tile r"></div><div class="tile i"></div><div class="tile"></div><div class="tile c"></div>
        </div>
        <div class="info">64KB • GBT Player • SimCity Clone</div>
        <div class="controls">A=BUILD • B=DEMOLISH • START=EXIT</div>
    </div>
    
    <div id="loading">LOADING...</div>
    <canvas id="gameCanvas" width="480" height="320"></canvas>

<script type="module">
import mGBA from 'https://cdn.jsdelivr.net/npm/@thenick775/mgba-wasm@2.4.1/dist/mgba-wasm.min.js';

const canvas = document.getElementById('gameCanvas');
const demoScreen = document.getElementById('demoScreen');
const loading = document.getElementById('loading');
let emulator = null;

const BUTTONS = { A: 0, B: 1, SELECT: 2, START: 3, RIGHT: 4, LEFT: 5, UP: 6, DOWN: 7, R: 8, L: 9 };

async function checkROM() {
    try {
        const response = await fetch('ucity.gb', { method: 'HEAD' });
        if (response.ok) {
            demoScreen.style.display = 'none';
            loading.style.display = 'block';
            initEmulator();
        }
    } catch (e) {
        console.log('Demo mode: ucity.gb not found');
    }
}

async function initEmulator() {
    try {
        const Module = await mGBA({ canvas });
        await Module.FSInit();
        const romData = await fetch('ucity.gb').then(r => r.arrayBuffer());
        Module.FS.writeFile('/ucity.gb', new Uint8Array(romData));
        Module.loadGame('/ucity.gb');
        Module.run();
        emulator = Module;
        loading.style.display = 'none';
    } catch (err) {
        loading.innerHTML = `ERROR: ${err.message}`;
    }
}

function exitGame() {
    if (emulator) emulator.pause();
    window.parent.postMessage({ type: 'GAME_EXIT', gameId: 'ucity' }, '*');
}

window.addEventListener('message', (e) => {
    switch(e.data.type) {
        case 'BUTTON_PRESS':
            // μCity uses START to exit (different from others)
            if (e.data.button === 'start') {
                exitGame();
                return;
            }
            if (!emulator) return;
            switch(e.data.button) {
                case 'dpad-up': emulator.buttonPress(BUTTONS.UP); break;
                case 'dpad-down': emulator.buttonPress(BUTTONS.DOWN); break;
                case 'dpad-left': emulator.buttonPress(BUTTONS.LEFT); break;
                case 'dpad-right': emulator.buttonPress(BUTTONS.RIGHT); break;
                case 'a': emulator.buttonPress(BUTTONS.A); break;
                case 'b': emulator.buttonPress(BUTTONS.B); break;
                case 'select': emulator.buttonPress(BUTTONS.SELECT); break;
            }
            break;
        case 'PAUSE': if (emulator) emulator.pause(); break;
        case 'RESUME': if (emulator) emulator.resume(); break;
    }
});

checkROM();
</script>
</body>
</html>
