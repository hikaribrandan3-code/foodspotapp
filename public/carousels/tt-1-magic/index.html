<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    [data-composition-id="tt-magic"] { width: 100%; height: 100%; }
    .frame { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px 40px; text-align: center; }
    .frame-1 { background: linear-gradient(135deg, #006C49 0%, #004d38 100%); }
    .frame-2 { background: #FFFFFF; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 56px; font-weight: 700; color: #FFF; line-height: 1.3; }
    .frame-2 h1 { color: #151C26; font-size: 48px; }
    .stat { font-size: 44px; font-weight: 900; color: #15803D; margin: 30px 0; }
    .app-screenshot { width: 100%; max-width: 300px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; margin: 30px auto; }
    .app-screenshot img { width: 100%; height: auto; display: block; }
    p { font-size: 18px; color: rgba(255,255,255,0.95); line-height: 1.6; margin-top: 15px; }
    .frame-2 p { color: #151C26; }
    .cta-btn { background: #15803D; color: #FFF; padding: 16px 40px; border-radius: 50px; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; border: none; margin-top: 30px; cursor: pointer; }
  </style>
</head>
<body>
  <div data-composition-id="tt-magic" data-width="1080" data-height="1920" data-start="0" data-duration="10" data-track-index="1" style="position: relative;">
    <div class="frame frame-1" id="f1">
      <h1>Tus clientes son tu mejor marketing</h1>
      <p style="font-size: 20px;">Tu cámara de contenido generador</p>
      <div class="app-screenshot">
        <img src="./foodspothomepage.png" alt="Home" />
      </div>
    </div>

    <div class="frame frame-2" id="f2" style="opacity: 0;">
      <div class="stat">71%</div>
      <h1>vuelven por un amigo</h1>
      <p>Cada foto es un nuevo cliente</p>
      <div class="app-screenshot">
        <img src="./foodspotugcrecieptmode.png" alt="UGC" />
      </div>
      <button class="cta-btn">Prueba Gratis 14 Días</button>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#f1 h1", { opacity: 0, y: 50, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.from("#f1 p", { opacity: 0, y: 30, duration: 0.6, ease: "power2.out" }, 0.8);
      tl.from("#f1 .app-screenshot", { opacity: 0, scale: 0.9, duration: 0.7, ease: "back.out" }, 1.2);

      tl.to("#f1", { opacity: 0, duration: 0.5 }, 4.5);
      tl.to("#f2", { opacity: 1, duration: 0.5 }, 4.6);
      tl.from("#f2 .stat", { opacity: 0, scale: 0.5, duration: 0.7, ease: "back.out" }, 4.8);
      tl.from("#f2 h1", { opacity: 0, y: 40, duration: 0.7, ease: "power3.out" }, 5.3);
      tl.from("#f2 p", { opacity: 0, y: 20, duration: 0.5, ease: "power2.out" }, 5.8);
      tl.from("#f2 .app-screenshot", { opacity: 0, scale: 0.9, duration: 0.7, ease: "back.out" }, 6.1);
      tl.from("#f2 .cta-btn", { opacity: 0, scale: 0.8, duration: 0.6, ease: "back.out" }, 6.7);

      window.__timelines["tt-magic"] = tl;
      document.addEventListener("DOMContentLoaded", function() { tl.play(); });
    </script>
  </div>
</body>
</html>
