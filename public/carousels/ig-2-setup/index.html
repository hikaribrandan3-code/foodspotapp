<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1350" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
    [data-composition-id="ig-setup"] { width: 100%; height: 100%; }
    .frame { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; }
    .frame-intro { background: linear-gradient(135deg, #15803D 0%, #006C49 100%); }
    .frame-step { background: #FFFFFF; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 52px; font-weight: 700; color: #FFF; line-height: 1.2; }
    .frame-step h1 { color: #151C26; font-size: 44px; }
    .step-num { font-size: 64px; font-weight: 900; color: rgba(255,255,255,0.3); margin-bottom: 10px; }
    .frame-step .step-num { color: #15803D; }
    .app-screenshot { width: 100%; max-width: 280px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); overflow: hidden; margin: 30px auto; }
    .app-screenshot img { width: 100%; height: auto; display: block; }
    p { font-size: 16px; color: rgba(255,255,255,0.9); line-height: 1.5; }
    .frame-step p { color: #151C26; }
  </style>
</head>
<body>
  <div data-composition-id="ig-setup" data-width="1080" data-height="1350" data-start="0" data-duration="14" data-track-index="1" style="position: relative;">
    <div class="frame frame-intro" id="intro">
      <h1>3 pasos para empezar</h1>
      <p style="font-size: 20px; margin-top: 20px;">100% sin código</p>
    </div>

    <div class="frame frame-step" id="step1" style="opacity: 0;">
      <div class="step-num">1</div>
      <h1>Tu menú</h1>
      <p>Crea en segundos</p>
      <div class="app-screenshot">
        <img src="./foodspotcustomermenu.png" alt="Step 1: Menu" />
      </div>
    </div>

    <div class="frame frame-step" id="step2" style="opacity: 0;">
      <div class="step-num">2</div>
      <h1>Configura pagos</h1>
      <p>Recibe el 100%</p>
      <div class="app-screenshot">
        <img src="./foodspotcheckoutpage.png" alt="Step 2: Payments" />
      </div>
    </div>

    <div class="frame frame-step" id="step3" style="opacity: 0;">
      <div class="step-num">3</div>
      <h1>¡Vende!</h1>
      <p>Comienza a recibir pedidos</p>
      <div class="app-screenshot">
        <img src="./foodspotugcrecieptmode.png" alt="Step 3: Receipt" />
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#intro h1", { opacity: 0, y: 40, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.from("#intro p", { opacity: 0, y: 20, duration: 0.5, ease: "power2.out" }, 0.6);

      tl.to("#intro", { opacity: 0, duration: 0.4 }, 3.0);
      tl.to("#step1", { opacity: 1, duration: 0.5 }, 3.1);
      tl.from("#step1 .step-num", { opacity: 0, scale: 0.5, duration: 0.5, ease: "back.out" }, 3.3);
      tl.from("#step1 h1", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 3.6);
      tl.from("#step1 .app-screenshot", { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" }, 4.0);

      tl.to("#step1", { opacity: 0, duration: 0.4 }, 5.8);
      tl.to("#step2", { opacity: 1, duration: 0.5 }, 5.9);
      tl.from("#step2 .step-num", { opacity: 0, scale: 0.5, duration: 0.5, ease: "back.out" }, 6.1);
      tl.from("#step2 h1", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 6.4);
      tl.from("#step2 .app-screenshot", { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" }, 6.8);

      tl.to("#step2", { opacity: 0, duration: 0.4 }, 8.6);
      tl.to("#step3", { opacity: 1, duration: 0.5 }, 8.7);
      tl.from("#step3 .step-num", { opacity: 0, scale: 0.5, duration: 0.5, ease: "back.out" }, 8.9);
      tl.from("#step3 h1", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 9.2);
      tl.from("#step3 .app-screenshot", { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" }, 9.6);

      window.__timelines["ig-setup"] = tl;
      document.addEventListener("DOMContentLoaded", function() { tl.play(); });
    </script>
  </div>
</body>
</html>
