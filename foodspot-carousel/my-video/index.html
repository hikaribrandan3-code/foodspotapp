<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #000; }
      [data-composition-id="main"] { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="10" data-track-index="1">
      <!-- IG-1: UGC Features -->
      <div id="ig-ugc-comp" data-composition-id="ig-ugc" data-composition-src="compositions/ig-ugc-features.html" data-start="0" data-duration="10" data-track-index="1" data-width="1080" data-height="1350" style="display: none;"></div>

      <!-- IG-2: 3-Step Setup -->
      <div id="ig-3step-comp" data-composition-id="ig-3step" data-composition-src="compositions/ig-3step-setup.html" data-start="0" data-duration="14" data-track-index="1" data-width="1080" data-height="1350" style="display: none;"></div>

      <!-- IG-3: Free Trial -->
      <div id="ig-trial-comp" data-composition-id="ig-trial" data-composition-src="compositions/ig-free-trial.html" data-start="0" data-duration="10" data-track-index="1" data-width="1080" data-height="1350" style="display: none;"></div>

      <!-- TT-1: UGC Magic -->
      <div id="tt-ugc-comp" data-composition-id="tt-ugc" data-composition-src="compositions/tt-ugc-magic.html" data-start="0" data-duration="10" data-track-index="1" data-width="1080" data-height="1920" style="display: none;"></div>

      <!-- TT-2: Testimonials -->
      <div id="tt-testi-comp" data-composition-id="tt-testimonials" data-composition-src="compositions/tt-testimonials.html" data-start="0" data-duration="13" data-track-index="1" data-width="1080" data-height="1920" style="display: none;"></div>

      <!-- TT-3: CTA -->
      <div id="tt-cta-comp" data-composition-id="tt-cta" data-composition-src="compositions/tt-cta-final.html" data-start="0" data-duration="10" data-track-index="1" data-width="1080" data-height="1920" style="display: none;"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
