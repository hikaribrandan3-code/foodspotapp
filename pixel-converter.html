<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pixel Art Converter - 34x34</title>
<style>
body { background: #1a0a2a; color: #fff; font-family: monospace; padding: 20px; }
.canvas-grid { display: flex; gap: 20px; flex-wrap: wrap; }
.pixel-box { text-align: center; }
.pixel-box h3 { margin: 10px 0; color: #FFD700; }
canvas { border: 2px solid #FFD700; image-rendering: pixelated; }
.original { width: 100px; height: 100px; }
.pixelated { width: 136px; height: 136px; }
button { background: #FFD700; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>
<h2>🎮 Beyblade Pixel Converter (34×34)</h2>
<p>Drop your PNG files below to convert to 34×34 pixel art</p>
<input type="file" id="fileInput" accept="image/png" multiple>
<div id="output" class="canvas-grid"></div>

<script>
const PIXEL_SIZE = 34;

function pixelateImage(img, targetSize = 34) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  
  // Disable smoothing for pixel art
  ctx.imageSmoothingEnabled = false;
  
  canvas.width = targetSize;
  canvas.height = targetSize;
  
  // Draw scaled down with nearest neighbor
  ctx.drawImage(img, 0, 0, targetSize, targetSize);
  
  return canvas;
}

function processFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      createComparisonView(file.name, img);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function createComparisonView(filename, img) {
  const container = document.createElement('div');
  container.className = 'pixel-box';
  
  const name = filename.replace('.png', '');
  
  // Original preview
  const origCanvas = document.createElement('canvas');
  origCanvas.className = 'original';
  origCanvas.width = 100;
  origCanvas.height = 100;
  const origCtx = origCanvas.getContext('2d');
  origCtx.drawImage(img, 0, 0, 100, 100);
  
  // Pixelated version
  const pixelCanvas = pixelateImage(img, PIXEL_SIZE);
  pixelCanvas.className = 'pixelated';
  pixelCanvas.id = `pixel_${name}`;
  
  // Display size for pixel canvas (4x = 136px)
  pixelCanvas.style.width = '136px';
  pixelCanvas.style.height = '136px';
  
  const title = document.createElement('h3');
  title.textContent = name;
  
  const downloadBtn = document.createElement('button');
  downloadBtn.textContent = '💾 Download 34×34 PNG';
  downloadBtn.onclick = () => {
    const link = document.createElement('a');
    link.download = `${name}_34x34.png`;
    link.href = pixelCanvas.toDataURL('image/png');
    link.click();
  };
  
  container.appendChild(title);
  container.appendChild(document.createTextNode('Original → '));
  container.appendChild(origCanvas);
  container.appendChild(pixelCanvas);
  container.appendChild(document.createElement('br'));
  container.appendChild(downloadBtn);
  
  document.getElementById('output').appendChild(container);
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  files.forEach(processFile);
});
</script>
</body>
</html>
